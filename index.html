ْمَئِنُّ الْقُلُوبُ</div></div><p>অর্থ: জেনে রেখো, আল্লাহর স্মরণেই অন্তরসমূহ প্রশান্তি লাভ করে। (সূরা আর-রা'দ, আয়াত: ২৮)</p><div class=\"h hs hs2\">৭। ভ্রান্ত মতবাদ ও কুসংস্কার প্রতিরোধ</div><p>ইসলামী আকিদার সঠিক জ্ঞান মানুষকে ভিত্তিহীন বিশ্বাস, অন্ধ অনুকরণ ও ধর্মীয় বিভ্রান্তি থেকে রক্ষা করে। কুরআন ও সুন্নাহর আলোকে বিশ্বাসের বিষয়গুলো যাচাই করার মাধ্যমে মানুষ সত্য ও মিথ্যার পার্থক্য বুঝতে পারে। এতে ধর্মীয় সচেতনতা বৃদ্ধি পায় এবং সমাজে কুসংস্কারের প্রভাব হ্রাস পায়।</p><div class=\"h hs hs2\">৮। আল্লাহর প্রতি পূর্ণ আনুগত্য প্রতিষ্ঠা</div><p>ইসলামী আকিদা মানুষকে শিক্ষা দেয় যে, আল্লাহই তার প্রকৃত মালিক, সৃষ্টিকর্তা ও বিধানদাতা। তাই ব্যক্তিগত, পারিবারিক, সামাজিক ও অর্থনৈতিক জীবনের প্রতিটি ক্ষেত্রে আল্লাহর আদেশ-নিষেধ মেনে চলা তার কর্তব্য। বিশুদ্ধ আকিদা মানুষের মধ্যে আত্মসমর্পণ ও আনুগত্যের মনোভাব সৃষ্টি করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ</div></div><p>অর্থ: বলুন, নিশ্চয়ই আমার সালাত, আমার কুরবানি, আমার জীবন ও আমার মৃত্যু সবই বিশ্বজগতের প্রতিপালক আল্লাহর জন্য। (সূরা আল-আনআম, আয়াত: ১৬২)</p><div class=\"h hs hs2\">৯। মানবিক সাম্য ও সামাজিক ভ্রাতৃত্ব প্রতিষ্ঠা</div><p>ইসলামী আকিদা মানুষকে শিক্ষা দেয় যে, সমগ্র মানবজাতির সৃষ্টিকর্তা একমাত্র আল্লাহ। তাই জাতি, বর্ণ, ভাষা, গোত্র ও অর্থসম্পদের ভিত্তিতে মানুষের মধ্যে অহংকার ও বৈষম্য করা উচিত নয়। এ বিশ্বাস সমাজে পারস্পরিক সম্মান, সহমর্মিতা, সহযোগিতা ও ভ্রাতৃত্ববোধ প্রতিষ্ঠা করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে তোমাদের মধ্যে অধিক মর্যাদাসম্পন্ন সেই ব্যক্তি, যে অধিক তাকওয়াবান। (সূরা আল-হুজুরাত, আয়াত: ১৩)</p><div class=\"h hs hs2\">১০। পারিবারিক ও সামাজিক শান্তি প্রতিষ্ঠা</div><p>বিশুদ্ধ আকিদা মানুষের মধ্যে ন্যায়পরায়ণতা, সহনশীলতা, দায়িত্ববোধ ও মানবিকতার গুণ সৃষ্টি করে। একজন মুমিন আল্লাহর সন্তুষ্টির উদ্দেশ্যে পিতামাতা, সন্তান, আত্মীয়স্বজন ও প্রতিবেশীর অধিকার আদায় করতে সচেষ্ট হয়। ফলে পারিবারিক কলহ, সামাজিক হিংসা, বিদ্বেষ ও অন্যায় হ্রাস পায় এবং সমাজে শান্তিপূর্ণ পরিবেশ গড়ে ওঠে।</p><div class=\"h hs hs2\">১১। জীবনের প্রকৃত উদ্দেশ্য সম্পর্কে সচেতনতা</div><p>ইসলামী আকিদা মানুষকে তার সৃষ্টির উদ্দেশ্য সম্পর্কে সচেতন করে। মানুষ বুঝতে পারে যে, তার জীবন কেবল পার্থিব ভোগ-বিলাস ও সম্পদ অর্জনের জন্য নয়; বরং আল্লাহর ইবাদত, আনুগত্য ও সন্তুষ্টি অর্জনের জন্য। এ বিশ্বাস তাকে সৎ ও কল্যাণমুখী জীবনযাপনে উৎসাহিত করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ</div></div><p>অর্থ: আমি জিন ও মানুষকে কেবল আমার ইবাদতের জন্যই সৃষ্টি করেছি। (সূরা আয-যারিয়াত, আয়াত: ৫৬)</p><div class=\"h hs hs2\">১২। দুনিয়া ও আখিরাতের সফলতা অর্জন</div><p>ইসলামী আকিদা মানুষের ইহকালীন কল্যাণ ও পরকালীন মুক্তির পথ নির্দেশ করে। বিশুদ্ধ ঈমান, সৎকর্ম ও আল্লাহর আনুগত্যের মাধ্যমে মানুষ দুনিয়ায় শান্তিপূর্ণ জীবনযাপন করতে পারে এবং আখিরাতে আল্লাহর সন্তুষ্টি ও জান্নাত লাভের আশা করতে পারে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً</div></div><p>অর্থ: যে ব্যক্তি মুমিন অবস্থায় সৎকর্ম করবে, সে পুরুষ হোক বা নারী, আমি অবশ্যই তাকে পবিত্র জীবন দান করব। (সূরা আন-নাহল, আয়াত: ৯৭)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ঈমান, আকিদা ও ইলমুল কালাম পরস্পর সম্পর্কিত হলেও এদের প্রকৃতি, উদ্দেশ্য ও আলোচনাপদ্ধতিতে পার্থক্য রয়েছে। ইসলামী আকিদার প্রধান ভিত্তি হলো আল-কুরআন ও সহিহ সুন্নাহ। বিশুদ্ধ আকিদা মানুষের ঈমানকে সুদৃঢ় করে, শিরক ও কুসংস্কার থেকে রক্ষা করে এবং নৈতিক, আধ্যাত্মিক ও সামাজিক জীবনে ইতিবাচক পরিবর্তন আনে। তাই একজন মুসলমানের ইহকালীন কল্যাণ ও পরকালীন মুক্তির জন্য বিশুদ্ধ ইসলামী আকিদা অর্জন এবং সে অনুযায়ী জীবন পরিচালনা করা অত্যন্ত গুরুত্বপূর্ণ।</p>"], ["শিরকের পরিচয় বর্ণনা কর। শিরকের কারণ বর্ণনাপূর্বক সমাজে প্রচলিত বিভিন্ন প্রকারের শিরক সম্পর্কে আলোচনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলামী আকিদার সবচেয়ে গুরুত্বপূর্ণ বিষয় হলো তাওহীদ বা আল্লাহর একত্ববাদে বিশ্বাস স্থাপন করা। তাওহীদের সম্পূর্ণ বিপরীত হলো শিরক। শিরক এমন একটি মারাত্মক পাপ, যার মাধ্যমে মহান আল্লাহর সঙ্গে কাউকে শরিক বা অংশীদার করা হয়। এটি ইসলামের দৃষ্টিতে সবচেয়ে বড় গুনাহ। শিরক মানুষের ঈমান ও আমলকে ধ্বংস করে এবং পরকালীন মুক্তির পথে বড় বাধা সৃষ্টি করে। নিম্নে প্রশ্নের আলোকে শিরকের আভিধানিক ও পারিভাষিক পরিচয় আলোচনা করা হলো।</p><div class=\"h hm\">১ : تَعْرِيفُ الشِّرْكِ (শিরকের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>شِرْك শব্দটি আরবি। এটি أَشْرَكَ يُشْرِكُ إِشْرَاكًا ধাতু থেকে নির্গত। এর মূল ধাতু হলো ش-ر-ك। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْمُشَارَكَةُ — অংশীদারিত্ব করা।</p><p>২। الْمُقَارَنَةُ — কাউকে সমকক্ষ বা সমপর্যায়ের করা।</p><p>৩। الْمُخَالَطَةُ — মিশ্রিত করা।</p><p>৪। الْحِصَّةُ — অংশ বা ভাগ।</p><div class=\"h hs hs2\">৫। الْإِشْرَاكُ — শরিক বা অংশীদার করা।</div><p>ইংরেজি অর্থ: Polytheism, Partnership, Association.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>শিরকের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p>১. ইমাম ইবনে তাইমিয়্যাহ (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الشِّرْكُ هُوَ أَنْ يَجْعَلَ لِلَّهِ نِدًّا فِي الْعِبَادَةِ أَوِ الرُّبُوبِيَّةِ أَوِ الْأَسْمَاءِ وَالصِّفَاتِ</div></div><p>অর্থ: ইবাদত, প্রভুত্ব, নাম ও গুণাবলির ক্ষেত্রে আল্লাহর কোনো সমকক্ষ বা অংশীদার সাব্যস্ত করাকে শিরক বলে।</p><p>২. ইমাম ইবনুল কাইয়্যিম (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الشِّرْكُ هُوَ تَسْوِيَةُ الْمَخْلُوقِ بِالْخَالِقِ فِيمَا يَخْتَصُّ بِهِ اللَّهُ تَعَالَى</div></div><p>অর্থ: যেসব বিষয় একমাত্র মহান আল্লাহর জন্য নির্দিষ্ট, সেসব বিষয়ে কোনো সৃষ্টিকে স্রষ্টার সমকক্ষ মনে করাই শিরক।</p><div class=\"h hm\">শিরকের কারণসমূহ</div><div class=\"h hs hs2\">১। আল্লাহ সম্পর্কে অজ্ঞতা</div><p>শিরকের অন্যতম প্রধান কারণ হলো আল্লাহ তায়ালার পরিচয়, ক্ষমতা, একত্ব ও গুণাবলি সম্পর্কে সঠিক জ্ঞান না থাকা। মানুষ যখন আল্লাহর প্রকৃত পরিচয় উপলব্ধি করতে ব্যর্থ হয়, তখন বিভিন্ন ব্যক্তি, বস্তু ও সৃষ্টির মধ্যে অলৌকিক ক্ষমতা কল্পনা করে এবং তাদের কাছে সাহায্য প্রার্থনা করে। এভাবে অজ্ঞতা মানুষকে শিরকের দিকে পরিচালিত করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ</div></div><p>অর্থ: কিন্তু অধিকাংশ মানুষ জানে না। (সূরা আল-আ'রাফ, আয়াত: ১৮৭)</p><div class=\"h hs hs2\">২। অন্ধ অনুকরণ ও কুসংস্কার</div><p>পূর্বপুরুষদের প্রচলিত বিশ্বাস ও প্রথাকে যাচাই না করে অনুসরণ করা শিরকের অন্যতম কারণ। অনেক মানুষ নিজেদের বাপ-দাদার আমল থেকে চলে আসা বিভিন্ন ধর্মীয় আচারকে সত্য মনে করে পালন করে। অথচ এসব কাজের কোনো ভিত্তি কুরআন ও সুন্নাহতে নেই।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنْزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا</div></div><p>অর্থ: যখন তাদের বলা হয়, আল্লাহ যা অবতীর্ণ করেছেন তা অনুসরণ করো, তখন তারা বলে, বরং আমরা আমাদের পিতৃপুরুষদের যে পথে পেয়েছি, তা-ই অনুসরণ করব। (সূরা আল-বাকারা, আয়াত: ১৭০)</p><div class=\"h hs hs2\">৩। অতিরিক্ত ভক্তি ও ব্যক্তিপূজা</div><p>নবী-রাসুল, পীর-আউলিয়া ও নেককার ব্যক্তিদের প্রতি ভালোবাসা ইসলামে প্রশংসনীয়। কিন্তু তাঁদের প্রতি অতিরিক্ত ভক্তি প্রদর্শন করে আল্লাহর বিশেষ ক্ষমতা ও অধিকার তাঁদের জন্য নির্ধারণ করা শিরকের কারণ হয়ে দাঁড়ায়। কোনো ব্যক্তিকে সর্বজ্ঞ, সর্বক্ষমতাবান কিংবা স্বাধীনভাবে বিপদমুক্ত করার ক্ষমতার অধিকারী মনে করা ইসলামের তাওহীদের পরিপন্থী।</p><div class=\"h hs hs2\">৪। দুনিয়ার প্রতি অতিরিক্ত আসক্তি</div><p>ধন-সম্পদ, ক্ষমতা, পদমর্যাদা ও সামাজিক সম্মানের প্রতি অতিরিক্ত আসক্তি মানুষকে আল্লাহর আনুগত্য থেকে দূরে সরিয়ে দেয়। অনেক সময় মানুষ এসব অর্জনের জন্য আল্লাহর বিধান অমান্য করে এবং অর্থ-সম্পদকে জীবনের সর্বোচ্চ লক্ষ্য বানিয়ে ফেলে। ফলে তার মধ্যে আল্লাহর প্রতি প্রকৃত নির্ভরশীলতা দুর্বল হয়ে যায়।</p><div class=\"h hs hs2\">৫। শয়তানের প্ররোচনা</div><p>শয়তান মানুষকে বিভিন্নভাবে আল্লাহর ইবাদত থেকে দূরে সরিয়ে শিরক ও পাপাচারের দিকে পরিচালিত করে। সে মিথ্যা আশা, ভয়, লোভ ও কুসংস্কারের মাধ্যমে মানুষের মনে ভ্রান্ত বিশ্বাস সৃষ্টি করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الشَّيْطَانَ لَكُمْ عَدُوٌّ فَاتَّخِذُوهُ عَدُوًّا</div></div><p>অর্থ: নিশ্চয়ই শয়তান তোমাদের শত্রু; অতএব তোমরা তাকে শত্রু হিসেবেই গ্রহণ করো। (সূরা ফাতির, আয়াত: ৬)</p><div class=\"h hs hs2\">৬। ধর্মীয় জ্ঞানের অভাব</div><p>কুরআন-সুন্নাহ সম্পর্কে অজ্ঞতা এবং বিশুদ্ধ আকিদার শিক্ষা না থাকা শিরকের অন্যতম কারণ। অনেক মানুষ না বুঝে বিভিন্ন ধর্মীয় অনুষ্ঠান, মানত, তাবিজ-কবচ ও কুসংস্কারমূলক কর্মকাণ্ডে জড়িয়ে পড়ে। ফলে তাদের মধ্যে তাওহীদ ও শিরকের পার্থক্য বোঝার ক্ষমতা দুর্বল হয়ে যায়।</p><div class=\"h hs hs2\">৭। বিপদ-আপদে আল্লাহ ছাড়া অন্যের ওপর অতিরিক্ত নির্ভরশীলতা</div><p>বিপদে পড়লে একমাত্র আল্লাহর কাছে সাহায্য চাওয়া ইসলামের শিক্ষা। কিন্তু কেউ যদি কোনো মৃত ব্যক্তি, পীর, মাজার বা অলৌকিক ক্ষমতাসম্পন্ন বলে বিবেচিত বস্তুর কাছে এমন সাহায্য প্রার্থনা করে, যা কেবল আল্লাহর ক্ষমতার অন্তর্ভুক্ত, তাহলে তা শিরকের অন্তর্ভুক্ত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَدْعُ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُكَ وَلَا يَضُرُّكَ</div></div><p>অর্থ: আল্লাহ ছাড়া এমন কাউকে ডাকবে না, যে তোমার উপকারও করতে পারে না এবং অপকারও করতে পারে না। (সূরা ইউনুস, আয়াত: ১০৬)</p><div class=\"h hm\">সমাজে প্রচলিত বিভিন্ন প্রকারের শিরক</div><div class=\"h hs hs2\">১। শিরক ফিদ্-দু'আ বা প্রার্থনায় শিরক</div><p>আল্লাহ ছাড়া অন্য কারও কাছে এমনভাবে দোয়া বা প্রার্থনা করা, যা কেবল আল্লাহর কাছে করা উচিত, তাকে শিরক ফিদ্-দু'আ বলে। সমাজে অনেক মানুষ বিপদ-আপদ, রোগমুক্তি, সন্তান লাভ কিংবা অভাব দূর করার জন্য মৃত ব্যক্তি, মাজার বা কাল্পনিক অলৌকিক শক্তির কাছে প্রার্থনা করে। অথচ প্রকৃত সাহায্যকারী একমাত্র আল্লাহ।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا</div></div><p>অর্থ: সুতরাং তোমরা আল্লাহর সঙ্গে অন্য কাউকে ডাকবে না। (সূরা আল-জিন, আয়াত: ১৮)</p><div class=\"h hs hs2\">২। শিরক ফিল-ইবাদাহ বা ইবাদতে শিরক</div><p>আল্লাহর জন্য নির্ধারিত কোনো ইবাদত অন্য কারও উদ্দেশ্যে সম্পাদন করাকে ইবাদতে শিরক বলে। যেমন—আল্লাহ ছাড়া অন্য কারও উদ্দেশ্যে সিজদা করা, ইবাদতমূলক কুরবানি দেওয়া, মানত করা কিংবা উপাসনা করা। এসব কাজ তাওহীদের পরিপন্থী।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</div></div><p>অর্থ: আমরা একমাত্র তোমারই ইবাদত করি এবং একমাত্র তোমারই সাহায্য প্রার্থনা করি। (সূরা আল-ফাতিহা, আয়াত: ৫)</p><div class=\"h hs hs2\">৩। শিরক ফির-রুবুবিয়্যাহ বা প্রভুত্বে শিরক</div><p>আল্লাহ তায়ালার সৃষ্টিকর্তা, পালনকর্তা, রিজিকদাতা ও বিশ্বজগতের নিয়ন্ত্রণকারী হওয়ার ক্ষেত্রে অন্য কাউকে অংশীদার মনে করাকে শিরক ফির-রুবুবিয়্যাহ বলে। যেমন—কেউ যদি বিশ্বাস করে যে, আল্লাহ ছাড়া অন্য কোনো সত্তা স্বাধীনভাবে বিশ্বজগত পরিচালনা করে, বৃষ্টি বর্ষণ করে কিংবা মানুষের ভাগ্য নির্ধারণ করে, তাহলে তা শিরক।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اللَّهُ خَالِقُ كُلِّ شَيْءٍ</div></div><p>অর্থ: আল্লাহ সবকিছুর সৃষ্টিকর্তা। (সূরা আয-যুমার, আয়াত: ৬২)</p><div class=\"h hs hs2\">৪। শিরক ফিল-আসমা ওয়াস-সিফাত বা নাম ও গুণাবলিতে শিরক</div><p>আল্লাহ তায়ালার বিশেষ নাম ও গুণাবলিতে অন্য কাউকে তাঁর সমকক্ষ মনে করাকে শিরক ফিল-আসমা ওয়াস-সিফাত বলে। যেমন—কোনো সৃষ্টিকে আল্লাহর মতো সর্বজ্ঞ, সর্বশক্তিমান, সর্বত্র বিরাজমান কিংবা অদৃশ্যের পূর্ণ জ্ঞানসম্পন্ন মনে করা।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ</div></div><p>অর্থ: আর তাঁর সমতুল্য কেউ নেই। (সূরা আল-ইখলাস, আয়াত: ৪)</p><div class=\"h hs hs2\">৫। শিরক ফির-রিয়া বা লোকদেখানো ইবাদত</div><p>মানুষকে দেখানো, প্রশংসা অর্জন কিংবা সামাজিক মর্যাদা লাভের উদ্দেশ্যে ইবাদত করাকে রিয়া বলে। এটি ছোট শিরকের অন্তর্ভুক্ত। সমাজে অনেক মানুষ মানুষের প্রশংসা পাওয়ার জন্য সালাত, দান-সদকা ও ধর্মীয় কার্যক্রম পরিচালনা করে। অথচ ইবাদতের মূল উদ্দেশ্য হওয়া উচিত একমাত্র আল্লাহর সন্তুষ্টি অর্জন।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ أَخْوَفَ مَا أَخَافُ عَلَيْكُمُ الشِّرْكُ الْأَصْغَرُ</div></div><p>অর্থ: তোমাদের ব্যাপারে আমি যে বিষয়টিকে সবচেয়ে বেশি ভয় করি, তা হলো ছোট শিরক। (মুসনাদে আহমাদ)</p><div class=\"h hs hs2\">৬। শিরক ফিত্-তিয়ারা বা কুলক্ষণে বিশ্বাস</div><p>কোনো ব্যক্তি, প্রাণী, দিন, সংখ্যা বা ঘটনাকে অশুভ মনে করে তার কারণে বিপদ ঘটবে বলে বিশ্বাস করাকে তিয়ারা বা কুলক্ষণে বিশ্বাস বলে। সমাজে অনেক মানুষ কালো বিড়াল, পেঁচা, নির্দিষ্ট দিন বা বিশেষ ঘটনার কারণে অমঙ্গল হবে বলে ধারণা করে। ইসলামে এ ধরনের কুসংস্কার নিষিদ্ধ।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا طِيَرَةَ</div></div><p>অর্থ: কুলক্ষণ বলে কিছু নেই। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class=\"h hs hs2\">৭। তাবিজ-কবচ ও জাদুটোনার ওপর ভ্রান্ত বিশ্বাস</div><p>সমাজে অনেক মানুষ তাবিজ-কবচ, ঝাড়ফুঁক, জাদুটোনা ও বিভিন্ন বস্তুতে স্বাধীনভাবে বিপদ দূর করার ক্ষমতা রয়েছে বলে বিশ্বাস করে। এসব বস্তুকে আল্লাহর ক্ষমতার সমকক্ষ মনে করা শিরক। তবে কুরআন-সুন্নাহসম্মত রুকইয়া বা বৈধ ঝাড়ফুঁক ইসলামে অনুমোদিত।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الرُّقَى وَالتَّمَائِمَ وَالتِّوَلَةَ شِرْكٌ</div></div><p>অর্থ: নিশ্চয়ই (শিরকপূর্ণ) ঝাড়ফুঁক, তাবিজ এবং তিওয়ালাহ শিরক। (সুনান আবু দাউদ)</p><div class=\"h hs hs2\">৮। মাজার ও কবরকেন্দ্রিক শিরক</div><p>সমাজের কিছু মানুষ মাজার বা কবরকে কেন্দ্র করে এমন কিছু কর্মকাণ্ডে লিপ্ত হয়, যা তাওহীদের পরিপন্থী। যেমন—মৃত ব্যক্তির কাছে সন্তান চাওয়া, রোগমুক্তি প্রার্থনা করা, সিজদা করা কিংবা তার উদ্দেশ্যে ইবাদতমূলক মানত ও কুরবানি করা। কবর জিয়ারত ও মৃত ব্যক্তির জন্য দোয়া করা বৈধ; কিন্তু মৃত ব্যক্তির কাছে ইবাদতমূলক সাহায্য প্রার্থনা করা বৈধ নয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا</div></div><p>অর্থ: নিশ্চয়ই মসজিদসমূহ আল্লাহর জন্য; সুতরাং তোমরা আল্লাহর সঙ্গে অন্য কাউকে ডাকবে না। (সূরা আল-জিন, আয়াত: ১৮)</p><div class=\"h hs hs2\">৯। জ্যোতিষ ও গণকের ওপর বিশ্বাস</div><p>ভবিষ্যৎ সম্পর্কে নিশ্চিত জ্ঞান, মানুষের ভাগ্য, মৃত্যু, রিজিক ও অদৃশ্য বিষয় সম্পর্কে কোনো গণক বা জ্যোতিষীর স্বাধীন জ্ঞান রয়েছে বলে বিশ্বাস করা শিরকের কারণ হতে পারে। সমাজে অনেক মানুষ হাত দেখা, রাশিফল, জন্মকুণ্ডলী ও ভাগ্য গণনার মাধ্যমে ভবিষ্যৎ জানার চেষ্টা করে। অথচ অদৃশ্যের প্রকৃত জ্ঞান একমাত্র আল্লাহর কাছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ لَا يَعْلَمُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ</div></div><p>অর্থ: বলুন, আকাশমণ্ডলী ও পৃথিবীতে আল্লাহ ছাড়া কেউ অদৃশ্যের জ্ঞান রাখে না। (সূরা আন-নামল, আয়াত: ৬৫)</p><div class=\"h hs hs2\">১০। আল্লাহ ছাড়া অন্যের নামে কসম করা</div><p>আল্লাহ ছাড়া অন্য কোনো ব্যক্তি, বস্তু, পীর, নবী বা কবরের নামে কসম করাকে হাদিসে শিরকের অন্তর্ভুক্ত বলা হয়েছে। সমাজে অনেক মানুষ বিভিন্ন ব্যক্তির নাম, সন্তানের জীবন কিংবা অন্য কোনো সৃষ্টির নামে কসম করে। মুসলমানের উচিত কসম করার ক্ষেত্রে একমাত্র আল্লাহর নাম ব্যবহার করা।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ حَلَفَ بِغَيْرِ اللَّهِ فَقَدْ أَشْرَكَ</div></div><p>অর্থ: যে ব্যক্তি আল্লাহ ছাড়া অন্যের নামে কসম করল, সে শিরক করল। (সুনান আবু দাউদ)</p><div class=\"h hs hs2\">১১। আল্লাহ ছাড়া অন্যের ওপর চূড়ান্ত নির্ভরতা</div><p>মানুষ নিজের সাধ্যের মধ্যে অন্যের সাহায্য গ্রহণ করতে পারে। কিন্তু কোনো ব্যক্তি বা বস্তুকে আল্লাহর পরিবর্তে স্বাধীনভাবে উপকার-অপকার করার ক্ষমতার অধিকারী মনে করা শিরকের অন্তর্ভুক্ত। সমাজে অনেক মানুষ পীর, দরবেশ, তাবিজ বা বিশেষ বস্তুর ওপর এমনভাবে নির্ভর করে যে, আল্লাহর ক্ষমতাকে উপেক্ষা করে ফেলে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَعَلَى اللَّهِ فَتَوَكَّلُوا إِنْ كُنْتُمْ مُؤْمِنِينَ</div></div><p>অর্থ: তোমরা যদি মুমিন হও, তবে আল্লাহর ওপরই ভরসা করো। (সূরা আল-মায়িদা, আয়াত: ২৩)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, শিরক মানুষের ঈমান ও আকিদাকে ধ্বংসকারী সবচেয়ে ভয়াবহ অপরাধ। অজ্ঞতা, কুসংস্কার, অন্ধ অনুকরণ, অতিরিক্ত ব্যক্তিপূজা ও শয়তানের প্ররোচনার কারণে সমাজে বিভিন্ন ধরনের শিরকের বিস্তার ঘটে। তাই শিরক থেকে বেঁচে থাকার জন্য কুরআন ও সুন্নাহর বিশুদ্ধ জ্ঞান অর্জন, তাওহীদের শিক্ষা বাস্তবায়ন এবং সকল প্রকার কুসংস্কার পরিহার করা অপরিহার্য। আল্লাহ তায়ালা আমাদের সবাইকে শিরকমুক্ত বিশুদ্ধ ঈমান ও আকিদার ওপর জীবন পরিচালনার তাওফিক দান করুন। আমিন।</p>"], ["আল্লাহ তায়ালার বাণী إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ এর বিস্তারিত ব্যাখ্যা কর।", "<div class=\"h hm\">ভূমিকা</div><p>ইসলামের মূল ভিত্তি হলো তাওহীদ বা আল্লাহর একত্ববাদ। মহান আল্লাহ এক ও অদ্বিতীয়। তিনি সমগ্র বিশ্বজগতের সৃষ্টিকর্তা, পালনকর্তা ও একমাত্র ইবাদতের অধিকারী। তাঁর সঙ্গে কাউকে শরিক করা ইসলামের দৃষ্টিতে সবচেয়ে বড় অপরাধ। শিরক মানুষের ঈমান, আমল, নৈতিকতা ও পরকালীন মুক্তির জন্য মারাত্মক হুমকিস্বরূপ। এ কারণেই মহান আল্লাহ পবিত্র কুরআনে শিরককে মহা জুলুম হিসেবে ঘোষণা করেছেন। হজরত লুকমান (আ.) তাঁর পুত্রকে উপদেশ দেওয়ার সময় শিরক থেকে বিরত থাকার নির্দেশ দিয়ে এর ভয়াবহতা তুলে ধরেছেন।</p><div class=\"h hm\">আল্লাহ তাআলার বাণী</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ</div></div><p>অর্থ: নিশ্চয়ই শিরক হচ্ছে মহা জুলুম। (সূরা লুকমান: ১৩)</p><div class=\"h hm\">আয়াতের বিস্তারিত ব্যাখ্যা ও তাৎপর্য</div><div class=\"h hs hs2\">১। শিরকের পরিচয় ও প্রকৃতি</div><p>শিরক শব্দের আভিধানিক অর্থ অংশীদার স্থাপন করা, কাউকে শরিক করা বা সমকক্ষ মনে করা। ইসলামী পরিভাষায় আল্লাহর সত্তা, গুণাবলি, ক্ষমতা ও ইবাদতের ক্ষেত্রে কাউকে তাঁর অংশীদার বা সমকক্ষ মনে করাকে শিরক বলে। অর্থাৎ আল্লাহর যে অধিকার একান্তভাবে তাঁর জন্য নির্ধারিত, তা অন্য কাউকে প্রদান করাই শিরকের মূল পরিচয়। যেমন—আল্লাহ ছাড়া অন্য কারও ইবাদত করা, অন্য কাউকে আল্লাহর মতো সর্বক্ষমতাবান মনে করা কিংবা আল্লাহর বিশেষ গুণাবলি অন্য কারও জন্য স্বতন্ত্রভাবে সাব্যস্ত করা।</p><p>শিরক তাওহীদের সম্পূর্ণ বিপরীত। তাওহীদ মানুষকে এক আল্লাহর প্রতি বিশ্বাস ও আনুগত্যের শিক্ষা দেয়, আর শিরক মানুষকে আল্লাহর সঙ্গে অন্যকে অংশীদার করার দিকে পরিচালিত করে।</p><div class=\"h hs hs2\">২। শিরককে মহা জুলুম বলার কারণ</div><p>জুলুম শব্দের অর্থ অন্যায় করা, অধিকার হরণ করা এবং কোনো কিছুকে তার যথাযথ স্থান থেকে সরিয়ে দেওয়া। মহান আল্লাহই সমগ্র সৃষ্টিজগতের স্রষ্টা ও প্রকৃত মালিক। ইবাদত পাওয়ার অধিকার একমাত্র তাঁরই। কিন্তু কোনো মানুষ যখন আল্লাহর ইবাদতের অধিকার অন্য কাউকে প্রদান করে, তখন সে প্রকৃত অধিকারীকে তাঁর অধিকার থেকে বঞ্চিত করে।</p><p>এ কারণে শিরককে মহা জুলুম বলা হয়েছে। কারণ এটি সৃষ্টিকর্তার অধিকার সৃষ্টির জন্য নির্ধারণ করার মতো চরম অন্যায়। অন্য কোনো পাপের মাধ্যমে মানুষ সাধারণত নিজের বা অন্য মানুষের অধিকার নষ্ট করে; কিন্তু শিরকের মাধ্যমে মানুষ সরাসরি মহান স্রষ্টার একক ইবাদতের অধিকারকে অস্বীকার করে।</p><div class=\"h hs hs2\">৩। আল্লাহর একত্বের অধিকার লঙ্ঘন</div><p>মহান আল্লাহ এক ও অদ্বিতীয়। তাঁর কোনো অংশীদার, সমকক্ষ বা সমতুল্য নেই। তিনি একাই সৃষ্টিকর্তা, রিজিকদাতা ও বিশ্বজগতের নিয়ন্ত্রক। তাই ইবাদত, দোয়া, সিজদা, মানত ও কুরবানির মতো ইবাদত একমাত্র তাঁর জন্যই নির্ধারিত।</p><p class=\"bh\"><b>কিন্তু মানুষ যখন আল্লাহর পাশাপাশি অন্য কাউকে ইবাদতের যোগ্য মনে করে, তখন সে আল্লাহর একত্বের অধিকার লঙ্ঘন করে। অথচ মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَاعْبُدِ اللَّهَ مُخْلِصًا لَهُ الدِّينَ</div></div><p>অর্থ: অতএব, তুমি একনিষ্ঠভাবে আল্লাহর ইবাদত করো। (সূরা আয-যুমার: ২)</p><p>এ আয়াত থেকে প্রমাণিত হয় যে, ইবাদত একমাত্র আল্লাহর জন্য নির্দিষ্ট রাখতে হবে। অন্য কাউকে ইবাদতের অংশীদার করা শিরক।</p><div class=\"h hs hs2\">৪। সৃষ্টিকর্তা ও সৃষ্টির মধ্যে পার্থক্য নষ্ট করা</div><p>আল্লাহ হলেন সৃষ্টিকর্তা, আর সমগ্র বিশ্বজগত তাঁর সৃষ্টি। কোনো মানুষ, ফেরেশতা, নবী-রাসূল কিংবা অন্য কোনো সৃষ্টি আল্লাহর সমকক্ষ হতে পারে না। সৃষ্টির প্রত্যেকেই আল্লাহর মুখাপেক্ষী, কিন্তু আল্লাহ কারও মুখাপেক্ষী নন।</p><p>শিরকের মাধ্যমে মানুষ অনেক সময় সৃষ্টিকে স্রষ্টার মর্যাদায় উন্নীত করে। কোনো সৃষ্টিকে আল্লাহর মতো ক্ষমতাবান, সর্বজ্ঞ বা সর্বত্র উপস্থিত মনে করা এ ধরনের ভ্রান্ত বিশ্বাসের উদাহরণ। এর ফলে সৃষ্টিকর্তা ও সৃষ্টির মধ্যকার মৌলিক পার্থক্য নষ্ট হয়। তাই শিরককে মহা জুলুম বলা হয়েছে।</p><div class=\"h hs hs2\">৫। আল্লাহর প্রতি অকৃতজ্ঞতা প্রকাশ</div><p>মানুষের জীবন, জীবিকা, সুস্থতা, নিরাপত্তা, পরিবার, সম্পদ ও যাবতীয় নিয়ামত মহান আল্লাহর পক্ষ থেকে আসে। তিনিই মানুষকে সৃষ্টি করেছেন, লালন-পালন করছেন এবং জীবনধারণের প্রয়োজনীয় উপকরণ দান করছেন।</p><p>অথচ মানুষ যখন আল্লাহর পরিবর্তে অন্য কাউকে উপাস্য মনে করে কিংবা আল্লাহর বিশেষ ক্ষমতা অন্য কারও জন্য সাব্যস্ত করে, তখন সে প্রকৃত অনুগ্রহকারীর প্রতি অকৃতজ্ঞতা প্রকাশ করে। যে সত্তা মানুষকে সৃষ্টি করেছেন, তাঁর পরিবর্তে সৃষ্টির কাছে ইবাদত করা চরম অকৃতজ্ঞতা ও অন্যায়।</p><div class=\"h hs hs2\">৬। শিরক সবচেয়ে বড় গুনাহ</div><p>ইসলামে বিভিন্ন ধরনের গুনাহ রয়েছে। কিন্তু শিরক হলো সবচেয়ে বড় গুনাহ। কারণ এর মাধ্যমে আল্লাহর একক অধিকার অস্বীকার করা হয়। হজরত আবদুল্লাহ ইবনে মাসউদ (রা.) থেকে বর্ণিত, তিনি রাসূলুল্লাহ (সা.)-কে জিজ্ঞাসা করেছিলেন, আল্লাহর কাছে সবচেয়ে বড় গুনাহ কোনটি? রাসূলুল্লাহ (সা.) বললেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَنْ تَجْعَلَ لِلَّهِ نِدًّا وَهُوَ خَلَقَكَ</div></div><p>অর্থ: তুমি আল্লাহর জন্য সমকক্ষ নির্ধারণ করবে, অথচ তিনিই তোমাকে সৃষ্টি করেছেন। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>এ হাদিস থেকে স্পষ্টভাবে প্রমাণিত হয় যে, আল্লাহর সঙ্গে কাউকে শরিক করা সবচেয়ে বড় গুনাহ। কারণ মানুষ যার সৃষ্টি, তার সঙ্গেই অন্যকে অংশীদার করে।</p><div class=\"h hs hs2\">৭। শিরক মানুষের ঈমান ও আমল ধ্বংস করে</div><p class=\"bh\"><b>শিরক মানুষের ঈমানের জন্য অত্যন্ত ভয়াবহ। একজন মুমিনের সব আমলের ভিত্তি হলো বিশুদ্ধ আকিদা ও তাওহীদ। কিন্তু কেউ যদি আল্লাহর সঙ্গে শিরক করে, তাহলে তার ঈমান মারাত্মকভাবে ক্ষতিগ্রস্ত হয়। পবিত্র কুরআনে মহান আল্লাহ নবী-রাসূলদের উদ্দেশ্য করে বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ وَلَتَكُونَنَّ مِنَ الْخَاسِرِينَ</div></div><p>অর্থ: যদি তুমি শিরক করো, তবে অবশ্যই তোমার আমল নিষ্ফল হয়ে যাবে এবং তুমি ক্ষতিগ্রস্তদের অন্তর্ভুক্ত হবে। (সূরা আয-যুমার: ৬৫)</p><p>এ আয়াত থেকে শিরকের ভয়াবহতা বোঝা যায়। শিরক মানুষের আমলকে ধ্বংসের দিকে নিয়ে যায়। তাই প্রত্যেক মুসলমানের উচিত নিজের আকিদা বিশুদ্ধ রাখা এবং সব ধরনের শিরক থেকে বেঁচে থাকা।</p><div class=\"h hs hs2\">৮। শিরক ক্ষমার অযোগ্য অপরাধ</div><p class=\"bh\"><b>মহান আল্লাহ অত্যন্ত ক্ষমাশীল ও দয়ালু। তিনি বান্দার বিভিন্ন পাপ ক্ষমা করে থাকেন। কিন্তু কোনো ব্যক্তি যদি শিরক অবস্থায় তওবা না করে মৃত্যুবরণ করে, তাহলে তার জন্য শিরক ক্ষমা করা হবে না। এ সম্পর্কে মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ لَا يَغْفِرُ أَنْ يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَنْ يَشَاءُ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ তাঁর সঙ্গে শিরক করাকে ক্ষমা করেন না। এ ছাড়া অন্যান্য পাপ যাকে ইচ্ছা ক্ষমা করেন। (সূরা আন-নিসা: ৪৮)</p><p>এ আয়াতের মাধ্যমে শিরকের ভয়াবহ পরিণতি সম্পর্কে সতর্ক করা হয়েছে। তবে জীবিত অবস্থায় কোনো ব্যক্তি আন্তরিকভাবে শিরক থেকে তওবা করলে আল্লাহ তাআলা তার তওবা কবুল করেন।</p><div class=\"h hs hs2\">৯। শিরক জান্নাত থেকে বঞ্চিত হওয়ার কারণ</div><p class=\"bh\"><b>মানুষের জীবনের চূড়ান্ত লক্ষ্য হলো মহান আল্লাহর সন্তুষ্টি অর্জন এবং পরকালে জান্নাত লাভ করা। কিন্তু শিরক মানুষের এ লক্ষ্যকে ধ্বংস করে দেয়। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّهُ مَنْ يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّارُ</div></div><p>অর্থ: নিশ্চয়ই যে ব্যক্তি আল্লাহর সঙ্গে শিরক করে, আল্লাহ তার জন্য জান্নাত হারাম করে দিয়েছেন এবং তার ঠিকানা হবে জাহান্নাম। (সূরা আল-মায়িদাহ: ৭২)</p><p>এ আয়াত থেকে বোঝা যায়, শিরক মানুষের পরকালীন মুক্তির পথে সবচেয়ে বড় বাধা। তাই একজন মুমিনের জন্য শিরকমুক্ত জীবন গঠন করা অপরিহার্য।</p><p>১০। শিরক মানুষের মধ্যে কুসংস্কার ও ভ্রান্ত বিশ্বাস সৃষ্টি করে</p><p>শিরক মানুষের চিন্তাভাবনা ও বিশ্বাসকে কলুষিত করে। মানুষ যখন আল্লাহর পরিবর্তে বিভিন্ন বস্তু, ব্যক্তি বা কাল্পনিক শক্তির ওপর অলৌকিক ক্ষমতা আরোপ করে, তখন তার মধ্যে কুসংস্কার জন্ম নেয়। যেমন—কোনো বস্তু নিজ ক্ষমতায় বিপদ দূর করতে পারে বলে বিশ্বাস করা, গণকের কথাকে অদৃশ্য জ্ঞানের নির্ভুল উৎস মনে করা কিংবা কোনো সৃষ্টিকে আল্লাহর মতো সর্বক্ষমতাবান মনে করা।</p><p>এসব বিশ্বাস মানুষকে প্রকৃত তাওহীদের শিক্ষা থেকে দূরে সরিয়ে দেয়। ফলে মানুষ আল্লাহর ওপর নির্ভরশীল হওয়ার পরিবর্তে বিভিন্ন ভিত্তিহীন বিশ্বাসের ওপর নির্ভরশীল হয়ে পড়ে।</p><div class=\"h hs hs2\">১১। শিরক মানুষের আত্মমর্যাদা ও স্বাধীনতা নষ্ট করে</div><p>তাওহীদ মানুষকে শিক্ষা দেয় যে, একমাত্র আল্লাহর কাছেই ইবাদত ও চূড়ান্ত আনুগত্য করতে হবে। ফলে একজন মুমিন আল্লাহ ছাড়া অন্য কারও সামনে ইবাদতমূলকভাবে মাথা নত করে না। সে বিশ্বাস করে, লাভ-ক্ষতি ও জীবন-মৃত্যুর চূড়ান্ত নিয়ন্ত্রণ মহান আল্লাহর হাতে।</p><p>অন্যদিকে শিরক মানুষকে বিভিন্ন ব্যক্তি, বস্তু ও কাল্পনিক শক্তির ওপর অযৌক্তিকভাবে নির্ভরশীল করে তোলে। এতে মানুষের আত্মমর্যাদা, সাহস ও মানসিক স্বাধীনতা ক্ষতিগ্রস্ত হয়। তাওহীদ মানুষকে প্রকৃত স্বাধীনতা ও আত্মমর্যাদার শিক্ষা দেয়।</p><div class=\"h hs hs2\">১২। শিরক সমাজের নৈতিক ও ধর্মীয় পরিবেশ নষ্ট করে</div><p>শিরক শুধু ব্যক্তির আকিদার ক্ষতি করে না; বরং সমাজের ধর্মীয় ও নৈতিক পরিবেশকেও ক্ষতিগ্রস্ত করে। যখন সমাজে বিভিন্ন ধরনের কুসংস্কার, ভ্রান্ত উপাসনা ও অলৌকিক ক্ষমতার নামে প্রতারণা ছড়িয়ে পড়ে, তখন সাধারণ মানুষ প্রকৃত ইসলামী শিক্ষা থেকে দূরে সরে যায়।</p><p>অনেক সময় ধর্মের নামে মানুষকে ভয় দেখিয়ে অর্থ আদায় করা হয় এবং বিভিন্ন ভিত্তিহীন বিশ্বাসের দিকে পরিচালিত করা হয়। ফলে সমাজে অজ্ঞতা, প্রতারণা ও বিভ্রান্তি বৃদ্ধি পায়। তাই শিরকমুক্ত সমাজ প্রতিষ্ঠার জন্য বিশুদ্ধ তাওহীদের শিক্ষা প্রচার করা জরুরি।</p><div class=\"h hs hs2\">১৩। শিরক থেকে বেঁচে থাকার জন্য তাওহীদের জ্ঞান অর্জন</div><p>শিরক থেকে মুক্ত থাকার প্রথম উপায় হলো তাওহীদের সঠিক জ্ঞান অর্জন করা। পবিত্র কুরআন ও সহিহ সুন্নাহর আলোকে আল্লাহর একত্ব, তাঁর গুণাবলি এবং ইবাদতের প্রকৃত অর্থ জানতে হবে। কোন কাজ ইবাদত এবং কোন বিশ্বাস শিরকের অন্তর্ভুক্ত—সে বিষয়ে পরিষ্কার ধারণা রাখতে হবে।</p><p>এ ছাড়া কুসংস্কার, ভাগ্য গণনা, শিরকযুক্ত তাবিজ-কবচ এবং ভ্রান্ত উপাসনা থেকে দূরে থাকতে হবে। তবে কোনো জীবিত মানুষের কাছে স্বাভাবিক সাহায্য চাওয়া কিংবা কুরআন-সুন্নাহসম্মত বৈধ চিকিৎসা গ্রহণ করাকে শিরক মনে করা যাবে না। ইসলামের সঠিক জ্ঞান অর্জনের মাধ্যমেই শিরক ও বৈধ কাজের মধ্যে পার্থক্য নির্ণয় করা সম্ভব।</p><div class=\"h hs hs2\">১৪। শিরকমুক্ত জীবনের জন্য আল্লাহর কাছে দোয়া ও তওবা করা</div><p>মানুষের পক্ষে নিজের ঈমান ও আমলকে বিশুদ্ধ রাখা অত্যন্ত গুরুত্বপূর্ণ। তাই প্রত্যেক মুসলমানের উচিত নিয়মিত আল্লাহর কাছে দোয়া করা, নিজের ভুলত্রুটির জন্য ক্ষমা চাওয়া এবং শিরক থেকে বেঁচে থাকার চেষ্টা করা।</p><p>রাসূলুল্লাহ (সা.) শিরক থেকে বেঁচে থাকার জন্য একটি গুরুত্বপূর্ণ দোয়া শিক্ষা দিয়েছেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لَا أَعْلَمُ</div></div><p>অর্থ: হে আল্লাহ! জেনে-শুনে আপনার সঙ্গে শিরক করা থেকে আমি আপনার আশ্রয় প্রার্থনা করছি এবং অজান্তে যে শিরক হয়ে যায়, তার জন্য আপনার কাছে ক্ষমা প্রার্থনা করছি।</p><p>এ দোয়ার মাধ্যমে একজন মুমিন নিজের ঈমানকে শিরকমুক্ত রাখার জন্য আল্লাহর সাহায্য কামনা করে।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, মহান আল্লাহর বাণী—إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ—এর মাধ্যমে শিরকের ভয়াবহতা ও জঘন্যতা সুস্পষ্টভাবে প্রকাশ পেয়েছে। শিরক এমন এক মহাপাপ, যার মাধ্যমে আল্লাহর একক অধিকার অন্যের জন্য নির্ধারণ করা হয়। এটি মানুষের ঈমান ও আমলকে ধ্বংস করে এবং পরকালীন মুক্তির পথে বাধা সৃষ্টি করে। তাই প্রত্যেক মুসলমানের দায়িত্ব হলো তাওহীদের বিশুদ্ধ আকিদা ধারণ করা, শিরক ও কুসংস্কার থেকে নিজেকে রক্ষা করা এবং জীবনের প্রতিটি ক্ষেত্রে একমাত্র মহান আল্লাহর ইবাদত ও আনুগত্য করা। তাহলেই মানুষ দুনিয়া ও আখিরাতে প্রকৃত সফলতা অর্জন করতে পারবে।</p>"], ["হুকুমসহ সালাতের ফরজ, ওয়াজিব, সুন্নত ও মুস্তাহাবসমূহ লেখ।", "<div class=\"h hm\">ভূমিকা</div><p>সালাত ইসলামের পাঁচটি স্তম্ভের অন্যতম এবং ঈমানের পর সর্বাধিক গুরুত্বপূর্ণ ইবাদত। দৈনিক পাঁচ ওয়াক্ত সালাত প্রত্যেক প্রাপ্তবয়স্ক, সুস্থ মস্তিষ্কসম্পন্ন মুসলমানের ওপর ফরজ। সালাতের মাধ্যমে বান্দা মহান আল্লাহর নৈকট্য অর্জন করে এবং যাবতীয় অশ্লীলতা ও অন্যায় কাজ থেকে বিরত থাকার শিক্ষা লাভ করে। সালাত শুদ্ধভাবে আদায়ের জন্য এর ফরজ, ওয়াজিব, সুন্নত ও মুস্তাহাব সম্পর্কে সঠিক জ্ঞান থাকা প্রয়োজন। এসব বিধানের কিছু বিষয়ে মাজহাবগুলোর মধ্যে মতপার্থক্য রয়েছে। বিশেষ করে হানাফি মাজহাবে ফরজ ও ওয়াজিবের মধ্যে পার্থক্য করা হয়; অন্য তিন সুন্নি মাজহাবে সাধারণত এ দুটিকে একই অর্থে ব্যবহার করা হয়।</p><div class=\"h hm\">সালাতের বিধানগত শ্রেণিবিভাগ</div><div class=\"h hs hs2\">১। সালাতের ফরজ ও তার হুকুম</div><p>ফরজ হলো শরিয়তের এমন অপরিহার্য বিধান, যা অকাট্য দলিল দ্বারা প্রমাণিত। সালাতের কোনো ফরজ ছুটে গেলে সালাত শুদ্ধ হয় না। ভুলবশত ছুটে গেলেও শুধু সাহু সিজদার মাধ্যমে তা পূরণ করা যায় না; বরং তা যথাযথভাবে আদায় করতে হয়। আর ইচ্ছাকৃতভাবে ফরজ অস্বীকার করা অত্যন্ত গুরুতর অপরাধ।</p><p>হানাফি মাজহাব অনুযায়ী সালাতের ফরজ সাধারণভাবে দুই ভাগে বিভক্ত—</p><div class=\"h hs hs2\">ক. সালাতের পূর্ববর্তী ফরজ বা শর্ত</div><div class=\"h hs hs2\">খ. সালাতের অভ্যন্তরীণ ফরজ বা রুকন।</div><div class=\"h hs hs2\">২। সালাতের পূর্ববর্তী ফরজ বা শর্তসমূহ</div><p>সালাত আদায়ের আগে সাতটি বিষয় পূর্ণ হওয়া আবশ্যক—</p><div class=\"h hs hs2\">ক. শরীর পবিত্র হওয়া</div><p>সালাত আদায়কারীর শরীর হাদাসে আসগর ও হাদাসে আকবার থেকে পবিত্র হতে হবে। অজু বা প্রয়োজন অনুযায়ী গোসল করতে হবে।</p><p class=\"bh\"><b>দলিল: মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ</div></div><p>অর্থ: হে মুমিনগণ! যখন তোমরা সালাতের জন্য দাঁড়াতে চাও, তখন তোমাদের মুখমণ্ডল ও হাত কনুই পর্যন্ত ধৌত করো। (সূরা আল-মায়িদাহ: ৬)</p><div class=\"h hs hs2\">খ. কাপড় পবিত্র হওয়া</div><p>সালাত আদায়কারীর পরিধেয় কাপড় নাপাক বস্তু থেকে পবিত্র হতে হবে। নাপাক কাপড়ে সালাত আদায় করলে শরিয়তের নির্ধারিত সীমা অতিক্রমের ক্ষেত্রে সালাত শুদ্ধ হবে না।</p><div class=\"h hs hs2\">গ. সালাতের স্থান পবিত্র হওয়া</div><p>যে স্থানে সালাত আদায় করা হবে, সেই স্থান নাপাকি থেকে পবিত্র হতে হবে।</p><div class=\"h hs hs2\">ঘ. সতর ঢাকা</div><p>সালাত আদায়ের সময় শরীরের নির্ধারিত অংশ ঢেকে রাখা ফরজ। পুরুষের নাভি থেকে হাঁটুসহ অংশ এবং নারীর মুখমণ্ডল ও হাতের কবজি ছাড়া সমগ্র শরীর ঢেকে রাখার বিধান রয়েছে। এ বিষয়ে মাজহাবভেদে কিছু বিস্তারিত মতপার্থক্য আছে।</p><div class=\"h hs hs2\">ঙ. কিবলামুখী হওয়া</div><p class=\"bh\"><b>সালাত আদায়ের সময় কাবা শরিফের দিকে মুখ করে দাঁড়াতে হবে। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ</div></div><p>অর্থ: অতএব, আপনি আপনার মুখমণ্ডল মসজিদুল হারামের দিকে ফিরিয়ে নিন। (সূরা আল-বাকারা: ১৪৪)</p><div class=\"h hs hs2\">চ. ওয়াক্ত হওয়া</div><p>প্রত্যেক ফরজ সালাত নির্ধারিত সময়ে আদায় করতে হবে। ওয়াক্তের আগে সালাত আদায় করলে তা ফরজ সালাত হিসেবে শুদ্ধ হবে না।</p><p class=\"bh\"><b>দলিল: মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا</div></div><p>অর্থ: নিশ্চয়ই সালাত মুমিনদের ওপর নির্ধারিত সময়ে ফরজ করা হয়েছে। (সূরা আন-নিসা: ১০৩)</p><div class=\"h hs hs2\">ছ. নিয়ত করা</div><p>কোন সালাত আদায় করা হচ্ছে, তা অন্তরে স্থির করতে হবে। নিয়ত মূলত অন্তরের সংকল্প; মুখে উচ্চারণ করা আবশ্যক নয়।</p><div class=\"h hs hs2\">৩। সালাতের অভ্যন্তরীণ ফরজ বা রুকনসমূহ</div><p>হানাফি মাজহাব অনুযায়ী সালাতের অভ্যন্তরীণ ফরজ ছয়টি—</p><div class=\"h hs hs2\">ক. তাকবিরে তাহরিমা</div><p>সালাত শুরু করার সময় ‘আল্লাহু আকবার’ বলে সালাতে প্রবেশ করা। এর মাধ্যমে সালাতের বাইরের কাজ নিষিদ্ধ হয়ে যায়।</p><div class=\"h hs hs2\">খ. কিয়াম</div><p class=\"bh\"><b>ফরজ সালাতে সক্ষম ব্যক্তির দাঁড়িয়ে সালাত আদায় করা। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقُومُوا لِلَّهِ قَانِتِينَ</div></div><p>অর্থ: আর তোমরা আল্লাহর সামনে বিনীতভাবে দাঁড়াও। (সূরা আল-বাকারা: ২৩৮)</p><div class=\"h hs hs2\">গ. কিরাআত</div><p>সালাতে কুরআন থেকে তিলাওয়াত করা। হানাফি মাজহাব অনুযায়ী ফরজ সালাতের প্রথম দুই রাকাতে কিরাআত করা ফরজ।</p><div class=\"h hs hs2\">ঘ. রুকু</div><p class=\"bh\"><b>কিরাআতের পর নিয়মমাফিক ঝুঁকে রুকু করা। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا</div></div><p>অর্থ: হে মুমিনগণ! তোমরা রুকু করো এবং সিজদা করো। (সূরা আল-হাজ্জ: ৭৭)</p><div class=\"h hs hs2\">ঙ. সিজদা</div><p>প্রত্যেক রাকাতে দুইবার সিজদা করা। সিজদায় কপাল, নাক, দুই হাত, দুই হাঁটু এবং দুই পায়ের আঙুল মাটিতে স্থাপন করতে হয়।</p><div class=\"h hs hs2\">চ. শেষ বৈঠক</div><p>সালাতের শেষে তাশাহহুদ পড়ার পরিমাণ সময় বসে থাকা। হানাফি মাজহাবে এটিই শেষ বৈঠকের ফরজ।</p><div class=\"h hs hs2\">৪। সালাতের ওয়াজিব ও তার হুকুম</div><p>হানাফি মাজহাব অনুযায়ী ওয়াজিব হলো এমন বিধান, যা শরিয়তের প্রমাণ দ্বারা আবশ্যক সাব্যস্ত হয়েছে; তবে ফরজের তুলনায় এর প্রমাণের স্তর ভিন্ন। সালাতের কোনো ওয়াজিব ভুলবশত ছুটে গেলে সাহু সিজদা দিতে হয়। আর ইচ্ছাকৃতভাবে ওয়াজিব ছেড়ে দিলে সালাত পুনরায় আদায় করা ওয়াজিব হয়—এটি গুনাহের কাজ।</p><p>হানাফি ফিকহে সালাতের গুরুত্বপূর্ণ ওয়াজিবগুলো হলো—</p><div class=\"h hs hs2\">ক. সূরা ফাতিহা পাঠ করা</div><p>প্রত্যেক রাকাতে সূরা ফাতিহা পাঠ করা ওয়াজিব।</p><div class=\"h hs hs2\">খ. সূরা ফাতিহার সঙ্গে অন্য সূরা বা আয়াত মিলানো</div><p>ফরজ সালাতের প্রথম দুই রাকাতে এবং বিতর ও সুন্নত-নফল সালাতের প্রত্যেক রাকাতে সূরা ফাতিহার পর অন্য একটি সূরা অথবা বড় একটি আয়াত বা ছোট তিনটি আয়াত পাঠ করা।</p><div class=\"h hs hs2\">গ. কিরাআতের ধারাবাহিকতা বজায় রাখা</div><p>প্রথমে সূরা ফাতিহা এবং পরে অন্য সূরা পাঠ করা।</p><div class=\"h hs hs2\">ঘ. রুকু ও সিজদায় স্থিরতা বজায় রাখা</div><p>রুকু, সিজদা এবং অন্যান্য রুকন যথাযথভাবে আদায় করা।</p><div class=\"h hs hs2\">ঙ. প্রথম বৈঠক করা</div><p>তিন বা চার রাকাতবিশিষ্ট সালাতে দুই রাকাতের পর বসা।</p><div class=\"h hs hs2\">চ. উভয় বৈঠকে তাশাহহুদ পাঠ করা</div><p>প্রথম ও শেষ বৈঠকে আত্তাহিয়্যাতু পাঠ করা।</p><div class=\"h hs hs2\">ছ. সালাম দিয়ে সালাত শেষ করা</div><p>হানাফি মাজহাবে সালাম ফিরিয়ে সালাত শেষ করা ওয়াজিব।</p><div class=\"h hs hs2\">জ. বিতরের সালাতে দোয়া কুনুত পাঠ করা</div><p>হানাফি মাজহাবে বিতরের তৃতীয় রাকাতে দোয়া কুনুত পাঠ করা ওয়াজিব।</p><div class=\"h hs hs2\">ঝ. ঈদের সালাতে অতিরিক্ত তাকবির বলা</div><p>ঈদের সালাতে নির্ধারিত অতিরিক্ত তাকবিরগুলো বলা ওয়াজিব।</p><div class=\"h hs hs2\">ঞ. ইমামের জন্য জাহরি ও সিররি কিরাআতের বিধান মানা</div><p>ফজর, মাগরিব ও এশার নির্ধারিত রাকাতে উচ্চস্বরে এবং জোহর ও আসরে নিম্নস্বরে কিরাআত করা।</p><p>ফরজ ও ওয়াজিবের বিষয়ে চার ইমামের মতপার্থক্য ও দলিল</p><div class=\"h hs hs2\">৫। চার মাজহাবের ইমামদের দৃষ্টিতে ফরজ ও ওয়াজিবের বিধান</div><p>সালাতের ফরজ ও ওয়াজিবের শ্রেণিবিভাগের ক্ষেত্রে চার মাজহাবের মধ্যে পরিভাষাগত পার্থক্য রয়েছে। হানাফি মাজহাবে ফরজ ও ওয়াজিবের মধ্যে পার্থক্য করা হয়। অন্যদিকে ইমাম মালিক, ইমাম শাফিঈ ও ইমাম আহমদ ইবনে হাম্বল (রহ.)-এর মাজহাবে ফরজ ও ওয়াজিব সাধারণত একই অর্থে ব্যবহৃত হয়।</p><p>ইমাম আবু হানিফা (রহ.)-এর মত: তাঁর মাজহাব অনুযায়ী অকাট্য দলিল দ্বারা প্রমাণিত বিধান ফরজ এবং অপেক্ষাকৃত কম অকাট্য দলিল দ্বারা প্রমাণিত আবশ্যক বিধান ওয়াজিব। তাই ফরজ ছুটে গেলে সালাত শুদ্ধ হয় না; আর ওয়াজিব ভুলবশত ছুটে গেলে সাহু সিজদার মাধ্যমে তা পূরণ করা যায়। ইচ্ছাকৃতভাবে ওয়াজিব ছেড়ে দিলে সালাত পুনরায় আদায় করতে হয়।</p><p>ইমাম মালিক (রহ.)-এর মত: তাঁর মাজহাবে সালাতের অপরিহার্য বিধানগুলো ফরজ বা ওয়াজিব হিসেবে গণ্য। কোনো অপরিহার্য রুকন বাদ পড়লে সালাত শুদ্ধ হয় না। তবে কিছু সুন্নত বাদ পড়লে তার বিধান আলাদা; ক্ষেত্রবিশেষে সাহু সিজদা করতে হয়।</p><p>ইমাম শাফিঈ (রহ.)-এর মত: তাঁর মাজহাবেও ফরজ ও ওয়াজিব একই অর্থে ব্যবহৃত হয়। সালাতের রুকনগুলো যথাযথভাবে আদায় করা আবশ্যক। কোনো রুকন বাদ পড়লে শুধু সাহু সিজদা দিয়ে তা পূরণ করা যায় না; বরং বাদ পড়া রুকন আদায় করতে হয়।</p><p>ইমাম আহমদ ইবনে হাম্বল (রহ.)-এর মত: তাঁর মাজহাবেও ফরজ ও ওয়াজিবের মধ্যে হানাফি মাজহাবের মতো পরিভাষাগত পার্থক্য নেই। সালাতের রুকন ও ওয়াজিবের বিধান পৃথকভাবে নির্ধারিত। কোনো রুকন ছুটে গেলে তা আদায় করা আবশ্যক; আর কিছু ওয়াজিব ভুলবশত ছুটে গেলে সাহু সিজদার বিধান রয়েছে।</p><p class=\"bh\"><b>ইমামদের দলিল: রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي</div></div><p>অর্থ: তোমরা আমাকে যেভাবে সালাত আদায় করতে দেখেছ, সেভাবে সালাত আদায় করো। (সহিহ বুখারি)</p><p>এ হাদিস থেকে প্রমাণিত হয় যে, সালাতের পদ্ধতি রাসূলুল্লাহ (সা.)-এর শিক্ষা ও আমল অনুসারে হতে হবে। চার ইমামই এ মূলনীতির ওপর একমত। তবে কোনো কোনো বিধানের শ্রেণিবিভাগ ও প্রয়োগের ক্ষেত্রে তাঁদের ইজতিহাদি মতপার্থক্য রয়েছে।</p><div class=\"h hs hs2\">৬। সালাতের সুন্নতসমূহ ও তার হুকুম</div><p>সুন্নত হলো রাসূলুল্লাহ (সা.)-এর এমন নিয়মিত আমল, যা তিনি নিজে করেছেন এবং উম্মতকে শিক্ষা দিয়েছেন; তবে তা ফরজ বা ওয়াজিবের পর্যায়ে নয়। সুন্নত পালন করলে সওয়াব পাওয়া যায় এবং রাসূলুল্লাহ (সা.)-এর অনুসরণ করা হয়। সুন্নতে মুয়াক্কাদাহ বিনা কারণে নিয়মিত পরিত্যাগ করা নিন্দনীয়। আর সুন্নতে গায়রে মুয়াক্কাদাহ পালন করলে সওয়াব পাওয়া যায়, না করলে গুনাহ হয় না।</p><p>হানাফি ফিকহ অনুযায়ী সালাতের উল্লেখযোগ্য সুন্নতসমূহ হলো—</p><div class=\"h hs hs2\">ক. তাকবিরে তাহরিমার সময় হাত উঠানো</div><p>পুরুষেরা কান পর্যন্ত এবং নারীরা কাঁধ পর্যন্ত হাত উঠিয়ে তাকবির বলা। এ বিষয়ে রাসূলুল্লাহ (সা.)-এর আমল সহিহ হাদিসে বর্ণিত হয়েছে।</p><div class=\"h hs hs2\">খ. ডান হাত বাম হাতের ওপর রাখা</div><p>দাঁড়ানো অবস্থায় ডান হাত বাম হাতের ওপর রাখা সুন্নত। হাদিসে ডান হাত বাম হাতের ওপর রাখার নির্দেশ এসেছে। (সহিহ বুখারি)</p><div class=\"h hs hs2\">গ. সানা পাঠ করা</div><p>তাকবিরে তাহরিমার পর কিরাআত শুরু করার আগে ‘সুবহানাকা আল্লাহুম্মা...’ পাঠ করা।</p><div class=\"h hs hs2\">ঘ. আউযুবিল্লাহ ও বিসমিল্লাহ পাঠ করা</div><p>কিরাআতের আগে আউযুবিল্লাহ এবং সূরা ফাতিহার আগে বিসমিল্লাহ পাঠ করা।</p><div class=\"h hs hs2\">ঙ. আমিন বলা</div><p>সূরা ফাতিহা শেষ করার পর আমিন বলা। ইমাম, মুক্তাদি ও একাকী সালাত আদায়কারী প্রত্যেকের জন্যই আমিন বলার বিধান রয়েছে; তবে উচ্চস্বরে বা নিম্নস্বরে বলার ক্ষেত্রে মাজহাবভেদে মতপার্থক্য রয়েছে।</p><div class=\"h hs hs2\">চ. রুকু ও সিজদার তাসবিহ পাঠ করা</div><p>রুকুতে ‘সুবহানা রব্বিয়াল আযিম’ এবং সিজদায় ‘সুবহানা রব্বিয়াল আ‘লা’ পাঠ করা।</p><div class=\"h hs hs2\">ছ. রুকু থেকে ওঠার সময় তাসমি ও তাহমিদ বলা</div><p>একাকী সালাত আদায়কারী এবং ইমাম ‘সামিআল্লাহু লিমান হামিদাহ’ বলবেন। এরপর ‘রব্বানা লাকাল হামদ’ বলা হয়।</p><div class=\"h hs hs2\">জ. বৈঠকে দরুদ শরিফ পাঠ করা</div><p>শেষ বৈঠকে তাশাহহুদের পর দরুদে ইবরাহিম পাঠ করা। হানাফি মাজহাবে এটি সুন্নত; অন্য মাজহাবে এর বিধান ভিন্ন হতে পারে।</p><div class=\"h hs hs2\">ঝ. দোয়া পাঠ করা</div><p>শেষ বৈঠকে দরুদ শরিফের পর কুরআন ও সুন্নাহসম্মত দোয়া পাঠ করা।</p><div class=\"h hs hs2\">ঞ. সালামের সময় ডানে ও বামে মুখ ফেরানো</div><p>ডান দিকে এবং বাম দিকে মুখ ফিরিয়ে সালাম দেওয়া। রাসূলুল্লাহ (সা.) এভাবে সালাত শেষ করতেন।</p><div class=\"h hs hs2\">৭। সালাতের মুস্তাহাবসমূহ ও তার হুকুম</div><p>মুস্তাহাব হলো এমন কাজ, যা শরিয়তের দৃষ্টিতে পছন্দনীয় এবং পালন করলে সওয়াব পাওয়া যায়; কিন্তু তা পালন করা বাধ্যতামূলক নয়। মুস্তাহাব কাজ ছেড়ে দিলে গুনাহ হয় না। তবে এগুলো পালন করলে সালাতের সৌন্দর্য ও একাগ্রতা বৃদ্ধি পায়।</p><p>সালাতের উল্লেখযোগ্য মুস্তাহাবসমূহ হলো—</p><div class=\"h hs hs2\">ক. সালাতের সময় দৃষ্টি সিজদার স্থানে রাখা</div><p>দাঁড়ানো অবস্থায় দৃষ্টি সিজদার স্থানে রাখা এবং অপ্রয়োজনে এদিক-সেদিক না তাকানো।</p><div class=\"h hs hs2\">খ. একাগ্রতা ও বিনয় বজায় রাখা</div><p>সালাতের প্রতিটি কাজ ধীরস্থিরভাবে সম্পন্ন করা এবং অন্তরে আল্লাহর ভয় ও ভালোবাসা জাগ্রত রাখা।</p><div class=\"h hs hs2\">গ. হাঁচি এলে আল্লাহর প্রশংসা করা</div><p>সালাতের বাইরে যেমন আল্লাহর প্রশংসা করা হয়, সালাতের ভেতরেও উপযুক্তভাবে তা করা যায়; তবে এমনভাবে নয়, যাতে কিরাআত বা সালাতের নিয়ম বিঘ্নিত হয়।</p><div class=\"h hs hs2\">ঘ. হাই নিয়ন্ত্রণ করা</div><p>সালাতের মধ্যে হাই এলে যথাসম্ভব তা প্রতিহত করা। রাসূলুল্লাহ (সা.) হাইকে শয়তানের পক্ষ থেকে বলে উল্লেখ করেছেন এবং তা নিয়ন্ত্রণের নির্দেশ দিয়েছেন। (সহিহ বুখারি)</p><div class=\"h hs hs2\">ঙ. সুন্দর ও পরিচ্ছন্ন পোশাক পরিধান করা</div><p>সালাতে পরিষ্কার-পরিচ্ছন্ন ও শালীন পোশাক পরিধান করা এবং আল্লাহর সামনে যথাযথ আদব বজায় রাখা।</p><div class=\"h hs hs2\">চ. সালাতের আগে মনোযোগ প্রস্তুত করা</div><p>দুনিয়াবি চিন্তা থেকে মনকে যথাসম্ভব মুক্ত রেখে সালাতে দাঁড়ানো এবং ধীরস্থিরভাবে প্রতিটি রুকন আদায় করা।</p><div class=\"h hs hs2\">৭। সালাতের ফরজ, ওয়াজিব, সুন্নত ও মুস্তাহাবের বিধান সংক্ষেপে</div><p>ফরজ ছুটে গেলে সালাত শুদ্ধ হয় না। হানাফি মাজহাবে ওয়াজিব ভুলবশত ছুটে গেলে সাহু সিজদা করতে হয়; ইচ্ছাকৃতভাবে ছেড়ে দিলে সালাত পুনরায় আদায় করতে হয়। সুন্নত পালন করলে সওয়াব পাওয়া যায় এবং সুন্নতে মুয়াক্কাদাহ নিয়মিত পরিত্যাগ করা উচিত নয়। মুস্তাহাব পালন করলে অতিরিক্ত সওয়াব পাওয়া যায়, তবে তা ছেড়ে দিলে গুনাহ হয় না।</p><p>সালাতের বিধান সম্পর্কে গুরুত্বপূর্ণ মতপার্থক্য</p><p>এখানে বিশেষভাবে মনে রাখতে হবে, হানাফি মাজহাবে তাকবিরে তাহরিমা সালাতের শর্ত হিসেবে গণ্য; একে অভ্যন্তরীণ ছয়টি রুকনের মধ্যে গণনা করা হয় না। হানাফি মাজহাবের অভ্যন্তরীণ ছয়টি ফরজ হলো—কিয়াম, কিরাআত, রুকু, সিজদা, শেষ বৈঠক এবং নিজস্ব কাজের মাধ্যমে সালাত থেকে বের হওয়া। অন্য মাজহাবগুলোতে তাকবিরে তাহরিমাকে সালাতের রুকনের অন্তর্ভুক্ত করা হয়।</p><p>এ ছাড়া রুকু-সিজদায় স্থিরতা, শেষ বৈঠক, দরুদ পাঠ এবং অন্যান্য কিছু বিধানের শ্রেণিবিভাগেও মাজহাবভেদে পার্থক্য রয়েছে। তাই একটি মাজহাবের বিধানকে অন্য মাজহাবের ওপর সরাসরি প্রয়োগ করা ঠিক নয়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, সালাত ইসলামের অন্যতম গুরুত্বপূর্ণ ইবাদত। সালাতের ফরজ, ওয়াজিব, সুন্নত ও মুস্তাহাব সম্পর্কে জ্ঞান অর্জন করা প্রত্যেক মুসলমানের জন্য অত্যন্ত প্রয়োজনীয়। ফরজ ও ওয়াজিব যথাযথভাবে আদায় না করলে সালাতের শুদ্ধতা ক্ষতিগ্রস্ত হয়; আর সুন্নত ও মুস্তাহাব পালনের মাধ্যমে সালাতের সৌন্দর্য, পূর্ণতা ও সওয়াব বৃদ্ধি পায়। ইমাম আবু হানিফা, ইমাম মালিক, ইমাম শাফিঈ ও ইমাম আহমদ (রহ.) প্রত্যেকেই কুরআন ও সুন্নাহর আলোকে সালাতের বিধান ব্যাখ্যা করেছেন। তাঁদের মধ্যে কিছু ইজতিহাদি মতপার্থক্য থাকলেও রাসূলুল্লাহ (সা.)-এর পদ্ধতি অনুসরণ করে বিশুদ্ধভাবে সালাত আদায় করার বিষয়ে তাঁরা সবাই একমত। অতএব, আমাদের উচিত নির্ভরযোগ্য আলেমদের নির্দেশনা অনুযায়ী সালাতের বিধান জেনে যথাযথভাবে সালাত আদায় করা।</p>"], ["সাওমের সংজ্ঞা দাও। তা কত প্রকার ও কী কী? ইসলামের নিয়মে সিয়াম সাধনার গুরুত্ব বর্ণনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>সাওম ইসলামের পাঁচটি স্তম্ভের অন্যতম এবং অত্যন্ত গুরুত্বপূর্ণ একটি ইবাদত। ঈমান ও সালাতের পর ইসলামী জীবনব্যবস্থায় সাওমের বিশেষ মর্যাদা রয়েছে। মহান আল্লাহ মুসলমানদের ওপর রমজান মাসের সাওম ফরজ করেছেন। সাওম শুধু পানাহার ও জৈবিক চাহিদা থেকে বিরত থাকার নাম নয়; বরং এটি মানুষের আত্মশুদ্ধি, তাকওয়া অর্জন, ধৈর্য, সংযম, নৈতিকতা ও মানবিক গুণাবলি বিকাশের একটি পূর্ণাঙ্গ প্রশিক্ষণ। সিয়াম সাধনার মাধ্যমে মানুষ নিজের প্রবৃত্তিকে নিয়ন্ত্রণ করতে শেখে এবং মহান আল্লাহর প্রতি আনুগত্য ও ভালোবাসা বৃদ্ধি করে।</p><div class=\"h hm\">সাওমের পরিচয়</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>صَوْم শব্দটি আরবি। এটি صَامَ يَصُومُ صَوْمًا ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْإِمْسَاكُ — বিরত থাকা।</p><p>২। الْكَفُّ — নিবৃত্ত থাকা।</p><p>৩। التَّرْكُ — পরিত্যাগ করা।</p><p>৪। السُّكُوتُ — নীরব থাকা।</p><div class=\"h hs hs2\">৫। الِامْتِنَاعُ — বিরত বা সংযত থাকা।</div><p>ইংরেজি অর্থ: Fasting, Abstinence, Restraint.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>সাওমের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম আল-কাসানী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الصَّوْمُ هُوَ الْإِمْسَاكُ عَنِ الْأَكْلِ وَالشُّرْبِ وَالْجِمَاعِ مِنْ طُلُوعِ الْفَجْرِ إِلَى غُرُوبِ الشَّمْسِ</div></div><p>অর্থ: সুবহে সাদিক থেকে সূর্যাস্ত পর্যন্ত পানাহার ও স্ত্রী সহবাস থেকে বিরত থাকাকে সাওম বলে।</p><p>২. আল্লামা ইবনে আবিদীন (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الصَّوْمُ هُوَ الْإِمْسَاكُ عَنِ الْمُفَطِّرَاتِ بِشَرَائِطِهِ</div></div><p>অর্থ: নির্দিষ্ট শর্তাবলি অনুসারে রোজা ভঙ্গকারী বিষয়সমূহ থেকে বিরত থাকাকে সাওম বলে।</p><div class=\"h hm\">সাওম কত প্রকার ও কী কী</div><p>শরিয়তের বিধান অনুযায়ী সাওম প্রধানত ছয় প্রকার। যথা—</p><div class=\"h hs hs2\">ক. ফরজ সাওম</div><p>যে সাওম পালন করা প্রত্যেক যোগ্য মুসলমানের ওপর বাধ্যতামূলক, তাকে ফরজ সাওম বলে। যেমন—রমজান মাসের সাওম। রমজানের সাওম ইসলামের অন্যতম মৌলিক স্তম্ভ। কোনো প্রাপ্তবয়স্ক, সুস্থ মস্তিষ্কসম্পন্ন ও সাওম পালনে সক্ষম মুসলমানের ওপর তা ফরজ। বিনা শরয়ি কারণে এ সাওম পরিত্যাগ করা গুরুতর গুনাহ।</p><div class=\"h hs hs2\">খ. ওয়াজিব সাওম</div><p>যে সাওম পালন করা শরিয়তের দৃষ্টিতে আবশ্যক, তাকে ওয়াজিব সাওম বলে। যেমন—মানত করা সাওম এবং হানাফি মাজহাব অনুযায়ী নফল সাওম শুরু করার পর ভঙ্গ করলে তার কাজা আদায় করা। ওয়াজিব সাওম যথাযথভাবে আদায় করা আবশ্যক।</p><div class=\"h hs hs2\">গ. সুন্নত সাওম</div><p>রাসূলুল্লাহ (সা.) যে সাওম পালন করেছেন এবং উম্মতকে উৎসাহিত করেছেন, তাকে সুন্নত সাওম বলে। যেমন—আশুরার সাওম। রাসূলুল্লাহ (সা.) আশুরার দিনে সাওম পালন করেছেন এবং পরবর্তী বছর বেঁচে থাকলে নবম তারিখেও সাওম পালন করার ইচ্ছা প্রকাশ করেছিলেন।</p><div class=\"h hs hs2\">ঘ. মুস্তাহাব বা নফল সাওম</div><p>যে সাওম পালন করা বাধ্যতামূলক নয়, কিন্তু পালন করলে সওয়াব পাওয়া যায়, তাকে নফল বা মুস্তাহাব সাওম বলে। যেমন—প্রতি সোমবার ও বৃহস্পতিবারের সাওম, শাওয়াল মাসের ছয়টি সাওম, প্রতি চন্দ্রমাসের ১৩, ১৪ ও ১৫ তারিখের সাওম এবং আরাফার দিনের সাওম।</p><div class=\"h hs hs2\">ঙ. মাকরুহ সাওম</div><p>যে সাওম পালন করা শরিয়তের দৃষ্টিতে অপছন্দনীয়, তাকে মাকরুহ সাওম বলে। যেমন—শুক্রবারকে এককভাবে নির্দিষ্ট করে সাওম পালন করা, যদি তার আগে বা পরে আরেক দিন সাওম পালন না করা হয়।</p><div class=\"h hs hs2\">চ. হারাম সাওম</div><p>যে দিনগুলোতে সাওম পালন করা শরিয়ত নিষিদ্ধ করেছে, সেসব দিনের সাওমকে হারাম সাওম বলে। যেমন—ঈদুল ফিতরের দিন, ঈদুল আজহার দিন এবং আইয়ামে তাশরিকের তিন দিন অর্থাৎ ১১, ১২ ও ১৩ জিলহজ।</p><div class=\"h hm\">ইসলামের নিয়মে সিয়াম সাধনার গুরুত্ব</div><div class=\"h hs hs2\">ক. তাকওয়া অর্জনের অন্যতম মাধ্যম</div><p>সিয়াম সাধনার প্রধান উদ্দেশ্য হলো তাকওয়া অর্জন করা। তাকওয়া অর্থ আল্লাহভীতি এবং তাঁর আদেশ-নিষেধ মেনে চলার মাধ্যমে নিজেকে পাপ থেকে রক্ষা করা। একজন রোজাদার আল্লাহর সন্তুষ্টির জন্য নিজের বৈধ পানাহার ও অন্যান্য চাহিদা থেকেও বিরত থাকে। সে জানে, গোপনে পানাহার করার সুযোগ থাকলেও মহান আল্লাহ তাকে দেখছেন। এ বিশ্বাস তার মধ্যে আল্লাহভীতি ও আত্মসংযম সৃষ্টি করে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَعَلَّكُمْ تَتَّقُونَ</div></div><p>অর্থ: যাতে তোমরা তাকওয়া অর্জন করতে পারো। (সূরা আল-বাকারা: ১৮৩)</p><div class=\"h hs hs2\">খ. আত্মশুদ্ধি ও নৈতিক চরিত্র গঠন</div><p>সাওম মানুষের আত্মাকে পাপ, অহংকার, হিংসা, বিদ্বেষ, লোভ ও কুপ্রবৃত্তি থেকে পবিত্র করার প্রশিক্ষণ দেয়। একজন প্রকৃত রোজাদার শুধু পানাহার থেকে বিরত থাকে না; বরং মিথ্যা, গিবত, পরনিন্দা, অশ্লীলতা, প্রতারণা ও অন্যায় কাজ থেকেও নিজেকে বিরত রাখে। এর ফলে তার চরিত্রে সততা, পবিত্রতা, বিনয় ও নৈতিকতা সৃষ্টি হয়।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ لَمْ يَدَعْ قَوْلَ الزُّورِ وَالْعَمَلَ بِهِ فَلَيْسَ لِلَّهِ حَاجَةٌ فِي أَنْ يَدَعَ طَعَامَهُ وَشَرَابَهُ</div></div><p>অর্থ: যে ব্যক্তি মিথ্যা কথা ও সে অনুযায়ী কাজ করা পরিত্যাগ করে না, তার পানাহার পরিত্যাগ করার কোনো প্রয়োজন আল্লাহর নেই। (সহিহ বুখারি)</p><div class=\"h hs hs2\">গ. ধৈর্য ও সহনশীলতা বৃদ্ধি</div><p>সাওম মানুষকে ধৈর্য ও সহনশীলতার শিক্ষা দেয়। ক্ষুধা, তৃষ্ণা ও শারীরিক কষ্ট সহ্য করার মাধ্যমে মানুষের মধ্যে ধৈর্য ধারণের ক্ষমতা বৃদ্ধি পায়। একই সঙ্গে রাগ নিয়ন্ত্রণ, বিপদে ধৈর্য ধারণ এবং অন্যের সঙ্গে উত্তম আচরণ করার অভ্যাস গড়ে ওঠে। জীবনের বিভিন্ন প্রতিকূল পরিস্থিতি মোকাবিলায় মানসিক শক্তি তৈরি হয়।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الصَّوْمُ نِصْفُ الصَّبْرِ</div></div><p>অর্থ: সাওম হলো ধৈর্যের অর্ধেক। (জামে আত-তিরমিজি)</p><div class=\"h hs hs2\">ঘ. প্রবৃত্তি ও কুপ্রবৃত্তি নিয়ন্ত্রণ</div><p>মানুষের মধ্যে বিভিন্ন জৈবিক চাহিদা ও প্রবৃত্তি রয়েছে। এগুলো নিয়ন্ত্রণ করতে না পারলে মানুষ পাপাচারে লিপ্ত হতে পারে। সাওম মানুষকে নিজের প্রবৃত্তির ওপর নিয়ন্ত্রণ প্রতিষ্ঠার শিক্ষা দেয়। ক্ষুধা, তৃষ্ণা ও যৌন চাহিদা থাকা সত্ত্বেও আল্লাহর নির্দেশে বিরত থাকার মাধ্যমে মানুষ নিজের ইচ্ছাশক্তিকে শক্তিশালী করে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا مَعْشَرَ الشَّبَابِ، مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ فَلْيَتَزَوَّجْ، وَمَنْ لَمْ يَسْتَطِعْ فَعَلَيْهِ بِالصَّوْمِ فَإِنَّهُ لَهُ وِجَاءٌ</div></div><p>অর্থ: হে যুবসমাজ! তোমাদের মধ্যে যে বিবাহের সামর্থ্য রাখে, সে যেন বিবাহ করে। আর যে সামর্থ্য রাখে না, সে যেন সাওম পালন করে। কেননা সাওম তার প্রবৃত্তি নিয়ন্ত্রণে সহায়ক। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class=\"h hs hs2\">ঙ. আল্লাহর প্রতি আনুগত্য ও ইখলাস সৃষ্টি</div><p>সাওম এমন একটি ইবাদত, যার প্রকৃত অবস্থা আল্লাহ ছাড়া অন্য কেউ সম্পূর্ণভাবে জানতে পারে না। একজন মানুষ চাইলে গোপনে পানাহার করতে পারে; কিন্তু আল্লাহর ভয়ে সে তা করে না। এর মাধ্যমে তার মধ্যে ইখলাস বা একনিষ্ঠতা সৃষ্টি হয়। সে উপলব্ধি করে যে, আল্লাহ সবসময় তাকে দেখছেন এবং তার প্রতিটি কাজ সম্পর্কে অবগত রয়েছেন। ফলে তার মধ্যে আল্লাহর প্রতি আনুগত্য ও জবাবদিহির অনুভূতি বৃদ্ধি পায়।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন, মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الصَّوْمُ لِي وَأَنَا أَجْزِي بِهِ</div></div><p>অর্থ: সাওম আমার জন্য এবং আমিই এর প্রতিদান প্রদান করব। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class=\"h hs hs2\">চ. দরিদ্র ও অসহায় মানুষের কষ্ট উপলব্ধি</div><p>সাওম পালনের মাধ্যমে ধনী ব্যক্তিরা ক্ষুধা ও তৃষ্ণার অনুভূতি উপলব্ধি করতে পারে। ফলে দরিদ্র, অসহায় ও অভাবগ্রস্ত মানুষের দুঃখ-কষ্ট সম্পর্কে তাদের মধ্যে সহানুভূতি সৃষ্টি হয়। এ অনুভূতি মানুষকে দান-সদকা, যাকাত, ফিতরা ও মানবসেবায় উৎসাহিত করে। ফলে সমাজে পারস্পরিক সহযোগিতা, সহমর্মিতা ও ভালোবাসা বৃদ্ধি পায়।</p><div class=\"h hs hs2\">ছ. পাপ থেকে বিরত থাকার প্রশিক্ষণ</div><p>সাওম মানুষকে শুধু নির্দিষ্ট সময় পানাহার থেকে বিরত থাকার শিক্ষা দেয় না; বরং জীবনের প্রতিটি ক্ষেত্রে অন্যায় ও পাপ থেকে বিরত থাকার প্রশিক্ষণ দেয়। রোজাদার ব্যক্তি মিথ্যা, প্রতারণা, গিবত, সুদ, ঘুষ, অশ্লীলতা ও অন্যায় কাজ থেকে নিজেকে রক্ষা করার চেষ্টা করে। ফলে সাওম মানুষের ব্যক্তিগত ও সামাজিক জীবনকে পবিত্র করে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالصِّيَامُ جُنَّةٌ</div></div><p>অর্থ: সাওম হলো ঢালস্বরূপ। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>অর্থাৎ সাওম মানুষকে পাপাচার ও অন্যায় থেকে রক্ষা করার মাধ্যম হিসেবে কাজ করে।</p><div class=\"h hs hs2\">জ. সামাজিক সাম্য ও ভ্রাতৃত্ববোধ প্রতিষ্ঠা</div><p>সাওম ধনী-দরিদ্র, রাজা-প্রজা ও উচ্চ-নীচের মধ্যে সাম্যের অনুভূতি সৃষ্টি করে। সবাই একই নিয়মে সুবহে সাদিক থেকে সূর্যাস্ত পর্যন্ত পানাহার থেকে বিরত থাকে। এতে মানুষের মধ্যে পারস্পরিক ভ্রাতৃত্ব, ঐক্য ও সমতার চেতনা জাগ্রত হয়। বিশেষ করে রমজান মাসে সম্মিলিত ইফতার, সাহরি, তারাবিহ ও দান-সদকার মাধ্যমে সামাজিক সম্পর্ক আরও সুদৃঢ় হয়।</p><div class=\"h hs hs2\">ঝ. আত্মিক প্রশান্তি ও আল্লাহর নৈকট্য অর্জন</div><p>সাওম মানুষের অন্তরকে আল্লাহর স্মরণে পরিপূর্ণ করে এবং আত্মিক প্রশান্তি অর্জনে সহায়তা করে। রোজাদার ব্যক্তি কুরআন তিলাওয়াত, জিকির, দোয়া, ইস্তিগফার ও অন্যান্য ইবাদতে বেশি মনোযোগী হয়। এর ফলে তার অন্তরে আল্লাহর প্রতি ভালোবাসা, ভয় ও নির্ভরশীলতা বৃদ্ধি পায়। রমজানের ইবাদত মানুষের অন্তরকে পবিত্র ও প্রশান্ত করে।</p><div class=\"h hs hs2\">ঞ. জান্নাত লাভের বিশেষ মাধ্যম</div><p>সাওম পালনকারীদের জন্য মহান আল্লাহ বিশেষ পুরস্কারের ব্যবস্থা রেখেছেন। জান্নাতে ‘রাইয়ান’ নামে একটি দরজা রয়েছে, যা দিয়ে শুধু সাওম পালনকারীরা প্রবেশ করবে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ فِي الْجَنَّةِ بَابًا يُقَالُ لَهُ الرَّيَّانُ، يَدْخُلُ مِنْهُ الصَّائِمُونَ يَوْمَ الْقِيَامَةِ</div></div><p>অর্থ: নিশ্চয়ই জান্নাতে একটি দরজা রয়েছে, যার নাম রাইয়ান। কিয়ামতের দিন সাওম পালনকারীরা এ দরজা দিয়ে প্রবেশ করবে। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>ট. শারীরিক শৃঙ্খলা ও সময়ানুবর্তিতা সৃষ্টি</p><p>সাওম মানুষের দৈনন্দিন জীবনকে একটি নিয়মতান্ত্রিক কাঠামোর মধ্যে পরিচালিত করতে সাহায্য করে। সাহরি, ইফতার, সালাত, কুরআন তিলাওয়াত ও অন্যান্য ইবাদতের মাধ্যমে সময়ের সঠিক ব্যবহার শেখা যায়। পাশাপাশি পরিমিত আহার, নিয়মশৃঙ্খলা ও আত্মনিয়ন্ত্রণের অভ্যাস গড়ে ওঠে। তবে সাওমের মূল উদ্দেশ্য স্বাস্থ্যগত উপকার নয়; বরং আল্লাহর সন্তুষ্টি ও তাকওয়া অর্জন।</p><div class=\"h hs hs2\">ঠ. দোয়া কবুল ও ইবাদতের পরিবেশ সৃষ্টি</div><p>সাওমের মাসে মুসলমানরা বেশি বেশি দোয়া, ইস্তিগফার ও ইবাদত করে। রমজান মাসে আল্লাহর রহমত ও ক্ষমা লাভের বিশেষ সুযোগ সৃষ্টি হয়। রোজাদারের দোয়ার বিশেষ মর্যাদা রয়েছে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ثَلَاثَةٌ لَا تُرَدُّ دَعْوَتُهُمْ، الصَّائِمُ حَتَّى يُفْطِرَ</div></div><p>অর্থ: তিন ব্যক্তির দোয়া প্রত্যাখ্যান করা হয় না; তাদের একজন হলো রোজাদার, যতক্ষণ না সে ইফতার করে। (জামে আত-তিরমিজি)</p><p>ড. উম্মাহর ঐক্য ও ইসলামী চেতনা জাগ্রত করা</p><p>রমজান মাসে পৃথিবীর মুসলমানরা একই সময়ে সাওম পালন করে। একই নিয়মে সাহরি ও ইফতার করে এবং আল্লাহর ইবাদতে আত্মনিয়োগ করে। এর মাধ্যমে মুসলিম উম্মাহর মধ্যে ঐক্য, সংহতি ও ভ্রাতৃত্ববোধ সৃষ্টি হয়। একই সঙ্গে ইসলামী আদর্শ ও ধর্মীয় চেতনা নতুনভাবে জাগ্রত হয়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, সাওম শুধু পানাহার ও জৈবিক চাহিদা থেকে বিরত থাকার নাম নয়; বরং এটি মানুষের আত্মিক, নৈতিক, সামাজিক ও আধ্যাত্মিক উন্নতির একটি পূর্ণাঙ্গ প্রশিক্ষণ। সাওমের মাধ্যমে মানুষ তাকওয়া অর্জন করে, প্রবৃত্তি নিয়ন্ত্রণ করতে শেখে, ধৈর্য ও সহনশীলতা লাভ করে এবং দরিদ্র মানুষের কষ্ট উপলব্ধি করতে পারে। তাই প্রত্যেক মুসলমানের উচিত শরিয়তের নিয়ম মেনে নিষ্ঠা ও একাগ্রতার সঙ্গে সাওম পালন করা। এর মাধ্যমে মহান আল্লাহর সন্তুষ্টি অর্জনের পাশাপাশি দুনিয়া ও আখিরাতের কল্যাণ লাভ করা সম্ভব।</p>"], ["যাকাত বলতে কী বুঝ? যাকাতের ধর্মীয়, সামাজিক ও অর্থনৈতিক গুরুত্ব আলোচনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>যাকাত ইসলামের পাঁচটি স্তম্ভের মধ্যে অন্যতম এবং অত্যন্ত গুরুত্বপূর্ণ একটি আর্থিক ইবাদত। এটি সম্পদশালী মুসলমানদের ওপর নির্দিষ্ট শর্তে ফরজ করা হয়েছে। যাকাতের মাধ্যমে মানুষের সম্পদ পবিত্র হয়, অন্তর কৃপণতা থেকে মুক্ত হয় এবং সমাজে ধনী-দরিদ্রের বৈষম্য হ্রাস পায়। এটি ইসলামী অর্থব্যবস্থার অন্যতম প্রধান ভিত্তি। নিম্নে প্রশ্নের আলোকে যাকাতের আভিধানিক ও শরয়ী অর্থ আলোচনা করা হলো।</p><div class=\"h hm\">১ : تَعْرِيفُ الزَّكَاةِ (যাকাতের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>زَكَاة শব্দটি আরবি। এটি زَكَا يَزْكُو زَكَاةً ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। النَّمَاءُ — বৃদ্ধি বা প্রবৃদ্ধি।</p><p>২। الطَّهَارَةُ — পবিত্রতা বা পরিশুদ্ধতা।</p><p>৩। الْبَرَكَةُ — বরকত বা কল্যাণ।</p><p>৪। الصَّلَاحُ — সংশোধন বা সৎকর্ম।</p><div class=\"h hs hs2\">৫। الزِّيَادَةُ — আধিক্য বা বৃদ্ধি।</div><p>ইংরেজি অর্থ: Purification, Growth, Charity, Almsgiving.</p><div class=\"h hm\">শরয়ী সংজ্ঞা</div><p>যাকাতের শরয়ী সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম আল-কাসানী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الزَّكَاةُ تَمْلِيكُ جُزْءٍ مِنَ الْمَالِ لِفَقِيرٍ مُسْلِمٍ غَيْرِ هَاشِمِيٍّ وَلَا مَوْلَاهُ مَعَ قَطْعِ الْمَنْفَعَةِ عَنِ الْمُمَلِّكِ مِنْ كُلِّ وَجْهٍ لِلَّهِ تَعَالَى</div></div><p>অর্থ: মহান আল্লাহর সন্তুষ্টির উদ্দেশ্যে সম্পদের একটি নির্দিষ্ট অংশ কোনো দরিদ্র মুসলমানকে এমনভাবে মালিক বানিয়ে দেওয়া, যাতে দাতার মালিকানা ও উপকারের সম্পর্ক সম্পূর্ণ বিচ্ছিন্ন হয়ে যায়, তাকে যাকাত বলে।</p><p class=\"bh\"><b>২. ইমাম ইবনে কুদামাহ (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الزَّكَاةُ هِيَ حَقٌّ وَاجِبٌ فِي مَالٍ مَخْصُوصٍ لِطَائِفَةٍ مَخْصُوصَةٍ فِي وَقْتٍ مَخْصُوصٍ</div></div><p>অর্থ: নির্দিষ্ট সময়ে নির্দিষ্ট শ্রেণির মানুষের জন্য নির্দিষ্ট সম্পদের মধ্যে যে বাধ্যতামূলক অধিকার রয়েছে, তাকে যাকাত বলে।</p><div class=\"h hs hs2\">সারকথা</div><p>পরিশেষে বলা যায়, যাকাতের আভিধানিক অর্থ পবিত্রতা, বৃদ্ধি ও বরকত। আর শরিয়তের পরিভাষায় মহান আল্লাহর সন্তুষ্টি অর্জনের উদ্দেশ্যে নির্দিষ্ট শর্তে নির্দিষ্ট সম্পদের নির্ধারিত অংশ শরিয়ত কর্তৃক নির্ধারিত হকদারদের মালিকানায় প্রদান করাকে যাকাত বলে। যাকাত ব্যক্তি ও সমাজের অর্থনৈতিক ভারসাম্য প্রতিষ্ঠা এবং সম্পদের পবিত্রতা অর্জনের অন্যতম মাধ্যম।</p><div class=\"h hm\">যাকাতের ধর্মীয় গুরুত্ব</div><div class=\"h hs hs2\">১। ইসলামের অন্যতম মৌলিক স্তম্ভ</div><p class=\"bh\"><b>যাকাত ইসলামের পাঁচটি স্তম্ভের অন্যতম। কালিমা ও সালাতের পরেই যাকাতের স্থান। সামর্থ্যবান মুসলমানের ওপর নির্দিষ্ট শর্তে যাকাত আদায় করা ফরজ। যাকাত ছাড়া ইসলামের অর্থনৈতিক ও ইবাদতব্যবস্থা পূর্ণতা লাভ করে না। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ</div></div><p>অর্থ: তোমরা সালাত প্রতিষ্ঠা করো এবং যাকাত প্রদান করো। (সূরা আল-বাকারা: ৪৩)</p><p>এ আয়াত থেকে প্রমাণিত হয়, যাকাত ইসলামের অপরিহার্য বিধান এবং আল্লাহর নির্দেশ পালন করার অন্যতম মাধ্যম।</p><div class=\"h hs hs2\">২। আল্লাহর সন্তুষ্টি অর্জনের মাধ্যম</div><p>যাকাত আদায়ের মাধ্যমে একজন মুমিন মহান আল্লাহর নির্দেশ পালন করে তাঁর সন্তুষ্টি অর্জন করতে পারে। সম্পদের প্রতি অতিরিক্ত ভালোবাসা ত্যাগ করে আল্লাহর পথে সম্পদ ব্যয় করা প্রকৃত ঈমানের পরিচয়। যাকাত আদায়কারী ব্যক্তি আল্লাহর প্রতি আনুগত্য ও আত্মসমর্পণের প্রমাণ দেয়।</p><div class=\"h hs hs2\">৩। সম্পদ ও আত্মাকে পবিত্র করে</div><p class=\"bh\"><b>যাকাতের অন্যতম ধর্মীয় উদ্দেশ্য হলো সম্পদ ও আত্মাকে পবিত্র করা। মানুষের সম্পদে দরিদ্র ও অসহায় মানুষের নির্ধারিত অধিকার রয়েছে। যাকাত আদায়ের মাধ্যমে সম্পদ সেই অধিকার থেকে মুক্ত হয় এবং মানুষের অন্তর কৃপণতা ও লোভ থেকে পবিত্র হয়। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِمْ بِهَا</div></div><p>অর্থ: আপনি তাদের সম্পদ থেকে সদকা গ্রহণ করুন, যার মাধ্যমে আপনি তাদের পবিত্র করবেন এবং পরিশুদ্ধ করবেন। (সূরা আত-তাওবা: ১০৩)</p><div class=\"h hs hs2\">৪। ঈমানের সত্যতা ও আনুগত্যের প্রমাণ</div><p>যাকাত আদায় করা শুধু আর্থিক লেনদেন নয়; বরং এটি ঈমানের বাস্তব প্রকাশ। যে ব্যক্তি আল্লাহর সন্তুষ্টির জন্য নিজের সম্পদের নির্ধারিত অংশ দরিদ্রদের প্রদান করে, সে প্রমাণ করে যে তার কাছে আল্লাহর নির্দেশ সম্পদের চেয়েও বেশি গুরুত্বপূর্ণ। এভাবে যাকাত মানুষের ঈমানি চেতনাকে শক্তিশালী করে।</p><div class=\"h hs hs2\">৫। পরকালীন মুক্তি ও সওয়াব লাভের মাধ্যম</div><p class=\"bh\"><b>যাকাত আদায়কারী ব্যক্তি পরকালে মহান আল্লাহর কাছ থেকে প্রতিদান লাভ করবে। পক্ষান্তরে যাকাত আদায় না করা সম্পদশালী ব্যক্তির জন্য কঠিন শাস্তির সতর্কবাণী রয়েছে। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلَا يُنْفِقُونَهَا فِي سَبِيلِ اللَّهِ فَبَشِّرْهُمْ بِعَذَابٍ أَلِيمٍ</div></div><p>অর্থ: যারা সোনা-রূপা জমা করে রাখে এবং তা আল্লাহর পথে ব্যয় করে না, তাদের যন্ত্রণাদায়ক শাস্তির সংবাদ দিন। (সূরা আত-তাওবা: ৩৪)</p><p>এ আয়াত যাকাত আদায় না করে সম্পদ জমা রাখার ভয়াবহ পরিণতি সম্পর্কে সতর্ক করে।</p><div class=\"h hm\">যাকাতের সামাজিক গুরুত্ব</div><div class=\"h hs hs2\">৬। দারিদ্র্য বিমোচনে ভূমিকা</div><p>যাকাত সমাজের দরিদ্র, অসহায় ও অভাবগ্রস্ত মানুষের অর্থনৈতিক দুরবস্থা দূর করতে গুরুত্বপূর্ণ ভূমিকা পালন করে। ধনীদের সম্পদের একটি নির্দিষ্ট অংশ দরিদ্রদের মধ্যে বণ্টিত হলে তাদের খাদ্য, বস্ত্র, বাসস্থান ও চিকিৎসার প্রয়োজন পূরণে সহায়তা হয়। ফলে সমাজে দারিদ্র্যের প্রকোপ কমে এবং মানুষের জীবনযাত্রার মান উন্নত হয়।</p><div class=\"h hs hs2\">৭। সামাজিক সাম্য ও ন্যায়বিচার প্রতিষ্ঠা</div><p class=\"bh\"><b>যাকাত ধনী ও দরিদ্রের মধ্যে সম্পদের ভারসাম্য প্রতিষ্ঠা করে। ইসলামে সম্পদ কেবল ধনীদের মধ্যে আবর্তিত হওয়ার বিষয় নয়; বরং সমাজের অভাবী মানুষেরও সম্পদের ওপর অধিকার রয়েছে। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنْكُمْ</div></div><p>অর্থ: যাতে সম্পদ কেবল তোমাদের ধনীদের মধ্যেই আবর্তিত না থাকে। (সূরা আল-হাশর: ৭)</p><p>এ আয়াতের মূলনীতি অনুযায়ী যাকাত সম্পদের সুষম বণ্টন ও সামাজিক ন্যায়বিচার প্রতিষ্ঠায় ভূমিকা রাখে।</p><div class=\"h hs hs2\">৮। ধনী-দরিদ্রের মধ্যে ভ্রাতৃত্ব ও ভালোবাসা সৃষ্টি</div><p>যাকাত ধনী ও দরিদ্রের মধ্যে পারস্পরিক ভালোবাসা, সহমর্মিতা ও ভ্রাতৃত্ববোধ সৃষ্টি করে। ধনীরা যখন দরিদ্রদের প্রয়োজন পূরণে এগিয়ে আসে, তখন দরিদ্রদের মধ্যে ধনীদের প্রতি ভালোবাসা ও শ্রদ্ধা জন্মায়। ফলে সমাজে হিংসা, বিদ্বেষ ও শ্রেণিগত দূরত্ব কমে যায়।</p><div class=\"h hs hs2\">৯। সামাজিক অপরাধ ও অস্থিরতা হ্রাস</div><p>দারিদ্র্য ও চরম অভাব অনেক সময় মানুষকে চুরি, ডাকাতি, ছিনতাই ও অন্যান্য অপরাধের দিকে ঠেলে দেয়। যাকাতের মাধ্যমে দরিদ্র মানুষের মৌলিক চাহিদা পূরণ হলে এসব অপরাধের প্রবণতা কমতে পারে। ফলে সমাজে শান্তি, নিরাপত্তা ও স্থিতিশীলতা প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">১০। অসহায় ও বিপদগ্রস্ত মানুষের সহযোগিতা</div><p class=\"bh\"><b>সমাজে অনেক মানুষ ঋণগ্রস্ত, মুসাফির, অসহায় ও বিপদগ্রস্ত অবস্থায় জীবনযাপন করে। যাকাতের অর্থ এসব মানুষের সাহায্যে ব্যয় করা যায়। পবিত্র কুরআনে যাকাতের আটটি খাত নির্ধারণ করা হয়েছে। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ</div></div><p>অর্থ: সদকা (যাকাত) কেবল ফকির, মিসকিন, যাকাত আদায়কারী কর্মচারী, যাদের অন্তর আকৃষ্ট করা প্রয়োজন, দাসমুক্তি, ঋণগ্রস্ত, আল্লাহর পথে এবং মুসাফিরদের জন্য নির্ধারিত। (সূরা আত-তাওবা: ৬০)</p><p>এ আয়াত থেকে যাকাতের আটটি খাত এবং সমাজের বিভিন্ন শ্রেণির মানুষের কল্যাণে এর ভূমিকা প্রমাণিত হয়।</p><div class=\"h hm\">যাকাতের অর্থনৈতিক গুরুত্ব</div><div class=\"h hs hs2\">১১। সম্পদের সুষম বণ্টন নিশ্চিত করা</div><p>যাকাত ইসলামের অর্থনৈতিক ব্যবস্থার একটি গুরুত্বপূর্ণ ভিত্তি। এর মাধ্যমে ধনীদের সম্পদের একটি নির্দিষ্ট অংশ সমাজের দরিদ্র ও অভাবী মানুষের কাছে পৌঁছে যায়। ফলে সম্পদ অল্পসংখ্যক মানুষের হাতে কেন্দ্রীভূত হওয়ার প্রবণতা কমে এবং অর্থনৈতিক ভারসাম্য প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">১২। অর্থনৈতিক বৈষম্য দূরীকরণ</div><p>সমাজে ধনী ও দরিদ্রের মধ্যে অতিরিক্ত ব্যবধান অর্থনৈতিক ও সামাজিক অস্থিরতা সৃষ্টি করে। যাকাত ধনীদের সম্পদ থেকে দরিদ্রদের অধিকার প্রদান করে এ বৈষম্য কমাতে সাহায্য করে। এর ফলে সমাজের নিম্ন আয়ের মানুষও অর্থনৈতিক কর্মকাণ্ডে অংশগ্রহণের সুযোগ পায় এবং জীবনযাত্রার মান উন্নত করতে পারে।</p><div class=\"h hs hs2\">১৩। উৎপাদন ও কর্মসংস্থান বৃদ্ধি</div><p>যাকাতের অর্থ দরিদ্র ও অসহায় মানুষকে শুধু তাৎক্ষণিক সাহায্য দেওয়ার জন্য নয়, বরং তাদের স্বাবলম্বী করে তোলার ক্ষেত্রেও ব্যবহার করা যেতে পারে। যোগ্য ব্যক্তিকে ব্যবসার পুঁজি, প্রয়োজনীয় যন্ত্রপাতি বা উৎপাদন উপকরণ প্রদান করা হলে সে নিজেই আয় করার সুযোগ পায়। ফলে নতুন কর্মসংস্থান সৃষ্টি হয় এবং অর্থনৈতিক উৎপাদন বৃদ্ধি পায়।</p><div class=\"h hs hs2\">১৪। অর্থনৈতিক কর্মকাণ্ডে গতিশীলতা সৃষ্টি</div><p>সম্পদ দীর্ঘদিন অকার্যকরভাবে জমা করে রাখার পরিবর্তে যাকাত আদায়ের কারণে সম্পদের একটি অংশ সমাজের বিভিন্ন শ্রেণির মানুষের কাছে পৌঁছে যায়। দরিদ্র মানুষ সেই অর্থ খাদ্য, বস্ত্র, চিকিৎসা ও অন্যান্য প্রয়োজনীয় কাজে ব্যয় করে। এতে বাজারে চাহিদা বৃদ্ধি পায় এবং উৎপাদন ও বাণিজ্যিক কর্মকাণ্ডে গতিশীলতা সৃষ্টি হয়।</p><div class=\"h hs hs2\">১৫। ঋণগ্রস্ত মানুষের অর্থনৈতিক মুক্তি</div><p>অনেক মানুষ ব্যবসায়িক ক্ষতি, চিকিৎসা ব্যয় কিংবা পারিবারিক সমস্যার কারণে ঋণগ্রস্ত হয়ে পড়ে। যাকাতের একটি নির্ধারিত খাত হলো ঋণগ্রস্ত ব্যক্তি। এ খাত থেকে যোগ্য ঋণগ্রস্ত ব্যক্তিকে সহযোগিতা করলে সে ঋণের বোঝা থেকে মুক্তি পেতে পারে এবং স্বাভাবিক জীবনযাপনে ফিরে আসতে পারে। ফলে সমাজে আর্থিক স্থিতিশীলতা বৃদ্ধি পায়।</p><div class=\"h hs hs2\">১৬। জাতীয় অর্থনৈতিক উন্নয়নে ভূমিকা</div><p>যাকাতের সুষ্ঠু সংগ্রহ ও বণ্টন একটি দেশের অর্থনৈতিক উন্নয়নে গুরুত্বপূর্ণ ভূমিকা রাখতে পারে। এর মাধ্যমে দরিদ্র মানুষের ক্রয়ক্ষমতা বৃদ্ধি পায়, ক্ষুদ্র ব্যবসা ও উৎপাদনমূলক কর্মকাণ্ড সম্প্রসারিত হয় এবং অর্থনৈতিক বৈষম্য হ্রাস পায়। পরিকল্পিতভাবে যাকাত ব্যবস্থাপনা করা হলে দারিদ্র্য বিমোচন ও জনকল্যাণমূলক অর্থনৈতিক উন্নয়ন ত্বরান্বিত হতে পারে।</p><div class=\"h hs hs2\">১৭। ভিক্ষাবৃত্তি ও পরনির্ভরশীলতা হ্রাস</div><p>যাকাতের অন্যতম উদ্দেশ্য হলো অভাবী মানুষকে স্বাবলম্বী করে তোলা। যাকাতের অর্থ দিয়ে দরিদ্র ব্যক্তিকে কাজের উপকরণ, ব্যবসার পুঁজি কিংবা জীবিকা অর্জনের উপযুক্ত ব্যবস্থা করে দেওয়া হলে সে অন্যের ওপর নির্ভরশীল না থেকে নিজেই উপার্জন করতে পারে। ফলে ভিক্ষাবৃত্তি ও পরনির্ভরশীলতা কমে যায়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, যাকাত ইসলামের একটি গুরুত্বপূর্ণ আর্থিক ইবাদত, যার ধর্মীয়, সামাজিক ও অর্থনৈতিক গুরুত্ব অপরিসীম। এটি মানুষের সম্পদ ও আত্মাকে পবিত্র করে, আল্লাহর সন্তুষ্টি অর্জনে সহায়তা করে এবং পরকালীন মুক্তির পথ সুগম করে। পাশাপাশি দারিদ্র্য বিমোচন, সামাজিক সাম্য প্রতিষ্ঠা, ধনী-দরিদ্রের সম্পর্ক উন্নয়ন, সম্পদের সুষম বণ্টন ও অর্থনৈতিক উন্নয়নে গুরুত্বপূর্ণ ভূমিকা পালন করে। তাই যাকাতকে কেবল ব্যক্তিগত ইবাদত হিসেবে সীমাবদ্ধ না রেখে এর সুষ্ঠু সংগ্রহ ও যথাযথ বণ্টনের মাধ্যমে একটি ন্যায়ভিত্তিক, দারিদ্র্যমুক্ত ও কল্যাণমুখী সমাজ প্রতিষ্ঠায় কার্যকর ভূমিকা পালন করা উচিত।</p>"], ["কুরআন ও সুন্নাহর আলোকে পিতামাতা এবং সন্তানদের অধিকার, দায়িত্ব ও কর্তব্যসমূহ আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>পরিবার মানবসমাজের মৌলিক ভিত্তি। একটি আদর্শ পরিবার গঠনের জন্য পিতামাতা ও সন্তানদের মধ্যে পারস্পরিক ভালোবাসা, শ্রদ্ধা, দায়িত্ববোধ ও নৈতিক সম্পর্ক থাকা অপরিহার্য। ইসলাম পিতামাতাকে সন্তানের প্রতি স্নেহ, লালন-পালন ও সুশিক্ষা প্রদানের নির্দেশ দিয়েছে। একইভাবে সন্তানদের ওপর পিতামাতার প্রতি শ্রদ্ধা, আনুগত্য ও সেবা করার দায়িত্ব অর্পণ করেছে। পবিত্র কুরআন ও রাসূলুল্লাহ (সা.)-এর সুন্নাহতে উভয়ের অধিকার ও কর্তব্য অত্যন্ত গুরুত্বের সঙ্গে বর্ণিত হয়েছে। তাই একটি সুন্দর ও শান্তিপূর্ণ পরিবার গঠনে পিতামাতা ও সন্তানদের পারস্পরিক অধিকার ও দায়িত্ব পালন করা অত্যন্ত জরুরি।</p><div class=\"h hm\">পিতামাতার অধিকার, দায়িত্ব ও কর্তব্য</div><div class=\"h hs hs2\">১। সন্তানের প্রতি পিতামাতার স্নেহ ও ভালোবাসা</div><p>সন্তানের প্রতি স্নেহ, মমতা ও ভালোবাসা প্রদর্শন পিতামাতার অন্যতম দায়িত্ব। সন্তানকে ভালোবাসা, তার মানসিক বিকাশে সহযোগিতা করা এবং তার সঙ্গে কোমল আচরণ করা ইসলামের শিক্ষা। রাসূলুল্লাহ (সা.) শিশুদের অত্যন্ত স্নেহ করতেন। তিনি শিশুদের আদর করতেন এবং তাদের প্রতি দয়া প্রদর্শন করতেন।</p><p>একবার রাসূলুল্লাহ (সা.) হজরত হাসান (রা.)-কে চুম্বন করলেন। তখন এক ব্যক্তি বলল, আমার দশটি সন্তান রয়েছে, আমি তাদের কাউকে চুম্বন করি না। রাসূলুল্লাহ (সা.) বললেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ لَا يَرْحَمْ لَا يُرْحَمْ</div></div><p>অর্থ: যে দয়া করে না, তার প্রতিও দয়া করা হয় না। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>এ হাদিস থেকে বোঝা যায়, সন্তানদের প্রতি স্নেহ ও দয়া প্রদর্শন করা পিতামাতার গুরুত্বপূর্ণ দায়িত্ব।</p><div class=\"h hs hs2\">২। সন্তানের ভরণপোষণের ব্যবস্থা করা</div><p>সন্তানের খাদ্য, বস্ত্র, বাসস্থান, চিকিৎসা ও প্রয়োজনীয় অন্যান্য ব্যয়ভার বহন করা পিতার অন্যতম দায়িত্ব। সন্তান যতদিন নিজের ভরণপোষণে সক্ষম না হয়, ততদিন তার প্রয়োজনীয় ব্যয়ভার বহন করতে হবে। পিতামাতার দায়িত্ব হলো সন্তানকে অভাব-অনটন থেকে যথাসম্ভব রক্ষা করা এবং তার মৌলিক চাহিদা পূরণ করা।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ</div></div><p>অর্থ: সন্তানের পিতার ওপর বিধিসম্মতভাবে মায়েদের খাদ্য ও পোশাকের ব্যবস্থা করা কর্তব্য। (সূরা আল-বাকারা: ২৩৩)</p><p>এ আয়াত থেকে পরিবারের ভরণপোষণের দায়িত্ব সম্পর্কে গুরুত্বপূর্ণ নির্দেশনা পাওয়া যায়।</p><div class=\"h hs hs2\">৩। সন্তানের উত্তম নাম রাখা</div><p>সন্তানের জন্মের পর তার একটি সুন্দর, অর্থবহ ও ইসলামী নাম রাখা পিতামাতার দায়িত্ব। নাম মানুষের পরিচয়ের গুরুত্বপূর্ণ অংশ। তাই এমন নাম রাখা উচিত, যার অর্থ সুন্দর এবং যার মধ্যে শিরক, কুফরি বা অশোভন কোনো অর্থ নেই। রাসূলুল্লাহ (সা.) সুন্দর নাম রাখার প্রতি গুরুত্ব দিয়েছেন। তিনি অনেক সাহাবির অনুপযুক্ত নাম পরিবর্তন করে সুন্দর নাম রেখেছিলেন।</p><div class=\"h hs hs2\">৪। সন্তানের ধর্মীয় ও নৈতিক শিক্ষা প্রদান</div><p>সন্তানকে ইসলামের মৌলিক শিক্ষা, ঈমান, আকিদা, সালাত, সাওম, কুরআন তিলাওয়াত, হালাল-হারাম এবং উত্তম চরিত্র সম্পর্কে শিক্ষা দেওয়া পিতামাতার গুরুত্বপূর্ণ দায়িত্ব। শুধু পার্থিব শিক্ষায় শিক্ষিত করাই যথেষ্ট নয়; বরং সন্তানকে নৈতিক ও ধর্মীয় শিক্ষায় গড়ে তুলতে হবে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا</div></div><p>অর্থ: হে মুমিনগণ! তোমরা নিজেদের এবং তোমাদের পরিবার-পরিজনকে জাহান্নামের আগুন থেকে রক্ষা করো। (সূরা আত-তাহরিম: ৬)</p><p>এ আয়াত থেকে প্রমাণিত হয়, পরিবারকে জাহান্নামের শাস্তি থেকে রক্ষার জন্য ইসলামী শিক্ষা ও সৎকর্মের প্রশিক্ষণ দেওয়া পিতামাতার দায়িত্ব।</p><div class=\"h hs hs2\">৫। সন্তানদের মধ্যে ন্যায়বিচার প্রতিষ্ঠা করা</div><p>পিতামাতার উচিত সব সন্তানের প্রতি ন্যায়সংগত আচরণ করা। কোনো সন্তানকে অযথা বেশি ভালোবাসা বা সম্পদ দেওয়ার মাধ্যমে অন্য সন্তানদের প্রতি অবিচার করা উচিত নয়। উপহার, স্নেহ ও আচরণের ক্ষেত্রে ন্যায়বিচার বজায় রাখতে হবে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اتَّقُوا اللَّهَ وَاعْدِلُوا بَيْنَ أَوْلَادِكُمْ</div></div><p>অর্থ: তোমরা আল্লাহকে ভয় করো এবং তোমাদের সন্তানদের মধ্যে ন্যায়বিচার প্রতিষ্ঠা করো। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>এ হাদিস থেকে সন্তানদের মধ্যে সমতা ও ন্যায়বিচার প্রতিষ্ঠার গুরুত্ব সুস্পষ্টভাবে প্রমাণিত হয়।</p><div class=\"h hs hs2\">৬। সন্তানের শারীরিক ও মানসিক নিরাপত্তা নিশ্চিত করা</div><p>সন্তানের সুস্থ বিকাশের জন্য তার শারীরিক ও মানসিক নিরাপত্তা নিশ্চিত করা পিতামাতার দায়িত্ব। সন্তানকে নির্যাতন, অবহেলা, অপমান ও ক্ষতিকর পরিবেশ থেকে রক্ষা করতে হবে। তার সমস্যা মনোযোগ দিয়ে শুনতে হবে এবং বয়স ও সামর্থ্য অনুযায়ী তাকে সঠিক পরামর্শ দিতে হবে। সন্তানকে ভয় দেখিয়ে নয়, বরং ভালোবাসা ও উত্তম পদ্ধতিতে শাসন ও সংশোধন করা উচিত।</p><div class=\"h hs hs2\">৭। সন্তানের বিবাহের উপযুক্ত ব্যবস্থা করা</div><p>সন্তান প্রাপ্তবয়স্ক হলে এবং বিবাহের প্রয়োজন দেখা দিলে পিতামাতার দায়িত্ব হলো তার জন্য উপযুক্ত জীবনসঙ্গী নির্বাচনে সহযোগিতা করা। বিবাহের ক্ষেত্রে সন্তানের সম্মতি, দ্বীনদারি, চরিত্র ও কল্যাণকে গুরুত্ব দিতে হবে। জোরপূর্বক বিবাহ দেওয়া বা অযৌক্তিক কারণে বিবাহে বাধা দেওয়া উচিত নয়।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا مَعْشَرَ الشَّبَابِ، مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ فَلْيَتَزَوَّجْ</div></div><p>অর্থ: হে যুবসমাজ! তোমাদের মধ্যে যে বিবাহের সামর্থ্য রাখে, সে যেন বিবাহ করে। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class=\"h hm\">সন্তানের অধিকার, দায়িত্ব ও কর্তব্য</div><div class=\"h hs hs2\">৮। পিতামাতার প্রতি সদাচরণ করা</div><p>পিতামাতার সঙ্গে সদাচরণ করা সন্তানের অন্যতম প্রধান দায়িত্ব। তাঁদের সঙ্গে নম্রভাবে কথা বলা, সম্মান করা, তাঁদের কষ্ট না দেওয়া এবং তাঁদের প্রয়োজনের প্রতি খেয়াল রাখা সন্তানের কর্তব্য। মহান আল্লাহ নিজের ইবাদতের নির্দেশের পরপরই পিতামাতার সঙ্গে সদাচরণের নির্দেশ দিয়েছেন।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا</div></div><p>অর্থ: তোমার প্রতিপালক আদেশ দিয়েছেন যে, তোমরা তিনি ছাড়া অন্য কারও ইবাদত করবে না এবং পিতামাতার সঙ্গে সদ্ব্যবহার করবে। (সূরা আল-ইসরা: ২৩)</p><p>এ আয়াত থেকে বোঝা যায়, আল্লাহর ইবাদতের পর পিতামাতার সঙ্গে সদাচরণের গুরুত্ব অত্যন্ত বেশি।</p><div class=\"h hs hs2\">৯। পিতামাতার সঙ্গে কোমল ভাষায় কথা বলা</div><p class=\"bh\"><b>সন্তানের উচিত পিতামাতার সঙ্গে সর্বদা বিনয়ী ও নম্র ভাষায় কথা বলা। তাঁদের সামনে বিরক্তি প্রকাশ করা, ধমক দেওয়া কিংবা অসম্মানজনক আচরণ করা সম্পূর্ণ নিষিদ্ধ। মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا</div></div><p>অর্থ: তাদের উভয়ের প্রতি বিরক্তিসূচক শব্দও বলো না, তাদের ধমক দিও না এবং তাদের সঙ্গে সম্মানজনক কথা বলো। (সূরা আল-ইসরা: ২৩)</p><p>এ আয়াত পিতামাতার সঙ্গে উত্তম আচরণ ও সম্মানজনক ভাষা ব্যবহারের সুস্পষ্ট নির্দেশনা প্রদান করে।</p><div class=\"h hs hs2\">১০। পিতামাতার আনুগত্য করা</div><p>ইসলাম পিতামাতার বৈধ ও ন্যায়সংগত নির্দেশ পালন করার আদেশ দিয়েছে। তাঁদের প্রয়োজনীয় কাজে সহযোগিতা করা, তাঁদের উপদেশ গ্রহণ করা এবং তাঁদের সন্তুষ্টি অর্জনের চেষ্টা করা সন্তানের দায়িত্ব। তবে পিতামাতা যদি আল্লাহর অবাধ্যতা বা শরিয়তবিরোধী কোনো কাজের নির্দেশ দেন, তাহলে সে নির্দেশ পালন করা যাবে না। এ ক্ষেত্রে তাঁদের সঙ্গে সদাচরণ বজায় রাখতে হবে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنْ جَاهَدَاكَ عَلَىٰ أَنْ تُشْرِكَ بِي مَا لَيْسَ لَكَ بِهِ عِلْمٌ فَلَا تُطِعْهُمَا وَصَاحِبْهُمَا فِي الدُّنْيَا مَعْرُوفًا</div></div><p>অর্থ: আর যদি তারা তোমাকে আমার সঙ্গে এমন কিছুকে শরিক করতে বাধ্য করে, যে বিষয়ে তোমার কোনো জ্ঞান নেই, তবে তাদের আনুগত্য করো না; তবে দুনিয়াতে তাদের সঙ্গে সদ্ভাবে বসবাস করো। (সূরা লুকমান: ১৫)</p><p>এ আয়াত থেকে বোঝা যায়, আল্লাহর অবাধ্যতার ক্ষেত্রে পিতামাতার নির্দেশ পালন করা যাবে না; কিন্তু তাঁদের সঙ্গে সদাচরণ করতে হবে।</p><div class=\"h hs hs2\">১১। পিতামাতার সেবা ও ভরণপোষণ করা</div><p>পিতামাতা বৃদ্ধ, অসুস্থ কিংবা অসহায় হয়ে পড়লে তাঁদের সেবা-যত্ন করা সন্তানের গুরুত্বপূর্ণ দায়িত্ব। তাঁদের চিকিৎসা, খাদ্য, পোশাক ও প্রয়োজনীয় ব্যয়ের ব্যবস্থা করা উচিত। বিশেষ করে তাঁরা যখন বার্ধক্যে উপনীত হন, তখন তাঁদের প্রতি আরও বেশি যত্নবান হতে হবে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا</div></div><p>অর্থ: আর মমতাবশত তাদের প্রতি বিনয়ের ডানা অবনত করো এবং বলো, হে আমার প্রতিপালক! তাঁদের উভয়ের প্রতি দয়া করুন, যেভাবে শৈশবে তাঁরা আমাকে লালন-পালন করেছেন। (সূরা আল-ইসরা: ২৪)</p><div class=\"h hs hs2\">১২। পিতামাতার জন্য দোয়া ও ক্ষমা প্রার্থনা করা</div><p>জীবিত ও মৃত উভয় অবস্থায় পিতামাতার জন্য দোয়া করা সন্তানের অন্যতম দায়িত্ব। তাঁদের সুস্থতা, দীর্ঘায়ু, কল্যাণ ও ক্ষমার জন্য আল্লাহর কাছে প্রার্থনা করতে হবে। তাঁরা মৃত্যুবরণ করলে তাঁদের জন্য মাগফিরাত কামনা করা, তাঁদের বৈধ অসিয়ত পূরণ করা এবং তাঁদের আত্মীয়স্বজন ও বন্ধুদের সঙ্গে সদাচরণ করা উচিত।</p><p>কুরআনে পিতামাতার জন্য দোয়া শিক্ষা দেওয়া হয়েছে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا</div></div><p>অর্থ: হে আমার প্রতিপালক! তাঁদের উভয়ের প্রতি দয়া করুন, যেভাবে শৈশবে তাঁরা আমাকে লালন-পালন করেছেন। (সূরা আল-ইসরা: ২৪)</p><div class=\"h hs hs2\">১৩। পিতামাতার সম্মান ও মর্যাদা রক্ষা করা</div><p>সন্তানের উচিত নিজের কথা, কাজ ও আচরণের মাধ্যমে পিতামাতার সম্মান রক্ষা করা। তাঁদের সম্পর্কে অন্যের সামনে অসম্মানজনক কথা বলা, তাঁদের বদনাম করা কিংবা তাঁদের সামাজিক মর্যাদা ক্ষুণ্ন হয় এমন কাজ করা থেকে বিরত থাকতে হবে। তাঁদের আত্মীয়স্বজন ও বন্ধুদের সঙ্গেও ভালো আচরণ করা উচিত।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">رِضَا الرَّبِّ فِي رِضَا الْوَالِدِ، وَسَخَطُ الرَّبِّ فِي سَخَطِ الْوَالِدِ</div></div><p>অর্থ: পিতার সন্তুষ্টিতে আল্লাহর সন্তুষ্টি এবং পিতার অসন্তুষ্টিতে আল্লাহর অসন্তুষ্টি নিহিত। (জামে আত-তিরমিজি)</p><div class=\"h hs hs2\">১৪। পিতামাতার মৃত্যুর পরও তাঁদের অধিকার আদায় করা</div><p>পিতামাতা মৃত্যুবরণ করলেও তাঁদের প্রতি সন্তানের দায়িত্ব সম্পূর্ণ শেষ হয়ে যায় না। তাঁদের জন্য দোয়া করা, তাঁদের পক্ষ থেকে বৈধ সদকা করা, তাঁদের ঋণ পরিশোধে সহযোগিতা করা এবং তাঁদের আত্মীয়স্বজনের সঙ্গে সম্পর্ক বজায় রাখা সন্তানের কর্তব্য।</p><p>এক ব্যক্তি রাসূলুল্লাহ (সা.)-কে জিজ্ঞাসা করলেন, পিতামাতার মৃত্যুর পরও তাঁদের সঙ্গে সদাচরণের কোনো সুযোগ আছে কি? রাসূলুল্লাহ (সা.) জানালেন, হ্যাঁ। তাঁদের জন্য দোয়া ও ইস্তিগফার করা, তাঁদের অঙ্গীকার পূরণ করা, তাঁদের আত্মীয়তার সম্পর্ক বজায় রাখা এবং তাঁদের বন্ধুদের সম্মান করা। (সুনান আবু দাউদ)</p><div class=\"h hs hs2\">১৫। পিতামাতা ও সন্তানের পারস্পরিক অধিকার রক্ষা করা</div><p>ইসলামে পিতামাতা ও সন্তানের সম্পর্ক একতরফা নয়; বরং এটি পারস্পরিক অধিকার ও দায়িত্বের ওপর প্রতিষ্ঠিত। পিতামাতা যেমন সন্তানের প্রতি স্নেহ, ন্যায়বিচার, ভরণপোষণ ও সুশিক্ষা প্রদানে দায়িত্বশীল, তেমনি সন্তানও পিতামাতার প্রতি শ্রদ্ধা, আনুগত্য, সেবা ও সদাচরণে দায়িত্বশীল। উভয়ের উচিত একে অপরের অধিকার সম্পর্কে সচেতন থাকা এবং পারিবারিক জীবনে ইসলামের নির্দেশনা অনুসরণ করা।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ</div></div><p>অর্থ: তোমাদের প্রত্যেকেই দায়িত্বশীল এবং প্রত্যেককে তার দায়িত্বাধীন ব্যক্তিদের সম্পর্কে জিজ্ঞাসা করা হবে। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>এ হাদিস থেকে প্রমাণিত হয়, পিতামাতা ও সন্তান উভয়েই নিজ নিজ দায়িত্ব পালনের জন্য আল্লাহর কাছে জবাবদিহি করবে।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, পিতামাতা ও সন্তানদের পারস্পরিক অধিকার ও দায়িত্ব ইসলামী পারিবারিক ব্যবস্থার অন্যতম গুরুত্বপূর্ণ ভিত্তি। পিতামাতার দায়িত্ব হলো সন্তানকে স্নেহ, ভালোবাসা, ভরণপোষণ, শিক্ষা ও উত্তম চরিত্রের মাধ্যমে আদর্শ মানুষ হিসেবে গড়ে তোলা। অন্যদিকে সন্তানের দায়িত্ব হলো পিতামাতার প্রতি শ্রদ্ধা, আনুগত্য, সেবা ও সদাচরণ প্রদর্শন করা। কুরআন ও সুন্নাহর এসব নির্দেশনা যথাযথভাবে পালন করা হলে পরিবারে শান্তি, ভালোবাসা, শৃঙ্খলা ও নৈতিকতা প্রতিষ্ঠিত হবে। তাই প্রত্যেক মুসলমানের উচিত পিতামাতা ও সন্তানের পারস্পরিক অধিকার আদায়ে সচেষ্ট হওয়া এবং ইসলামের নির্দেশনা অনুযায়ী আদর্শ পরিবার গড়ে তোলা।</p>"], ["নবুওয়াত ও রিসালাতের পরিচয় দাও। রাসুলগণকে প্রেরণ করার হিকমত কী? প্রমাণ কর যে, মুহাম্মদ (সা.) সর্বশেষ ও সর্বশ্রেষ্ঠ নবী।", "<div class='h hm'>ভূমিকা</div><p>আল্লাহ তাআলা মানবজাতিকে সঠিক পথ প্রদর্শন এবং ইহকাল ও পরকালের কল্যাণের জন্য যুগে যুগে অসংখ্য নবী ও রাসূল প্রেরণ করেছেন। তাঁরা মানুষকে তাওহীদের শিক্ষা দিয়েছেন, সত্য ও মিথ্যার পার্থক্য বুঝিয়েছেন এবং আল্লাহর বিধান অনুযায়ী জীবন পরিচালনার দিকনির্দেশনা দিয়েছেন। নবুওয়াত ও রিসালাত ইসলামের মৌলিক আকিদার গুরুত্বপূর্ণ দুটি বিষয়। এ দুটি বিষয়ের মাধ্যমে আল্লাহর পক্ষ থেকে মানবজাতির কাছে হিদায়াতের বাণী পৌঁছেছে। নিম্নে নবুওয়াত ও রিসালাতের পরিচয়, রাসূলগণকে প্রেরণের হিকমত এবং হজরত মুহাম্মদ (সা.)-এর সর্বশেষ ও সর্বশ্রেষ্ঠ নবী হওয়ার বিষয়টি আলোচনা করা হলো।</p><div class='h hm'>নবুওয়াত (النُّبُوَّةُ)-এর পরিচয়</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>نُبُوَّة শব্দটি আরবি। এটি نَبَأٌ শব্দ থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْخَبَرُ — সংবাদ।</p><p>২। النَّبَأُ الْعَظِيمُ — গুরুত্বপূর্ণ সংবাদ।</p><p>৩। الْإِخْبَارُ — সংবাদ প্রদান করা।</p><p>৪। الرِّفْعَةُ — উচ্চ মর্যাদা ও সম্মান।</p><p>৫। الْمَنْزِلَةُ الْعَالِيَةُ — উচ্চ অবস্থান ও মর্যাদা।</p><p>ইংরেজি অর্থ: Prophethood, Prophetship.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>নবুওয়াতের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class='bh'><b>১। ইমাম আল-জুরজানি (র.)-এর সংজ্ঞার মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>النَّبِيُّ هُوَ إِنْسَانٌ اصْطَفَاهُ اللَّهُ تَعَالَى، وَأَوْحَى إِلَيْهِ بِشَرْعٍ لِيَهْدِيَ النَّاسَ إِلَى طَرِيقِ الْحَقِّ.</div></div><p>অর্থ: নবী হলেন এমন একজন মানুষ, যাঁকে আল্লাহ তাআলা মনোনীত করেছেন এবং মানুষের কাছে সত্যের পথের দিকনির্দেশনা দেওয়ার জন্য তাঁর প্রতি শরিয়তসংক্রান্ত ওহি অবতীর্ণ করেছেন।</p><p class='bh'><b>২। ইমাম ইবনে তাইমিয়্যাহ (র.)-এর বক্তব্যের মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>النَّبِيُّ هُوَ مَنْ أَوْحَى اللَّهُ إِلَيْهِ، وَأَرْسَلَهُ لِهُدَى عِبَادِهِ وَدَعْوَتِهِمْ إِلَى عِبَادَتِهِ.</div></div><p>অর্থ: নবী হলেন এমন ব্যক্তি, যাঁর প্রতি আল্লাহ ওহি প্রেরণ করেছেন এবং তাঁর বান্দাদের হিদায়াত ও নিজের ইবাদতের দিকে আহ্বান করার জন্য তাঁকে মনোনীত করেছেন।</p><div class='h hm'>রিসালাত (الرِّسَالَةُ)-এর পরিচয়</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>رِسَالَة শব্দটি আরবি। এটি رَسَلَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْإِرْسَالُ — প্রেরণ করা।</p><p>২। التَّبْلِيغُ — পৌঁছে দেওয়া।</p><p>৩। الْبَعْثُ — পাঠানো বা প্রেরণ করা।</p><p>৪। الْمُرَاسَلَةُ — পত্র বা বার্তা আদান-প্রদান করা।</p><p>৫। الرِّسَالَةُ — বার্তা বা প্রেরিত বাণী।</p><p>ইংরেজি অর্থ: Apostleship, Messengership, Message.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>রিসালাতের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্যের মর্ম নিম্নরূপ—</p><p class='bh'><b>১। ইমাম আল-জুরজানি (র.)-এর সংজ্ঞার মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الرَّسُولُ هُوَ مَنْ بَعَثَهُ اللَّهُ تَعَالَى إِلَى خَلْقِهِ لِتَبْلِيغِ أَحْكَامِهِ وَشَرْعِهِ.</div></div><p>অর্থ: রাসূল হলেন এমন ব্যক্তি, যাঁকে আল্লাহ তাআলা তাঁর সৃষ্টির কাছে নিজের বিধান ও শরিয়ত পৌঁছে দেওয়ার জন্য প্রেরণ করেছেন।</p><p class='bh'><b>২। ইমাম ইবনে তাইমিয়্যাহ (র.)-এর বক্তব্যের মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الرَّسُولُ هُوَ مَنْ أَرْسَلَهُ اللَّهُ تَعَالَى إِلَى قَوْمٍ لِيَدْعُوَهُمْ إِلَى تَوْحِيدِهِ وَطَاعَتِهِ وَيُبَلِّغَهُمْ رِسَالَتَهُ.</div></div><p>অর্থ: রাসূল হলেন এমন ব্যক্তি, যাঁকে আল্লাহ তাআলা কোনো জাতির কাছে তাঁর একত্ববাদ ও আনুগত্যের দিকে আহ্বান করার এবং তাঁর বাণী পৌঁছে দেওয়ার জন্য প্রেরণ করেছেন।</p><div class='h hm'>নবুওয়াত ও রিসালাতের পার্থক্য</div><p>নবুওয়াত ও রিসালাত পরস্পর ঘনিষ্ঠ সম্পর্কযুক্ত হলেও উভয়ের মধ্যে কিছু পার্থক্য রয়েছে।</p><p>১। নবুওয়াত হলো আল্লাহর পক্ষ থেকে ওহি ও নবুয়তি মর্যাদা লাভ করা; আর রিসালাত হলো আল্লাহর পক্ষ থেকে বিশেষ বার্তা ও বিধান নিয়ে মানুষের কাছে প্রেরিত হওয়া।</p><p>২। প্রত্যেক রাসূলই নবী; কিন্তু প্রত্যেক নবী রাসূল নন—এটি অধিকাংশ আকিদাবিদ আলেমের প্রসিদ্ধ মত।</p><p>৩। নবুওয়াতের মূল বিষয় হলো আল্লাহর পক্ষ থেকে মনোনয়ন ও ওহি লাভ; আর রিসালাতের মূল বিষয় হলো আল্লাহর বাণী মানুষের কাছে পৌঁছে দেওয়ার দায়িত্ব।</p><p>৪। নবী ও রাসূল উভয়েই আল্লাহর মনোনীত ওহিপ্রাপ্ত বান্দা এবং মানবজাতির হিদায়াতের পথপ্রদর্শক।</p><div class='h hm'>রাসূলগণকে প্রেরণের হিকমত</div><p>আল্লাহ তাআলা মানবজাতির হিদায়াত ও কল্যাণের জন্য নবী-রাসূল প্রেরণ করেছেন। তাঁদের প্রেরণের পেছনে বহু গুরুত্বপূর্ণ হিকমত রয়েছে। নিম্নে তা আলোচনা করা হলো—</p><div class='h hs hs2'>১। তাওহীদের শিক্ষা প্রদান</div><p>নবী-রাসূল প্রেরণের প্রধান উদ্দেশ্য হলো মানুষকে এক আল্লাহর ইবাদতের দিকে আহ্বান করা এবং শিরক থেকে বিরত রাখা। আল্লাহ তাআলা বলেন—</p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ.</div></div><p>অর্থ: নিশ্চয়ই আমি প্রত্যেক জাতির মধ্যে রাসূল পাঠিয়েছি এই নির্দেশ দিয়ে যে, তোমরা আল্লাহর ইবাদত করো এবং তাগুত থেকে দূরে থাকো। (সূরা আন-নাহল: ৩৬)</p><div class='h hs hs2'>২। আল্লাহর বিধান ও নির্দেশনা পৌঁছে দেওয়া</div><p>মানুষ যেন আল্লাহর আদেশ-নিষেধ সম্পর্কে জানতে পারে, সে জন্য নবী-রাসূল প্রেরণ করা হয়েছে। তাঁরা মানুষের কাছে আল্লাহর বিধান ওহির মাধ্যমে পৌঁছে দিয়েছেন এবং তা অনুসরণের নির্দেশ দিয়েছেন।</p><div class='h hs hs2'>৩। মানবজাতিকে সঠিক পথ প্রদর্শন</div><p>মানুষ অনেক সময় সত্য ও মিথ্যা, হালাল ও হারাম এবং ন্যায় ও অন্যায়ের মধ্যে পার্থক্য করতে পারে না। নবী-রাসূলগণ তাঁদের শিক্ষা ও আদর্শের মাধ্যমে মানুষকে সরল-সঠিক পথ দেখিয়েছেন।</p><div class='h hs hs2'>৪। সত্য ও মিথ্যার পার্থক্য স্পষ্ট করা</div><p>নবী-রাসূলগণ মানুষকে সত্য ও মিথ্যা, ঈমান ও কুফর এবং ন্যায় ও অন্যায়ের পার্থক্য বুঝিয়েছেন। ফলে মানুষ সঠিক সিদ্ধান্ত গ্রহণের সুযোগ পেয়েছে।</p><div class='h hs hs2'>৫। সুসংবাদ ও সতর্ক
