:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.08);--fs:16px;--a1:#0f766e;--a2:#0e7490}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mu:#94a3b8;--ln:#243049;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:12px 12px 18px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:6px;max-width:1000px;margin:0 auto}.top h1{flex:1;margin:0;font-size:21px;line-height:1.25}
.tb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 11px;backdrop-filter:blur(6px)}.tb:active{transform:scale(.94)}
header>p{max-width:1000px;margin:6px auto 0;color:rgba(255,255,255,.85)}
.hero{max-width:1000px;margin:14px auto 0;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 14px}
.ring{position:relative;flex:none;width:84px;height:84px}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}.st div{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 2px}.st b{display:block;font-size:20px;line-height:1.2}.st small{font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 10px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;margin:6px 0 8px}
.tile b{display:block;font-size:18px;line-height:1.25}.tile small{color:var(--mu);font-size:14px}.tile.off{opacity:.5}
.big{display:flex;gap:14px;align-items:center}.big .ic{margin:6px 0;flex:none}
.pb{height:7px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .4s}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 10px 8px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;max-width:1000px;margin:0 auto 8px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.zb{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:0 12px;font-weight:700}.chips{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:20px;padding:2px 12px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.strip{max-width:1000px;margin:8px auto 0;font-size:14px;color:var(--mu);display:flex;gap:10px;align-items:center}.strip .pb{flex:1;margin:0;--c:var(--a1)}
.sec{margin-bottom:22px}.sh{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px}
.sh span{margin-left:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh)}
.no{float:left;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin:1px 9px 2px 0}
.q{font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;cursor:pointer}.q::after{content:' ▾';color:var(--c)}.card.show .q::after{content:' ▴'}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;clear:both}.ib{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:0 10px;font-size:14px}
.card.bm .bm,.card.kn .kn{background:var(--c);color:#fff;border-color:var(--c)}.card.kn{opacity:.8}
.a{font-size:var(--fs);margin-top:8px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--tx);border-radius:12px;padding:6px 12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(-4px)}}
.hid .a{display:none}.hid .card.show .a{display:block}.a b{color:var(--c)}
.alw .q::after{content:none!important}.alw .q{cursor:default}.hid .a{cursor:pointer}
.a .h{font-weight:700;color:var(--c);margin:12px 0 2px;padding-left:8px;border-left:4px solid var(--c)}.a p{margin:2px 0 6px;text-align:justify}
.ay{margin:8px 0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--c);text-align:center}.ay .ar{font:400 calc(var(--fs)*1.4)/1.8 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif}.ay .rf{color:var(--mu);font-size:.9em}
.empty{text-align:center;color:var(--mu);padding:30px}
.zi{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:20px;padding:4px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}.zi.on{opacity:1}


.qt3{background:color-mix(in srgb,var(--c) 10%,var(--card));border:0;border-radius:28px;box-shadow:none;padding:12px 16px}.qt3 .no{border-radius:12px}
.qt6{background:#0b0f1a;color:#e8edf8;border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}.qt6 .no{box-shadow:0 0 10px var(--c)}
.at8 .a{background:color-mix(in srgb,var(--c) 8%,var(--card))}.at8 .a .h{background:var(--c);color:#fff;border:0;border-radius:0 16px 16px 0;margin-left:-12px;padding:2px 14px;display:inline-block}.at8 .ay{border:0;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.15);border-radius:6px}

:root{--bg:#f3f5f1;--card:#fff;--tx:#10231d;--mu:#667a72;--ln:#e3e9e4;--sh:0 1px 2px rgba(16,35,29,.05),0 8px 24px -8px rgba(16,35,29,.12);--r:22px}

body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -80px,color-mix(in srgb,var(--a1) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

.dtn .tb{width:auto;height:auto;min-width:104px;padding:11px 20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1.2;font-size:15px;font-weight:700;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));backdrop-filter:none;box-shadow:0 8px 16px -8px color-mix(in srgb,var(--a1) 80%,transparent)}
.dtn .tb:disabled{opacity:.35;box-shadow:none}
.dtn span{font-size:15px;font-weight:600;white-space:nowrap}
/* প্রশ্নের লেখার সাইজ স্থির (শুধু উত্তরের সাইজ বদলাবে) */
:root{--qfs:17px}
.card .q,.dt .card .q{font-size:var(--qfs)!important}
.card .q .aq{font-size:calc(var(--qfs)*1.45)!important}
/* সংখ্যা স্পষ্ট করা: প্রশ্নের নম্বরের মতো বোল্ড, সাদা, গাঢ় জমিনে */
.sub .tg em.ex,.sub .tg em.ex.done{color:#fff!important;font-weight:700;font-size:13.5px;letter-spacing:.1px;border:0;padding:2px 12px;background:linear-gradient(135deg,#d97706,#b45309)!important;box-shadow:0 4px 10px -4px rgba(180,83,9,.7)}
.sub .tg em.ex.done{background:linear-gradient(135deg,#64748b,#475569)!important;box-shadow:none}
.dtn span{min-width:78px;text-align:center;padding:5px 14px;border-radius:30px;color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px;background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 65%,#000));box-shadow:0 6px 12px -4px color-mix(in srgb,var(--a1) 70%,transparent)}
/* কার্ডের নিচের কোণায় চৌকা ছায়ার দাগ সরানো */
.cr .nx.cx,:root[data-theme=dark] .cr .nx.cx{box-shadow:none}
.cr{padding:0}
.go{box-shadow:0 6px 14px -4px color-mix(in srgb,var(--a1) 70%,transparent)}
.crn .cb,.crn button{border-radius:12px}
/* সাবজেক্ট/বিভাগ টাইল */
.list{gap:14px;counter-reset:n}
.tile{border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);background:var(--card);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.tile:hover{transform:translateY(-2px)}
.tile::before{height:100%;width:100%;inset:0;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 55%);opacity:.9;pointer-events:none}
.tile.sub{counter-increment:n;padding:14px 14px 14px 16px;gap:14px;border-radius:24px}
.tile.sub::before{inset:0;width:100%}
.tile.sub::after{content:counter(n,bengali);position:absolute;right:14px;top:10px;font-size:12px;font-weight:700;color:var(--c);opacity:.55;letter-spacing:.4px}
.sub .ic{width:54px;height:54px;border-radius:18px;font-size:23px;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.sub .mid b{font-size:18px;line-height:1.35;font-weight:700}
.sub .tg em{border-radius:30px;padding:1px 11px;font-size:12.5px;background:color-mix(in srgb,var(--c) 13%,var(--card));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.sub .ch{font-size:26px;opacity:.45;margin-top:14px}
.tile.sub.off{opacity:1;filter:saturate(.45)}
.tile.sub.off .mid b{color:var(--mu)}
.tile.sub.off .tg::after{content:'প্রশ্ন শীঘ্রই আসছে';font-size:12.5px;color:var(--mu);margin-left:2px;align-self:center}
.tile.sub:not(.off) .ch{opacity:.9}
.tile.big{border-radius:24px;padding:16px}
.tile.big .ic{width:52px;height:52px;border-radius:17px;margin:0;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.tile.big b{font-size:18px;font-weight:700}
.pb{height:6px;border-radius:6px}
/* নেভ + সার্চ + চিপ */
.nav{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent);padding:12px 14px 10px}
.nav .row,.chips,.strip,.seg{max-width:760px}
input{border-radius:16px;padding:11px 16px;background:var(--card);border:1px solid var(--ln);box-shadow:var(--sh);transition:.2s}
input:focus{outline:0;border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 18%,transparent)}
.zb{border-radius:14px;min-width:42px;background:var(--card);box-shadow:var(--sh);border-color:var(--ln)}
.zb.on{background:var(--a1);border-color:var(--a1)}
.chip{border:1px solid color-mix(in srgb,var(--c) 40%,var(--ln));background:color-mix(in srgb,var(--c) 8%,var(--card));padding:4px 14px;font-size:14px;font-weight:600;border-radius:30px}
.chip.on{background:var(--c);border-color:var(--c);box-shadow:0 8px 16px -8px var(--c)}
/* সেকশন হেডার */
.sec{margin-bottom:26px}
.sh{background:none;color:var(--c);padding:0 4px;font-size:15px;letter-spacing:.2px;gap:10px;text-transform:none}
.sh::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent)}
.sh::after{content:'';flex:1;order:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.sh span{order:2;margin-left:0;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);font-size:13px;font-weight:700;padding:1px 12px;border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
/* প্রশ্ন কার্ড */
.card{border:1px solid var(--ln);border-radius:22px;padding:16px 16px 14px;margin-top:12px;box-shadow:var(--sh);background:var(--card);position:relative;overflow:hidden;animation:up .45s both}
.card::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.no{width:32px;height:32px;margin:0 12px 0 0;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));box-shadow:0 6px 12px -4px color-mix(in srgb,var(--c) 70%,transparent);font-size:15px}
.card .q{overflow:hidden;min-height:32px;padding-right:30px;font-weight:600;font-size:calc(var(--fs) + 1px);line-height:1.8}
.card .q small{display:inline-block;margin-left:4px;letter-spacing:1px}
.mk{top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border-radius:12px;font-size:17px;padding:0;transition:.2s}
.card.bm .mk,.mk.on{background:color-mix(in srgb,#f59e0b 22%,transparent)}
.a{border-radius:16px}
.empty{border:1px dashed var(--ln);border-radius:20px;background:var(--card)}
.zi{border-radius:30px;backdrop-filter:blur(10px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.or{display:inline-block;font-size:12px;font-weight:700;line-height:1.6;padding:0 10px;margin-right:2px;border-radius:20px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);vertical-align:1px}
.zi{display:none!important}

.hb{display:inline-block;padding:2px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-weight:600;font-size:14px}
header:has(.hw) .top h1{font-size:28px;line-height:1.2}header:has(.hw)>p{margin-top:10px}header:has(.hw) .top h1,header:has(.hw)>p{text-align:center}
.hw{max-width:760px;margin:14px auto 0}
.hw a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.hw a:hover{background:rgba(255,255,255,.22)}.hw a:active{transform:scale(.98)}.hw a:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
.hw i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#5BE58A,#128C7E);border:2px solid rgba(255,255,255,.85);box-shadow:0 6px 14px -4px rgba(18,140,126,.7)}
.hw span{flex:1;min-width:0;line-height:1.3}.hw b{display:block;font-size:16.5px}.hw small{display:block;font-size:12.5px;opacity:.85}
.hw u{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:#0b5a45;display:grid;place-items:center;text-decoration:none}
/* ===== সাজেশন বাটন (ছোট ও স্মার্ট) ===== */
.hw{margin:12px auto 0}
.hw a{width:fit-content;min-width:236px;max-width:100%;margin:0 auto;justify-content:space-between;gap:14px;padding:5px 6px 5px 18px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.hw span{flex:none}
.hw b{font-size:14px;font-weight:700;letter-spacing:.1px;white-space:nowrap}
.hw i{width:32px;height:32px;border-width:1.5px;box-shadow:0 4px 10px -3px rgba(18,140,126,.8)}
.hw i svg{width:18px;height:18px}


/* IS2 headings & ref chips */
.a .h.hm{display:block;width:fit-content;max-width:100%;margin:18px auto 8px!important;padding:3px 22px!important;text-align:center;background:var(--c)!important;color:#fff!important;border:0!important;border-radius:999px!important;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--c) 70%,transparent)}
.a .h.hm *{color:#fff}
.a .h.hs{display:block;width:auto;max-width:100%;margin:14px 0 4px 0!important;padding:0 0 0 10px!important;text-align:left;background:none!important;color:var(--c)!important;border:0!important;border-left:4px solid var(--c)!important;border-radius:0!important;box-shadow:none}
.a .rfc{text-align:center;margin:6px 0 10px}.a .rfc span{display:inline-block;padding:0 14px;font-size:.78em;line-height:1.7;font-weight:600;border-radius:999px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}

/* ===== চার স্তরের হেডলাইন ===== */
/* ১. মূল হেডলাইন */
.card .a .h.hm{position:relative;display:block!important;width:100%!important;max-width:100%;margin:18px 0 8px!important;padding:3px 14px!important;text-align:center;line-height:1.5;font-weight:700;font-size:.97em;color:#fff!important;border:0!important;border-radius:10px!important;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 90%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000))!important;box-shadow:0 5px 10px -7px color-mix(in srgb,var(--c) 85%,transparent)!important}
.card .a .h.hm *{color:#fff!important}
/* ২. সাব হেডলাইন */
.card .a .h.hs{display:block!important;width:auto!important;max-width:100%;margin:16px 0 6px!important;padding:3px 12px!important;text-align:left;background:color-mix(in srgb,var(--c) 12%,transparent)!important;color:var(--c)!important;border:0!important;border-left:4px solid var(--c)!important;border-radius:0 10px 10px 0!important;box-shadow:none!important;font-weight:700;font-size:1em}
/* ৩. সেকেন্ড সাব হেডলাইন (আভিধানিক অর্থ, পারিভাষিক সংজ্ঞা ...) */
.card .a .h.hs.hs2{display:block!important;width:fit-content!important;margin:12px 0 4px 10px!important;padding:0 14px!important;background:none!important;color:var(--c)!important;border:1.5px solid var(--c)!important;border-radius:999px!important;font-weight:600;font-size:.94em}
/* ৪. বোল্ড হেডলাইন (কোন আলেম বলেছেন / বোল্ড করা লাইন) */
.card .a .h.hs.hs3,.card .a p.bh{position:relative;display:block!important;width:auto!important;margin:10px 0 4px 0!important;padding:0!important;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;text-align:left!important;color:var(--tx)!important;font-weight:700;font-size:1em}
.card .a p.bh b{color:var(--tx)}
.at8 .ay.ay0{border-top:0!important}
/* ===== শব্দে শব্দে অনুবাদ বিভাগ: পাশের ফাঁকা কমানো ও সাজানো ===== */
.card:has(.wsw,.jz){padding:12px 8px 10px}
.card:has(.wsw,.jz) .q{padding-right:0}
.card:has(.wsw,.jz) .no{float:none;display:grid;margin:0 0 8px}
.card:has(.wsw,.jz) .a{padding:4px 6px}
.at8:has(.wsw,.jz) .a>b:first-child{margin-left:-6px}
.dtc:has(.wsw,.jz){padding:12px 4px}
.card:has(.wsw,.jz) .aq{text-align:justify;text-justify:inter-word}
.card:has(.wsw,.jz) .q .aq{font-size:calc(var(--qfs)*1.55)!important;line-height:1.85!important;word-spacing:normal}
.card:has(.wsw,.jz) .a p{text-align:justify}
.wsw{display:grid;gap:6px;margin:6px 0 4px}
.wr{padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 7%,var(--card));border:1px solid color-mix(in srgb,var(--c) 18%,transparent)}
.wa{direction:rtl;text-align:justify;text-justify:inter-word;font:400 calc(var(--fs)*1.4)/1.9 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;color:var(--tx)}
.wb{margin-top:3px;padding-left:8px;border-left:3px solid var(--c);text-align:justify;font-size:var(--fs);line-height:1.5;color:var(--tx)}
/* ===== পড়ার পাতা: উত্তরের বক্স পুরো স্ক্রিন জুড়ে ===== */
.dt .dtc{padding:0 0 12px!important}
.dt .dtc .sec{margin:0!important}
.dt .dtc .card.card{padding:12px 0 0!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;animation:none}
.dt .dtc .card.card::before{display:none!important}
.dt .dtc .card .no{margin-left:16px!important}
.dt .dtc .card .q{margin:0 16px!important}
.dt .dtc .card .a{margin:8px 0 0!important;padding:8px 16px!important;border-radius:0!important}
.dt .dtc .at8 .a>b:first-child{margin-left:-16px!important}
/* ===== প্রশ্নের তালিকা: জাস্টিফাই, ছোট লেখা, কম জায়গা ===== */
:root{--qfs:15.5px}
main .card{padding:11px 12px 10px!important}
main .card .no{width:28px;height:28px;margin:0 8px 0 0;font-size:14px}
main .card .q{padding-right:0!important;line-height:1.65!important;min-height:28px;text-align:justify;text-justify:inter-word}


main .card:has(.wsw,.jz){padding:9px 12px 7px!important}
main .card:has(.wsw,.jz) .no{float:left;display:grid;margin:3px 10px 0 0}
main .card:has(.wsw,.jz) .q{min-height:0}
main .card:has(.wsw,.jz) .q .aq{font-size:calc(var(--qfs)*1.3)!important;line-height:1.75!important}

<script>
const S=[{"n": "আস সীরাত আন নববিয়্যাহ", "c": "#15803D", "k": "সি", "d": {}}, , {"n": "দাওয়াহ ২য় পত্র", "c": "#9333EA", "k": "দা২", "d": {"রচনামূলক প্রশ্ন": [{"n": "রচনামূলক", "c": "#9333EA", "q": [["ইসলামী দাওয়াহর উৎপত্তি ও ক্রমবিকাশ বিস্তারিতভাবে লেখ।", "<div class=\"h hm\">ভূমিকা</div><p>ইসলামী দাওয়াহ মানবজাতির ইতিহাসে একটি প্রাচীন, গুরুত্বপূর্ণ ও ধারাবাহিক কার্যক্রম। মানবজাতির সূচনালগ্ন থেকেই মহান আল্লাহ তায়ালা মানুষকে সঠিক পথের সন্ধান দেওয়ার জন্য যুগে যুগে নবী-রাসূল প্রেরণ করেছেন। তাঁদের প্রধান দায়িত্ব ছিল মানুষকে এক আল্লাহর ইবাদত, তাওহিদ, ন্যায়বিচার ও সৎকর্মের প্রতি আহ্বান জানানো। সর্বশেষ নবী হজরত মুহাম্মদ (সা.)-এর মাধ্যমে ইসলামী দাওয়াহ পূর্ণতা লাভ করে। তাঁর ইন্তেকালের পর সাহাবায়ে কেরাম, তাবেয়ি, মুসলিম শাসক, আলেম-উলামা ও ধর্মপ্রচারকদের মাধ্যমে বিশ্বের বিভিন্ন অঞ্চলে ইসলামের দাওয়াত বিস্তার লাভ করে। নিম্নে ইসলামী দাওয়াহর উৎপত্তি ও ক্রমবিকাশ ধারাবাহিকভাবে আলোচনা করা হলো।</p><div class=\"h hm\">ইসলামী দাওয়াহর উৎপত্তি ও ক্রমবিকাশ</div><div class=\"h hs hs2\">১. হজরত আদম (আ.)-এর যুগে ইসলামী দাওয়াহর সূচনা</div><p>ইসলামী দাওয়াহর সূচনা হয় মানবজাতির প্রথম মানুষ ও প্রথম নবী হজরত আদম (আ.)-এর মাধ্যমে। মহান আল্লাহ তাঁকে সৃষ্টি করে পৃথিবীতে পাঠান এবং তাঁর সন্তানদের এক আল্লাহর ইবাদত ও আনুগত্যের শিক্ষা দেন। তিনি তাঁর পরিবার ও সন্তানদের তাওহিদ, নৈতিকতা এবং আল্লাহর বিধান অনুসরণের নির্দেশনা প্রদান করেন। এভাবেই মানবজাতির ইতিহাসে ইসলামী দাওয়াহর প্রাথমিক সূচনা ঘটে।</p><div class=\"h hs hs2\">২. হজরত নূহ (আ.)-এর যুগে দাওয়াহর বিকাশ</div><p>হজরত নূহ (আ.)-এর যুগে মানুষ শিরক ও মূর্তিপূজায় লিপ্ত হয়ে পড়ে। তখন তিনি তাঁর জাতিকে এক আল্লাহর ইবাদতের দিকে আহ্বান জানান। তিনি দীর্ঘ ৯৫০ বছর অত্যন্ত ধৈর্য ও নিষ্ঠার সঙ্গে দাওয়াতের কাজ পরিচালনা করেন। তিনি কখনো প্রকাশ্যে, কখনো গোপনে, কখনো দিন-রাতে মানুষকে আল্লাহর পথে আহ্বান করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا ۝ فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا﴾</div></div><p>অর্থ: “তিনি বললেন, হে আমার রব! নিশ্চয়ই আমি আমার সম্প্রদায়কে রাত-দিন আহ্বান করেছি। কিন্তু আমার আহ্বান তাদের পলায়নপরতাই বৃদ্ধি করেছে।” (সূরা নূহ: ৫-৬)</p><p>এ যুগে দাওয়াহর ক্ষেত্রে ধৈর্য, অধ্যবসায়, ধারাবাহিকতা ও বিভিন্ন পদ্ধতি ব্যবহারের দৃষ্টান্ত প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">৩. হজরত ইবরাহিম (আ.)-এর যুগে দাওয়াহর সম্প্রসারণ</div><p>হজরত ইবরাহিম (আ.)-এর যুগে ইসলামী দাওয়াহ আরও বিস্তৃত ও যুক্তিনির্ভর রূপ লাভ করে। তিনি তাঁর পিতা, সম্প্রদায় ও তৎকালীন শাসককে মূর্তিপূজা পরিত্যাগ করে এক আল্লাহর ইবাদতের আহ্বান জানান। তিনি যুক্তি, প্রজ্ঞা ও সুন্দর উপদেশের মাধ্যমে শিরকের অসারতা তুলে ধরেন।</p><p class=\"bh\"><b>তিনি তাঁর পিতা আযরকে বলেছিলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ شَيْئًا﴾</div></div><p>অর্থ: “হে আমার পিতা! আপনি এমন বস্তুর ইবাদত করেন কেন, যা শুনতে পায় না, দেখতে পায় না এবং আপনার কোনো উপকারও করতে পারে না?” (সূরা মারইয়াম: ৪২)</p><p>তিনি ও তাঁর পুত্র হজরত ইসমাইল (আ.) পবিত্র কাবাঘর নির্মাণ করেন। কাবাঘরকে কেন্দ্র করে পরবর্তী সময়ে তাওহিদ ও হজের দাওয়াহর একটি গুরুত্বপূর্ণ কেন্দ্র প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">৪. অন্যান্য নবী-রাসূলের যুগে দাওয়াহর ধারাবাহিকতা</div><p>হজরত ইবরাহিম (আ.)-এর পরবর্তী সময়ে হজরত মূসা (আ.), হজরত হারুন (আ.), হজরত দাউদ (আ.), হজরত সুলাইমান (আ.) ও হজরত ঈসা (আ.)-সহ অসংখ্য নবী-রাসূল ইসলামের দাওয়াহ প্রচার করেন। তাঁরা প্রত্যেকেই নিজ নিজ জাতিকে এক আল্লাহর ইবাদত, ন্যায়বিচার, সৎকর্ম ও পাপাচার পরিহারের আহ্বান জানান।</p><p>হজরত মূসা (আ.) ফেরাউনের দরবারে গিয়ে তাওহিদের দাওয়াত দেন। হজরত ঈসা (আ.) বনি ইসরাইলের মধ্যে আল্লাহর একত্ববাদ ও নৈতিকতার শিক্ষা প্রচার করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾</div></div><p>অর্থ: “নিশ্চয়ই আমি প্রত্যেক জাতির মধ্যে একজন রাসূল পাঠিয়েছি এই নির্দেশ দিয়ে যে, তোমরা আল্লাহর ইবাদত করো এবং তাগুতকে পরিহার করো।” (সূরা আন-নাহল: ৩৬)</p><p>এভাবে প্রত্যেক যুগে নবী-রাসূলগণের মাধ্যমে ইসলামী দাওয়াহর ধারাবাহিকতা বজায় থাকে।</p><div class=\"h hs hs2\">৫. মহানবী (সা.)-এর আবির্ভাব ও ইসলামী দাওয়াহর পূর্ণতা</div><p>৬১০ খ্রিষ্টাব্দে হেরা গুহায় প্রথম ওহি অবতীর্ণ হওয়ার মাধ্যমে মহানবী হজরত মুহাম্মদ (সা.)-এর নবুওয়াত লাভ এবং ইসলামী দাওয়াহর একটি নতুন ও পূর্ণাঙ্গ অধ্যায়ের সূচনা হয়। তিনি সমগ্র মানবজাতির জন্য সর্বশেষ নবী ও রাসূল হিসেবে প্রেরিত হন। তাঁর মাধ্যমে পূর্ববর্তী নবী-রাসূলদের দাওয়াহর ধারাবাহিকতা পূর্ণতা লাভ করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا﴾</div></div><p>অর্থ: “আমি আপনাকে সমগ্র মানবজাতির জন্য সুসংবাদদাতা ও সতর্ককারী হিসেবে পাঠিয়েছি।” (সূরা সাবা: ২৮)</p><p>মহানবী (সা.)-এর দাওয়াহর কার্যক্রমকে প্রধানত কয়েকটি পর্যায়ে ভাগ করা যায়।</p><div class=\"h hs hs2\">ক. গোপন দাওয়াহর পর্যায় (৬১০-৬১৩ খ্রিষ্টাব্দ)</div><p>প্রথম ওহি অবতীর্ণ হওয়ার পর মহানবী (সা.) প্রথমে গোপনে ইসলামের দাওয়াত প্রদান করেন। তিনি এমন ব্যক্তিদের কাছে দাওয়াত পৌঁছাতে থাকেন, যাঁদের ওপর তাঁর আস্থা ছিল এবং যাঁরা সত্য গ্রহণে আগ্রহী ছিলেন।</p><p>সর্বপ্রথম ইসলাম গ্রহণ করেন হজরত খাদিজা (রা.)। এরপর হজরত আবু বকর (রা.), হজরত আলী (রা.), হজরত যায়েদ ইবনে হারিসা (রা.)-সহ আরও অনেকে ইসলাম গ্রহণ করেন।</p><p>হজরত আবু বকর (রা.)-এর দাওয়াতের মাধ্যমে উসমান ইবনে আফফান (রা.), আবদুর রহমান ইবনে আউফ (রা.), তালহা ইবনে উবাইদুল্লাহ (রা.) ও যুবাইর ইবনুল আওয়াম (রা.)-এর মতো বিশিষ্ট সাহাবিগণ ইসলাম গ্রহণ করেন।</p><p>এ সময় মুসলমানদের সংখ্যা ধীরে ধীরে বৃদ্ধি পেতে থাকে। তাঁরা আরকাম ইবনে আবিল আরকাম (রা.)-এর বাড়িতে একত্রিত হয়ে ইসলামের শিক্ষা গ্রহণ করতেন। এ বাড়িটি দারুল আরকাম নামে পরিচিত ছিল।</p><div class=\"h hs hs2\">খ. প্রকাশ্য দাওয়াহর পর্যায় (৬১৩-৬২২ খ্রিষ্টাব্দ)</div><p>তিন বছর গোপনে দাওয়াত প্রদানের পর মহান আল্লাহর নির্দেশে রাসূলুল্লাহ (সা.) প্রকাশ্যে ইসলামের দাওয়াত প্রদান শুরু করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ﴾</div></div><p>অর্থ: “আপনাকে যে বিষয়ে আদেশ করা হয়েছে, তা প্রকাশ্যে প্রচার করুন এবং মুশরিকদের উপেক্ষা করুন।” (সূরা আল-হিজর: ৯৪)</p><p>তিনি প্রথমে সাফা পাহাড়ে আরোহণ করে কুরাইশদের একত্রিত করেন এবং তাদের আল্লাহর একত্ববাদের প্রতি আহ্বান জানান। কিন্তু মক্কার কাফিররা তাঁর বিরোধিতা শুরু করে। মুসলমানদের ওপর নির্যাতন চালানো হয়। তা সত্ত্বেও তিনি অত্যন্ত ধৈর্য ও সাহসিকতার সঙ্গে দাওয়াতের কাজ অব্যাহত রাখেন।</p><p>এ পর্যায়ে মুসলমানদের ওপর নির্যাতন ও সামাজিক বয়কট, প্রথম হিজরত হিসেবে মুসলমানদের আবিসিনিয়ায় গমন, তায়েফে ইসলামের দাওয়াত প্রদান, আকাবার প্রথম ও দ্বিতীয় বাইয়াত এবং মদিনার অধিবাসীদের মধ্যে ইসলামের প্রসারের মতো গুরুত্বপূর্ণ ঘটনা সংঘটিত হয়।</p><p>এভাবে মক্কায় ইসলামী দাওয়াহর ভিত্তি সুদৃঢ় হয়।</p><div class=\"h hs hs2\">গ. মদিনায় হিজরত ও প্রাতিষ্ঠানিক দাওয়াহর পর্যায় (৬২২-৬৩২ খ্রিষ্টাব্দ)</div><p>৬২২ খ্রিষ্টাব্দে মহানবী (সা.) মদিনায় হিজরত করেন। মদিনায় পৌঁছে ইসলামী দাওয়াহ নতুন মাত্রা লাভ করে। এখানে দাওয়াহ শুধু ব্যক্তিগত প্রচারের মধ্যে সীমাবদ্ধ থাকেনি; বরং সামাজিক, রাজনৈতিক, অর্থনৈতিক ও রাষ্ট্রীয় জীবনে ইসলামের আদর্শ প্রতিষ্ঠিত হয়।</p><p>এ পর্যায়ে তিনি মসজিদে নববি নির্মাণ করেন এবং মসজিদকে শিক্ষা ও দাওয়াহর কেন্দ্র হিসেবে প্রতিষ্ঠা করেন। মুহাজির ও আনসারদের মধ্যে ভ্রাতৃত্ব প্রতিষ্ঠা করেন এবং মদিনা সনদ প্রণয়ন করেন। সাহাবিদের শিক্ষা ও প্রশিক্ষণের ব্যবস্থা করেন। বিভিন্ন গোত্র ও সম্প্রদায়ের কাছে ইসলামের দাওয়াত পৌঁছে দেন এবং বিভিন্ন দেশের শাসকদের কাছে ইসলামের আহ্বান জানিয়ে চিঠি প্রেরণ করেন।</p><p>বিশেষভাবে হুদায়বিয়ার সন্ধির পর ইসলামের দাওয়াত আরব উপদ্বীপের বাইরেও ব্যাপকভাবে ছড়িয়ে পড়ে। ৬৩০ খ্রিষ্টাব্দে মক্কা বিজয়ের পর আরবের বিভিন্ন গোত্র দলে দলে ইসলামে প্রবেশ করতে থাকে।</p><p class=\"bh\"><b>মহানবী (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">بَلِّغُوا عَنِّي وَلَوْ آيَةً</div></div><p>অর্থ: “আমার পক্ষ থেকে একটি আয়াত হলেও তা পৌঁছে দাও।” (সহিহ বুখারি)</p><p>এ নির্দেশনার মাধ্যমে তিনি উম্মতের প্রত্যেক সামর্থ্যবান ব্যক্তিকে ইসলামের শিক্ষা অন্যের কাছে পৌঁছে দেওয়ার দায়িত্ব স্মরণ করিয়ে দেন।</p><div class=\"h hs hs2\">৬. খুলাফায়ে রাশেদিনের যুগে ইসলামী দাওয়াহর বিস্তার (৬৩২-৬৬১ খ্রিষ্টাব্দ)</div><p>মহানবী (সা.)-এর ইন্তেকালের পর খোলাফায়ে রাশেদিন ইসলামী দাওয়াহর দায়িত্ব গ্রহণ করেন। তাঁদের যুগে ইসলামের দাওয়াত আরব উপদ্বীপের সীমানা অতিক্রম করে এশিয়া, আফ্রিকা ও ইউরোপের বিভিন্ন অঞ্চলে বিস্তার লাভ করে।</p><div class=\"h hs hs2\">ক. হজরত আবু বকর (রা.)-এর যুগ</div><p>হজরত আবু বকর (রা.) খিলাফতের দায়িত্ব গ্রহণ করে প্রথমে মুরতাদ ও মিথ্যা নবুওয়াতের দাবিদারদের বিরুদ্ধে ব্যবস্থা গ্রহণ করেন। তিনি ইসলামী রাষ্ট্রের ঐক্য ও স্থিতিশীলতা বজায় রাখেন। তাঁর সময়েই ইরাক ও সিরিয়া অভিমুখে ইসলামী অভিযানের সূচনা হয়। কুরআন সংকলনের উদ্যোগ গ্রহণও তাঁর যুগের একটি ঐতিহাসিক অবদান।</p><div class=\"h hs hs2\">খ. হজরত উমর (রা.)-এর যুগ</div><p>হজরত উমর (রা.)-এর শাসনামলে ইসলামী দাওয়াহ ব্যাপকভাবে বিস্তার লাভ করে। তাঁর সময় সিরিয়া, ফিলিস্তিন, মিসর, ইরাক ও পারস্যের বিস্তীর্ণ অঞ্চল মুসলিম শাসনাধীন হয়। এসব অঞ্চলে সাহাবায়ে কেরাম কুরআন, হাদিস, ইসলামী আইন ও নৈতিক শিক্ষার প্রচার করেন। বিভিন্ন অঞ্চলে মসজিদ ও শিক্ষাকেন্দ্র প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">গ. হজরত উসমান (রা.)-এর যুগ</div><p>হজরত উসমান (রা.)-এর যুগে ইসলামী দাওয়াহর বিস্তার আরও বৃদ্ধি পায়। তিনি পবিত্র কুরআনের পাঠের ঐক্য রক্ষার জন্য কুরআনের মানসম্মত কপি বিভিন্ন অঞ্চলে প্রেরণ করেন। তাঁর সময় উত্তর আফ্রিকা, খোরাসান ও মধ্য এশিয়ার বিভিন্ন অঞ্চলে ইসলামের প্রভাব বিস্তার লাভ করে। সমুদ্রপথেও ইসলামের প্রচার প্রসারিত হয়।</p><div class=\"h hs hs2\">ঘ. হজরত আলী (রা.)-এর যুগ</div><p>হজরত আলী (রা.)-এর যুগে অভ্যন্তরীণ রাজনৈতিক সংঘাত থাকা সত্ত্বেও ইসলামের মৌলিক শিক্ষা, কুরআন-সুন্নাহর অনুসরণ, ন্যায়বিচার ও ইসলামী জ্ঞানচর্চার ধারা অব্যাহত থাকে। সাহাবায়ে কেরাম বিভিন্ন অঞ্চলে অবস্থান করে ইসলামের শিক্ষা প্রচার করতে থাকেন।</p><div class=\"h hs hs2\">৭. উমাইয়া শাসনামলে ইসলামী দাওয়াহর সম্প্রসারণ (৬৬১-৭৫০ খ্রিষ্টাব্দ)</div><p>উমাইয়া শাসনামলে ইসলামী দাওয়াহ ভৌগোলিকভাবে ব্যাপক বিস্তার লাভ করে। এ সময় মুসলিম শাসন স্পেন, উত্তর আফ্রিকা, মধ্য এশিয়া ও ভারতীয় উপমহাদেশের সিন্ধু অঞ্চল পর্যন্ত বিস্তৃত হয়।</p><p>৭১১ খ্রিষ্টাব্দে তারিক ইবনে জিয়াদের নেতৃত্বে স্পেনে মুসলিম অভিযান পরিচালিত হয়। মুহাম্মদ ইবনে কাসিমের নেতৃত্বে সিন্ধু অঞ্চলে ইসলামের প্রসার ঘটে। উত্তর আফ্রিকার বিভিন্ন অঞ্চলে ইসলামী শিক্ষা ও সংস্কৃতি বিস্তার লাভ করে। কুরআন, হাদিস, আরবি ভাষা ও ইসলামী জ্ঞানচর্চার প্রসার ঘটে।</p><p>এ সময় মুসলিম ব্যবসায়ী, আলেম ও ধর্মপ্রচারকরাও বিভিন্ন অঞ্চলে ইসলামের দাওয়াত পৌঁছে দিতে গুরুত্বপূর্ণ ভূমিকা পালন করেন।</p><div class=\"h hs hs2\">৮. আব্বাসীয় শাসনামলে ইসলামী দাওয়াহর জ্ঞানভিত্তিক বিকাশ (৭৫০-১২৫৮ খ্রিষ্টাব্দ)</div><p>আব্বাসীয় শাসনামলে ইসলামী দাওয়াহ জ্ঞান, গবেষণা, শিক্ষা ও সংস্কৃতির মাধ্যমে নতুন মাত্রা লাভ করে। এ সময় বাগদাদ মুসলিম বিশ্বের অন্যতম প্রধান জ্ঞানকেন্দ্রে পরিণত হয়।</p><p>এ যুগে কুরআন ও হাদিসের ব্যাপক অধ্যয়ন ও সংকলন, তাফসির, ফিকহ, আকাইদ ও ইসলামী দর্শনের বিকাশ, মাদরাসা, মসজিদ ও গ্রন্থাগার প্রতিষ্ঠা এবং অনুবাদ ও গবেষণার মাধ্যমে জ্ঞানচর্চার সম্প্রসারণ ঘটে।</p><p>ইমাম আবু হানিফা (রহ.), ইমাম মালিক (রহ.), ইমাম শাফেয়ি (রহ.), ইমাম আহমদ ইবনে হাম্বল (রহ.), ইমাম বুখারি (রহ.) ও ইমাম মুসলিম (রহ.)-এর মতো মনীষীগণ ইসলামী জ্ঞান সংরক্ষণ ও প্রচারে অসামান্য অবদান রাখেন।</p><p>এ সময় ইসলামী দাওয়াহ শুধু সামরিক বিজয়ের মাধ্যমে নয়; বরং জ্ঞান, নৈতিকতা, শিক্ষা ও সংস্কৃতির মাধ্যমে বিস্তার লাভ করে।</p><div class=\"h hs hs2\">৯. মুসলিম ব্যবসায়ী ও সুফি-সাধকদের মাধ্যমে দাওয়াহর বিস্তার</div><p>ইসলামী দাওয়াহর ইতিহাসে মুসলিম ব্যবসায়ী, সুফি-সাধক ও আধ্যাত্মিক ব্যক্তিত্বদের অবদান অত্যন্ত গুরুত্বপূর্ণ। তাঁরা ব্যবসা-বাণিজ্য, সামাজিক সম্পর্ক, উত্তম চরিত্র ও মানবসেবার মাধ্যমে বিভিন্ন অঞ্চলে ইসলামের আদর্শ তুলে ধরেন।</p><p>বিশেষ করে ভারতীয় উপমহাদেশ, দক্ষিণ-পূর্ব এশিয়া ও আফ্রিকার বিভিন্ন অঞ্চলে মুসলিম ব্যবসায়ী ও ধর্মপ্রচারকদের মাধ্যমে ইসলাম ছড়িয়ে পড়ে।</p><p>তাঁরা সততা ও বিশ্বস্ততার সঙ্গে ব্যবসা পরিচালনা, মানুষের সঙ্গে উত্তম আচরণ, দরিদ্র ও অসহায় মানুষের সেবা, ধর্মীয় শিক্ষা ও নৈতিকতার প্রচার এবং মানুষের মধ্যে সাম্য, ভ্রাতৃত্ব ও মানবিক মূল্যবোধ প্রতিষ্ঠার মাধ্যমে ইসলামের দাওয়াত পৌঁছে দেন।</p><p>এভাবে শান্তিপূর্ণ সামাজিক যোগাযোগ ও উত্তম চরিত্রের মাধ্যমে ইসলামী দাওয়াহ বহু অঞ্চলে বিস্তার লাভ করে।</p><div class=\"h hs hs2\">১০. ভারতীয় উপমহাদেশে ইসলামী দাওয়াহর বিকাশ</div><p>ভারতীয় উপমহাদেশে ইসলামের আগমন ও প্রসারে আরব মুসলিম ব্যবসায়ী, ধর্মপ্রচারক, আলেম-উলামা এবং সুফি-সাধকদের গুরুত্বপূর্ণ ভূমিকা ছিল। পরবর্তীকালে বিভিন্ন মুসলিম শাসনামলে ইসলামী শিক্ষা ও সংস্কৃতির বিকাশ ঘটে।</p><p>এ অঞ্চলে ইসলামী দাওয়াহর উল্লেখযোগ্য ব্যক্তিত্বদের মধ্যে ছিলেন হজরত খাজা মঈনুদ্দিন চিশতি (রহ.), হজরত নিজামুদ্দিন আউলিয়া (রহ.), হজরত শাহ জালাল (রহ.), হজরত শাহ মখদুম রূপোশ (রহ.) এবং হজরত খান জাহান আলী (রহ.)।</p><p>তাঁরা শিক্ষা, মানবসেবা, আধ্যাত্মিক অনুশীলন ও উত্তম চরিত্রের মাধ্যমে ইসলামের প্রচার ও প্রসারে অবদান রাখেন।</p><div class=\"h hs hs2\">১১. বাংলায় ইসলামী দাওয়াহর বিকাশ</div><p>বাংলায় ইসলামী দাওয়াহর ইতিহাসও অত্যন্ত সমৃদ্ধ। আরব ও পারস্যের মুসলিম ব্যবসায়ীদের মাধ্যমে বাংলার সঙ্গে ইসলামের প্রাথমিক পরিচয় ঘটে। পরবর্তীকালে সুফি-সাধক, আলেম-উলামা ও মুসলিম শাসকদের মাধ্যমে ইসলাম ব্যাপকভাবে বিস্তার লাভ করে।</p><p>বিশেষ করে হজরত শাহ জালাল (রহ.) সিলেট অঞ্চলে ইসলামের প্রচারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। হজরত খান জাহান আলী (রহ.) দক্ষিণ বাংলায় মসজিদ, মাদরাসা, দীঘি ও জনকল্যাণমূলক প্রতিষ্ঠান নির্মাণের মাধ্যমে ইসলামী সমাজ গঠনে অবদান রাখেন।</p><p>পরবর্তীকালে বাংলার বিভিন্ন আলেম ও ধর্মীয় ব্যক্তিত্ব ইসলামী শিক্ষা, তাফসির, হাদিস, ফিকহ ও নৈতিকতার প্রচার করেন। মাদরাসা, মসজিদ, খানকাহ ও ধর্মীয় শিক্ষাপ্রতিষ্ঠান ইসলামী দাওয়াহর গুরুত্বপূর্ণ কেন্দ্রে পরিণত হয়।</p><div class=\"h hs hs2\">১২. আধুনিক যুগে ইসলামী দাওয়াহর বিকাশ</div><p>আধুনিক যুগে বিজ্ঞান, প্রযুক্তি, যোগাযোগব্যবস্থা ও গণমাধ্যমের উন্নতির ফলে ইসলামী দাওয়াহ নতুন মাত্রা লাভ করেছে। বর্তমানে দাওয়াহ শুধু মসজিদ, মাদরাসা বা ধর্মীয় সমাবেশের মধ্যে সীমাবদ্ধ নয়; বরং বিভিন্ন আধুনিক মাধ্যমের সাহায্যে বিশ্বব্যাপী পরিচালিত হচ্ছে।</p><p>বর্তমানে মসজিদ ও মাদরাসাভিত্তিক দাওয়াহ, ইসলামী বই, পত্রিকা ও সাময়িকী প্রকাশ, রেডিও ও টেলিভিশনের মাধ্যমে ইসলামের প্রচার, ইন্টারনেট ও সামাজিক যোগাযোগমাধ্যম ব্যবহার, ইউটিউব ও ফেসবুকের মাধ্যমে ইসলামী শিক্ষা প্রচার, আন্তর্জাতিক ইসলামী সম্মেলন ও সেমিনার আয়োজন এবং অনলাইন কুরআন ও হাদিস শিক্ষার ব্যবস্থা ইসলামী দাওয়াহর গুরুত্বপূর্ণ মাধ্যম হিসেবে ব্যবহৃত হচ্ছে।</p><p>বর্তমানে বিশ্বের বিভিন্ন দেশে ইসলামী গবেষণা প্রতিষ্ঠান, দাওয়াহ সেন্টার ও আন্তর্জাতিক সংস্থা প্রতিষ্ঠিত হয়েছে। এসব প্রতিষ্ঠান ইসলামের শিক্ষা প্রচার, ধর্মীয় গবেষণা এবং আন্তধর্মীয় সংলাপে গুরুত্বপূর্ণ ভূমিকা পালন করছে।</p><div class=\"h hs hs2\">১৩. ইসলামী দাওয়াহর পদ্ধতি ও মূলনীতি সম্পর্কে কুরআনের নির্দেশনা</div><p>ইসলামী দাওয়াহর ক্রমবিকাশের পাশাপাশি এর পদ্ধতি ও মূলনীতিও কুরআন ও সুন্নাহতে সুস্পষ্টভাবে বর্ণিত হয়েছে। মহান আল্লাহ দাওয়াহ প্রদানের ক্ষেত্রে প্রজ্ঞা, সুন্দর উপদেশ ও উত্তম পদ্ধতিতে আলোচনার নির্দেশ দিয়েছেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ﴾</div></div><p>অর্থ: “আপনি আপনার রবের পথে আহ্বান করুন প্রজ্ঞা ও সুন্দর উপদেশের মাধ্যমে এবং তাদের সঙ্গে বিতর্ক করুন উত্তম পন্থায়।” (সূরা আন-নাহল: ১২৫)</p><p>এই আয়াতের মাধ্যমে দাওয়াহর তিনটি মৌলিক পদ্ধতি নির্দেশ করা হয়েছে। যথা—হিকমত বা প্রজ্ঞার মাধ্যমে দাওয়াহ, সুন্দর উপদেশের মাধ্যমে দাওয়াহ এবং উত্তম পদ্ধতিতে যুক্তি ও আলোচনার মাধ্যমে দাওয়াহ।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ</div></div><p>অর্থ: “যে ব্যক্তি কোনো ভালো কাজের পথ দেখায়, সে ওই কাজ সম্পাদনকারীর সমপরিমাণ সওয়াব লাভ করে।” (সহিহ মুসলিম)</p><p>এ হাদিস থেকে বোঝা যায়, মানুষকে কল্যাণের পথে পরিচালিত করা অত্যন্ত মর্যাদাপূর্ণ কাজ।</p><div class=\"h hs hs2\">১৪. ইসলামী দাওয়াহর দায়িত্ব ও বর্তমান মুসলিম উম্মাহর করণীয়</div><p>ইসলামী দাওয়াহ শুধু নবী-রাসূলদের দায়িত্ব ছিল না; বরং তাঁদের উত্তরসূরি হিসেবে মুসলিম উম্মাহর ওপরও এ দায়িত্ব অর্পিত হয়েছে। প্রত্যেক মুসলমান তার জ্ঞান, যোগ্যতা ও সামর্থ্য অনুযায়ী ইসলামের সঠিক শিক্ষা মানুষের কাছে পৌঁছে দেবে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">﴿وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ﴾</div></div><p>অর্থ: “তোমাদের মধ্যে এমন একটি দল থাকা উচিত, যারা কল্যাণের দিকে আহ্বান করবে, সৎকাজের নির্দেশ দেবে এবং অসৎকাজ থেকে নিষেধ করবে।” (সূরা আলে ইমরান: ১০৪)</p><p>অতএব, বর্তমান মুসলিম উম্মাহর উচিত কুরআন ও সুন্নাহর আলোকে নিজেদের জীবন গঠন করা এবং জ্ঞান, প্রজ্ঞা, উত্তম চরিত্র ও আধুনিক প্রযুক্তির সাহায্যে ইসলামের প্রকৃত আদর্শ বিশ্ববাসীর সামনে তুলে ধরা।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইসলামী দাওয়াহর উৎপত্তি মানবজাতির সূচনালগ্নে হজরত আদম (আ.)-এর মাধ্যমে এবং যুগে যুগে নবী-রাসূলদের অক্লান্ত প্রচেষ্টায় এর ধারাবাহিক বিকাশ ঘটেছে। সর্বশেষ নবী হজরত মুহাম্মদ (সা.)-এর মাধ্যমে ইসলামী দাওয়াহ পূর্ণতা লাভ করে। তাঁর ইন্তেকালের পর সাহাবায়ে কেরাম, তাবেয়ি, মুসলিম শাসক, আলেম-উলামা, সুফি-সাধক ও ধর্মপ্রচারকদের মাধ্যমে ইসলামের আলো পৃথিবীর বিভিন্ন প্রান্তে ছড়িয়ে পড়ে। আধুনিক যুগে প্রযুক্তি ও গণমাধ্যম ইসলামী দাওয়াহকে আরও ব্যাপক ও সহজলভ্য করেছে। তাই ইসলামী দাওয়াহর এই মহান ধারাবাহিকতা বজায় রাখা প্রত্যেক মুসলমানের দায়িত্ব। প্রজ্ঞা, ধৈর্য, উত্তম চরিত্র ও কুরআন-সুন্নাহর আদর্শ অনুসরণের মাধ্যমে মানবজাতির কাছে ইসলামের শান্তি, সাম্য ও কল্যাণের বাণী পৌঁছে দেওয়াই হওয়া উচিত আমাদের মূল লক্ষ্য।</p>"], ["আল্লাহর প্রতি দাওয়াত প্রদানের ক্ষেত্রে নবী-রাসূলগণের পদ্ধতি সম্পর্কে যা জান বর্ণনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>ইসলাম মানবজাতির জন্য মহান আল্লাহ তায়ালার মনোনীত একমাত্র পূর্ণাঙ্গ জীবনবিধান। মানবজাতিকে সত্য ও ন্যায়ের পথে পরিচালিত করার জন্য মহান আল্লাহ যুগে যুগে অসংখ্য নবী-রাসূল প্রেরণ করেছেন। তাঁদের প্রধান দায়িত্ব ছিল মানুষকে এক আল্লাহর ইবাদত, তাওহিদ, ন্যায়বিচার ও সৎকর্মের প্রতি আহ্বান জানানো এবং শিরক, কুফর ও যাবতীয় অন্যায় থেকে বিরত রাখা। নবী-রাসূলগণ তাঁদের যুগ, জাতি ও মানুষের অবস্থা অনুযায়ী বিভিন্ন পদ্ধতিতে আল্লাহর প্রতি দাওয়াত প্রদান করেছেন। তাঁদের দাওয়াতের মূল লক্ষ্য ছিল মানুষকে অন্ধকার থেকে আলোর পথে ফিরিয়ে আনা এবং দুনিয়া ও আখিরাতের কল্যাণ নিশ্চিত করা। নিম্নে আল্লাহর প্রতি দাওয়াত প্রদানের ক্ষেত্রে নবী-রাসূলগণের পদ্ধতি বিস্তারিতভাবে আলোচনা করা হলো।</p><p>আল্লাহর প্রতি দাওয়াত প্রদানের ক্ষেত্রে নবী-রাসূলগণের পদ্ধতি</p><div class=\"h hs hs2\">১. তাওহিদের প্রতি আহ্বান ও শিরক বর্জনের দাওয়াত</div><p>নবী-রাসূলগণের দাওয়াতের প্রধান ও সর্বপ্রথম বিষয় ছিল তাওহিদ বা আল্লাহর একত্ববাদ প্রতিষ্ঠা করা। তাঁরা মানুষকে একমাত্র আল্লাহর ইবাদত করতে এবং সব ধরনের শিরক ও মূর্তিপূজা পরিহার করতে আহ্বান জানিয়েছেন। প্রত্যেক নবী-রাসূল তাঁদের জাতিকে আল্লাহর একত্ববাদের শিক্ষা দিয়েছেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ</div></div><p>অর্থ: নিশ্চয়ই আমি প্রত্যেক জাতির মধ্যে একজন রাসূল পাঠিয়েছি এই নির্দেশ দিয়ে যে, তোমরা আল্লাহর ইবাদত করো এবং তাগুতকে পরিহার করো। (সূরা আন-নাহল: ৩৬)</p><p>এ আয়াত থেকে প্রমাণিত হয় যে, সব নবী-রাসূলের দাওয়াতের মূল ভিত্তি ছিল তাওহিদ প্রতিষ্ঠা এবং শিরক থেকে মানুষকে মুক্ত করা।</p><div class=\"h hs hs2\">২. প্রজ্ঞা ও বিচক্ষণতার মাধ্যমে দাওয়াত প্রদান</div><p>নবী-রাসূলগণ মানুষের জ্ঞান, বুদ্ধি, মানসিক অবস্থা ও সামাজিক পরিবেশ বিবেচনা করে প্রজ্ঞার সঙ্গে দাওয়াত প্রদান করতেন। তাঁরা কখনো কঠোর ভাষা ব্যবহার না করে যুক্তি, সুন্দর উপদেশ ও বাস্তব উদাহরণের মাধ্যমে মানুষকে সত্যের পথে আহ্বান করতেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা মহানবী (সা.)-কে নির্দেশ দিয়ে বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ</div></div><p>অর্থ: আপনি আপনার রবের পথে আহ্বান করুন প্রজ্ঞা ও সুন্দর উপদেশের মাধ্যমে এবং তাদের সঙ্গে বিতর্ক করুন উত্তম পন্থায়। (সূরা আন-নাহল: ১২৫)</p><p>এ আয়াতে দাওয়াত প্রদানের ক্ষেত্রে হিকমত, সুন্দর উপদেশ ও উত্তম পদ্ধতিতে আলোচনার নির্দেশ দেওয়া হয়েছে। নবী-রাসূলগণ এ নীতির বাস্তব অনুসরণ করেছেন।</p><div class=\"h hs hs2\">৩. গোপনে ও প্রকাশ্যে দাওয়াত প্রদান</div><p>নবী-রাসূলগণ পরিস্থিতি অনুযায়ী কখনো গোপনে আবার কখনো প্রকাশ্যে আল্লাহর প্রতি দাওয়াত প্রদান করেছেন। বিশেষ করে হজরত নূহ (আ.) তাঁর জাতিকে দীর্ঘদিন ধরে গোপনে ও প্রকাশ্যে উভয় পদ্ধতিতে দাওয়াত দিয়েছেন। একইভাবে মহানবী হজরত মুহাম্মদ (সা.)-ও নবুওয়াতের প্রথম দিকে গোপনে দাওয়াত প্রদান করেন এবং পরবর্তীতে প্রকাশ্যে দাওয়াতের কাজ শুরু করেন।</p><p class=\"bh\"><b>হজরত নূহ (আ.)-এর দাওয়াত সম্পর্কে আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا ۝ ثُمَّ إِنِّي دَعَوْتُهُمْ جِهَارًا ۝ ثُمَّ إِنِّي أَعْلَنْتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًا</div></div><p>অর্থ: তিনি বললেন, হে আমার রব! নিশ্চয়ই আমি আমার সম্প্রদায়কে রাত-দিন আহ্বান করেছি। অতঃপর আমি তাদের প্রকাশ্যে আহ্বান করেছি। তারপর আমি তাদের প্রকাশ্যে প্রচার করেছি এবং গোপনেও তাদের বুঝিয়েছি। (সূরা নূহ: ৫-৯)</p><p>এ আয়াত থেকে বোঝা যায়, নবী-রাসূলগণ দাওয়াতের ক্ষেত্রে সময়, পরিবেশ ও পরিস্থিতি অনুযায়ী বিভিন্ন পদ্ধতি অবলম্বন করতেন।</p><div class=\"h hs hs2\">৪. সুন্দর উপদেশ ও কোমল ভাষায় দাওয়াত প্রদান</div><p>নবী-রাসূলগণ মানুষের হৃদয় জয় করার জন্য সুন্দর ভাষা, নম্র আচরণ ও কোমল উপদেশের মাধ্যমে দাওয়াত প্রদান করতেন। তাঁরা মানুষের সঙ্গে কঠোরতা ও রূঢ় আচরণ না করে ভালোবাসা ও সহানুভূতির সঙ্গে কথা বলতেন।</p><div class=\"h hm\">মহান আল্লাহ তায়ালা হজরত মূসা (আ.) ও হজরত হারুন (আ.)-কে ফেরাউনের কাছে পাঠানোর সময় নির্দেশ দেন</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَقُولَا لَهُ قَوْلًا لَيِّنًا لَعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَىٰ</div></div><p>অর্থ: তোমরা তার সঙ্গে কোমল ভাষায় কথা বলবে, হয়তো সে উপদেশ গ্রহণ করবে অথবা ভয় করবে। (সূরা ত্ব-হা: ৪৪)</p><p>এ আয়াত থেকে প্রমাণিত হয় যে, ফেরাউনের মতো অত্যাচারী শাসকের কাছেও দাওয়াত প্রদানের ক্ষেত্রে কোমল ভাষা ব্যবহারের নির্দেশ দেওয়া হয়েছে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الرِّفْقَ لَا يَكُونُ فِي شَيْءٍ إِلَّا زَانَهُ وَلَا يُنْزَعُ مِنْ شَيْءٍ إِلَّا شَانَهُ</div></div><p>অর্থ: নিশ্চয়ই কোমলতা যে বিষয়ে থাকে, তাকে সৌন্দর্যমণ্ডিত করে এবং যে বিষয় থেকে কোমলতা তুলে নেওয়া হয়, তাকে ত্রুটিপূর্ণ করে। (সহিহ মুসলিম)</p><div class=\"h hs hs2\">৫. যুক্তি, প্রমাণ ও বাস্তব উদাহরণের মাধ্যমে দাওয়াত প্রদান</div><p>নবী-রাসূলগণ মানুষকে আল্লাহর প্রতি আহ্বান জানানোর ক্ষেত্রে যুক্তি, প্রমাণ ও বাস্তব উদাহরণ ব্যবহার করতেন। তাঁরা মানুষের সামনে সৃষ্টিজগতের নিদর্শন, আকাশ-জমিন, চন্দ্র-সূর্য, রাত-দিন এবং জীবনের বিভিন্ন বাস্তব ঘটনা তুলে ধরে আল্লাহর অস্তিত্ব ও একত্ববাদের প্রমাণ উপস্থাপন করতেন।</p><p class=\"bh\"><b>হজরত ইবরাহিম (আ.) তাঁর সম্প্রদায়কে যুক্তির মাধ্যমে মূর্তিপূজার অসারতা বোঝানোর চেষ্টা করেন। তিনি তাঁর পিতাকে বলেছিলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ شَيْئًا</div></div><p>অর্থ: হে আমার পিতা! আপনি এমন বস্তুর ইবাদত করেন কেন, যা শুনতে পায় না, দেখতে পায় না এবং আপনার কোনো উপকারও করতে পারে না। (সূরা মারইয়াম: ৪২)</p><p>এ ছাড়া হজরত ইবরাহিম (আ.)-এর সঙ্গে নমরুদের বিতর্কের ঘটনাও যুক্তিনির্ভর দাওয়াতের একটি গুরুত্বপূর্ণ উদাহরণ।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَلَمْ تَرَ إِلَى الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ</div></div><p>অর্থ: তুমি কি সেই ব্যক্তির কথা চিন্তা করনি, যে ইবরাহিমের সঙ্গে তাঁর প্রতিপালক সম্পর্কে বিতর্ক করেছিল, কারণ আল্লাহ তাকে রাজত্ব দান করেছিলেন। (সূরা আল-বাকারা: ২৫৮)</p><div class=\"h hs hs2\">৬. ধৈর্য ও সহনশীলতার মাধ্যমে দাওয়াত প্রদান</div><p>নবী-রাসূলগণের দাওয়াতের অন্যতম প্রধান বৈশিষ্ট্য ছিল ধৈর্য ও সহনশীলতা। তাঁরা দাওয়াত দিতে গিয়ে নানা বাধা, নির্যাতন, অপমান ও বিরোধিতার সম্মুখীন হয়েছেন। কিন্তু তাঁরা কখনো হতাশ হননি কিংবা দাওয়াতের কাজ পরিত্যাগ করেননি।</p><p>হজরত নূহ (আ.) দীর্ঘ ৯৫০ বছর তাঁর জাতিকে দাওয়াত প্রদান করেন। কিন্তু অধিকাংশ মানুষ তাঁর আহ্বানে সাড়া দেয়নি।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا</div></div><p>অর্থ: অতঃপর তিনি তাদের মধ্যে পঞ্চাশ বছর কম এক হাজার বছর অবস্থান করেছিলেন। (সূরা আল-আনকাবুত: ১৪)</p><p>মহানবী (সা.)-ও মক্কায় দীর্ঘ তেরো বছর নির্যাতন ও বিরোধিতার মধ্যেও ধৈর্যের সঙ্গে দাওয়াতের কাজ চালিয়ে যান।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُلِ</div></div><p>অর্থ: অতএব, আপনি ধৈর্য ধারণ করুন, যেমন ধৈর্য ধারণ করেছিলেন দৃঢ়সংকল্প রাসূলগণ। (সূরা আল-আহকাফ: ৩৫)</p><div class=\"h hs hs2\">৭. আত্মীয়-স্বজন ও নিকটজনদের মাধ্যমে দাওয়াতের সূচনা</div><p>নবী-রাসূলগণ দাওয়াতের কাজ শুরু করার ক্ষেত্রে অনেক সময় নিজেদের পরিবার, আত্মীয়স্বজন ও নিকটজনদের অগ্রাধিকার দিয়েছেন। কারণ পরিবারের সদস্যরা তাঁদের জীবন, চরিত্র ও আদর্শ সম্পর্কে ভালোভাবে অবগত ছিলেন।</p><p class=\"bh\"><b>মহান আল্লাহ তায়ালা মহানবী (সা.)-কে নির্দেশ দিয়ে বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنْذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ</div></div><p>অর্থ: আপনি আপনার নিকটাত্মীয়দের সতর্ক করুন। (সূরা আশ-শুআরা: ২১৪)</p><p>এই নির্দেশের পর মহানবী (সা.) তাঁর নিকটাত্মীয়দের একত্রিত করে ইসলামের দাওয়াত প্রদান করেন। এ থেকে বোঝা যায়, দাওয়াতের ক্ষেত্রে পরিবার ও নিকটজনদের গুরুত্ব অপরিসীম।</p><div class=\"h hs hs2\">৮. ব্যক্তিগত চরিত্র ও আমলের মাধ্যমে দাওয়াত প্রদান</div><p>নবী-রাসূলগণ শুধু মুখে দাওয়াত প্রদান করতেন না; বরং নিজেদের জীবন, চরিত্র, সততা, আমানতদারি ও উত্তম আচরণের মাধ্যমে ইসলামের আদর্শ বাস্তবায়ন করে দেখাতেন। তাঁদের ব্যক্তিগত জীবন ছিল দাওয়াতের জীবন্ত নমুনা।</p><p class=\"bh\"><b>মহান আল্লাহ তায়ালা মহানবী (সা.) সম্পর্কে বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ</div></div><p>অর্থ: নিশ্চয়ই আপনি মহান চরিত্রের অধিকারী। (সূরা আল-কলম: ৪)</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا بُعِثْتُ لِأُتَمِّمَ صَالِحَ الْأَخْلَاقِ</div></div><p>অর্থ: নিশ্চয়ই আমি উত্তম চরিত্রের পূর্ণতা সাধনের জন্য প্রেরিত হয়েছি। (মুসনাদ আহমাদে বর্ণিত)</p><p>এ থেকে বোঝা যায়, উত্তম চরিত্র ও বাস্তব আমল দাওয়াতের অত্যন্ত কার্যকর মাধ্যম।</p><div class=\"h hs hs2\">৯. আল্লাহর নিয়ামত ও আখিরাতের পুরস্কারের সুসংবাদ প্রদান</div><p>নবী-রাসূলগণ মানুষকে আল্লাহর রহমত, জান্নাতের নিয়ামত ও আখিরাতের পুরস্কারের সুসংবাদ দিতেন। একই সঙ্গে পাপাচার, অবাধ্যতা ও কুফরের পরিণতি সম্পর্কে সতর্ক করতেন। এভাবে তাঁরা মানুষকে আশা ও ভয়ের মধ্যে রেখে আল্লাহর পথে আহ্বান করতেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنْذِرِينَ</div></div><p>অর্থ: আমি রাসূলগণকে কেবল সুসংবাদদাতা ও সতর্ককারী হিসেবেই প্রেরণ করি। (সূরা আল-কাহফ: ৫৬)</p><p class=\"bh\"><b>মহানবী (সা.) বলেছেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَسِّرُوا وَلَا تُعَسِّرُوا وَبَشِّرُوا وَلَا تُنَفِّرُوا</div></div><p>অর্থ: তোমরা সহজ করো, কঠিন করো না। সুসংবাদ দাও, মানুষকে বিমুখ করো না। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class=\"h hs hs2\">১০. প্রশ্নোত্তর ও আলোচনার মাধ্যমে দাওয়াত প্রদান</div><p>নবী-রাসূলগণ মানুষের বিভিন্ন প্রশ্নের উত্তর দিতেন এবং তাদের সংশয় ও সন্দেহ দূর করার জন্য আলোচনা করতেন। তাঁরা মানুষের বুদ্ধিবৃত্তিক অবস্থান বিবেচনা করে সহজ ভাষায় সত্যকে উপস্থাপন করতেন।</p><p>মহানবী (সা.)-এর দাওয়াতি জীবনে প্রশ্নোত্তরের বহু দৃষ্টান্ত রয়েছে। হাদিসে জিবরিল এর অন্যতম উদাহরণ। এ হাদিসে জিবরিল (আ.) মানুষের আকৃতিতে এসে রাসূলুল্লাহ (সা.)-কে ঈমান, ইসলাম, ইহসান ও কিয়ামত সম্পর্কে প্রশ্ন করেন। রাসূলুল্লাহ (সা.) তাঁর প্রশ্নগুলোর উত্তর প্রদান করেন।</p><p>হাদিসের এক পর্যায়ে এসেছে</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ</div></div><p>অর্থ: তিনি ছিলেন জিবরিল। তিনি তোমাদের কাছে এসেছিলেন তোমাদের দ্বীন শিক্ষা দেওয়ার জন্য। (সহিহ মুসলিম)</p><p>এ হাদিস থেকে বোঝা যায়, প্রশ্নোত্তর ও আলোচনার মাধ্যমেও দ্বীনের শিক্ষা প্রদান করা যায়।</p><div class=\"h hs hs2\">১১. সামাজিক সংস্কার ও অন্যায়-অবিচার দূর করার মাধ্যমে দাওয়াত</div><p>নবী-রাসূলগণ শুধু ব্যক্তিগত ইবাদতের দাওয়াত দেননি; বরং সমাজের অন্যায়, অবিচার, দুর্নীতি, প্রতারণা, সুদ, ওজনে কম দেওয়া এবং নৈতিক অবক্ষয় দূর করার জন্যও কাজ করেছেন।</p><p>হজরত শুআইব (আ.) তাঁর জাতিকে ব্যবসা-বাণিজ্যে প্রতারণা ও ওজনে কম দেওয়া থেকে বিরত থাকার আহ্বান জানান।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ</div></div><p>অর্থ: তোমরা মানুষকে তাদের প্রাপ্য বস্তু কম দিও না এবং পৃথিবীতে বিপর্যয় সৃষ্টি করে বেড়িও না। (সূরা হুদ: ৮৫)</p><p>এ থেকে প্রমাণিত হয়, নবী-রাসূলগণের দাওয়াতের অন্যতম উদ্দেশ্য ছিল সমাজ থেকে অন্যায়-অবিচার দূর করে ন্যায়ভিত্তিক সমাজ প্রতিষ্ঠা করা।</p><div class=\"h hs hs2\">১২. দলবদ্ধভাবে ও সহযোগিতার মাধ্যমে দাওয়াত প্রদান</div><p>নবী-রাসূলগণ অনেক ক্ষেত্রে তাঁদের অনুসারী ও সহযোগীদের সঙ্গে নিয়ে দাওয়াতের কাজ পরিচালনা করেছেন। হজরত মূসা (আ.) তাঁর ভাই হজরত হারুন (আ.)-কে দাওয়াতের কাজে সহযোগী হিসেবে নিয়োগ করার জন্য আল্লাহর কাছে প্রার্থনা করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা তাঁর দোয়া বর্ণনা করে বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاجْعَلْ لِي وَزِيرًا مِنْ أَهْلِي. هَارُونَ أَخِي. اشْدُدْ بِهِ أَزْرِي. وَأَشْرِكْهُ فِي أَمْرِي</div></div><p>অর্থ: আমার পরিবার থেকে আমার জন্য একজন সাহায্যকারী নির্ধারণ করুন। আমার ভাই হারুনকে। তাঁর মাধ্যমে আমার শক্তি বৃদ্ধি করুন এবং তাঁকে আমার কাজে অংশীদার করুন। (সূরা ত্ব-হা: ২৯-৩২)</p><p>এ আয়াত থেকে বোঝা যায়, দাওয়াতের কাজে যোগ্য সহযোগী নির্বাচন এবং পারস্পরিক সহযোগিতা অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hs hs2\">১৩. হিজরত ও নতুন দাওয়াতি কেন্দ্র প্রতিষ্ঠা</div><p>নবী-রাসূলগণ দাওয়াতের পথে বাধা সৃষ্টি হলে প্রয়োজন অনুযায়ী স্থান পরিবর্তন করেছেন এবং নতুন পরিবেশে দাওয়াতের কাজ পরিচালনা করেছেন। মহানবী (সা.) মক্কায় দীর্ঘদিন দাওয়াত প্রদান করেও যখন নির্যাতন ও বাধার সম্মুখীন হন, তখন আল্লাহর নির্দেশে মদিনায় হিজরত করেন। সেখানে তিনি মসজিদে নববি প্রতিষ্ঠা করেন এবং শিক্ষা, প্রশিক্ষণ ও দাওয়াতের একটি শক্তিশালী কেন্দ্র গড়ে তোলেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ هَاجَرُوا فِي اللَّهِ مِنْ بَعْدِ مَا ظُلِمُوا لَنُبَوِّئَنَّهُمْ فِي الدُّنْيَا حَسَنَةً</div></div><p>অর্থ: যারা নির্যাতিত হওয়ার পর আল্লাহর উদ্দেশ্যে হিজরত করেছে, আমি অবশ্যই তাদের দুনিয়ায় উত্তম আবাস দান করব। (সূরা আন-নাহল: ৪১)</p><p>এ থেকে বোঝা যায়, ইসলামী দাওয়াতের স্বার্থে প্রয়োজনীয় পরিবেশ ও নিরাপদ কর্মক্ষেত্র তৈরি করাও নবী-রাসূলগণের দাওয়াতি কৌশলের অন্তর্ভুক্ত।</p><div class=\"h hs hs2\">১৪. চিঠিপত্র ও দূত প্রেরণের মাধ্যমে দাওয়াত প্রদান</div><p>মহানবী হজরত মুহাম্মদ (সা.)-এর দাওয়াতি পদ্ধতির অন্যতম বৈশিষ্ট্য ছিল বিভিন্ন দেশের শাসক ও নেতাদের কাছে চিঠি প্রেরণ এবং দূত পাঠানোর মাধ্যমে ইসলামের দাওয়াত পৌঁছে দেওয়া। হুদায়বিয়ার সন্ধির পর তিনি রোম, পারস্য, মিসর, আবিসিনিয়া ও অন্যান্য অঞ্চলের শাসকদের কাছে ইসলামের আহ্বান জানিয়ে পত্র প্রেরণ করেন।</p><p>রোমের সম্রাট হিরাক্লিয়াসের কাছে পাঠানো চিঠিতে তিনি লিখেছিলেন</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَسْلِمْ تَسْلَمْ</div></div><p>অর্থ: ইসলাম গ্রহণ করুন, নিরাপদ থাকবেন।</p><p>চিঠিতে তিনি আল্লাহর প্রতি ঈমান আনার এবং ইসলামের আহ্বান গ্রহণ করার কথা উল্লেখ করেন। (সহিহ বুখারি)</p><p>এ পদ্ধতির মাধ্যমে ইসলামী দাওয়াহ আরব উপদ্বীপের বাইরে আন্তর্জাতিক পর্যায়ে পৌঁছে যায়।</p><div class=\"h hs hs2\">১৫. মানুষের সামর্থ্য ও যোগ্যতা অনুযায়ী দাওয়াত প্রদান</div><p>নবী-রাসূলগণ মানুষের জ্ঞান, যোগ্যতা ও সামর্থ্য বিবেচনা করে দাওয়াত প্রদান করতেন। তাঁরা কাউকে তার সাধ্যের অতিরিক্ত দায়িত্ব দিতেন না। মহানবী (সা.)-ও বিভিন্ন সাহাবিকে বিভিন্ন অঞ্চলে পাঠানোর সময় তাঁদের দাওয়াতের পদ্ধতি ও দায়িত্ব সম্পর্কে নির্দেশনা দিতেন।</p><p>হজরত মুয়াজ ইবনে জাবাল (রা.)-কে ইয়েমেনে পাঠানোর সময় রাসূলুল্লাহ (সা.) তাঁকে প্রথমে তাওহিদের দাওয়াত দেওয়ার নির্দেশ দেন। তিনি বলেন</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلْيَكُنْ أَوَّلَ مَا تَدْعُوهُمْ إِلَيْهِ شَهَادَةُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ</div></div><p>অর্থ: তুমি তাদের সর্বপ্রথম এ সাক্ষ্য দেওয়ার প্রতি আহ্বান জানাবে যে, আল্লাহ ছাড়া কোনো সত্য ইলাহ নেই। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>এ হাদিস থেকে বোঝা যায়, দাওয়াতের ক্ষেত্রে অগ্রাধিকার নির্ধারণ এবং ধাপে ধাপে মানুষকে ইসলামের শিক্ষা প্রদান করা অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, নবী-রাসূলগণের দাওয়াতি পদ্ধতি ছিল অত্যন্ত বাস্তবসম্মত, প্রজ্ঞাপূর্ণ, মানবিক ও যুগোপযোগী। তাঁরা তাওহিদের দাওয়াত, সুন্দর উপদেশ, যুক্তি-প্রমাণ, কোমল ভাষা, ধৈর্য, উত্তম চরিত্র, প্রশ্নোত্তর, সামাজিক সংস্কার, হিজরত ও দলবদ্ধ প্রচেষ্টার মাধ্যমে মানুষকে আল্লাহর পথে আহ্বান করেছেন। তাঁদের দাওয়াতের মূল উদ্দেশ্য ছিল মানুষকে শিরক ও কুফর থেকে মুক্ত করে আল্লাহর সন্তুষ্টি অর্জনের পথে পরিচালিত করা। বর্তমান যুগেও ইসলামী দাওয়াহর ক্ষেত্রে নবী-রাসূলগণের এসব পদ্ধতি অনুসরণ করা অত্যন্ত জরুরি। তাই প্রত্যেক দাঈর উচিত কুরআন ও সুন্নাহর আলোকে প্রজ্ঞা, ধৈর্য, সহনশীলতা ও উত্তম চরিত্রের মাধ্যমে ইসলামের সুমহান আদর্শ মানুষের কাছে পৌঁছে দেওয়া।</p>"], ["হযরত নূহ (আ.)-এর সংক্ষিপ্ত জীবনী এবং কুরআন ও সুন্নাহর আলোকে তাঁর দাওয়াতের পদ্ধতি লিপিবদ্ধ কর।", "<div class=\"h hm\">ভূমিকা</div><p>মহান আল্লাহ তায়ালা মানবজাতিকে সঠিক পথের সন্ধান দেওয়ার জন্য যুগে যুগে অসংখ্য নবী-রাসূল প্রেরণ করেছেন। তাঁদের মধ্যে হজরত নূহ (আ.) ছিলেন অন্যতম মর্যাদাবান রাসূল। তিনি মানবজাতির দ্বিতীয় পিতা হিসেবে পরিচিত এবং শিরক ও মূর্তিপূজায় নিমজ্জিত একটি বিপথগামী জাতির হেদায়াতের জন্য প্রেরিত হয়েছিলেন। তিনি দীর্ঘ ৯৫০ বছর অত্যন্ত ধৈর্য, নিষ্ঠা ও সাহসিকতার সঙ্গে তাঁর জাতিকে আল্লাহর একত্ববাদের প্রতি আহ্বান জানান। তাঁর দাওয়াতি জীবন মানবজাতির জন্য ধৈর্য, প্রজ্ঞা, ত্যাগ ও অবিচলতার এক অনন্য দৃষ্টান্ত। নিম্নে হজরত নূহ (আ.)-এর সংক্ষিপ্ত জীবনী এবং কুরআন ও সুন্নাহর আলোকে তাঁর দাওয়াতের পদ্ধতি আলোচনা করা হলো।</p><div class=\"h hm\">হজরত নূহ (আ.)-এর সংক্ষিপ্ত জীবনী</div><div class=\"h hs hs2\">১. পরিচয় ও বংশপরিচয়</div><p>হজরত নূহ (আ.) ছিলেন মহান আল্লাহর একজন সম্মানিত নবী ও রাসূল। তিনি আদম (আ.)-এর বহু প্রজন্ম পরবর্তী সময়ে পৃথিবীতে আগমন করেন। তাঁর পিতার নাম সম্পর্কে ঐতিহাসিক বর্ণনায় বিভিন্ন মত পাওয়া যায়। প্রচলিত বংশতালিকা অনুযায়ী তিনি লামেকের পুত্র এবং ইদরিস (আ.)-এর পরবর্তী প্রজন্মের একজন নবী ছিলেন। তিনি মানবজাতির মধ্যে প্রথম রাসূল হিসেবে পরিচিত, যিনি শিরক ও মূর্তিপূজার বিরুদ্ধে ব্যাপকভাবে তাওহিদের দাওয়াত প্রদান করেন।</p><p>সহিহ বুখারির হাদিসে কিয়ামতের ময়দানে মানুষ হজরত নূহ (আ.)-কে প্রথম রাসূল হিসেবে উল্লেখ করে সাহায্য প্রার্থনা করবে বলে বর্ণিত হয়েছে।</p><div class=\"h hs hs2\">২. নবুওয়াত লাভ ও জাতির অবস্থা</div><p>হজরত নূহ (আ.)-এর যুগে মানুষ এক আল্লাহর ইবাদত থেকে দূরে সরে গিয়ে মূর্তিপূজায় লিপ্ত হয়ে পড়ে। তারা ওয়াদ, সুওয়া, ইয়াগুস, ইয়াউক ও নাসর নামক মূর্তিগুলোর পূজা করত। এসব মূর্তি মূলত তাদের পূর্ববর্তী কিছু নেককার ব্যক্তির নামানুসারে তৈরি হয়েছিল। পরবর্তীকালে মানুষ সেগুলোকে উপাস্য হিসেবে গ্রহণ করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا</div></div><p>অর্থ: তারা বলেছিল, তোমরা কখনো তোমাদের উপাস্যদের পরিত্যাগ করো না এবং ওয়াদ, সুওয়া, ইয়াগুস, ইয়াউক ও নাসরকেও পরিত্যাগ করো না। (সূরা নূহ: ২৩)</p><p>এমন শিরকপূর্ণ পরিবেশে মহান আল্লাহ হজরত নূহ (আ.)-কে নবী ও রাসূল হিসেবে প্রেরণ করেন।</p><div class=\"h hs hs2\">৩. নবুওয়াতের দায়িত্ব ও দাওয়াতের সূচনা</div><p>নবুওয়াত লাভের পর হজরত নূহ (আ.) তাঁর জাতিকে এক আল্লাহর ইবাদতের প্রতি আহ্বান জানান। তিনি তাদের মূর্তিপূজা পরিত্যাগ করে আল্লাহর আনুগত্য করার নির্দেশ দেন এবং আল্লাহর অবাধ্যতার পরিণতি সম্পর্কে সতর্ক করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ أَنْ أَنْذِرْ قَوْمَكَ مِنْ قَبْلِ أَنْ يَأْتِيَهُمْ عَذَابٌ أَلِيمٌ</div></div><p>অর্থ: নিশ্চয়ই আমি নূহকে তাঁর সম্প্রদায়ের কাছে পাঠিয়েছিলাম এই নির্দেশ দিয়ে যে, আপনার সম্প্রদায়কে সতর্ক করুন তাদের কাছে যন্ত্রণাদায়ক শাস্তি আসার পূর্বে। (সূরা নূহ: ১)</p><div class=\"h hs hs2\">৪. দীর্ঘ ৯৫০ বছরের দাওয়াতি জীবন</div><p>হজরত নূহ (আ.)-এর জীবনের সবচেয়ে উল্লেখযোগ্য দিক হলো তাঁর দীর্ঘ দাওয়াতি জীবন। তিনি প্রায় ৯৫০ বছর তাঁর জাতির মধ্যে অবস্থান করে আল্লাহর দ্বীনের দাওয়াত প্রদান করেন। এত দীর্ঘ সময় দাওয়াত দেওয়ার পরও অল্পসংখ্যক মানুষ তাঁর প্রতি ঈমান গ্রহণ করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا</div></div><p>অর্থ: অতঃপর তিনি তাদের মধ্যে পঞ্চাশ বছর কম এক হাজার বছর অবস্থান করেছিলেন। (সূরা আল-আনকাবুত: ১৪)</p><div class=\"h hs hs2\">৫. মহাপ্লাবন ও নৌকা নির্মাণ</div><p>দীর্ঘদিন দাওয়াত প্রদানের পরও যখন তাঁর জাতির অধিকাংশ মানুষ অবাধ্যতা ও শিরকের ওপর অটল থাকে, তখন আল্লাহর নির্দেশে তিনি একটি বিশাল নৌকা নির্মাণ করেন। আল্লাহর নির্দেশে মুমিনদের এবং বিভিন্ন প্রাণীর জোড়া নৌকায় উঠানো হয়। অতঃপর মহাপ্লাবনের মাধ্যমে অবিশ্বাসী জাতিকে ধ্বংস করা হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَأَنْجَيْنَاهُ وَأَصْحَابَ السَّفِينَةِ وَجَعَلْنَاهَا آيَةً لِلْعَالَمِينَ</div></div><p>অর্থ: অতঃপর আমি তাঁকে এবং নৌকায় আরোহণকারীদের রক্ষা করলাম এবং একে বিশ্ববাসীর জন্য নিদর্শন বানিয়ে দিলাম। (সূরা আল-আনকাবুত: ১৫)</p><div class=\"h hs hs2\">৬. হজরত নূহ (আ.)-এর ইন্তেকাল</div><p>মহাপ্লাবনের পর হজরত নূহ (আ.) ও তাঁর সঙ্গে ঈমান গ্রহণকারী ব্যক্তিরা নতুনভাবে জীবনযাপন শুরু করেন। তাঁর মৃত্যুর নির্দিষ্ট সময় ও স্থান সম্পর্কে কুরআন ও সহিহ হাদিসে বিস্তারিত তথ্য পাওয়া যায় না। তবে তিনি মহান আল্লাহর একজন সম্মানিত রাসূল হিসেবে মানবজাতির ইতিহাসে স্মরণীয় হয়ে আছেন।</p><div class=\"h hm\">কুরআন ও সুন্নাহর আলোকে হজরত নূহ (আ.)-এর দাওয়াতের পদ্ধতি</div><p>হজরত নূহ (আ.)-এর দাওয়াতি জীবন ছিল অত্যন্ত শিক্ষণীয় ও অনুসরণযোগ্য। তিনি তাঁর জাতিকে আল্লাহর পথে আহ্বান করার জন্য বিভিন্ন পদ্ধতি অবলম্বন করেছিলেন। পবিত্র কুরআনের সূরা নূহে তাঁর দাওয়াতের পদ্ধতিগুলো বিস্তারিতভাবে বর্ণিত হয়েছে। নিম্নে সেগুলো আলোচনা করা হলো।</p><div class=\"h hs hs2\">১. তাওহিদের প্রতি আহ্বান ও শিরক বর্জনের দাওয়াত</div><p>হজরত নূহ (আ.)-এর দাওয়াতের মূল বিষয় ছিল আল্লাহর একত্ববাদ প্রতিষ্ঠা করা। তিনি তাঁর জাতিকে একমাত্র আল্লাহর ইবাদত করার নির্দেশ দেন এবং মূর্তিপূজা পরিত্যাগ করতে বলেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٍ</div></div><p>অর্থ: হে আমার সম্প্রদায়! তোমরা আল্লাহর ইবাদত করো। তিনি ছাড়া তোমাদের আর কোনো উপাস্য নেই। নিশ্চয়ই আমি তোমাদের জন্য এক মহাদিবসের শাস্তির আশঙ্কা করছি। (সূরা আল-আ'রাফ: ৫৯)</p><p>এ আয়াত থেকে বোঝা যায়, তিনি সর্বপ্রথম তাঁর জাতিকে তাওহিদের প্রতি আহ্বান জানান এবং শিরকের পরিণতি সম্পর্কে সতর্ক করেন।</p><div class=\"h hs hs2\">২. গোপনে ও প্রকাশ্যে দাওয়াত প্রদান</div><p>হজরত নূহ (আ.) তাঁর জাতিকে কখনো গোপনে আবার কখনো প্রকাশ্যে দাওয়াত দিয়েছেন। তিনি বুঝতে পেরেছিলেন যে, একই পদ্ধতিতে সবাইকে দাওয়াত দিলে কাঙ্ক্ষিত ফল পাওয়া যাবে না। তাই তিনি পরিস্থিতি অনুযায়ী দাওয়াতের পদ্ধতি পরিবর্তন করতেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ثُمَّ إِنِّي دَعَوْتُهُمْ جِهَارًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ثُمَّ إِنِّي أَعْلَنْتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًا</div></div><p>অর্থ: তিনি বললেন, হে আমার রব! নিশ্চয়ই আমি আমার সম্প্রদায়কে রাত-দিন আহ্বান করেছি। অতঃপর আমি তাদের প্রকাশ্যে আহ্বান করেছি। তারপর আমি তাদের প্রকাশ্যে প্রচার করেছি এবং গোপনেও তাদের বুঝিয়েছি। (সূরা নূহ: ৫-৯)</p><p>এ থেকে প্রমাণিত হয় যে, হজরত নূহ (আ.) দাওয়াতের ক্ষেত্রে ব্যক্তিগত ও সম্মিলিত উভয় পদ্ধতি অবলম্বন করেছিলেন।</p><div class=\"h hs hs2\">৩. দিন-রাত নিরবচ্ছিন্নভাবে দাওয়াত প্রদান</div><p>হজরত নূহ (আ.) কখনো দাওয়াতের কাজে বিরতি দেননি। তিনি দিন-রাত সব সময় তাঁর জাতিকে আল্লাহর পথে আহ্বান করতেন। দীর্ঘ সময় ধরে তিনি একই নিষ্ঠা ও আন্তরিকতার সঙ্গে দাওয়াতের দায়িত্ব পালন করেছেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا</div></div><p>অর্থ: তিনি বললেন, হে আমার রব! নিশ্চয়ই আমি আমার সম্প্রদায়কে রাত-দিন আহ্বান করেছি। (সূরা নূহ: ৫)</p><p>এ আয়াত থেকে বোঝা যায়, দাওয়াতের কাজে ধারাবাহিকতা ও আন্তরিকতা অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hs hs2\">৪. সুন্দর উপদেশ ও ক্ষমা প্রার্থনার প্রতি আহ্বান</div><p>হজরত নূহ (আ.) তাঁর জাতিকে শুধু শাস্তির ভয় দেখাননি; বরং আল্লাহর কাছে ক্ষমা প্রার্থনা করার মাধ্যমে তাঁর রহমত লাভের সুসংবাদও দিয়েছেন। তিনি মানুষকে তওবা ও ইস্তিগফারের প্রতি উৎসাহিত করেছেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَيُمْدِدْكُمْ بِأَمْوَالٍ وَبَنِينَ وَيَجْعَلْ لَكُمْ جَنَّاتٍ وَيَجْعَلْ لَكُمْ أَنْهَارًا</div></div><p>অর্থ: অতঃপর আমি বলেছি, তোমরা তোমাদের প্রতিপালকের কাছে ক্ষমা প্রার্থনা করো। নিশ্চয়ই তিনি অত্যন্ত ক্ষমাশীল। তিনি তোমাদের ওপর প্রচুর বৃষ্টিধারা বর্ষণ করবেন। তিনি তোমাদের ধন-সম্পদ ও সন্তান-সন্ততি বৃদ্ধি করবেন এবং তোমাদের জন্য উদ্যান স্থাপন করবেন ও নদী-নালা প্রবাহিত করবেন। (সূরা নূহ: ১০-১২)</p><p>এখানে তিনি ক্ষমা প্রার্থনার মাধ্যমে দুনিয়াবি কল্যাণ ও আল্লাহর রহমত লাভের বিষয়টি তুলে ধরেছেন।</p><div class=\"h hs hs2\">৫. যুক্তি ও প্রমাণের মাধ্যমে দাওয়াত প্রদান</div><p>হজরত নূহ (আ.) তাঁর জাতিকে আল্লাহর অস্তিত্ব ও ক্ষমতা সম্পর্কে চিন্তা করতে আহ্বান জানান। তিনি আকাশ, চন্দ্র, সূর্য, পৃথিবী এবং মানুষের সৃষ্টির বিভিন্ন নিদর্শন তুলে ধরে তাদের বিবেক জাগ্রত করার চেষ্টা করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقَدْ خَلَقَكُمْ أَطْوَارًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَلَمْ تَرَوْا كَيْفَ خَلَقَ اللَّهُ سَبْعَ سَمَاوَاتٍ طِبَاقًا</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَجَعَلَ الْقَمَرَ فِيهِنَّ نُورًا وَجَعَلَ الشَّمْسَ سِرَاجًا</div></div><p>অর্থ: তোমাদের কী হলো যে, তোমরা আল্লাহর মহত্ত্বের যথাযথ মর্যাদা উপলব্ধি করছ না। অথচ তিনি তোমাদের বিভিন্ন পর্যায়ে সৃষ্টি করেছেন। তোমরা কি দেখনি, আল্লাহ কীভাবে স্তরে স্তরে সাত আকাশ সৃষ্টি করেছেন। সেখানে চাঁদকে আলো এবং সূর্যকে প্রদীপরূপে স্থাপন করেছেন। (সূরা নূহ: ১৩-১৬)</p><p>এ আয়াতগুলোতে হজরত নূহ (আ.)-এর যুক্তিনির্ভর দাওয়াতের বিষয়টি স্পষ্টভাবে ফুটে উঠেছে।</p><div class=\"h hs hs2\">৬. ধৈর্য ও সহনশীলতার মাধ্যমে দাওয়াত প্রদান</div><p>হজরত নূহ (আ.)-এর দাওয়াতি জীবনের সবচেয়ে বড় বৈশিষ্ট্য ছিল ধৈর্য ও সহনশীলতা। তাঁর জাতির নেতারা তাঁকে অবজ্ঞা করত এবং সাধারণ মানুষকে তাঁর কাছ থেকে দূরে রাখার চেষ্টা করত। কিন্তু তিনি কখনো হতাশ হননি।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ الْمَلَأُ مِنْ قَوْمِهِ إِنَّا لَنَرَاكَ فِي ضَلَالٍ مُبِينٍ</div></div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ يَا قَوْمِ لَيْسَ بِي ضَلَالَةٌ وَلَكِنِّي رَسُولٌ مِنْ رَبِّ الْعَالَمِينَ</div></div><p>অর্থ: তাঁর সম্প্রদায়ের নেতারা বলল, আমরা তো তোমাকে স্পষ্ট বিভ্রান্তির মধ্যে দেখতে পাচ্ছি। তিনি বললেন, হে আমার সম্প্রদায়! আমার মধ্যে কোনো বিভ্রান্তি নেই। বরং আমি বিশ্বজগতের প্রতিপালকের পক্ষ থেকে প্রেরিত রাসূল। (সূরা আল-আ'রাফ: ৬০-৬১)</p><p>তিনি বিরোধীদের অপমানের জবাবে ধৈর্য ও আত্মবিশ্বাসের পরিচয় দেন।</p><div class=\"h hs hs2\">৭. জাতির নেতাদের অহংকার ও বিরোধিতার মোকাবিলা</div><p>হজরত নূহ (আ.)-এর জাতির প্রভাবশালী ব্যক্তিরা তাঁর দাওয়াতের বিরোধিতা করত। তারা তাঁকে সাধারণ ও দুর্বল মানুষের নেতা বলে উপহাস করত। কিন্তু তিনি ধনী-গরিবের মধ্যে কোনো পার্থক্য না করে সবাইকে সমানভাবে আল্লাহর পথে আহ্বান করতেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالُوا أَنُؤْمِنُ لَكَ وَاتَّبَعَكَ الْأَرْذَلُونَ</div></div><p>অর্থ: তারা বলল, আমরা কি তোমার প্রতি ঈমান আনব, অথচ তোমার অনুসরণ করছে সমাজের নিম্নশ্রেণির লোকেরা। (সূরা আশ-শুআরা: ১১১)</p><p>এর উত্তরে হজরত নূহ (আ.) তাঁর অনুসারীদের অবজ্ঞা করতে অস্বীকার করেন এবং তাদের ঈমানের মর্যাদা রক্ষা করেন।</p><div class=\"h hs hs2\">৮. বিনিময় ও পার্থিব স্বার্থ ছাড়া দাওয়াত প্রদান</div><p>হজরত নূহ (আ.) তাঁর দাওয়াতের বিনিময়ে কোনো পারিশ্রমিক বা পার্থিব সুবিধা দাবি করেননি। তিনি সম্পূর্ণ আল্লাহর সন্তুষ্টির জন্য দাওয়াতের দায়িত্ব পালন করেছেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَيَا قَوْمِ لَا أَسْأَلُكُمْ عَلَيْهِ مَالًا إِنْ أَجْرِيَ إِلَّا عَلَى اللَّهِ</div></div><p>অর্থ: হে আমার সম্প্রদায়! আমি এর বিনিময়ে তোমাদের কাছে কোনো সম্পদ চাই না। আমার প্রতিদান তো কেবল আল্লাহর কাছেই রয়েছে। (সূরা হুদ: ২৯)</p><p>এ থেকে বোঝা যায়, দাওয়াতের উদ্দেশ্য হবে আল্লাহর সন্তুষ্টি অর্জন, কোনো পার্থিব স্বার্থ হাসিল নয়।</p><div class=\"h hs hs2\">৯. অনুসারীদের প্রতি ভালোবাসা ও সমমর্যাদা প্রদর্শন</div><p>হজরত নূহ (আ.) তাঁর অনুসারীদের প্রতি অত্যন্ত আন্তরিক ছিলেন। তাঁর জাতির নেতারা দরিদ্র ও দুর্বল ঈমানদারদের দূরে সরিয়ে দেওয়ার দাবি জানালে তিনি তা প্রত্যাখ্যান করেন। তিনি স্পষ্ট করে দেন যে, ঈমানদারদের মর্যাদা তাদের সম্পদ বা সামাজিক অবস্থানের ভিত্তিতে নির্ধারিত হয় না।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أَنَا بِطَارِدِ الَّذِينَ آمَنُوا إِنَّهُمْ مُلَاقُو رَبِّهِمْ وَلَكِنِّي أَرَاكُمْ قَوْمًا تَجْهَلُونَ</div></div><p>অর্থ: যারা ঈমান এনেছে, আমি তাদের তাড়িয়ে দিতে পারি না। নিশ্চয়ই তারা তাদের প্রতিপালকের সঙ্গে সাক্ষাৎ করবে। কিন্তু আমি তোমাদের এমন এক সম্প্রদায় হিসেবে দেখছি, যারা অজ্ঞতাপ্রসূত আচরণ করছে। (সূরা হুদ: ২৯)</p><p>এ থেকে বোঝা যায়, দাওয়াতের ক্ষেত্রে ধনী-গরিব, উঁচু-নিচু নির্বিশেষে সকল মানুষের প্রতি সমান আচরণ করতে হবে।</p><div class=\"h hs hs2\">১০. নিজের পরিবার ও সন্তানদের হেদায়াতের জন্য চেষ্টা</div><p>হজরত নূহ (আ.) শুধু তাঁর জাতির জন্যই দাওয়াত প্রদান করেননি; বরং নিজের পরিবার ও সন্তানদের হেদায়াতের জন্যও চেষ্টা করেছেন। তাঁর পুত্র অবাধ্যতা ও কুফরের পথ বেছে নিলে তিনি তাকে নৌকায় ওঠার জন্য আহ্বান জানান।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا بُنَيَّ ارْكَبْ مَعَنَا وَلَا تَكُنْ مَعَ الْكَافِرِينَ</div></div><p>অর্থ: হে আমার প্রিয় পুত্র! আমাদের সঙ্গে আরোহণ করো এবং কাফিরদের সঙ্গে থেকো না। (সূরা হুদ: ৪২)</p><p>এ ঘটনা থেকে বোঝা যায়, একজন দাঈর দায়িত্ব হলো নিজের পরিবার ও সন্তানদেরও সঠিক পথে পরিচালিত করার চেষ্টা করা। তবে হেদায়াত একমাত্র আল্লাহর হাতে।</p><div class=\"h hs hs2\">১১. আল্লাহর ওপর পূর্ণ ভরসা ও নির্ভরশীলতা</div><p>হজরত নূহ (আ.) তাঁর দাওয়াতি জীবনে সবসময় আল্লাহর ওপর ভরসা করেছেন। জাতির বিরোধিতা, অবাধ্যতা ও ষড়যন্ত্রের মধ্যেও তিনি আল্লাহর সাহায্যের ওপর নির্ভরশীল ছিলেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَعَلَى اللَّهِ تَوَكَّلْتُ فَأَجْمِعُوا أَمْرَكُمْ وَشُرَكَاءَكُمْ</div></div><p>অর্থ: সুতরাং আমি আল্লাহর ওপরই ভরসা করেছি। অতএব তোমরা তোমাদের যাবতীয় পরিকল্পনা ও তোমাদের উপাস্যদের একত্র করো। (সূরা ইউনুস: ৭১)</p><p>এ থেকে বোঝা যায়, দাওয়াতের কাজে একজন দাঈর জন্য আল্লাহর ওপর তাওয়াক্কুল করা অপরিহার্য।</p><div class=\"h hs hs2\">১২. দাওয়াতের ব্যর্থতা ও জাতির অবাধ্যতার পর আল্লাহর কাছে সাহায্য প্রার্থনা</div><p>দীর্ঘ সময় দাওয়াত দেওয়ার পরও যখন তাঁর জাতির অধিকাংশ মানুষ সত্য গ্রহণ করেনি এবং তাঁর বিরোধিতায় সীমা অতিক্রম করেছিল, তখন হজরত নূহ (আ.) আল্লাহর কাছে সাহায্য প্রার্থনা করেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَدَعَا رَبَّهُ أَنِّي مَغْلُوبٌ فَانْتَصِرْ</div></div><p>অর্থ: অতঃপর তিনি তাঁর প্রতিপালককে আহ্বান করে বললেন, আমি অসহায় হয়ে পড়েছি। সুতরাং আপনি আমাকে সাহায্য করুন। (সূরা আল-কামার: ১০)</p><p>এরপর আল্লাহ তায়ালা তাঁকে সাহায্য করেন এবং মহাপ্লাবনের মাধ্যমে অবাধ্য জাতিকে ধ্বংস করেন।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, হজরত নূহ (আ.) ছিলেন মানবজাতির ইতিহাসে অন্যতম ধৈর্যশীল ও মহান দাঈ। তিনি দীর্ঘ ৯৫০ বছর ধরে তাঁর জাতিকে তাওহিদের পথে আহ্বান করেছেন। গোপনে ও প্রকাশ্যে দাওয়াত প্রদান, দিন-রাত নিরলস প্রচেষ্টা, যুক্তি ও প্রমাণ উপস্থাপন, সুন্দর উপদেশ, ধৈর্য, সহনশীলতা, বিনিময়হীন দাওয়াত এবং আল্লাহর ওপর পূর্ণ ভরসা ছিল তাঁর দাওয়াতি পদ্ধতির উল্লেখযোগ্য বৈশিষ্ট্য। তাঁর জীবন থেকে শিক্ষা পাওয়া যায় যে, দাওয়াতের কাজে হতাশ হওয়া যাবে না এবং বিরোধিতা সত্ত্বেও সত্যের পথে অবিচল থাকতে হবে। তাই বর্তমান যুগের দাঈ ও ইসলামী চিন্তাবিদদের উচিত হজরত নূহ (আ.)-এর দাওয়াতি আদর্শ অনুসরণ করে কুরআন ও সুন্নাহর আলোকে মানবজাতিকে আল্লাহর পথে আহ্বান করা।</p>"], ["হযরত মূসা (আ.)-এর জীবনের সংক্ষিপ্ত বিবরণ দাও এবং তাঁর সঙ্গে তাঁর কওমের বিরোধিতার বিষয়গুলো উল্লেখ কর।", "<div class=\"h hm\">ভূমিকা</div><p>হযরত মূসা (আ.) ছিলেন মহান আল্লাহর প্রেরিত একজন সম্মানিত নবী ও রাসূল। তিনি বনি ইসরাঈলের হেদায়েতের জন্য প্রেরিত হয়েছিলেন। তাঁর সময়ে মিসরের শাসক ফিরআউন নিজেকে প্রভু বলে দাবি করত এবং বনি ইসরাঈলের ওপর নির্মম অত্যাচার চালাত। আল্লাহ তাআলা হযরত মূসা (আ.)-কে ফিরআউনের কাছে তাওহিদের দাওয়াত পৌঁছে দেওয়ার এবং বনি ইসরাঈলকে তার অত্যাচার থেকে মুক্ত করার দায়িত্ব প্রদান করেন। তাঁর জীবনে অসংখ্য অলৌকিক ঘটনা, সংগ্রাম, ধৈর্য ও আল্লাহর ওপর ভরসার দৃষ্টান্ত রয়েছে। তবে ফিরআউনের বিরোধিতার পাশাপাশি তাঁর নিজ কওম বনি ইসরাঈলের মধ্যেও নানা অবাধ্যতা ও বিরোধিতা দেখা দিয়েছিল।</p><div class=\"h hm\">হযরত মূসা (আ.)-এর সংক্ষিপ্ত জীবনী</div><div class=\"h hs hs2\">১. জন্ম ও শৈশবকাল</div><p>হযরত মূসা (আ.) মিসরে জন্মগ্রহণ করেন। সে সময় ফিরআউন মিসরের শাসক ছিল। সে বনি ইসরাঈলের পুরুষ সন্তানদের হত্যা করত এবং নারীদের জীবিত রাখত। এভাবে বনি ইসরাঈলের ওপর ভয়াবহ নির্যাতন চালানো হতো। আল্লাহর ইচ্ছায় মূসা (আ.)-এর মা তাঁকে একটি সিন্দুকে রেখে নদীতে ভাসিয়ে দেন। আল্লাহর বিশেষ ব্যবস্থাপনায় সিন্দুকটি ফিরআউনের প্রাসাদে গিয়ে পৌঁছে। ফিরআউনের স্ত্রী তাঁকে নিজের সন্তান হিসেবে গ্রহণ করার ইচ্ছা প্রকাশ করেন। এভাবেই মূসা (আ.) ফিরআউনের প্রাসাদে লালিত-পালিত হন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَوْحَيْنَا إِلَىٰ أُمِّ مُوسَىٰ أَنْ أَرْضِعِيهِ فَإِذَا خِفْتِ عَلَيْهِ فَأَلْقِيهِ فِي الْيَمِّ وَلَا تَخَافِي وَلَا تَحْزَنِي إِنَّا رَادُّوهُ إِلَيْكِ وَجَاعِلُوهُ مِنَ الْمُرْسَلِينَ.</div></div><p>অর্থ: আর আমি মূসার মায়ের কাছে ওহি পাঠালাম যে, তুমি তাকে দুধ পান করাও। যখন তার ব্যাপারে আশঙ্কা করবে, তখন তাকে নদীতে ভাসিয়ে দেবে। ভয় করবে না এবং দুঃখিত হবে না। নিশ্চয়ই আমি তাকে তোমার কাছে ফিরিয়ে দেব এবং তাকে রাসূলদের অন্তর্ভুক্ত করব। (সূরা আল-কাসাস: ৭)</p><div class=\"h hs hs2\">২. মিসর ত্যাগ ও মাদইয়ানে গমন</div><p>যৌবনে একদিন মূসা (আ.) দেখতে পান, একজন বনি ইসরাঈলি ও একজন কিবতি ব্যক্তির মধ্যে ঝগড়া হচ্ছে। বনি ইসরাঈলি ব্যক্তিকে সাহায্য করতে গিয়ে তাঁর আঘাতে কিবতি লোকটি মারা যায়। এটি অনিচ্ছাকৃতভাবে ঘটে। পরবর্তী সময়ে মূসা (আ.) জানতে পারেন যে, ফিরআউনের লোকেরা তাঁকে হত্যার ষড়যন্ত্র করছে। তাই তিনি মিসর ত্যাগ করে মাদইয়ানের দিকে রওনা হন।</p><p>মাদইয়ানে পৌঁছে তিনি দুই নারীর পশুদের পানি পান করাতে সাহায্য করেন। তাঁদের পিতা মূসা (আ.)-এর সততা ও যোগ্যতায় সন্তুষ্ট হয়ে তাঁকে নিজের কন্যার সঙ্গে বিবাহ দেন। সেখানে তিনি কয়েক বছর অবস্থান করেন।</p><div class=\"h hs hs2\">৩. নবুওয়াত লাভ ও আল্লাহর সঙ্গে কথোপকথন</div><p>মাদইয়ান থেকে পরিবারসহ মিসরে ফেরার পথে তূর পাহাড়ের কাছে তিনি আগুন দেখতে পান। সেখানে আল্লাহ তাআলা তাঁকে নবুওয়াত দান করেন এবং ফিরআউনের কাছে যাওয়ার নির্দেশ দেন। এ কারণে মূসা (আ.)-কে কালিমুল্লাহ বলা হয়, অর্থাৎ আল্লাহর সঙ্গে কথোপকথনকারী।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا.</div></div><p>অর্থ: আর আল্লাহ মূসার সঙ্গে সরাসরি কথা বলেছেন। (সূরা আন-নিসা: ১৬৪)</p><div class=\"h hs hs2\">৪. ফিরআউনের কাছে দাওয়াত প্রদান</div><p>নবুওয়াত লাভের পর আল্লাহ তাআলা মূসা (আ.)-কে ফিরআউনের কাছে পাঠান। তিনি ফিরআউনকে এক আল্লাহর ইবাদত করার এবং বনি ইসরাঈলকে মুক্তি দেওয়ার আহ্বান জানান। মূসা (আ.)-এর দাওয়াতকে শক্তিশালী করার জন্য আল্লাহ তাঁকে কয়েকটি মুজিজা দান করেন। তাঁর লাঠি সাপে পরিণত হতো এবং তাঁর হাত বগলের নিচ থেকে বের করলে উজ্জ্বল হয়ে উঠত।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُّبِينٌ وَنَزَعَ يَدَهُ فَإِذَا هِيَ بَيْضَاءُ لِلنَّاظِرِينَ.</div></div><p>অর্থ: অতঃপর তিনি তাঁর লাঠি নিক্ষেপ করলেন, তখনই তা সুস্পষ্ট সাপে পরিণত হলো। আর তিনি তাঁর হাত বের করলেন, তখন তা দর্শকদের কাছে উজ্জ্বল সাদা দেখাতে লাগল। (সূরা আল-আ'রাফ: ১০৭-১০৮)</p><div class=\"h hs hs2\">৫. ফিরআউনের পরাজয় ও বনি ইসরাঈলের মুক্তি</div><p>ফিরআউন মূসা (আ.)-এর দাওয়াত প্রত্যাখ্যান করে এবং তাঁকে জাদুকর বলে অপবাদ দেয়। সে জাদুকরদের সঙ্গে মূসা (আ.)-এর মোকাবিলার আয়োজন করে। কিন্তু আল্লাহর মুজিজার সামনে জাদুকরদের জাদু পরাজিত হয় এবং তারা মূসা (আ.)-এর প্রতি ঈমান আনে। পরবর্তী সময়ে আল্লাহর নির্দেশে মূসা (আ.) বনি ইসরাঈলকে নিয়ে মিসর ত্যাগ করেন। ফিরআউন তার বাহিনী নিয়ে তাঁদের পিছু ধাওয়া করে। আল্লাহর নির্দেশে মূসা (আ.) লাঠি দিয়ে সমুদ্রে আঘাত করলে সমুদ্রের মধ্যে রাস্তা তৈরি হয়। মূসা (আ.) ও তাঁর অনুসারীরা নিরাপদে পার হয়ে যান। ফিরআউন ও তার বাহিনী সমুদ্রে ডুবে ধ্বংস হয়।</p><div class=\"h hs hs2\">৬. তাওরাত লাভ ও তূর পাহাড়ে অবস্থান</div><p>বনি ইসরাঈলকে মুক্ত করার পর মূসা (আ.) আল্লাহর নির্দেশে তূর পাহাড়ে যান। সেখানে তিনি আল্লাহর পক্ষ থেকে তাওরাত লাভ করেন। তাওরাত ছিল বনি ইসরাঈলের জন্য হেদায়েত ও জীবনবিধান। কিন্তু মূসা (আ.)-এর অনুপস্থিতিতে তাঁর কওমের একাংশ সামেরির প্ররোচনায় বাছুরের মূর্তি তৈরি করে তার পূজা শুরু করে। ফিরে এসে মূসা (আ.) তাদের এ শিরক ও অবাধ্যতার জন্য কঠোরভাবে তিরস্কার করেন।</p><div class=\"h hs hs2\">৭. মূসা (আ.)-এর ইন্তেকাল</div><p>হযরত মূসা (আ.) দীর্ঘ জীবনব্যাপী আল্লাহর দ্বীনের প্রচার, বনি ইসরাঈলের সংশোধন এবং জালিম শাসকের বিরুদ্ধে সংগ্রাম করেছেন। তাঁর ইন্তেকালের সুনির্দিষ্ট সময় ও স্থান সম্পর্কে কুরআনে বিস্তারিত বিবরণ নেই। তবে সহিহ হাদিসে তাঁর মৃত্যুর পূর্ববর্তী ঘটনা এবং আল্লাহর কাছে তাঁর মর্যাদার কথা বর্ণিত হয়েছে।</p><div class=\"h hm\">হযরত মূসা (আ.)-এর সঙ্গে তাঁর কওমের বিরোধিতার বিষয়গুলো</div><p>হযরত মূসা (আ.)-এর কওম বনি ইসরাঈলকে আল্লাহ তাআলা ফিরআউনের অত্যাচার থেকে মুক্ত করেছিলেন। তাদের জন্য অসংখ্য নেয়ামত ও নিদর্শন প্রকাশ করেছিলেন। কিন্তু তারা বারবার অবাধ্যতা, অকৃতজ্ঞতা ও বিরোধিতার পরিচয় দিয়েছে। নিম্নে তাদের প্রধান বিরোধিতার বিষয়গুলো আলোচনা করা হলো।</p><div class=\"h hs hs2\">১. আল্লাহর নির্দেশ অমান্য করা</div><p>মূসা (আ.) তাঁর কওমকে আল্লাহর বিধান মেনে চলার নির্দেশ দিতেন। কিন্তু বনি ইসরাঈলের অনেকেই তাঁর নির্দেশ অমান্য করত এবং নিজেদের ইচ্ছামতো চলতে চাইত। তারা আল্লাহর নেয়ামত লাভ করার পরও তাঁর আদেশ পালনে গড়িমসি করত।</p><div class=\"h hs hs2\">২. বাছুরের পূজা করা</div><p>মূসা (আ.) তূর পাহাড়ে যাওয়ার পর সামেরি নামক এক ব্যক্তি বনি ইসরাঈলের লোকদের প্ররোচিত করে বাছুরের মূর্তি তৈরি করে। তারা আল্লাহকে বাদ দিয়ে সেই বাছুরের পূজা শুরু করে। এটি ছিল তাদের সবচেয়ে বড় অবাধ্যতা ও শিরকের ঘটনা।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاتَّخَذَ قَوْمُ مُوسَىٰ مِنْ بَعْدِهِ مِنْ حُلِيِّهِمْ عِجْلًا جَسَدًا لَهُ خُوَارٌ أَلَمْ يَرَوْا أَنَّهُ لَا يُكَلِّمُهُمْ وَلَا يَهْدِيهِمْ سَبِيلًا اتَّخَذُوهُ وَكَانُوا ظَالِمِينَ.</div></div><p>অর্থ: আর মূসার কওম তাঁর অনুপস্থিতিতে নিজেদের অলংকার দিয়ে একটি বাছুরের মূর্তি তৈরি করল, যা শব্দ করত। তারা কি দেখল না যে, তা তাদের সঙ্গে কথা বলতে পারে না এবং তাদের কোনো পথও দেখাতে পারে না? তারা একে উপাস্য হিসেবে গ্রহণ করল এবং তারা ছিল জালিম। (সূরা আল-আ'রাফ: ১৪৮)</p><div class=\"h hs hs2\">৩. আল্লাহকে প্রকাশ্যে দেখার দাবি করা</div><p>বনি ইসরাঈলের কিছু লোক মূসা (আ.)-এর কাছে দাবি করেছিল যে, তারা আল্লাহকে প্রকাশ্যে না দেখা পর্যন্ত ঈমান আনবে না। তাদের এ দাবি ছিল চরম ঔদ্ধত্য ও অবাধ্যতার পরিচয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ قُلْتُمْ يَا مُوسَىٰ لَنْ نُؤْمِنَ لَكَ حَتَّىٰ نَرَى اللَّهَ جَهْرَةً فَأَخَذَتْكُمُ الصَّاعِقَةُ وَأَنْتُمْ تَنْظُرُونَ.</div></div><p>অর্থ: আর স্মরণ করো, যখন তোমরা বলেছিলে, হে মূসা! আমরা কখনো তোমার প্রতি ঈমান আনব না, যতক্ষণ না আমরা আল্লাহকে প্রকাশ্যে দেখতে পাব। অতঃপর তোমাদের চোখের সামনেই বজ্রাঘাত তোমাদের পাকড়াও করেছিল। (সূরা আল-বাকারা: ৫৫)</p><div class=\"h hs hs2\">৪. আল্লাহর নেয়ামতের প্রতি অকৃতজ্ঞতা</div><p>আল্লাহ তাআলা বনি ইসরাঈলকে ফিরআউনের অত্যাচার থেকে মুক্ত করেছিলেন, তাদের জন্য সমুদ্রকে বিভক্ত করেছিলেন এবং মরুভূমিতে খাদ্যের ব্যবস্থা করেছিলেন। কিন্তু তারা এসব নেয়ামতের প্রতি কৃতজ্ঞতা প্রকাশ না করে অভিযোগ ও অসন্তুষ্টি প্রকাশ করত। তারা একই ধরনের খাবারে বিরক্ত হয়ে বিভিন্ন খাদ্য দাবি করেছিল।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ قُلْتُمْ يَا مُوسَىٰ لَنْ نَصْبِرَ عَلَىٰ طَعَامٍ وَاحِدٍ فَادْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنْبِتُ الْأَرْضُ مِنْ بَقْلِهَا وَقِثَّائِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا.</div></div><p>অর্থ: আর স্মরণ করো, যখন তোমরা বলেছিলে, হে মূসা! আমরা একই ধরনের খাবারের ওপর কখনো ধৈর্য ধারণ করতে পারব না। সুতরাং তুমি তোমার প্রতিপালকের কাছে আমাদের জন্য প্রার্থনা করো, তিনি যেন আমাদের জন্য জমিতে উৎপন্ন শাকসবজি, শসা, গম, মসুর ও পেঁয়াজ উৎপন্ন করেন। (সূরা আল-বাকারা: ৬১)</p><div class=\"h hs hs2\">৫. জিহাদে অংশগ্রহণ করতে অস্বীকৃতি</div><p>আল্লাহ তাআলা বনি ইসরাঈলকে পবিত্র ভূমিতে প্রবেশ করার নির্দেশ দিয়েছিলেন। কিন্তু তারা সেখানে বসবাসকারী শক্তিশালী জাতিকে ভয় পেয়ে মূসা (আ.)-এর নির্দেশ অমান্য করে। তারা মূসা (আ.)-কে বলে যে, ওই জাতি সেখানে থাকা পর্যন্ত তারা কখনো প্রবেশ করবে না। এমনকি তারা মূসা (আ.) ও তাঁর ভাই হারুন (আ.)-কে সেখানে গিয়ে যুদ্ধ করার কথা বলে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالُوا يَا مُوسَىٰ إِنَّ فِيهَا قَوْمًا جَبَّارِينَ وَإِنَّا لَنْ نَدْخُلَهَا حَتَّىٰ يَخْرُجُوا مِنْهَا فَإِنْ يَخْرُجُوا مِنْهَا فَإِنَّا دَاخِلُونَ.</div></div><p>অর্থ: তারা বলল, হে মূসা! সেখানে এক অত্যাচারী শক্তিশালী জাতি রয়েছে। তারা সেখান থেকে বের না হওয়া পর্যন্ত আমরা কখনো সেখানে প্রবেশ করব না। তারা সেখান থেকে বের হয়ে গেলে নিশ্চয়ই আমরা প্রবেশ করব। (সূরা আল-মায়িদা: ২২)</p><div class=\"h hs hs2\">৬. মূসা (আ.)-কে কষ্ট দেওয়া ও অপবাদ দেওয়া</div><p>বনি ইসরাঈলের কিছু লোক মূসা (আ.)-কে বিভিন্নভাবে কষ্ট দিত এবং তাঁর প্রতি অসম্মানজনক আচরণ করত। তারা তাঁর নির্দেশ নিয়ে প্রশ্ন তুলত এবং কখনো কখনো তাঁর বিরুদ্ধে অপবাদও দিত। তাদের এ ধরনের আচরণ মূসা (আ.)-এর জন্য অত্যন্ত কষ্টদায়ক ছিল।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَكُونُوا كَالَّذِينَ آذَوْا مُوسَىٰ فَبَرَّأَهُ اللَّهُ مِمَّا قَالُوا وَكَانَ عِنْدَ اللَّهِ وَجِيهًا.</div></div><p>অর্থ: হে মুমিনগণ! তোমরা তাদের মতো হয়ো না, যারা মূসাকে কষ্ট দিয়েছিল। অতঃপর তারা যা বলেছিল, আল্লাহ তা থেকে তাঁকে নির্দোষ প্রমাণিত করেছেন। আর তিনি আল্লাহর কাছে মর্যাদাবান ছিলেন। (সূরা আল-আহযাব: ৬৯)</p><div class=\"h hs hs2\">৭. মূসা (আ.)-এর নেতৃত্ব নিয়ে অসন্তুষ্টি প্রকাশ</div><p>বনি ইসরাঈলের কিছু লোক মূসা (আ.)-এর নেতৃত্ব ও নির্দেশনার প্রতি অসন্তুষ্টি প্রকাশ করত। তারা তাঁর কথা মেনে চলার পরিবর্তে নিজেদের মতামতকে প্রাধান্য দিতে চাইত। আল্লাহর রাসূলের নেতৃত্বের প্রতি এ ধরনের অবাধ্যতা তাদের ঈমানি দুর্বলতার পরিচয় বহন করে।</p><div class=\"h hs hs2\">৮. কারুনের বিদ্রোহ ও অহংকার</div><p>কারুন ছিল মূসা (আ.)-এর কওমের একজন ব্যক্তি। আল্লাহ তাকে প্রচুর ধনসম্পদ দান করেছিলেন। কিন্তু সে সম্পদের অহংকারে সীমা অতিক্রম করে এবং মূসা (আ.)-এর উপদেশ উপেক্ষা করে। সে নিজ সম্পদকে নিজের যোগ্যতা
