 অপরিসীম। জিহাদ শুধু যুদ্ধের মধ্যে সীমাবদ্ধ নয়; বরং আত্মশুদ্ধি, জ্ঞানচর্চা, সত্য প্রচার, অন্যায় প্রতিরোধ ও মানবকল্যাণে সর্বাত্মক প্রচেষ্টাও এর অন্তর্ভুক্ত। নিম্নে দাওয়াহর ক্ষেত্রে জিহাদের গুরুত্ব দলিলসহ আলোচনা করা হলো—</p><p><b>১। ইসলামের বাণী প্রচার:</b></p><p>ইসলামের সঠিক শিক্ষা, আদর্শ ও বিধিবিধান মানুষের কাছে পৌঁছে দেওয়া জিহাদের অন্যতম গুরুত্বপূর্ণ দিক। একজন দায়ী নিজের জ্ঞান, সময়, শ্রম ও সামর্থ্য ব্যয় করে মানুষকে আল্লাহর পথে আহ্বান করেন। এর মাধ্যমে সমাজে ইসলামের শিক্ষা বিস্তার লাভ করে এবং মানুষ সত্য ও কল্যাণের পথ সম্পর্কে জানতে পারে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَجَاهِدُوا فِي اللَّهِ حَقَّ جِهَادِهِ هُوَ اجْتَبَاكُمْ وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ</div></div><p>অর্থ: তোমরা আল্লাহর পথে যথাযথভাবে জিহাদ করো। তিনি তোমাদের মনোনীত করেছেন এবং দ্বীনের ব্যাপারে তোমাদের ওপর কোনো কঠিন বিধান আরোপ করেননি।</p><div class=\"rf\">সূরা আল-হাজ্জ, আয়াত: ৭৮</div><p>এ আয়াত থেকে বোঝা যায়, আল্লাহর দ্বীনের জন্য যথাসাধ্য প্রচেষ্টা চালানো মুমিনের গুরুত্বপূর্ণ দায়িত্ব।</p><p><b>২। আত্মশুদ্ধি অর্জন:</b></p><p>নিজের প্রবৃত্তি, লোভ, হিংসা, অহংকার, ক্রোধ ও পাপাচারের বিরুদ্ধে সংগ্রাম করা জিহাদের গুরুত্বপূর্ণ দিক। একজন দায়ী যদি নিজের চরিত্র সংশোধন করতে পারেন, তাহলে তাঁর দাওয়াত মানুষের কাছে অধিক গ্রহণযোগ্য হয়। আত্মশুদ্ধির মাধ্যমে মানুষ তাকওয়া, ধৈর্য, সততা ও নৈতিকতার গুণাবলি অর্জন করে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ</div></div><p>অর্থ: আর যারা আমার পথে সর্বাত্মক প্রচেষ্টা চালায়, আমি অবশ্যই তাদের আমার পথসমূহের দিশা দেব। নিশ্চয়ই আল্লাহ সৎকর্মশীলদের সঙ্গে আছেন।</p><div class=\"rf\">সূরা আল-আনকাবুত, আয়াত: ৬৯</div><p>এ আয়াত আত্মশুদ্ধি ও আল্লাহর আনুগত্যের পথে আন্তরিক প্রচেষ্টার গুরুত্ব তুলে ধরে।</p><p><b>৩। সত্য ও ন্যায় প্রতিষ্ঠা:</b></p><p>অন্যায়, অবিচার, জুলুম ও দুর্নীতির বিরুদ্ধে ন্যায়সংগতভাবে অবস্থান নেওয়া জিহাদের অন্যতম উদ্দেশ্য। ইসলামী দাওয়াহ মানুষকে সত্যের পক্ষে দাঁড়াতে, ন্যায়বিচার প্রতিষ্ঠা করতে এবং অন্যায়ের প্রতিবাদ করতে শিক্ষা দেয়। এর ফলে সমাজে ন্যায়নীতি, মানবিকতা ও ইনসাফ প্রতিষ্ঠিত হয়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ</div></div><p>অর্থ: হে মুমিনগণ! তোমরা ন্যায়বিচারে দৃঢ়ভাবে প্রতিষ্ঠিত থাকো এবং আল্লাহর জন্য সাক্ষ্যদাতা হও, যদিও তা তোমাদের নিজেদের, পিতা-মাতা অথবা নিকটাত্মীয়দের বিরুদ্ধে যায়।</p><div class=\"rf\">সূরা আন-নিসা, আয়াত: ১৩৫</div><p>এ আয়াত প্রমাণ করে, সত্য ও ন্যায় প্রতিষ্ঠায় ব্যক্তিগত স্বার্থের ঊর্ধ্বে ওঠা মুমিনের কর্তব্য।</p><p><b>৪। জ্ঞান ও কলমের মাধ্যমে দাওয়াহ:</b></p><p>ইসলামের শিক্ষা প্রচার, জ্ঞান অর্জন, বই লেখা, গবেষণা, প্রবন্ধ রচনা এবং যুক্তিপূর্ণ আলোচনার মাধ্যমে সত্য তুলে ধরাও জিহাদের গুরুত্বপূর্ণ মাধ্যম। জ্ঞান ও কলমের মাধ্যমে মানুষের ভুল ধারণা দূর করা, ইসলামের সৌন্দর্য তুলে ধরা এবং ধর্মীয় সচেতনতা সৃষ্টি করা সম্ভব।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَا تُطِعِ الْكَافِرِينَ وَجَاهِدْهُمْ بِهِ جِهَادًا كَبِيرًا</div></div><p>অর্থ: অতএব আপনি কাফিরদের আনুগত্য করবেন না এবং এ কুরআনের মাধ্যমে তাদের বিরুদ্ধে বড় ধরনের জিহাদ করুন।</p><div class=\"rf\">সূরা আল-ফুরকান, আয়াত: ৫২</div><p>এখানে কুরআনের মাধ্যমে জিহাদ করার নির্দেশ দেওয়া হয়েছে। অর্থাৎ কুরআনের শিক্ষা, যুক্তি ও দলিলের মাধ্যমে সত্য প্রতিষ্ঠা করা দাওয়াহর একটি গুরুত্বপূর্ণ পদ্ধতি।</p><p><b>৫। ধৈর্য ও ত্যাগের মনোভাব সৃষ্টি:</b></p><p>ইসলামী দাওয়াহর পথে নানা বাধা, বিরোধিতা, কষ্ট ও প্রতিকূলতা আসতে পারে। এসব পরিস্থিতিতে একজন দায়ীকে ধৈর্য, সাহস, নিষ্ঠা ও ত্যাগের মনোভাব নিয়ে কাজ করতে হয়। জিহাদের শিক্ষা মানুষকে বাধা-বিপত্তি অতিক্রম করে আল্লাহর দ্বীনের পথে অবিচল থাকতে অনুপ্রাণিত করে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِّنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِّنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ وَبَشِّرِ الصَّابِرِينَ</div></div><p>অর্থ: আর অবশ্যই আমি তোমাদের কিছু ভয়, ক্ষুধা, ধন-সম্পদ, জীবন ও ফল-ফসলের ক্ষয়ক্ষতির মাধ্যমে পরীক্ষা করব। আর আপনি ধৈর্যশীলদের সুসংবাদ দিন।</p><div class=\"rf\">সূরা আল-বাকারা, আয়াত: ১৫৫</div><p>এ আয়াত দাওয়াহর পথে বিপদ ও প্রতিকূলতা মোকাবিলায় ধৈর্য ধারণের শিক্ষা দেয়।</p><p><b>৬। দুর্বল ও নির্যাতিত মানুষের পাশে দাঁড়ানো:</b></p><p>অসহায়, দুর্বল ও নির্যাতিত মানুষের অধিকার রক্ষা করা এবং তাদের ওপর অত্যাচার বন্ধে ন্যায়সংগত প্রচেষ্টা চালানো জিহাদের গুরুত্বপূর্ণ দিক। ইসলামী দাওয়াহ মানুষকে মজলুমের পাশে দাঁড়াতে, জুলুমের প্রতিবাদ করতে এবং মানবিক মর্যাদা প্রতিষ্ঠায় কাজ করতে উদ্বুদ্ধ করে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا لَكُمْ لَا تُقَاتِلُونَ فِي سَبِيلِ اللَّهِ وَالْمُسْتَضْعَفِينَ مِنَ الرِّجَالِ وَالنِّسَاءِ وَالْوِلْدَانِ الَّذِينَ يَقُولُونَ رَبَّنَا أَخْرِجْنَا مِنْ هَذِهِ الْقَرْيَةِ الظَّالِمِ أَهْلُهَا وَاجْعَلْ لَنَا مِنْ لَدُنْكَ وَلِيًّا وَاجْعَلْ لَنَا مِنْ لَدُنْكَ نَصِيرًا</div></div><p>অর্থ: তোমাদের কী হলো যে, তোমরা আল্লাহর পথে এবং অসহায়-নির্যাতিত পুরুষ, নারী ও শিশুদের মুক্তির জন্য সংগ্রাম করছ না? যারা বলে, হে আমাদের প্রতিপালক! আমাদের এ জনপদ থেকে উদ্ধার করুন, যার অধিবাসীরা অত্যাচারী। আর আপনার পক্ষ থেকে আমাদের জন্য একজন অভিভাবক নির্ধারণ করুন এবং আপনার পক্ষ থেকে আমাদের জন্য একজন সাহায্যকারী নিযুক্ত করুন।</p><div class=\"rf\">সূরা আন-নিসা, আয়াত: ৭৫</div><p>এ আয়াত থেকে বোঝা যায়, নির্যাতিত ও অসহায় মানুষের মুক্তি এবং অধিকার রক্ষার জন্য প্রচেষ্টা চালানো ইসলামের গুরুত্বপূর্ণ শিক্ষা।</p><p><b>৭। ইসলামের মর্যাদা ও নিরাপত্তা রক্ষা:</b></p><p>ইসলামের শিক্ষা, মুসলমানদের ধর্মীয় অধিকার এবং মানুষের জানমালের নিরাপত্তা রক্ষায় ন্যায়সংগত প্রচেষ্টা জিহাদের অন্তর্ভুক্ত। ইসলাম ধর্মীয় স্বাধীনতা ও উপাসনালয়ের নিরাপত্তার প্রতিও গুরুত্ব দিয়েছে। তবে এ ক্ষেত্রে শরিয়তের বিধান, বৈধ কর্তৃত্ব এবং ন্যায়নীতির সীমারেখা মেনে চলা অপরিহার্য।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَوْلَا دَفْعُ اللَّهِ النَّاسَ بَعْضَهُمْ بِبَعْضٍ لَّهُدِّمَتْ صَوَامِعُ وَبِيَعٌ وَصَلَوَاتٌ وَمَسَاجِدُ يُذْكَرُ فِيهَا اسْمُ اللَّهِ كَثِيرًا</div></div><p>অর্থ: আল্লাহ যদি মানুষের এক দলকে অন্য দল দ্বারা প্রতিহত না করতেন, তাহলে বিধ্বস্ত হয়ে যেত অনেক উপাসনালয়, গির্জা, ইহুদিদের উপাসনালয় এবং মসজিদ, যেখানে অধিক পরিমাণে আল্লাহর নাম স্মরণ করা হয়।</p><div class=\"rf\">সূরা আল-হাজ্জ, আয়াত: ৪০</div><p>এ আয়াত থেকে বোঝা যায়, ধর্মীয় উপাসনালয় ও উপাসনার স্বাধীনতা রক্ষা করা এবং জুলুম প্রতিহত করা ইসলামের গুরুত্বপূর্ণ উদ্দেশ্য।</p><p><b>৮। মানবকল্যাণ ও সমাজ সংস্কার:</b></p><p>জিহাদের চেতনা মানুষকে ব্যক্তিগত স্বার্থের ঊর্ধ্বে উঠে সমাজের কল্যাণে কাজ করতে উৎসাহিত করে। দরিদ্রদের সাহায্য, অসহায়দের সেবা, অজ্ঞতা দূরীকরণ, শিক্ষার প্রসার এবং সামাজিক অনাচার প্রতিরোধের মাধ্যমে সমাজকে সুন্দর ও কল্যাণমুখী করা যায়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ</div></div><p>অর্থ: তোমরা সৎকর্ম ও তাকওয়ার কাজে পরস্পর সহযোগিতা করো; পাপ ও সীমালঙ্ঘনের কাজে একে অপরকে সহযোগিতা করো না।</p><div class=\"rf\">সূরা আল-মায়িদা, আয়াত: ২</div><p>এ আয়াত সমাজের কল্যাণে সম্মিলিত প্রচেষ্টা চালানো এবং অন্যায় কাজে সহযোগিতা না করার নির্দেশ দেয়।</p><p><b>সারকথা:</b> জিহাদের চেতনা ইসলামী দাওয়াহকে শক্তিশালী করে। আত্মশুদ্ধি, জ্ঞানচর্চা, সত্য প্রচার, ন্যায় প্রতিষ্ঠা, নির্যাতিত মানুষের অধিকার রক্ষা ও মানবকল্যাণে সর্বাত্মক প্রচেষ্টার মাধ্যমে দাওয়াহর উদ্দেশ্য বাস্তবায়িত হয়।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, জিহাদ ইসলামের একটি গুরুত্বপূর্ণ শিক্ষা, যার ব্যাপক অর্থ হলো আল্লাহর সন্তুষ্টির জন্য সর্বাত্মক প্রচেষ্টা চালানো। জিহাদ ও সন্ত্রাস এক নয়; বরং সন্ত্রাসের মাধ্যমে নিরপরাধ মানুষের ক্ষতি করা ইসলামের ন্যায়নীতি ও মানবিক শিক্ষার পরিপন্থী। তাই ইসলামী দাওয়াহর ক্ষেত্রে আত্মশুদ্ধি, জ্ঞানচর্চা, সত্য প্রচার, অন্যায় প্রতিরোধ ও মানবকল্যাণমূলক কাজে জিহাদের চেতনা বাস্তবায়ন করা প্রত্যেক মুসলমানের কর্তব্য।</p>"], ["মিডিয়া কী? তা কত প্রকার ও কী কী? ইসলামী দাওয়াহ সম্প্রসারণে মিডিয়ার গুরুত্ব বর্ণনা কর।", "<p>আল্লাহপ্রদত্ত ও রাসূল (সা.) প্রদর্শিত একমাত্র জীবনবিধান ইসলাম। ইসলাম প্রচার ও প্রসার এবং প্রতিষ্ঠার অন্যতম প্রক্রিয়া হলো দাওয়াত। বিশ্বব্যাপী কায়েমি স্বার্থবাদীদের শাসন-শোষণের অবসান ঘটিয়ে ইসলামের পতাকা উড্ডীন করার লক্ষ্যে যুগে যুগে নবী-রাসূলগণ এ দায়িত্ব পালন করেছেন। তাঁদের আগমন বন্ধ হলেও দাওয়াতের কাজ বন্ধ হয়নি। বরং উম্মতে মুহাম্মদি তথা ওয়ারাসাতুল আম্বিয়াগণের মাধ্যমে নবী (সা.)-এর পরবর্তী সময় থেকে অদ্যাবধি দাওয়াতের কার্যক্রম চালু আছে এবং কিয়ামত পর্যন্ত চলতে থাকবে। তবে বিজ্ঞান ও প্রযুক্তিনির্ভর আধুনিককালেও দাওয়াতের কার্যক্রমের তৎপরতা বিভিন্নজন বিভিন্নভাবে অব্যাহত রেখেছেন।</p><div class=\"h\">মিডিয়ার পরিচয়:</div><p>আভিধানিক অর্থ: <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إعلام</span> শব্দটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إفعال</span>-এর মাসদার। ইংরেজিতে এটি Media বা মিডিয়া হিসেবে প্রচলিত। এর অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> মাধ্যম।</p><p>২। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">وَسَائِلُ الْإِعْلَانِ</span> তথা প্রচারমাধ্যম।</p><p style=\"padding-left:4px\"><b>৩।</b> গণমাধ্যম।</p><p>৪। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إِعْلَامِي</span> তথা তথ্যবিষয়ক মাধ্যম।</p><p style=\"padding-left:4px\"><b>৫।</b> তথ্যভিত্তিক মাধ্যম।</p><p style=\"padding-left:4px\"><b>৬।</b> তথ্যপূর্ণ মধ্যস্থ।</p><p style=\"padding-left:4px\"><b>৭।</b> সেতু।</p><p style=\"padding-left:4px\"><b>৮।</b> সিঁড়ি।</p><div class=\"h\">পারিভাষিক সংজ্ঞা:</div><p>১। কম্পিউটার প্রযুক্তিতে যে ব্যবস্থায় প্রয়োজনীয় লেখালেখি (Text), গ্রাফিক্স (Graphics), অডিও (Audio), ভিডিও (Video) ইত্যাদিসহ নানা মাধ্যমে কাজ করা যায়, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إعلام</span> বা মিডিয়া বলে।</p><p>২। যে ব্যবস্থায় কোনো বিষয় অর্থপূর্ণভাবে আধুনিক প্রযুক্তিতে প্রকাশ করা যায়, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إعلام</span> বা মিডিয়া বলে।</p><p>৩। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إعلام</span> এমন এক সমন্বিত ব্যবস্থা, যাতে উন্নত প্রযুক্তিতে সচল, সজীব ও আকর্ষণীয় ভুবন গড়ে তোলা যায়।</p><div class=\"h\">إعلام-এর প্রকারভেদ:</div><p>মিডিয়া তথা প্রচারমাধ্যম প্রধানত দুই প্রকার। যথা—</p><p>১। প্রিন্টিং মিডিয়া (Printing Media) বা মুদ্রণ মাধ্যম।</p><p>২। ইলেকট্রনিক মিডিয়া (Electronic Media) বা বৈদ্যুতিক সম্প্রচার মাধ্যম।</p><p>নিম্নে তা আলোচনা করা হলো—</p><p><b>১। প্রিন্টিং মিডিয়া (Printing Media):</b></p><p>কাগজের ওপর ছাপার অক্ষরে যেসব তথ্য প্রচার করা হয়, তাকে প্রিন্টিং মিডিয়া বা মুদ্রণ মাধ্যম বলে। যেমন—সংবাদপত্র, পত্রিকা, ম্যাগাজিন, পোস্টার, লিফলেট, হ্যান্ডবিল, চিঠিপত্র প্রভৃতি। যেকোনো সময় তথ্য-উপাত্তের ক্ষেত্রে এটি সহজ মাধ্যম বলে এর গ্রহণযোগ্যতা ব্যাপক।</p><p><b>২। ইলেকট্রনিক মিডিয়া (Electronic Media):</b></p><p>বৈদ্যুতিক মাধ্যম ব্যবহার করে যে তথ্য-উপাত্ত প্রচার করা হয়, তাকে ইলেকট্রনিক মিডিয়া বলে। যেমন—রেডিও, টেলিভিশন, কম্পিউটার, স্যাটেলাইট, ডিশ অ্যান্টেনা, ওয়েবসাইট, ই-মেইল, টুইটার, ব্লগ, ফেসবুক, মোবাইল প্রভৃতি। আধুনিক তথ্যপ্রযুক্তির ক্ষেত্রে এ মাধ্যমটি ব্যাপক জনপ্রিয়।</p><div class=\"h\">ইসলামী দাওয়াহ সম্প্রসারণে মিডিয়ার গুরুত্ব:</div><p>ইসলামী দাওয়াহ কার্যক্রম সম্প্রসারণে মিডিয়ার গুরুত্ব অপরিসীম। বর্তমান মিডিয়ার যুগ। সমাজ ও মানুষের মাঝে যখন যে মাধ্যম অত্যন্ত প্রিয় হয়ে ওঠে, তখন সেই মাধ্যমে ইসলামী দাওয়াহ সম্প্রসারণই যৌক্তিক ও বুদ্ধিমত্তার পরিচায়ক। মহানবী (সা.) যুগের চাহিদার প্রেক্ষিতে ইসলামী দাওয়াতি মিশন পরিচালনা করেছেন বলেই তা সর্বসাধারণের কাছে গ্রহণযোগ্যতা পেয়েছে। নিচে ইসলামী দাওয়াহ সম্প্রসারণে মিডিয়ার গুরুত্ব তুলে ধরা হলো—</p><p><b>১। ইন্টারনেট:</b></p><p>বর্তমান বিজ্ঞান ও প্রযুক্তির উৎকর্ষের ফলে পৃথিবী এখন হাতের মুঠোয়। মুহূর্তেই ভিডিও কনফারেন্সসহ নানা মাধ্যমে যেকোনো স্থানে যোগাযোগ করা যায়। বাংলা, ইংরেজি, আরবিসহ বিভিন্ন ভাষায় কুরআন-হাদিসের তাফসির ও ইসলামী সাহিত্য পড়া যাচ্ছে। হাজার হাজার কিতাবের মাকতাবাতুশ শামেলা একটি ছোট্ট মেমোরিতেই রাখা হচ্ছে। সবই সম্ভব হচ্ছে বিজ্ঞানের চরম উন্নতির ফলে। বিজ্ঞানের সর্বাধুনিক ও সর্বাধিক ক্রিয়াশীল বিস্ময়কর আবিষ্কারই হলো ইন্টারনেট।</p><p>মসজিদের মিম্বর, বই-পুস্তক, ওয়াজ মাহফিল ও পত্রপত্রিকার মতো ইন্টারনেটও দ্বীনি দাওয়াতের এক অপূর্ব সুযোগ এনে দিয়েছে। অনেক ফ্যামিলি আছে যারা আধুনিকতার নামে তাদের সন্তানদের ইসলামকে জানার সুযোগ দেয়নি; আল্লাহ, রাসূল (সা.) এবং পরকাল সম্পর্কে দেয়নি ইতিবাচক ধারণা। এ প্রজন্মের বেশির ভাগ এমন যে, সারাদিন ইন্টারনেটেই পড়ে থাকে। সেই প্রজন্মের কাছে ইসলামের সৌন্দর্য উপস্থাপনের মাধ্যমে তাদেরকে দ্বীনের দাওয়াত দেওয়ার অন্য যেকোনো মাধ্যমের চেয়ে ইন্টারনেটই সবচেয়ে সহজ। এছাড়াও হাজারো গ্রাম, বাড়ি, মহল্লা এবং শহরের ফ্ল্যাট বাড়ির লক্ষ কোটি মানুষের কাছে দাওয়াত পৌঁছানোর সহজতর মাধ্যম হচ্ছে ইন্টারনেট। সুতরাং আমাদের আলেম সমাজকে এ মাধ্যম ব্যবহারে এগিয়ে আসতে হবে।</p><p><b>২। প্রিন্ট মিডিয়া:</b></p><p>প্রিন্ট মিডিয়া তথা পত্র-পত্রিকা ও সাময়িকীর রচনা প্রবাহ উপস্থাপনের মাধ্যমে ইসলামের ব্যাপক প্রচার ও প্রসার ঘটানো যায়।</p><p><b>৩। ফেসবুক:</b></p><p>বর্তমান অনলাইন সামাজিক যোগাযোগমাধ্যম ফেসবুক ব্যবহার করে ইসলামী দাওয়াতি কাজ করা যায়। যেমন—ফেসবুকে কুরআন-হাদিসের বাণী সেট করা যায়। ইসলামের বিভিন্ন বিষয় উপস্থাপন করা যায়। বন্ধুবান্ধবের নিকট ইসলামের দাওয়াতসংবলিত মেসেজ পাঠানো যায়। ইসলামবিরোধী ব্লগারদের মন্তব্যের সঠিক জবাব দেওয়া যায় ইত্যাদি।</p><p><b>৪। স্যাটেলাইট:</b></p><p>আধুনিক প্রযুক্তির যুগে ইসলামী দাওয়াতের প্রচার-প্রসারে স্যাটেলাইট টেলিভিশন খুব উপকারী মাধ্যম। টেলিভিশনে বিভিন্ন ইসলামী অনুষ্ঠান, সাওয়াল-জবাবের অনুষ্ঠান, ইসলামী সংগীতানুষ্ঠান, ইসলামী সংস্কৃতি ও বিনোদনের আয়োজন করে দর্শকবৃন্দকে অপসংস্কৃতির আগ্রাসন থেকে মুক্ত করে ইসলামী সংস্কৃতি ও কৃষ্টি-সভ্যতা সম্পর্কে জ্ঞানদান করা যায়। ইসলামী আদর্শের অনুসারী বানানো যায়। বর্তমানে এ মহৎ কাজটি পিস টিভি করছে। এছাড়া আমাদের দেশের বিভিন্ন টিভি চ্যানেলে কেউ দৈনিক, কেউ সাপ্তাহিক, কেউ মাসিক, কেউ বার্ষিক কিছু সময়ের জন্য বিভিন্ন ইসলামী অনুষ্ঠান প্রচার করে থাকে, যা প্রয়োজনের তুলনায় একেবারেই নগণ্য। তাতেও বহু মানুষ অনেক উপকার অর্জন করে থাকে। সুতরাং আমাদের ইসলামী গবেষক, জ্ঞানীগুণী ও ধনবান লোকদেরকে ইসলামের খেদমতের নিয়তে ইসলামী টিভি চ্যানেল নির্মাণে এগিয়ে আসা উচিত। নিজে না পারলে অন্যকে উৎসাহিত করা প্রয়োজন।</p><p><b>৫। সংবাদ সংস্থা:</b></p><p>ইসলামী দাওয়াতের সম্প্রসারণে সংবাদ সংস্থা অত্যন্ত গুরুত্বপূর্ণ একটি মাধ্যম। বিশ্বায়নের এ যুগে ইসলাম ও মুসলমানদের খবরাদি মুসলিম বিশ্বে ছড়িয়ে দেওয়ার জন্য মুসলমান কর্তৃক গঠিত কোনো সংবাদ সংস্থা নেই। অথচ বিশ্বের নামকরা সংবাদপত্র, এফএম রেডিও এবং সকল টিভি সেন্টার বিবিসি ও ভয়েস অব আমেরিকা প্রভৃতি ৯০ ভাগ সংবাদ সংগ্রহ করে বিশ্বের প্রধান সংবাদ সংস্থা রয়টার্স থেকে। ১৮৫১ সালে প্রতিষ্ঠিত বিখ্যাত এ সংস্থাসহ টাইম, নিউজউইকের মতো বহু প্রচলিত সংবাদপত্রের মালিক, সাংবাদিক এবং কলামিস্ট সবই ইহুদি। ফলে ফিলিস্তিনের নির্যাতিত শিশুদের আর্তনাদ কখনো উঠে আসে না আন্তর্জাতিক মিডিয়ায়। বিশ্বের মুসলমানরা কতটুকু নির্যাতিত তা জানতে পারে না বিশ্বমানবতা। শ্বেতাঙ্গ-কৃষ্ণাঙ্গের অধিকার প্রতিষ্ঠায় মার্টিন লুথার কিং কিংবা নেলসন ম্যান্ডেলার আন্দোলন উপস্থাপিত হলেও দেড় হাজার বছর আগে শ্বেতাঙ্গ-কৃষ্ণাঙ্গদের তফাৎ ঘুচিয়ে তাদের অধিকার বাস্তবে প্রতিষ্ঠার ক্ষেত্রে হযরত মুহাম্মদ (সা.)-এর অবদান উঠে আসে না আন্তর্জাতিক মিডিয়ায়। যে কারণে আজ মুসলমানরা ভুলে গেছে, তারাই যে শাশ্বত মানবাধিকার প্রতিষ্ঠার প্রথম রূপকার। সুতরাং মুসলমানদেরকে জেগে উঠতে হবে, রয়টার্সের মতো ইসলামী সংবাদ সংস্থা নির্মাণ করতে হবে। তবেই বিশ্বমুসলিম বেশি উপকৃত হবে।</p><p><b>৬। WWW ও Email:</b></p><p>অনলাইন জনপ্রিয় ব্যবস্থা Email ও World Wide Web (WWW) তথ্যজালের মাধ্যমে বিশ্বের বিভিন্ন প্রান্ত থেকে বিভিন্ন খবরাখবর, কমেন্ট ও ছবি আদান-প্রদান করা যায়। মুসলমানগণ তথা ইসলামের দাঈগণ এর মাধ্যমে বিশ্বের বিভিন্ন প্রান্তের ইসলামী চিন্তাবিদ, ইসলামী ব্লগার ও দ্বীনের দাঈগণের সঙ্গে তাৎক্ষণিক তথ্য আদান-প্রদান করে ইসলামী দাওয়াতের ব্যাপক প্রসার ঘটাতে পারে। নতুন কৌশল-পদ্ধতি আবিষ্কার করতে পারে। নতুন সমস্যার সমাধান বের করতে পারে। ইসলাম ও মুসলমানদের সার্বিক অবস্থা পর্যালোচনা করার অন্যতম একটি মাধ্যম এটি।</p><div class=\"h\">উপসংহার:</div><p>বর্তমান বিশ্বে ইসলামের ব্যাপারে মানুষের কৌতূহল বাড়ায় দেশে দেশে অমুসলিম যুবশ্রেণি আগ্রহী হচ্ছে ইসলামের অমিয় সৌন্দর্যের প্রতি। ইসলাম গ্রহণ করতে আগ্রহী হচ্ছে অসংখ্য বিখ্যাত অমুসলিম মনীষী। তাই আমাদেরকে আরও যুগোপযোগী কৌশল তথা পদ্ধতি প্রণয়ন করতে হবে, যাতে ইসলামের দাওয়াতের সুফল বিশ্বমানবের কাছে সিডরের প্লাবিত পানির বেগে বিস্তার লাভ করে। আল্লাহ তায়ালা এ ব্যাপারে ইসলামের দাঈগণকে সহযোগিতা করবেন বলে আশা করা যায়।</p>"], ["গণমাধ্যম এবং ইন্টারনেটের মাধ্যমে দাওয়াতি কার্যক্রম পরিচালনার গুরুত্ব সম্পর্কে বিবরণ দাও।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। মানবজাতিকে সত্য ও কল্যাণের পথে পরিচালিত করা এবং অন্যায়, অশ্লীলতা ও বিভ্রান্তি থেকে দূরে রাখার জন্য ইসলামী দাওয়াতের গুরুত্ব অপরিসীম। বর্তমান যুগ তথ্য ও প্রযুক্তির যুগ। সংবাদপত্র, রেডিও, টেলিভিশন, সামাজিক যোগাযোগমাধ্যম এবং ইন্টারনেট মানুষের চিন্তা, শিক্ষা ও জীবনযাত্রায় ব্যাপক প্রভাব বিস্তার করছে। তাই আধুনিক প্রযুক্তিকে কাজে লাগিয়ে ইসলামের সুমহান আদর্শ মানুষের কাছে পৌঁছে দেওয়া সময়ের গুরুত্বপূর্ণ দাবি। গণমাধ্যম ও ইন্টারনেটের মাধ্যমে অল্প সময়ে বিপুলসংখ্যক মানুষের কাছে ইসলামের বাণী পৌঁছে দেওয়া সম্ভব।</p><div class=\"h\">গণমাধ্যম ও ইন্টারনেটের মাধ্যমে দাওয়াতি কার্যক্রম পরিচালনার গুরুত্ব</div><p><b>১। ব্যাপক জনগোষ্ঠীর কাছে দাওয়াত পৌঁছানো:</b></p><p>গণমাধ্যম ও ইন্টারনেটের সবচেয়ে বড় সুবিধা হলো এর মাধ্যমে অল্প সময়ে অসংখ্য মানুষের কাছে ইসলামের বাণী পৌঁছে দেওয়া যায়। আগে দাওয়াতি কার্যক্রম পরিচালনার জন্য নির্দিষ্ট স্থান ও সময়ের প্রয়োজন হতো। কিন্তু বর্তমানে একটি ভিডিও, অডিও, লেখা কিংবা সরাসরি অনলাইন আলোচনার মাধ্যমে দেশ-বিদেশের মানুষের কাছে ইসলামের শিক্ষা পৌঁছে দেওয়া সম্ভব।</p><p><b>২। বিশ্বব্যাপী ইসলামের পরিচিতি তুলে ধরা:</b></p><p>ইন্টারনেটের মাধ্যমে পৃথিবীর যেকোনো প্রান্তের মানুষ ইসলামের মৌলিক শিক্ষা, ইতিহাস, আদর্শ ও জীবনব্যবস্থা সম্পর্কে জানতে পারে। বিশেষ করে অমুসলিমদের কাছে ইসলামের প্রকৃত পরিচয় তুলে ধরার ক্ষেত্রে এটি গুরুত্বপূর্ণ ভূমিকা পালন করে। এর মাধ্যমে ইসলামের শান্তি, মানবতা, সাম্য ও ন্যায়বিচারের শিক্ষা বিশ্বব্যাপী প্রচার করা যায়।</p><p><b>৩। সময় ও অর্থের সাশ্রয়:</b></p><p>প্রচলিত দাওয়াতি কার্যক্রম পরিচালনায় যাতায়াত, সভা-সমাবেশ ও প্রচার-প্রচারণার জন্য অনেক সময় ও অর্থ ব্যয় হয়। কিন্তু ইন্টারনেটের মাধ্যমে তুলনামূলক কম খরচে দাওয়াতি কার্যক্রম পরিচালনা করা যায়। একটি অনলাইন ক্লাস, আলোচনা কিংবা ভিডিও বহু মানুষের কাছে বারবার পৌঁছানো সম্ভব।</p><p><b>৪। ইসলামী জ্ঞান ও শিক্ষার প্রসার:</b></p><p>গণমাধ্যম ও ইন্টারনেটের মাধ্যমে কুরআন, হাদিস, ইসলামী ইতিহাস, আকিদা, ফিকহ ও নৈতিক শিক্ষা সহজে মানুষের কাছে পৌঁছে দেওয়া যায়। অনলাইন মাদরাসা, ইসলামী শিক্ষামূলক ওয়েবসাইট, ইউটিউব চ্যানেল এবং বিভিন্ন শিক্ষামূলক প্ল্যাটফর্মের মাধ্যমে ঘরে বসেই মানুষ ইসলামী জ্ঞান অর্জন করতে পারে।</p><p><b>৫। যুবসমাজকে সঠিক পথে পরিচালিত করা:</b></p><p>বর্তমান সময়ে যুবসমাজের একটি বড় অংশ ইন্টারনেট ও সামাজিক যোগাযোগমাধ্যম ব্যবহার করে। এ মাধ্যমগুলোতে নানা ধরনের বিভ্রান্তিকর ও অনৈতিক বিষয় প্রচারিত হয়। তাই মানসম্মত ইসলামী আলোচনা, শিক্ষামূলক ভিডিও ও অনুপ্রেরণামূলক বক্তব্য প্রচারের মাধ্যমে যুবসমাজকে ইসলামের আদর্শে উদ্বুদ্ধ করা সম্ভব।</p><p><b>৬। অপপ্রচার ও ভুল ধারণার জবাব প্রদান:</b></p><p>ইসলাম সম্পর্কে বিভিন্ন সময়ে ভুল তথ্য, অপপ্রচার ও বিভ্রান্তিকর বক্তব্য ছড়ানো হয়। গণমাধ্যম ও ইন্টারনেটের মাধ্যমে এসব অপপ্রচারের যুক্তিনির্ভর ও তথ্যসমৃদ্ধ জবাব দেওয়া যায়। ফলে মানুষ ইসলামের প্রকৃত শিক্ষা সম্পর্কে জানতে পারে এবং বিভ্রান্তি থেকে মুক্ত হওয়ার সুযোগ পায়।</p><p><b>৭। নারী ও শিশুদের মধ্যে ইসলামী শিক্ষা বিস্তার:</b></p><p>অনেক নারী ও শিশু বিভিন্ন কারণে সরাসরি দাওয়াতি সভা বা শিক্ষাপ্রতিষ্ঠানে অংশগ্রহণ করতে পারে না। ইন্টারনেটের মাধ্যমে তাদের জন্য উপযোগী ইসলামী শিক্ষামূলক অনুষ্ঠান, অনলাইন ক্লাস, কুরআন শিক্ষা ও নৈতিক শিক্ষার ব্যবস্থা করা সম্ভব। এতে ঘরে বসেই তারা ইসলামী জ্ঞান অর্জন করতে পারে।</p><p><b>৮। তাৎক্ষণিক যোগাযোগ ও প্রশ্নের উত্তর প্রদান:</b></p><p>ইন্টারনেটের মাধ্যমে দাঈ ও সাধারণ মানুষের মধ্যে সরাসরি যোগাযোগ স্থাপন করা যায়। সামাজিক যোগাযোগমাধ্যম, অনলাইন আলোচনা ও প্রশ্নোত্তর অনুষ্ঠানের মাধ্যমে মানুষের ধর্মীয় সমস্যার সমাধান এবং বিভিন্ন প্রশ্নের উত্তর প্রদান করা সম্ভব। এতে দাওয়াতি কার্যক্রম আরও সহজ, গতিশীল ও কার্যকর হয়।</p><p><b>৯। আধুনিক ও আকর্ষণীয় উপস্থাপনার সুযোগ:</b></p><p>গণমাধ্যমে লেখা, ছবি, অডিও, ভিডিও, অ্যানিমেশন ও তথ্যচিত্রের মাধ্যমে ইসলামের শিক্ষা আকর্ষণীয়ভাবে উপস্থাপন করা যায়। বিশেষ করে শিশু-কিশোর ও তরুণদের কাছে জটিল বিষয়গুলো সহজভাবে তুলে ধরতে এসব মাধ্যম কার্যকর ভূমিকা পালন করে।</p><p><b>১০। ইসলামী মূল্যবোধ ও নৈতিকতা প্রতিষ্ঠা:</b></p><p>গণমাধ্যম ও ইন্টারনেটের মাধ্যমে সততা, আমানতদারি, ন্যায়বিচার, মানবসেবা, পারিবারিক দায়িত্ব ও সামাজিক সম্প্রীতির মতো ইসলামী মূল্যবোধ প্রচার করা যায়। এর ফলে ব্যক্তি, পরিবার ও সমাজে নৈতিক সচেতনতা বৃদ্ধি পায়। মানুষ ভালো কাজের প্রতি উৎসাহিত হয় এবং অন্যায় ও অনৈতিকতা থেকে বিরত থাকার অনুপ্রেরণা লাভ করে।</p><p><b>১১। আন্তর্জাতিক দাওয়াতি যোগাযোগ ও সহযোগিতা বৃদ্ধি:</b></p><p>ইন্টারনেটের মাধ্যমে বিশ্বের বিভিন্ন দেশের আলেম, ইসলামি চিন্তাবিদ, গবেষক ও দাঈদের মধ্যে যোগাযোগ স্থাপন করা যায়। তারা নিজেদের অভিজ্ঞতা, গবেষণা ও দাওয়াতি কার্যক্রমের পদ্ধতি বিনিময় করতে পারেন। ফলে আন্তর্জাতিক পর্যায়ে দাওয়াতি কার্যক্রম আরও সুসংগঠিত ও সমৃদ্ধ হয়।</p><p><b>১২। দাওয়াতি কার্যক্রমের স্থায়ী সংরক্ষণ:</b></p><p>গণমাধ্যম ও ইন্টারনেটে প্রচারিত ইসলামী আলোচনা, বক্তৃতা, শিক্ষামূলক ভিডিও ও প্রবন্ধ সংরক্ষণ করে রাখা যায়। ফলে মানুষ নিজের সুবিধামতো যেকোনো সময় এসব বিষয় দেখতে, শুনতে ও পড়তে পারে। একই বিষয় বারবার প্রচারের সুযোগ থাকায় দাওয়াতি কার্যক্রমের প্রভাব দীর্ঘস্থায়ী হয়।</p><div class=\"h\">দাওয়াতি কার্যক্রমে গণমাধ্যম ও ইন্টারনেট ব্যবহারের ক্ষেত্রে সতর্কতা</div><p>গণমাধ্যম ও ইন্টারনেট দাওয়াতের গুরুত্বপূর্ণ মাধ্যম হলেও এগুলো ব্যবহারের ক্ষেত্রে কিছু বিষয় বিবেচনা করা জরুরি। ইসলামের নামে কোনো তথ্য প্রচারের আগে তার সত্যতা ও নির্ভরযোগ্যতা যাচাই করতে হবে। অশালীন ভাষা, মিথ্যা তথ্য, বিদ্বেষমূলক বক্তব্য ও অপ্রয়োজনীয় বিতর্ক পরিহার করতে হবে। দাওয়াতের ক্ষেত্রে শালীনতা, প্রজ্ঞা, উত্তম আচরণ এবং মানুষের প্রতি সম্মান বজায় রাখতে হবে। পাশাপাশি প্রযুক্তির অপব্যবহার থেকে বিরত থেকে একে কল্যাণকর কাজে ব্যবহার করতে হবে।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, বর্তমান যুগে গণমাধ্যম ও ইন্টারনেট ইসলামী দাওয়াতের অত্যন্ত কার্যকর ও শক্তিশালী মাধ্যম। এগুলোর সাহায্যে অল্প সময়ে বিশ্বব্যাপী ইসলামের শিক্ষা প্রচার, মানুষের মধ্যে ধর্মীয় সচেতনতা সৃষ্টি এবং ইসলামের বিরুদ্ধে অপপ্রচারের জবাব প্রদান করা সম্ভব। তাই যুগের চাহিদা অনুযায়ী আধুনিক প্রযুক্তিকে সঠিকভাবে কাজে লাগিয়ে পরিকল্পিত, তথ্যনির্ভর ও প্রজ্ঞাপূর্ণ দাওয়াতি কার্যক্রম পরিচালনা করা প্রত্যেক দাঈর গুরুত্বপূর্ণ দায়িত্ব।</p>"], ["ইসলামী দাওয়াহর ক্ষেত্রে সমাজসেবার গুরুত্ব ও প্রভাব বর্ণনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। এ ধর্ম শুধু ব্যক্তিগত ইবাদতের মধ্যেই সীমাবদ্ধ নয়; বরং মানুষের কল্যাণ, অধিকার প্রতিষ্ঠা, অসহায়দের সহযোগিতা এবং সামাজিক উন্নয়নের প্রতিও বিশেষ গুরুত্ব প্রদান করে। ইসলামী দাওয়াহর অন্যতম কার্যকর মাধ্যম হলো সমাজসেবা। মানুষের বিপদে পাশে দাঁড়ানো, দরিদ্রদের সাহায্য করা, অসুস্থদের সেবা করা, শিক্ষার প্রসার ঘটানো এবং সামাজিক সমস্যা সমাধানে ভূমিকা রাখার মাধ্যমে ইসলামের সৌন্দর্য বাস্তবে তুলে ধরা যায়। তাই ইসলামী দাওয়াহর ক্ষেত্রে সমাজসেবার গুরুত্ব ও প্রভাব অত্যন্ত ব্যাপক।</p><div class=\"h\">কুরআন ও হাদিসের আলোকে সমাজসেবার গুরুত্ব</div><p>ইসলামে সমাজসেবা অত্যন্ত মর্যাদাপূর্ণ কাজ। আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ وَابْنِ السَّبِيلِ</div></div><p>অর্থ: তোমরা আল্লাহর ইবাদত করো এবং তাঁর সঙ্গে কাউকে শরিক করো না। আর পিতা-মাতা, আত্মীয়স্বজন, এতিম, মিসকিন, নিকট প্রতিবেশী, দূর প্রতিবেশী, সঙ্গী-সাথি ও মুসাফিরের প্রতি সদ্ব্যবহার করো।</p><div class=\"rf\">সূরা আন-নিসা, আয়াত: ৩৬</div><p>এ আয়াত থেকে প্রমাণিত হয় যে, আল্লাহর ইবাদতের পাশাপাশি মানুষের অধিকার আদায় ও তাদের কল্যাণ সাধন করাও ইসলামের গুরুত্বপূর্ণ নির্দেশনা।</p><p>রাসূলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ</div></div><p>অর্থ: বান্দা যতক্ষণ তার ভাইয়ের সাহায্যে নিয়োজিত থাকে, আল্লাহ ততক্ষণ ওই বান্দার সাহায্যে থাকেন।</p><div class=\"rf\">সহিহ মুসলিম</div><div class=\"h\">ইসলামী দাওয়াহর ক্ষেত্রে সমাজসেবার গুরুত্ব ও প্রভাব</div><p>ইসলামী দাওয়াহর ক্ষেত্রে সমাজসেবার গুরুত্ব ও প্রভাব অত্যন্ত ব্যাপক। নিম্নে তা আলোচনা করা হলো—</p><p><b>১। মানুষের হৃদয় জয় করা:</b></p><p>সমাজসেবার মাধ্যমে মানুষের প্রতি ভালোবাসা, সহানুভূতি ও আন্তরিকতা প্রকাশ পায়। একজন দায়ী যখন অসহায় মানুষের পাশে দাঁড়ান, বিপদগ্রস্তকে সাহায্য করেন এবং দরিদ্রদের সহযোগিতা করেন, তখন মানুষের হৃদয়ে তাঁর প্রতি ভালোবাসা ও বিশ্বাস সৃষ্টি হয়। ফলে ইসলামের বাণী তাদের কাছে অধিক গ্রহণযোগ্য হয়ে ওঠে।</p><p><b>২। ইসলামের সৌন্দর্য তুলে ধরা:</b></p><p>ইসলাম শুধু বক্তব্য ও উপদেশের মাধ্যমে নয়, বরং বাস্তব কর্মের মাধ্যমেও প্রচারিত হয়। সমাজসেবামূলক কার্যক্রমের মাধ্যমে ইসলামের দয়া, সহমর্মিতা, মানবিকতা ও ভ্রাতৃত্বের শিক্ষা প্রকাশ পায়। এতে অমুসলিমরাও ইসলামের প্রকৃত সৌন্দর্য সম্পর্কে জানতে পারে।</p><p><b>৩। দরিদ্র ও অসহায় মানুষের সহযোগিতা:</b></p><p>দরিদ্র, এতিম, বিধবা, অসুস্থ ও অসহায় মানুষের পাশে দাঁড়ানো সমাজসেবার অন্যতম প্রধান কাজ। তাদের খাদ্য, বস্ত্র, চিকিৎসা ও বাসস্থানের ব্যবস্থা করা ইসলামের গুরুত্বপূর্ণ শিক্ষা। এর ফলে সমাজে বৈষম্য কমে এবং মানুষের মধ্যে পারস্পরিক সহযোগিতা বৃদ্ধি পায়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا</div></div><p>অর্থ: তারা আল্লাহর ভালোবাসায় অভাবগ্রস্ত, এতিম ও বন্দিকে খাবার দান করে।</p><div class=\"rf\">সূরা আল-ইনসান, আয়াত: ৮</div><p><b>৪। সামাজিক ভ্রাতৃত্ব ও সম্প্রীতি প্রতিষ্ঠা:</b></p><p>সমাজসেবার মাধ্যমে ধনী-গরিব, ছোট-বড় এবং বিভিন্ন শ্রেণি-পেশার মানুষের মধ্যে ভ্রাতৃত্ববোধ সৃষ্টি হয়। পারস্পরিক সহযোগিতা, সহমর্মিতা ও ভালোবাসা বৃদ্ধি পায়। ফলে সমাজে হিংসা-বিদ্বেষ ও বিভেদ কমে এবং শান্তিপূর্ণ পরিবেশ গড়ে ওঠে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ</div></div><p>অর্থ: মুমিনরা তো পরস্পর ভাই ভাই। অতএব তোমরা তোমাদের দুই ভাইয়ের মধ্যে মীমাংসা করে দাও।</p><div class=\"rf\">সূরা আল-হুজুরাত, আয়াত: ১০</div><p><b>৫। শিক্ষা ও জ্ঞানের প্রসার:</b></p><p>সমাজসেবার একটি গুরুত্বপূর্ণ ক্ষেত্র হলো শিক্ষার প্রসার। দরিদ্র শিক্ষার্থীদের শিক্ষা উপকরণ বিতরণ, বিনা মূল্যে পাঠদান, মক্তব-মাদরাসা প্রতিষ্ঠা এবং নিরক্ষরতা দূরীকরণে ভূমিকা রাখা সমাজের উন্নয়নে সহায়তা করে। এর মাধ্যমে মানুষ দ্বীনি ও জাগতিক জ্ঞান অর্জনের সুযোগ পায় এবং ইসলামী দাওয়াহর ক্ষেত্র সম্প্রসারিত হয়।</p><p><b>৬। স্বাস্থ্যসেবা ও মানবিক সহযোগিতা:</b></p><p>অসুস্থ মানুষের চিকিৎসার ব্যবস্থা করা, বিনা মূল্যে চিকিৎসাসেবা প্রদান, রক্তদান, পরিচ্ছন্নতা অভিযান এবং দুর্যোগে ক্ষতিগ্রস্ত মানুষের পাশে দাঁড়ানো সমাজসেবার গুরুত্বপূর্ণ অংশ। এসব কাজ মানুষের জীবন রক্ষা করে এবং ইসলামের মানবকল্যাণমূলক আদর্শকে বাস্তবে তুলে ধরে।</p><p><b>৭। নৈতিকতা ও মানবিক মূল্যবোধ সৃষ্টি:</b></p><p>সমাজসেবার মাধ্যমে মানুষের মধ্যে দয়া, ক্ষমাশীলতা, পরোপকার, ত্যাগ, সততা ও দায়িত্ববোধ সৃষ্টি হয়। একজন মানুষ যখন অন্যের কল্যাণে কাজ করেন, তখন তাঁর মধ্যে স্বার্থপরতা ও অহংকার কমে যায়। ফলে ব্যক্তি ও সমাজ উভয়ের নৈতিক উন্নয়ন ঘটে।</p><p><b>৮। সামাজিক সমস্যা ও অপরাধ প্রতিরোধ:</b></p><p>দারিদ্র্য, বেকারত্ব, মাদকাসক্তি, কুসংস্কার, নিরক্ষরতা ও পারিবারিক বিরোধ সমাজের গুরুত্বপূর্ণ সমস্যা। সমাজসেবামূলক কার্যক্রমের মাধ্যমে এসব সমস্যা সমাধানে ভূমিকা রাখা যায়। কর্মসংস্থান সৃষ্টি, সচেতনতা বৃদ্ধি এবং নৈতিক শিক্ষা প্রদানের মাধ্যমে অপরাধপ্রবণতা কমানো সম্ভব হয়।</p><p><b>৯। দুর্যোগ ও বিপদে মানুষের পাশে দাঁড়ানো:</b></p><p>বন্যা, ঘূর্ণিঝড়, অগ্নিকাণ্ড, ভূমিকম্প ও অন্যান্য দুর্যোগে ক্ষতিগ্রস্ত মানুষের পাশে দাঁড়ানো ইসলামী সমাজসেবার গুরুত্বপূর্ণ দিক। খাদ্য, বস্ত্র, ওষুধ ও আশ্রয়ের ব্যবস্থা করে বিপদগ্রস্তদের সহযোগিতা করা মানবিক দায়িত্ব। এতে মানুষের মধ্যে পারস্পরিক সহমর্মিতা ও ইসলামের প্রতি ইতিবাচক ধারণা সৃষ্টি হয়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ</div></div><p>অর্থ: তোমরা সৎকর্ম ও তাকওয়ার কাজে পরস্পর সহযোগিতা করো এবং পাপ ও সীমালঙ্ঘনের কাজে একে অপরকে সহযোগিতা করো না।</p><div class=\"rf\">সূরা আল-মায়িদা, আয়াত: ২</div><p><b>১০। দাওয়াহর গ্রহণযোগ্যতা ও প্রসার বৃদ্ধি:</b></p><p>সমাজসেবা মানুষের সঙ্গে দায়ীর আন্তরিক সম্পর্ক গড়ে তোলে। মানুষ যখন তাঁর কাছ থেকে বাস্তব সহযোগিতা ও কল্যাণ লাভ করে, তখন তাঁর কথা ও উপদেশের প্রতি আগ্রহী হয়। ফলে ইসলামী দাওয়াহ সমাজের সর্বস্তরে পৌঁছানোর সুযোগ সৃষ্টি হয়। এভাবে সমাজসেবা ইসলামের প্রচার ও প্রসারে কার্যকর ভূমিকা পালন করে।</p><p><b>১১। আল্লাহর সন্তুষ্টি ও সওয়াব অর্জন:</b></p><p>সমাজসেবা শুধু সামাজিক দায়িত্ব নয়; বরং আল্লাহর সন্তুষ্টি অর্জনের একটি গুরুত্বপূর্ণ মাধ্যম। আন্তরিকতার সঙ্গে মানুষের উপকার করলে আল্লাহর পক্ষ থেকে প্রতিদান লাভের আশা করা যায়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا تُقَدِّمُوا لِأَنْفُسِكُمْ مِنْ خَيْرٍ تَجِدُوهُ عِنْدَ اللَّهِ</div></div><p>অর্থ: তোমরা নিজেদের জন্য যে ভালো কাজই আগে পাঠাবে, তা আল্লাহর কাছে পাবে।</p><div class=\"rf\">সূরা আল-বাকারা, আয়াত: ১১০</div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, ইসলামী দাওয়াহর ক্ষেত্রে সমাজসেবা অত্যন্ত গুরুত্বপূর্ণ ও কার্যকর মাধ্যম। এর মাধ্যমে মানুষের দুঃখ-কষ্ট লাঘব, সামাজিক সমস্যা সমাধান, নৈতিকতা প্রতিষ্ঠা এবং পারস্পরিক ভ্রাতৃত্ব ও সম্প্রীতি বৃদ্ধি করা সম্ভব। সমাজসেবা ইসলামের সৌন্দর্যকে বাস্তব জীবনে প্রকাশ করে এবং মানুষের হৃদয়ে ইসলামের প্রতি ভালোবাসা সৃষ্টি করে। তাই প্রত্যেক দায়ীর উচিত কুরআন-সুন্নাহর নির্দেশনা অনুসরণ করে সমাজের কল্যাণে আত্মনিয়োগ করা। তাহলেই ইসলামী দাওয়াহ আরও ফলপ্রসূ ও ব্যাপক হবে।</p>"], ["ইসলামী দাওয়াহর সম্প্রসারণে ইসলামের শত্রুদের ষড়যন্ত্রের মোকাবিলায় অটল থাকার উপায়সমূহ আলোচনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম একটি পূর্ণাঙ্গ ও কল্যাণমুখী জীবনব্যবস্থা। মানবজাতিকে সত্য, ন্যায়, শান্তি ও আল্লাহর আনুগত্যের পথে পরিচালিত করাই ইসলামী দাওয়াহর মূল উদ্দেশ্য। যুগে যুগে ইসলামের প্রচার ও প্রসারের পথে বিভিন্ন বাধা, বিরোধিতা, অপপ্রচার ও ষড়যন্ত্রের সম্মুখীন হতে হয়েছে। রাসূলুল্লাহ (সা.) ও পূর্ববর্তী নবী-রাসূলগণও তাঁদের দাওয়াতি জীবনে নানা প্রতিকূলতার মুখোমুখি হয়েছেন। কিন্তু তাঁরা ধৈর্য, দৃঢ়তা, প্রজ্ঞা ও আল্লাহর ওপর ভরসা রেখে দাওয়াতের কাজ চালিয়ে গেছেন। তাই ইসলামী দাওয়াহর সম্প্রসারণে বিরোধিতা ও ষড়যন্ত্রের মোকাবিলায় ধৈর্য, ঐক্য, জ্ঞান, সতর্কতা এবং নৈতিক দৃঢ়তা অবলম্বন করা অত্যন্ত জরুরি।</p><div class=\"h\">কুরআনের আলোকে ষড়যন্ত্রের মোকাবিলায় অটল থাকার নির্দেশনা</div><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنْ تَصْبِرُوا وَتَتَّقُوا لَا يَضُرُّكُمْ كَيْدُهُمْ شَيْئًا إِنَّ اللَّهَ بِمَا يَعْمَلُونَ مُحِيطٌ</div></div><p>অর্থ: আর যদি তোমরা ধৈর্য ধারণ করো এবং তাকওয়া অবলম্বন করো, তবে তাদের ষড়যন্ত্র তোমাদের কোনো ক্ষতি করতে পারবে না। নিশ্চয়ই তারা যা করে, আল্লাহ তা পরিবেষ্টন করে রেখেছেন।</p><div class=\"rf\">সূরা আলে ইমরান, আয়াত: ১২০</div><p>এ আয়াত থেকে বোঝা যায়, বিরোধীদের ষড়যন্ত্রের মোকাবিলায় ধৈর্য ও তাকওয়া অবলম্বন করা মুমিনদের জন্য অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">ইসলামের শত্রুদের ষড়যন্ত্রের মোকাবিলায় অটল থাকার উপায়সমূহ</div><p>ইসলামী দাওয়াহর পথে বিরোধিতা, অপপ্রচার ও ষড়যন্ত্রের সম্মুখীন হলে একজন দায়ীর কিছু গুরুত্বপূর্ণ গুণ ও পদ্ধতি অবলম্বন করা প্রয়োজন। নিম্নে সেগুলো আলোচনা করা হলো—</p><p><b>১। ঈমান ও আকিদার দৃঢ়তা অর্জন:</b></p><p>ইসলামী দাওয়াহর পথে অটল থাকার প্রথম উপায় হলো ঈমান ও আকিদাকে সুদৃঢ় করা। ইসলামের শত্রুরা বিভিন্ন প্রলোভন, ভয়ভীতি ও অপপ্রচারের মাধ্যমে মুসলমানদের ঈমান দুর্বল করার চেষ্টা করতে পারে। তাই একজন দায়ীকে আল্লাহর প্রতি বিশ্বাস, রাসূলুল্লাহ (সা.)-এর আদর্শ এবং ইসলামের মৌলিক শিক্ষার ওপর দৃঢ় থাকতে হবে। কোনো বাধা বা প্রলোভনের কারণে সত্যের পথ থেকে বিচ্যুত হওয়া যাবে না।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ فِي سَبِيلِ اللَّهِ أُولَٰئِكَ هُمُ الصَّادِقُونَ</div></div><p>অর্থ: প্রকৃত মুমিন তো তারাই, যারা আল্লাহ ও তাঁর রাসূলের প্রতি ঈমান এনেছে, অতঃপর সন্দেহ পোষণ করেনি এবং নিজেদের ধন-সম্পদ ও জীবন দিয়ে আল্লাহর পথে প্রচেষ্টা চালিয়েছে। তারাই সত্যবাদী।</p><div class=\"rf\">সূরা আল-হুজুরাত, আয়াত: ১৫</div><p><b>২। ধৈর্য ও সহনশীলতা অবলম্বন:</b></p><p>দাওয়াহর পথে বিরোধিতা, অপমান, বিদ্রূপ ও নানা প্রতিকূলতা আসতে পারে। এসব পরিস্থিতিতে উত্তেজিত না হয়ে ধৈর্য ও সহনশীলতার পরিচয় দিতে হবে। রাসূলুল্লাহ (সা.) ও পূর্ববর্তী নবী-রাসূলগণ বিরোধীদের নানা নির্যাতন সহ্য করেও দাওয়াতের কাজ অব্যাহত রেখেছিলেন। তাই একজন দায়ীর উচিত ধৈর্যের সঙ্গে নিজের দায়িত্ব পালন করা।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ</div></div><p>অর্থ: হে মুমিনগণ! তোমরা ধৈর্য ধারণ করো, ধৈর্যে প্রতিযোগিতা করো, দৃঢ়ভাবে অবস্থান করো এবং আল্লাহকে ভয় করো, যাতে তোমরা সফল হতে পারো।</p><div class=\"rf\">সূরা আলে ইমরান, আয়াত: ২০০। Islamic Studies +1</div><p><b>৩। আল্লাহর ওপর পূর্ণ ভরসা রাখা:</b></p><p>বিরোধীদের ষড়যন্ত্র ও বাধার সম্মুখীন হলে আল্লাহর ওপর তাওয়াক্কুল করতে হবে। একজন দায়ীকে বিশ্বাস করতে হবে যে, সব ক্ষমতা ও কর্তৃত্ব আল্লাহর হাতে। মানুষের ষড়যন্ত্র যতই গভীর হোক, আল্লাহর সাহায্য ও নির্দেশনার ওপর নির্ভরশীল থেকে সঠিক উপায়ে দাওয়াতের কাজ চালিয়ে যেতে হবে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ</div></div><p>অর্থ: আর যে ব্যক্তি আল্লাহর ওপর ভরসা করে, তার জন্য আল্লাহই যথেষ্ট।</p><div class=\"rf\">সূরা আত-তালাক, আয়াত: ৩</div><p><b>৪। জ্ঞান, প্রজ্ঞা ও কৌশল অবলম্বন:</b></p><p>ইসলামের বিরুদ্ধে অপপ্রচার ও ভুল ধারণার মোকাবিলায় আবেগের পরিবর্তে জ্ঞান, যুক্তি ও প্রজ্ঞা অবলম্বন করতে হবে। কুরআন-সুন্নাহর সঠিক জ্ঞান অর্জন করে দলিলভিত্তিক আলোচনা করতে হবে। বিরোধীদের প্রশ্ন ও আপত্তির উত্তর দিতে হবে সুন্দর ভাষায় এবং উপযুক্ত পদ্ধতিতে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ</div></div><p>অর্থ: আপনি আপনার প্রতিপালকের পথে মানুষকে আহ্বান করুন হিকমাহ বা প্রজ্ঞা, উত্তম উপদেশ এবং সর্বোত্তম পন্থায় যুক্তিতর্কের মাধ্যমে।</p><div class=\"rf\">সূরা আন-নাহল, আয়াত: ১২৫</div><p><b>৫। মুসলিম উম্মাহর ঐক্য ও সংহতি বজায় রাখা:</b></p><p>ইসলামের শত্রুদের ষড়যন্ত্র মোকাবিলায় মুসলমানদের পারস্পরিক ঐক্য অত্যন্ত গুরুত্বপূর্ণ। দলীয় সংকীর্ণতা, হিংসা-বিদ্বেষ ও অভ্যন্তরীণ বিভেদ দাওয়াহর শক্তিকে দুর্বল করে। তাই পারস্পরিক সহযোগিতা, ভ্রাতৃত্ব ও সম্প্রীতি বজায় রেখে ঐক্যবদ্ধভাবে দাওয়াতি কার্যক্রম পরিচালনা করতে হবে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا</div></div><p>অর্থ: তোমরা সবাই সম্মিলিতভাবে আল্লাহর রজ্জুকে দৃঢ়ভাবে ধারণ করো এবং পরস্পর বিচ্ছিন্ন হয়ো না।</p><div class=\"rf\">সূরা আলে ইমরান, আয়াত: ১০৩</div><p><b>৬। অপপ্রচার ও মিথ্যা তথ্যের সঠিক জবাব দেওয়া:</b></p><p>ইসলামের বিরুদ্ধে অনেক সময় মিথ্যা অভিযোগ, বিভ্রান্তিকর বক্তব্য ও অপপ্রচার চালানো হয়। এসবের মোকাবিলায় যাচাই-বাছাই ছাড়া কোনো তথ্য প্রচার করা যাবে না। বরং নির্ভরযোগ্য তথ্য, কুরআন-সুন্নাহর দলিল এবং যুক্তিপূর্ণ আলোচনার মাধ্যমে সত্য তুলে ধরতে হবে। পাশাপাশি সামাজিক যোগাযোগমাধ্যমে দায়িত্বশীল আচরণ করতে হবে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا</div></div><p>অর্থ: হে মুমিনগণ! যদি কোনো পাপাচারী ব্যক্তি তোমাদের কাছে কোনো সংবাদ নিয়ে আসে, তবে তোমরা তা যাচাই করে নাও।</p><div class=\"rf\">সূরা আল-হুজুরাত, আয়াত: ৬</div><p><b>৭। উত্তম চরিত্র ও নৈতিকতা বজায় রাখা:</b></p><p>বিরোধীদের মোকাবিলায় গালিগালাজ, মিথ্যা, প্রতারণা ও অন্যায় আচরণ করা যাবে না। বরং সততা, বিনয়, ক্ষমাশীলতা ও উত্তম আচরণের মাধ্যমে ইসলামের আদর্শ তুলে ধরতে হবে। উত্তম চরিত্র মানুষের হৃদয়ে ইতিবাচক প্রভাব সৃষ্টি করে এবং দাওয়াহকে গ্রহণযোগ্য করে তোলে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيمٌ</div></div><p>অর্থ: মন্দকে প্রতিহত করুন উত্তম পন্থায়। ফলে যার সঙ্গে আপনার শত্রুতা রয়েছে, সে যেন আপনার অন্তরঙ্গ বন্ধু হয়ে যাবে।</p><div class=\"rf\">সূরা ফুসসিলাত, আয়াত: ৩৪</div><p><b>৮। দাওয়াতি কার্যক্রমে পরিকল্পনা ও সাংগঠনিক দক্ষতা বৃদ্ধি:</b></p><p>ইসলামী দাওয়াহকে সম্প্রসারণ করতে হলে সুপরিকল্পিত ও সুসংগঠিতভাবে কাজ করতে হবে। যোগ্য দায়ী তৈরি, শিক্ষা ও প্রশিক্ষণের ব্যবস্থা, দাওয়াতি প্রতিষ্ঠান গঠন এবং আধুনিক যোগাযোগমাধ্যমের সঠিক ব্যবহার নিশ্চিত করতে হবে। এতে বিরোধিতা ও প্রতিকূলতার মধ্যেও দাওয়াহর কার্যক্রম ধারাবাহিকভাবে পরিচালনা করা সম্ভব হবে।</p><p><b>৯। দোয়া, ইবাদত ও আল্লাহর সাহায্য কামনা:</b></p><p>ইসলামী দাওয়াহর পথে অটল থাকার জন্য নিয়মিত নামাজ, কুরআন তিলাওয়াত, জিকির ও দোয়ার মাধ্যমে আল্লাহর সাহায্য কামনা করতে হবে। দায়ীকে সব সময় আল্লাহর ওপর নির্ভরশীল থাকতে হবে এবং তাঁর কাছে দৃঢ়তা ও হেদায়াত প্রার্থনা করতে হবে।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ</div></div><p>অর্থ: হে আমাদের প্রতিপালক! আমাদের ওপর ধৈর্য ঢেলে দিন, আমাদের পদক্ষেপ দৃঢ় রাখুন এবং অবিশ্বাসী সম্প্রদায়ের বিরুদ্ধে আমাদের সাহায্য করুন।</p><div class=\"rf\">সূরা আল-বাকারা, আয়াত: ২৫০</div><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, ইসলামী দাওয়াহর সম্প্রসারণে বিরোধিতা ও ষড়যন্ত্রের মোকাবিলায় ঈমানের দৃঢ়তা, ধৈর্য, তাকওয়া, জ্ঞান, ঐক্য, উত্তম চরিত্র ও আল্লাহর ওপর ভরসা অপরিহার্য। রাসূলুল্লাহ (সা.)-এর জীবন থেকে শিক্ষা নিয়ে সব ধরনের প্রতিকূলতার মধ্যেও প্রজ্ঞা ও নৈতিকতার সঙ্গে দাওয়াহর কাজ চালিয়ে যেতে হবে। কোনো অন্যায়, উগ্রতা বা প্রতিশোধপরায়ণতার আশ্রয় না নিয়ে সত্য, ন্যায় ও শান্তির পথে অবিচল থাকাই একজন দায়ীর প্রকৃত কর্তব্য। তাহলেই ইসলামী দাওয়াহর সম্প্রসারণ সম্ভব হবে।</p>"], ["الْقُدْوَةُ الْحَسَنَةُ বলতে কী বুঝ? ইসলামী দাওয়াহর ক্ষেত্রে এর গুরুত্ব বর্ণনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। ইসলামী দাওয়াতের মূল উদ্দেশ্য হলো মানুষকে সত্য ও কল্যাণের পথে পরিচালিত করা। এ দাওয়াতের সফলতার জন্য শুধু মুখে বক্তব্য প্রদান করাই যথেষ্ট নয়; বরং দাঈর নিজের জীবনেও ইসলামের আদর্শ ও শিক্ষার প্রতিফলন থাকা জরুরি। কারণ মানুষ কথার চেয়ে কাজের মাধ্যমে বেশি প্রভাবিত হয়। তাই ইসলামী দাওয়াতের ক্ষেত্রে উত্তম আদর্শের গুরুত্ব অপরিসীম।</p><div class=\"h\"><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ الْحَسَنَةُ</span>-এর পরিচয়:</div><p><b>আভিধানিক অর্থ:</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ الْحَسَنَةُ</span> দুটি আরবি শব্দের সমন্বয়ে গঠিত।</p><p><b>১।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ</span> অর্থ আদর্শ, অনুসরণীয় ব্যক্তি বা অনুকরণীয় দৃষ্টান্ত।</p><p><b>২।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْحَسَنَةُ</span> অর্থ উত্তম, সুন্দর বা ভালো।</p><p>সুতরাং <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ الْحَسَنَةُ</span> অর্থ উত্তম আদর্শ বা সুন্দর অনুসরণীয় দৃষ্টান্ত।</p><p><b>পারিভাষিক সংজ্ঞা:</b></p><p><b>১। ইমাম শাওকানী (রহ.) বলেন—</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الِاقْتِدَاءُ هُوَ طَلَبُ مُوَافَقَةِ الْغَيْرِ فِي فِعْلِهِ</div></div><p>অর্থ: অন্যের কাজের অনুরূপ কাজ করার চেষ্টা করাকে অনুসরণ বা ইকতিদা বলে।</p><p><b>২। ড. সাঈদ ইবনে আলী ইবনে ওয়াহফ আল-কাহতানী বলেন—</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْقُدْوَةُ هِيَ الْحَالَةُ الَّتِي يَكُونُ الْإِنْسَانُ عَلَيْهَا فِي اتِّبَاعِ غَيْرِهِ</div></div><p>অর্থ: অন্যের অনুসরণ করার ক্ষেত্রে মানুষ যে অবস্থার ওপর প্রতিষ্ঠিত থাকে, তাকে আদর্শ বা অনুসরণীয় দৃষ্টান্ত বলে।</p><p><b>সারকথা:</b> ইসলামের শিক্ষা ও আদর্শ নিজের জীবনে বাস্তবায়ন করে অন্যদের সামনে অনুসরণযোগ্য দৃষ্টান্ত স্থাপন করাই হলো <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ الْحَسَنَةُ</span>।</p><div class=\"h\">ইসলামী দাওয়াহর ক্ষেত্রে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ الْحَسَنَةُ</span>-এর গুরুত্ব:</div><p><b>১। দাওয়াতের কার্যকারিতা বৃদ্ধি:</b></p><p>উত্তম আদর্শ দাওয়াতের কার্যকারিতা বহুগুণে বৃদ্ধি করে। একজন দাঈ যদি নিজের জীবনে ইসলামের শিক্ষা বাস্তবায়ন করেন, তাহলে তাঁর কথা মানুষের কাছে অধিক গ্রহণযোগ্য হয়। মানুষ তাঁর বক্তব্যের পাশাপাশি তাঁর জীবনাচরণ থেকেও ইসলামের শিক্ষা গ্রহণ করে।</p><p><b>২। রাসুলুল্লাহ (সা.)-এর আদর্শ অনুসরণ:</b></p><p>ইসলামী দাওয়াতের ক্ষেত্রে সর্বোত্তম আদর্শ হলেন মহানবী হযরত মুহাম্মদ (সা.)। আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ</div><div class=\"rf\">সূরা আল-আহযাব, আয়াত: ২১</div></div><p>অর্থ: নিশ্চয়ই তোমাদের জন্য আল্লাহর রাসুলের মধ্যে রয়েছে উত্তম আদর্শ।</p><p>রাসুলুল্লাহ (সা.)-এর সততা, আমানতদারি, ক্ষমাশীলতা, ধৈর্য ও মানবিক আচরণ ছিল দাওয়াতের অন্যতম প্রধান শক্তি। তাই প্রত্যেক দাঈর উচিত তাঁর আদর্শ অনুসরণ করে দাওয়াতি কার্যক্রম পরিচালনা করা।</p><p><b>৩। মানুষের আস্থা ও বিশ্বাস অর্জন:</b></p><p>একজন দাঈর চরিত্র সুন্দর হলে মানুষ তাঁর প্রতি আস্থা ও বিশ্বাস স্থাপন করে। সত্যবাদিতা, আমানতদারি ও প্রতিশ্রুতি রক্ষার মাধ্যমে তিনি মানুষের হৃদয়ে স্থান করে নিতে পারেন। ফলে মানুষ তাঁর দাওয়াত গ্রহণে আগ্রহী হয়।</p><p><b>৪। মানুষের হৃদয় জয় করা:</b></p><p>সুন্দর আচরণ মানুষের হৃদয় জয় করার অন্যতম মাধ্যম। নম্রতা, ভদ্রতা, সহানুভূতি ও ভালোবাসাপূর্ণ আচরণ মানুষের মনে ইতিবাচক প্রভাব সৃষ্টি করে। ফলে কঠিন মনের মানুষও সুন্দর ব্যবহারে প্রভাবিত হয়ে ইসলামের প্রতি আকৃষ্ট হতে পারে।</p><p><b>৫। ইসলামের সৌন্দর্য তুলে ধরা:</b></p><p>একজন দাঈর উত্তম জীবনাচরণের মাধ্যমে ইসলামের প্রকৃত সৌন্দর্য প্রকাশ পায়। তাঁর সততা, ন্যায়পরায়ণতা, পরোপকারিতা ও মানবিক আচরণ দেখে মানুষ ইসলামের শিক্ষা সম্পর্কে বাস্তব ধারণা লাভ করে। এতে ইসলামের প্রতি মানুষের আগ্রহ বৃদ্ধি পায়।</p><p><b>৬। অমুসলিমদের ইসলামের প্রতি আকৃষ্ট করা:</b></p><p>উত্তম আদর্শের মাধ্যমে অমুসলিমদের মনেও ইসলামের প্রতি আগ্রহ সৃষ্টি করা যায়। একজন মুসলমানের সুন্দর ব্যবহার, সততা ও মানবিকতা দেখে অমুসলিমরা ইসলামের প্রকৃত শিক্ষা সম্পর্কে জানতে উৎসাহিত হয়। ফলে তাদের কাছে ইসলামের দাওয়াত পৌঁছানো সহজ হয়।</p><p><b>৭। সামাজিক সম্প্রীতি ও শান্তি প্রতিষ্ঠা:</b></p><p>উত্তম আদর্শ মানুষে মানুষে ভালোবাসা, সহমর্মিতা ও পারস্পরিক শ্রদ্ধাবোধ সৃষ্টি করে। হিংসা, বিদ্বেষ, অহংকার ও ঝগড়া-বিবাদ দূর করতে এটি গুরুত্বপূর্ণ ভূমিকা পালন করে। ফলে সমাজে শান্তি, সম্প্রীতি ও ভ্রাতৃত্ব প্রতিষ্ঠিত হয়।</p><p><b>৮। দাওয়াতের প্রতি মানুষের আগ্রহ সৃষ্টি:</b></p><p>দাঈর সুন্দর আচরণ ও আদর্শ জীবনযাপন মানুষকে ইসলামের প্রতি আগ্রহী করে তোলে। অনেক সময় দীর্ঘ বক্তব্যের চেয়ে একজন দাঈর বাস্তব জীবন মানুষের মনে বেশি প্রভাব বিস্তার করে। ফলে মানুষ স্বতঃস্ফূর্তভাবে ইসলামের শিক্ষা গ্রহণে উদ্বুদ্ধ হয়।</p><p><b>৯। দাঈর গ্রহণযোগ্যতা ও মর্যাদা বৃদ্ধি:</b></p><p>উত্তম আদর্শ একজন দাঈর ব্যক্তিত্বকে সুন্দর ও মর্যাদাপূর্ণ করে তোলে। মানুষ তাঁকে শ্রদ্ধা করে এবং তাঁর কথা গুরুত্বের সঙ্গে শোনে। ফলে সমাজে তাঁর দাওয়াতি কার্যক্রম পরিচালনা করা সহজ হয়।</p><p><b>১০। দাওয়াতি কাজে সফলতা অর্জন:</b></p><p>দাওয়াতের সফলতা শুধু বক্তব্যের ওপর নির্ভর করে না; বরং দাঈর চরিত্র, ধৈর্য, সহনশীলতা ও কর্মের ওপরও নির্ভরশীল। তাই উত্তম আদর্শের মাধ্যমে দাঈ মানুষের কাছে ইসলামের বাণী কার্যকরভাবে পৌঁছে দিতে পারেন।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, ইসলামী দাওয়াতের ক্ষেত্রে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقُدْوَةُ الْحَسَنَةُ</span> বা উত্তম আদর্শ অত্যন্ত গুরুত্বপূর্ণ উপাদান। একজন দাঈর কথা ও কাজের মধ্যে সামঞ্জস্য থাকা আবশ্যক। মহানবী হযরত মুহাম্মদ (সা.) ছিলেন উত্তম আদর্শের সর্বশ্রেষ্ঠ নমুনা। তাই তাঁর আদর্শ অনুসরণ করে প্রত্যেক দাঈকে নিজের জীবন গঠন করতে হবে। কারণ উত্তম আদর্শই ইসলামের সৌন্দর্য প্রকাশ এবং দাওয়াতের সফলতা অর্জনের অন্যতম প্রধান মাধ্যম।</p>"]]}]}, "dv": ["প্রশ্নসমূহ"], "ex": "2026-11-05"}, , {"n": "ইসলামিক স্টাডিজ ২য় পত্র", "c": "#E11D48", "k": "ই২", "d": {"হাদিসের অনুবাদ": [{"n": "সালাত পর্ব", "c": "#E11D48", "q": [["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى قَالَ: حَدَّثَنِي أَصْحَابُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّ عَبْدَ اللَّهِ بْنَ زَيْدٍ الْأَنْصَارِيَّ رَأَى الْأَذَانَ فِي الْمَنَامِ، فَأَتَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَأَخْبَرَهُ، فَقَالَ: عَلِّمْهُ بِلَالًا، فَقَامَ بِلَالٌ فَأَذَّنَ مَثْنَى مَثْنَى.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এর باب الأذان كيف هو (আজান কীভাবে প্রবর্তিত হলো) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামের অন্যতম গুরুত্বপূর্ণ ইবাদত হলো নামাজ। মুসলমানদের জামাতে নামাজের জন্য আহ্বান জানানোর উদ্দেশ্যে আজানের প্রচলন করা হয়। আলোচ্য হাদিসে আজান প্রবর্তনের ঐতিহাসিক ঘটনা বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবদুর রহমান ইবনে আবি লায়লা (রহ.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.)-এর সাহাবিগণ আমাকে জানিয়েছেন যে, আবদুল্লাহ ইবনে যায়েদ আনসারি (রা.) একবার স্বপ্নে আজানের শব্দগুলো দেখতে পান। অতঃপর তিনি নবী করিম (সা.)-এর কাছে এসে বিষয়টি জানালেন। রাসুলুল্লাহ (সা.) তাঁর কথা শুনে খুশি হলেন এবং বললেন, তুমি এই শব্দগুলো বিলালকে শিখিয়ে দাও। তখন বিলাল (রা.) দাঁড়িয়ে আজানের শব্দগুলো দুইবার করে উচ্চারণ করলেন।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে জানা যায়, আজানের প্রচলন স্বপ্নের মাধ্যমে শুরু হলেও রাসুলুল্লাহ (সা.)-এর অনুমোদনের মাধ্যমে তা ইসলামের গুরুত্বপূর্ণ নিদর্শনে পরিণত হয়।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ نَافِعٍ، قَالَ: أَقْبَلْنَا مَعَ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُ، حَتَّى إِذَا كُنَّا بِبَعْضِ الطَّرِيقِ، اسْتُصْرِخَ عَلَى زَوْجَتِهِ بِنْتِ أَبِي عُبَيْدٍ، فَرَاحَ مُسْرِعًا، حَتَّى غَابَتِ الشَّمْسُ، فَنُودِيَ بِالصَّلَاةِ، فَلَمْ يَنْزِلْ، حَتَّى إِذَا أَمْسَى، فَظَنَنَّا أَنَّهُ قَدْ نَسِيَ، فَقُلْتُ: الصَّلَاةَ، فَسَكَتَ، حَتَّى إِذَا كَادَ الشَّفَقُ أَنْ يَغِيبَ، نَزَلَ فَصَلَّى الْمَغْرِبَ، وَغَابَ الشَّفَقُ فَصَلَّى الْعِشَاءَ، وَقَالَ: هَكَذَا كُنَّا نَفْعَلُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا جَدَّ بِنَا السَّيْرُ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এর সফরে দুই ওয়াক্ত সালাত একত্রে আদায়সংক্রান্ত অধ্যায় থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম একটি সহজ ও বাস্তবসম্মত জীবনব্যবস্থা। সফরের কষ্ট ও বিশেষ পরিস্থিতি বিবেচনায় শরিয়ত নামাজ আদায়ের ক্ষেত্রে কিছু বিশেষ সুযোগ দিয়েছে। আলোচ্য হাদিসে সফরের সময় মাগরিব ও এশার নামাজ একত্রে আদায়ের বিষয়টি আলোচনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>নাফি (রহ.) থেকে বর্ণিত। তিনি বলেন, আমরা আবদুল্লাহ ইবনে উমর (রা.)-এর সঙ্গে সফরে বের হলাম। পথের এক স্থানে পৌঁছালে তাঁর স্ত্রী বিনতে আবি উবাইদের অসুস্থতার সংবাদ দিয়ে তাঁকে ডেকে পাঠানো হলো। তখন তিনি দ্রুত পথ চলতে শুরু করলেন। এভাবে চলতে চলতে সূর্য ডুবে গেল। নামাজের জন্য তাঁকে ডাক দেওয়া হলো, কিন্তু তিনি বাহন থেকে নামলেন না।</p><p>সন্ধ্যা ঘনিয়ে এলে আমাদের মনে হলো, হয়তো তিনি নামাজের কথা ভুলে গেছেন। তাই আমি তাঁকে বললাম, নামাজের সময় হয়েছে। কিন্তু তিনি নীরব রইলেন। অবশেষে যখন গোধূলির লাল আভা প্রায় মিলিয়ে যাওয়ার উপক্রম হলো, তখন তিনি বাহন থেকে নেমে মাগরিবের নামাজ আদায় করলেন। এরপর গোধূলির আভা সম্পূর্ণ মিলিয়ে গেলে এশার নামাজ আদায় করলেন। তারপর বললেন, রাসুলুল্লাহ (সা.)-এর সঙ্গে সফরে যখন আমাদের দ্রুত পথ চলার প্রয়োজন হতো, তখন আমরা এভাবেই করতাম।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস দ্বারা প্রমাণিত হয়, বিশেষ প্রয়োজনে সফরের সময় মাগরিব ও এশার নামাজ একত্রে আদায় করার অবকাশ রয়েছে।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عُبَادَةَ بْنِ الصَّامِتِ قَالَ: صَلَّى بِنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَلَاةَ الْفَجْرِ، فَتَعَايَا عَلَيْهِ الْقِرَاءَةُ، فَلَمَّا سَلَّمَ قَالَ: أَتَقْرَؤُونَ خَلْفِي؟ قُلْنَا: نَعَمْ يَا رَسُولَ اللَّهِ، قَالَ: فَلَا تَفْعَلُوا إِلَّا بِفَاتِحَةِ الْكِتَابِ، فَإِنَّهُ لَا صَلَاةَ لِمَنْ لَمْ يَقْرَأْ بِهَا.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এর باب القراءة خلف الإمام (ইমামের পেছনে কিরাআত পাঠ অধ্যায়) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>নামাজে ইমামের পেছনে কিরাআত পাঠ করা নিয়ে ফকিহদের মধ্যে মতপার্থক্য রয়েছে। আলোচ্য হাদিসে ইমামের পেছনে সূরা ফাতিহা পাঠের গুরুত্ব সম্পর্কে আলোচনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>উবাদা ইবনে সামিত (রা.) থেকে বর্ণিত। তিনি বলেন, একদিন রাসুলুল্লাহ (সা.) আমাদের নিয়ে ফজরের নামাজ আদায় করলেন। নামাজের সময় তাঁর কিরাআত পড়তে কিছুটা অসুবিধা হলো। নামাজ শেষে তিনি আমাদের জিজ্ঞাসা করলেন, তোমরা কি আমার পেছনে কিরাআত পাঠ করো? আমরা বললাম, হ্যাঁ, হে আল্লাহর রাসুল! তখন তিনি বললেন, তোমরা সূরা ফাতিহা ছাড়া অন্য কিছু পাঠ করবে না। কারণ, যে ব্যক্তি সূরা ফাতিহা পাঠ করে না, তার নামাজ পূর্ণাঙ্গ হয় না।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে নামাজে সূরা ফাতিহা পাঠের গুরুত্ব এবং ইমামের পেছনে কিরাআত পাঠের বিষয়টি জানা যায়।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَرَأَيْتُمْ لَوْ أَنَّ نَهْرًا بِبَابِ أَحَدِكُمْ يَغْتَسِلُ فِيهِ كُلَّ يَوْمٍ خَمْسًا، هَلْ يَبْقَى مِنْ دَرَنِهِ شَيْءٌ؟ قَالُوا: لَا يَبْقَى مِنْ دَرَنِهِ شَيْءٌ، قَالَ: فَذَلِكَ مَثَلُ الصَّلَوَاتِ الْخَمْسِ، يَمْحُو اللَّهُ بِهِنَّ الْخَطَايَا. (مُتَّفَقٌ عَلَيْهِ)</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এ বর্ণিত হয়েছে। এর মূল উৎস সহিহ বুখারি ও সহিহ মুসলিম।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামে পাঁচ ওয়াক্ত নামাজ অত্যন্ত গুরুত্বপূর্ণ ইবাদত। নামাজের মাধ্যমে বান্দার গুনাহ মাফ হয় এবং আত্মিক পবিত্রতা অর্জিত হয়। আলোচ্য হাদিসে পাঁচ ওয়াক্ত নামাজের মাধ্যমে গুনাহ মাফ হওয়ার বিষয়টি তুলে ধরা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবু হুরায়রা (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কারো বাড়ির দরজার সামনে যদি একটি নদী প্রবাহিত থাকে এবং সে প্রতিদিন তাতে পাঁচবার গোসল করে, তাহলে তার শরীরে কি কোনো ময়লা অবশিষ্ট থাকবে? সাহাবিগণ বললেন, না, তার শরীরে কোনো ময়লা অবশিষ্ট থাকবে না। তখন রাসুলুল্লাহ (সা.) বললেন, পাঁচ ওয়াক্ত নামাজের দৃষ্টান্তও এমন। এর মাধ্যমে আল্লাহ তাআলা বান্দার গুনাহসমূহ মুছে দেন।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে বোঝা যায়, নিয়মিত পাঁচ ওয়াক্ত নামাজ আদায়ের মাধ্যমে বান্দার ছোটখাটো গুনাহ মাফ হয় এবং আত্মিক পবিত্রতা অর্জিত হয়।</p>"]]}, {"n": "বিবাহ পর্ব", "c": "#E11D48", "q": [["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ جَابِرٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا خَطَبَ أَحَدُكُمُ الْمَرْأَةَ، فَإِنِ اسْتَطَاعَ أَنْ يَنْظُرَ إِلَى مَا يَدْعُوهُ إِلَى نِكَاحِهَا فَلْيَفْعَلْ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب النظر إلى المخطوبة (বিয়ের প্রস্তাব দেওয়া নারীকে দেখার অধ্যায়) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>বিবাহের পূর্বে পাত্র-পাত্রীর একে অপরকে দেখার বৈধতা ইসলামে রয়েছে। বিবাহ একটি গুরুত্বপূর্ণ ও স্থায়ী বন্ধন। তাই বিবাহের সিদ্ধান্ত নেওয়ার আগে পাত্রীকে দেখে নেওয়ার বিষয়টি আলোচ্য হাদিসে তুলে ধরা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>জাবির (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কেউ যখন কোনো নারীকে বিবাহের প্রস্তাব দেয়, তখন যদি তার পক্ষে ওই নারীকে এমনভাবে দেখা সম্ভব হয়, যা তাকে বিবাহের প্রতি আগ্রহী করে তোলে, তাহলে সে যেন তা দেখে নেয়।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে বোঝা যায়, বিবাহের পূর্বে পাত্রের জন্য পাত্রীকে দেখে নেওয়া বৈধ। এতে ভবিষ্যৎ দাম্পত্য জীবনে পারস্পরিক আকর্ষণ ও ভালোবাসা সৃষ্টি হতে সহায়তা করে।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">وَعَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، وَعَنْ جَدِّهِ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا زَوَّجَ أَحَدُكُمْ عَبْدَهُ أَمَتَهُ، فَلَا يَنْظُرَنَّ إِلَى عَوْرَتِهَا.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب النظر إلى المخطوبة وبيان العورات (বিয়ের প্রস্তাব দেওয়া নারীকে দেখা ও সতর সম্পর্কিত অধ্যায়) থেকে সংকলিত। হাদিসটি আবু দাউদেও বর্ণিত হয়েছে।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামে মানুষের সতর সংরক্ষণের ওপর বিশেষ গুরুত্ব দেওয়া হয়েছে। বৈধ সম্পর্কের ক্ষেত্রেও সতরের বিধান মেনে চলতে হয়। আলোচ্য হাদিসে সতর দেখা থেকে বিরত থাকার নির্দেশ দেওয়া হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আমর ইবনে শুআইব (রহ.) তাঁর পিতা ও দাদার সূত্রে নবী করিম (সা.) থেকে বর্ণনা করেন। রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কেউ যখন তার দাসের সঙ্গে তার দাসীকে বিবাহ দেয়, তখন সে যেন তার সতরের দিকে দৃষ্টিপাত না করে।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে বোঝা যায়, বিবাহের সম্পর্ক প্রতিষ্ঠিত হলেও সতরের বিধান মেনে চলা আবশ্যক।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا خَطَبَ أَحَدُكُمُ الْمَرْأَةَ، فَقَدَرَ عَلَى أَنْ يَرَى مِنْهَا مَا يُعْجِبُهُ فَلْيَفْعَلْ. قَالَ جَابِرٌ: فَلَقَدْ خَطَبْتُ امْرَأَةً مِنْ بَنِي سَلَمَةَ، فَكُنْتُ أَتَخَبَّأُ فِي أُصُولِ النَّخْلِ حَتَّى رَأَيْتُ مِنْهَا بَعْضَ مَا يُعْجِبُنِي، فَخَطَبْتُهَا فَتَزَوَّجْتُهَا.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب الرجل يريد تزويج المرأة هل يحل له النظر إليها أم لا (কোনো নারীকে বিবাহ করতে ইচ্ছুক ব্যক্তির জন্য তাকে দেখা বৈধ কি না) অধ্যায় থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>বিবাহের আগে পাত্র-পাত্রীর একে অপরকে দেখার বিষয়টি ইসলামে অনুমোদিত। আলোচ্য হাদিসে সাহাবি জাবির (রা.)-এর পাত্রী দেখার একটি বাস্তব ঘটনা বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>জাবির ইবনে আবদুল্লাহ (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কেউ যখন কোনো নারীকে বিবাহের প্রস্তাব দেয়, তখন যদি সে ওই নারীকে এমন কিছু দেখার সুযোগ পায়, যা তাকে বিবাহের প্রতি আকৃষ্ট করে, তাহলে সে যেন তা দেখে নেয়।</p><p>জাবির (রা.) বলেন, আমি বনু সালামা গোত্রের একজন নারীকে বিবাহের প্রস্তাব দিয়েছিলাম। এরপর আমি খেজুরগাছের গোড়ার আড়ালে লুকিয়ে থাকতাম, যাতে তাঁর এমন কিছু দেখতে পারি, যা আমাকে তাঁর প্রতি আকৃষ্ট করে। অবশেষে আমি তাঁর এমন কিছু বিষয় দেখতে পেলাম, যা আমার ভালো লাগল। এরপর আমি তাঁকে বিবাহের প্রস্তাব দিলাম এবং তাঁকে বিবাহ করলাম।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে প্রমাণিত হয়, বিবাহের পূর্বে পাত্রের জন্য পাত্রীকে দেখে নেওয়া বৈধ এবং এতে ভবিষ্যৎ দাম্পত্য জীবনে পারস্পরিক ভালোবাসা সৃষ্টি হতে পারে।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا نَغْزُو مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَيْسَ لَنَا نِسَاءٌ، فَقُلْنَا: يَا رَسُولَ اللَّهِ، أَلَا نَسْتَخْصِي؟ فَنَهَانَا عَنْ ذَلِكَ، وَرَخَّصَ لَنَا أَنْ نَنْكِحَ بِالثَّوْبِ إِلَى أَجَلٍ، ثُمَّ قَرَأَ هَذِهِ الْآيَةَ: ﴿لَا تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ وَلَا تَعْتَدُوا إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ﴾.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب نكاح المتعة (সাময়িক বিবাহ অধ্যায়) থেকে সংকলিত। الشرح والتخريج والدرجة +1</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামের প্রাথমিক যুগে বিশেষ পরিস্থিতিতে সাময়িক বিবাহের অনুমতি দেওয়া হয়েছিল। পরবর্তীতে এ বিষয়ে শরিয়তের চূড়ান্ত বিধান নির্ধারিত হয়। আলোচ্য হাদিসে সাময়িক বিবাহের প্রাথমিক অনুমতির ঘটনা বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবদুল্লাহ ইবনে মাসউদ (রা.) থেকে বর্ণিত। তিনি বলেন, আমরা রাসুলুল্লাহ (সা.)-এর সঙ্গে বিভিন্ন যুদ্ধে অংশগ্রহণ করতাম। তখন আমাদের সঙ্গে কোনো স্ত্রী থাকত না। তাই আমরা রাসুলুল্লাহ (সা.)-কে বললাম, হে আল্লাহর রাসুল! আমরা কি খোজা হয়ে যাব? তিনি আমাদের তা করতে নিষেধ করলেন এবং নির্দিষ্ট সময়ের জন্য কোনো নারীর সঙ্গে বিবাহবন্ধনে আবদ্ধ হওয়ার অনুমতি দিলেন। এরপর তিনি এ আয়াত পাঠ করলেন, তোমরা আল্লাহ তোমাদের জন্য যেসব পবিত্র বস্তু হালাল করেছেন, সেগুলো হারাম করো না এবং সীমালঙ্ঘন করো না। নিশ্চয়ই আল্লাহ সীমালঙ্ঘনকারীদের পছন্দ করেন না।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে সাময়িক বিবাহের প্রাথমিক অনুমতির বিষয়টি জানা যায়। তবে পরবর্তীতে সাময়িক বিবাহ নিষিদ্ধ হয়েছে।</p>"]]}, {"n": "অর্থনৈতিক লেনদেন ও সুদ পর্ব", "c": "#E11D48", "q": [["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ أَبِي قَيْسٍ مَوْلَى عَمْرِو بْنِ الْعَاصِ قَالَ: كَتَبَ أَبُو بَكْرٍ الصِّدِّيقُ رَضِيَ اللَّهُ عَنْهُ إِلَى أُمَرَاءِ الْأَجْنَادِ حِينَ قَدِمَ الشَّامَ: أَمَّا بَعْدُ، فَإِنَّكُمْ قَدْ هَبَطْتُمْ أَرْضَ الرِّبَا، فَلَا تَتَبَايَعُوا الذَّهَبَ بِالذَّهَبِ إِلَّا وَزْنًا بِوَزْنٍ، وَلَا الْوَرِقَ بِالْوَرِقِ إِلَّا وَزْنًا بِوَزْنٍ، وَلَا الطَّعَامَ بِالطَّعَامِ إِلَّا كَيْلًا بِكَيْلٍ. قَالَ أَبُو قَيْسٍ: قَرَأْتُ كِتَابَهُ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصرف (মুদ্রা বিনিময় অধ্যায়)-এর باب الربا (সুদ অধ্যায়) থেকে সংকলিত। ج 4</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম সুদকে কঠোরভাবে নিষিদ্ধ করেছে। বিশেষ করে স্বর্ণ, রৌপ্য ও খাদ্যদ্রব্যের বিনিময়ের ক্ষেত্রে সুদের বিধান মেনে চলা জরুরি। আলোচ্য হাদিসে আবু বকর (রা.)-এর লিখিত নির্দেশনার মাধ্যমে সুদমুক্ত লেনদেনের নিয়ম তুলে ধরা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবু কাইস (রহ.) থেকে বর্ণিত। তিনি বলেন, আবু বকর সিদ্দিক (রা.) শাম দেশে পৌঁছানোর সময় সেনাপতিদের কাছে একটি চিঠি লিখলেন। চিঠিতে তিনি বললেন, তোমরা এমন একটি দেশে প্রবেশ করেছ, যেখানে সুদের প্রচলন রয়েছে। সুতরাং তোমরা স্বর্ণের বিনিময়ে স্বর্ণ লেনদেন করলে সমান ওজনে বিনিময় করবে। একইভাবে রৌপ্যের বিনিময়ে রৌপ্য লেনদেন করলেও সমান ওজনে বিনিময় করবে। আর খাদ্যের বিনিময়ে খাদ্য লেনদেন করলে সমান পরিমাণে বিনিময় করবে। আবু কাইস (রহ.) বলেন, আমি তাঁর চিঠিটি পড়েছি।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে জানা যায়, সুদমুক্ত লেনদেনের ক্ষেত্রে সমজাতীয় পণ্যের বিনিময়ে সমতা বজায় রাখা অত্যন্ত জরুরি।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عُمَرَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: الذَّهَبُ بِالذَّهَبِ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالْوَرِقُ بِالْوَرِقِ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالْبُرُّ بِالْبُرِّ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالشَّعِيرُ بِالشَّعِيرِ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالتَّمْرُ بِالتَّمْرِ رِبًا إِلَّا هَاءَ وَهَاءَ. (مُتَّفَقٌ عَلَيْهِ)</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب البيوع (ক্রয়-বিক্রয় অধ্যায়)-এর باب الربا (সুদ অধ্যায়) থেকে সংকলিত। এটি সহিহ বুখারি ও সহিহ মুসলিমেও বর্ণিত হয়েছে।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামে সুদ সম্পূর্ণ নিষিদ্ধ। স্বর্ণ, রৌপ্য ও নির্দিষ্ট খাদ্যদ্রব্যের বিনিময়ের ক্ষেত্রে সুদের বিধান রয়েছে। আলোচ্য হাদিসে এসব পণ্যের বিনিময়ের নিয়ম এবং হাতে হাতে লেনদেনের গুরুত্ব আলোচনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>উমর (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, স্বর্ণের বিনিময়ে স্বর্ণ, রৌপ্যের বিনিময়ে রৌপ্য, গমের বিনিময়ে গম, যবের বিনিময়ে যব এবং খেজুরের বিনিময়ে খেজুর লেনদেনের ক্ষেত্রে সুদ প্রযোজ্য হয়; তবে উভয় পক্ষের লেনদেন তাৎক্ষণিকভাবে হাতে হাতে সম্পন্ন হলে তা বৈধ। অর্থাৎ এসব সমজাতীয় পণ্যের বিনিময়ে পরিমাণে সমতা এবং তাৎক্ষণিক হস্তান্তর বজায় রাখতে হবে।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে সুদমুক্ত লেনদেনের ক্ষেত্রে সমতা ও তাৎক্ষণিক হস্তান্তরের গুরুত্ব প্রমাণিত হয়।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عُبَادَةَ بْنِ الصَّامِتِ رَضِيَ اللَّهُ عَنْهُ، قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: الذَّهَبُ بِالذَّهَبِ مِثْلًا بِمِثْلٍ، الْكَفَّةُ بِالْكَفَّةِ، وَالْفِضَّةُ بِالْفِضَّةِ مِثْلًا بِمِثْلٍ، الْكَفَّةُ بِالْكَفَّةِ، وَالْبُرُّ بِالْبُرِّ مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ، وَالشَّعِيرُ بِالشَّعِيرِ مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ، وَالتَّمْرُ بِالتَّمْرِ مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ، حَتَّى ذَكَرَ الْمِلْحَ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصرف (মুদ্রা বিনিময় অধ্যায়)-এর باب الربا (সুদ অধ্যায়) থেকে সংকলিত। باب الربا- الجزء رقم4 +1</p><div class=\"h\">প্রসঙ্গ</div><p>সুদমুক্ত অর্থনৈতিক লেনদেন প্রতিষ্ঠার জন্য স্বর্ণ, রৌপ্য ও খাদ্যদ্রব্যের বিনিময়ে শরিয়তের নির্ধারিত নিয়ম অনুসরণ করা জরুরি। আলোচ্য হাদিসে এসব পণ্যের বিনিময়ে সমতা ও তাৎক্ষণিক হস্তান্তরের বিধান বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>উবাদা ইবনে সামিত (রা.) থেকে বর্ণিত। তিনি বলেন, আমি রাসুলুল্লাহ (সা.)-কে বলতে শুনেছি, স্বর্ণের বিনিময়ে স্বর্ণ লেনদেন করতে হলে উভয় পক্ষের পরিমাণ সমান হতে হবে এবং ওজনও সমান হতে হবে। একইভাবে রৌপ্যের বিনিময়ে রৌপ্য লেনদেন করলেও সমান পরিমাণ ও সমান ওজন বজায় রাখতে হবে।</p><p>আর গমের বিনিময়ে গম
