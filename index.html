:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.08);--fs:16px;--a1:#0f766e;--a2:#0e7490}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mu:#94a3b8;--ln:#243049;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:12px 12px 18px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:6px;max-width:1000px;margin:0 auto}.top h1{flex:1;margin:0;font-size:21px;line-height:1.25}
.tb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 11px;backdrop-filter:blur(6px)}.tb:active{transform:scale(.94)}
header>p{max-width:1000px;margin:6px auto 0;color:rgba(255,255,255,.85)}
.hero{max-width:1000px;margin:14px auto 0;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 14px}
.ring{position:relative;flex:none;width:84px;height:84px}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}.st div{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 2px}.st b{display:block;font-size:20px;line-height:1.2}.st small{font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 10px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;margin:6px 0 8px}
.tile b{display:block;font-size:18px;line-height:1.25}.tile small{color:var(--mu);font-size:14px}.tile.off{opacity:.5}
.big{display:flex;gap:14px;align-items:center}.big .ic{margin:6px 0;flex:none}
.pb{height:7px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .4s}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 10px 8px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;max-width:1000px;margin:0 auto 8px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.zb{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:0 12px;font-weight:700}.chips{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:20px;padding:2px 12px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.strip{max-width:1000px;margin:8px auto 0;font-size:14px;color:var(--mu);display:flex;gap:10px;align-items:center}.strip .pb{flex:1;margin:0;--c:var(--a1)}
.sec{margin-bottom:22px}.sh{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px}
.sh span{margin-left:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh)}
.no{float:left;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin:1px 9px 2px 0}
.q{font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;cursor:pointer}.q::after{content:' ▾';color:var(--c)}.card.show .q::after{content:' ▴'}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;clear:both}.ib{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:0 10px;font-size:14px}
.card.bm .bm,.card.kn .kn{background:var(--c);color:#fff;border-color:var(--c)}.card.kn{opacity:.8}
.a{font-size:var(--fs);margin-top:8px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--tx);border-radius:12px;padding:6px 12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(-4px)}}
.hid .a{display:none}.hid .card.show .a{display:block}.a b{color:var(--c)}
.alw .q::after{content:none!important}.alw .q{cursor:default}.hid .a{cursor:pointer}
.a .h{font-weight:700;color:var(--c);margin:12px 0 2px;padding-left:8px;border-left:4px solid var(--c)}.a p{margin:2px 0 6px;text-align:justify}
.ay{margin:8px 0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--c);text-align:center}.ay .ar{font:400 calc(var(--fs)*1.4)/1.8 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif}.ay .rf{color:var(--mu);font-size:.9em}
.empty{text-align:center;color:var(--mu);padding:30px}
.zi{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:20px;padding:4px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}.zi.on{opacity:1}


.qt3{background:color-mix(in srgb,var(--c) 10%,var(--card));border:0;border-radius:28px;box-shadow:none;padding:12px 16px}.qt3 .no{border-radius:12px}
.qt6{background:#0b0f1a;color:#e8edf8;border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}.qt6 .no{box-shadow:0 0 10px var(--c)}
.at8 .a{background:color-mix(in srgb,var(--c) 8%,var(--card))}.at8 .a .h{background:var(--c);color:#fff;border:0;border-radius:0 16px 16px 0;margin-left:-12px;padding:2px 14px;display:inline-block}.at8 .ay{border:0;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.15);border-radius:6px}

:root{--bg:#f3f5f1;--card:#fff;--tx:#10231d;--mu:#667a72;--ln:#e3e9e4;--sh:0 1px 2px rgba(16,35,29,.05),0 8px 24px -8px rgba(16,35,29,.12);--r:22px}

body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -80px,color-mix(in srgb,var(--a1) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

.dtn .tb{width:auto;height:auto;min-width:104px;padding:11px 20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1.2;font-size:15px;font-weight:700;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));backdrop-filter:none;box-shadow:0 8px 16px -8px color-mix(in srgb,var(--a1) 80%,transparent)}
.dtn .tb:disabled{opacity:.35;box-shadow:none}
.dtn span{font-size:15px;font-weight:600;white-space:nowrap}
/* প্রশ্নের লেখার সাইজ স্থির (শুধু উত্তরের সাইজ বদলাবে) */
:root{--qfs:17px}
.card .q,.dt .card .q{font-size:var(--qfs)!important}
.card .q .aq{font-size:calc(var(--qfs)*1.45)!important}
/* সংখ্যা স্পষ্ট করা: প্রশ্নের নম্বরের মতো বোল্ড, সাদা, গাঢ় জমিনে */
.sub .tg em.ex,.sub .tg em.ex.done{color:#fff!important;font-weight:700;font-size:13.5px;letter-spacing:.1px;border:0;padding:2px 12px;background:linear-gradient(135deg,#d97706,#b45309)!important;box-shadow:0 4px 10px -4px rgba(180,83,9,.7)}
.sub .tg em.ex.done{background:linear-gradient(135deg,#64748b,#475569)!important;box-shadow:none}
.dtn span{min-width:78px;text-align:center;padding:5px 14px;border-radius:30px;color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px;background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 65%,#000));box-shadow:0 6px 12px -4px color-mix(in srgb,var(--a1) 70%,transparent)}
/* কার্ডের নিচের কোণায় চৌকা ছায়ার দাগ সরানো */
.cr .nx.cx,:root[data-theme=dark] .cr .nx.cx{box-shadow:none}
.cr{padding:0}
.go{box-shadow:0 6px 14px -4px color-mix(in srgb,var(--a1) 70%,transparent)}
.crn .cb,.crn button{border-radius:12px}
/* সাবজেক্ট/বিভাগ টাইল */
.list{gap:14px;counter-reset:n}
.tile{border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);background:var(--card);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.tile:hover{transform:translateY(-2px)}
.tile::before{height:100%;width:100%;inset:0;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 55%);opacity:.9;pointer-events:none}
.tile.sub{counter-increment:n;padding:14px 14px 14px 16px;gap:14px;border-radius:24px}
.tile.sub::before{inset:0;width:100%}
.tile.sub::after{content:counter(n,bengali);position:absolute;right:14px;top:10px;font-size:12px;font-weight:700;color:var(--c);opacity:.55;letter-spacing:.4px}
.sub .ic{width:54px;height:54px;border-radius:18px;font-size:23px;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.sub .mid b{font-size:18px;line-height:1.35;font-weight:700}
.sub .tg em{border-radius:30px;padding:1px 11px;font-size:12.5px;background:color-mix(in srgb,var(--c) 13%,var(--card));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.sub .ch{font-size:26px;opacity:.45;margin-top:14px}
.tile.sub.off{opacity:1;filter:saturate(.45)}
.tile.sub.off .mid b{color:var(--mu)}
.tile.sub.off .tg::after{content:'প্রশ্ন শীঘ্রই আসছে';font-size:12.5px;color:var(--mu);margin-left:2px;align-self:center}
.tile.sub:not(.off) .ch{opacity:.9}
.tile.big{border-radius:24px;padding:16px}
.tile.big .ic{width:52px;height:52px;border-radius:17px;margin:0;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.tile.big b{font-size:18px;font-weight:700}
.pb{height:6px;border-radius:6px}
/* নেভ + সার্চ + চিপ */
.nav{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent);padding:12px 14px 10px}
.nav .row,.chips,.strip,.seg{max-width:760px}
input{border-radius:16px;padding:11px 16px;background:var(--card);border:1px solid var(--ln);box-shadow:var(--sh);transition:.2s}
input:focus{outline:0;border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 18%,transparent)}
.zb{border-radius:14px;min-width:42px;background:var(--card);box-shadow:var(--sh);border-color:var(--ln)}
.zb.on{background:var(--a1);border-color:var(--a1)}
.chip{border:1px solid color-mix(in srgb,var(--c) 40%,var(--ln));background:color-mix(in srgb,var(--c) 8%,var(--card));padding:4px 14px;font-size:14px;font-weight:600;border-radius:30px}
.chip.on{background:var(--c);border-color:var(--c);box-shadow:0 8px 16px -8px var(--c)}
/* সেকশন হেডার */
.sec{margin-bottom:26px}
.sh{background:none;color:var(--c);padding:0 4px;font-size:15px;letter-spacing:.2px;gap:10px;text-transform:none}
.sh::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent)}
.sh::after{content:'';flex:1;order:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.sh span{order:2;margin-left:0;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);font-size:13px;font-weight:700;padding:1px 12px;border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
/* প্রশ্ন কার্ড */
.card{border:1px solid var(--ln);border-radius:22px;padding:16px 16px 14px;margin-top:12px;box-shadow:var(--sh);background:var(--card);position:relative;overflow:hidden;animation:up .45s both}
.card::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.no{width:32px;height:32px;margin:0 12px 0 0;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));box-shadow:0 6px 12px -4px color-mix(in srgb,var(--c) 70%,transparent);font-size:15px}
.card .q{overflow:hidden;min-height:32px;padding-right:30px;font-weight:600;font-size:calc(var(--fs) + 1px);line-height:1.8}
.card .q small{display:inline-block;margin-left:4px;letter-spacing:1px}
.mk{top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;border-radius:12px;font-size:17px;padding:0;transition:.2s}
.card.bm .mk,.mk.on{background:color-mix(in srgb,#f59e0b 22%,transparent)}
.a{border-radius:16px}
.empty{border:1px dashed var(--ln);border-radius:20px;background:var(--card)}
.zi{border-radius:30px;backdrop-filter:blur(10px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.or{display:inline-block;font-size:12px;font-weight:700;line-height:1.6;padding:0 10px;margin-right:2px;border-radius:20px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);vertical-align:1px}
.zi{display:none!important}

.hb{display:inline-block;padding:2px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-weight:600;font-size:14px}
header:has(.hw) .top h1{font-size:28px;line-height:1.2}header:has(.hw)>p{margin-top:10px}header:has(.hw) .top h1,header:has(.hw)>p{text-align:center}
.hw{max-width:760px;margin:14px auto 0}
.hw a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.hw a:hover{background:rgba(255,255,255,.22)}.hw a:active{transform:scale(.98)}.hw a:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
.hw i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#5BE58A,#128C7E);border:2px solid rgba(255,255,255,.85);box-shadow:0 6px 14px -4px rgba(18,140,126,.7)}
.hw span{flex:1;min-width:0;line-height:1.3}.hw b{display:block;font-size:16.5px}.hw small{display:block;font-size:12.5px;opacity:.85}
.hw u{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:#0b5a45;display:grid;place-items:center;text-decoration:none}
/* ===== সাজেশন বাটন (ছোট ও স্মার্ট) ===== */
.hw{margin:12px auto 0}
.hw a{width:fit-content;min-width:236px;max-width:100%;margin:0 auto;justify-content:space-between;gap:14px;padding:5px 6px 5px 18px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.hw span{flex:none}
.hw b{font-size:14px;font-weight:700;letter-spacing:.1px;white-space:nowrap}
.hw i{width:32px;height:32px;border-width:1.5px;box-shadow:0 4px 10px -3px rgba(18,140,126,.8)}
.hw i svg{width:18px;height:18px}


/* IS2 headings & ref chips */
.a .h.hm{display:block;width:fit-content;max-width:100%;margin:18px auto 8px!important;padding:3px 22px!important;text-align:center;background:var(--c)!important;color:#fff!important;border:0!important;border-radius:999px!important;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--c) 70%,transparent)}
.a .h.hm *{color:#fff}
.a .h.hs{display:block;width:auto;max-width:100%;margin:14px 0 4px 0!important;padding:0 0 0 10px!important;text-align:left;background:none!important;color:var(--c)!important;border:0!important;border-left:4px solid var(--c)!important;border-radius:0!important;box-shadow:none}
.a .rfc{text-align:center;margin:6px 0 10px}.a .rfc span{display:inline-block;padding:0 14px;font-size:.78em;line-height:1.7;font-weight:600;border-radius:999px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}

/* ===== চার স্তরের হেডলাইন ===== */
/* ১. মূল হেডলাইন */
.card .a .h.hm{position:relative;display:block!important;width:100%!important;max-width:100%;margin:18px 0 8px!important;padding:3px 14px!important;text-align:center;line-height:1.5;font-weight:700;font-size:.97em;color:#fff!important;border:0!important;border-radius:10px!important;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 90%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000))!important;box-shadow:0 5px 10px -7px color-mix(in srgb,var(--c) 85%,transparent)!important}
.card .a .h.hm *{color:#fff!important}
/* ২. সাব হেডলাইন */
.card .a .h.hs{display:block!important;width:auto!important;max-width:100%;margin:16px 0 6px!important;padding:3px 12px!important;text-align:left;background:color-mix(in srgb,var(--c) 12%,transparent)!important;color:var(--c)!important;border:0!important;border-left:4px solid var(--c)!important;border-radius:0 10px 10px 0!important;box-shadow:none!important;font-weight:700;font-size:1em}
/* ৩. সেকেন্ড সাব হেডলাইন (আভিধানিক অর্থ, পারিভাষিক সংজ্ঞা ...) */
.card .a .h.hs.hs2{display:block!important;width:fit-content!important;margin:12px 0 4px 10px!important;padding:0 14px!important;background:none!important;color:var(--c)!important;border:1.5px solid var(--c)!important;border-radius:999px!important;font-weight:600;font-size:.94em}
/* ৪. বোল্ড হেডলাইন (কোন আলেম বলেছেন / বোল্ড করা লাইন) */
.card .a .h.hs.hs3,.card .a p.bh{position:relative;display:block!important;width:auto!important;margin:10px 0 4px 0!important;padding:0!important;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;text-align:left!important;color:var(--tx)!important;font-weight:700;font-size:1em}
.card .a p.bh b{color:var(--tx)}
.at8 .ay.ay0{border-top:0!important}
/* ===== শব্দে শব্দে অনুবাদ বিভাগ: পাশের ফাঁকা কমানো ও সাজানো ===== */
.card:has(.wsw,.jz){padding:12px 8px 10px}
.card:has(.wsw,.jz) .q{padding-right:0}
.card:has(.wsw,.jz) .no{float:none;display:grid;margin:0 0 8px}
.card:has(.wsw,.jz) .a{padding:4px 6px}
.at8:has(.wsw,.jz) .a>b:first-child{margin-left:-6px}
.dtc:has(.wsw,.jz){padding:12px 4px}
.card:has(.wsw,.jz) .aq{text-align:justify;text-justify:inter-word}
.card:has(.wsw,.jz) .q .aq{font-size:calc(var(--qfs)*1.55)!important;line-height:1.85!important;word-spacing:normal}
.card:has(.wsw,.jz) .a p{text-align:justify}
.wsw{display:grid;gap:6px;margin:6px 0 4px}
.wr{padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 7%,var(--card));border:1px solid color-mix(in srgb,var(--c) 18%,transparent)}
.wa{direction:rtl;text-align:justify;text-justify:inter-word;font:400 calc(var(--fs)*1.4)/1.9 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;color:var(--tx)}
.wb{margin-top:3px;padding-left:8px;border-left:3px solid var(--c);text-align:justify;font-size:var(--fs);line-height:1.5;color:var(--tx)}
/* ===== পড়ার পাতা: উত্তরের বক্স পুরো স্ক্রিন জুড়ে ===== */
.dt .dtc{padding:0 0 12px!important}
.dt .dtc .sec{margin:0!important}
.dt .dtc .card.card{padding:12px 0 0!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;animation:none}
.dt .dtc .card.card::before{display:none!important}
.dt .dtc .card .no{margin-left:16px!important}
.dt .dtc .card .q{margin:0 16px!important}
.dt .dtc .card .a{margin:8px 0 0!important;padding:8px 16px!important;border-radius:0!important}
.dt .dtc .at8 .a>b:first-child{margin-left:-16px!important}
/* ===== প্রশ্নের তালিকা: জাস্টিফাই, ছোট লেখা, কম জায়গা ===== */
:root{--qfs:15.5px}
main .card{padding:11px 12px 10px!important}
main .card .no{width:28px;height:28px;margin:0 8px 0 0;font-size:14px}
main .card .q{padding-right:0!important;line-height:1.65!important;min-height:28px;text-align:justify;text-justify:inter-word}


main .card:has(.wsw,.jz){padding:9px 12px 7px!important}
main .card:has(.wsw,.jz) .no{float:left;display:grid;margin:3px 10px 0 0}
main .card:has(.wsw,.jz) .q{min-height:0}
main .card:has(.wsw,.jz) .q .aq{font-size:calc(var(--qfs)*1.3)!important;line-height:1.75!important}

<script>
const S=[, , , , , , {"n": "ইসলামিক স্টাডিজ ৩য় পত্র", "c": "#F43F5E", "k": "ই৩", "d": {"রচনামূলক প্রশ্ন": [{"n": "রচনামূলক", "c": "#F43F5E", "q": [["ইসলামের পরিচয় দাও। আর্থসামাজিক সমস্যা সমাধানে ইসলামের ভূমিকা লিপিবদ্ধ কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলাম মহান আল্লাহ তাআলার মনোনীত একমাত্র পরিপূর্ণ জীবনব্যবস্থা। মানবজাতির ইহকালীন কল্যাণ ও পরকালীন মুক্তির জন্য মহান আল্লাহ যুগে যুগে নবী-রাসূলগণের মাধ্যমে ইসলাম প্রেরণ করেছেন। সর্বশেষ নবী হযরত মুহাম্মদ (স.)-এর মাধ্যমে এ জীবনব্যবস্থা পূর্ণতা লাভ করেছে। ইসলামের মূল ভিত্তি হলো আল্লাহর একত্ববাদে বিশ্বাস স্থাপন এবং তাঁর নির্দেশিত বিধান অনুসারে জীবন পরিচালনা করা। নিম্নে প্রশ্নের আলোকে ইসলামের আভিধানিক ও পারিভাষিক সংজ্ঞা আলোচনা করা হলো।</p><div class=\"h hm\">ইসলামের সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>إِسْلَام শব্দটি আরবি। এটি سَلَّمَ বা أَسْلَمَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْإِنْقِيَادُ — আনুগত্য করা।</p><p>২। الْخُضُوعُ — বিনয় ও নত হওয়া।</p><p>৩। الطَّاعَةُ — মেনে চলা বা বাধ্য হওয়া।</p><p>৪। التَّسْلِيمُ — আত্মসমর্পণ করা।</p><div class=\"h hs hs2\">৫। السَّلَامَةُ — শান্তি ও নিরাপত্তা।</div><p>ইংরেজি অর্থ: Submission, Surrender, Obedience, Peace.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>ইসলামের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম ইবনে তাইমিয়্যাহ (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْإِسْلَامُ هُوَ الِاسْتِسْلَامُ لِلَّهِ وَحْدَهُ بِالْعِبَادَةِ وَالْإِذْعَانُ لَهُ بِالطَّاعَةِ وَالْبَرَاءَةُ مِنَ الشِّرْكِ وَأَهْلِهِ</div></div><p>অর্থ: একমাত্র আল্লাহর ইবাদতের মাধ্যমে তাঁর কাছে আত্মসমর্পণ করা, তাঁর আনুগত্য স্বীকার করা এবং শিরক ও শিরককারীদের থেকে সম্পর্কমুক্ত থাকাই ইসলাম।</p><p class=\"bh\"><b>২. ইমাম মুহাম্মদ ইবনে আবদুল ওয়াহহাব (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْإِسْلَامُ هُوَ الِاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ وَالِانْقِيَادُ لَهُ بِالطَّاعَةِ وَالْبَرَاءَةُ مِنَ الشِّرْكِ وَأَهْلِهِ</div></div><p>অর্থ: তাওহীদের মাধ্যমে আল্লাহর কাছে আত্মসমর্পণ করা, তাঁর আনুগত্যের মাধ্যমে তাঁর নির্দেশ মেনে চলা এবং শিরক ও শিরককারীদের থেকে সম্পর্কমুক্ত থাকাই ইসলাম।</p><p class=\"bh\"><b>৩. ইসলামী চিন্তাবিদদের ব্যাখ্যা:</b></p><p>ইসলাম হলো মহান আল্লাহর প্রতি পূর্ণ বিশ্বাস স্থাপন করে তাঁর যাবতীয় আদেশ-নিষেধ মেনে চলা এবং রাসূলুল্লাহ (স.)-এর প্রদর্শিত আদর্শ অনুসারে ব্যক্তিগত, পারিবারিক, সামাজিক, অর্থনৈতিক ও রাষ্ট্রীয় জীবন পরিচালনা করা।</p><div class=\"h hm\">আর্থসামাজিক সমস্যা সমাধানে ইসলামের ভূমিকা</div><div class=\"h hs hs2\">1। অর্থনৈতিক সাম্য প্রতিষ্ঠা</div><p>ইসলাম সমাজে ধনী-গরিবের বৈষম্য দূর করে অর্থনৈতিক সাম্য প্রতিষ্ঠার নির্দেশ দিয়েছে। সম্পদ যেন শুধু ধনীদের হাতে পুঞ্জীভূত না থাকে, বরং সমাজের সর্বস্তরের মানুষের মধ্যে সম্পদের সুষম বণ্টন হয়, সে ব্যবস্থা করেছে। এর মাধ্যমে অর্থনৈতিক বৈষম্য হ্রাস পায় এবং সমাজে ভারসাম্য প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنْكُمْ</div></div><p>অর্থ: যাতে তোমাদের মধ্যে শুধু ধনীদের মধ্যেই সম্পদ আবর্তিত না হয়। (সূরা আল-হাশর, আয়াত: ৭)</p><div class=\"h hs hs2\">2। দারিদ্র্য বিমোচন</div><p>দারিদ্র্য একটি গুরুত্বপূর্ণ আর্থসামাজিক সমস্যা। ইসলাম যাকাত, সদকা, ফিতরা ও দান-খয়রাতের মাধ্যমে দরিদ্র মানুষের আর্থিক অবস্থার উন্নয়নের ব্যবস্থা করেছে। এসব ব্যবস্থার মাধ্যমে অসহায় মানুষের মৌলিক চাহিদা পূরণ এবং সমাজে দারিদ্র্যের প্রভাব কমানো সম্ভব।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ</div></div><p>অর্থ: নিশ্চয়ই যাকাত ফকির ও মিসকিনদের জন্য নির্ধারিত। (সূরা আত-তাওবা, আয়াত: ৬০)</p><div class=\"h hs hs2\">3। সুদমুক্ত অর্থনীতি প্রতিষ্ঠা</div><p>সুদ অর্থনৈতিক শোষণ ও বৈষম্যের অন্যতম কারণ। সুদের মাধ্যমে ধনীরা আরও সম্পদশালী হয় এবং দরিদ্ররা ঋণের বোঝায় জর্জরিত হয়। ইসলাম সুদকে হারাম ঘোষণা করে হালাল ব্যবসা-বাণিজ্য, বিনিয়োগ ও অংশীদারত্বের মাধ্যমে অর্থনৈতিক কার্যক্রম পরিচালনার নির্দেশ দিয়েছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا</div></div><p>অর্থ: আল্লাহ ব্যবসাকে হালাল করেছেন এবং সুদকে হারাম করেছেন। (সূরা আল-বাকারা, আয়াত: ২৭৫)</p><div class=\"h hs hs2\">4। বেকারত্ব দূরীকরণ ও শ্রমের মর্যাদা প্রতিষ্ঠা</div><p>ইসলাম কর্মবিমুখতা ও অলসতাকে নিরুৎসাহিত করে হালাল উপার্জনের প্রতি উৎসাহিত করেছে। কৃষি, শিল্প, ব্যবসা-বাণিজ্য ও অন্যান্য বৈধ পেশার মাধ্যমে জীবিকা অর্জনকে সম্মানজনক কাজ হিসেবে স্বীকৃতি দিয়েছে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ</div></div><p>অর্থ: কোনো ব্যক্তি নিজের হাতের উপার্জনের চেয়ে উত্তম খাবার কখনো খায়নি। (সহিহ বুখারি)</p><div class=\"h hs hs2\">5। দুর্নীতি ও ঘুষ প্রতিরোধ</div><p>দুর্নীতি, ঘুষ, আত্মসাৎ ও অবৈধ সম্পদ অর্জন সমাজের অর্থনৈতিক কাঠামোকে দুর্বল করে। ইসলাম এসব কর্মকাণ্ড কঠোরভাবে নিষিদ্ধ করেছে এবং মানুষের সম্পদ অন্যায়ভাবে ভোগ করতে নিষেধ করেছে। এর ফলে সমাজে সততা, স্বচ্ছতা ও নৈতিকতা প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ</div></div><p>অর্থ: তোমরা পরস্পরের সম্পদ অন্যায়ভাবে গ্রাস করো না। (সূরা আল-বাকারা, আয়াত: ১৮৮)</p><div class=\"h hs hs2\">6। সম্পদের সুষম বণ্টন ও যাকাতব্যবস্থা প্রতিষ্ঠা</div><p>ইসলাম যাকাতকে সম্পদের পবিত্রতা এবং সামাজিক কল্যাণের অন্যতম মাধ্যম হিসেবে নির্ধারণ করেছে। ধনীদের সম্পদের নির্দিষ্ট অংশ দরিদ্র ও অভাবগ্রস্ত মানুষের মধ্যে বণ্টনের মাধ্যমে অর্থনৈতিক ভারসাম্য সৃষ্টি হয়। এতে সম্পদ এক শ্রেণির মানুষের হাতে সীমাবদ্ধ থাকে না এবং সমাজে পারস্পরিক দায়িত্ববোধ বৃদ্ধি পায়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِمْ بِهَا</div></div><p>অর্থ: আপনি তাদের সম্পদ থেকে সদকা গ্রহণ করুন, যার মাধ্যমে আপনি তাদের পবিত্র ও পরিশুদ্ধ করবেন। (সূরা আত-তাওবা, আয়াত: ১০৩)</p><div class=\"h hs hs2\">7। ব্যবসা-বাণিজ্যে সততা ও নৈতিকতা প্রতিষ্ঠা</div><p>ইসলাম ব্যবসায় প্রতারণা, ওজনে কম দেওয়া, ভেজাল, মজুতদারি ও কৃত্রিম সংকট সৃষ্টি করা নিষিদ্ধ করেছে। ক্রেতা-বিক্রেতা উভয়ের অধিকার সংরক্ষণ এবং ন্যায়সংগত লেনদেনের নির্দেশ দিয়েছে। এর ফলে বাজারব্যবস্থায় স্বচ্ছতা প্রতিষ্ঠিত হয় এবং ভোক্তারা শোষণ থেকে রক্ষা পায়।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ غَشَّنَا فَلَيْسَ مِنَّا</div></div><p>অর্থ: যে ব্যক্তি আমাদের সঙ্গে প্রতারণা করে, সে আমাদের অন্তর্ভুক্ত নয়। (সহিহ মুসলিম)</p><div class=\"h hs hs2\">8। শ্রমিকের অধিকার ও ন্যায্য মজুরি নিশ্চিতকরণ</div><p>ইসলাম শ্রমিকের মর্যাদা, ন্যায্য পারিশ্রমিক এবং যথাসময়ে মজুরি প্রদানের ওপর গুরুত্ব দিয়েছে। শ্রমিকের শ্রমের যথাযথ মূল্য প্রদান এবং তার প্রতি কোনো ধরনের জুলুম না করার নির্দেশ দিয়েছে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَعْطُوا الْأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ</div></div><p>অর্থ: শ্রমিকের ঘাম শুকানোর আগেই তার মজুরি দিয়ে দাও। (সুনান ইবনে মাজাহ)</p><div class=\"h hs hs2\">9। নারী ও শিশুর অধিকার প্রতিষ্ঠা</div><p>ইসলাম নারী ও শিশুর অধিকার সংরক্ষণে বিশেষ গুরুত্ব দিয়েছে। নারীদের সম্পত্তির উত্তরাধিকার, মোহরানা, ভরণপোষণ ও সম্মানজনক জীবনযাপনের অধিকার প্রদান করেছে। একইভাবে শিশুদের শিক্ষা, খাদ্য, চিকিৎসা, নিরাপত্তা ও সুষ্ঠু প্রতিপালনের দায়িত্ব অভিভাবকদের ওপর অর্পণ করেছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لِلرِّجَالِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ وَلِلنِّسَاءِ نَصِيبٌ</div></div><p>অর্থ: পিতা-মাতা ও আত্মীয়স্বজনের পরিত্যক্ত সম্পত্তিতে পুরুষদের অংশ রয়েছে এবং নারীদেরও অংশ রয়েছে। (সূরা আন-নিসা, আয়াত: ৭)</p><div class=\"h hs hs2\">10। এতিম, বিধবা ও অসহায়দের অধিকার সংরক্ষণ</div><p>ইসলাম সমাজের দুর্বল ও অসহায় মানুষের প্রতি বিশেষ দায়িত্ব আরোপ করেছে। এতিম, বিধবা, মিসকিন ও বিপদগ্রস্ত মানুষের পাশে দাঁড়ানো এবং তাদের প্রয়োজন পূরণে সহযোগিতা করার নির্দেশ দিয়েছে। এর মাধ্যমে সমাজে মানবিকতা ও সামাজিক নিরাপত্তা প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ</div></div><p>অর্থ: সুতরাং এতিমের প্রতি কঠোর হয়ো না। (সূরা আদ-দুহা, আয়াত: ৯)</p><div class=\"h hs hs2\">11। পারিবারিক শান্তি ও শৃঙ্খলা প্রতিষ্ঠা</div><p>পরিবার সমাজের মৌলিক প্রতিষ্ঠান। ইসলাম স্বামী-স্ত্রী, পিতা-মাতা ও সন্তানদের পারস্পরিক অধিকার ও দায়িত্ব নির্ধারণ করেছে। পিতামাতার প্রতি সদাচরণ, সন্তানদের সুশিক্ষা এবং স্বামী-স্ত্রীর পারস্পরিক দায়িত্ব পালনের মাধ্যমে একটি আদর্শ পরিবার গঠনের নির্দেশ দিয়েছে। এর ফলে পারিবারিক কলহ, অবহেলা ও সামাজিক বিশৃঙ্খলা হ্রাস পায়।</p><div class=\"h hs hs2\">12। মাদক ও জুয়া প্রতিরোধ</div><p>মাদক ও জুয়া ব্যক্তি, পরিবার এবং সমাজের জন্য মারাত্মক ক্ষতিকর। মাদক মানুষের কর্মক্ষমতা নষ্ট করে এবং জুয়া অর্থনৈতিক বিপর্যয় সৃষ্টি করে। ইসলাম এসব কর্মকাণ্ড সম্পূর্ণ নিষিদ্ধ করেছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنْصَابُ وَالْأَزْلَامُ رِجْسٌ</div></div><p>অর্থ: নিশ্চয়ই মদ, জুয়া, প্রতিমা ও ভাগ্যনির্ধারক তীর অপবিত্র শয়তানি কাজ। (সূরা আল-মায়িদা, আয়াত: ৯০)</p><div class=\"h hs hs2\">13। ন্যায়বিচার ও মানবিক মর্যাদা প্রতিষ্ঠা</div><p>ইসলাম ধনী-গরিব, সাদা-কালো, আরব-অনারব নির্বিশেষে সকল মানুষের সমান মানবিক মর্যাদা নিশ্চিত করেছে। বিচারব্যবস্থায় পক্ষপাত, স্বজনপ্রীতি ও অন্যায়কে নিষিদ্ধ করেছে। এর মাধ্যমে সমাজে অধিকার প্রতিষ্ঠা, বৈষম্য দূরীকরণ এবং শান্তিপূর্ণ সহাবস্থান নিশ্চিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ ন্যায়বিচার ও সদাচরণের নির্দেশ দেন। (সূরা আন-নাহল, আয়াত: ৯০)</p><div class=\"h hs hs2\">14। পারস্পরিক সহযোগিতা ও সামাজিক ভ্রাতৃত্ব প্রতিষ্ঠা</div><p>ইসলাম সমাজের মানুষের মধ্যে সহযোগিতা, সহমর্মিতা ও ভ্রাতৃত্ববোধ সৃষ্টি করেছে। বিপদগ্রস্ত মানুষের পাশে দাঁড়ানো, অভাবীদের সাহায্য করা এবং সমাজের কল্যাণে সম্মিলিতভাবে কাজ করার নির্দেশ দিয়েছে। এর মাধ্যমে হিংসা, বিদ্বেষ ও সামাজিক বিভেদ দূর হয়ে ঐক্য ও সম্প্রীতি প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ</div></div><p>অর্থ: তোমরা সৎকর্ম ও তাকওয়ার কাজে পরস্পরকে সহযোগিতা করো। (সূরা আল-মায়িদা, আয়াত: ২)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা, যা মানুষের আর্থিক ও সামাজিক জীবনের যাবতীয় সমস্যার সুষ্ঠু সমাধান প্রদান করে। যাকাত, সুদমুক্ত অর্থনীতি, ন্যায়বিচার, অর্থনৈতিক সাম্য, মানবিক মর্যাদা ও পারস্পরিক সহযোগিতার মাধ্যমে ইসলাম একটি শোষণমুক্ত, বৈষম্যহীন ও শান্তিপূর্ণ সমাজ প্রতিষ্ঠার দিকনির্দেশনা দিয়েছে। তাই আর্থসামাজিক সমস্যার স্থায়ী সমাধান এবং একটি সমৃদ্ধ কল্যাণরাষ্ট্র গঠনের জন্য ইসলামের আদর্শ বাস্তবায়ন অপরিহার্য।</p>"], ["আভিধানিক ও শরয়ী দৃষ্টিকোণ থেকে ইসলামের পরিচয় দাও। অতঃপর ইসলাম ও অন্যান্য আসমানি ধর্মসমূহের তুলনামূলক আলোচনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলাম মহান আল্লাহ তাআলার মনোনীত একমাত্র পরিপূর্ণ জীবনব্যবস্থা। মানবজাতির ইহকালীন কল্যাণ ও পরকালীন মুক্তির জন্য মহান আল্লাহ যুগে যুগে নবী-রাসূলগণের মাধ্যমে ইসলাম প্রেরণ করেছেন। সর্বশেষ নবী হযরত মুহাম্মদ (স.)-এর মাধ্যমে এ জীবনব্যবস্থা পূর্ণতা লাভ করেছে। ইসলামের মূল ভিত্তি হলো আল্লাহর একত্ববাদে বিশ্বাস স্থাপন এবং তাঁর নির্দেশিত বিধান অনুসারে জীবন পরিচালনা করা। নিম্নে প্রশ্নের আলোকে ইসলামের আভিধানিক ও পারিভাষিক সংজ্ঞা আলোচনা করা হলো।</p><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>إِسْلَام শব্দটি আরবি। এটি سَلَّمَ বা أَسْلَمَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْإِنْقِيَادُ — আনুগত্য করা।</p><p>২। الْخُضُوعُ — বিনয় ও নত হওয়া।</p><p>৩। الطَّاعَةُ — মেনে চলা বা বাধ্য হওয়া।</p><p>৪। التَّسْلِيمُ — আত্মসমর্পণ করা।</p><div class=\"h hs hs2\">৫। السَّلَامَةُ — শান্তি ও নিরাপত্তা।</div><p>ইংরেজি অর্থ: Submission, Surrender, Obedience, Peace.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>ইসলামের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম ইবনে তাইমিয়্যাহ (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْإِسْلَامُ هُوَ الِاسْتِسْلَامُ لِلَّهِ وَحْدَهُ بِالْعِبَادَةِ وَالْإِذْعَانُ لَهُ بِالطَّاعَةِ وَالْبَرَاءَةُ مِنَ الشِّرْكِ وَأَهْلِهِ</div></div><p>অর্থ: একমাত্র আল্লাহর ইবাদতের মাধ্যমে তাঁর কাছে আত্মসমর্পণ করা, তাঁর আনুগত্য স্বীকার করা এবং শিরক ও শিরককারীদের থেকে সম্পর্কমুক্ত থাকাই ইসলাম।</p><p class=\"bh\"><b>২. ইমাম মুহাম্মদ ইবনে আবদুল ওয়াহহাব (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْإِسْلَامُ هُوَ الِاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ وَالِانْقِيَادُ لَهُ بِالطَّاعَةِ وَالْبَرَاءَةُ مِنَ الشِّرْكِ وَأَهْلِهِ</div></div><p>অর্থ: তাওহীদের মাধ্যমে আল্লাহর কাছে আত্মসমর্পণ করা, তাঁর আনুগত্যের মাধ্যমে তাঁর নির্দেশ মেনে চলা এবং শিরক ও শিরককারীদের থেকে সম্পর্কমুক্ত থাকাই ইসলাম।</p><p class=\"bh\"><b>৩. ইসলামী চিন্তাবিদদের ব্যাখ্যা:</b></p><p>ইসলাম হলো মহান আল্লাহর প্রতি পূর্ণ বিশ্বাস স্থাপন করে তাঁর যাবতীয় আদেশ-নিষেধ মেনে চলা এবং রাসূলুল্লাহ (স.)-এর প্রদর্শিত আদর্শ অনুসারে ব্যক্তিগত, পারিবারিক, সামাজিক, অর্থনৈতিক ও রাষ্ট্রীয় জীবন পরিচালনা করা।</p><div class=\"h hm\">ইসলাম ও অন্যান্য আসমানি ধর্মের তুলনামূলক আলোচনা</div><div class=\"h hs hs2\">১। ধর্মের পরিচয় ও প্রকৃতি</div><p>ইসলাম আল্লাহ তায়ালার মনোনীত পূর্ণাঙ্গ জীবনব্যবস্থা। ইহুদি ও খ্রিষ্টধর্মও মূলত আল্লাহর পক্ষ থেকে প্রেরিত আসমানি ধর্মের অন্তর্ভুক্ত। তবে ইসলামের দৃষ্টিতে পূর্ববর্তী ধর্মগুলোর মূল শিক্ষা ছিল তাওহিদ ও আল্লাহর আনুগত্য। পরবর্তী সময়ে মানুষের হস্তক্ষেপে সেগুলোর কিছু শিক্ষায় পরিবর্তন ও বিকৃতি ঘটেছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে মনোনীত ধর্ম হলো ইসলাম। (সূরা আলে ইমরান, আয়াত: ১৯)</p><div class=\"h hs hs2\">২। আল্লাহর একত্ববাদ</div><p>ইসলাম এক আল্লাহর ইবাদত ও আনুগত্যের শিক্ষা দেয়। ইহুদি ধর্মেও একত্ববাদের মূল শিক্ষা রয়েছে। খ্রিষ্টধর্মের প্রচলিত প্রধান মতবাদে ত্রিত্ববাদের ধারণা রয়েছে। পক্ষান্তরে ইসলাম আল্লাহর সত্তা, গুণাবলি ও ইবাদতে কাউকে শরিক করা সম্পূর্ণ নিষিদ্ধ করেছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ</div></div><p>অর্থ: বলুন, তিনি আল্লাহ, এক-অদ্বিতীয়। আল্লাহ অমুখাপেক্ষী। (সূরা আল-ইখলাস, আয়াত: ১–২)</p><div class=\"h hs hs2\">৩। নবুওয়াত ও রিসালাতের ধারণা</div><p>ইসলাম আদম (আ.) থেকে শুরু করে নূহ, ইবরাহিম, মূসা, ঈসা (আ.)-সহ সকল নবী-রাসুলের প্রতি বিশ্বাস স্থাপন করতে নির্দেশ দিয়েছে। ইহুদি ও খ্রিষ্টধর্মেও নবীদের স্বীকৃতি রয়েছে; তবে নবীদের তালিকা ও তাঁদের মর্যাদা সম্পর্কে ধর্মভেদে পার্থক্য রয়েছে। ইসলাম সব নবীকে সম্মান করে এবং তাঁদের মধ্যে কোনো বৈষম্য করে না। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ</div></div><p>অর্থ: আমরা তাঁর রাসুলদের মধ্যে কোনো পার্থক্য করি না। (সূরা আল-বাকারা, আয়াত: ২৮৫)</p><div class=\"h hs hs2\">৪। সর্বশেষ নবী সম্পর্কে বিশ্বাস</div><p>ইসলাম বিশ্বাস করে হযরত মুহাম্মদ (সা.) সর্বশেষ নবী ও রাসুল। তাঁর পরে আর কোনো নবী আসবেন না। অন্যদিকে ইহুদি ও খ্রিষ্টধর্মে মুহাম্মদ (সা.)-এর নবুওয়াতকে ইসলামের মতো স্বীকার করা হয় না। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَٰكِنْ رَسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ</div></div><p>অর্থ: বরং তিনি আল্লাহর রাসুল এবং সর্বশেষ নবী। (সূরা আল-আহযাব, আয়াত: ৪০)</p><div class=\"h hs hs2\">৫। আসমানি কিতাবের প্রতি বিশ্বাস</div><p>ইসলাম তাওরাত, যাবুর, ইনজিল ও আল-কুরআনসহ আল্লাহর পক্ষ থেকে অবতীর্ণ কিতাবসমূহের প্রতি বিশ্বাস স্থাপন করতে নির্দেশ দেয়। তবে মুসলমানদের জন্য আল-কুরআনই সর্বশেষ ও অনুসরণযোগ্য আসমানি কিতাব। ইহুদি ও খ্রিষ্টধর্ম যথাক্রমে তানাখ ও বাইবেলকে ধর্মীয় গ্রন্থ হিসেবে অনুসরণ করে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنْزَلَ التَّوْرَاةَ وَالْإِنْجِيلَ ۝ مِنْ قَبْلُ هُدًى لِلنَّاسِ وَأَنْزَلَ الْفُرْقَانَ</div></div><p>অর্থ: তিনি এর আগে মানুষের পথনির্দেশ হিসেবে তাওরাত ও ইনজিল অবতীর্ণ করেছেন এবং ফুরকান (কুরআন) অবতীর্ণ করেছেন। (সূরা আলে ইমরান, আয়াত: ৩–৪)</p><div class=\"h hs hs2\">৬। কিতাবের সংরক্ষণ</div><p>ইসলাম বিশ্বাস করে আল-কুরআন আল্লাহর পক্ষ থেকে অবতীর্ণ সর্বশেষ কিতাব এবং আল্লাহ নিজেই এর সংরক্ষণের দায়িত্ব গ্রহণ করেছেন। পূর্ববর্তী আসমানি কিতাবগুলোর মূল বাণী আল্লাহর পক্ষ থেকে অবতীর্ণ হলেও ইসলামী বিশ্বাস অনুযায়ী সেগুলোর বর্তমান পাঠে মানুষের হস্তক্ষেপ ও পরিবর্তন ঘটেছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div></div><p>অর্থ: নিশ্চয়ই আমিই এ উপদেশগ্রন্থ (কুরআন) অবতীর্ণ করেছি এবং আমিই এর সংরক্ষক। (সূরা আল-হিজর, আয়াত: ৯)</p><div class=\"h hs hs2\">৭। ইবাদত ও উপাসনাপদ্ধতি</div><p>ইসলাম সালাত, সাওম, যাকাত ও হজের মতো সুনির্দিষ্ট ইবাদতব্যবস্থা প্রবর্তন করেছে। ইহুদি ধর্মে সাব্বাথ, প্রার্থনা ও উপবাসের বিধান রয়েছে। খ্রিষ্টধর্মে প্রার্থনা, উপবাস, বাপ্তিস্ম ও অন্যান্য ধর্মীয় আচার রয়েছে। তবে ইসলামে ইবাদতের পদ্ধতি কুরআন ও সুন্নাহ দ্বারা নির্ধারিত এবং তা আল্লাহর একত্ববাদের ভিত্তিতে পরিচালিত হয়।</p><div class=\"h hs hs2\">৮। শরিয়ত ও জীবনব্যবস্থা</div><p>ইসলাম মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক, অর্থনৈতিক ও রাষ্ট্রীয় জীবনের জন্য পূর্ণাঙ্গ বিধান প্রদান করেছে। ইহুদি ধর্মেও ধর্মীয় আইন বা হালাখা এবং খ্রিষ্টধর্মে ধর্মীয় নৈতিক বিধান রয়েছে। তবে ইসলামে ইবাদতের পাশাপাশি ব্যবসা-বাণিজ্য, বিবাহ, উত্তরাধিকার, বিচারব্যবস্থা ও সামাজিক সম্পর্কের বিস্তারিত বিধান রয়েছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي</div></div><p>অর্থ: আজ আমি তোমাদের জন্য তোমাদের দ্বীনকে পূর্ণাঙ্গ করলাম এবং তোমাদের প্রতি আমার নিয়ামত সম্পূর্ণ করলাম। (সূরা আল-মায়িদা, আয়াত: ৩)</p><div class=\"h hs hs2\">৯। মানবজাতির প্রতি সর্বজনীনতা</div><p>ইসলাম কোনো নির্দিষ্ট জাতি, গোত্র বা ভূখণ্ডের জন্য সীমাবদ্ধ নয়; বরং সমগ্র মানবজাতির জন্য প্রেরিত। ইহুদি ধর্ম ঐতিহাসিকভাবে বনি ইসরাইলের সঙ্গে বিশেষভাবে সম্পর্কিত। খ্রিষ্টধর্মও সর্বজনীন ধর্ম হিসেবে প্রচারিত। ইসলামের সর্বজনীনতার বিষয়ে আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا</div></div><p>অর্থ: আমি আপনাকে সমগ্র মানবজাতির জন্য সুসংবাদদাতা ও সতর্ককারী হিসেবে প্রেরণ করেছি। (সূরা সাবা, আয়াত: ২৮)</p><div class=\"h hs hs2\">১০। পাপ ও ক্ষমার ধারণা</div><p>ইসলাম প্রত্যেক মানুষকে তার নিজস্ব কর্মের জন্য দায়ী মনে করে। কোনো ব্যক্তি অন্যের পাপের বোঝা বহন করবে না। তাওবা ও আল্লাহর কাছে ক্ষমা প্রার্থনার মাধ্যমে পাপ থেকে মুক্তির সুযোগ রয়েছে। খ্রিষ্টধর্মের প্রচলিত মতবাদের একটি গুরুত্বপূর্ণ বিষয় হলো আদি পাপ ও যিশুর আত্মত্যাগের মাধ্যমে মুক্তির ধারণা। ইহুদি ধর্মেও তাওবা ও ক্ষমা প্রার্থনার বিশেষ গুরুত্ব রয়েছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ</div></div><p>অর্থ: কোনো বোঝা বহনকারী অন্যের বোঝা বহন করবে না। (সূরা আল-আনআম, আয়াত: ১৬৪)</p><div class=\"h hs hs2\">১১। হালাল-হারাম ও খাদ্যবিধান</div><p>ইসলাম মানুষের খাদ্য ও পানীয়ের ক্ষেত্রে হালাল-হারামের সুস্পষ্ট বিধান দিয়েছে। শূকরের মাংস, মৃত প্রাণী, রক্ত ও মদ নিষিদ্ধ করেছে। ইহুদি ধর্মেও কোশার খাদ্যবিধান রয়েছে। খ্রিষ্টধর্মের বিভিন্ন সম্প্রদায়ে খাদ্যসংক্রান্ত বিধান ও অনুশীলনে পার্থক্য দেখা যায়। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا النَّاسُ كُلُوا مِمَّا فِي الْأَرْضِ حَلَالًا طَيِّبًا</div></div><p>অর্থ: হে মানুষ! পৃথিবীতে যা কিছু হালাল ও পবিত্র রয়েছে, তা থেকে আহার করো। (সূরা আল-বাকারা, আয়াত: ১৬৮)</p><div class=\"h hs hs2\">১২। আখিরাত ও পরকালীন জীবন</div><p>ইসলাম মৃত্যুর পর পুনরুত্থান, হাশর, মিজান, পুলসিরাত, জান্নাত ও জাহান্নামে বিশ্বাস স্থাপন করতে নির্দেশ দিয়েছে। ইহুদি ও খ্রিষ্টধর্মেও পরকাল, বিচার ও প্রতিদানের ধারণা রয়েছে; তবে এ বিষয়ে তাদের বিভিন্ন ধর্মীয় মতবাদের মধ্যে পার্থক্য রয়েছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ۝ وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ</div></div><p>অর্থ: কেউ অণু পরিমাণ সৎকর্ম করলে তা দেখতে পাবে এবং কেউ অণু পরিমাণ অসৎকর্ম করলে তাও দেখতে পাবে। (সূরা আয-যিলযাল, আয়াত: ৭–৮)</p><div class=\"h hs hs2\">১৩। মানবাধিকার ও সামাজিক সাম্য</div><p>ইসলাম মানুষের জীবন, সম্পদ, সম্মান ও অধিকার সংরক্ষণে বিশেষ গুরুত্ব দিয়েছে। জাতি, বর্ণ, ভাষা ও গোত্রের ভিত্তিতে শ্রেষ্ঠত্বের ধারণা প্রত্যাখ্যান করেছে। অন্যান্য আসমানি ধর্মেও ন্যায়বিচার, দয়া, দানশীলতা ও মানবকল্যাণের শিক্ষা রয়েছে। তবে ইসলামে এসব বিষয়কে একটি পূর্ণাঙ্গ শরিয়ত ও সামাজিক ব্যবস্থার সঙ্গে সমন্বিত করা হয়েছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে তোমাদের মধ্যে সেই ব্যক্তিই অধিক মর্যাদাসম্পন্ন, যে অধিক তাকওয়াবান। (সূরা আল-হুজুরাত, আয়াত: ১৩)</p><div class=\"h hs hs2\">১৪। ধর্মীয় সহনশীলতা ও সহাবস্থান</div><p>ইসলাম অন্য ধর্মাবলম্বীদের প্রতি ন্যায়বিচার, সদাচরণ ও ধর্মীয় স্বাধীনতার নীতি শিক্ষা দেয়। জোরপূর্বক কাউকে ধর্ম গ্রহণে বাধ্য করা নিষিদ্ধ করেছে। অন্যান্য আসমানি ধর্মেও নৈতিকতা ও মানবিক আচরণের শিক্ষা রয়েছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا إِكْرَاهَ فِي الدِّينِ</div></div><p>অর্থ: দ্বীনের ব্যাপারে কোনো জবরদস্তি নেই। (সূরা আল-বাকারা, আয়াত: ২৫৬)</p><div class=\"h hs hs2\">১৫। ধর্মের পূর্ণতা ও চূড়ান্ততা</div><p>ইসলাম পূর্ববর্তী নবী-রাসুল ও আসমানি কিতাবের মূল শিক্ষাকে স্বীকার করে এবং মুহাম্মদ (সা.)-এর মাধ্যমে নবুওয়াতের ধারার সমাপ্তি ঘোষণা করে। ইসলামী বিশ্বাস অনুযায়ী ইসলামই আল্লাহর মনোনীত সর্বশেষ ও পূর্ণাঙ্গ জীবনব্যবস্থা। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَنْ يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ</div></div><p>অর্থ: যে ব্যক্তি ইসলাম ছাড়া অন্য কোনো দ্বীন অনুসন্ধান করবে, তা কখনো তার কাছ থেকে গ্রহণ করা হবে না। (সূরা আলে ইমরান, আয়াত: ৮৫)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইসলাম, ইহুদি ও খ্রিষ্টধর্মের মূল উৎস ঐশী নির্দেশনা হলেও তাদের বর্তমান ধর্মীয় বিশ্বাস, বিধিবিধান ও অনুসরণপদ্ধতিতে পার্থক্য রয়েছে। ইসলামের দৃষ্টিতে পূর্ববর্তী নবী-রাসুল ও আসমানি কিতাবের মূল শিক্ষার প্রতি বিশ্বাস রাখা ঈমানের অংশ। তবে ইসলাম সর্বশেষ নবুওয়াত, সংরক্ষিত কুরআন এবং পূর্ণাঙ্গ জীবনবিধানের মাধ্যমে স্বতন্ত্র বৈশিষ্ট্য লাভ করেছে। তাই মুসলমানদের জন্য ইসলামই অনুসরণীয় চূড়ান্ত জীবনব্যবস্থা।</p>"], ["আল্লাহর বাণী إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ এর আলোকে অন্যান্য ধর্মের উপর ইসলামের শ্রেষ্ঠত্ব সম্পর্কে আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>ইসলাম আল্লাহ তায়ালার মনোনীত, সর্বশেষ ও পূর্ণাঙ্গ জীবনব্যবস্থা। মানবজাতির ইহকালীন কল্যাণ ও পরকালীন মুক্তির জন্য মহান আল্লাহ যুগে যুগে অসংখ্য নবী-রাসুল প্রেরণ করেছেন এবং তাঁদের মাধ্যমে আসমানি কিতাব ও শরিয়ত প্রদান করেছেন। পূর্ববর্তী নবী-রাসুলগণের মূল দাওয়াতও ছিল এক আল্লাহর ইবাদত ও আনুগত্য করা। তবে সর্বশেষ নবী হযরত মুহাম্মদ (সা.)-এর মাধ্যমে ইসলাম পূর্ণতা লাভ করেছে। ইসলাম শুধু ধর্মীয় আচার-অনুষ্ঠানের মধ্যে সীমাবদ্ধ নয়; বরং মানবজীবনের প্রতিটি ক্ষেত্রে সঠিক দিকনির্দেশনা প্রদান করে। এ কারণেই ইসলাম অন্যান্য ধর্মের তুলনায় স্বতন্ত্র বৈশিষ্ট্য ও পূর্ণাঙ্গ জীবনবিধানের অধিকারী। আল্লাহ তায়ালা ঘোষণা করেছেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে মনোনীত ধর্ম হলো ইসলাম। (সূরা আলে ইমরান, আয়াত: ১৯)</p><div class=\"h hm\">ইসলামের শ্রেষ্ঠত্ব ও স্বাতন্ত্র্য বৈশিষ্ট্যসমূহ</div><div class=\"h hs hs2\">১। আল্লাহর মনোনীত একমাত্র দ্বীন</div><p>ইসলাম আল্লাহ তায়ালার মনোনীত ও সন্তুষ্টির দ্বীন। মানবজাতির হিদায়াতের জন্য আল্লাহ যুগে যুগে নবী-রাসুল প্রেরণ করেছেন। তাঁদের সবার মূল দাওয়াত ছিল এক আল্লাহর ইবাদত ও আনুগত্য করা। সর্বশেষ নবী মুহাম্মদ (সা.)-এর মাধ্যমে ইসলাম পূর্ণাঙ্গ জীবনব্যবস্থা হিসেবে প্রতিষ্ঠিত হয়েছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে মনোনীত ধর্ম হলো ইসলাম। (সূরা আলে ইমরান, আয়াত: ১৯)</p><div class=\"h hs hs2\">২। পূর্ণাঙ্গ জীবনব্যবস্থা</div><p>ইসলাম শুধু উপাসনা ও ধর্মীয় আচার-অনুষ্ঠানের মধ্যে সীমাবদ্ধ নয়; বরং মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক, অর্থনৈতিক, রাজনৈতিক ও রাষ্ট্রীয় জীবনের প্রতিটি ক্ষেত্রে সুস্পষ্ট দিকনির্দেশনা প্রদান করে। মানুষের জন্ম থেকে মৃত্যু পর্যন্ত জীবনের সব বিষয়ে ইসলামের বিধান রয়েছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي</div></div><p>অর্থ: আজ আমি তোমাদের জন্য তোমাদের দ্বীনকে পূর্ণাঙ্গ করলাম এবং তোমাদের প্রতি আমার নিয়ামত সম্পূর্ণ করলাম। (সূরা আল-মায়িদা, আয়াত: ৩)</p><div class=\"h hs hs2\">৩। বিশুদ্ধ তাওহিদ প্রতিষ্ঠা</div><p>ইসলামের অন্যতম শ্রেষ্ঠ বৈশিষ্ট্য হলো বিশুদ্ধ তাওহিদ বা একত্ববাদ। ইসলাম ঘোষণা করে যে, আল্লাহ এক, অদ্বিতীয়, তাঁর কোনো শরিক, সমকক্ষ বা অংশীদার নেই। ইসলাম সব ধরনের শিরক ও অংশীদারত্বের ধারণা প্রত্যাখ্যান করেছে। অন্যান্য ধর্মের একত্ববাদসংক্রান্ত বিশ্বাস ও মতবাদের সঙ্গে ইসলামের মৌলিক পার্থক্য রয়েছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ</div></div><p>অর্থ: বলুন, তিনি আল্লাহ, এক-অদ্বিতীয়। আল্লাহ অমুখাপেক্ষী। (সূরা আল-ইখলাস, আয়াত: ১–২)</p><div class=\"h hs hs2\">৪। সর্বশেষ নবুওয়াতের স্বীকৃতি</div><p>ইসলাম পূর্ববর্তী সকল নবী-রাসুলের প্রতি বিশ্বাস স্থাপন করতে নির্দেশ দেয় এবং হযরত মুহাম্মদ (সা.)-কে সর্বশেষ নবী হিসেবে ঘোষণা করে। তাঁর মাধ্যমে নবুওয়াতের ধারার পরিসমাপ্তি ঘটেছে। অন্যদিকে ইহুদি ও খ্রিষ্টধর্ম মুহাম্মদ (সা.)-এর নবুওয়াতকে ইসলামের মতো স্বীকার করে না।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَٰكِنْ رَسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ</div></div><p>অর্থ: বরং তিনি আল্লাহর রাসুল এবং সর্বশেষ নবী। (সূরা আল-আহযাব, আয়াত: ৪০)</p><div class=\"h hs hs2\">৫। সর্বশেষ ও সংরক্ষিত আসমানি কিতাব</div><p>ইসলাম আল-কুরআনকে সর্বশেষ আসমানি কিতাব হিসেবে স্বীকৃতি দিয়েছে। পূর্ববর্তী কিতাবগুলোর মূল অবতীর্ণ হওয়ার বিষয়টি ইসলাম বিশ্বাস করে; তবে ইসলামী বিশ্বাস অনুযায়ী সেগুলোর বর্তমান পাঠে মানুষের হস্তক্ষেপ ও পরিবর্তন ঘটেছে। পক্ষান্তরে আল্লাহ তায়ালা নিজেই কুরআন সংরক্ষণের দায়িত্ব গ্রহণ করেছেন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div></div><p>অর্থ: নিশ্চয়ই আমিই এ উপদেশগ্রন্থ (কুরআন) অবতীর্ণ করেছি এবং আমিই এর সংরক্ষক। (সূরা আল-হিজর, আয়াত: ৯)</p><div class=\"h hs hs2\">৬। সর্বজনীন ধর্ম</div><p>ইসলাম কোনো নির্দিষ্ট জাতি, গোত্র, বর্ণ বা ভূখণ্ডের জন্য প্রেরিত হয়নি; বরং সমগ্র মানবজাতির হিদায়াতের জন্য প্রেরিত হয়েছে। পৃথিবীর যেকোনো দেশের, যেকোনো ভাষাভাষী ও বর্ণের মানুষ ইসলামের অনুসারী হতে পারে। এদিক থেকে ইসলাম একটি সর্বজনীন জীবনব্যবস্থা।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا</div></div><p>অর্থ: আমি আপনাকে সমগ্র মানবজাতির জন্য সুসংবাদদাতা ও সতর্ককারী হিসেবে প্রেরণ করেছি। (সূরা সাবা, আয়াত: ২৮)</p><div class=\"h hs hs2\">৭। পূর্ববর্তী নবী-রাসুলদের প্রতি বিশ্বাস</div><p>ইসলাম শুধু হযরত মুহাম্মদ (সা.)-এর প্রতি বিশ্বাস স্থাপন করাকেই যথেষ্ট মনে করে না; বরং আদম, নূহ, ইবরাহিম, মূসা ও ঈসা (আ.)-সহ সকল নবী-রাসুলের প্রতি বিশ্বাস স্থাপন করা ঈমানের অপরিহার্য অংশ। ইহুদি ও খ্রিষ্টধর্মেও বিভিন্ন নবীর স্বীকৃতি রয়েছে; তবে নবীদের তালিকা ও তাঁদের মর্যাদা সম্পর্কে মতপার্থক্য রয়েছে। ইসলাম সকল নবীকে সম্মান করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ</div></div><p>অর্থ: আমরা তাঁর রাসুলদের মধ্যে কোনো পার্থক্য করি না। (সূরা আল-বাকারা, আয়াত: ২৮৫)</p><div class=\"h hs hs2\">৮। সহজ ও বাস্তবসম্মত বিধান</div><p>ইসলাম মানুষের স্বাভাবিক সামর্থ্য ও প্রয়োজনের প্রতি গুরুত্ব দিয়েছে। এতে অযথা কঠোরতা ও অসহনীয় বিধান নেই। অসুস্থতা, সফর ও বিশেষ পরিস্থিতিতে ইবাদতের ক্ষেত্রে ছাড়ের ব্যবস্থা রয়েছে। ইসলাম মানুষের ওপর সাধ্যাতীত দায়িত্ব চাপিয়ে দেয় না।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ</div></div><p>অর্থ: আল্লাহ তোমাদের জন্য সহজ চান, কঠিন চান না। (সূরা আল-বাকারা, আয়াত: ১৮৫)</p><div class=\"h hs hs2\">৯। ইবাদত ও নৈতিকতার সমন্বয়</div><p>ইসলাম মানুষের আধ্যাত্মিক উন্নতির পাশাপাশি নৈতিক চরিত্র গঠনের ওপর গুরুত্ব দিয়েছে। সালাত, সাওম, যাকাত ও হজের মতো ইবাদত মানুষকে আল্লাহর নৈকট্য অর্জনে সাহায্য করে এবং অন্যায়, অশ্লীলতা ও পাপাচার থেকে বিরত রাখে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ</div></div><p>অর্থ: নিশ্চয়ই সালাত অশ্লীল ও মন্দ কাজ থেকে বিরত রাখে। (সূরা আল-আনকাবুত, আয়াত: ৪৫)</p><div class=\"h hs hs2\">১০। দুনিয়া ও আখিরাতের সমন্বয়</div><p>ইসলাম দুনিয়ার জীবনকে অবহেলা করতে বলে না, আবার দুনিয়াকেই জীবনের চূড়ান্ত লক্ষ্য হিসেবে গ্রহণ করতেও নির্দেশ দেয় না। বরং দুনিয়ার কল্যাণ অর্জনের পাশাপাশি আখিরাতের মুক্তির প্রস্তুতি গ্রহণ করতে বলে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ وَلَا تَنْسَ نَصِيبَكَ مِنَ الدُّنْيَا</div></div><p>অর্থ: আল্লাহ তোমাকে যা দান করেছেন, তা দিয়ে আখিরাতের আবাস অনুসন্ধান করো এবং দুনিয়া থেকে তোমার অংশ ভুলে যেয়ো না। (সূরা আল-কাসাস, আয়াত: ৭৭)</p><div class=\"h hs hs2\">১১। সামাজিক ও অর্থনৈতিক ন্যায়বিচার প্রতিষ্ঠা</div><p>ইসলাম ধনী-গরিবের বৈষম্য দূরীকরণ, সম্পদের সুষম বণ্টন, যাকাত প্রদান, সুদ নিষিদ্ধকরণ এবং অসহায় মানুষের অধিকার প্রতিষ্ঠার নির্দেশ দিয়েছে। এর মাধ্যমে সমাজে অর্থনৈতিক ভারসাম্য ও ন্যায়বিচার প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ ন্যায়বিচার ও সদাচরণের নির্দেশ দেন। (সূরা আন-নাহল, আয়াত: ৯০)</p><div class=\"h hs hs2\">১২। মানবমর্যাদা ও সাম্য প্রতিষ্ঠা</div><p>ইসলাম মানুষের মধ্যে জাতি, বর্ণ, ভাষা, গোত্র ও সম্পদের ভিত্তিতে কোনো শ্রেষ্ঠত্ব স্বীকার করে না। বরং মানুষের প্রকৃত মর্যাদা নির্ধারণ করে তাকওয়া ও সৎকর্মের ভিত্তিতে। ফলে ইসলাম মানবসমাজে সাম্য, ভ্রাতৃত্ব ও পারস্পরিক সম্মান প্রতিষ্ঠা করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে তোমাদের মধ্যে সেই ব্যক্তিই অধিক মর্যাদাসম্পন্ন, যে অধিক তাকওয়াবান। (সূরা আল-হুজুরাত, আয়াত: ১৩)</p><div class=\"h hs hs2\">১৩। ধর্মীয় স্বাধীনতা ও সহনশীলতা</div><p>ইসলাম ধর্মের ব্যাপারে জবরদস্তি সমর্থন করে না। অন্য ধর্মাবলম্বীদের প্রতি ন্যায়বিচার, সদাচরণ ও মানবিক আচরণের নির্দেশ দেয়। ধর্মীয় মতপার্থক্য থাকা সত্ত্বেও শান্তিপূর্ণ সহাবস্থানের শিক্ষা দেয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا إِكْرَاهَ فِي الدِّينِ</div></div><p>অর্থ: দ্বীনের ব্যাপারে কোনো জবরদস্তি নেই। (সূরা আল-বাকারা, আয়াত: ২৫৬)</p><div class=\"h hs hs2\">১৪। জ্ঞান-বিজ্ঞান ও শিক্ষার প্রতি গুরুত্ব</div><p>ইসলাম জ্ঞান অর্জনকে অত্যন্ত মর্যাদাপূর্ণ কাজ হিসেবে স্বীকৃতি দিয়েছে। কুরআনের প্রথম অবতীর্ণ আয়াতেই পড়ার নির্দেশ দেওয়া হয়েছে। ইসলাম মানুষকে চিন্তা, গবেষণা, পর্যবেক্ষণ ও জ্ঞানচর্চায় উৎসাহিত করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ</div></div><p>অর্থ: পাঠ করুন আপনার প্রতিপালকের নামে, যিনি সৃষ্টি করেছেন। (সূরা আল-আলাক, আয়াত: ১)</p><div class=\"h hs hs2\">১৫। আখিরাত ও চূড়ান্ত মুক্তির সুস্পষ্ট ধারণা</div><p>ইসলাম মৃত্যুর পর পুনরুত্থান, হাশর, হিসাব-নিকাশ, জান্নাত ও জাহান্নামের প্রতি বিশ্বাস স্থাপন করতে নির্দেশ দিয়েছে। প্রত্যেক মানুষকে তার নিজস্ব কর্মের জন্য জবাবদিহি করতে হবে। সৎকর্মের জন্য পুরস্কার এবং অসৎকর্মের জন্য শাস্তির বিধান রয়েছে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ۝ وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ</div></div><p>অর্থ: কেউ অণু পরিমাণ সৎকর্ম করলে তা দেখতে পাবে এবং কেউ অণু পরিমাণ অসৎকর্ম করলে তাও দেখতে পাবে। (সূরা আয-যিলযাল, আয়াত: ৭–৮)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইসলাম আল্লাহ তায়ালার মনোনীত সর্বশেষ ও পূর্ণাঙ্গ জীবনব্যবস্থা। পূর্ববর্তী আসমানি ধর্মগুলোর মূল উৎস ও শিক্ষা ছিল আল্লাহর পক্ষ থেকে প্রেরিত; কিন্তু ইসলামের দৃষ্টিতে সেগুলোর বর্তমান রূপে বিভিন্ন পরিবর্তন ও মতপার্থক্য সৃষ্টি হয়েছে। ইসলাম পূর্ববর্তী সকল নবী-রাসুল ও আসমানি কিতাবের মূল অবতীর্ণ হওয়ার বিষয়টি স্বীকার করে এবং একই সঙ্গে আল-কুরআনকে সর্বশেষ ও সংরক্ষিত কিতাব হিসেবে প্রতিষ্ঠা করেছে। তাওহিদ, সর্বজনীনতা, পূর্ণাঙ্গ জীবনবিধান, ন্যায়বিচার, মানবিক সাম্য ও ইহকালীন-পরকালীন কল্যাণের সমন্বয়ের মাধ্যমে ইসলাম স্বতন্ত্র বৈশিষ্ট্য অর্জন করেছে। তাই আল্লাহর সন্তুষ্টি ও পরকালীন মুক্তি লাভের জন্য ইসলামের আদর্শ অনুসরণ করা প্রত্যেক মানুষের কর্তব্য।</p>"], ["তাওহীদ অর্থ কী? তা কত প্রকার? মানবজীবনে তাওহীদের গুরুত্ব বিস্তারিতভাবে বর্ণনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলামি আকিদার মূল ভিত্তি হলো তাওহীদ। তাওহীদ অর্থ আল্লাহ তাআলাকে এক ও অদ্বিতীয় হিসেবে বিশ্বাস করা এবং তাঁর সত্তা, গুণাবলি ও ইবাদতে কাউকে অংশীদার না করা। সমগ্র সৃষ্টিজগতের একমাত্র স্রষ্টা, পালনকর্তা ও বিধানদাতা হলেন মহান আল্লাহ। সকল নবী-রাসূলের দাওয়াতের মূল বিষয় ছিল তাওহীদ। তাই ইসলামী জীবনব্যবস্থায় তাওহীদের গুরুত্ব অপরিসীম। নিম্নে প্রশ্নের আলোকে তাওহীদের আভিধানিক ও পারিভাষিক অর্থ আলোচনা করা হলো।</p><div class=\"h hm\">১ : تَعْرِيفُ التَّوْحِيدِ (তাওহীদের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>تَوْحِيد শব্দটি আরবি। এটি وَحَّدَ يُوَحِّدُ تَوْحِيدًا ধাতু থেকে নির্গত। এর মূল ধাতু হলো و-ح-د। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْإِفْرَادُ — একক বা অদ্বিতীয় করা।</p><p>২। الْوَحْدَانِيَّةُ — একত্ব বা এককত্ব।</p><p>৩। التَّفْرِيدُ — একক বলে স্বীকার করা।</p><p>৪। الِاعْتِقَادُ بِالْوَحْدَةِ — একত্বে বিশ্বাস করা।</p><div class=\"h hs hs2\">৫। نَفْيُ الشَّرِيكِ — অংশীদারিত্ব অস্বীকার করা।</div><p>ইংরেজি অর্থ: Oneness, Unity, Monotheism, Uniqueness.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>তাওহীদের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম ইবনে তাইমিয়্যাহ (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">التَّوْحِيدُ هُوَ إِفْرَادُ اللَّهِ بِمَا يَخْتَصُّ بِهِ مِنَ الرُّبُوبِيَّةِ وَالْأُلُوهِيَّةِ وَالْأَسْمَاءِ وَالصِّفَاتِ</div></div><p>অর্থ: আল্লাহর জন্য তাঁর একক বৈশিষ্ট্যসমূহ তথা প্রভুত্ব, উপাস্যত্ব, নাম ও গুণাবলিতে তাঁকে একক বলে স্বীকার করাই তাওহীদ।</p><p>২. ইমাম ইবনুল কাইয়্যিম (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">التَّوْحِيدُ هُوَ إِفْرَادُ اللَّهِ بِالْعِبَادَةِ وَالْخَلْقِ وَالْأَمْرِ وَالْأَسْمَاءِ وَالصِّفَاتِ</div></div><p>অর্থ: ইবাদত, সৃষ্টি, পরিচালনা, নাম ও গুণাবলিতে একমাত্র আল্লাহকে একক বলে স্বীকার করাই তাওহীদ।</p><div class=\"h hm\">তাওহীদের প্রকারভেদ</div><p>ইসলামী আকিদাশাস্ত্রে তাওহীদকে সাধারণত তিন ভাগে আলোচনা করা হয়। যথা—</p><div class=\"h hs hs2\">১। তাওহীদুর রুবুবিয়্যাহ (تَوْحِيدُ الرُّبُوبِيَّةِ)</div><p>আল্লাহ তায়ালাকে সমগ্র বিশ্বজগতের একমাত্র সৃষ্টিকর্তা, পালনকর্তা, রিজিকদাতা, জীবনদাতা, মৃত্যুদাতা ও নিয়ন্ত্রণকারী হিসেবে বিশ্বাস করাকে তাওহীদুর রুবুবিয়্যাহ বলে। আকাশমণ্ডলী, পৃথিবী এবং এর মধ্যবর্তী সবকিছুর সৃষ্টিকর্তা একমাত্র আল্লাহ। বিশ্বজগতের পরিচালনা ও নিয়ন্ত্রণে তাঁর কোনো শরিক বা অংশীদার নেই। মানুষের জীবন-মৃত্যু, রিজিক ও ভাগ্য সবকিছু তাঁর জ্ঞান ও ক্ষমতার অধীন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ</div></div><p>অর্থ: আল্লাহ সবকিছুর সৃষ্টিকর্তা এবং তিনি সবকিছুর তত্ত্বাবধায়ক। (সূরা আয-যুমার, আয়াত: ৬২)</p><div class=\"h hs hs2\">২। তাওহীদুল উলুহিয়্যাহ (تَوْحِيدُ الْأُلُوهِيَّةِ)</div><p>একমাত্র আল্লাহ তায়ালাকে ইবাদতের যোগ্য হিসেবে বিশ্বাস করা এবং সব ধরনের ইবাদত তাঁর জন্য নির্দিষ্ট করাকে তাওহীদুল উলুহিয়্যাহ বলে। সালাত, সাওম, দোয়া, কুরবানি, মানত, সিজদা ও অন্যান্য ইবাদত একমাত্র আল্লাহর সন্তুষ্টির জন্য সম্পাদন করতে হবে। কোনো সৃষ্টি, ব্যক্তি বা বস্তুকে আল্লাহর ইবাদতে অংশীদার করা যাবে না। সকল নবী-রাসুলের দাওয়াতের মূল উদ্দেশ্য ছিল মানুষকে এক আল্লাহর ইবাদতের দিকে আহ্বান করা।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ</div></div><p>অর্থ: তাদের কেবল এ নির্দেশই দেওয়া হয়েছিল যে, তারা যেন একনিষ্ঠভাবে আল্লাহর ইবাদত করে এবং তাঁর প্রতি একাগ্র থাকে। (সূরা আল-বাইয়্যিনাহ, আয়াত: ৫)</p><div class=\"h hs hs2\">৩। তাওহীদুল আসমা ওয়াস সিফাত (تَوْحِيدُ الْأَسْمَاءِ وَالصِّفَاتِ)</div><p>আল্লাহ তায়ালার সুন্দর নামসমূহ ও পূর্ণাঙ্গ গুণাবলির ক্ষেত্রে তাঁকে এক ও অদ্বিতীয় হিসেবে বিশ্বাস করাকে তাওহীদুল আসমা ওয়াস সিফাত বলে। আল্লাহর নাম ও গুণাবলি তাঁর মর্যাদার উপযোগী। তিনি সর্বজ্ঞ, সর্বশক্তিমান, সর্বশ্রোতা, সর্বদ্রষ্টা ও পরম দয়ালু। কোনো সৃষ্টির জ্ঞান, ক্ষমতা বা গুণাবলির সঙ্গে আল্লাহর গুণাবলির তুলনা করা যায় না। তাঁর নাম ও গুণাবলির ক্ষেত্রে কোনো বিকৃতি, অস্বীকার কিংবা সৃষ্টির সঙ্গে সাদৃশ্য স্থাপন করা উচিত নয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ</div></div><p>অর্থ: তাঁর মতো কিছুই নেই। তিনি সর্বশ্রোতা, সর্বদ্রষ্টা। (সূরা আশ-শূরা, আয়াত: ১১)</p><div class=\"h hm\">মানবজীবনে তাওহীদের গুরুত্ব ও তাৎপর্য</div><div class=\"h hs hs2\">১। ঈমান ও ইসলামের মূল ভিত্তি</div><p>তাওহীদ হলো ইসলামের মূল ভিত্তি এবং ঈমানের প্রধান শর্ত। আল্লাহর একত্বে বিশ্বাস ছাড়া কোনো ব্যক্তি প্রকৃত মুমিন হতে পারে না। ইসলামের যাবতীয় ইবাদত, আমল ও নৈতিক শিক্ষার ভিত্তি হলো বিশুদ্ধ তাওহীদ। যুগে যুগে প্রেরিত সকল নবী-রাসুল মানুষকে এক আল্লাহর ইবাদত করার আহ্বান জানিয়েছেন। তাই তাওহীদ ছাড়া ইসলামী জীবনব্যবস্থার পূর্ণাঙ্গ বাস্তবায়ন সম্ভব নয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ</div></div><p>অর্থ: নিশ্চয়ই আমি প্রত্যেক জাতির মধ্যে রাসুল পাঠিয়েছি এই নির্দেশ দিয়ে যে, তোমরা আল্লাহর ইবাদত করো এবং তাগুতকে বর্জন করো। (সূরা আন-নাহল, আয়াত: ৩৬)</p><div class=\"h hs hs2\">২। শিরক ও কুসংস্কার থেকে মুক্তি</div><p>তাওহীদ মানুষকে শিরক, কুফর, অন্ধবিশ্বাস ও কুসংস্কার থেকে মুক্ত রাখে। তাওহীদে বিশ্বাসী ব্যক্তি আল্লাহ ছাড়া অন্য কাউকে উপাস্য মনে করে না এবং কোনো সৃষ্টির মধ্যে আল্লাহর সমতুল্য ক্ষমতা রয়েছে বলে বিশ্বাস করে না। এর ফলে মানুষের চিন্তাচেতনা বিশুদ্ধ হয় এবং সে মিথ্যা উপাসনা ও ভিত্তিহীন বিশ্বাস থেকে নিজেকে রক্ষা করতে পারে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ</div></div><p>অর্থ: নিশ্চয়ই শিরক মহা অন্যায়। (সূরা লুকমান, আয়াত: ১৩)</p><div class=\"h hs hs2\">৩। আল্লাহর প্রতি পূর্ণ আনুগত্য প্রতিষ্ঠা</div><p>তাওহীদের বিশ্বাস মানুষের অন্তরে আল্লাহর প্রতি গভীর আনুগত্য ও আত্মসমর্পণের মনোভাব সৃষ্টি করে। মানুষ উপলব্ধি করে যে, তার প্রকৃত মালিক, পালনকর্তা ও বিধানদাতা একমাত্র আল্লাহ। ফলে সে ব্যক্তিগত, পারিবারিক ও সামাজিক জীবনের প্রতিটি ক্ষেত্রে আল্লাহর আদেশ-নিষেধ মেনে চলতে সচেষ্ট হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ</div></div><p>অর্থ: বলুন, নিশ্চয়ই আমার সালাত, আমার কুরবানি, আমার জীবন ও আমার মৃত্যু সবই বিশ্বজগতের প্রতিপালক আল্লাহর জন্য। (সূরা আল-আনআম, আয়াত: ১৬২)</p><div class=\"h hs hs2\">৪। ইবাদতে একনিষ্ঠতা ও আন্তরিকতা সৃষ্টি</div><p>তাওহীদ মানুষকে যাবতীয় ইবাদত একমাত্র আল্লাহর সন্তুষ্টির উদ্দেশ্যে সম্পাদন করতে শিক্ষা দেয়। এতে লোকদেখানো ইবাদত, আত্মপ্রদর্শন ও মানুষের প্রশংসা অর্জনের প্রবণতা দূর হয়। একজন তাওহীদে বিশ্বাসী ব্যক্তি সালাত, সাওম, যাকাত ও অন্যান্য ইবাদতে আন্তরিকতা বজায় রাখে। ফলে তার আমল বিশুদ্ধ হয় এবং আল্লাহর নৈকট্য অর্জনের সুযোগ সৃষ্টি হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَاعْبُدِ اللَّهَ مُخْلِصًا لَهُ الدِّينَ</div></div><p>অর্থ: অতএব, আপনি একনিষ্ঠভাবে আল্লাহর ইবাদত করুন। (সূরা আয-যুমার, আয়াত: ২)</p><div class=\"h hs hs2\">৫। আত্মিক প্রশান্তি ও মানসিক শক্তি অর্জন</div><p>তাওহীদের বিশ্বাস মানুষের অন্তরে প্রশান্তি, সাহস ও আত্মবিশ্বাস সৃষ্টি করে। জীবনের দুঃখ-কষ্ট, বিপদ-আপদ ও অনিশ্চয়তার সময় সে আল্লাহর ওপর নির্ভর করে। সে বিশ্বাস করে যে, আল্লাহর ইচ্ছা ছাড়া কোনো কিছু সংঘটিত হয় না। এ বিশ্বাস মানুষকে হতাশা থেকে রক্ষা করতে এবং কঠিন পরিস্থিতিতে ধৈর্য ধারণ করতে সাহায্য করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</div></div><p>অর্থ: জেনে রেখো, আল্লাহর স্মরণেই অন্তরসমূহ প্রশান্তি লাভ করে। (সূরা আর-রা'দ, আয়াত: ২৮)</p><div class=\"h hs hs2\">৬। আল্লাহর ওপর নির্ভরশীলতা ও তাওয়াক্কুল সৃষ্টি</div><p>তাওহীদ মানুষকে শিক্ষা দেয় যে, প্রকৃত সাহায্যকারী, রিজিকদাতা ও সকল ক্ষমতার মালিক একমাত্র আল্লাহ। তাই মানুষ নিজের সাধ্য অনুযায়ী চেষ্টা করার পাশাপাশি আল্লাহর ওপর ভরসা করে। এতে মানুষের মধ্যে আত্মবিশ্বাস, ধৈর্য ও কর্মস্পৃহা সৃষ্টি হয়। সে অন্যায়ভাবে কারও ওপর নির্ভরশীল না হয়ে আল্লাহর সাহায্য কামনা করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ</div></div><p>অর্থ: যে ব্যক্তি আল্লাহর ওপর ভরসা করে, আল্লাহই তার জন্য যথেষ্ট। (সূরা আত-তালাক, আয়াত: ৩)</p><div class=\"h hs hs2\">৭। নৈতিক চরিত্র গঠন ও আত্মশুদ্ধি</div><p>তাওহীদের বিশ্বাস মানুষের চরিত্র গঠনে গুরুত্বপূর্ণ ভূমিকা পালন করে। একজন মুমিন বিশ্বাস করে যে, আল্লাহ তার প্রকাশ্য ও গোপন সব কাজ সম্পর্কে অবগত। ফলে সে সত্যবাদিতা, সততা, আমানতদারি, ন্যায়পরায়ণতা ও দায়িত্বশীলতার গুণ অর্জন করতে সচেষ্ট হয়। একই সঙ্গে মিথ্যা, প্রতারণা, অহংকার, হিংসা ও অন্যায় থেকে বিরত থাকার চেষ্টা করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ তোমাদের ওপর সদা পর্যবেক্ষক। (সূরা আন-নিসা, আয়াত: ১)</p><div class=\"h hs hs2\">৮। অন্যায়, জুলুম ও পাপাচার প্রতিরোধ</div><p>তাওহীদ মানুষের মধ্যে আল্লাহভীতি ও পরকালীন জবাবদিহির অনুভূতি সৃষ্টি করে। একজন তাওহীদে বিশ্বাসী ব্যক্তি জানে যে, পৃথিবীর কোনো মানুষ তার অন্যায় কাজ না দেখলেও আল্লাহ সবকিছু দেখেন। এ বিশ্বাস তাকে চুরি, ডাকাতি, দুর্নীতি, ঘুষ, প্রতারণা ও মানুষের অধিকার হরণ থেকে বিরত রাখতে সাহায্য করে। ফলে সমাজে অপরাধপ্রবণতা কমে এবং ন্যায়বিচার প্রতিষ্ঠার পরিবেশ সৃষ্টি হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَهُوَ مَعَكُمْ أَيْنَ مَا كُنْتُمْ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ</div></div><p>অর্থ: তোমরা যেখানেই থাকো, তিনি তোমাদের সঙ্গে আছেন এবং তোমরা যা করো আল্লাহ তা দেখেন। (সূরা আল-হাদিদ, আয়াত: ৪)</p><div class=\"h hs hs2\">৯। মানবিক সাম্য ও ভ্রাতৃত্ব প্রতিষ্ঠা</div><p>তাওহীদ মানুষকে শিক্ষা দেয় যে, সমগ্র মানবজাতির সৃষ্টিকর্তা একমাত্র আল্লাহ। তাই জাতি, বর্ণ, ভাষা, গোত্র কিংবা সম্পদের ভিত্তিতে মানুষের মধ্যে অহংকার ও বৈষম্য করা উচিত নয়। তাওহীদের শিক্ষা মানুষের মধ্যে পারস্পরিক সম্মান, সহযোগিতা, সহমর্মিতা ও ভ্রাতৃত্ববোধ সৃষ্টি করে। এর মাধ্যমে একটি সাম্যভিত্তিক ও শান্তিপূর্ণ সমাজ প্রতিষ্ঠা করা সম্ভব।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে তোমাদের মধ্যে সেই ব্যক্তিই অধিক মর্যাদাসম্পন্ন, যে অধিক তাকওয়াবান। (সূরা আল-হুজুরাত, আয়াত: ১৩)</p><div class=\"h hs hs2\">১০। আত্মমর্যাদা ও সাহসিকতা সৃষ্টি</div><p>তাওহীদ মানুষকে একমাত্র আল্লাহর সামনে মাথা নত করতে শিক্ষা দেয়। ফলে সে অন্যায়ভাবে কোনো ব্যক্তি, শক্তি বা ক্ষমতার কাছে আত্মসমর্পণ করে না। আল্লাহর প্রতি দৃঢ় বিশ্বাস মানুষের মধ্যে আত্মমর্যাদা, সাহসিকতা ও সত্য প্রতিষ্ঠার মনোভাব সৃষ্টি করে। সে অন্যায়ের বিরুদ্ধে অবস্থান গ্রহণ করতে এবং ন্যায় ও সত্যের পক্ষে কথা বলতে উৎসাহিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ</div></div><p>অর্থ: সুতরাং তোমরা মানুষকে ভয় করো না, বরং আমাকেই ভয় করো। (সূরা আল-মায়িদা, আয়াত: ৪৪)</p><div class=\"h hs hs2\">১১। বিপদে ধৈর্য ও সুখে কৃতজ্ঞতা অর্জন</div><p>তাওহীদ মানুষকে জীবনের সুখ-দুঃখ, লাভ-ক্ষতি ও বিপদ-আপদকে আল্লাহর পক্ষ থেকে পরীক্ষা হিসেবে গ্রহণ করতে শিক্ষা দেয়। বিপদে ধৈর্য ধারণ এবং সুখে আল্লাহর শুকরিয়া আদায় করার মানসিকতা সৃষ্টি করে। ফলে মানুষ হতাশা, অহংকার ও অকৃতজ্ঞতা থেকে নিজেকে রক্ষা করতে পারে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَبَشِّرِ الصَّابِرِينَ</div></div><p>অর্থ: আর ধৈর্যশীলদের সুসংবাদ দিন। (সূরা আল-বাকারা, আয়াত: ১৫৫)</p><div class=\"h hs hs2\">১২। পারিবারিক ও সামাজিক শান্তি প্রতিষ্ঠা</div><p>তাওহীদের বিশ্বাস মানুষের মধ্যে দায়িত্ববোধ, ন্যায়পরায়ণতা, সহমর্মিতা ও পারস্পরিক সহযোগিতার মনোভাব সৃষ্টি করে। একজন মুমিন আল্লাহর সন্তুষ্টির জন্য পিতামাতা, সন্তান, আত্মীয়স্বজন ও প্রতিবেশীর অধিকার আদায়ে সচেষ্ট হয়। এর ফলে পারিবারিক কলহ, সামাজিক হিংসা, বিদ্বেষ ও বিশৃঙ্খলা হ্রাস পায়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا</div></div><p>অর্থ: তোমরা আল্লাহর ইবাদত করো, তাঁর সঙ্গে কোনো কিছুকে শরিক করো না এবং পিতামাতার সঙ্গে সদাচরণ করো। (সূরা আন-নিসা, আয়াত: ৩৬)</p><div class=\"h hs hs2\">১৩। জীবনের প্রকৃত উদ্দেশ্য সম্পর্কে সচেতনতা সৃষ্টি</div><p>তাওহীদ মানুষকে তার সৃষ্টির প্রকৃত উদ্দেশ্য সম্পর্কে অবহিত করে। মানুষ বুঝতে পারে যে, তার জীবন কেবল ভোগ-বিলাস, ধনসম্পদ অর্জন কিংবা পার্থিব সফলতার জন্য নয়; বরং আল্লাহর ইবাদত ও আনুগত্যের জন্য। এ বিশ্বাস মানুষকে দায়িত্বশীল, সৎ ও কল্যাণমুখী জীবনযাপনে উৎসাহিত করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ</div></div><p>অর্থ: আমি জিন ও মানুষকে কেবল আমার ইবাদতের জন্যই সৃষ্টি করেছি। (সূরা আয-যারিয়াত, আয়াত: ৫৬)</p><div class=\"h hs hs2\">১৪। দুনিয়া ও আখিরাতের সফলতা অর্জন</div><p>তাওহীদের ওপর প্রতিষ্ঠিত জীবন মানুষকে আল্লাহর সন্তুষ্টি ও পরকালীন মুক্তির পথে পরিচালিত করে। বিশুদ্ধ ঈমান, সৎকর্ম ও আল্লাহর আনুগত্যের মাধ্যমে মানুষ দুনিয়ায় কল্যাণকর জীবনযাপন করতে পারে এবং আখিরাতে জান্নাত লাভের আশা করতে পারে। তাওহীদ মানুষের অন্তরে পরকালীন জবাবদিহির অনুভূতি সৃষ্টি করে এবং তাকে পাপাচার থেকে বিরত রাখে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ مَاتَ وَهُوَ يَعْلَمُ أَنَّهُ لَا إِلَهَ إِلَّا اللَّهُ دَخَلَ الْجَنَّةَ</div></div><p>অর্থ: যে ব্যক্তি এ বিশ্বাস নিয়ে মৃত্যুবরণ করে যে, আল্লাহ ছাড়া কোনো সত্য উপাস্য নেই, সে জান্নাতে প্রবেশ করবে। (সহিহ মুসলিম)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, তাওহীদ ইসলামের মূল ভিত্তি এবং মানবজীবনের সার্বিক কল্যাণের প্রধান উৎস। এটি মানুষের বিশ্বাসকে বিশুদ্ধ করে, শিরক ও কুসংস্কার থেকে মুক্ত রাখে এবং নৈতিক, আধ্যাত্মিক ও সামাজিক জীবনে ইতিবাচক পরিবর্তন আনে। ব্যক্তিজীবনে আত্মশুদ্ধি, পারিবারিক জীবনে শান্তি এবং সমাজজীবনে সাম্য ও ন্যায়বিচার প্রতিষ্ঠার জন্য তাওহীদের শিক্ষা অপরিহার্য। তাই ইহকালীন শান্তি ও পরকালীন মুক্তি লাভের জন্য প্রত্যেক মানুষের জীবনে বিশুদ্ধ তাওহীদের বাস্তব প্রতিফলন ঘটানো অত্যন্ত জরুরি।</p>"], ["আকিদা অর্থ কী? ঈমান, আকিদা ও কালামের মধ্যে পার্থক্য কী? ইসলামী আকিদার মূল উৎসসমূহ এবং গুরুত্ব সংক্ষেপে লেখ।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলামী জীবনব্যবস্থার মূল ভিত্তি হলো বিশুদ্ধ আকিদা। আকিদা মানুষের অন্তরের এমন দৃঢ় বিশ্বাস, যার মাধ্যমে সে মহান আল্লাহ, তাঁর ফেরেশতাগণ, আসমানি কিতাবসমূহ, নবী-রাসূলগণ, আখিরাত এবং তাকদিরের প্রতি বিশ্বাস স্থাপন করে। একজন মুসলমানের ঈমান ও আমলের বিশুদ্ধতা সঠিক আকিদার ওপর নির্ভরশীল। তাই ইসলামে আকিদার গুরুত্ব অপরিসীম। নিম্নে প্রশ্নের আলোকে আকিদার আভিধানিক ও পারিভাষিক অর্থ আলোচনা করা হলো।</p><div class=\"h hm\">১ : تَعْرِيفُ الْعَقِيدَةِ (আকিদার সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>عَقِيدَة শব্দটি আরবি। এটি عَقَدَ يَعْقِدُ عَقْدًا ধাতু থেকে নির্গত। এর মূল ধাতু হলো ع-ق-د। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الرَّبْطُ — বাঁধা বা সংযুক্ত করা।</p><p>২। الْإِحْكَامُ — দৃঢ় করা বা মজবুত করা।</p><p>৩। الْإِبْرَامُ — সুদৃঢ়ভাবে স্থির করা।</p><p>৪। الْجَزْمُ — দৃঢ় সিদ্ধান্ত গ্রহণ করা।</p><div class=\"h hs hs2\">৫। الِاعْتِقَادُ — বিশ্বাস স্থাপন করা।</div><p>ইংরেজি অর্থ: Belief, Faith, Creed, Conviction.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>আকিদার পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p>১. ইমাম আবু হানিফা (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْإِيمَانُ هُوَ الْإِقْرَارُ بِاللِّسَانِ وَالتَّصْدِيقُ بِالْجَنَانِ</div></div><p>অর্থ: মুখে স্বীকার করা এবং অন্তরে বিশ্বাস স্থাপন করাই ঈমানের মূল পরিচয়।</p><p>২. ইমাম ইবনে তাইমিয়্যাহ (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْعَقِيدَةُ هِيَ مَا يَعْقِدُ عَلَيْهِ الْقَلْبُ وَيَطْمَئِنُّ إِلَيْهِ مِنَ الْإِيمَانِ</div></div><p>অর্থ: অন্তর যে বিষয়ের ওপর দৃঢ়ভাবে বিশ্বাস স্থাপন করে এবং যার মাধ্যমে প্রশান্তি লাভ করে, তাই আকিদা।</p><div class=\"h hm\">ঈমান, আকিদা ও কালামের মধ্যে পার্থক্য</div><div class=\"h hs hs2\">১। সংজ্ঞাগত পার্থক্য</div><p>ঈমান (الإيمان) হলো আল্লাহ ও তাঁর রাসুলের মাধ্যমে প্রমাণিত বিষয়সমূহের প্রতি দৃঢ় বিশ্বাস স্থাপন করা। আকিদা (العقيدة) হলো ইসলামের মৌলিক বিশ্বাসসমূহ, যা মানুষের অন্তরে দৃঢ়ভাবে প্রতিষ্ঠিত থাকে। আর ইলমুল কালাম (علم الكلام) হলো এমন একটি শাস্ত্র, যার মাধ্যমে ইসলামী বিশ্বাসসমূহ যুক্তি, প্রমাণ ও বিশ্লেষণের সাহায্যে ব্যাখ্যা ও সমর্থন করা হয়। অর্থাৎ ঈমান হলো বিশ্বাস, আকিদা হলো বিশ্বাসের বিষয়বস্তু এবং কালাম হলো সেই বিশ্বাসের যুক্তিভিত্তিক আলোচনা।</p><div class=\"h hs hs2\">২। বিষয়বস্তুগত পার্থক্য</div><p>ঈমানের প্রধান বিষয় হলো আল্লাহ, ফেরেশতা, আসমানি কিতাব, নবী-রাসুল, আখিরাত ও তাকদিরের প্রতি বিশ্বাস। আকিদার আলোচনায় এসব বিষয়ের পাশাপাশি তাওহীদ, রিসালাত, পুনরুত্থান, জান্নাত-জাহান্নাত এবং অন্যান্য মৌলিক ধর্মীয় বিশ্বাস অন্তর্ভুক্ত। অন্যদিকে ইলমুল কালামে আল্লাহর অস্তিত্ব, গুণাবলি, নবুওয়াত, আখিরাত ও ধর্মীয় বিশ্বাসের যৌক্তিক প্রমাণ নিয়ে আলোচনা করা হয়।</p><div class=\"h hs hs2\">৩। উদ্দেশ্যগত পার্থক্য</div><p>ঈমানের উদ্দেশ্য হলো আল্লাহর প্রতি দৃঢ় বিশ্বাস ও আনুগত্য প্রতিষ্ঠা করা। আকিদার উদ্দেশ্য হলো মানুষের বিশ্বাসকে বিশুদ্ধ ও সুসংহত রাখা এবং শিরক, কুফর ও ভ্রান্ত বিশ্বাস থেকে রক্ষা করা। পক্ষান্তরে ইলমুল কালামের উদ্দেশ্য হলো ইসলামী বিশ্বাসের পক্ষে যুক্তি উপস্থাপন করা, সংশয় দূর করা এবং বিরোধী মতবাদের আপত্তির জবাব দেওয়া।</p><div class=\"h hs hs2\">৪। প্রকৃতিগত পার্থক্য</div><p>ঈমান মূলত অন্তরের বিশ্বাস ও স্বীকৃতির সঙ্গে সম্পর্কিত। আকিদা হলো অন্তরে দৃঢ়ভাবে প্রতিষ্ঠিত বিশ্বাসের সমষ্টি। আর কালাম একটি তাত্ত্বিক ও বিশ্লেষণধর্মী শাস্ত্র। ঈমান ও আকিদা ইসলামী ধর্মবিশ্বাসের মৌলিক অংশ; অন্যদিকে ইলমুল কালাম সেই বিশ্বাসের ব্যাখ্যা ও প্রতিরক্ষার একটি পদ্ধতিগত বিদ্যা।</p><div class=\"h hs hs2\">৫। প্রমাণ ও যুক্তির পার্থক্য</div><p>ঈমান ও আকিদার মূল ভিত্তি হলো আল-কুরআন ও সহিহ সুন্নাহ। ইলমুল কালামেও কুরআন-সুন্নাহর দলিল ব্যবহৃত হয়; তবে এতে যুক্তি, দর্শন ও বুদ্ধিবৃত্তিক বিশ্লেষণের বিশেষ প্রয়োগ দেখা যায়। কালামশাস্ত্রের বিভিন্ন ধারায় যুক্তির ব্যবহার ও ব্যাখ্যাপদ্ধতিতে পার্থক্য রয়েছে।</p><div class=\"h hs hs2\">৬। গুরুত্ব ও প্রয়োজনীয়তার পার্থক্য</div><p>ঈমান ছাড়া একজন ব্যক্তির ইসলামী বিশ্বাস পূর্ণতা লাভ করে না। বিশুদ্ধ আকিদা মানুষকে সঠিক ধর্মীয় বিশ্বাসের ওপর প্রতিষ্ঠিত রাখে। আর ইলমুল কালাম ধর্মীয় বিশ্বাস সম্পর্কে উত্থাপিত প্রশ্ন, সংশয় ও মতবিরোধের যুক্তিসংগত ব্যাখ্যা প্রদানে সহায়তা করে। সুতরাং তিনটি বিষয় পরস্পর সম্পর্কিত হলেও এদের অর্থ, প্রকৃতি ও আলোচনাপদ্ধতি এক নয়।</p><div class=\"h hm\">ইসলামী আকিদার মূল উৎসসমূহ</div><div class=\"h hs hs2\">১। আল-কুরআন</div><p>ইসলামী আকিদার সর্বপ্রথম ও প্রধান উৎস হলো পবিত্র আল-কুরআন। এতে আল্লাহর একত্ববাদ, নবুওয়াত, রিসালাত, ফেরেশতা, আসমানি কিতাব, আখিরাত, তাকদির, জান্নাত ও জাহান্নাম সম্পর্কে সুস্পষ্ট আলোচনা রয়েছে। মুসলমানদের যাবতীয় মৌলিক বিশ্বাস কুরআনের নির্দেশনার ওপর প্রতিষ্ঠিত। তাই বিশুদ্ধ আকিদা অর্জনের জন্য কুরআনের শিক্ষা অনুসরণ করা অপরিহার্য।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ</div></div><p>অর্থ: এটি সেই কিতাব, যাতে কোনো সন্দেহ নেই; এটি মুত্তাকিদের জন্য পথনির্দেশ। (সূরা আল-বাকারা, আয়াত: ২)</p><div class=\"h hs hs2\">২। সহিহ সুন্নাহ ও হাদিস</div><p>ইসলামী আকিদার দ্বিতীয় প্রধান উৎস হলো রাসূলুল্লাহ (সা.)-এর সহিহ সুন্নাহ। কুরআনে বর্ণিত বিশ্বাসের বিষয়গুলো রাসূলুল্লাহ (সা.) তাঁর বাণী, কর্ম ও শিক্ষার মাধ্যমে বিস্তারিত ব্যাখ্যা করেছেন। বিশেষ করে জিবরাইল (আ.)-এর হাদিসে ঈমানের মৌলিক বিষয়গুলো সুস্পষ্টভাবে বর্ণিত হয়েছে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَنْ تُؤْمِنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْآخِرِ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ</div></div><p>অর্থ: ঈমান হলো আল্লাহ, তাঁর ফেরেশতাগণ, কিতাবসমূহ, রাসুলগণ, শেষ দিবস এবং তাকদিরের ভালো-মন্দের প্রতি বিশ্বাস স্থাপন করা। (সহিহ মুসলিম)</p><div class=\"h hs hs2\">৩। সাহাবায়ে কেরামের ইজমা</div><p>ইসলামী আকিদা অনুধাবনের ক্ষেত্রে সাহাবায়ে কেরামের ঐকমত্য অত্যন্ত গুরুত্বপূর্ণ। তাঁরা সরাসরি রাসূলুল্লাহ (সা.)-এর কাছ থেকে ইসলামের শিক্ষা গ্রহণ করেছেন এবং কুরআন-সুন্নাহর প্রকৃত মর্ম উপলব্ধি করেছেন। মৌলিক আকিদার বিষয়ে তাঁদের সর্বসম্মত অবস্থান পরবর্তী মুসলিম সমাজের জন্য গুরুত্বপূর্ণ নির্দেশনা হিসেবে বিবেচিত হয়। তবে ইজমা কুরআন ও সুন্নাহর বিপরীত কোনো নতুন বিশ্বাস প্রতিষ্ঠা করতে পারে না।</p><div class=\"h hs hs2\">৪। সালাফে সালেহিনের ব্যাখ্যা</div><p>সাহাবি, তাবেয়ি ও তাবে-তাবেয়িদের মধ্যে যাঁরা ইসলামের প্রাথমিক যুগে কুরআন ও সুন্নাহ অনুসরণ করেছেন, তাঁদের সালাফে সালেহিন বলা হয়। তাঁদের ব্যাখ্যা ও শিক্ষা ইসলামী আকিদা বোঝার ক্ষেত্রে গুরুত্বপূর্ণ সহায়ক উৎস। বিশেষ করে আল্লাহর নাম ও গুণাবলি, ঈমান, তাকদির এবং আখিরাতের বিষয়গুলো অনুধাবনে তাঁদের বক্তব্য বিশেষ গুরুত্ব বহন করে।</p><div class=\"h hs hs2\">৫। সুস্থ বিবেক ও যুক্তিবুদ্ধি</div><p>ইসলামী আকিদার মৌলিক উৎস কুরআন ও সুন্নাহ হলেও সুস্থ বিবেক ও যুক্তিবুদ্ধি ধর্মীয় বিশ্বাসের সত্যতা উপলব্ধিতে সহায়ক ভূমিকা পালন করে। মানুষ সৃষ্টিজগতের নিদর্শন পর্যবেক্ষণ করে আল্লাহর অস্তিত্ব, ক্ষমতা ও প্রজ্ঞা সম্পর্কে চিন্তা করতে পারে। তবে যুক্তিবুদ্ধি ওহির বিকল্প নয়; বরং ওহির নির্দেশনা অনুধাবনের একটি সহায়ক মাধ্যম।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِأُولِي الْأَلْبَابِ</div></div><p>অর্থ: নিশ্চয়ই আকাশমণ্ডলী ও পৃথিবীর সৃষ্টিতে এবং রাত-দিনের পরিবর্তনে বুদ্ধিমানদের জন্য নিদর্শন রয়েছে। (সূরা আলে ইমরান, আয়াত: ১৯০)</p><div class=\"h hm\">ইসলামী আকিদার গুরুত্ব ও তাৎপর্য</div><div class=\"h hs hs2\">১। ঈমানের ভিত্তি সুদৃঢ়করণ</div><p>ইসলামী আকিদা মানুষের ঈমানকে দৃঢ় ও সুসংহত করে। আল্লাহর একত্ববাদ, নবুওয়াত, আখিরাত ও অন্যান্য মৌলিক বিশ্বাস সম্পর্কে সঠিক জ্ঞান অর্জনের মাধ্যমে মানুষের অন্তরে আল্লাহর প্রতি আস্থা ও আনুগত্য বৃদ্ধি পায়। বিশুদ্ধ আকিদা ছাড়া ইসলামী জীবনব্যবস্থার পূর্ণাঙ্গ অনুসরণ সম্ভব নয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا</div></div><p>অর্থ: প্রকৃত মুমিন তারাই, যারা আল্লাহ ও তাঁর রাসুলের প্রতি ঈমান এনেছে, অতঃপর সন্দেহ পোষণ করেনি। (সূরা আল-হুজুরাত, আয়াত: ১৫)</p><div class=\"h hs hs2\">২। শিরক ও কুফর থেকে মুক্তি</div><p>বিশুদ্ধ ইসলামী আকিদা মানুষকে শিরক, কুফর, নিফাক ও ভ্রান্ত বিশ্বাস থেকে রক্ষা করে। একজন মুমিন যখন আল্লাহর একত্ববাদ ও তাঁর ক্ষমতা সম্পর্কে সঠিক জ্ঞান অর্জন করে, তখন সে অন্য কাউকে আল্লাহর সমকক্ষ মনে করে না। এর ফলে তার বিশ্বাস বিশুদ্ধ থাকে এবং সে আল্লাহর সন্তুষ্টি অর্জনের পথে পরিচালিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ لَا يَغْفِرُ أَنْ يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَنْ يَشَاءُ</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ তাঁর সঙ্গে শরিক করাকে ক্ষমা করেন না; তবে এর নিচের অন্যান্য পাপ যাকে ইচ্ছা ক্ষমা করেন। (সূরা আন-নিসা, আয়াত: ৪৮)</p><div class=\"h hs hs2\">৩। ইবাদতের বিশুদ্ধতা নিশ্চিতকরণ</div><p>ইসলামী আকিদা মানুষকে একমাত্র আল্লাহর সন্তুষ্টির উদ্দেশ্যে ইবাদত করতে শিক্ষা দেয়। সালাত, সাওম, যাকাত, হজ ও অন্যান্য ইবাদতের মূল উদ্দেশ্য হলো আল্লাহর আনুগত্য ও নৈকট্য অর্জন। বিশুদ্ধ আকিদা মানুষের মধ্যে ইখলাস সৃষ্টি করে এবং লোকদেখানো ইবাদত ও শিরক থেকে বিরত রাখে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ</div></div><p>অর্থ: তাদের কেবল এ নির্দেশই দেওয়া হয়েছিল যে, তারা যেন একনিষ্ঠভাবে আল্লাহর ইবাদত করে। (সূরা আল-বাইয়্যিনাহ, আয়াত: ৫)</p><div class=\"h hs hs2\">৪। নৈতিক চরিত্র গঠন</div><p>ইসলামী আকিদা মানুষের মধ্যে সত্যবাদিতা, সততা, আমানতদারি, ন্যায়পরায়ণতা ও দায়িত্বশীলতার গুণ সৃষ্টি করে। একজন মুমিন বিশ্বাস করে যে, আল্লাহ তার প্রকাশ্য ও গোপন সব কাজ সম্পর্কে অবগত। এ বিশ্বাস তাকে অন্যায়, দুর্নীতি, প্রতারণা, মিথ্যা ও জুলুম থেকে বিরত থাকতে সাহায্য করে।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ তোমাদের ওপর সদা পর্যবেক্ষক। (সূরা আন-নিসা, আয়াত: ১)</p><div class=\"h hs hs2\">৫। আল্লাহভীতি ও জবাবদিহির অনুভূতি সৃষ্টি</div><p>ইসলামী আকিদা মানুষকে শিক্ষা দেয় যে, পার্থিব জীবনের প্রতিটি কাজের জন্য তাকে আল্লাহর কাছে জবাবদিহি করতে হবে। মৃত্যুর পর পুনরুত্থান, হিসাব-নিকাশ এবং ভালো-মন্দ কাজের প্রতিদানের প্রতি বিশ্বাস মানুষের মধ্যে দায়িত্ববোধ সৃষ্টি করে। ফলে সে পাপাচার থেকে বিরত থাকে এবং সৎকর্মে উৎসাহিত হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ۝ وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ</div></div><p>অর্থ: কেউ অণু পরিমাণ সৎকর্ম করলে তা দেখতে পাবে এবং কেউ অণু পরিমাণ অসৎকর্ম করলে তাও দেখতে পাবে। (সূরা আয-যিলযাল, আয়াত: ৭–৮)</p><div class=\"h hs hs2\">৬। আত্মিক প্রশান্তি ও মানসিক স্থিরতা অর্জন</div><p>বিশুদ্ধ আকিদা মানুষের অন্তরে আল্লাহর প্রতি গভীর আস্থা ও নির্ভরশীলতা সৃষ্টি করে। জীবনের বিপদ-আপদ, দুঃখ-কষ্ট ও অনিশ্চয়তার সময় একজন মুমিন আল্লাহর ওপর ভরসা রাখে। ফলে তার মধ্যে ধৈর্য, সাহস ও মানসিক স্থিরতা সৃষ্টি হয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَلَا بِذِكْرِ اللَّهِ تَط
