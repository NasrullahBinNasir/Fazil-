b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْكُتُبُ الْخَمْسَةُ الَّتِي هِيَ أُصُولُ الْإِسْلَامِ، أَعْنِي صَحِيحَ الْبُخَارِيِّ وَمُسْلِمٍ وَسُنَنَ أَبِي دَاوُدَ وَالتِّرْمِذِيِّ وَالنَّسَائِيِّ.</div></div><p>অর্থ: ইসলামের মূল পাঁচটি হাদিসগ্রন্থ হলো—সহিহ বুখারি, সহিহ মুসলিম, সুনান আবু দাউদ, জামে তিরমিজি ও সুনান নাসায়ি।</p><p class=\"bh\"><b>হাফিজ ইবনে হাজার আসকালানি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْكُتُبُ السِّتَّةُ هِيَ الْبُخَارِيُّ وَمُسْلِمٌ وَأَبُو دَاوُدَ وَالتِّرْمِذِيُّ وَالنَّسَائِيُّ وَابْنُ مَاجَهْ.</div></div><p>অর্থ: ছয়টি হাদিসগ্রন্থ হলো—বুখারি, মুসলিম, আবু দাউদ, তিরমিজি, নাসায়ি ও ইবনে মাজাহ।</p><p class=\"bh\"><b>ইমাম সুয়ূতি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْكُتُبُ السِّتَّةُ هِيَ أَصَحُّ الْكُتُبِ الْمُصَنَّفَةِ فِي الْحَدِيثِ.</div></div><p>অর্থ: ছয়টি হাদিসগ্রন্থ হাদিসশাস্ত্রে সংকলিত গ্রন্থসমূহের মধ্যে প্রসিদ্ধ ও নির্ভরযোগ্য গ্রন্থ।</p><div class=\"h hs hs2\">সারকথা :</div><p>হাদিসশাস্ত্রের প্রসিদ্ধ ছয়টি মূল হাদিসগ্রন্থকে একত্রে সিহাহ সিত্তাহ বলা হয়। এগুলো হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সহিহ বুখারি।</p><p style=\"padding-left:4px\"><b>২।</b> সহিহ মুসলিম।</p><p style=\"padding-left:4px\"><b>৩।</b> সুনান আবু দাউদ।</p><p style=\"padding-left:4px\"><b>৪।</b> জামে তিরমিজি।</p><p style=\"padding-left:4px\"><b>৫।</b> সুনান নাসায়ি।</p><p style=\"padding-left:4px\"><b>৬।</b> সুনান ইবনে মাজাহ।</p><div class=\"h hm\">ইমাম আবু ঈসা তিরমিযী (রহ.)-এর জীবনী</div><div class=\"h hs\">নাম ও বংশপরিচয় :</div><p>ইমাম তিরমিযী (রহ.)-এর পূর্ণ নাম আবু ঈসা মুহাম্মদ ইবনে ঈসা ইবনে সাওরা আত-তিরমিযী। তিনি হাদিসশাস্ত্রের একজন প্রখ্যাত ইমাম, বিশিষ্ট মুহাদ্দিস ও ইসলামী জ্ঞানজগতের অন্যতম শ্রেষ্ঠ ব্যক্তিত্ব।</p><div class=\"h hs\">জন্ম ও শৈশব :</div><p>তিনি ২০৯ হিজরি মোতাবেক ৮২৪ খ্রিষ্টাব্দে খোরাসানের তিরমিয অঞ্চলে জন্মগ্রহণ করেন। শৈশব থেকেই তিনি অত্যন্ত মেধাবী, জ্ঞানপিপাসু ও অধ্যবসায়ী ছিলেন। অল্প বয়সেই তিনি হাদিসশাস্ত্র অধ্যয়নে আত্মনিয়োগ করেন।</p><div class=\"h hs\">শিক্ষাজীবন ও জ্ঞানার্জন :</div><p>হাদিস শিক্ষার উদ্দেশ্যে তিনি খোরাসান, ইরাক, হিজাজসহ বিভিন্ন অঞ্চলে সফর করেন। তিনি তৎকালীন বিখ্যাত মুহাদ্দিসদের কাছ থেকে হাদিস শিক্ষা লাভ করেন। তাঁর উল্লেখযোগ্য শিক্ষকদের মধ্যে ইমাম বুখারি (রহ.), ইমাম মুসলিম (রহ.) ও ইমাম আবু দাউদ (রহ.) অন্যতম। বিশেষ করে ইমাম বুখারি (রহ.)-এর সাহচর্যে তিনি হাদিসশাস্ত্রের গভীর জ্ঞান অর্জন করেন।</p><div class=\"h hs\">ইমাম বুখারি (রহ.)-এর সঙ্গে সম্পর্ক :</div><p>ইমাম তিরমিযী (রহ.) ইমাম বুখারি (রহ.)-এর অন্যতম বিশিষ্ট ছাত্র ছিলেন। তিনি হাদিসের ইলাল, রাবিদের অবস্থা এবং হাদিসের বিশুদ্ধতা নির্ণয়ের ক্ষেত্রে তাঁর কাছ থেকে বিশেষ জ্ঞান অর্জন করেন। ইমাম বুখারি (রহ.) তাঁর জ্ঞান ও মেধার প্রশংসা করেছিলেন।</p><div class=\"h hs\">রচনাবলি :</div><p>ইমাম তিরমিযী (রহ.) হাদিসশাস্ত্রে অসংখ্য মূল্যবান গ্রন্থ রচনা করেন। তাঁর উল্লেখযোগ্য গ্রন্থগুলো হলো—</p><p style=\"padding-left:4px\"><b>১।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الجامع</span> (জামে আত-তিরমিযী)।</p><p style=\"padding-left:4px\"><b>২।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الشمائل المحمدية</span> (আশ-শামায়িলুল মুহাম্মাদিয়্যাহ)।</p><p style=\"padding-left:4px\"><b>৩।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">العلل الكبير</span> (আল-ইলালুল কাবির)।</p><p style=\"padding-left:4px\"><b>৪।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">العلل الصغير</span> (আল-ইলালুস সুগরা)।</p><div class=\"h hs\">চারিত্রিক বৈশিষ্ট্য :</div><p>ইমাম তিরমিযী (রহ.) অত্যন্ত পরহেজগার, বিনয়ী, ধৈর্যশীল ও আল্লাহভীরু ব্যক্তি ছিলেন। তিনি হাদিস সংরক্ষণ ও প্রচারে অসাধারণ নিষ্ঠার পরিচয় দেন। তাঁর স্মৃতিশক্তি ও হাদিসের সনদ-মতন সম্পর্কে গভীর জ্ঞান ছিল। জীবনের শেষদিকে তিনি দৃষ্টিশক্তি হারিয়ে অন্ধ হয়ে যান।</p><div class=\"h hs\">ইন্তেকাল :</div><p>ইমাম তিরমিযী (রহ.) ২৭৯ হিজরি মোতাবেক ৮৯২ খ্রিষ্টাব্দে নিজ জন্মভূমি তিরমিযে ইন্তেকাল করেন। হাদিসশাস্ত্রে তাঁর অসামান্য অবদান, বিশেষত জামে আত-তিরমিযী গ্রন্থের জন্য তিনি মুসলিম বিশ্বে চিরস্মরণীয় হয়ে আছেন।</p><div class=\"h hm\">জামে আত-তিরমিযীর বৈশিষ্ট্যাবলি</div><p>ইমাম আবু ঈসা তিরমিযী (রহ.) রচিত ‘জামে আত-তিরমিযী’ হাদিসশাস্ত্রের অন্যতম গুরুত্বপূর্ণ ও প্রসিদ্ধ গ্রন্থ। এটি সিহাহ সিত্তাহর অন্তর্ভুক্ত। এ গ্রন্থে হাদিস সংকলনের পাশাপাশি হাদিসের মান, রাবিদের অবস্থা, ফকিহদের মতামত এবং বিভিন্ন মাসআলার দলিল তুলে ধরা হয়েছে। নিম্নে এ গ্রন্থের উল্লেখযোগ্য বৈশিষ্ট্যগুলো আলোচনা করা হলো।</p><div class=\"h hs\">১. সিহাহ সিত্তাহর অন্তর্ভুক্ত :</div><p>জামে আত-তিরমিযী সিহাহ সিত্তাহর অন্যতম গুরুত্বপূর্ণ হাদিসগ্রন্থ। মুসলিম উম্মাহর কাছে এ গ্রন্থ বিশেষ গ্রহণযোগ্যতা ও মর্যাদা লাভ করেছে। হাদিসশাস্ত্রের শিক্ষার্থী ও গবেষকদের কাছে এটি একটি গুরুত্বপূর্ণ নির্ভরযোগ্য গ্রন্থ।</p><div class=\"h hs\">২. হাদিসের মান নির্ণয় :</div><p>এ গ্রন্থের অন্যতম প্রধান বৈশিষ্ট্য হলো, ইমাম তিরমিযী (রহ.) অধিকাংশ হাদিসের মান সম্পর্কে আলোচনা করেছেন। তিনি হাদিসকে সহিহ, হাসান, গরিব ইত্যাদি পরিভাষায় শ্রেণিবদ্ধ করেছেন। ফলে পাঠক সহজেই হাদিসের গ্রহণযোগ্যতা সম্পর্কে ধারণা লাভ করতে পারেন।</p><div class=\"h hs\">৩. হাসান হাদিসের পরিভাষার ব্যবহার :</div><p>ইমাম তিরমিযী (রহ.) হাদিসশাস্ত্রে ‘হাসান’ পরিভাষাটির ব্যবহার ও প্রচারে বিশেষ অবদান রাখেন। তিনি তাঁর গ্রন্থে হাসান হাদিসের বিভিন্ন স্তর ও বৈশিষ্ট্য তুলে ধরেছেন। এ কারণে হাদিসশাস্ত্রে তাঁর বিশেষ মর্যাদা রয়েছে।</p><div class=\"h hs\">৪. ফিকহি মাসআলার আলোচনা :</div><p>জামে আত-তিরমিযীর অন্যতম বৈশিষ্ট্য হলো, এতে হাদিসের আলোকে বিভিন্ন ফিকহি মাসআলা আলোচনা করা হয়েছে। ইমাম তিরমিযী (রহ.) কোনো কোনো ক্ষেত্রে সাহাবি, তাবেয়ি ও পরবর্তী ফকিহদের মতামত উল্লেখ করেছেন। ফলে হাদিসের সঙ্গে ইসলামী আইনশাস্ত্রের সম্পর্ক বুঝতে সুবিধা হয়।</p><div class=\"h hs\">৫. সাহাবি ও ফকিহদের মতামত উল্লেখ :</div><p>এ গ্রন্থে ইমাম তিরমিযী (রহ.) বিভিন্ন মাসআলায় সাহাবায়ে কেরাম, তাবেয়ি এবং প্রসিদ্ধ ফকিহদের মতামত উল্লেখ করেছেন। বিশেষ করে ইমাম মালিক, ইমাম শাফেয়ি, ইমাম আহমদ ও ইসহাক ইবনে রাহাওয়াইহ (রহ.)-এর মতামত তুলে ধরেছেন।</p><div class=\"h hs\">৬. হাদিসের দুর্বলতা ও ত্রুটি বর্ণনা :</div><p>ইমাম তিরমিযী (রহ.) শুধু হাদিস সংকলনেই সীমাবদ্ধ থাকেননি; বরং কোনো কোনো হাদিসের সনদে দুর্বলতা, বর্ণনাকারীর সমস্যা এবং হাদিসের ইল্লত বা সূক্ষ্ম ত্রুটি থাকলে তা ব্যাখ্যা করেছেন। এটি তাঁর গভীর হাদিসবিশ্লেষণী জ্ঞানের পরিচয় বহন করে।</p><div class=\"h hs\">৭. অধ্যায়ভিত্তিক বিন্যাস :</div><p>গ্রন্থটি বিভিন্ন অধ্যায় ও পরিচ্ছেদে সুন্দরভাবে বিন্যস্ত। পবিত্রতা, সালাত, যাকাত, সাওম, হজ, বিবাহ, ক্রয়-বিক্রয়, বিচারব্যবস্থা, আখলাক ও তাফসিরসহ ইসলামের বিভিন্ন বিষয়ের হাদিস এতে সংকলিত হয়েছে। ফলে প্রয়োজনীয় হাদিস খুঁজে পাওয়া সহজ হয়।</p><div class=\"h hs\">৮. হাদিসের পরিপূরক আলোচনা :</div><p>ইমাম তিরমিযী (রহ.) অনেক হাদিস উল্লেখ করার পর সংশ্লিষ্ট বিষয়ে অন্যান্য সাহাবির বর্ণিত হাদিসের কথাও উল্লেখ করেছেন। এর ফলে একই বিষয়ে বিভিন্ন সূত্রে বর্ণিত হাদিস সম্পর্কে ধারণা পাওয়া যায় এবং হাদিসের পারস্পরিক সম্পর্ক বোঝা সহজ হয়।</p><div class=\"h hs\">৯. রাবিদের পরিচয় ও অবস্থা আলোচনা :</div><p>এ গ্রন্থে বিভিন্ন হাদিসের বর্ণনাকারীদের পরিচয়, তাঁদের গ্রহণযোগ্যতা এবং তাঁদের বর্ণনার মান সম্পর্কে আলোচনা করা হয়েছে। কোনো কোনো ক্ষেত্রে রাবিদের ব্যাপারে মুহাদ্দিসদের মূল্যায়নও তুলে ধরা হয়েছে।</p><div class=\"h hs\">১০. আমলযোগ্য হাদিসের প্রতি গুরুত্ব :</div><p>ইমাম তিরমিযী (রহ.) হাদিস সংকলনের পাশাপাশি সংশ্লিষ্ট হাদিসের ওপর সাহাবি, তাবেয়ি ও ফকিহদের আমলের বিষয়টিও তুলে ধরেছেন। কোনো হাদিসের ভিত্তিতে কোন কোন আলেম আমল করেছেন, তা তিনি উল্লেখ করেছেন। ফলে হাদিসের ব্যবহারিক ও ফিকহি গুরুত্ব স্পষ্ট হয়।</p><div class=\"h hs\">১১. অন্যান্য মতামত ও ইজতিহাদের আলোচনা :</div><p>গ্রন্থটিতে বিভিন্ন ফিকহি মতপার্থক্য ও ইজতিহাদভিত্তিক আলোচনা স্থান পেয়েছে। ইমাম তিরমিযী (রহ.) কোনো কোনো বিষয়ে বিভিন্ন আলেমের মতামত উল্লেখ করে পাঠককে তুলনামূলকভাবে বিষয়টি বোঝার সুযোগ দিয়েছেন।</p><div class=\"h hs\">১২. গ্রন্থটির সহজবোধ্যতা ও গবেষণামূলক গুরুত্ব :</div><p>জামে আত-তিরমিযীর ভাষা ও বিন্যাস তুলনামূলকভাবে সহজবোধ্য। এতে হাদিসের মান, সনদ, ফিকহি বিধান ও আলেমদের মতামত একসঙ্গে পাওয়া যায়। তাই এটি শুধু হাদিস পাঠের গ্রন্থ নয়; বরং হাদিস গবেষণা ও ইসলামী আইনশাস্ত্র অধ্যয়নেরও গুরুত্বপূর্ণ সহায়ক গ্রন্থ।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, জামে আত-তিরমিযী হাদিসশাস্ত্রের এক অনন্য ও মূল্যবান সংকলন। এতে হাদিস সংকলনের পাশাপাশি হাদিসের বিশুদ্ধতা নির্ণয়, রাবিদের অবস্থা, ফিকহি মাসআলা এবং বিভিন্ন ইমামের মতামত অত্যন্ত সুন্দরভাবে উপস্থাপন করা হয়েছে। এসব বৈশিষ্ট্যের কারণে গ্রন্থটি যুগ যুগ ধরে মুহাদ্দিস, ফকিহ ও জ্ঞানপিপাসুদের কাছে বিশেষ মর্যাদা লাভ করে আসছে। ইসলামী জ্ঞানভান্ডারে এ গ্রন্থের গুরুত্ব অপরিসীম।</p>"], ["বাংলাদেশের আর্থ-সামাজিক সমস্যা সমাধানে নববী হাদিসের অবদান বর্ণনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>বাংলাদেশ একটি জনবহুল ও উন্নয়নশীল দেশ। এ দেশের অন্যতম প্রধান সমস্যা হলো দারিদ্র্য, বেকারত্ব, নিরক্ষরতা, দুর্নীতি, অপরাধ, মাদকাসক্তি ও নারী নির্যাতন। এসব সমস্যা দেশের অর্থনৈতিক ও সামাজিক উন্নয়নে বাধা সৃষ্টি করছে। ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। পবিত্র কুরআন ও হাদীসে এসব সমস্যা সমাধানের সুন্দর দিকনির্দেশনা রয়েছে। তাই হাদীসের শিক্ষা বাস্তবায়নের মাধ্যমে বাংলাদেশের আর্থসামাজিক সমস্যাগুলো অনেকাংশে সমাধান করা সম্ভব।</p><div class=\"h hm\">সামাজিক সমস্যার পরিচিতি</div><p>সামাজিক সমস্যা বলতে সমাজের এমন ক্ষতিকর ও অনাকাঙ্ক্ষিত অবস্থাকে বোঝায়, যা মানুষের স্বাভাবিক জীবনযাত্রা ব্যাহত করে এবং সমাজের শান্তি ও উন্নয়নে বাধা সৃষ্টি করে।</p><p>সমাজবিজ্ঞানী লেসলি কে. ফ্র্যাঙ্কের মতে—</p><p>Any difficulty or misbehavior of a fairly large number of persons which we wish to remove or correct.</p><p>অর্থাৎ, সমাজের উল্লেখযোগ্যসংখ্যক মানুষের এমন কোনো সমস্যা বা অসদাচরণ, যা আমরা দূর করতে বা সংশোধন করতে চাই।</p><div class=\"h hm\">বাংলাদেশের মৌলিক আর্থসামাজিক সমস্যাবলি</div><p>বাংলাদেশের প্রধান আর্থসামাজিক সমস্যাগুলো হলো—</p><p style=\"padding-left:4px\"><b>১।</b> দারিদ্র্য।</p><p style=\"padding-left:4px\"><b>২।</b> বেকারত্ব।</p><p style=\"padding-left:4px\"><b>৩।</b> নিরক্ষরতা।</p><p style=\"padding-left:4px\"><b>৪।</b> অপরাধপ্রবণতা।</p><p style=\"padding-left:4px\"><b>৫।</b> দুর্নীতি।</p><p style=\"padding-left:4px\"><b>৬।</b> মাদকাসক্তি।</p><p style=\"padding-left:4px\"><b>৭।</b> নারী নির্যাতন।</p><p style=\"padding-left:4px\"><b>৮।</b> বিবাহবিচ্ছেদ।</p><p style=\"padding-left:4px\"><b>৯।</b> শ্রমিক-মালিক বিশৃঙ্খলা।</p><p style=\"padding-left:4px\"><b>১০।</b> ভিক্ষাবৃত্তি।</p><div class=\"h hm\">আর্থসামাজিক সমস্যা সমাধানে হাদীসের অবদান</div><div class=\"h hs\">১। দারিদ্র্য দূরীকরণ:</div><p>দারিদ্র্য বাংলাদেশের অন্যতম প্রধান সমস্যা। এ সমস্যা দূর করতে ইসলাম যাকাত, সদকা ও দানের ওপর বিশেষ গুরুত্ব দিয়েছে। ধনীদের সম্পদে গরিব ও অসহায় মানুষের অধিকার রয়েছে। তাই সঠিকভাবে যাকাত আদায় ও বণ্টন, অসহায়দের সাহায্য এবং কর্মসংস্থানের ব্যবস্থা করলে দারিদ্র্য অনেকাংশে দূর করা সম্ভব। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ</div></div><p>অর্থ: নিশ্চয়ই সদকা (যাকাত) হলো দরিদ্র ও অসহায়দের জন্য। (সূরা আত-তাওবা: ৬০)</p><div class=\"h hs\">২। বেকারত্ব দূরীকরণ:</div><p>বেকারত্ব দেশের অর্থনৈতিক উন্নয়নের অন্যতম বাধা। ইসলাম অলসতা ও কর্মবিমুখতাকে নিরুৎসাহিত করে এবং হালাল উপার্জনকে উৎসাহিত করে। মহানবী (স.) শ্রমের মর্যাদা প্রতিষ্ঠা করেছেন। তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ</div></div><p>অর্থ: নিজের হাতের উপার্জিত খাবারের চেয়ে উত্তম খাবার কেউ কখনো খায়নি। (সহিহ বুখারি)</p><p>তাই কারিগরি শিক্ষা, কর্মসংস্থান সৃষ্টি, আত্মকর্মসংস্থান ও হালাল ব্যবসা-বাণিজ্যের প্রসারের মাধ্যমে বেকারত্ব দূর করা সম্ভব।</p><div class=\"h hs\">৩। নিরক্ষরতা দূরীকরণ:</div><p>নিরক্ষরতা ও অজ্ঞতা একটি দেশের উন্নয়নের প্রধান বাধা। ইসলাম জ্ঞানার্জনের ওপর অত্যন্ত গুরুত্ব দিয়েছে। মহানবী (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ</div></div><p>অর্থ: জ্ঞান অর্জন করা প্রত্যেক মুসলমানের ওপর ফরজ। (সুনানে ইবনে মাজাহ)</p><p>তাই নারী-পুরুষ সবার জন্য শিক্ষার সুযোগ নিশ্চিত করতে হবে। ধর্মীয় ও আধুনিক শিক্ষার প্রসার, শিক্ষাপ্রতিষ্ঠান প্রতিষ্ঠা এবং গণশিক্ষা কার্যক্রমের মাধ্যমে নিরক্ষরতা দূর করা সম্ভব।</p><div class=\"h hs\">৪। অপরাধপ্রবণতা দূরীকরণ:</div><p>চুরি, ডাকাতি, ছিনতাই, হত্যা ও প্রতারণা সমাজের শান্তি নষ্ট করে। ইসলাম এসব অপরাধ থেকে মানুষকে বিরত থাকার নির্দেশ দিয়েছে। হাদীসের শিক্ষা অনুসরণ, নৈতিক চরিত্র গঠন এবং ন্যায়বিচার প্রতিষ্ঠার মাধ্যমে অপরাধপ্রবণতা কমানো সম্ভব। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ غَشَّنَا فَلَيْسَ مِنَّا</div></div><p>অর্থ: যে আমাদের সঙ্গে প্রতারণা করে, সে আমাদের অন্তর্ভুক্ত নয়। (সহিহ মুসলিম)</p><div class=\"h hs\">৫। দুর্নীতি প্রতিরোধ:</div><p>দুর্নীতি দেশের অর্থনৈতিক ও সামাজিক উন্নয়নের অন্যতম বাধা। ঘুষ, প্রতারণা, অর্থ আত্মসাৎ ও ক্ষমতার অপব্যবহার দুর্নীতির অন্তর্ভুক্ত। ইসলাম এসব কাজ নিষিদ্ধ করেছে। হাদীসের শিক্ষা অনুযায়ী সততা, আমানতদারি ও ন্যায়পরায়ণতা প্রতিষ্ঠা করতে হবে। সরকারি-বেসরকারি সব ক্ষেত্রে স্বচ্ছতা ও জবাবদিহিতা নিশ্চিত করলে দুর্নীতি অনেকাংশে কমানো সম্ভব।</p><div class=\"h hs\">৬। মাদকাসক্তি দূরীকরণ:</div><p>মাদকাসক্তি মানুষের শরীর, মন, পরিবার ও সমাজকে ধ্বংস করে। ইসলাম সব ধরনের নেশাদ্রব্য হারাম ঘোষণা করেছে। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كُلُّ مُسْكِرٍ حَرَامٌ</div></div><p>অর্থ: প্রত্যেক নেশাদ্রব্য হারাম। (সহিহ মুসলিম)</p><p>তাই মাদকদ্রব্য গ্রহণ, বিক্রি ও প্রচার থেকে বিরত থাকতে হবে। পাশাপাশি ধর্মীয় শিক্ষা, পারিবারিক সচেতনতা ও সামাজিক আন্দোলনের মাধ্যমে মাদকাসক্তি দূর করা সম্ভব।</p><div class=\"h hs\">৭। নারী নির্যাতন প্রতিরোধ:</div><p>নারী নির্যাতন একটি গুরুতর সামাজিক সমস্যা। ইসলাম নারীকে যথাযথ সম্মান ও অধিকার দিয়েছে। মহানবী (স.) নারীদের সঙ্গে উত্তম আচরণ করার নির্দেশ দিয়েছেন। তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اسْتَوْصُوا بِالنِّسَاءِ خَيْرًا</div></div><p>অর্থ: তোমরা নারীদের সঙ্গে উত্তম আচরণ করো। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>তাই নারীর অধিকার নিশ্চিত করা, যৌতুকপ্রথা বন্ধ করা, নারীশিক্ষার প্রসার এবং নারীর প্রতি সম্মান প্রদর্শনের মাধ্যমে নারী নির্যাতন প্রতিরোধ করা সম্ভব।</p><div class=\"h hs\">৮। বিবাহবিচ্ছেদ রোধ:</div><p>পারিবারিক কলহ, অবিশ্বাস, অসচেতনতা ও পরস্পরের প্রতি শ্রদ্ধার অভাবে বিবাহবিচ্ছেদ ঘটে। ইসলাম স্বামী-স্ত্রী উভয়কে পরস্পরের অধিকার আদায় ও ভালো আচরণের নির্দেশ দিয়েছে। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ</div></div><p>অর্থ: তোমাদের মধ্যে সেই ব্যক্তি উত্তম, যে তার পরিবারের কাছে উত্তম। (জামে তিরমিজি)</p><p>তাই স্বামী-স্ত্রীর পারস্পরিক ভালোবাসা, সহনশীলতা, ক্ষমাশীলতা ও দায়িত্ববোধের মাধ্যমে পারিবারিক কলহ ও বিবাহবিচ্ছেদ কমানো সম্ভব।</p><div class=\"h hs\">৯। শ্রমিক-মালিক বিশৃঙ্খলা দূরীকরণ:</div><p>শ্রমিক ও মালিকের মধ্যে পারস্পরিক দ্বন্দ্ব দেশের শিল্প ও অর্থনীতির ক্ষতি করে। ইসলাম শ্রমিকের ন্যায্য অধিকার ও উপযুক্ত মজুরি প্রদানের নির্দেশ দিয়েছে। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَعْطُوا الْأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ</div></div><p>অর্থ: শ্রমিকের ঘাম শুকানোর আগেই তার পারিশ্রমিক দিয়ে দাও। (সুনানে ইবনে মাজাহ)</p><p>তাই শ্রমিকের ন্যায্য মজুরি প্রদান, মালিকের প্রতি শ্রমিকের দায়িত্ব পালন এবং উভয়ের মধ্যে সহযোগিতা ও সৌহার্দ্যপূর্ণ সম্পর্ক প্রতিষ্ঠার মাধ্যমে এ সমস্যা সমাধান করা সম্ভব।</p><div class=\"h hs\">১০। ভিক্ষাবৃত্তি দূরীকরণ:</div><p>ভিক্ষাবৃত্তি সমাজের একটি অনাকাঙ্ক্ষিত সমস্যা। ইসলাম মানুষকে পরিশ্রম করে হালাল উপার্জনের শিক্ষা দিয়েছে। মহানবী (স.) আত্মনির্ভরশীলতা ও কর্মসংস্থানের প্রতি উৎসাহ দিয়েছেন। তাই অসহায় মানুষের পুনর্বাসন, কর্মসংস্থান সৃষ্টি, কারিগরি প্রশিক্ষণ এবং যাকাত-সদকার সঠিক ব্যবস্থাপনার মাধ্যমে ভিক্ষাবৃত্তি কমানো সম্ভব।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, বাংলাদেশের আর্থসামাজিক সমস্যাগুলো সমাধানে আল-হাদীসের ভূমিকা অত্যন্ত গুরুত্বপূর্ণ। হাদীস মানুষকে সততা, ন্যায়পরায়ণতা, পরিশ্রম, মানবিকতা ও পারস্পরিক সহযোগিতার শিক্ষা দেয়। ব্যক্তি, পরিবার ও রাষ্ট্রের সর্বস্তরে হাদীসের শিক্ষা বাস্তবায়ন করা গেলে একটি সুন্দর, শান্তিপূর্ণ ও আদর্শ সমাজ গঠন করা সম্ভব। তাই মানবজীবনের সার্বিক কল্যাণের জন্য হাদীসের নির্দেশনা অনুসরণ করা অপরিহার্য।</p>"], ["বাংলাদেশের উলুমুল হাদিসের উৎপত্তি ও ক্রমবিকাশ সম্পর্কে বিস্তারিত আলোচনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইতিহাস থেকে জানা যায়, বাংলায় মুসলিম শাসন প্রতিষ্ঠার অনেক আগে থেকেই আরব, ইরাক, ইরান ও খোরাসান থেকে আগত পীর-আউলিয়া ও ইসলাম প্রচারকদের মাধ্যমে ইসলামের শিক্ষা প্রচারিত হতে থাকে। তাঁদের মাধ্যমে এ অঞ্চলে কুরআন ও হাদীসের চর্চা শুরু হয়। পরবর্তীতে বিভিন্ন আলেম, মুহাদ্দিস ও ইসলাম প্রচারকের প্রচেষ্টায় বাংলাদেশে হাদীসশাস্ত্রের ব্যাপক প্রসার ঘটে। বিশেষ করে মাদরাসা প্রতিষ্ঠা, হাদীস শিক্ষা, গ্রন্থ রচনা ও হাদীসের প্রচারের মাধ্যমে এ দেশে উলূমুল হাদীসের সমৃদ্ধ ধারার বিকাশ ঘটে।</p><div class=\"h hm\">বাংলাদেশে উলূমুল হাদীসের উৎপত্তি ও ক্রমবিকাশ</div><p>বাংলাদেশে উলূমুল হাদীসের উৎপত্তি ও ক্রমবিকাশে মধ্যযুগীয় ও ভারতীয় উপমহাদেশের কয়েকজন বিশিষ্ট পীর-আউলিয়া ও মুহাদ্দিসের অবদান বিশেষভাবে উল্লেখযোগ্য। তাঁদের অবদান নিম্নে তুলে ধরা হলো—</p><div class=\"h hs\">১। আলাউদ্দীন হোসাইন শাহ:</div><p>আলাউদ্দীন হোসাইন শাহ ৯০০ হিজরি থেকে ৯২৪ হিজরি পর্যন্ত বাংলায় রাজত্ব করেন। তাঁর শাসনামলে কুরআন ও হাদীস শিক্ষার ব্যাপক প্রচলন ঘটে। তিনি ইসলামি জ্ঞান-বিজ্ঞানে পারদর্শী ব্যক্তিদের রাজ্যে আসার আমন্ত্রণ জানান। ৯০৭ হিজরিতে গৌড়ের একটি স্থানে তিনি মাদরাসা প্রতিষ্ঠা করেন। এ ছাড়া পাণ্ডুয়ায় একটি কলেজ প্রতিষ্ঠা করেন। এসব শিক্ষাপ্রতিষ্ঠানে ইসলামী শিক্ষার পাশাপাশি হাদীস শিক্ষাও প্রদান করা হতো।</p><div class=\"h hs\">২। মুহাদ্দিস শরফুদ্দীন আবু তাওয়ামা:</div><p>মুহাদ্দিস শরফুদ্দীন আবু তাওয়ামা হিজরি সপ্তম শতকে ঢাকা জেলার সোনারগাঁওয়ে আগমন করেন। তিনি সেখানে ইসলামী শিক্ষার ব্যাপক প্রসার ঘটান এবং হাদীস শিক্ষার ব্যবস্থা করেন। তাঁর প্রচেষ্টায় সোনারগাঁও হাদীস শিক্ষার অন্যতম কেন্দ্রে পরিণত হয়। তাঁর প্রতিষ্ঠিত শিক্ষাকেন্দ্রে বহু শিক্ষার্থী হাদীসশাস্ত্র অধ্যয়ন করে জ্ঞান অর্জন করেন।</p><div class=\"h hs\">৩। হযরত শাহজালাল ইয়ামনী:</div><p>হযরত শাহজালাল ইয়ামনী আরবের ইয়েমেন থেকে বাংলাদেশের সিলেটে আগমন করেন। তিনি ৩৬০ জন সঙ্গী-সাথিসহ বাংলাদেশে ইসলাম প্রচার করেন। তিনি ইসলাম প্রচারের পাশাপাশি মুসলমানদের হাদীস শিক্ষা প্রদান করেন। তাঁর প্রচেষ্টায় সিলেট অঞ্চলে ইসলামের প্রসার ঘটে।</p><div class=\"h hs\">৪। শাহ বদরুদ্দীন বদরে আলম জাহেদী:</div><p>তিনি হযরত শাহজালাল ইয়ামনীর বংশধর ছিলেন। তাঁর পিতা তাঁকে অল্প বয়স থেকেই ইসলাম প্রচারের দায়িত্ব অর্পণ করেন। তিনি অসংখ্য সঙ্গী-সাথিসহ চট্টগ্রামে আগমন করেন এবং সেখানে ইসলামের ব্যাপক প্রচার করেন। তাঁর মাধ্যমে এ অঞ্চলে ইসলামী শিক্ষা ও হাদীসের চর্চা বিস্তার লাভ করে।</p><div class=\"h hs\">৫। হযরত খানজাহান আলী:</div><p>হযরত খানজাহান আলী দক্ষিণ বাংলার খুলনা অঞ্চলে ইসলাম প্রচারের উদ্দেশ্যে আগমন করেন। তিনি স্থানীয় মুসলমানদের মধ্যে ইসলামের শিক্ষা ও হাদীসের জ্ঞান প্রচার করেন। তাঁর প্রচেষ্টায় দক্ষিণ বাংলার বিভিন্ন অঞ্চলে ইসলামের প্রসার ঘটে।</p><div class=\"h hs\">৬। সৈয়দ আলী বাগদাদী:</div><p>সৈয়দ আলী বাগদাদী একশত সঙ্গীসহ ইসলাম প্রচারের উদ্দেশ্যে বাংলায় আগমন করেন। তিনি কিছুদিন দিল্লিতে অবস্থান করেন। পরবর্তীতে বাংলার ফরিদপুর জেলার চোলসমুদ্র নামক স্থানে বসতি স্থাপন করেন। তিনি দীর্ঘদিন ইসলাম প্রচার ও হাদীসের প্রসারে গুরুত্বপূর্ণ ভূমিকা পালন করেন।</p><div class=\"h hs\">৭। মাওলানা হাজী শরীয়তুল্লাহ ফরিদপুরী:</div><p>মাওলানা হাজী শরীয়তুল্লাহ ফরিদপুর জেলার মাদারীপুরের শিবচর থানার শামাইল গ্রামে জন্মগ্রহণ করেন। ১৮ বছর বয়সে তিনি মক্কায় গমন করেন এবং সেখানে দীর্ঘদিন হাদীস, তাফসির ও ফিকহশাস্ত্র অধ্যয়ন করেন। দেশে ফিরে তিনি ইসলাম প্রচার ও প্রসারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। তাঁর প্রচেষ্টায় বাংলায় ইসলামী শিক্ষা ও হাদীসের চর্চা বিস্তার লাভ করে।</p><div class=\"h hs\">৮। মাওলানা আবদুল কাদের সিলেটী:</div><p>মাওলানা আবদুল কাদের সিলেটের একজন বিশিষ্ট আলেম ও হাদীসবিশারদ ছিলেন। তিনি একজন বিজ্ঞ আলেম হিসেবে পরিচিত ছিলেন। হাদীস বিষয়ে তাঁর লিখিত বিভিন্ন গ্রন্থ ও কিতাব রয়েছে। তাঁর রচনাবলি হাদীসশাস্ত্রের চর্চায় গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><div class=\"h hs\">৯। মাওলানা ইসমাইল হাজীপুরী:</div><p>মাওলানা ইসমাইল হাজীপুরী শায়খ আবদুল কাদের দেহলভীর ছাত্র ছিলেন। তিনি সৈয়দ আহমদের সঙ্গে জিহাদে যোগদান করেন। পরবর্তীতে নিজ এলাকায় ফিরে কুরআন ও হাদীসের চর্চা, প্রচার ও প্রসারে আত্মনিয়োগ করেন। তাঁর প্রচেষ্টায় স্থানীয় পর্যায়ে ইসলামী শিক্ষার প্রসার ঘটে।</p><div class=\"h hs\">১০। মাওলানা কারামত আলী জৌনপুরী:</div><p>মাওলানা কারামত আলী জৌনপুরী ১৮০০ খ্রিষ্টাব্দে জৌনপুরের এক সম্ভ্রান্ত মুসলিম পরিবারে জন্মগ্রহণ করেন। তিনি মাওলানা আহমদুল্লাহর কাছে হাদীস শিক্ষা লাভ করেন। পরবর্তীতে বাংলাদেশে ইসলাম প্রচার ও হাদীস শিক্ষার প্রসারে আত্মনিয়োগ করেন। তিনি দীর্ঘদিন এ কাজে নিয়োজিত ছিলেন এবং উত্তরবঙ্গের রংপুরে ইন্তেকাল করেন।</p><div class=\"h hs\">১১। মাওলানা আহমদ জৌনপুরী:</div><p>মাওলানা আহমদ জৌনপুরী কলকাতায় জন্মগ্রহণ করেন। তিনি উচ্চতর ইসলামী জ্ঞান ও হাদীসশাস্ত্রে বিশেষ দক্ষতা অর্জন করেন। তিনি তাঁর জীবনের অধিকাংশ সময় বাংলাদেশে ইসলাম ও হাদীসের প্রচারে ব্যয় করেন। তাঁর প্রচেষ্টায় এ অঞ্চলে হাদীসশাস্ত্রের চর্চা আরও বিস্তৃত হয়।</p><div class=\"h hs\">১২। শায়খুল হাদীস আল্লামা আজিজুল হক:</div><p>শায়খুল হাদীস আল্লামা আজিজুল হক উপমহাদেশের একজন প্রখ্যাত হাদীসবিশারদ ছিলেন। তিনি বাংলা ভাষায় হাদীসের অনুবাদ ও ব্যাখ্যার ক্ষেত্রে বিশেষ অবদান রাখেন। তিনি ‘শায়খুল হাদীস’ নামে পরিচিত ছিলেন। তিনি দীর্ঘদিন বুখারি শরিফের দরস প্রদান করেন এবং হাদীসশাস্ত্রের প্রচার ও প্রসারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। তাঁর প্রচেষ্টায় বাংলাদেশে হাদীস শিক্ষার ব্যাপক প্রসার ঘটে।</p><div class=\"h hs\">১৩। মাওলানা আবদুল ওয়াহেদ চাটগামী:</div><p>মাওলানা আবদুল ওয়াহেদ চাটগামী চট্টগ্রামের এক সম্ভ্রান্ত মুসলিম পরিবারে জন্মগ্রহণ করেন। তিনি দারুল উলুম দেওবন্দের প্রথম যুগের বিশিষ্ট মুহাদ্দিসদের কাছে হাদীস শিক্ষা লাভ করেন। পরবর্তীতে নিজ এলাকায় ফিরে ১৯০১ সালে হাটহাজারীতে ‘আল-জামেয়া ইসলামিয়া’ নামে একটি কওমি মাদরাসা প্রতিষ্ঠা করেন। এ মাদরাসায় তিনি হাদীসসহ বিভিন্ন ইসলামী বিষয়ের পাঠদান করতেন। তাঁর প্রচেষ্টায় চট্টগ্রাম অঞ্চলে হাদীস শিক্ষার প্রসার ঘটে।</p><div class=\"h hs\">১৪। মাওলানা ওয়াজিউল্লাহ সন্দ্বীপী:</div><p>মাওলানা ওয়াজিউল্লাহ সন্দ্বীপী চট্টগ্রাম জেলার সন্দ্বীপে জন্মগ্রহণ করেন। তিনি মাওলানা আনোয়ার শাহ কাশ্মীরির কাছে দেওবন্দে হাদীস শিক্ষা লাভ করেন। পরবর্তীতে নোয়াখালী আহমদিয়া মাদরাসায় শিক্ষকতা করেন। তিনি অসাধারণ মেধা ও যোগ্যতার অধিকারী ছিলেন। সারা জীবন তিনি ইসলামী শিক্ষা ও হাদীসের প্রচার-প্রসারে গুরুত্বপূর্ণ ভূমিকা পালন করেন।</p><div class=\"h hm\">বাংলাদেশে হাদীস শিক্ষার বর্তমান প্রসার</div><p>বর্তমানে বাংলাদেশে অসংখ্য আলিয়া ও কওমি মাদরাসা রয়েছে, যেখানে নিয়মিত হাদীসের দরস প্রদান করা হয়। বিশেষ করে বুখারি, মুসলিম, আবু দাউদ, তিরমিজি, নাসাঈ ও ইবনে মাজাহসহ প্রসিদ্ধ হাদীসগ্রন্থগুলো পাঠদান করা হয়। এ ছাড়া দেশের বিভিন্ন স্থানে হাদীস গবেষণা, অনুবাদ, ব্যাখ্যা ও গ্রন্থ রচনার কাজ অব্যাহত রয়েছে।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, বাংলাদেশে উলূমুল হাদীসের উৎপত্তি ও ক্রমবিকাশের ইতিহাস অত্যন্ত সমৃদ্ধ। আরব, ইরাক, ইরান ও ভারতীয় উপমহাদেশ থেকে আগত পীর-আউলিয়া, আলেম ও মুহাদ্দিসগণের প্রচেষ্টায় এ দেশে হাদীসের চর্চা শুরু হয়। পরবর্তীতে তাঁদের উত্তরসূরিদের প্রচেষ্টায় অসংখ্য মাদরাসা প্রতিষ্ঠিত হয় এবং হাদীসশাস্ত্রের ব্যাপক প্রসার ঘটে। বর্তমানে বাংলাদেশে ইসলামী জ্ঞানচর্চার অন্যতম গুরুত্বপূর্ণ শাখা হিসেবে উলূমুল হাদীসের শিক্ষা ও গবেষণা অব্যাহত রয়েছে।</p>"], ["হাদিস জালকরণের সংজ্ঞা, হুকুম এবং এর কারণসমূহ বর্ণনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হাদিসশাস্ত্রে হাদিসের বিশুদ্ধতা ও গ্রহণযোগ্যতা যাচাই করার জন্য মুহাদ্দিসগণ বিভিন্ন নীতিমালা প্রণয়ন করেছেন। রাসুলুল্লাহ (সা.)-এর নামে মিথ্যা কথা, বক্তব্য বা কাজকে হাদিস হিসেবে প্রচার করা অত্যন্ত গর্হিত অপরাধ। এভাবে ইচ্ছাকৃতভাবে রাসুলুল্লাহ (সা.)-এর নামে মনগড়া কথা প্রচার করাকে হাদিস জালকরণ বলা হয়। এ ধরনের জালকৃত হাদিসকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الحديث الموضوع</span> বা মওজু হাদিস বলা হয়। নিম্নে মওজু হাদিসের পরিচয়, সংজ্ঞা, হুকুম ও হাদিস জালকরণের কারণসমূহ আলোচনা করা হলো।</p><div class=\"h hm\">মওজু হাদিসের পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَوْضُوعٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">وَضَعَ</span> শব্দ থেকে নির্গত। এটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">اسم مفعول</span>। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> স্থাপিত।</p><p style=\"padding-left:4px\"><b>২।</b> তৈরি করা।</p><p style=\"padding-left:4px\"><b>৩।</b> মনগড়া।</p><p style=\"padding-left:4px\"><b>৪।</b> মিথ্যা রচনা করা।</p><p style=\"padding-left:4px\"><b>৫।</b> কোনো কিছু নির্দিষ্ট স্থানে স্থাপন করা।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে মওজু হাদিস হলো, যে মনগড়া ও মিথ্যা বক্তব্যকে ইচ্ছাকৃতভাবে রাসুলুল্লাহ (সা.)-এর নামে হাদিস হিসেবে প্রচার করা হয়, তাকে মওজু হাদিস বলে।</p><p class=\"bh\"><b>ক. মুহাদ্দিসগণের পরিভাষায়—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الْخَبَرُ الْمُخْتَلَقُ الْمَصْنُوعُ الْمَنْسُوبُ إِلَى رَسُولِ اللهِ ﷺ كَذِبًا</div></div><p>অর্থ: যে মনগড়া ও মিথ্যা সংবাদকে রাসুলুল্লাহ (সা.)-এর নামে মিথ্যাভাবে সম্বন্ধযুক্ত করা হয়, তাকে মওজু হাদিস বলে।</p><p class=\"bh\"><b>খ. ইমাম ইবনে সালাহ (রহ.)-এর আলোচনার ভিত্তিতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ الْمَوْضُوعُ هُوَ الْمُخْتَلَقُ الْمَصْنُوعُ</div></div><p>অর্থ: মওজু হাদিস হলো মনগড়া ও কৃত্রিমভাবে তৈরি করা বর্ণনা।</p><div class=\"h hs hs2\">গ. সহজ ভাষায় সংজ্ঞা :</div><p>যে মিথ্যা ও মনগড়া কথা রাসুলুল্লাহ (সা.) বলেননি, অথচ কেউ তা নিজের পক্ষ থেকে তৈরি করে রাসুলুল্লাহ (সা.)-এর কথা বা কাজ হিসেবে প্রচার করে, তাকে মওজু হাদিস বলা হয়।</p><div class=\"h hm\">মওজু হাদিসের উদাহরণ</div><p>কোনো ব্যক্তি নিজের পক্ষ থেকে একটি কথা তৈরি করে রাসুলুল্লাহ (সা.)-এর নামে প্রচার করল এবং বলল, রাসুলুল্লাহ (সা.) বলেছেন। অথচ কথাটি রাসুলুল্লাহ (সা.)-এর নয় এবং এর কোনো নির্ভরযোগ্য হাদিসি ভিত্তিও নেই। এ ধরনের মনগড়া বর্ণনা মওজু হাদিসের অন্তর্ভুক্ত।</p><div class=\"h hm\">মওজু হাদিসের হুকুম</div><p>মওজু হাদিস সম্পর্কে ইসলামের বিধান অত্যন্ত কঠোর। কারণ, এটি রাসুলুল্লাহ (সা.)-এর নামে মিথ্যা আরোপ করার শামিল। নিম্নে এর হুকুম আলোচনা করা হলো—</p><div class=\"h hs\">১। মওজু হাদিস তৈরি করা হারাম :</div><p>ইচ্ছাকৃতভাবে কোনো মিথ্যা কথা তৈরি করে রাসুলুল্লাহ (সা.)-এর নামে হাদিস হিসেবে প্রচার করা সম্পূর্ণ হারাম। এটি ইসলামের দৃষ্টিতে গুরুতর কবিরা গুনাহ।</p><div class=\"h hs\">২। রাসুলুল্লাহ (সা.)-এর নামে মিথ্যা আরোপের পরিণতি :</div><p>রাসুলুল্লাহ (সা.)-এর নামে মিথ্যা আরোপ করা অত্যন্ত ভয়াবহ অপরাধ। এ সম্পর্কে রাসুলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ</div></div><p>অর্থ: যে ব্যক্তি ইচ্ছাকৃতভাবে আমার ওপর মিথ্যা আরোপ করে, সে যেন জাহান্নামে তার ঠিকানা তৈরি করে নেয়।</p><div class=\"h hs\">৩। মওজু হাদিসের ওপর আমল করা যাবে না :</div><p>মওজু হাদিস সম্পূর্ণ মিথ্যা ও মনগড়া হওয়ায় এর ওপর আমল করা বৈধ নয়। শরিয়তের কোনো বিধান প্রমাণের ক্ষেত্রে মওজু হাদিস দলিল হিসেবে গ্রহণযোগ্য নয়।</p><div class=\"h hs\">৪। মওজু হাদিস বর্ণনা করার বিধান :</div><p>কোনো ব্যক্তি যদি জানে যে একটি হাদিস মওজু, তাহলে তা মওজু বলে স্পষ্ট উল্লেখ না করে সাধারণ হাদিস হিসেবে বর্ণনা করা হারাম। তবে জাল হাদিস সম্পর্কে মানুষকে সতর্ক করা, এর অসারতা তুলে ধরা এবং গবেষণার প্রয়োজনে তা বর্ণনা করা বৈধ।</p><div class=\"h hs\">৫। মওজু হাদিস থেকে সতর্ক থাকা জরুরি :</div><p>মুসলমানদের জন্য মওজু হাদিস থেকে সতর্ক থাকা আবশ্যক। কোনো হাদিস শোনামাত্র তা যাচাই না করে রাসুলুল্লাহ (সা.)-এর নামে প্রচার করা উচিত নয়। বরং নির্ভরযোগ্য হাদিসগ্রন্থ ও মুহাদ্দিসগণের গবেষণার মাধ্যমে তার বিশুদ্ধতা যাচাই করতে হবে।</p><div class=\"h hm\">হাদিস জালকরণের কারণসমূহ</div><p>ইসলামের ইতিহাসে বিভিন্ন সময়ে নানা উদ্দেশ্যে কিছু লোক হাদিস জাল করেছে। কেউ রাজনৈতিক স্বার্থে, কেউ ব্যক্তিগত স্বার্থে, আবার কেউ ধর্মীয় আবেগ বা অজ্ঞতার কারণে এ ধরনের অপরাধে লিপ্ত হয়েছে। নিম্নে হাদিস জালকরণের প্রধান কারণসমূহ আলোচনা করা হলো—</p><div class=\"h hs\">১। রাজনৈতিক স্বার্থ হাসিল :</div><p>ইসলামের প্রাথমিক যুগে রাজনৈতিক মতভেদ ও ক্ষমতার দ্বন্দ্বের কারণে কিছু ব্যক্তি নিজেদের দল বা শাসকের পক্ষে জনমত তৈরি করার জন্য হাদিস জাল করেছে। তারা নিজেদের নেতা বা শাসকের প্রশংসায় এবং প্রতিপক্ষের নিন্দায় মনগড়া বর্ণনা তৈরি করত।</p><div class=\"h hs\">২। দলীয় ও মতাদর্শগত গোঁড়ামি :</div><p>বিভিন্ন রাজনৈতিক ও ধর্মীয় দলের মধ্যে মতবিরোধের কারণে কিছু লোক নিজেদের মতাদর্শকে প্রতিষ্ঠিত করার জন্য হাদিস জাল করেছে। তারা নিজেদের দলের পক্ষে এবং বিরোধী দলের বিপক্ষে মনগড়া হাদিস প্রচার করত।</p><div class=\"h hs\">৩। মাজহাবগত গোঁড়ামি :</div><p>কিছু অজ্ঞ ও গোঁড়া ব্যক্তি নিজেদের মাজহাব বা ইমামের শ্রেষ্ঠত্ব প্রমাণ করার উদ্দেশ্যে হাদিস জাল করেছে। তারা নিজেদের মাজহাবের পক্ষে এবং অন্য মাজহাবের বিপক্ষে মনগড়া বর্ণনা প্রচার করত।</p><div class=\"h hs\">৪। ধর্মীয় অজ্ঞতা ও অতিরিক্ত আবেগ :</div><p>কিছু ব্যক্তি ইসলামের প্রতি অতিরিক্ত আবেগ এবং ধর্মীয় জ্ঞানের অভাবে মানুষকে ভালো কাজের প্রতি উৎসাহিত করার উদ্দেশ্যে হাদিস জাল করেছে। তারা মনে করত, মানুষকে নেক কাজের প্রতি উদ্বুদ্ধ করার জন্য মনগড়া হাদিস তৈরি করা দোষের নয়। কিন্তু তাদের এ ধারণা সম্পূর্ণ ভুল।</p><div class=\"h hs\">৫। গল্পকার ও ওয়ায়েজদের উদ্দেশ্য :</div><p>কিছু গল্পকার ও ওয়ায়েজ মানুষকে আকৃষ্ট করার জন্য এবং নিজেদের জনপ্রিয়তা বাড়ানোর উদ্দেশ্যে চমকপ্রদ ও মনগড়া কাহিনিকে হাদিস হিসেবে প্রচার করত। শ্রোতাদের আবেগাপ্লুত করা এবং মাহফিলে জনপ্রিয়তা অর্জন করাই ছিল তাদের উদ্দেশ্য।</p><div class=\"h hs\">৬। ব্যক্তিগত স্বার্থ ও অর্থ উপার্জন :</div><p>কিছু অসাধু ব্যক্তি অর্থ, সম্পদ, পদমর্যাদা ও ব্যক্তিগত সুবিধা লাভের উদ্দেশ্যে হাদিস জাল করেছে। তারা শাসক, ধনী ব্যক্তি ও প্রভাবশালীদের সন্তুষ্ট করার জন্য তাঁদের পছন্দ অনুযায়ী মনগড়া হাদিস তৈরি করত।</p><div class=\"h hs\">৭। ইসলামের শত্রুদের ষড়যন্ত্র :</div><p>ইসলামের বিরোধী কিছু ব্যক্তি মুসলমানদের মধ্যে বিভ্রান্তি সৃষ্টি এবং ইসলামের বিশুদ্ধতা নষ্ট করার উদ্দেশ্যে হাদিস জাল করেছে। তারা ইসলামের মূল শিক্ষা বিকৃত করা এবং মুসলমানদের মধ্যে বিভেদ সৃষ্টি করার চেষ্টা করত।</p><div class=\"h hs\">৮। গোত্র ও জাতীয়তাবাদী অহংকার :</div><p>কিছু ব্যক্তি নিজেদের গোত্র, বংশ, অঞ্চল বা জাতির শ্রেষ্ঠত্ব প্রমাণ করার জন্য হাদিস জাল করেছে। তারা নিজেদের গোত্রের প্রশংসা এবং অন্য গোত্রের নিন্দা করে মনগড়া বর্ণনা প্রচার করত।</p><div class=\"h hs\">৯। ব্যবসায়িক ও বৈষয়িক স্বার্থ :</div><p>কিছু অসাধু ব্যবসায়ী নিজেদের ব্যবসায়িক পণ্য, স্থান বা প্রতিষ্ঠানের প্রচার ও প্রসারের জন্য রাসুলুল্লাহ (সা.)-এর নামে মনগড়া হাদিস তৈরি করেছে। এর মাধ্যমে তারা মানুষের বিশ্বাস অর্জন করে আর্থিক সুবিধা লাভ করতে চাইত।</p><div class=\"h hs\">১০। দুনিয়াবি খ্যাতি ও জনপ্রিয়তা অর্জন :</div><p>কিছু ব্যক্তি নিজেদের অসাধারণ জ্ঞানী ও বড় মুহাদ্দিস হিসেবে পরিচিত করার উদ্দেশ্যে নতুন নতুন হাদিস তৈরি করত। তারা মানুষের দৃষ্টি আকর্ষণ এবং নিজেদের খ্যাতি বাড়ানোর জন্য এ ধরনের অপকর্মে লিপ্ত হতো।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, মওজু হাদিস ইসলামের বিশুদ্ধতা ও হাদিসশাস্ত্রের জন্য একটি মারাত্মক ক্ষতিকর বিষয়। রাজনৈতিক স্বার্থ, দলীয় গোঁড়ামি, ধর্মীয় অজ্ঞতা, ব্যক্তিগত স্বার্থসহ বিভিন্ন কারণে হাদিস জালকরণের ঘটনা ঘটেছে। এসব জাল বর্ণনা থেকে হাদিসের বিশুদ্ধতা রক্ষার জন্য মুহাদ্দিসগণ নিরলস পরিশ্রম করেছেন এবং জাল হাদিস শনাক্ত করার জন্য স্বতন্ত্র গ্রন্থ রচনা করেছেন। তাই রাসুলুল্লাহ (সা.)-এর নামে কোনো কথা প্রচারের আগে তার বিশুদ্ধতা যাচাই করা প্রত্যেক মুসলমানের কর্তব্য।</p>"]]}], "সংক্ষিপ্ত প্রশ্ন": [{"n": "সংক্ষিপ্ত", "c": "#E11D48", "q": [["খবর ওয়াহিদ কাকে বলে এবং এর হুকুম কী? এ সম্পর্কে আলেমদের মতভেদ উল্লেখপূর্বক আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হাদিসশাস্ত্রে বর্ণনাকারীর সংখ্যা ও বর্ণনার পদ্ধতির ভিত্তিতে হাদিসকে বিভিন্ন ভাগে বিভক্ত করা হয়েছে। এসব প্রকারের মধ্যে খবর ওয়াহিদ অন্যতম। ইসলামী শরিয়তের বিধান নির্ণয়ে খবর ওয়াহিদের বিশেষ ভূমিকা রয়েছে। তবে এর গ্রহণযোগ্যতা, জ্ঞান সৃষ্টির ক্ষমতা এবং প্রমাণমূল্য সম্পর্কে আলেমদের মধ্যে মতভেদ রয়েছে। নিম্নে খবর ওয়াহিদের পরিচয়, সংজ্ঞা, হুকুম এবং এ বিষয়ে আলেমদের মতভেদ আলোচনা করা হলো।</p><div class=\"h hm\">খবর ওয়াহিদের পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">خَبَرُ الْوَاحِدِ</span> শব্দটি দুটি আরবি শব্দের সমন্বয়ে গঠিত। যথা—</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">خَبَرٌ</span> (খবর) শব্দের অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সংবাদ।</p><p style=\"padding-left:4px\"><b>২।</b> তথ্য।</p><p style=\"padding-left:4px\"><b>৩।</b> বর্ণনা।</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">وَاحِدٌ</span> (ওয়াহিদ) শব্দের অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> এক।</p><p style=\"padding-left:4px\"><b>২।</b> একক।</p><p style=\"padding-left:4px\"><b>৩।</b> অদ্বিতীয়।</p><p>সুতরাং <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">خَبَرُ الْوَاحِدِ</span>-এর আভিধানিক অর্থ হলো একক সংবাদ বা একক ব্যক্তির বর্ণিত সংবাদ।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে খবর ওয়াহিদ হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا لَمْ يَبْلُغْ حَدَّ التَّوَاتُرِ</div></div><p>অর্থ: যে বর্ণনা মুতাওয়াতিরের পর্যায়ে পৌঁছায়নি, তাকে খবর ওয়াহিদ বলা হয়।</p><p class=\"bh\"><b>খ. ইমাম খতিব বাগদাদি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَبَرُ الْآحَادِ هُوَ مَا قَصُرَ عَنْ صِفَةِ التَّوَاتُرِ</div></div><p>অর্থ: যে সংবাদ মুতাওয়াতিরের বৈশিষ্ট্য ও পর্যায়ে পৌঁছায়নি, তা খবর ওয়াহিদ।</p><p class=\"bh\"><b>গ. ইমাম আমিদি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَبَرُ الْآحَادِ مَا كَانَ مِنَ الْأَخْبَارِ غَيْرَ مُنْتَهٍ إِلَى حَدِّ التَّوَاتُرِ</div></div><p>অর্থ: যেসব সংবাদ মুতাওয়াতিরের পর্যায়ে পৌঁছায়নি, সেগুলোকে খবর ওয়াহিদ বলা হয়।</p><p class=\"bh\"><b>ঘ. ইমাম নববি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَمَّا خَبَرُ الْوَاحِدِ فَهُوَ مَا لَمْ يُوجَدْ فِيهِ شُرُوطُ الْمُتَوَاتِرِ سَوَاءٌ كَانَ الرَّاوِي لَهُ وَاحِدًا أَوْ أَكْثَرَ</div></div><p>অর্থ: যে বর্ণনায় মুতাওয়াতিরের শর্তগুলো পাওয়া যায় না, বর্ণনাকারী একজন হোক অথবা একাধিক হোক, তাকে খবর ওয়াহিদ বলা হয়।</p><div class=\"h hs hs2\">সহজ ভাষায় সংজ্ঞা :</div><p>যে হাদিসের বর্ণনাকারীর সংখ্যা কোনো স্তরে মুতাওয়াতিরের পর্যায়ে পৌঁছায়নি, তাকে খবর ওয়াহিদ বলা হয়।</p><div class=\"h hm\">খবর ওয়াহিদের হুকুম</div><p>খবর ওয়াহিদের হুকুম সম্পর্কে আলেমদের মধ্যে মতভেদ রয়েছে। বিশেষ করে খবর ওয়াহিদ নিশ্চিত জ্ঞান সৃষ্টি করে, নাকি শুধু প্রবল ধারণা সৃষ্টি করে এবং আকিদা ও আমলের ক্ষেত্রে এর প্রমাণমূল্য কতটুকু—এসব বিষয়ে তাঁদের মধ্যে মতপার্থক্য দেখা যায়। নিম্নে তাঁদের মতামত আলোচনা করা হলো।</p><div class=\"h hs\">১। জমহুর উসুলবিদ ও ফকিহগণের মত :</div><p>জমহুর উসুলবিদ ও ফকিহগণের মতে, সহিহ খবর ওয়াহিদ নিজে থেকে নিশ্চিত জ্ঞান সৃষ্টি করে না; বরং প্রবল ধারণা সৃষ্টি করে। তবে শরিয়তের আমলসংক্রান্ত বিধান প্রমাণের ক্ষেত্রে এটি গ্রহণযোগ্য দলিল। সুতরাং বর্ণনাকারী নির্ভরযোগ্য হলে এবং হাদিসটি সহিহ হওয়ার শর্ত পূরণ করলে তার ওপর আমল করা আবশ্যক।</p><p>এ মতটি হানাফি, মালিকি, শাফেয়ি ও হাম্বলি মাজহাবের অধিকাংশ উসুলবিদের মধ্যে প্রসিদ্ধ।</p><div class=\"h hs\">২। ইমাম খতিব বাগদাদি (রহ.)-এর মত :</div><p>ইমাম খতিব বাগদাদি (রহ.)-এর আলোচনায় খবর ওয়াহিদকে এমন সংবাদ হিসেবে চিহ্নিত করা হয়েছে, যা মুতাওয়াতিরের পর্যায়ে পৌঁছায় না এবং সাধারণভাবে নিজে থেকে নিশ্চিত জ্ঞান সৃষ্টি করে না। তবে নির্ভরযোগ্য বর্ণনাকারীর খবর ওয়াহিদ শরিয়তের বিধান প্রমাণের ক্ষেত্রে গ্রহণযোগ্য। অর্থাৎ তাঁর আলোচনায় জ্ঞান সৃষ্টি ও আমলযোগ্যতার বিষয় দুটি পৃথকভাবে বিবেচিত হয়েছে।</p><div class=\"h hs\">৩। ইমাম শাফেয়ি (রহ.)-এর মত :</div><p>ইমাম শাফেয়ি (রহ.) নির্ভরযোগ্য বর্ণনাকারীর মাধ্যমে বর্ণিত সহিহ খবর ওয়াহিদকে শরিয়তের বিধান প্রমাণের দলিল হিসেবে গ্রহণ করেছেন। তাঁর মতে, বর্ণনাকারী বিশ্বস্ত, সত্যবাদী ও নির্ভুল স্মৃতিশক্তির অধিকারী হলে এবং সনদের অন্যান্য শর্ত পূরণ হলে তার বর্ণনার ওপর আমল করা আবশ্যক। তবে খবর ওয়াহিদ সাধারণভাবে মুতাওয়াতিরের মতো নিশ্চিত জ্ঞান প্রদান করে না।</p><div class=\"h hs\">৪। ইমাম আহমদ ইবনে হাম্বল (রহ.)-এর মত :</div><p>ইমাম আহমদ (রহ.) সহিহ খবর ওয়াহিদকে শরিয়তের দলিল হিসেবে গ্রহণ করেছেন। তাঁর মতে, নির্ভরযোগ্য বর্ণনাকারীর বর্ণিত হাদিস কুরআন-সুন্নাহর মূলনীতির বিরোধী না হলে তা গ্রহণ করে তার ওপর আমল করতে হবে। তবে খবর ওয়াহিদ জ্ঞান সৃষ্টি করে কি না, সে বিষয়ে তাঁর অনুসারীদের মধ্যে বিভিন্ন ব্যাখ্যা রয়েছে।</p><div class=\"h hs\">৫। ইমাম ইবনে হাজার আসকালানি (রহ.) ও মুহাদ্দিসগণের মত :</div><p>মুহাদ্দিসগণের একটি প্রসিদ্ধ মত হলো, সহিহ খবর ওয়াহিদ সাধারণভাবে প্রবল ধারণা সৃষ্টি করে। তবে কোনো খবর ওয়াহিদের সঙ্গে অতিরিক্ত প্রমাণ বা সমর্থন যুক্ত হলে তা নিশ্চিত জ্ঞানও সৃষ্টি করতে পারে। বিশেষ করে সহিহ বুখারি ও সহিহ মুসলিমের যেসব হাদিস উম্মাহর কাছে ব্যাপকভাবে গ্রহণযোগ্যতা লাভ করেছে, সেগুলোর ক্ষেত্রে এ বিষয়টি বিশেষভাবে আলোচিত হয়েছে।</p><div class=\"h hs\">৬। ইমাম ইবনে তাইমিয়া (রহ.)-এর মত :</div><p>ইমাম ইবনে তাইমিয়া (রহ.)-এর মতে, খবর ওয়াহিদের সঙ্গে যদি এমন কোনো প্রমাণ বা সমর্থন যুক্ত হয়, যা জ্ঞান সৃষ্টি করে, তাহলে তা নিশ্চিত জ্ঞান প্রদান করতে পারে। তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الصَّحِيحُ أَنَّ خَبَرَ الْوَاحِدِ قَدْ يُفِيدُ الْعِلْمَ إِذَا احْتَفَّتْ بِهِ قَرَائِنُ تُفِيدُ الْعِلْمَ</div></div><p>অর্থ: সঠিক কথা হলো, খবর ওয়াহিদের সঙ্গে জ্ঞান সৃষ্টিকারী প্রমাণ যুক্ত হলে তা নিশ্চিত জ্ঞান প্রদান করতে পারে।</p><p>তাঁর মতে, যেসব খবর ওয়াহিদ উম্মাহর কাছে গ্রহণযোগ্যতা লাভ করেছে, সেগুলোও নিশ্চিত জ্ঞান প্রদান করতে পারে।</p><div class=\"h hs\">৭। ইমাম ইবনে হাজম (রহ.)-এর মত :</div><p>ইমাম ইবনে হাজম (রহ.)-এর মতে, নির্ভরযোগ্য ও সহিহ খবর ওয়াহিদ নিজেই জ্ঞান প্রদান করতে পারে। তাঁর মতে, শরিয়তের বিধান এবং আকিদা উভয় ক্ষেত্রেই সহিহ খবর ওয়াহিদ দলিল হিসেবে গ্রহণযোগ্য। এ বিষয়ে তিনি তাঁর রচনায় বিস্তারিত আলোচনা করেছেন।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, খবর ওয়াহিদ হাদিসশাস্ত্রের একটি গুরুত্বপূর্ণ পরিভাষা। এর জ্ঞানগত মূল্য সম্পর্কে আলেমদের মধ্যে মতভেদ থাকলেও সহিহ খবর ওয়াহিদের ওপর আমল করার গ্রহণযোগ্যতা ব্যাপকভাবে স্বীকৃত। অধিকাংশ উসুলবিদের মতে, এটি প্রবল ধারণা সৃষ্টি করে এবং শরিয়তের আমলসংক্রান্ত বিধান প্রমাণে দলিল হিসেবে ব্যবহৃত হয়। অন্যদিকে কিছু মুহাদ্দিস ও আলেমের মতে, বিশেষ প্রমাণ ও সমর্থন যুক্ত হলে খবর ওয়াহিদ নিশ্চিত জ্ঞানও প্রদান করতে পারে।</p>"], ["হাদিসে হাসান ও হাদিসে গারীবের সংজ্ঞা দাও। অতঃপর হাসান লিযাতিহি ও হাসান লিগাইরিহির মধ্যে পার্থক্য লেখ।", "<div class=\"h hm\">ভূমিকা</div><p>হাদিসশাস্ত্রে বর্ণনাকারীর নির্ভরযোগ্যতা, স্মৃতিশক্তি, সনদের ধারাবাহিকতা এবং বর্ণনার সংখ্যার ভিত্তিতে হাদিসকে বিভিন্ন শ্রেণিতে বিভক্ত করা হয়েছে। এসব শ্রেণির মধ্যে হাদিসে হাসান ও হাদিসে গারীব বিশেষভাবে উল্লেখযোগ্য। হাদিসে হাসান আবার হাসান লিযাতিহি ও হাসান লিগাইরিহি—এ দুই ভাগে বিভক্ত। নিম্নে হাদিসে হাসান ও হাদিসে গারীবের পরিচয় ও সংজ্ঞা এবং হাসান লিযাতিহি ও হাসান লিগাইরিহির পার্থক্য আলোচনা করা হলো।</p><div class=\"h hm\">হাদিসে হাসানের পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَسَنٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حُسْنٌ</span> থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সুন্দর।</p><p style=\"padding-left:4px\"><b>২।</b> উত্তম।</p><p style=\"padding-left:4px\"><b>৩।</b> ভালো।</p><p style=\"padding-left:4px\"><b>৪।</b> মনোরম।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে হাদিসে হাসান হলো এমন হাদিস, যার সনদ ধারাবাহিক, বর্ণনাকারীগণ ন্যায়পরায়ণ, তবে তাঁদের স্মৃতিশক্তি সহিহ হাদিসের বর্ণনাকারীদের তুলনায় কিছুটা কম। হাদিসটি শায ও গোপন ত্রুটিমুক্ত হতে হয়।</p><div class=\"h hs hs3\">ক. হাফিজ ইবনে হাজার আসকালানি (রহ.)-এর সংজ্ঞা :</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا اتَّصَلَ سَنَدُهُ بِنَقْلِ الْعَدْلِ الَّذِي خَفَّ ضَبْطُهُ عَنْ مِثْلِهِ إِلَى مُنْتَهَاهُ مِنْ غَيْرِ شُذُوذٍ وَلَا عِلَّةٍ</div></div><p>অর্থ: যে হাদিসের সনদ ধারাবাহিকভাবে এমন ন্যায়পরায়ণ বর্ণনাকারীর মাধ্যমে শেষ পর্যন্ত পৌঁছেছে, যাঁর স্মৃতিশক্তি কিছুটা কম, এবং হাদিসটি শায ও গোপন ত্রুটিমুক্ত, তাকে হাদিসে হাসান বলা হয়।</p><div class=\"h hs hs3\">খ. ড. মাহমুদ আত-তাহহান (রহ.)-এর সংজ্ঞা :</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا اتَّصَلَ سَنَدُهُ بِنَقْلِ الْعَدْلِ الَّذِي خَفَّ ضَبْطُهُ عَنْ مِثْلِهِ إِلَى مُنْتَهَاهُ مِنْ غَيْرِ شُذُوذٍ وَلَا عِلَّةٍ</div></div><p>অর্থ: যে হাদিসের সনদ ধারাবাহিক, বর্ণনাকারীগণ ন্যায়পরায়ণ এবং তাঁদের স্মৃতিশক্তি কিছুটা কম, আর হাদিসটি শায ও গোপন ত্রুটিমুক্ত, তাকে হাদিসে হাসান বলা হয়।</p><div class=\"h hs hs2\">গ. সহজ ভাষায় সংজ্ঞা :</div><p>যে হাদিসের বর্ণনাকারীগণ বিশ্বস্ত ও ন্যায়পরায়ণ, তবে তাঁদের স্মৃতিশক্তি সহিহ হাদিসের বর্ণনাকারীদের তুলনায় কিছুটা কম এবং সনদটি ধারাবাহিক ও ত্রুটিমুক্ত, তাকে হাদিসে হাসান বলা হয়।</p><div class=\"h hm\">হাদিসে গারীবের পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">غَرِيْبٌ</span> শব্দের আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> অপরিচিত।</p><p style=\"padding-left:4px\"><b>২।</b> অদ্ভুত।</p><p style=\"padding-left:4px\"><b>৩।</b> একক।</p><p style=\"padding-left:4px\"><b>৪।</b> বিরল।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে, যে হাদিসের সনদের কোনো একটি স্তরে মাত্র একজন বর্ণনাকারী এককভাবে হাদিসটি বর্ণনা করেছেন, তাকে হাদিসে গারীব বলা হয়।</p><div class=\"h hs hs3\">ক. হাফিজ ইবনে হাজার আসকালানি (রহ.)-এর সংজ্ঞা :</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ مَا يَنْفَرِدُ بِرِوَايَتِهِ رَاوٍ وَاحِدٌ</div></div><p>অর্থ: যে হাদিসের বর্ণনার ক্ষেত্রে একজন বর্ণনাকারী এককভাবে বর্ণনা করেন, তাকে হাদিসে গারীব বলা হয়।</p><div class=\"h hs hs3\">খ. মুহাদ্দিসগণের প্রচলিত সংজ্ঞা :</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا تَفَرَّدَ بِرِوَايَتِهِ رَاوٍ وَاحِدٌ فِي أَيِّ طَبَقَةٍ مِنْ طَبَقَاتِ السَّنَدِ</div></div><p>অর্থ: সনদের যেকোনো একটি স্তরে যে হাদিস একজন বর্ণনাকারী এককভাবে বর্ণনা করেন, তাকে হাদিসে গারীব বলা হয়।</p><div class=\"h hs hs2\">গ. সহজ ভাষায় সংজ্ঞা :</div><p>যে হাদিসের সনদের কোনো একটি স্তরে মাত্র একজন বর্ণনাকারী রয়েছেন এবং ওই স্তরে অন্য কেউ তাঁর সঙ্গে বর্ণনায় অংশগ্রহণ করেননি, তাকে হাদিসে গারীব বলা হয়।</p><div class=\"h hm\">হাসান লিযাতিহি ও হাসান লিগাইরিহির পরিচয়</div><div class=\"h hs\">হাসান লিযাতিহি :</div><p>যে হাদিসের সনদ ধারাবাহিক, বর্ণনাকারীগণ ন্যায়পরায়ণ এবং তাঁদের স্মৃতিশক্তি কিছুটা কম; কিন্তু হাদিসটি অন্য কোনো বর্ণনার সমর্থন ছাড়াই নিজস্ব বৈশিষ্ট্যের কারণে হাসান পর্যায়ে পৌঁছেছে, তাকে হাসান লিযাতিহি বলা হয়।</p><div class=\"h hs\">হাসান লিগাইরিহি :</div><p>যে হাদিস মূলত দুর্বল হলেও দুর্বলতা সামান্য হওয়ার কারণে অন্য সনদ বা সমর্থনকারী বর্ণনার মাধ্যমে শক্তিশালী হয়ে হাসান পর্যায়ে উন্নীত হয়, তাকে হাসান লিগাইরিহি বলা হয়।</p><div class=\"h hm\">হাসান লিযাতিহি ও হাসান লিগাইরিহির মধ্যে পার্থক্য</div><div class=\"h hs\">১। সংজ্ঞাগত পার্থক্য :</div><p>হাসান লিযাতিহি নিজস্ব বৈশিষ্ট্যের কারণে হাসান পর্যায়ে পৌঁছায়। পক্ষান্তরে, হাসান লিগাইরিহি অন্য বর্ণনার সমর্থনে হাসান পর্যায়ে উন্নীত হয়।</p><div class=\"h hs\">২। বর্ণনার মানের পার্থক্য :</div><p>হাসান লিযাতিহির বর্ণনাকারীদের স্মৃতিশক্তি কিছুটা কম হলেও তাঁরা নির্ভরযোগ্য ও ন্যায়পরায়ণ হন। অন্যদিকে, হাসান লিগাইরিহির কোনো বর্ণনাকারীর সামান্য দুর্বলতা বা স্মৃতিশক্তির দুর্বলতা থাকতে পারে।</p><div class=\"h hs\">৩। অন্য বর্ণনার সমর্থনের পার্থক্য :</div><p>হাসান লিযাতিহি গ্রহণযোগ্য হওয়ার জন্য অন্য কোনো সনদের সমর্থন প্রয়োজন হয় না। কিন্তু হাসান লিগাইরিহি অন্য সনদ বা সমর্থনকারী বর্ণনার মাধ্যমে শক্তিশালী হয়।</p><div class=\"h hs\">৪। বিশুদ্ধতার ভিত্তিতে পার্থক্য :</div><p>হাসান লিযাতিহি নিজস্ব সনদের বৈশিষ্ট্যের ভিত্তিতে গ্রহণযোগ্য। পক্ষান্তরে, হাসান লিগাইরিহি একাধিক বর্ণনার পারস্পরিক সমর্থনের কারণে গ্রহণযোগ্যতা লাভ করে।</p><div class=\"h hs\">৫। দুর্বলতার পার্থক্য :</div><p>হাসান লিযাতিহি মূলত দুর্বল হাদিস নয়। অন্যদিকে, হাসান লিগাইরিহি মূলত দুর্বল ছিল; তবে তার দুর্বলতা গুরুতর না হওয়ায় অন্য বর্ণনার সমর্থনে তা গ্রহণযোগ্য হয়েছে।</p><div class=\"h hs\">৬। গ্রহণযোগ্যতার পার্থক্য :</div><p>উভয় প্রকার হাদিসই গ্রহণযোগ্য এবং শরিয়তের বিধান প্রমাণের ক্ষেত্রে দলিল হিসেবে ব্যবহার করা যায়। তবে হাসান লিযাতিহি নিজস্ব সনদের কারণে গ্রহণযোগ্য হয়, আর হাসান লিগাইরিহি সমর্থনকারী বর্ণনার কারণে গ্রহণযোগ্য হয়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, হাদিসে হাসান ও হাদিসে গারীব হাদিসশাস্ত্রের গুরুত্বপূর্ণ দুটি পরিভাষা। হাদিসে হাসান বর্ণনাকারীর নির্ভরযোগ্যতা ও স্মৃতিশক্তির ভিত্তিতে নির্ধারিত হয়। অন্যদিকে, হাদিসে গারীব নির্ধারিত হয় সনদের কোনো স্তরে একক বর্ণনাকারীর উপস্থিতির ভিত্তিতে। আবার হাসান লিযাতিহি নিজস্ব বৈশিষ্ট্যে এবং হাসান লিগাইরিহি অন্য বর্ণনার সমর্থনে হাসান পর্যায়ে উন্নীত হয়।</p>"], ["মুরসাল হাদিস কাকে বলে? ইমামগণের মতভেদসহ মুরসাল হাদিসের হুকুম আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হাদিসশাস্ত্রে সনদের ধারাবাহিকতা ও বিচ্ছিন্নতার ভিত্তিতে হাদিসের বিভিন্ন প্রকার নির্ধারণ করা হয়েছে। এসব প্রকারের মধ্যে মুরসাল হাদিস অন্যতম। কোনো তাবেয়ি সাহাবির নাম উল্লেখ না করে সরাসরি রাসুলুল্লাহ (সা.) থেকে হাদিস বর্ণনা করলে তাকে মুরসাল হাদিস বলা হয়। মুরসাল হাদিসের গ্রহণযোগ্যতা সম্পর্কে মুহাদ্দিস ও ফকিহদের মধ্যে মতপার্থক্য রয়েছে। নিম্নে মুরসাল হাদিসের পরিচয়, সংজ্ঞা এবং ইমামগণের মতভেদসহ এর হুকুম আলোচনা করা হলো।</p><div class=\"h hm\">মুরসাল হাদিসের পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُرْسَلٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إِرْسَالٌ</span> মাসদার থেকে নির্গত। এটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">اِرْسَالٌ</span> শব্দের <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">اسم مفعول</span>। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> প্রেরিত।</p><p style=\"padding-left:4px\"><b>২।</b> মুক্ত।</p><p style=\"padding-left:4px\"><b>৩।</b> ছেড়ে দেওয়া।</p><p style=\"padding-left:4px\"><b>৪।</b> অবাধ।</p><p style=\"padding-left:4px\"><b>৫।</b> বন্ধনমুক্ত।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে মুরসাল হাদিস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا رَفَعَهُ التَّابِعِيُّ إِلَى النَّبِيِّ ﷺ مِنْ قَوْلٍ أَوْ فِعْلٍ أَوْ تَقْرِيرٍ</div></div><p>অর্থ: যে হাদিসে কোনো তাবেয়ি সরাসরি রাসুলুল্লাহ (সা.)-এর কথা, কাজ বা অনুমোদন বর্ণনা করেন এবং সাহাবির নাম উল্লেখ করেন না, তাকে মুরসাল হাদিস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا سَقَطَ مِنْ آخِرِ إِسْنَادِهِ مَنْ بَعْدَ التَّابِعِيِّ</div></div><p>অর্থ: যে হাদিসের সনদের শেষাংশ থেকে তাবেয়ির পরবর্তী বর্ণনাকারী বাদ পড়েছেন, তাকে মুরসাল হাদিস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত-তাহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا سَقَطَ مِنْ آخِرِ إِسْنَادِهِ مَنْ بَعْدَ التَّابِعِيِّ</div></div><p>অর্থ: যে হাদিসের সনদের শেষাংশ থেকে তাবেয়ির পরবর্তী বর্ণনাকারী বাদ পড়েছেন, তাকে মুরসাল হাদিস বলে।</p><div class=\"h hs hs2\">উদাহরণ :</div><p>কোনো তাবেয়ি যদি এভাবে বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ رَسُولُ اللَّهِ ﷺ</div></div><p>অর্থ: রাসুলুল্লাহ (সা.) বলেছেন।</p><p>এখানে তাবেয়ি ও রাসুলুল্লাহ (সা.)-এর মধ্যবর্তী সাহাবির নাম উল্লেখ করা হয়নি। তাই এ ধরনের বর্ণনাকে মুরসাল হাদিস বলা হয়।</p><div class=\"h hm\">মুরসাল হাদিসের হুকুম</div><p>মুরসাল হাদিসের গ্রহণযোগ্যতা সম্পর্কে মুহাদ্দিস ও ফকিহদের মধ্যে মতপার্থক্য রয়েছে। কেউ একে শরিয়তের দলিল হিসেবে গ্রহণ করেছেন, আবার কেউ একে দুর্বল হাদিস হিসেবে গণ্য করেছেন। এ বিষয়ে প্রধান ইমামগণের মতামত নিম্নে তুলে ধরা হলো।</p><div class=\"h hs\">১। ইমাম আবু হানিফা (রহ.)-এর মত :</div><p>ইমাম আবু হানিফা (রহ.)-এর মতে, নির্ভরযোগ্য ও বিশ্বস্ত তাবেয়ির বর্ণিত মুরসাল হাদিস গ্রহণযোগ্য এবং শরিয়তের দলিল হিসেবে ব্যবহারযোগ্য। কারণ, তাবেয়িগণ সাধারণত নির্ভরযোগ্য সাহাবিদের কাছ থেকেই হাদিস বর্ণনা করতেন। তাই বিশ্বস্ত বর্ণনাকারীর মুরসাল হাদিসকে তিনি গ্রহণযোগ্য মনে করেন।</p><div class=\"h hs\">২। ইমাম মালিক (রহ.)-এর মত :</div><p>ইমাম মালিক (রহ.)-এর মতে, মুরসাল হাদিস গ্রহণযোগ্য এবং তা শরিয়তের দলিল হিসেবে প্রমাণযোগ্য। তাঁর মতে, নির্ভরযোগ্য বর্ণনাকারীর মুরসাল হাদিস গ্রহণে কোনো বাধা নেই। তিনি মুরসাল হাদিসের ওপর আমল করাকে বৈধ মনে করেন।</p><div class=\"h hs\">৩। ইমাম শাফেয়ি (রহ.)-এর মত :</div><p>ইমাম শাফেয়ি (রহ.)-এর মতে, মুরসাল হাদিস নিঃশর্তভাবে গ্রহণযোগ্য নয়। তবে কিছু শর্ত পূরণ হলে তা গ্রহণযোগ্য হতে পারে। তাঁর মতে, মুরসাল হাদিস গ্রহণের জন্য কয়েকটি বিষয় বিবেচনা করতে হবে—</p><p style=\"padding-left:4px\"><b>ক.</b> মুরসাল বর্ণনাকারী নির্ভরযোগ্য ও বিশ্বস্ত তাবেয়ি হতে হবে।</p><p style=\"padding-left:4px\"><b>খ.</b> অন্য কোনো নির্ভরযোগ্য সূত্রে একই হাদিসের সমর্থন থাকতে হবে।</p><p style=\"padding-left:4px\"><b>গ.</b> অন্য কোনো মুসনাদ হাদিস দ্বারা তার সমর্থন প্রমাণিত হতে হবে।</p><p style=\"padding-left:4px\"><b>ঘ.</b> কোনো সাহাবির বক্তব্য দ্বারা তার সমর্থন পাওয়া যেতে হবে।</p><p style=\"padding-left:4px\"><b>ঙ.</b> অধিকাংশ আলেমের আমল বা মতামত দ্বারা তার সমর্থন থাকতে হবে।</p><p>অতএব, ইমাম শাফেয়ি (রহ.) নির্দিষ্ট শর্তসাপেক্ষে মুরসাল হাদিস গ্রহণযোগ্য বলে মনে করেন।</p><div class=\"h hs\">৪। ইমাম আহমদ ইবনে হাম্বল (রহ.)-এর মত :</div><p>ইমাম আহমদ ইবনে হাম্বল (রহ.)-এর কাছ থেকে মুরসাল হাদিস গ্রহণের ব্যাপারে একাধিক বর্ণনা পাওয়া যায়। তাঁর প্রসিদ্ধ মত অনুযায়ী, নির্ভরযোগ্য তাবেয়ির মুরসাল হাদিস গ্রহণযোগ্য হতে পারে। তবে অন্য কোনো শক্তিশালী দলিল দ্বারা তার বিরোধিতা হলে সে অনুযায়ী সিদ্ধান্ত গ্রহণ করতে হবে।</p><div class=\"h hs\">৫। মুহাদ্দিসগণের মত :</div><p>অধিকাংশ মুহাদ্দিসের মতে, মুরসাল হাদিস মূলত দুর্বল হাদিসের অন্তর্ভুক্ত। কারণ, তাবেয়ি ও রাসুলুল্লাহ (সা.)-এর মধ্যবর্তী বর্ণনাকারীর নাম উল্লেখ করা হয় না। ফলে বাদ পড়া বর্ণনাকারী নির্ভরযোগ্য কি না, তা যাচাই করা সম্ভব হয় না। তবে অন্য নির্ভরযোগ্য সনদের মাধ্যমে সমর্থন পাওয়া গেলে এর গ্রহণযোগ্যতা বৃদ্ধি পেতে পারে।</p><div class=\"h hs hs2\">সারকথা :</div><p>মুরসাল হাদিসের গ্রহণযোগ্যতা সম্পর্কে ইমামগণের মধ্যে মতপার্থক্য রয়েছে। ইমাম আবু হানিফা (রহ.) ও ইমাম মালিক (রহ.) নির্ভরযোগ্য বর্ণনাকারীর মুরসাল হাদিসকে গ্রহণযোগ্য মনে করেন। ইমাম শাফেয়ি (রহ.) নির্দিষ্ট শর্তসাপেক্ষে তা গ্রহণ করেন। ইমাম আহমদ (রহ.)-এর কাছ থেকেও এ বিষয়ে একাধিক মত বর্ণিত হয়েছে। অন্যদিকে অধিকাংশ মুহাদ্দিস সনদ বিচ্ছিন্ন হওয়ার কারণে মুরসাল হাদিসকে মূলত দুর্বল হিসেবে গণ্য করেন।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, মুরসাল হাদিস হাদিসশাস্ত্রের একটি গুরুত্বপূর্ণ বিষয়। এর গ্রহণযোগ্যতা নির্ভর করে বর্ণনাকারীর বিশ্বস্ততা, সনদের অবস্থা এবং অন্যান্য সমর্থক দলিলের ওপর। ইমামগণের মতপার্থক্য থাকা সত্ত্বেও তাঁরা সবাই হাদিসের বিশুদ্ধতা ও রাসুলুল্লাহ (সা.)-এর সুন্নাহ সংরক্ষণের ব্যাপারে অত্যন্ত সতর্ক ছিলেন।</p>"], ["মুদাল্লাস হাদিস কাকে বলে? এর হুকুম বিস্তারিতভাবে বর্ণনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হাদিসশাস্ত্রে সনদের ধারাবাহিকতা, বর্ণনাকারীদের পরিচয় এবং হাদিস বর্ণনার পদ্ধতির ওপর বিশেষ গুরুত্ব দেওয়া হয়েছে। হাদিসের সনদে কোনো বর্ণনাকারীকে আড়াল করে বা তাঁর পরিচয় অস্পষ্ট করে বর্ণনা করার একটি বিশেষ পদ্ধতিকে তাদলিস বলা হয়। এ পদ্ধতিতে বর্ণিত হাদিসকে মুদাল্লাস হাদিস বলা হয়। হাদিসের বিশুদ্ধতা নির্ণয়ের ক্ষেত্রে মুদাল্লাস হাদিসের বিশেষ গুরুত্ব রয়েছে। নিম্নে মুদাল্লাস হাদিসের পরিচয়, সংজ্ঞা ও এর হুকুম আলোচনা করা হলো।</p><div class=\"h hm\">মুদাল্লাস হাদিসের পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُدَلَّسٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">تَدْلِيْسٌ</span> মাসদার থেকে নির্গত। এটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">دَلَّسَ</span> শব্দের <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">اسم مفعول</span>। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> গোপন করা।</p><p style=\"padding-left:4px\"><b>২।</b> আড়াল করা।</p><p style=\"padding-left:4px\"><b>৩।</b> অস্পষ্ট করা।</p><p style=\"padding-left:4px\"><b>৪।</b> প্রতারণা করা।</p><p style=\"padding-left:4px\"><b>৫।</b> ত্রুটি গোপন রাখা।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে মুদাল্লাস হাদিস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِخْفَاءُ عَيْبٍ فِي الْإِسْنَادِ وَتَحْسِينُ ظَاهِرِهِ</div></div><p>অর্থ: সনদের কোনো ত্রুটি গোপন করে বাহ্যিকভাবে সনদকে সুন্দর ও নির্ভরযোগ্য হিসেবে উপস্থাপন করাকে তাদলিস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">التَّدْلِيسُ هُوَ إِخْفَاءُ عَيْبٍ فِي الْإِسْنَادِ وَتَحْسِينُ ظَاهِرِهِ</div></div><p>অর্থ: সনদের কোনো ত্রুটি গোপন করে বাহ্যিকভাবে সনদকে সুন্দর ও গ্রহণযোগ্য হিসেবে প্রকাশ করাকে তাদলিস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত-তাহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِخْفَاءُ عَيْبٍ فِي الْإِسْنَادِ وَتَحْسِينُ ظَاهِرِهِ</div></div><p>অর্থ: সনদের কোনো ত্রুটি গোপন করে তার বাহ্যিক রূপকে সুন্দরভাবে উপস্থাপন করাকে তাদলিস বলে।</p><div class=\"h hs hs2\">উদাহরণ :</div><p>কোনো বর্ণনাকারী যদি এমন একজন শায়খের কাছ থেকে হাদিস বর্ণনা করেন, যার কাছ থেকে তিনি কিছু হাদিস শুনেছেন; কিন্তু আলোচ্য হাদিসটি সরাসরি শোনেননি, অথচ তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">عَنْ فُلَانٍ</div></div><p>অর্থ: অমুক ব্যক্তি থেকে বর্ণিত।</p><p>এভাবে সরাসরি শ্রবণের বিষয়টি স্পষ্ট না করে বর্ণনা করলে তা তাদলিসের অন্তর্ভুক্ত হতে পারে।</p><div class=\"h hm\">মুদাল্লাস হাদিসের হুকুম</div><p>মুদাল্লাস হাদিসের হুকুম নির্ধারণের ক্ষেত্রে মুহাদ্দিসগণ বিশেষ সতর্কতা অবলম্বন করেছেন। কারণ, তাদলিসের মাধ্যমে সনদের প্রকৃত অবস্থা অস্পষ্ট হয়ে যেতে পারে। এ বিষয়ে হুকুমগুলো নিম্নে আলোচনা করা হলো—</p><div class=\"h hs\">১। সরাসরি শ্রবণসূচক শব্দ ব্যবহারের বিধান :</div><p>কোনো মুদাল্লিস বর্ণনাকারী যদি ‘সামিতু’ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">سَمِعْتُ</span>) অর্থাৎ আমি শুনেছি অথবা ‘হাদ্দাসানা’ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدَّثَنَا</span>) অর্থাৎ তিনি আমাদের বর্ণনা করেছেন—এ ধরনের সরাসরি শ্রবণসূচক শব্দ ব্যবহার করেন এবং তা প্রমাণিত হয়, তাহলে তাঁর বর্ণনা গ্রহণযোগ্য হতে পারে। তবে অন্যান্য শর্তও পূরণ হতে হবে।</p><div class=\"h hs\">২। ‘আন’ শব্দে বর্ণনার বিধান :</div><p>কোনো মুদাল্লিস বর্ণনাকারী যদি ‘আন’ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عَنْ</span>) শব্দ ব্যবহার করে হাদিস বর্ণনা করেন, তাহলে তাঁর সরাসরি শ্রবণ প্রমাণিত না হওয়া পর্যন্ত সে বর্ণনা গ্রহণে সতর্কতা অবলম্বন করতে হয়। কারণ, তিনি হাদিসটি সরাসরি না শুনেও এভাবে বর্ণনা করতে পারেন।</p><div class=\"h hs\">৩। তাদলিসুত তাসবিয়াহর বিধান :</div><p>তাদলিসুত তাসবিয়াহ অত্যন্ত নিন্দনীয় ও গুরুতর তাদলিস। কারণ, এতে সনদের মধ্যবর্তী দুর্বল বর্ণনাকারীকে বাদ দিয়ে সনদকে নির্ভরযোগ্য হিসেবে প্রকাশ করা হয়। তাই এ ধরনের বর্ণনা বিশেষভাবে যাচাই করা জরুরি।</p><div class=\"h hs\">৪। তাদলিসুশ শুয়ূখের বিধান :</div><p>তাদলিসুশ শুয়ূখের ক্ষেত্রে বর্ণনাকারী শায়খের পরিচয় অস্পষ্ট করে উপস্থাপন করেন। এতে সনদের ধারাবাহিকতা নষ্ট না হলেও রাবির পরিচয় যাচাই কঠিন হয়ে যায়। তাই শায়খের প্রকৃত পরিচয় জানা এবং তাঁর নির্ভরযোগ্যতা যাচাই করা জরুরি।</p><div class=\"h hs\">৫। মুদাল্লিস বর্ণনাকারীর বর্ণনা গ্রহণের বিধান :</div><p>যেসব বর্ণনাকারী তাদলিসের জন্য পরিচিত, তাঁদের বর্ণিত হাদিস গ্রহণের ক্ষেত্রে মুহাদ্দিসগণ সতর্কতা অবলম্বন করেন। তাঁদের বর্ণনায় সরাসরি শ্রবণ প্রমাণিত হলে তা গ্রহণযোগ্য হতে পারে। অন্যথায় অতিরিক্ত যাচাই প্রয়োজন হয়।</p><div class=\"h hs\">৬। তাদলিসের মাত্রা বিবেচনার বিধান :</div><p>সব মুদাল্লিস বর্ণনাকারী একই পর্যায়ের নন। কারও তাদলিস খুব কম, কারও বেশি এবং কারও তাদলিস গুরুতর পর্যায়ের। তাই মুহাদ্দিসগণ বর্ণনাকারীদের তাদলিসের মাত্রা অনুযায়ী তাঁদের বর্ণনা যাচাই ও মূল্যায়ন করেন।</p><div class=\"h hm\">মুদাল্লিস বর্ণনাকারীদের স্তর</div><p>হাফিজ ইবনে হাজার আসকালানি (রহ.) মুদাল্লিস বর্ণনাকারীদের পাঁচটি স্তরে বিভক্ত করেছেন। যথা—</p><p style=\"padding-left:4px\"><b>১।</b> যাঁদের তাদলিস খুব কম এবং যাঁদের হাদিসের বিশুদ্ধতা সম্পর্কে ইমামগণ একমত।</p><p style=\"padding-left:4px\"><b>২।</b> যাঁদের তাদলিস খুব কম, তবে ইমামগণ তাঁদের হাদিস গ্রহণ করেছেন এবং তাঁদের বর্ণনা সহিহ গ্রন্থেও স্থান পেয়েছে।</p><p style=\"padding-left:4px\"><b>৩।</b> যাঁরা তুলনামূলকভাবে বেশি তাদলিস করেছেন; তবে তাঁদের বর্ণনা সরাসরি শ্রবণের প্রমাণ পাওয়া গেলে গ্রহণযোগ্য হয়।</p><p style=\"padding-left:4px\"><b>৪।</b> যাঁদের তাদলিস বেশি এবং তাঁদের বর্ণনার ক্ষেত্রে বিশেষ সতর্কতা অবলম্বন করা হয়।</p><p style=\"padding-left:4px\"><b>৫।</b> যাঁরা দুর্বল ও অজ্ঞাত বর্ণনাকারীদের কাছ থেকে তাদলিস করেছেন। তাঁদের বর্ণনা সাধারণত গ্রহণযোগ্য নয়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, মুদাল্লাস হাদিস হাদিসশাস্ত্রের একটি গুরুত্বপূর্ণ ও সূক্ষ্ম বিষয়। এর মাধ্যমে সনদের কোনো ত্রুটি বা বর্ণনাকারীর পরিচয় গোপন থাকতে পারে। তাই মুদাল্লাস হাদিস গ্রহণের ক্ষেত্রে বর্ণনাকারীর অবস্থা, সরাসরি শ্রবণের প্রমাণ এবং সনদের ধারাবাহিকতা যাচাই করা অত্যন্ত জরুরি। হাদিসের বিশুদ্ধতা সংরক্ষণে মুহাদ্দিসগণের এ সতর্কতামূলক পদ্ধতি বিশেষ তাৎপর্যপূর্ণ।</p>"], ["মুত্তাসিল, মুনকাতি ও মুয়াল্লাক হাদিস কাকে বলে? এগুলোর সংজ্ঞা ও পার্থক্য আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হাদিসশাস্ত্রে সনদের ধারাবাহিকতা ও বিচ্ছিন্নতার ভিত্তিতে হাদিসকে বিভিন্ন শ্রেণিতে বিভক্ত করা হয়েছে। কোনো হাদিসের সনদ সম্পূর্ণ অবিচ্ছিন্ন থাকলে তাকে মুত্তাসিল হাদিস বলা হয়। আর সনদের কোনো স্থানে বর্ণনাকারী বাদ পড়লে তাকে মুনকাতি বা মুয়াল্লাক হাদিস বলা হয়। নিম্নে এসব হাদিসের পরিচয়, সংজ্ঞা ও পার্থক্য আলোচনা করা হলো।</p><div class=\"h hs\">১। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مُتَّصِلٌ</span> (হাদিসে মুত্তাসিল)</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُتَّصِلٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">اِتِّصَالٌ</span> মাসদার থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সংযুক্ত।</p><p style=\"padding-left:4px\"><b>২।</b> অবিচ্ছিন্ন।</p><p style=\"padding-left:4px\"><b>৩।</b> ধারাবাহিক।</p><p style=\"padding-left:4px\"><b>৪।</b> মিলিত।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে মুত্তাসিল হাদিস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا اتَّصَلَ إِسْنَادُهُ مِنْ أَوَّلِهِ إِلَى مُنْتَهَاهُ</div></div><p>অর্থ: যে হাদিসের সনদ প্রথম থেকে শেষ পর্যন্ত অবিচ্ছিন্ন থাকে, তাকে মুত্তাসিল হাদিস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا سَلِمَ إِسْنَادُهُ مِنَ السُّقُوطِ</div></div><p>অর্থ: যে হাদিসের সনদ বর্ণনাকারী বাদ পড়া থেকে মুক্ত থাকে, তাকে মুত্তাসিল হাদিস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত-তাহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا اتَّصَلَ سَنَدُهُ بِسَمَاعِ كُلِّ رَاوٍ مِمَّنْ فَوْقَهُ</div></div><p>অর্থ: যে হাদিসের সনদে প্রত্যেক বর্ণনাকারী তাঁর ওপরের বর্ণনাকারী থেকে সরাসরি শ্রবণ করেছেন, তাকে মুত্তাসিল হাদিস বলে।</p><div class=\"h hs hs2\">উদাহরণ :</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">عَنْ مَالِكٍ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ عَنِ النَّبِيِّ ﷺ</div></div><p>অর্থ: মালিক (রহ.) নাফি (রহ.) থেকে, তিনি ইবনে উমর (রা.) থেকে এবং তিনি রাসুলুল্লাহ (সা.) থেকে বর্ণনা করেছেন।</p><p>এখানে প্রত্যেক বর্ণনাকারীর মধ্যে সংযোগ প্রমাণিত হলে এটি মুত্তাসিল হাদিসের উদাহরণ।</p><div class=\"h hs\">২। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مُنْقَطِعٌ</span> (হাদিসে মুনকাতি)</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُنْقَطِعٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">اِنْقِطَاعٌ</span> মাসদার থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> বিচ্ছিন্ন।</p><p style=\"padding-left:4px\"><b>২।</b> বিচ্ছেদকৃত।</p><p style=\"padding-left:4px\"><b>৩।</b> ছিন্ন।</p><p style=\"padding-left:4px\"><b>৪।</b> ধারাবাহিকতাহীন।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে মুনকাতি হাদিস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا لَمْ يَتَّصِلْ إِسْنَادُهُ</div></div><p>অর্থ: যে হাদিসের সনদ অবিচ্ছিন্ন নয়, তাকে মুনকাতি হাদিস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا سَقَطَ مِنْ إِسْنَادِهِ رَاوٍ وَاحِدٌ أَوْ أَكْثَرُ مِنْ غَيْرِ تَوَالٍ</div></div><p>অর্থ: যে হাদিসের সনদ থেকে একজন অথবা একাধিক বর্ণনাকারী ধারাবাহিকভাবে নয়, বরং পৃথক পৃথক স্থানে বাদ পড়েছেন, তাকে মুনকাতি হাদিস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত-তাহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا سَقَطَ مِنْ إِسْنَادِهِ رَاوٍ قَبْلَ الصَّحَابِيِّ</div></div><p>অর্থ: যে হাদিসের সনদ থেকে সাহাবির পূর্বে কোনো একজন বর্ণনাকারী বাদ পড়েছেন, তাকে মুনকাতি হাদিস বলে।</p><div class=\"h hs hs2\">উদাহরণ :</div><p>যদি কোনো তাবেয়ি সরাসরি রাসুলুল্লাহ (সা.) থেকে হাদিস বর্ণনা করেন এবং মাঝখানে সাহাবির নাম উল্লেখ না করেন, তাহলে তা সনদ বিচ্ছিন্ন হওয়ার একটি উদাহরণ।</p><div class=\"h hs\">৩। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مُعَلَّقٌ</span> (হাদিসে মুয়াল্লাক)</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُعَلَّقٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">تَعْلِيقٌ</span> মাসদার থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> ঝুলন্ত।</p><p style=\"padding-left:4px\"><b>২।</b> ঝুলিয়ে রাখা।</p><p style=\"padding-left:4px\"><b>৩।</b> সংযুক্তিহীন।</p><p style=\"padding-left:4px\"><b>৪।</b> ঝুলন্ত অবস্থায় রাখা।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p>পারিভাষিকভাবে মুয়াল্লাক হাদিস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا حُذِفَ مِنْ أَوَّلِ إِسْنَادِهِ رَاوٍ فَأَكْثَرُ</div></div><p>অর্থ: যে হাদিসের সনদের শুরু থেকে একজন বা একাধিক বর্ণনাকারী বাদ পড়েছেন, তাকে মুয়াল্লাক হাদিস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا حُذِفَ مِنْ مَبْدَإِ إِسْنَادِهِ رَاوٍ فَأَكْثَرُ</div></div><p>অর্থ: যে হাদিসের সনদের প্রারম্ভ থেকে একজন বা একাধিক বর্ণনাকারী বাদ দেওয়া হয়েছে, তাকে মুয়াল্লাক হাদিস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত-তাহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا حُذِفَ مِنْ أَوَّلِ إِسْنَادِهِ رَاوٍ فَأَكْثَرُ عَلَى التَّوَالِي</div></div><p>অর্থ: যে হাদিসের সনদের শুরু থেকে ধারাবাহিকভাবে একজন বা একাধিক বর্ণনাকারী বাদ দেওয়া হয়েছে, তাকে মুয়াল্লাক হাদিস বলে।</p><div class=\"h hs hs2\">উদাহরণ :</div><p class=\"bh\"><b>ইমাম বুখারি (রহ.) তাঁর সহিহ বুখারিতে কোনো কোনো স্থানে বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ ابْنُ عَبَّاسٍ</div></div><p>অর্থ: ইবনে আব্বাস (রা.) বলেছেন।</p><p>এখানে ইমাম বুখারি (রহ.) ও ইবনে আব্বাস (রা.)-এর মধ্যবর্তী বর্ণনাকারীদের উল্লেখ না করে সরাসরি সাহাবির নাম উল্লেখ করা হয়েছে। এটি মুয়াল্লাক বর্ণনার উদাহরণ।</p><div class=\"h hm\">মুত্তাসিল, মুনকাতি ও মুয়াল্লাক হাদিসের মধ্যে পার্থক্য</div><div class=\"h hs\">১। সনদের ধারাবাহিকতার দিক থেকে :</div><p>মুত্তাসিল হাদিসের সনদ প্রথম থেকে শেষ পর্যন্ত অবিচ্ছিন্ন থাকে। অন্যদিকে মুনকাতি ও মুয়াল্লাক হাদিসের সনদে এক বা একাধিক বর্ণনাকারী বাদ পড়েন।</p><div class=\"h hs\">২। বর্ণনাকারী বাদ পড়ার অবস্থানের দিক থেকে :</div><p>মুত্তাসিল হাদিসে কোনো বর্ণনাকারী বাদ পড়েন না। মুনকাতি হাদিসে সনদের মধ্যবর্তী স্থানে বর্ণনাকারী বাদ পড়েন। পক্ষান্তরে মুয়াল্লাক হাদিসে সনদের শুরু থেকে বর্ণনাকারী বাদ পড়েন।</p><div class=\"h hs\">৩। সনদের বিচ্ছিন্নতার দিক থেকে :</div><p>মুত্তাসিল হাদিসে সনদের কোনো বিচ্ছিন্নতা থাকে না। মুনকাতি হাদিসে সনদের মাঝখানে বিচ্ছিন্নতা দেখা যায়। আর মুয়াল্লাক হাদিসে সনদের প্রারম্ভে বিচ্ছিন্নতা দেখা যায়।</p><div class=\"h hs\">৪। সংজ্ঞাগত দিক থেকে :</div><p>মুত্তাসিল হাদিসের মূল বৈশিষ্ট্য হলো সনদের অবিচ্ছিন্নতা। মুনকাতি হাদিসের মূল বৈশিষ্ট্য হলো সনদের মধ্যবর্তী স্থানে বিচ্ছিন্নতা। আর মুয়াল্লাক হাদিসের মূল বৈশিষ্ট্য হলো সনদের শুরুতে এক বা একাধিক বর্ণনাকারী বাদ পড়া।</p><div class=\"h hs\">৫। উদাহরণের দিক থেকে :</div><p>মুত্তাসিল হাদিসে প্রত্যেক বর্ণনাকারীর মাধ্যমে ধারাবাহিকভাবে হাদিস বর্ণিত হয়। মুনকাতি হাদিসে সনদের মাঝখানে কোনো বর্ণনাকারী অনুপস্থিত থাকেন। আর মুয়াল্লাক হাদিসে সংকলক তাঁর সনদের শুরুতে এক বা একাধিক বর্ণনাকারীর নাম উল্লেখ করেন না।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, মুত্তাসিল, মুনকাতি ও মুয়াল্লাক হাদিসের মধ্যে মূল পার্থক্য হলো সনদের ধারাবাহিকতা ও বিচ্ছিন্নতার অবস্থান। মুত্তাসিল হাদিসের সনদ অবিচ্ছিন্ন থাকে, মুনকাতি হাদিসের সনদের মধ্যবর্তী স্থানে বিচ্ছিন্নতা থাকে এবং মুয়াল্লাক হাদিসের সনদের শুরুতে বিচ্ছিন্নতা থাকে। হাদিসের সনদ ও বিশুদ্ধতা নির্ণয়ের ক্ষেত্রে এ তিন প্রকারের পরিচয় ও পার্থক্য জানা অত্যন্ত গুরুত্বপূর্ণ।</p>"]]}]}, "dv": ["হাদিসের অনুবাদ", "রচনামূলক প্রশ্ন", "সংক্ষিপ্ত প্রশ্ন"], "ex": "2026-11-09"}, {"n": "ইসলামিক স্টাডিজ ৩য় পত্র", "c": "#F43F5E", "k": "ই৩", "d": {"রচনামূলক প্রশ্ন": [{"n": "রচনামূলক", "c": "#F43F5E", "q": [["ইসলামের সংজ্ঞা দাও। অতপর ইসলামের রুকনসমূহ আলোচনা কর।", ""], ["ইসলামের পরিচয় দাও। আর্থসামাজিক সমস্যা সমাধানে ইসলামের ভূমিকা লিপিবদ্ধ কর।", ""], ["আভিধানিক ও শরয়ী দৃষ্টিকোণ থেকে ইসলাম এর পরিচয় দাও। অতপর ইসলাম ও অন্যান্য আসমানি ধর্মসমূহের তুলনামূলক আলোচনা কর।", ""], ["আল্লাহর বাণী ان الدين عند الله الاسلام এর আলোকে অন্যান্য ধর্মের উপর ইসলামের শ্রেষ্ঠত্ব সম্পর্কে আলোচনা কর।", ""], ["তাওহীদ অর্থ কি? তা কত প্রকার? মানবজীবনে তাওহীদের গুরুত্ব বিশদভাবে বর্ণনা কর।", ""], ["আকিদা অর্থ কি? ঈমান, আকিদা ও কালাম এর মধ্যে পার্থক্য কি? ইসলামি আকিদার মূল উৎসসমূহ এবং গুরুত্ব সংক্ষেপে লিখ।", ""], ["শিরকের পরিচয় বর্ণনা কর। শিরকের কারণ বর্ণনাপূর্বক সমাজে প্রচলিত বিভিন্ন প্রকারের শিরক সম্পর্কে আলোচনা কর।", ""], ["আল্লাহ তায়ালার বাণী ان الشرك لظلم عظيم এর বিশদভাবে ব্যাখ্যা কর।", ""], ["মুহাম্মদ স. এর রিসালাতের প্রতি বিশ্বাস স্থাপনের উদ্দেশ্য কি? তার রিসালাতের প্রতি বিশ্বাসের বিভিন্ন দিকের বিস্তারিত আলোচনা কর।", ""], ["নবুওয়াত ও রিসালাতের পরিচয় দাও। রাসূলগণকে প্রেরণ করার হেকমত কি? প্রমাণ কর যে, মুহাম্মদ স. সর্বশেষ ও সর্বশ্রেষ্ঠ নবী।", ""], ["হুকুমসহ সালাতের ফরজ, ওয়াজিব, সুন্নত ও মুস্তাহাবসমূহ লেখ।", ""], ["সালাত এর সংজ্ঞা দাও? ব্যক্তি ও সমাজ জীবনে এর প্রভাব বর্ণনাসহ এবং আধ্যাত্মিক গুরুত্ব লেখ।", ""], ["পাঁচ ওয়াক্ত সালাতের দলিলসহ পরিচয় দাও। ব্যক্তি ও সমাজ জীবনে সালাতের প্রভাব বর্ণনাপূর্বক এর আধ্যাত্মিক গুরুত্ব লেখ।", ""], ["সাওমের আভিধানিক ও পারিভাষিক অর্থ কি? উহা কত প্রকার ও কি কি? ইসলামে সিয়াম সাধনার গুরুত্ব বর্ণনা কর।", ""], ["সাওমের সংজ্ঞা দাও। তা কত প্রকার ও কি কি? ইসলামে সিয়াম সাধনার গুরুত্ব বর্ণনা কর।", ""], ["যাকাতের আভিধানিক ও শরয়ী অর্থ কি? যাকাতের খাতসমূহ উল্লেখপূর্বক এর অ
