িলেন। তিনি দামেস্কে বিশ্ববিখ্যাত উমাইয়া মসজিদ (গ্র্যান্ড মসজিদ) নির্মাণ করেন এবং মদিনার মসজিদে নববী পুনর্নির্মাণ ও সম্প্রসারণ করেন। তাঁর জনহিতকর কাজগুলো প্রজাদের মনে এমন আনুগত্য তৈরি করেছিল যে, তারা রাজকোষে নিয়মিত কর প্রদান করত এবং রাজ্য বিস্তারে সর্বাত্মক সহযোগিতা করত।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, খলিফা আল-ওয়ালিদের শাসনামলে উমাইয়া সাম্রাজ্য তার সোনালী শিখরে পৌঁছায়। তারিক বিন জিয়াদ, কুতুবাই বিন মুসলিম এবং মুহাম্মদ বিন কাসিমের মতো প্রতিভাবান সেনাপতিদের সঠিক মূল্যায়ন এবং আল-ওয়ালিদের নিখুঁত সামরিক পরিকল্পনার ফলেই স্পেন থেকে শুরু করে সিন্ধু নদ পর্যন্ত বিশাল ভূখণ্ড ইসলামী সাম্রাজ্যের অন্তর্ভুক্ত হয়েছিল। তাঁর এই সুদূরপ্রসারী রাজ্য বিস্তার কেবল রাজনৈতিক সীমানাই বাড়ায়নি, বরং বিশ্ব সভ্যতার ইতিহাসে ইসলামি সংস্কৃতি, বিজ্ঞান ও জ্ঞান-বিজ্ঞানের বহুমুখী প্রচার ও প্রসারে এক যুগান্তকারী ভূমিকা পালন করেছিল।</p>"],["আব্বাসীয় শাসনামলে বার্মাকীদের উত্থান ও পতনের ইতিহাস লিখ।","<div class=\"h\">ভূমিকা</div><p>আব্বাসীয় খিলাফতের সূচনালগ্ন থেকে শুরু করে খলিফা হারুন অর রশীদের শাসনামল পর্যন্ত মুসলিম বিশ্বের রাজনীতি, প্রশাসন এবং সংস্কৃতির ইতিহাসে যে পরিবারটি সবচেয়ে বেশি প্রভাব বিস্তার করেছিল, তা হলো বার্মাকী পরিবার বা বার্মাকীরা (The Barmakids)। পারস্যের বালখ অঞ্চলের বৌদ্ধ বিহারের মহাযাজক বংশ থেকে ইসলাম ধর্মে দীক্ষিত হয়ে এই পরিবারটি আব্বাসীয় রাজদরবারে এমন এক অলৌকিক উত্থান ঘটিয়েছিল যে, তারা একপর্যায়ে খলিফার চেয়েও বেশি ক্ষমতা ও প্রভাবের অধিকারী হয়ে ওঠে। কিন্তু অতিরিক্ত ক্ষমতা, সম্পদের পাহাড় গড়া এবং রাজনৈতিক উচ্চাভিলাষের পরিণতিতে খলিফা হারুন অর রশীদের একটি মাত্র আদেশে এই প্রভাবশালী পরিবার রাতারাতি ধ্বংস ও উচ্ছেদ হয়ে যায়। আব্বাসীয় ইতিহাসের অন্যতম রোমাঞ্চকর এই বার্মাকীদের উত্থান ও পতনের ইতিহাস নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">বার্মাকীদের পরিচয় ও আব্বাসীয় দরবারে উত্থান</div><p>বার্মাকী পরিবারের মূল আদি নিবাস ছিল বর্তমান আফগানিস্তানের বালখ শহরে। ইসলাম পূর্ব যুগে তাদের পূর্বপুরুষরা বালখের বিখ্যাত বৌদ্ধ মঠ 'নবহিহার' (Nava Vihara)-এর প্রধান পুরোহিত বা 'বারমাক' উপাধিতে ভূষিত ছিলেন। এই 'বারমাক' শব্দ থেকেই তাদের বংশের নাম 'বার্মাকী' হিসেবে পরিচিতি লাভ করে।</p><p><b>১. আব্বাসীয়দের সাথে মিত্রতা:</b> উমাইয়া শাসনের শেষভাগে এবং আব্বাসীয় বিপ্লবের সূচনালগ্নে এই পরিবারটি ইসলাম ধর্ম গ্রহণ করে এবং আব্বাসীয় খিলাফতের প্রতিষ্ঠাতা আল-সাফাহ ও পরবর্তী খলিফা আল-মনসুরের বিশ্বস্ত ও ঘনিষ্ঠ মিত্র হয়ে ওঠে। বিশেষ করে পরিবারের প্রধান খালিদ ইবনে বারমাক সামরিক ও প্রশাসনিক দক্ষতার মাধ্যমে খলিফা আল-মনসুরের আস্থা অর্জন করেন। খালিদ ইবনে বারমাক বস্রার গভর্নর এবং পরে রাষ্ট্রের অর্থমন্ত্রী (দীوان) হিসেবে অত্যন্ত সততা ও দক্ষতার সাথে দায়িত্ব পালন করেন।</p><p><b>২. হারুন অর রশীদের আমলে চরম উৎকর্ষ:</b> খালিদের পুত্র ইয়াহিয়া ইবনে খালিদ বার্মাকী আব্বাসীয় রাজদরবারে ক্ষমতার কেন্দ্রবিন্দুতে চলে আসেন। যখন হারুন অর রশীদ অপ্রাপ্তবয়স্ক অবস্থায় খিলাফতের উত্তরাধিকারী হন, তখন ইয়াহিয়া ইবনে খালিদকে তাঁর অভিভাবক ও শিক্ষক হিসেবে নিয়োগ করা হয়। হারুন অর রশীদ খলিফা হওয়ার পর ইয়াহিয়াকে তাঁর সর্বময় ক্ষমতার অধিকারী 'উজির' বা প্রধানমন্ত্রী হিসেবে নিয়োগ করেন। ইয়াহিয়া অত্যন্ত বিচক্ষণতার সাথে পুরো সাম্রাজ্য পরিচালনা করতে শুরু করেন।</p><p><b>৩. ক্ষমতার পরিধি বিস্তার (জাফর ও ফজল):</b> ইয়াহিয়া বার্মাকীর দুই সুযোগ্য পুত্র—জাফর বার্মাকী এবং ফজল বার্মাকী—খিলাফতের বিভিন্ন গুরুত্বপূর্ণ সামরিক ও প্রশাসনিক পদে আসীন হন। জাফর বার্মাকী খলিফার সবচেয়ে প্রিয়পাত্র ও বন্ধুতে পরিণত হন এবং বাগদাদের প্রকৃত চালিকাশক্তি হয়ে ওঠেন। ফজল বার্মাকী পূর্বের বিশাল খোরাসান অঞ্চলের গভর্নর হিসেবে শান্তি ফিরিয়ে আনেন এবং প্রভূত জনপ্রিয়তা অর্জন করেন। একপর্যায়ে আব্বাসীয় সাম্রাজ্যের সীলমোহর, কোষাগার, সেনাবাহিনী এবং নীতিনির্ধারণী সব ক্ষমতা এই বার্মাকী পরিবারের হাতের মুঠোয় চলে আসে।</p><div class=\"h\">বার্মাকীদের অবদান ও খ্যাতির কারণ</div><p>বার্মাকীরা কেবল ক্ষমতার লোভী ছিল না; আব্বাসীয় সভ্যতার স্বর্ণযুগ গঠনে তাদের অপরিসীম ও গঠনমূলক অবদান ছিল:</p><p><b>১. প্রশাসনিক সংস্কার ও অর্থনৈতিক সমৃদ্ধি:</b> বার্মাকীরা অত্যন্ত দক্ষ প্রশাসক ছিলেন। তারা পারসিক প্রশাসনিক মডেলের আদলে আব্বাসীয় কেন্দ্রীয় প্রশাসনকে ঢেলে সাজান। ডাক ব্যবস্থা (বারিড), কর আদায় পদ্ধতি এবং গোয়েন্দা বিভাগকে তারা অত্যন্ত আধুনিক ও দুর্নীতিমুক্ত করেছিলেন। তাদের সময়ে রাষ্ট্রের কোষাগার উপচে পড়া সম্পদে ভরে উঠেছিল।</p><p><b>২. জ্ঞান-বিজ্ঞান ও সংস্কৃতির পৃষ্ঠপোষকতা:</b> বার্মাকীরা শিক্ষা, সাহিত্য, চিকিৎসা এবং দর্শনের বিশাল পৃষ্ঠপোষক ছিলেন। গ্রিক, পারসিক ও ভারতীয় বিভিন্ন বিজ্ঞান ও দর্শনের গ্রন্থ আরবিতে অনুবাদের পেছনে তারা প্রচুর অর্থ ব্যয় করেন। বিখ্যাত 'বায়তুল হিকমা' প্রতিষ্ঠার পেছনেও এই পরিবারের পরোক্ষ বুদ্ধিমত্তা ও সহায়তা ছিল।</p><p><b>৩. উদারতা ও জনহিতকর কাজ:</b> তারা বাগদাদ শহরকে পৃথিবীর সবচেয়ে সুন্দর ও জমকালো রাজধানীতে রূপান্তর করতে বড় ভূমিকা রাখেন। মসজিদ, হাসপাতাল, সেতু, সরাইখানা এবং দরিদ্রদের কল্যাণে বহু দাতব্য প্রতিষ্ঠান তারা স্থাপন করেছিলেন। সাধারণ মানুষের কাছে তারা অত্যন্ত দানশীল ও জনপ্রিয় ছিলেন।</p><div class=\"h\">বার্মাকীদের পতনের কারণসমূহ</div><p>অতিরিক্ত ক্ষমতা, অহংকার এবং চারপাশের শত্রুদের ষড়যন্ত্রের ফলশ্রুতিতে এই শক্তিশালী পরিবারের পতন অনিবার্য হয়ে পড়েছিল। পতন ঘটার পেছনে প্রধান কারণগুলো ছিল:</p><p><b>১. অতিরিক্ত ক্ষমতা ও খলিফার ওপর আধিপত্য:</b> বার্মাকীরা এতটাই ক্ষমতাশালী হয়ে উঠেছিল যে, খলিফা হারুন অর রশীদের অনুমতি ছাড়াই তারা সরকারি পদগুলোতে নিজেদের লোক নিয়োগ ও বরখাস্ত করতে শুরু করে। রাজকোষের চাবি তাদের হাতে থাকায় খলিফাকেও অনেক সময় অর্থের জন্য তাদের ওপর নির্ভর করতে হতো, যা স্বাধীনচেতা খলিফা হারুন অর রশীদ সহজভাবে মেনে নিতে পারেননি।</p><p><b>২. গোপন শত্রু ও আরব অভিজাতদের ঈর্ষা:</b> বার্মাকীরা মূলত পারসিক (অনারব) বংশোদ্ভূত ছিল। আব্বাসীয় রাজদরবারের প্রাচীন আরব গোত্রীয় অভিজাতরা বার্মাকীদের এই উত্থান ও পারসিক সংস্কৃতির প্রাধান্যকে চরমভাবে ঘৃণা করত। তারা খলিফার কানে প্রতিনিয়ত বার্মাকীদের বিরুদ্ধে বিশ্বাসঘাতকতা ও ক্ষমতা দখলের মিথ্যা ষড়যন্ত্রের গল্প রটাতে থাকে।</p><p><b>৩. জাফর বার্মাকী ও আব্বাসার গোপন বিয়ের গুঞ্জন:</b> বার্মাকীদের পতনের তাৎক্ষণিক ও সবচেয়ে বড় কারণ হিসেবে ঐতিহাসিকরা খলিফা হারুন অর রশীদের বোন আব্বাসা এবং জাফর বার্মাকীর গোপন বিবাহের কাহিনীকে উল্লেখ করেন। খলিফা হারুন অর রশীদ বিনোদন ও একান্ত আলাপের জন্য বোন আব্বাসা ও বন্ধু জাফরকে সবসময় কাছে রাখতে চাইতেন। কিন্তু তাদের এই মেলামেশা নিয়ে রাজদরবারে নানা কুৎসিত গুজব ছড়িয়ে পড়ে, যা খলিফার পারিবারিক সম্মান ও অহংকারে চরম আঘাত হানে।</p><p><b>৪. শিয়া মতাদর্শের প্রতি সহানুভূতি:</b> বার্মাকীরা গোপনে শিয়া পন্থী বা আলিদ বংশের প্রতি কিছুটা সহানুভূতিশীল ছিল এবং কোনো কোনো বিদ্রোহী বন্দীকে গোপনে মুক্তি দিয়ে দিয়েছিল—এমন অভিযোগও খলিফার কাছে পৌঁছায়, যা তাদের রাষ্ট্রদ্রোহী হিসেবে চিহ্নিত করতে সহায়তা করে।</p><div class=\"h\">বার্মাকীদের করুণ পতন (৮০৩ খ্রিস্টাব্দ)</div><p>৮০৩ খ্রিস্টাব্দের এক রাতে খলিফা হারুন অর রশীদ হঠাৎ করেই বার্মাকীদের বিরুদ্ধে কঠোর পদক্ষেপ নেওয়ার চূড়ান্ত সিদ্ধান্ত নেন। কোনো পূর্ব সতর্কতা ছাড়াই খলিফার বিশেষ আদেশে জাফর বার্মাকীকে হঠাৎ গ্রেপ্তার করে হত্যা করা হয় এবং তাঁর মৃতদেহ টুকরো টুকরো করে বাগদাদের সেতুর ওপর ঝুলিয়ে রাখা হয়। একই সাথে বয়োবৃদ্ধ উজির ইয়াহিয়া বার্মাকী এবং ফজল বার্মাকীকে বন্দি করে কারাগারে নিক্ষেপ করা হয়। বার্মাকী পরিবারের সমস্ত সম্পত্তি বাজোপ্ত করা হয় এবং তাদের অনুসারীদের সরকারি পদ থেকে বরখাস্ত করা হয়। রাতারাতি বিশ্বের সবচেয়ে প্রভাবশালী ও ধনী এই পরিবারটি সম্পূর্ণ ধ্বংস ও নিশ্চিহ্ন হয়ে যায়।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, আব্বাসীয় রাজদরবারে বার্মাকীদের উত্থান যেমন রূপকথার মতো অবিশ্বাস্য ছিল, তাদের পতনও ছিল তেমনই মর্মান্তিক ও আকস্মিক। তারা যদি ক্ষমতার মোহে অন্ধ না হয়ে খলিফার সাথে বিশ্বাসের সম্পর্ক বজায় রাখত, তবে হয়তো আব্বাসীয় ইতিহাস অন্যরকম হতে পারত। অতিরিক্ত ক্ষমতা, অহংকার এবং রাজনৈতিক দূরদর্শিতার অভাবেই এই গৌরবোজ্জ্বল পরিবারের করুণ পরিণতি ঘটেছিল, যা ইতিহাসে \"বার্মাকীদের পতন\" নামে চিরকাল স্মরণীয় হয়ে আছে।</p>"]]}]},"dv":["প্রশ্নসমূহ"],"need":5,"ex":"2026-10-25"},{"n":"ইসলামের ইতিহাস ২য় পত্র","c":"#0284C7","k":"ই২","d":{"প্রশ্নসমূহ":[{"n":"ইতিহাস","c":"#0284C7","q":[["সুলতানি আমলে ভারতের ইতিহাস অধ্যায়নের উৎসসমূহ আলোচনা কর।","<div class=\"h\">ভূমিকা</div><p>দ্বাদশ শতাব্দীর শেষভাগ থেকে ষোড়শ শতাব্দীর প্রথমভাগ পর্যন্ত (১২০৬–১৫২৬ খ্রিস্টাব্দ) ভারতের ইতিহাসে 'সুলতানি আমল' নামে একটি অত্যন্ত গুরুত্বপূর্ণ অধ্যায় বিরাজমান ছিল। দিল্লির মসনদে তুর্কী, আফগান ও খলজি রাজবংশের সুদীর্ঘ তিন শতাধিক বছরের এই শাসনকালে ভারতীয় উপমহাদেশের রাজনৈতিক, সামাজিক, অর্থনৈতিক ও সাংস্কৃতিক ক্ষেত্রে এক বিশাল রূপান্তর ঘটেছিল। এই যুগের সুদূরপ্রসারী ইতিহাস সঠিকভাবে ও নির্ভুলভাবে জানার জন্য আমাদের নির্ভরযোগ্য ঐতিহাসিক উপাত্ত বা উপাদানের ওপর নির্ভর করতে হয়। সুলতানি আমলের ইতিহাস অধ্যয়নের উৎসগুলোকে প্রধানত দুটি ভাগে ভাগ করা যায়—সাহিত্যিক বা লিখিত উৎস এবং প্রত্নতাত্ত্বিক বা উপাদানগত উৎস। নিচে এই উৎসসমূহ বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">ক. সাহিত্যিক বা লিখিত উৎস (Literary Sources)</div><p>সুলতানি আমলের ইতিহাস রচনার ক্ষেত্রে পারস্য ভাষায় রচিত ঐতিহাসিক গ্রন্থগুলো প্রধান ভিত্তি হিসেবে কাজ করেছে। সেকালের রাজদরবারের পন্ডিত, সুফি-সাধক এবং ভ্রমণকারীরা সেই সময়ের রাজনৈতিক ও সামাজিক জীবনের জীবন্ত দলিল রেখে গেছেন:</p><p><b>১. মিনহাজ-উস-সিরাজ ও 'তবকাত-ই-নাসিরী':</b> সুলতানি আমলের প্রারম্ভিক পর্ব জানার জন্য মিনহাজ-উস-সিরাজ রচিত 'তবকাত-ই-নাসিরী' একটি অমূল্য গ্রন্থ। সুলতান নাসিরুদ্দিন মাহমুদের নামানুসারে এই গ্রন্থের নামকরণ করা হয়। এতে মোহাম্মদ ঘুরি ও কুতুবউদ্দিন আইবেক থেকে শুরু করে ১২৬০ খ্রিস্টাব্দ পর্যন্ত দিল্লির প্রাথমিক সুলতদের শাসনকাল, ইখতিয়ার উদ্দিন মোহাম্মদ বিন বখতিয়ার খিলজির বাংলা বিজয় এবং প্রাথমিক তুর্কী শাসকদের রাজনৈতিক উত্থান-পতনের প্রামাণিক বিবরণ পাওয়া যায়।</p><p><b>২. জিয়াউদ্দিন বরুনী ও 'তারিখ-ই-ফিরোজ শাহী':</b> সুলতানি আমলের খলজি ও তুঘলক বংশের ইতিহাস জানার জন্য জিয়াউদ্দিন বরুনীর 'তারিখ-ই-ফিরোজ শাহী' অন্যতম সেরা উৎস। বরুনী কেবল ঘটনার কালানুক্রমিক বিবরণই দেননি, বরং সুলতদের অর্থনৈতিক নীতি, বাজার নিয়ন্ত্রণ নীতি (আলাউদ্দিন খলজির), মুহাম্মদ বিন তুঘলকের অদ্ভুত পরিকল্পনা এবং সেকালের সাধারণ মানুষের জীবনযাত্রার এক বাস্তবসম্মত ও সমালোচনামূলক চিত্র তুলে ধরেছেন।</p><p><b>৩. শামস-ই-সিরাজ আফিফ ও 'তারিখ-ই-ফিরোজ শাহী':</b> ফিরোজ শাহ তুঘলকের আমলের বিস্তারিত ইতিহাস জানার জন্য আফিফের এই গ্রন্থটি অত্যন্ত গুরুত্বপূর্ণ। এতে ফিরোজ শাহ তুঘলকের জনহিতকর কাজ, সেচব্যবস্থা, কর সংস্কার এবং জনকল্যাণমূলক কর্মকাণ্ডের ভূয়সী প্রশংসা ও বিবরণ পাওয়া যায়।</p><p><b>৪. আমির খসরুর রচনাবলি:</b> 'ভারতের তোতাপাখি' খ্যাত আমির খসরু ছিলেন সুলতানি আমলের অন্যতম শ্রেষ্ঠ কবি ও ঐতিহাসিক। তাঁর রচিত 'কিরানউস সাদাইন', 'মিফতাহুল ফুতুহ', 'খাজাইনুল ফুতুহ' এবং 'নূহ সিপাহির' গ্রন্থগুলোতে আলাউদ্দিন খলজির সামরিক অভিযান, দক্ষিণ ভারত জয় এবং সেকালের রাজনৈতিক ও সাংস্কৃতিক পরিবেশের চমৎকার বিবরণ রয়েছে।</p><p><b>৫. ইবন বতুতার 'রেহলা':</b> মরক্কোর বিখ্যাত পর্যটক ইবন বতুতা মুহাম্মদ বিন তুঘলকের রাজত্বকালে ভারতে এসেছিলেন এবং দীর্ঘ আট বছর দিল্লির কাজি পদে নিযুক্ত ছিলেন। তাঁর ভ্রমণকাহিনী 'রেহলা' (Safarnama)-তে মুহাম্মদ বিন তুঘলকের চরিত্র, তাঁর অদ্ভুত রাজধানী পরিবর্তন নীতি, ডাক ব্যবস্থা, বিচারালয় এবং সেকালের ভারতীয় সমাজের অর্থনৈতিক সমৃদ্ধি ও মানুষের জীবনযাত্রার এক জীবন্ত ও নিরপেক্ষ বিবরণ পাওয়া যায়।</p><p><b>৬. অন্যান্য সমকালীন গ্রন্থ:</b> খাজা খাজা নিজামী রচিত 'তাজুল মাসির' (আইবেকের বিজয়াভিযান), ইসামীর 'ফুতুহ-উস-সালাতিন', এবং ঐতিহাসিক জিয়াউদ্দিন বরুনীর পাশাপাশি শের শাহ ও সুরী বংশের ইতিহাস জানতে আব্বাস খান সারওয়ারী রচিত 'তারিখ-ই-শের শাহী' অত্যন্ত গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><div class=\"h\">খ. প্রত্নতাত্ত্বিক ও উপাদানগত উৎস (Archaeological Sources)</div><p>লিখিত দলিলের পাশাপাশি সুলতানি আমলের ইতিহাস পুনর্গঠনে বস্তুগত বা প্রত্নতাত্ত্বিক উপাদানের ভূমিকাও কম নয়:</p><p><b>১. মুদ্রা ও শিলালিপি (Coins and Inscriptions):</b> সুলতানি আমলের অর্থনীতি, মুদ্রাব্যবস্থা এবং রাজাদের উপাধি সম্পর্কে জানতে মুদ্রা অত্যন্ত নির্ভরযোগ্য উৎস। ইলতুৎমিশ প্রবর্তিত রৌপ্য মুদ্রা 'টাকা' এবং তামার মুদ্রা 'জিতল' সেকালের আর্থিক স্থিতিশীলতার পরিচয় দেয়। এছাড়া বিভিন্ন মসজিদ, মাজার ও দুর্গের গায়ে খোদাই করা শিলালিপি থেকে বিভিন্ন অভিযানের সঠিক তারিখ ও শাসনামলের সত্যতা যাচাই করা যায়।</p><p><b>২. স্থাপত্য ও ইমারত (Architecture):</b> সুলতানি আমলের স্থাপত্যশিল্প কেবল শিল্পরীতির পরিচয়ই দেয় না, বরং রাজনৈতিক ইতিহাসও প্রকাশ করে। কুওয়াতুল ইসলাম মসজিদ, কুতুব মিনার, আলাই দরওয়াজা, তুঘলকাবাদ দুর্গ এবং লোধী রাজবংশের মাজারসমূহ তৎকালীন প্রযুক্তির উৎকর্ষ, অর্থনৈতিক সামর্থ্য এবং রুচিশীলতার সাক্ষ্য বহন করে।</p><p><b>৩. বিদেশি পর্যটকদের বিবরণ:</b> ইবন বতুতার পাশাপাশি মার্কো পলো, নিকোলো কোন্টি এবং আবদুর রাজ্জাকের ভ্রমণবৃত্তান্ত থেকে দক্ষিণ ভারতের বিজয়নগর সাম্রাজ্য এবং সুলতানি আমলের মধ্যকার বাণিজ্যিক ও রাজনৈতিক সম্পর্কের বিবরণ জানা যায়।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে বলা যায়, সুলতানি আমলে ভারতের ইতিহাস অধ্যয়নের উৎসগুলো অত্যন্ত সমৃদ্ধ ও বহুমুখী। পারস্য ভাষার প্রামাণিক ইতিহাসগ্রন্থ এবং সমৃদ্ধ প্রত্নতাত্ত্বিক নিদর্শনাদির সমন্বয়ে গবেষকরা সেকালের রাজনৈতিক উত্থান-পতন, আর্থ-সামাজিক অবস্থা এবং সাংস্কৃতিক আবহকে নিখুঁতভাবে ফুটিয়ে তুলতে সক্ষম হয়েছেন।</p>"],["সুলতান মাহমুদ গজনবীর ভারত অভিযানের কারণ ও ফলাফল আলোচনা কর।","<div class=\"h\">ভূমিকা</div><p>মধ্যযুগের ইসলামী ও ভারতীয় ইতিহাসে গজনী সাম্রাজ্যের সুলতান মাহমুদ গজনবী এক অত্যন্ত প্রতাপশালী ও আলোচিত শাসক। ৯৯৮ থেকে ১০৩০ খ্রিস্টাব্দের দীর্ঘ তিন দশকেরও বেশি সময় ধরে তিনি রাজত্ব করেন। এই সুদীর্ঘ শাসনকালে তিনি ভারতবর্ষের ওপর মোট সতেরো বার সফল সামরিক অভিযান পরিচালনা করেছিলেন বলে ঐতিহাসিকগণ উল্লেখ করেছেন। তাঁর এই অভিযানগুলোর প্রধান লক্ষ্য সাম্রাজ্য বিস্তার বা স্থায়ী মুসলিম রাজ্য প্রতিষ্ঠা ছিল না, বরং ছিল উত্তর ভারতের অপার ধনসম্পদ লুণ্ঠন এবং মধ্য এশিয়ায় নিজের সাম্রাজ্যকে সুরক্ষিত করা। সুলতান মাহমুদের এই ভারত অভিযানের পেছনে যেমন বহুমুখী কারণ ছিল, তেমনি এর সুদূরপ্রসারী ফলাফল ভারতীয় উপমহাদেশে গভীর প্রভাব ফেলেছিল।</p><div class=\"h\">সুলতান মাহমুদ গজনবীর ভারত অভিযানের কারণসমূহ</div><p>সুলতান মাহমুদের ভারত আক্রমণের পেছনে রাজনৈতিক, অর্থনৈতিক, ধর্মীয় এবং ব্যক্তিগত উচ্চাভিলাষ জড়িত ছিল:</p><p><b>১. ভারতের অপার ধনসম্পদ ও অর্থনৈতিক লোভ:</b> প্রাচীনকাল থেকেই ভারতবর্ষ তার সোনা, রৌপ্য, মুক্তা, হীরা এবং মন্দিরগুলোতে জমে থাকা বিপুল পরিমাণ ধনসম্পদের জন্য সারা বিশ্বে পরিচিত ছিল। মধ্য এশিয়ায় নিজের বিশাল সাম্রাজ্য পরিচালনা এবং বিশাল সৈন্যবাহিনীকে নিয়মিত বেতন দেওয়ার জন্য গজনী রাজ্যের অর্থনৈতিক ভিত্তি মজবুত করা জরুরি হয়ে পড়েছিল। ভারতের এই অফুরন্ত ধনসম্পদ সুলতান মাহমুদকে বারবার ভারত আক্রমণে প্রবলভাবে আকৃষ্ট করেছিল।</p><p><b>২. মধ্য এশিয়ায় সাম্রাজ্য সুরক্ষা ও রাজনৈতিক উচ্চাভিলাষ:</b> মাহমুদ গজনবী কেবল একজন লুটেরা ছিলেন না, তিনি ছিলেন একজন দূরদর্শী সাম্রাজ্য নির্মাতা। তাঁর প্রধান লক্ষ্য ছিল মধ্য এশিয়ার সামানিদ ও তুর্কি প্রতিদ্বন্দ্বীদের বিরুদ্ধে নিজের অবস্থান শক্তিশালী করা। ভারতের উত্তর-পশ্চিম সীমান্ত উন্মুক্ত থাকলে সেখান থেকে যেকোনো সময় শত্রু আক্রমণ করতে পারে—এই আশঙ্কা দূর করতে তিনি ভারত সীমান্ত নিরাপদ করতে চেয়েছিলেন।</p><p><b>৩. উত্তর ভারতের রাজনৈতিক দুর্বলতার সুযোগ:</b> সেসময়ে উত্তর ও পশ্চিম ভারতে কোনো কেন্দ্রীয় শক্তি বা শক্তিশালী সার্বভৌম রাষ্ট্র ছিল না। ভারত খন্ড খন্ড বহু ক্ষুদ্র রাজ্যে বিভক্ত ছিল এবং পারস্পরিক কোন্দল, অন্তর্দ্বন্দ্ব ও রেষারেষিতে তারা মত্ত ছিল (যেমন: পাঞ্জাবের হিন্দু শাহী বংশ, কানৌজের প্রতিহার, গুজরাটের সোলাঙ্কি ইত্যাদি)। এই রাজনৈতিক বিশৃঙ্খলা ও ঐক্যের অভাব মাহমুদ গজনবীকে ভারত আক্রমণে দারুণভাবে উৎসাহিত করেছিল।</p><p><b>৪. ধর্মীয় প্রেরণা ও মূর্তিপূজা ধ্বংসের উদ্দেশ্য:</b> কিছু মধ্যযুগীয় পারসিক ইতিহাসবিদের মতে, সুলতান মাহমুদ ইসলাম প্রচার এবং ভারতের মন্দিরগুলোতে থাকা মূর্তিসমূহ ধ্বংস করে ইসলামের একত্ববাদ প্রতিষ্ঠার জেহাদী মানসিকতা নিয়ে আক্রমণ করেছিলেন। যদিও আধুনিক ঐতিহাসিকদের মতে, অর্থনৈতিক লুণ্ঠনই ছিল প্রধান উদ্দেশ্য, তবে ধর্মীয় ভাবাবেগও এই অভিযানের একটি গুরুত্বপূর্ণ মনস্তাত্ত্বিক উপাদান ছিল।</p><p><b>৫. সীমান্তবর্তী হিন্দু শাহী রাজ্যের শত্রুতা:</b> পাঞ্জাবের হিন্দু শাহী রাজা জয়পাল এবং তাঁর পুত্র আনন্দপাল গজনী সাম্রাজ্যের বিস্তারে নিয়মিত বাধা সৃষ্টি করতেন এবং গজনীর বিরুদ্ধে জোট গঠন করেছিলেন। তাদের এই ঔদ্ধত্য ও শত্রুতার চূড়ান্ত জবাব দেওয়া এবং সীমান্ত সুরক্ষিত করা মাহমুদের জন্য অবধারিত হয়ে পড়েছিল।</p><div class=\"h\">ভারত অভিযানের ফলাফল</div><p>সুলতান মাহমুদের এই সতেরোটি অভিযানের ফলাফল ভারতীয় রাজনীতি, অর্থনীতি এবং সংস্কৃতির ওপর দীর্ঘমেয়াদি প্রভাব ফেলেছিল:</p><p><b>১. উত্তর ভারতের রাজনৈতিক দুর্বলতা উন্মোচন:</b> মাহমুদের আক্রমণগুলো প্রমাণ করেছিল যে উত্তর ভারতের রাজপুত রাজারা সামরিক দিক থেকে কতটা দুর্বল এবং অভ্যন্তরীণভাবে কতটা অনৈক্যপূর্ণ। তাদের শক্তিশালী দুর্গ ও সেনাবাহিনী থাকা সত্ত্বেও পারস্পরিক কোন্দলের কারণে তারা গজনীর সামান্য বাহিনীর কাছেও পরাজিত হয়েছিল।</p><p><b>২. অর্থনৈতিক বিপর্যয় ও সম্পদ লুণ্ঠন:</b> মাহমুদের বারবার আক্রমণে ভারতের বিখ্যাত ও প্রাচীন মন্দিরগুলো (বিশেষ করে মাথুরা, কনৌজ এবং সোমনাথ মন্দির) ধ্বংস হয়ে যায় এবং মন্দিরে সঞ্চিত শত শত মন সোনা, রূপা ও রত্নালংকার গজনীতে পাচার করা হয়। এর ফলে ভারতের অর্থনীতিতে মারাত্মক বিপর্যয় নেমে আসে।</p><p><b>৩. স্থায়ী মুসলিম শাসনের পথ উন্মুক্তকরণ:</b> সুলতান মাহমুদ স্থায়ীভাবে ভারতের ভূখণ্ড দখল করে গজনী সাম্রাজ্যের অন্তর্ভুক্ত না করলেও (পাঞ্জাব ও মুলতান ছাড়া), তাঁর এই ধারাবাহিক আক্রমণগুলোর মাধ্যমে ভারতের প্রতিরক্ষা ব্যবস্থার দুর্বলতা এবং অভ্যন্তরীণ রুটগুলো পরিষ্কার হয়ে গিয়েছিল। পরবর্তীতে এক শতাব্দীরও কম সময়ে মোহাম্মদ ঘুরির পক্ষে ভারতে স্থায়ী মুসলিম সাম্রাজ্য প্রতিষ্ঠা করা সহজ হয়েছিল।</p><p><b>৪. সাংস্কৃতিক বিনিময় ও আল-বিরুনীর আগমন:</b> এই অভিযানের একটি ইতিবাচক দিক ছিল সাংস্কৃতিক ও বুদ্ধিবৃত্তিক বিনিময়। সুলতান মাহমুদের সাথে ভারতে এসেছিলেন যুগের শ্রেষ্ঠ পন্ডিত, জ্যোতির্বিজ্ঞানী ও দার্শনিক আল-বিরুনী। তিনি দীর্ঘকাল ভারতে অবস্থান করে সংস্কৃত ভাষা শেখেন এবং ভারতীয় দর্শন, বিজ্ঞান, সমাজ ও সংস্কৃতি নিয়ে বিখ্যাত গ্রন্থ 'কিতাব-উল-হিন্দ' রচনা করেন, যা ভারতবিদ্যার এক অনন্য দলিল।</p><p><b>৫. ইসলাম ধর্মের প্রচার ও স্থায়ী উপস্থিতি:</b> পাঞ্জাব ও সিন্ধু অঞ্চল গজনী সাম্রাজ্যের সরাসরি নিয়ন্ত্রণে আসার ফলে ওই অঞ্চলে ইসলামী সংস্কৃতির স্থায়ী ভিত্তি স্থাপিত হয়, যা পরবর্তী শতাব্দীগুলোতে সমগ্র উপমহাদেশে ইসলামের প্রসারকে ত্বরান্বিত করেছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সুলতান মাহমুদ গজনবীর ভারত অভিযান মধ্যযুগের ইতিহাসে একল বড় সামরিক ঘটনা ছিল। তাঁর আক্রমণের নির্মমতা ও ধনসম্পদ লুণ্ঠন ভারতের অর্থনীতিকে পঙ্গু করে দিলেও, এর রাজনৈতিক ও কৌশলগত পরিণতি ভারতীয় উপমহাদেশের ভাগ্যরেখাকে চিরকালের মতো পাল্টে দিয়েছিল।</p>"],["দিল্লী সালতানাতের প্রতিষ্ঠাতা হিসেবে কুতুবউদ্দিন আইবেকের মূল্যায়ন কর।","<div class=\"h\">ভূমিকা</div><p>ভারতীয় উপমহাদেশে মুসলিম শাসনের ইতিহাসে ১২০৬ খ্রিস্টাব্দ একটি অত্যন্ত গৌরবোজ্জ্বল ও নির্ণায়ক বছর। এই বছরেই মোহাম্মদ ঘুরির আকস্মিক মৃত্যুর পর তাঁর সুযোগ্য সেনাপতি ও বিশ্বস্ত প্রতিনিধি কুতুবউদ্দিন আইবেক লাহোরে স্বাধীনভাবে ক্ষমতা গ্রহণ করেন এবং ভারতীয় মাটিতে স্বাধীন 'দিল্লি সালতানাত' ও 'মামলুক' বা দাস বংশের গোড়াপত্তন করেন। কুতুবউদ্দিন আইবেক অত্যন্ত প্রতিকূল ও বিশৃঙ্খল রাজনৈতিক পরিস্থিতিতে ভারতের মুসলিম সাম্রাজ্যের ভিত্তি শক্ত করেছিলেন। যদিও তাঁর স্বাধীন রাজত্বকাল ছিল মাত্র চার বছরের (১২০৬–১২১০ খ্রিস্টাব্দ), তবুও মধ্যযুগের ভারতীয় ইতিহাসে তাঁর কৃতিত্ব ও অবদান অপরিসীম। দিল্লি সালতানাতের প্রতিষ্ঠাতা হিসেবে তাঁর জীবন ও কর্মের মূল্যায়ন নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">কুতুবউদ্দিন আইবেকের প্রারম্ভিক জীবন ও উত্থান</div><p>কুতুবউদ্দিন আইবেক তুর্কিস্তানের তুর্ক বংশোদ্ভূত ছিলেন।ৈশবে তিনি দাস হিসেবে ক্রিতদাস বাজারে বিক্রি হন এবং নিশাপুরের প্রখ্যাত কাজী ফখরুজ্জামান আবদুল আজিজ কূকী তাঁকে কিনে নেন এবং কুরআন ও অশ্বচালনা শেখান। পরবর্তীতে গজনীর সুলতান মোহাম্মদ ঘুরি তাঁকে কিনে নেন এবং তাঁর অসাধারণ বুদ্ধিমত্তা, বিশ্বস্ততা ও সামরিক দক্ষতার কারণে তাঁকে 'আমির-ই-আখুর' (অশ্বশালার প্রধান) পদে উন্নীত করেন। ১১৯২ খ্রিস্টাব্দের ত্রায়েনের দ্বিতীয় যুদ্ধের পর মোহাম্মদ ঘুরি ভারতের বিজিত অঞ্চলগুলোর দায়িত্ব আইবেকের ওপর ন্যস্ত করে গজনীতে ফিরে যান। আইবেক অত্যন্ত বিশ্বস্ততার সাথে ভারতের বিভিন্ন প্রান্ত জয় করে মুসলিম সাম্রাজ্য সম্প্রসারণ করেন।</p><div class=\"h\">দিল্লি সালতানাতের প্রতিষ্ঠাতা ও তাঁর কৃতিত্ব</div><p>১২০৬ খ্রিস্টাব্দে মোহাম্মদ ঘুরির মৃত্যুর পর আইবেক গজনী থেকে রাজনৈতিক সম্পর্ক ছিন্ন করে স্বাধীন ভারতের শাসক হিসেবে আত্মপ্রকাশ করেন। প্রতিষ্ঠাতা হিসেবে তাঁর কৃতিত্বগুলো নিম্নরূপ:</p><p><b>১. সাম্রাজ্যের অখণ্ডতা রক্ষা ও স্বাধীনতা ঘোষণা:</b> মোহাম্মদ ঘুরির মৃত্যুর পর ভারতের নবপ্রতিষ্ঠিত মুসলিম সাম্রাজ্য ভেঙে পড়ার উপক্রম হয়েছিল। চারপাশের রাজপুত রাজারা বিদ্রোহ ঘোষণা করেছিলেন এবং গজনীর সুলতান তাজুদ্দিন ইলদিজও ভারতের ওপর নিজের আধিপত্য বিস্তার করতে চেয়েছিলেন। কুতুবউদ্দিন আইবেক অত্যন্ত সাহসিকতার সাথে অত্যন্ত সুকৌশলে রাজনৈতিক বৈবাহিক সম্পর্ক ও সামরিক শক্তির মাধ্যমে এই সংকট মোকাবিলা করেন এবং ভারতের মাটিতে একটি স্বাধীন ও সার্বভৌম মুসলিম রাষ্ট্রের গোড়াপত্তন করেন।</p><p><b>২. অভ্যন্তরীণ বিদ্রোহ দমন ও শান্তি প্রতিষ্ঠা:</b> আইবেক ভারতের বিভিন্ন বিক্ষিপ্ত বিদ্রোহ শক্তহাতে দমন করেন। তিনি গোয়ালিয়র, কালিনজর এবং মথুরার বিদ্রোহী শক্তিগুলোকে পরাস্ত করে আইন-শৃঙ্খলা পরিস্থিতি স্বাভাবিক করেন। তাঁর সময়ে উত্তর ভারতের বড় একটি অংশ সুরক্ষিত ও শান্ত হয়েছিল।</p><p><b>৩. উদারতা ও 'লাখ বক্স' উপাধি:</b> কুতুবউদ্দিন আইবেক তাঁর অসাধারণ বদান্যতা, দানশীলতা ও উদারতার জন্য সমগ্র মধ্যযুগে বিখ্যাত ছিলেন। তিনি সাধারণ মানুষ, ফকির, মিসকিন এবং দরিদ্রদের মুক্তহাতে দান করতেন। তাঁর এই অকৃপণ দানশীলতার জন্য তাঁকে 'লাখ বক্স' (লক্ষাধিক টাকার দাতা) উপাধিতে ভূষিত করা হয়েছিল।</p><p><b>৪. স্থাপত্য ও সংস্কৃতির পৃষ্ঠপোষকতা:</b> কুতুবউদ্দিন আইবেক শিল্প ও স্থাপত্যের প্রতি দারুণ অনুরাগী ছিলেন। দিল্লি বিজয়ের পর তিনি ইসলামের প্রথম স্মৃতিচিহ্ন হিসেবে দিল্লির কুতুব মিনারের প্রাঙ্গণে বিখ্যাত 'কুওয়াতুল ইসলাম মসজিদ' নির্মাণ করেন। এছাড়া তিনি বিশ্ববিখ্যাত 'কুতুব মিনার'-এর নির্মাণকাজ শুরু করেন (যা পরবর্তীতে তাঁর জামাতা ইলতুৎমিশ সম্পন্ন করেন)। আজমেরে তিনি 'আড়াই দিন কা ঝোড়া' নামক মসজিদ নির্মাণ করেছিলেন।</p><p><b>৫. বিচক্ষণ সেনাপতি ও দূরদর্শী শাসক:</b> সুলতান হওয়ার আগে মোহাম্মদ ঘুরির পক্ষে সমগ্র উত্তর ভারত (দিল্লি, আজমের, কানৌজ, বাংলা ও বিহার) বিজয়ে আইবেক মূল সেনাপতির ভূমিকা পালন করেছিলেন। তাঁরই বিশ্বস্ত সেনাপতি ইখতিয়ার উদ্দিন বখতিয়ার খিলজি বাংলা জয় করেছিলেন। একজন সেনাপতি থেকে শুরু করে স্বাধীন সালতানাতের মুকুট পরা পর্যন্ত তাঁর প্রতিটি পদক্ষেপে রাজনৈতিক দূরদর্শিতা ও সাহসিকতার পরিচয় পাওয়া যায়।</p><div class=\"h\">কুতুবউদ্দিন আইবেকের সীমাবদ্ধতা ও দুর্বলতা</div><p>প্রতিষ্ঠাতা হিসেবে বহু গুণের অধিকারী হলেও আইবেকের শাসনামলে কিছু সীমাবদ্ধতা ও দুর্বলতাও লক্ষ্য করা যায়:</p><p><b>১. সংক্ষিপ্ত শাসনকাল:</b> ১২০৬ থেকে ১২১০ খ্রিস্টাব্দ—মাত্র চার বছর তিনি স্বাধীন শাসক হিসেবে বেঁচে ছিলেন। এত অল্প সময়ে একটি বিশাল সাম্রাজ্যের প্রশাসনিক সংস্কার বা দীর্ঘমেয়াদি অর্থনৈতিক নীতি প্রণয়ন করা তাঁর পক্ষে সম্ভব হয়নি।</p><p><b>২. প্রশাসনিক কাঠামোর অনুপস্থিতি:</b> তিনি মূলত একজন দুর্দান্ত সেনাপতি ছিলেন, প্রশাসক হিসেবে খুব বেশি মৌলিক সংস্কার তিনি রেখে যেতে পারেননি। তিনি পুরনো প্রশাসনিক ব্যবস্থার ওপরই বেশি নির্ভর করেছিলেন।</p><p><b>৩. আকস্মিক মৃত্যু:</b> ১২১০ খ্রিস্টাব্দে লাহোরে পোলো বা চৌগান খেলার সময় ঘোড়া থেকে পড়ে গিয়ে তিনি আকস্মিক মৃত্যুবরণ করেন। তাঁর এই হঠাৎ মৃত্যুতে নবপ্রতিষ্ঠিত সালতানাতে এক সাময়িক রাজনৈতিক শূন্যতা ও উত্তরাধিকার সংকট তৈরি হয়েছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, কুতুবউদ্দিন আইবেক ছিলেন ভারতীয় উপমহাদেশে মুসলিম শক্তির প্রকৃত রূপকার ও দিল্লি সালতানাতের প্রতিষ্ঠাতা। অত্যন্ত প্রতিকূল ও বৈরী পরিস্থিতিতে তিনি যে সাহসিকতা ও দূরদর্শিতার সাথে স্বাধীন রাষ্ট্রের ভিত্তি স্থাপন করেছিলেন, তার ওপর ভর করেই পরবর্তীতে ইলতুৎমিশ ও বলিয়নের মতো শাসকরা বিশাল সাম্রাজ্য গড়ে তুলতে পেরেছিলেন। মধ্যযুগের ভারতীয় ইতিহাসে তাঁর নাম চিরস্মরণীয় হয়ে থাকবে।</p><p>ইসলামের ইতিহাস ২য় পত্রের পরবর্তী তিনটি প্রশ্ন—৪. সুলতান ফিরোজ শাহ তুঘলকের জনহিতকর কার্যাবলি বিশ্লেষণ কর; ৫. শাসক ও বিজেতা হিসেবে সুলতান আলাউদ্দিন খলজির কৃতিত্ব বিচার কর; এবং ৬. দাস বংশের প্রকৃত প্রতিষ্ঠাতা হিসেবে সুলতান ইলতুৎমিশের কৃতিত্ব মূল্যায়ন কর—প্রতিটির বিস্তারিত ও সমৃদ্ধ উত্তর নিচে তুলে ধরা হলো:</p>"],["অথবা, দিল্লী সালতানাতের পতনের কারণগুলো বর্ণনা কর।","<div class=\"h\">ভূমিকা</div><p>দ্বাদশ শতাব্দীর প্রথমভাগে কুতুবউদ্দিন আইবেকের হাত ধরে ভারতীয় উপমহাদেশে যে 'দিল্লি সালতানাত'-এর গোড়াপত্তন হয়েছিল, তা দীর্ঘ তিন শতাধিক বছর ধরে (১২০৬–১৫২৬ খ্রিস্টাব্দ) ভারতীয় রাজনীতি, অর্থনীতি এবং সংস্কৃতির কেন্দ্রবিন্দু হিসেবে টিকে ছিল। তুর্কি, খলজি, তুঘলক, সাইয়্যেদ এবং লোধী—এই পাঁচটি রাজবংশের অধীনে এই সাম্রাজ্য তার উৎকর্ষের চরম শিখরে পৌঁছেছিল। কিন্তু ষোড়শ শতাব্দীর শুরুর দিকে অভ্যন্তরীণ কোন্দল, রাজনৈতিক অস্থিরতা, অযোগ্য নেতৃত্ব এবং প্রশাসনিক পচনের ফলে এই বিশাল সাম্রাজ্যের ভিত ভেতর থেকে দুর্বল হয়ে পড়ে। পরিশেষে ১৫২৬ খ্রিস্টাব্দের পানিপথের প্রথম যুদ্ধে জহির উদ্দিন মোহাম্মদ বাবরের হাতে ইব্রাহিম লোদির পরাজয়ের মধ্য দিয়ে দিল্লি সালতানাতের চির অবসান ঘটে। দিল্লি সালতানাতের পতনের পেছনে যেসব রাজনৈতিক, অর্থনৈতিক, সামাজিক ও সামরিক কারণ নিহিত ছিল, তা নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">১. ত্রুটিপূর্ণ উত্তরাধিকার আইন এবং সিংহাসন নিয়ে গৃহযুদ্ধ</div><p>দিল্লি সালতানাতের পতনের অন্যতম প্রধান কারণ ছিল কোনো সুনির্দিষ্ট বা স্থায়ী উত্তরাধিকার আইন না থাকা। ইসলাম ধর্মে বা তুর্কি-আফগান ঐতিহ্য অনুযায়ী জ্যেষ্ঠ পুত্রই যে সিংহাসনে বসবে, এমন কোনো আইনসিদ্ধ বা সর্বসম্মত নিয়ম ছিল না। এর ফলে প্রতিটি সুলতানের মৃত্যুর পরই তাঁর পুত্র, ভাই বা আমাত্যদের মধ্যে সিংহাসন দখলের এক রক্তক্ষয়ী প্রতিযোগিতা ও গৃহযুদ্ধ শুরু হতো। দাস বংশ, খলজি বংশ কিংবা তুঘলক বংশ—প্রতিটি রাজবংশের পতনের পেছনে এই উত্তরাধিকার সংকটের বড় হাত ছিল। সিংহাসনের লোভে রাজপরিবারের সদস্যরা নিজেদের মধ্যে হানাহানিতে লিপ্ত হওয়ায় কেন্দ্রীয় শাসনব্যবস্থা মারাত্মকভাবে ক্ষতিগ্রস্ত হয়েছিল।</p><div class=\"h\">২. অযোগ্য, বিলাসী ও দুর্বল উত্তরাধিকারীগণ</div><p>সালতানাতের প্রাথমিক যুগে ইলতুৎমিশ, বলবন, আলাউদ্দিন খলজি কিংবা ফিরোজ শাহ তুঘলকের মতো দক্ষ, দূরদর্শী ও লৌহমানব শাসকরা রাজত্ব করলেও, পরবর্তীতে সিংহাসনে বসা অধিকাংশ সুলতানই ছিলেন চরম অযোগ্য, বিলাসী এবং রাষ্ট্র পরিচালনায় সম্পূর্ণ অক্ষম। মুহাম্মদ বিন তুঘলকের খামখেয়ালি প্রকল্প, ফিরোজ শাহের পর তুঘলক বংশের চরম দুর্বলতা এবং সাইয়্যেদ ও লোধী বংশের শেষ দিকের শাসকদের অদূরদর্শিতা সাম্রাজ্যকে টিকিয়ে রাখতে ব্যর্থ হয়। যোগ্য নেতৃত্বের অভাবে শক্তিশালী প্রশাসন ভেঙে পড়ে এবং প্রদেশে অসন্তোষের আগুন জ্বলে ওঠে।</p><div class=\"h\">৩. সাম্রাজ্যের বিশালতা ও যোগাযোগ ব্যবস্থার অনুন্নয়ন</div><p>দিল্লি সালতানাত একসময় পূর্বের বাংলা থেকে পশ্চিমে সিন্ধু এবং উত্তরের কাশ্মীর থেকে দক্ষিণে সুদূর ডেকান বা দক্ষিণ ভারত পর্যন্ত বিস্তৃত হয়েছিল। কিন্তু সেকালের অনুন্নত যোগাযোগ ব্যবস্থা, ধীরগতির যাতায়াত এবং অপর্যাপ্ত পরিবহন ব্যবস্থার কারণে কেন্দ্রের পক্ষে সুদূর প্রদেশগুলোর ওপর শক্ত নিয়ন্ত্রণ বজায় রাখা অসম্ভব হয়ে পড়েছিল। রাজধানী দিল্লি থেকে এত বিশাল সাম্রাজ্য পরিচালনা করা দুরূহ হয়ে পড়ায় দূরবর্তী প্রদেশের গভর্নররা সুযোগ বুঝে নিজেদের স্বাধীন ঘোষণা করতে শুরু করেন।</p><div class=\"h\">৪. অর্থনৈতিক বিপর্যয় ও দেউলিয়াত্ব</div><p>সুলতানি আমলের শেষ পর্যায়ে এসে রাজকোষ চরম অর্থনৈতিক সংকটের মুখে পড়েছিল। মুহাম্মদ বিন তুঘলকের প্রতীকী মুদ্রা প্রবর্তন এবং বিভিন্ন ব্যর্থ অভিযানের ফলে রাষ্ট্রীয় কোষাগার শূন্য হয়ে পড়েছিল। পরবর্তী সুলতানরা বিলাসবহুল জীবনযাপন, বিশাল প্রাসাদ নির্মাণ এবং অতিরিক্ত সৈন্য পোষণের জন্য প্রজাদের ওপর অসহনীয় হারে করের বোঝা চাপিয়ে দেন। এর ফলে কৃষিজমিAbandoned হতে শুরু করে, ব্যবসা-বাণিজ্যে স্থবিরতা নামে এবং সাধারণ মানুষের ক্রয়ক্ষমতা ও জীবনযাত্রার মান তলানিতে গিয়ে ঠেকে।</p><div class=\"h\">৫. সামরিক বাহিনীর অবনতি ও শৃঙ্খলার অভাব</div><p>দিল্লি সালতানাতের মূল শক্তি ছিল তাদের শক্তিশালী ও অনুগত সেনাবাহিনী। কিন্তু শেষ দিকের সুলতানদের আমলে সেনাবহিনীতে তীব্র শৃঙ্খলাভঙ্গ, দুর্নীতি এবং দলীয় কোন্দল দেখা দেয়। সৈন্যদের ঠিকমতো বেতন দেওয়া হতো না, যার ফলে তাদের যুদ্ধজয়ের স্পৃহা ও আনুগত্য নষ্ট হয়ে যায়। বিশেষ করে সামন্ততান্ত্রিক ইক্তাদারী প্রথার অবক্ষয় এবং ভাড়াটে সৈন্যদের ওপর অতিরিক্ত নির্ভরতা সালতানাতের সামরিক শক্তিকে পঙ্গু করে দিয়েছিল।</p><div class=\"h\">৬. বৈদেশিক আক্রমণ (তৈমুরের আক্রমণ)</div><p>দিল্লি সালতানাতের পতনের প্রক্রিয়াকে চূড়ান্ত রূপ দিয়েছিল ১৩৯৮ খ্রিস্টাব্দে মধ্য এশিয়ার প্রখ্যাত তুর্কি-মঙ্গোল বীর আমির তৈমুরের ভারত আক্রমণ। তৈমুর ও তাঁর বর্বর বাহিনী দিল্লি আক্রমণ করে শহরটিকে ধ্বংসস্তূপে পরিণত করে এবং লাখ লাখ মানুষকে হত্যা করে প্রচুর ধনসম্পদ লুণ্ঠন করে নিয়ে যায়। এই আক্রমণের ফলে দিল্লির রাজনৈতিক ও অর্থনৈতিক কাঠামো সম্পূর্ণ ভেঙে পড়ে। তুঘলক বংশের অবশিষ্টাংশ শক্তি হারিয়ে ফেললে উত্তর ভারতে চরম রাজনৈতিক শূন্যতা ও অরাজকতা সৃষ্টি হয়।</p><div class=\"h\">৭. স্বাধীন আঞ্চলিক রাজ্যসমূহের উত্থান</div><p>কেন্দ্রীয় সরকারের দুর্বলতার সুযোগ নিয়ে সাম্রাজ্যের বিভিন্ন প্রান্তে শক্তিশালী স্বাধীন আঞ্চলিক রাজ্য গড়ে ওঠে। দক্ষিণে বাহমণি সাম্রাজ্য ও বিজয়নগর সাম্রাজ্য, পূর্বে জৌনপুর ও বাংলা এবং পশ্চিমে মালওয়া ও গুজরাট নিজেদের সম্পূর্ণ স্বাধীন বলে ঘোষণা করে। এর ফলে দিল্লি সালতানাত কেবল একটি ছোট ও সীমিত অঞ্চলে পরিণত হয়, যা সমগ্র ভারতের প্রতিনিধিত্ব করার ক্ষমতা হারিয়ে ফেলে।</p><div class=\"h\">৮. আফগান আমিরদের গোত্রীয় বিভেদ ও অনৈক্য</div><p>লোধী বংশের আমলে (যাঁরা ছিলেন আফগান বংশোদ্ভূত) আফগান আমির ও সর্দাররা নিজেদের স্বতন্ত্র গোত্রীয় অহংকারে মত্ত ছিলেন। তারা কেন্দ্রীয় সুলতানের পরম আনুগত্য না করে নিজেদের গোত্রের স্বার্থকে বড় করে দেখতেন। সুলতান ইব্রাহিম লোদির কঠোর ও উদ্ধত আচরণ অনেক আফগান সর্দারকে (যেমন দৌলত খান লোধী ও আলম খান লোধী) তাঁর বিরুদ্ধে বিদ্রোহী করে তোলে। এই অভ্যন্তরীণ অনৈক্য ও বিশ্বাসঘাতকতার সুযোগ নিয়েই কাবুলের শাসক বাবর ভারতে আক্রমণ করার সুযোগ পান।</p>"],["সুলতান ফিরোজ শাহ তুঘলকের জনহিতকর কার্যাবলি বিশ্লেষণ কর।","<div class=\"h\">ভূমিকা</div><p>দিল্লি সালতানাতের ইতিহাসে মুহাম্মদ বিন তুঘলকের খামখেয়ালি ও অদ্ভুত প্রকল্পগুলোর কারণে সৃষ্ট রাজনৈতিক ও অর্থনৈতিক বিশৃঙ্খলা থেকে রাষ্ট্রকে রক্ষা করার জন্য ১৩৫১ খ্রিস্টাব্দে দিল্লির মসনদে আসীন হন সুলতান ফিরোজ শাহ তুঘলক (১৩৫১–১৩৮৮ খ্রিস্টাব্দ)। তাঁর দীর্ঘ সাঁইত্রিশ বছরের শাসনকাল ছিল দিল্লি সালতানাতের ইতিহাসে শান্তি, সমৃদ্ধি, জনকল্যাণ এবং স্থাপত্য শিল্পের এক সোনালী অধ্যায়। মুহাম্মদ বিন তুঘলকের বিপরীতে ফিরোজ শাহ তুঘলক ছিলেন চরম প্রজারঞ্জক, শান্তিপ্রিয়, দূরদর্শী এবং জনহিতৈষী শাসক। তিনি যুদ্ধ জয়ের চেয়ে প্রজাদের দৈনন্দিন জীবনের সুখ-শান্তি এবং অর্থনৈতিক স্বাচ্ছন্দ্য নিশ্চিত করার ওপর বেশি জোর দিয়েছিলেন। সুলতান ফিরোজ শাহ তুঘলকের বহুমুখী জনহিতকর কার্যাবলি নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">১. সেচব্যবস্থার উন্নয়ন ও কৃষি সংস্কার</div><p>ফিরোজ শাহ তুঘলক বুঝতে পেরেছিলেন যে ভারতের অর্থনীতির মূল ভিত্তি হলো কৃষি। কৃষকদের ভাগ্য উন্নয়ন এবং খরা থেকে মুক্তি দিতে তিনি মধ্যযুগের ইতিহাসে অনন্য এক সেচব্যবস্থা গড়ে তোলেন।</p><p><b>খাল খনন:</b> তিনি সুম্র ও যমুনা নদী থেকে বেশ কয়েকটি বড় বড় ক্যানেল বা সেচখাল খনন করেছিলেন। এর মধ্যে 'রাজিবাহী' এবং 'উলুঘখানি' ক্যানেলগুলো বিশেষভাবে উল্লেখযোগ্য। এই ক্যানেলগুলোর মাধ্যমে শত শত মাইল দূরের শুকনো জমিতে পানি সরবরাহ করা হতো, যার ফলে কৃষিজমিগুলোতে নিয়মিত সেচ কাজ সম্পন্ন হতো এবং ফসলের উৎপাদন বহুগুণ বেড়ে গিয়েছিল।</p><p><b>উদ্যান সৃষ্টি:</b> কৃষির পাশাপাশি তিনি দেশের বিভিন্ন অঞ্চলে প্রায় ১২০০-এরও বেশি ফলমূলের বাগান (আম, পেয়ারা ও অন্যান্য ফল) তৈরি করেছিলেন, যা থেকে সরকার এবং সাধারণ মানুষ উভয়েই অর্থনৈতিকভাবে লাভবান হয়েছিল।</p><div class=\"h\">২. রাজস্ব ও কর ব্যবস্থার সংস্কার</div><p>মুহম্মদ বিন তুঘলকের আমলে করের বোঝা জনগণের জন্য অসহনীয় হয়ে উঠেছিল। ফিরোজ শাহ তুঘলক সিংহাসনে আরোহণ করেই প্রজাবান্ধব কর সংস্কার বাস্তবায়ন করেন:</p><p><b>অবৈধ কর বাতিল:</b> তিনি শরিয়তসম্মত নয় এমন প্রায় ২৪টি অতিরিক্ত ও নিপীড়নমূলক কর (যেমন: বৈবাহিক কর, গৃহকর, পশুচারণ কর ইত্যাদি) চিরতরে বাতিল করে দেন।</p><p><b>চারটি শরিয়তসম্মত কর:</b> শরিয়তের বিধান অনুযায়ী তিনি কেবল চারটি প্রধান কর বহাল রাখেন—খরাজ (ভূমি রাজস্ব), উশর, জিজিয়া এবং গনিমত। এর ফলে সাধারণ প্রজারা, বিশেষ করে হিন্দু ও কৃষক সমাজ চরম স্বস্তি লাভ করে।</p><p><b>কৃষকদের ঋণ মওকুফ:</b> মুহাম্মদ বিন তুঘলকের আমলের বকেয়া কৃষি ঋণ (সোন্দখোর) সম্পূর্ণ মওকুফ করে দেওয়া হয় এবং খরা বা বন্যার সময় কৃষকদের সরকারি সাহায্য প্রদান করা হতো।</p><div class=\"h\">৩. দাতব্য প্রতিষ্ঠান ও মানবকল্যাণমূলক বিভাগ ('দেওয়ান-ই-খয়রাত')</div><p>ফিরোজ শাহ তুঘলক মানবকল্যাণে বহুমুখী দাতব্য সংস্থা ও বিভাগ প্রতিষ্ঠা করেছিলেন, যা মধ্যযুগের রাষ্ট্রে বিরল ছিল:</p><p><b>দেওয়ান-ই-খয়রাত (দান বিভাগ):</b> দরিদ্র পরিবার, অসহায় এতিম এবং দুস্থ কন্যাদের বিবাহের ব্যবস্থা করার জন্য তিনি এই বিশেষ বিভাগ গঠন করেন। এই বিভাগের মাধ্যমে গরিব পরিবারগুলোকে আর্থিক সাহায্য দেওয়া হতো যাতে কন্যাদায়গ্রস্ত পিতা-মাতা চিন্তামুক্ত হতে পারেন।</p><p><b>দার-উল-শিফা (বিনামূল্যে চিকিৎসালয়):</b> সাধারণ মানুষের স্বাস্থ্যসেবা নিশ্চিত করার জন্য তিনি রাজধানীতে একটি বড় দাতব্য হাসপাতাল প্রতিষ্ঠা করেন। সেখানে দক্ষ চিকিৎসক ও হাকিম রাখা হয়েছিল এবং রোগীদের বিনামূল্যে ওষুধ ও পথ্য সরবরাহ করা হতো।</p><p><b>কর্মসংস্থান ব্যুরো:</b> বেকার যুবকদের চাকরি ও কর্মসংস্থানের ব্যবস্থা করার জন্য তিনি একটি বিশেষ কর্মসংস্থান অফিস খুলেছিলেন, যা যোগ্যতার ভিত্তিতে যুবকদের কাজ খুঁজে দিত।</p><div class=\"h\">৪. নগর স্থাপন ও স্থাপত্য শিল্পের বিকাশ</div><p>ফিরোজ শাহ তুঘলক ছিলেন মধ্যযুগের অন্যতম শ্রেষ্ঠ নগর নির্মাতা। তাঁর হাতে অসংখ্য নতুন শহর ও স্থাপত্য গড়ে ওঠে:</p><p><b>নতুন শহর প্রতিষ্ঠা:</b> তিনি প্রায় ৩০০টি নতুন শহর ও জনপদ স্থাপন করেছিলেন। এর মধ্যে ফিরোজাবাদ (দিল্লির কাছে), জৌনপুর, হিসার, ফাতেহাবাদ এবং ফিরোজপুর অন্যতম। জৌনপুর শহরটি পরবর্তীতে উত্তর ভারতের 'ভারতের শিরাজ' নামে পরিচিতি লাভ করে।</p><p><b>জনহিতকর ইমারত:</b> জনগণের যাতায়াত ও সুরক্ষার জন্য তিনি অসংখ্য সরাইখানা (মুসাফিরদের বিশ্রামের স্থান), সেতু, মসজিদ, মাজার এবং খানকাহ নির্মাণ করেছিলেন। এছাড়াও তিনি পুরোনো ঐতিহাসিক স্মৃতিচিহ্নগুলো (যেমন: অশোক স্তম্ভ) সংরক্ষণ ও সংস্কারের ব্যবস্থা করেছিলেন।</p><div class=\"h\">৫. শিক্ষা ও সংস্কৃতির পৃষ্ঠপোষকতা</div><p>শিক্ষার প্রসারে ফিরোজ শাহ তুঘলক মাদরাসা ও মক্তব প্রতিষ্ঠার ওপর জোর দেন। তিনি দিল্লিতে বিখ্যাত 'ফিরোজ শাহ মাদরাসা' স্থাপন করেন। তাঁর রাজদরবারে বহু পন্ডিত, লেখক এবং সুফি-সাধক সমাদৃত হতেন। তিনি নিজে 'ফুতোহাত-ই-ফিরোজ শাহী' নামে নিজের আত্মজীবনী রচনা করেছিলেন। ধর্মীয় ও সামাজিক ক্ষেত্রে উদারতা প্রদর্শন করে তিনি শিক্ষাঙ্গনকে মুখরিত করে তুলেছিলেন।</p><div class=\"h\">৬. দাসপ্রথার প্রসার (সমালোচনাযুক্ত দিক)</div><p>ফিরোজ শাহ তুঘলকের জনহিতকর কাজের মধ্যে একটি ব্যতিক্রমী ও বিতর্কিত দিক ছিল দাসপ্রথার প্রতি তাঁর অতিরিক্ত উৎসাহ। তিনি যুদ্ধবন্দী এবং বিভিন্ন স্থান থেকে প্রায় ১ লক্ষ ৮০ হাজারের মতো দাস সংগ্রহ করেছিলেন এবং তাদের জন্য 'দেওয়ান-ই-বন্ধেগান' নামক একটি আলাদা বিভাগ খুলেছিলেন। যদিও তিনি তাদের কারিগরি শিক্ষা ও কাজের ব্যবস্থা করে দিয়েছিলেন, তবে পরবর্তী সময়ে এই দাসবাহিনী সাম্রাজ্যের পতনের অন্যতম কারণ হয়ে দাঁড়িয়েছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সুলতান ফিরোজ শাহ তুঘলক ছিলেন দিল্লি সালতানাতের অন্যতম শ্রেষ্ঠ জনহিতৈষী ও প্রজাবান্ধব শাসক। তাঁর খাল খনন, কর হ্রাস, দাতব্য চিকিৎসালয় প্রতিষ্ঠা এবং নগর নির্মাণের ফলে সাধারণ মানুষের জীবনযাত্রার মান অভূতপূর্বভাবে উন্নত হয়েছিল। তাঁর শাসনামল ছিল মধ্যযুগের ভারতে মানবকল্যাণ ও সামাজিক নিরাপত্তার এক উজ্জ্বল দৃষ্টান্ত।</p>"],["শাসক ও বিজেতা হিসেবে সুলতান আলাউদ্দিন খলজির কৃতিত্ব বিচার কর।","<div class=\"h\">ভূমিকা</div><p>দিল্লি সালতানাতের খলজি রাজবংশের সর্বশ্রেষ্ঠ এবং ভারতীয় মুসলিম ইতিহাসের অন্যতম প্রতাপশালী, দূরদর্শী ও উচ্চাভিলাষী শাসক হলেন সুলতান আলাউদ্দিন খলজি (১২৯৬–১৩১৬ খ্রিস্টাব্দ)। জলালউদ্দিন খলজিকে হত্যা করে দিল্লির সিংহাসনে আরোহণ করার পর তিনি একাধারে একজন অদম্য বিজেতা এবং কঠোর প্রশাসক হিসেবে নিজের প্রতিভার স্বাক্ষর রাখেন। তিনি বিশ্বাস করতেন যে \"রাজত্বের কোনো আত্মীয়স্বজন নেই\" এবং ধর্মকে রাজনীতির বাইরে রেখে রাষ্ট্র পরিচালনা করতে হবে। সাম্রাজ্য রক্ষা ও সম্প্রসারণের পাশাপাশি তাঁর যুগান্তকারী বাজার নিয়ন্ত্রণ নীতি, সামরিক সংস্কার এবং রাজস্ব নীতি তাঁকে মধ্যযুগের ইতিহাসে অমর করে রেখেছে। শাসক ও বিজেতা হিসেবে আলাউদ্দিন খলজির কৃতিত্ব নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">ক. বিজেতা হিসেবে কৃতিত্ব (Military Conquests)</div><p>আলাউদ্দিন খলজি ছিলেন ভারতের অন্যতম সেরা সাম্রাজ্য বিজেতা। উত্তর ভারত জয় করার পর তিনি দক্ষিণ ভারতের দরজা উন্মুক্ত করেন:</p><p><b>১. উত্তর ভারতের বিজয়:</b> সিংহাসনে বসার পরই তিনি একে একে উত্তর ভারতের শক্তিশালী রাজ্যগুলো জয় করেন। ১২৯৯ খ্রিস্টাব্দে গুজরাট অভিযান দিয়ে শুরু করে তিনি রণথম্বোর, চিতৌর (মেইবার), মালওয়া, উজ্জয়িনী এবং মান্দু দখল করেন। চিতৌরের রানি পদ্মিনীকে কেন্দ্র করে তাঁর চিতৌর আক্রমণ ভারতীয় ইতিহাসে এক অমর ও রোমাঞ্চকর ঘটনা।</p><p><b>২. দক্ষিণ ভারত বিজয়:</b> উত্তর ভারত সুরক্ষিত করার পর তিনি তাঁর বিশ্বস্ত ও মেধাবী সেনাপতি মালিক কাফুর-এর নেতৃত্বে দক্ষিণ ভারতে বিশাল সামরিক অভিযান পরিচালনা করেন। মালিক কাফুরের নেতৃত্বে মুসলমান বাহিনী দেবাগিরির যাদব রাজবংশ, বারঙ্গলের কাকতীয় রাজবংশ, দ্বারসমুদ্রের হোসালা রাজবংশ এবং মাদুরাইয়ের পান্ড্য রাজ্যকে পরাজিত করে। যদিও তিনি দক্ষিণ ভারতের রাজ্যগুলোকে সরাসরি দিল্লির সাথে যুক্ত না করে করদ রাজ্যে পরিণত করেন, তবুও সেখান থেকে সংগৃহীত বিপুল পরিমাণ সোনা, রৌপ্য ও ধনসম্পদ উত্তর ভারতের অর্থনীতিকে সমৃদ্ধ করেছিল।</p><p><b>৩. মঙ্গোল আক্রমণ প্রতিহতকরণ:</b> আলাউদ্দিন খলজির শাসনামলে উত্তর-পশ্চিম সীমান্ত দিয়ে মঙ্গোলরা বারবার ভারত আক্রমণ করেছিল (যেমন: কুতলুগ খাজা ও তারদির আক্রমণ)। আলাউদ্দিন অত্যন্ত সাহসিকতা ও কঠোর রণকৌশলের সাথে এই ভয়ংকর মঙ্গোল আক্রমণগুলোকে সফলভাবে প্রতিহত করেন এবং মঙ্গোলদের হাত থেকে দিল্লি সালতানাতকে চিরতরে রক্ষা করেন।</p><div class=\"h\">খ. শাসক ও প্রশাসক হিসেবে কৃতিত্ব (Administrative & Economic Reforms)</div><p>একজন সফল বিজেতার পাশাপাশি আলাউদ্দিন খলজি ছিলেন একজন অতুলনীয় প্রশাসক। রাষ্ট্রকে সুরক্ষিত ও শক্তিশালী করতে তিনি একাধিক যুগান্তকারী সংস্কার সাধন করেছিলেন:</p><p><b>১. স্থায়ী সেনাবাহিনী গঠন:</b> তিনি প্রথম ভারতীয় শাসক যিনি সামন্তদের ওপর নির্ভরতা কমিয়ে সরাসরি কেন্দ্র থেকে একটি বিশাল, সুসজ্জিত ও স্থায়ী পেশাদার সৈন্যবাহিনী গঠন করেন এবং তাদের নগদ বেতনের ব্যবস্থা করেন।</p><p><b>২. সামরিক সংস্কার (দাগ ও চেহারা প্রথা):</b> সৈন্যদের দুর্নীতি রোধ করতে এবং ছদ্মবেশ বা অযোগ্যদের প্রবেশ আটকাতে তিনি সেনাবাহিনীর ঘোড়ার গায়ে দাগ দেওয়ার 'দাগ' প্রথা এবং সৈনিকদের শারীরিক বিবরণ ও পরিচয়পত্র সংরক্ষণের 'চেহারা' প্রথা চালু করেন।</p><p><b>৩. বিখ্যাত বাজার নিয়ন্ত্রণ ও মূল্যবৃদ্ধি রোধ নীতি (Price Control):</b> আলাউদ্দিন খলজির শাসনকালের সবচেয়ে বিস্ময়কর কীর্তি ছিল তাঁর বাজার নিয়ন্ত্রণ নীতি। কম বেতনে বিশাল সেনাবাহিনী টিকিয়ে রাখার জন্য তিনি নিত্যপ্রয়োজনীয় জিনিসপত্র (চাল, ডাল, তেল, কাপড়, ঘোড়া ইত্যাদি) থেকে শুরু করে সব পণ্যের দাম নির্দিষ্ট করে দেন। এই নীতি বাস্তবায়নের জন্য তিনি 'দেওয়ান-ই-রিয়াত' ও 'শাহনা-ই-মন্ডি' নামক বাজার পরিদর্শক ও আদালত স্থাপন করেন। কালোবাজারি ও মজুতদারদের বিরুদ্ধে তিনি এত কঠোর শাস্তি দিতেন যে, তৎকালীন বাজারে কেউ সুচ বা সুতার দামও এক পয়সা বেশি নিতে সাহস পেত না।</p><p><b>৪. রাজস্ব ও ভূমি সংস্কার:</b> কৃষকদের ওপর থেকে মধ্যস্বত্বভোগী ও জমিদারদের (খুদ, মুকাদ্দাম ও চৌধুরী) অতিরিক্ত ক্ষমতা খর্ব করে তিনি সরাসরি কৃষকদের কাছ থেকে উৎপাদিত ফসলের অর্ধেক (৫০%) ভূমি রাজস্ব হিসেবে আদায় করার নিয়ম করেন। এর ফলে কৃষকরা শোষিত হলেও রাষ্ট্রের কোষাগার উপচে পড়া সম্পদে ভরে যায়।</p><p><b>৫. গোয়েন্দা বিভাগ ও দমনমূলক নীতি:</b> অভিজাত ও অমাত্যরা যাতে কোনো ষড়যন্ত্র বা মদ্যপান করতে না পারে, সেজন্য তিনি অত্যন্ত কড়া গোয়েন্দা নেটওয়ার্ক গড়ে তোলেন। উচ্চবিত্তদের পারস্পরিক মেলামেশা, বিবাহ এবং পার্টি করার ওপর কঠোর নিষেধাজ্ঞা জারি করা হয়েছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সুলতান আলাউদ্দিন খলজি ছিলেন মধ্যযুগের এক অদ্বিতীয় প্রতিভা। তিনি একাধারে দুর্ধর্ষ বিজেতা এবং কঠোর লৌহমানব শাসক ছিলেন। তাঁর বাজার নিয়ন্ত্রণ নীতি এবং সামরিক সংস্কার ভারতীয় প্রশাসনিক ইতিহাসে এক অনন্য দৃষ্টান্ত স্থাপন করেছে। তাঁর কঠোর শাসনের কারণে মঙ্গোল আক্রমণ প্রতিহত হয়েছিল এবং দিল্লি সালতানাত তার শক্তির চরম শিখরে পৌঁছাতে সক্ষম হয়েছিল।</p>"],["দাস বংশের প্রকৃত প্রতিষ্ঠাতা হিসেবে সুলতান ইলতুৎমিশের কৃতিত্ব মূল্যায়ন কর।","<div class=\"h\">ভূমিকা</div><p>ভারতীয় উপমহাদেশে স্বাধীন দিল্লি সালতানাতের গোড়াপত্তন করেছিলেন কুতুবউদ্দিন আইবেক (১২০৬ খ্রিস্টাব্দ)। কিন্তু আইবেকের আকস্মিক মৃত্যু এবং তাঁর অযোগ্য উত্তরাধিকারী আরাম শাহের ব্যর্থতার কারণে নবপ্রতিষ্ঠিত সালতানাত যখন ধ্বংসের মুখে পড়ে, ঠিক সেই মুহূর্তে ত্রাতার ভূমিকায় অবতীর্ণ হন আইবেকের সুযোগ্য জামাতা ও সেনাপতি শামসুদ্দিন ইলতুৎমিশ (১২১১–১২৩৬ খ্রিস্টাব্দ)। তিনি অত্যন্ত বিচক্ষণতা, রাজনৈতিক প্রজ্ঞা ও সামরিক শক্তির বলে বিভক্ত সালতানাতকে ঐক্যবদ্ধ করেন এবং এর ভিত্তি মজবুত করেন। ঐতিহাসিকগণ তাই কুতুবউদ্দিন আইবেককে সালতানাতের 'প্রতিষ্ঠাতা' বললেও, ইলতুৎমিশকেই \"দাস বংশের প্রকৃত প্রতিষ্ঠাতা\" (True Founder of the Slave Dynasty) হিসেবে অভিহিত করে থাকেন। ইলতুৎমিশের এই ঐতিহাসিক কৃতিত্ব নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">ইলতুৎমিশের প্রারম্ভিক জীবন ও সিংহাসন লাভ</div><p>ইলতুৎমিশ তুর্কিস্তানের ইलबারী তুর্ক বংশে জন্মগ্রহণ করেছিলেন। শৈশবে সৎ ভাইদের হিংসার শিকার হয়ে তিনি দাস হিসেবে বিক্রিত হন। পরবর্তীতে কুতুবউদ্দিন আইবেক তাঁকে বিশাল মূল্যে ক্রয় করেন। তাঁর অসাধারণ মেধা, সততা এবং সামরিক দক্ষতার কারণে আইবেক তাঁকে নিজের কন্যার সাথে বিবাহ দেন এবং গাওয়ালিয়রের গভর্নর পদে নিযুক্ত করেন। ১২১১ খ্রিস্টাব্দে দিল্লির অযোগ্য শাসক আরাম শাহকে পরাজিত করে ইলতুৎমিশ দিল্লির মসনদে আসীন হন।</p><div class=\"h\">দাস বংশের প্রকৃত প্রতিষ্ঠাতা হিসেবে ইলতুৎমিশের কৃতিত্ব</div><p>ইলতুৎমিশের পঁচিশ বছরের দীর্ঘ শাসনকাল ছিল দিল্লি সালতানাতের প্রতিষ্ঠা, স্থায়িত্ব এবং সম্প্রসারণের স্বর্ণযুগ। তাঁর প্রধান কৃতিত্বগুলো নিচে আলোচনা করা হলো:</p><p><b>১. অভ্যন্তরীণ সংকট ও বিদ্রোহ দমন:</b> ইলতুৎমিশ যখন সিংহাসনে বসেন, তখন চারদিক থেকে বিদ্রোহ মাথাচাড়া দিয়েছিল। গজনীর শাসক তাজুদ্দিন ইলদিজ এবং সিন্ধুর বিদ্রোহী নাসেরউদ্দিন কুবাচা দিল্লির সার্বভৌমত্ব অস্বীকার করেছিলেন। এছাড়া বাংলার গভর্নর আলি মর্দান খানও স্বাধীনতা ঘোষণা করেছিলেন। ইলতুৎমিশ অত্যন্ত সাহসিকতার সাথে ১২১৫ খ্রিস্টাব্দের তরাইনের তৃতীয় যুদ্ধে ইলদিজকে পরাজিত করেন এবং পরবর্তীতে কুবাচাকে হটিয়ে বাংলা ও বিহার পুনরায় দিল্লির নিয়ন্ত্রণাধীন করেন। এর ফলে সালতানাতের ভৌগোলিক অখণ্ডতা রক্ষা পায়।</p><p><b>২. মঙ্গোল আক্রমণ থেকে ভারতকে রক্ষা (কৌশলগত কূটনীতি):</b> ইলতুৎমিশের শাসনামলে পৃথিবীর ত্রাস চেঙ্গিজ খানের নেতৃত্বে মঙ্গোল বাহিনী ভারত সীমান্তের দিকে ধেয়ে আসে। খোয়ারিজমের যুবরাজ জালালউদ্দিন মঙ্গোলদের ভয়ে পালিয়ে ভারতের দিকে আশ্রয় চান। ইলতুৎমিশ অত্যন্ত দূরদর্শিতা ও রাজনৈতিক প্রজ্ঞার পরিচয় দিয়ে জালালউদ্দিনকে রাজনৈতিক আশ্রয় দেওয়া থেকে বিরত থাকেন। ফলে চেঙ্গিজ খানের ক্রোধ থেকে ভারত তথা নবপ্রতিষ্ঠিত দিল্লি সালতানাত অলৌকিকভাবে রক্ষা পায়।</p><p><b>৩. ইক্তাদারী প্রথার প্রবর্তন (Administrative Reform):</b> সালতানাতের প্রশাসন পরিচালনার জন্য ইলতুৎমিশ 'ইক্তা' (Iqta) নামক একটি যুগান্তকারী ভূমি ও প্রশাসনিক ব্যবস্থা প্রবর্তন করেন। সাম্রাজ্যকে বিভিন্ন প্রদেশে (ইক্তা) ভাগ করে সেখানে বিশ্বস্ত সামরিক কর্মকর্তাদের (ইক্তাদার বা মুক্তি) নিয়োগ করা হতো। এই ইক্তাদাররা রাজস্ব আদায় ও আইন-শৃঙ্খলা রক্ষার দায়িত্ব পালন করতেন, যা কেন্দ্রীয় শাসনব্যবস্থাকে অত্যন্ত সুদৃঢ় করেছিল।</p><p><b>৪. মুদ্রাব্যবস্থা প্রবর্তন (Currency Reform):</b> আর্থিক লেনদেন এবং বাণিজ্যের স্থায়িত্বের জন্য ইলতুৎমিশ প্রথম ভারতীয় মুদ্রাব্যবস্থায় সংস্কার আনেন। তিনি খাঁটি আরবীয় মডেলে রূপার 'টাকা' এবং তামার 'জিতল' মুদ্রা প্রচলন করেন। এই মুদ্রা ব্যবস্থা দিল্লি সালতানাতকে একটি স্বাধীন অর্থনৈতিক সার্বভৌমত্ব প্রদান করে।</p><p><b>৫. চল্লিশ চক্র বা 'তুর্কান-ই-চহলগান' গঠন:</b> রাজদরবারের তুর্কি আমির ও অভিজাতদের আনুগত্য নিশ্চিত করতে এবং রাজশক্তিকে শক্তিশালী করতে তিনি চল্লিশ জন অত্যন্ত বিশ্বস্ত ও অভিজ্ঞ তুর্কি দাস সেনাপতিকে নিয়ে 'চহলগান' বা 'চল্লিশ চক্র' (Group of Forty) গঠন করেন, যা পরবর্তী কয়েক দশক ধরে সালতানাতের মূল চালিকাশক্তি হিসেবে কাজ করেছিল।</p><p><b>৬. বাগদাদের খলিফা থেকে আনুষ্ঠানিক স্বীকৃতি (Legal Sovereignty):</b> দিল্লির মুসলিম সাম্রাজ্যকে একটি বৈধ ও স্বাধীন সার্বভৌম রাষ্ট্র হিসেবে স্বীকৃতি পাওয়ার জন্য ইলতুৎমিশ ১২২৯ খ্রিস্টাব্দে বাগদাদের আব্বাসীয় খলিফা আল-মুসতানসির বিল্লাহর কাছ থেকে আনুষ্ঠানিকভাবে 'মনশূর' বা রাজকীয় স্বীকৃতিপত্র ও 'সুলতান-ই-আজম' উপাধি লাভ করেন। এর ফলে দিল্লির সালতানাত আন্তর্জাতিকভাবে আইনগত বৈধতা লাভ করে।</p><p><b>৭. স্থাপত্য ও সংস্কৃতির বিকাশ:</b> তিনি কুতুবউদ্দিন আইবেকের শুরু করা 'কুতুব মিনার'-এর কাজ সাফল্যের সাথে সমাপ্ত করেন। এছাড়া তিনি দিল্লিতে শামসি মাদ্রাসা, ঈদগাহ এবং নিজের ঐতিহাসিক মাজার নির্মাণ করে শিল্প ও সংস্কৃতির প্রতি তাঁর অনুরাগের পরিচয় দেন।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, কুতুবউদ্দিন আইবেক কেবল একটি নতুন রাজনৈতিক শক্তির বীজ বপন করেছিলেন, কিন্তু সেই চারাগাছকে একটি শক্তপোক্ত মহীরূহে রূপান্তর করার কঠিন কাজটি করেছিলেন সুলতান ইলতুৎমিশ। তাঁর রাজনৈতিক দূরদর্শিতা, অসামান্য সামরিক দক্ষতা এবং প্রশাসনিক সংস্কারের ফলেই দিল্লি সালতানাত স্থায়ী রূপ লাভ করেছিল। তাই ইতিহাসে তাঁকে \"দাস বংশের প্রকৃত প্রতিষ্ঠাতা\" হিসেবে মূল্যায়ন করা শতভাগ যথার্থ ও ঐতিহাসিক সত্য।</p><p>ইসলামের ইতিহাস ২য় পত্রের পরবর্তী তিনটি প্রশ্ন—৭. শাসক ও বিজেতা হিসেবে বাবরের কৃতিত্ব বিচার কর; ৮. দ্বীন-ই-ইলাহি কি? সম্রাট আকবরকে কেন 'মহান আকবর' বলা হয়?; এবং ৯. সম্রাট হুমায়ুন ও শের শাহের মধ্যে সংঘর্ষের একটি বিবরণ দাও এবং শের শাহের সাফল্যের কারণ কী—প্রতিটির বিস্তারিত ও সমৃদ্ধ উত্তর নিচে তুলে ধরা হলো:</p>"],["অথবা, শাসক ও বিজেতা হিসেবে বাবরের কৃতিত্ব বিচার কর।","<div class=\"h\">ভূমিকা</div><p>ভারতীয় উপমহাদেশে মধ্যযুগের ইতিহাসে মুঘল সাম্রাজ্যের প্রতিষ্ঠাতা হিসেবে জহির উদ্দিন মোহাম্মদ বাবর (১৫২৬–১৫৩০ খ্রিস্টাব্দ) এক অবিস্মরণীয় নাম। মধ্য এশিয়ার ছোট্ট রাজ্য ফারগানা থেকে বিতাড়িত হয়ে বিভিন্ন চড়াই-উৎরাই পেরিয়ে তিনি ভারতের মাটিতে পা রাখেন এবং ১৫২৬ খ্রিস্টাব্দের ঐতিহাসিক পানিপথের প্রথম যুদ্ধে লোদ বংশের শেষ সুলতান ইব্রাহিম লোদিকে পরাজিত করে ভারতে মুঘল সাম্রাজ্যের গোড়াপত্তন করেন। বাবর একাধারে ছিলেন একজন অদম্য সাহসী সেনাপতি, দূরদর্শী বিজেতা এবং অন্যদিকে ছিলেন সূক্ষ্ম শিল্পবোদ্ধা, সাহিত্যিক ও মানবিক শাসক। শাসক ও বিজেতা হিসেবে বাবরের কৃতিত্ব ও মূল্যায়ন নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">ক. বিজেতা হিসেবে বাবর (Military Conquester)</div><p>বাবর সামরিক ক্ষেত্রে মধ্যযুগের অন্যতম শ্রেষ্ঠ জেনারেল হিসেবে পরিচিত ছিলেন। তাঁর অসাধারণ রণকৌশল, বিশেষ করে 'তুলঘুমা' (Tulghuma) পদ্ধতি এবং কামানের সঠিক ব্যবহার তাঁকে যুদ্ধে জয়ী করেছিল। ভারতে আসার পর তিনি প্রধানত চারটি বড় যুদ্ধ জয় করে মুঘল সাম্রাজ্যের ভিত শক্ত করেছিলেন:</p><p><b>১. পানিপথের প্রথম যুদ্ধ (১৫২৬ খ্রিস্টাব্দ):</b> ইব্রাহিম লোদির বিশাল সৈন্যবাহিনীর বিরুদ্ধে পানিপথের ময়দানে বাবর মাত্র ১২ থেকে ১৫ হাজার সৈন্য নিয়ে মুখোমুখি হন। আধুনিক অস্ত্রশস্ত্র, বন্দুক এবং কামানের নিখুঁত ব্যবহারের মাধ্যমে বাবর ইব্রাহিম লোদিকে শোচনীয়ভাবে পরাজিত ও নিহত করেন। এই যুদ্ধই ভারতে দিল্লি সালতানাতের অবসান ঘটিয়ে মুঘল সাম্রাজ্যের পথ উন্মুক্ত করে।</p><p><b>২. খানুয়ার যুদ্ধ (১৫২৭ খ্রিস্টাব্দ):</b> রাজপুত শক্তির প্রতীক মেওয়ারের রানা সংগ্রাম সিংহ (রানা সাঙ্গা) এক বিশাল রাজপুত জোট গঠন করে বাবরকে ভারত থেকে তাড়িয়ে দেওয়ার জন্য অগ্রসর হন। ফতেহপুরের খানুয়া নামক স্থানে এই রক্তক্ষয়ী যুদ্ধ সংঘটিত হয়। বাবর তাঁর সৈন্যদের মধ্যে ধর্মীয় উদ্দীপনা এবং জেহাদের ডাক দিয়ে মনোবল চাঙ্গা করেন এবং কামান ও বন্দুকের সহায়তায় রানা সাঙ্গাকে পরাজিত করেন। এই জয় ভারতের মাটিতে মুঘলদের অবস্থান চিরস্থায়ী করে তোলে।</p><p><b>৩. চাদেরী যুদ্ধ (১৫২৮ খ্রিস্টাব্দ):</b> রানা সাঙ্গার মৃত্যুর পর রাজপুতদের আরেক প্রভাবশালী নেতা মেদিনী রায়ের বিরুদ্ধে চাদেরী দুর্গ আক্রমণ করেন বাবর। অত্যন্ত কঠিন এই যুদ্ধে বাবর জয়লাভ করেন এবং রাজপুতদের ক্ষমতা বহুলাংশে খর্ব করেন।</p><p><b>৪. ঘাগড়ার যুদ্ধ (১৫২৯ খ্রিস্টাব্দ):</b> বিহার ও বাংলার আফগান সুলতানরা একত্রিত হয়ে মুঘলদের বিরুদ্ধে প্রতিরোধ গড়ে তোলে। পাটনার নিকটবর্তী ঘাগড়া নদীর সঙ্গমস্থলে বাবর স্থল ও জলপথে একযোগে আক্রমণ চালিয়ে আফগান শক্তিকে চূড়ান্তভাবে পরাস্ত করেন।</p><div class=\"h\">খ. শাসক ও প্রশাসক হিসেবে বাবর (Ruler and Administrator)</div><p>বাবরের স্বাধীন ভারতে রাজত্ব করার সুযোগ হয়েছিল মাত্র চার বছর (১৫২৬–১৫৩০ খ্রিস্টাব্দ)। এত সংক্ষিপ্ত সময়ে তিনি বিশাল প্রশাসনিক সংস্কার করার সুযোগ না পেলেও একজন শাসক হিসেবে তাঁর অনন্য কিছু গুণ ও কৃতিত্ব ছিল:</p><p><b>১. উদার ও মানবিক দৃষ্টিভঙ্গি:</b> তৎকালীন মধ্যযুগীয় রাজাদের তুলনায় বাবর ধর্মীয় ক্ষেত্রে যথেষ্ট উদার ছিলেন। তিনি বিজিত অঞ্চলের মানুষের প্রতি প্রতিশোধপরায়ণ না হয়ে তাদের সাথে সহনশীল আচরণ করার নির্দেশ দিয়েছিলেন।</p><p><b>২. শিল্প, সাহিত্য ও সংস্কৃতির পৃষ্ঠপোষকতা:</b> বাবর ছিলেন অত্যন্ত উচ্চমানের সাহিত্যিক ও শিল্পপ্রেমী। তিনি তুর্কি ভাষায় তাঁর আত্মজীবনী 'তুজুক-ই-বাবুরি' (বাবরনামা) রচনা করেন, যা বিশ্ব সাহিত্যের ইতিহাসে অন্যতম শ্রেষ্ঠ আত্মজীবনী হিসেবে স্বীকৃত। এতে ভারতের প্রকৃতি, উদ্ভিদ, জীবজন্তু, মানুষ এবং রাজনীতির এক অত্যন্ত জীবন্ত ও নিরপেক্ষ বিবরণ পাওয়া যায়।</p><p><b>৩. বাগান নির্মাণ ও স্থাপত্যের অনুরাগ:</b> তিনি পারস্য ও মধ্য এশিয়ার আদলে ভারতের মাটিতে চারবাগ (Charbagh) শৈলীর সুন্দর সুন্দর উদ্যান বা বাগান তৈরি করেছিলেন (যেমন: আগ্রার আরামবাগ)। তিনি প্রকৃতির সৌন্দর্য উপভোগ করতে ভালোবাসতেন এবং ললিতকলার প্রতি তাঁর গভীর অনুরাগের পরিচয় দিয়েছিলেন।</p><p><b>৪. সেনাপতিদের প্রতি আনুগত্য ও ন্যায়পরায়ণতা:</b> বাবর তাঁর অধীনস্থ সেনাপতি এবং সৈনিকদের প্রতি অত্যন্ত আস্থাশীল ও দয়াশীল ছিলেন। তিনি বিজিত সম্পদ নিজের জন্য কুক্ষিগত না করে উদারহস্তে সেনাপতি ও সঙ্গীদের মধ্যে বিলিয়ে দিয়েছিলেন, যার ফলে তাঁর সেনাবাহিনী তাঁর প্রতি চরমভাবে অনুগত ছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, বাবর কেবল একজন দুর্ধর্ষ বিজেতাই ছিলেন না, বরং তিনি ছিলেন একজন সংস্কৃতিমনস্ক, মেধাবী ও মানবিক শাসক। তাঁর অসামান্য সামরিক মেধা ভারতের রাজনৈতিক মানচিত্রকে চিরকালের জন্য বদলে দিয়েছিল এবং এমন এক বিশাল সাম্রাজ্যের বীজ বুনেছিল যা পরবর্তী দুই শতাব্দী ধরে ভারতীয় উপমহাদেশে রাজত্ব করেছিল।</p>"],["মুঘল সাম্রাজ্যের সংহতি বিধানে সম্রাট আকবরের নীতিসমূহ ব্যাখ্যা কর।","<div class=\"h\">ভূমিকা</div><p>ভারতীয় উপমহাদেশের মধ্যযুগীয় ইতিহাসে মুঘল সাম্রাজ্যের ভিত্তিকে সুদৃঢ়, অখণ্ড এবং দীর্ঘস্থায়ী করার ক্ষেত্রে তৃতীয় মুঘল সম্রাট জালালউদ্দিন মোহাম্মদ আকবর (১৫৫৬–১৬০৫ খ্রিস্টাব্দ)-এর অবদান অতুলনীয়। ১৫৫৬ সালে যখন তিনি পানিপথের দ্বিতীয় যুদ্ধে জয়লাভ করে সিংহাসনে আরোহণ করেন, তখন মুঘল সাম্রাজ্য ছিল একটি অত্যন্ত ভঙ্গুর ও সীমিত শক্তির রাষ্ট্র। চারপাশের বিদ্রোহী শক্তি, রাজপুত রাজ্যগুলোর শত্রুতা, ধর্মীয় গোঁড়ামি এবং প্রশাসনিক অরাজকতা সাম্রাজ্যের অস্তিত্বকে বিপন্ন করে তুলেছিল। কিন্তু সম্রাট আকবর তাঁর অসাধারণ রাজনৈতিক প্রজ্ঞা, দূরদর্শিতা এবং সুদূরপ্রসারী সংস্কারের মাধ্যমে কেবল এই সংকটগুলো মোকাবিলাই করেননি, বরং তিনি বিভিন্ন জাতি, ধর্ম ও সংস্কৃতির মানুষকে একটি একক কেন্দ্রীয় শাসনের আওতায় এনে মুঘল সাম্রাজ্যকে একটি শক্তিশালী ও অখণ্ড রাষ্ট্রে রূপান্তর করেছিলেন। মুঘল সাম্রাজ্যের সংহতি ও স্থায়িত্ব বিধানে সম্রাট আকবর যে সমস্ত যুগান্তকারী নীতি ও সংস্কার বাস্তবায়ন করেছিলেন, তা নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">১. উদার রাজপুত নীতি (Rajput Policy)</div><p>আকবরের সাম্রাজ্য সংহতি বিধানের সবচেয়ে বড় মাস্টারপিস ছিল তাঁর রাজপুত নীতি। এর পূর্বে কোনো মুসলিম শাসক রাজপুতদের সাথে বন্ধুত্বের সম্পর্ক গড়তে পারেননি; বরং তাদের শত্রু হিসেবে দমন করার নীতি অনুসরণ করা হতো। আকবর উপলব্ধি করেছিলেন যে ভারতের বিশাল ভূখণ্ড শাসন করতে হলে বীর ও লড়াকু রাজপুতদের শত্রু বানিয়ে নয়, বরং বন্ধু বানিয়ে পাশে পাওয়া প্রয়োজন।</p><p><b>বৈবাহিক সম্পর্ক স্থাপন:</b> আকবর নিজে এবং রাজপরিবারের সদস্যরা রাজপুত রাজকন্যাদের সাথে বিবাহ বন্ধনে আবদ্ধ হন (যেমন: অম্বর বা জয়পুরের রাজা ভরমলের কন্যা জোধাবাই বা হীরাকুমারীর সাথে আকবরের বিবাহ)। এই বৈবাহিক সম্পর্ক মুঘল ও রাজপুতদের মধ্যে দীর্ঘদিনের বরফ গলিয়ে দেয়।</p><p><b>উচ্চ পদ প্রদান ও সম্মান:</b> রাজপুত রাজাদের রাজদরবারে সর্বোচ্চ সামরিক ও প্রশাসনিক পদে নিয়োগ করা হয়। রাজা মানসিংহ, রাজা ভগবান দাস এবং টোডরমলের মতো রাজপুতরা মুঘল সাম্রাজ্যের স্তম্ভে পরিণত হন।</p><p><b>আত্মমর্যাদা রক্ষা:</b> রাজপুত রাজাদের নিজ নিজ রাজ্যে অভ্যন্তরীণ স্বায়ত্তশাসন বজায় রাখার অধিকার দেওয়া হয় এবং তাদের ধর্মে হস্তক্ষেপ করা হয়নি। এর ফলে মেওয়ারের রানা প্রতাপের মতো কিছু ব্যতিক্রম ছাড়া প্রায় সমস্ত রাজপুত রাজ্য স্বেচ্ছায় মুঘলদের আনুগত্য স্বীকার করে নেয় এবং মুঘল সাম্রাজ্যের সুরক্ষায় সবচেয়ে বিশ্বস্ত সেনাবল হিসেবে আত্মপ্রকাশ করে।</p><p>২. ধর্মীয় সহনশীলতা ও 'সুলহ-ই-কুল' নীতি (Religious Policy & Sulh-i-Kul)</p><p>তৎকালীন ভারত ছিল বহু ধর্মাবলম্বীর একটি দেশ। ধর্মীয় গোঁড়ামি ও সাম্প্রদায়িকতা সাম্রাজ্যের সংহতিকে ভেঙে দিতে পারে—এটি বুঝতে পেরে আকবর সম্পূর্ণ ধর্মনিরপেক্ষ ও সহনশীল নীতি গ্রহণ করেন:</p><p><b>জিজিয়া ও তীর্থযাত্রী কর বাতিল:</b> আকবর ১৫৬৪ খ্রিস্টাব্দে অমুসলিম প্রজাদের ওপর থেকে বৈষম্যমূলক 'জিজিয়া কর' এবং পরবর্তীতে হিন্দু তীর্থযাত্রীদের ওপর ধার্যকৃত তীর্থকর চিরতরে বাতিল করে দেন। এর মাধ্যমে তিনি প্রজাদের মনে সমতার বার্তা পৌঁছে দেন।</p><p><b>সুলহ-ই-কুল (সকলের সাথে শান্তি):</b> তাঁর নীতিমালার মূল ভিত্তি ছিল 'সুলহ-ই-কুল' বা সার্বজনীন শান্তি। তিনি সকল ধর্মের মানুষকে সমান চোখে দেখতেন এবং ফতেহপুর সিক্রিতে 'ইবাদত খানা' প্রতিষ্ঠা করে সমস্ত ধর্মের পন্ডিতদের নিয়ে নিয়মিত আলোচনা ও বিতর্ক সভা পরিচালনা করতেন।</p><p><b>দ্বীন-ই-ইলাহি:</b> সকল ধর্মের ভালো দিকগুলো একত্রিত করে তিনি 'দ্বীন-ই-ইলাহি' নামক একটি নৈতিক ও আধ্যাত্মিক মতবাদ প্রবর্তন করেন, যা রাজদরবারের বিভিন্ন সম্প্রদায়ের মধ্যে দূরত্ব কমিয়ে দিয়েছিল।</p><div class=\"h\">৩. মনসবদারী প্রথা ও সামরিক সংস্কার (Mansabdari System)</div><p>মুঘল সাম্রাজ্যের প্রশাসনিক ও সামরিক মেরুদণ্ডকে শক্তিশালী করার জন্য আকবর একটি অনন্য পদ্ধতি প্রবর্তন করেন, যা ইতিহাসে 'মনসবদারী প্রথা' নামে পরিচিত:</p><p>এই প্রথার মাধ্যমে সাম্রাজ্যের সমস্ত সামরিক ও বেসামরিক কর্মকর্তাদের একটি নির্দিষ্ট পদমর্যাদা বা 'মনসব' দেওয়া হতো।</p><p>মনসবদারদের দুটি অংশ ছিল—'জাত' (ব্যক্তিগত পদমর্যাদা) এবং 'সওয়ার' (ঘোড়সওয়ার সেনার সংখ্যা)।</p><p>এর মাধ্যমে আকবর সামন্তদের ওপর থেকে নির্ভরতা কমিয়ে সরাসরি কেন্দ্র থেকে একটি সুশৃঙ্খল, অনুগত এবং পেশাদার সেনাবাহিনী গড়ে তোলেন। এই প্রথা সাম্রাজ্যের যেকোনো প্রান্তে দ্রুত সৈন্যপ্রেরণ এবং আইন-শৃঙ্খলা রক্ষা করার ক্ষেত্রে বিশাল ভূমিকা পালন করেছিল।</p><div class=\"h\">৪. ভূমি রাজস্ব ও অর্থনৈতিক সংস্কার (Dahshala System)</div><p>আকবরের রাজস্ব মন্ত্রী রাজা টোডরমল-এর সহায়তায় প্রবর্তিত ভূমি রাজস্ব সংস্কার মুঘল সাম্রাজ্যের অর্থনৈতিক ভিতকে সবচেয়ে মজবুত করেছিল:</p><p><b>দহশালা পদ্ধতি:</b> গত দশ বছরের ফসলের গড় উৎপাদন এবং গড় বাজারমূল্যের ওপর ভিত্তি করে স্থায়ী ও বৈজ্ঞানিক ভূমি রাজস্ব নির্ধারণ করা হয়।</p><p>জমি পরিমাপের জন্য প্রমিত দড়ি ও গজ প্রবর্তন করা হয় এবং মাটির উর্বরতার ওপর ভিত্তি করে জমিকে বিভিন্ন শ্রেণিতে ভাগ করা হয়।</p><p>খরা, বন্যা বা প্রাকৃতিক দুর্যোগের সময় কৃষকদের খাজনা মওকুফ বা ঋণ দেওয়া হতো। এর ফলে কৃষকরা শোষণের হাত থেকে রক্ষা পায় এবং রাষ্ট্রে নিয়মিত রাজস্ব আসতে থাকে, যা বিশাল সেনাবাহিনী ও প্রশাসন টিকিয়ে রাখতে সাহায্য করেছিল।</p><div class=\"h\">৫. প্রশাসনিক একত্রীকরণ ও সুবাহ গঠন</div><p>বিশাল সাম্রাজ্যকে সুচারুভাবে পরিচালনার জন্য আকবর প্রদেশ বা 'সুবাহ'ভিত্তিক প্রশাসনিক কাঠামো গড়ে তোলেন:</p><p>তিনি তাঁর সাম্রাজ্যকে প্রথমে ১২টি এবং পরবর্তীতে দাক্ষিণাত্য বিজয়ের পর ১৫টি 'সুবাহ' বা প্রদেশে বিভক্ত করেন।</p><p>প্রতিটি সুবাহর জন্য একজন 'সুবাহদার' (প্রশাসনিক প্রধান), একজন 'দিওয়ান' (রাজস্ব প্রধান), 'বকসী' (সামরিক প্রধান) এবং 'কাজি' (বিচার বিভাগীয় প্রধান) নিয়োগ করা হয়। এই ক্ষমতার বিকেন্দ্রীকরণ ও চেক-অ্যান্ড-ব্যালেন্স নীতি প্রশাসনকে অত্যন্ত দুর্নীতিমুক্ত ও কার্যকর করে তুলেছিল।</p><div class=\"h\">৬. সাংস্কৃতিক ও সামাজিক সংহতি</div><p>আকবর সমাজে প্রচলিত বিভিন্ন কুপ্রথা, যেমন—সতীদাহ প্রথা নিরুৎসাহিত করা, বাল্যবিবাহ রোধ করা এবং জোরপূর্বক ধর্মান্তর নিষিদ্ধ করার ক্ষেত্রে পদক্ষেপ নেন। এছাড়া অনুবাদ বিভাগ প্রতিষ্ঠার মাধ্যমে সংস্কৃত ও পারসিক সাহিত্যের সংমিশ্রণ ঘটান, যা একটি সংহত 'গাংগা-যমুনা' সংস্কৃতির জন্ম দিয়েছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সম্রাট আকবরের এই সুদূরপ্রসারী নীতিগুলো কেবল মুঘল সাম্রাজ্যকে ধ্বংসের হাত থেকেই রক্ষা করেনি, বরং একে একটি অখণ্ড, শক্তিশালী এবং আধুনিক রাষ্ট্রে পরিণত করেছিল। তাঁর রাজনৈতিক দূরদর্শিতা ও ইনসাফের নীতির ফলেই মুঘল সাম্রাজ্য পরবর্তীতে শত শত বছর ধরে ভারতীয় উপমহাদেশে তার আধিপত্য বজায় রাখতে সক্ষম হয়েছিল।</p>"],["মুঘল রাজনীতিতে নুরজাহানের ভূমিকা মূল্যায়ন কর।","<div class=\"h\">ভূমিকা</div><p>মুঘল সাম্রাজ্যের ইতিহাসে সম্রাট জাহাঙ্গীরের প্রিয়তমা স্ত্রী নুরজাহান (যাঁর মূল নাম মেহেরউন্নিসা) হলেন মধ্যযুগের অন্যতম প্রভাবশালী, চতুর, উচ্চাভিলাষী এবং ক্ষমতাবান নারী। ১৬১১ খ্রিস্টাব্দে সম্রাট জাহাঙ্গীরের সাথে বিবাহবন্ধনে আবদ্ধ হওয়ার পর তিনি কেবল মুঘল অন্তঃপুরের রানির মর্যাদাতেই সীমাবদ্ধ থাকেননি, বরং জাহাঙ্গীরের জীবনের শেষ পনেরো বছর (বিশেষ করে ১৬২২ থেকে ১৬২৭ খ্রিস্টাব্দ পর্যন্ত) তিনি মুঘল সাম্রাজ্যের প্রকৃত ক্ষমতার কেন্দ্রবিন্দুতে পরিণত হয়েছিলেন। সমকালীন রাজনীতিতে তাঁর এই অবিসংবাদিত আধিপত্য এবং প্রভাব এত বেশি ছিল যে, তাঁকে মুঘল সিংহাসনের পর্দার আড়ালের সর্বেসর্বা চালিকাশক্তি বলা চলে। মুঘল রাজনীতিতে নুরজাহানের ভূমিকা ও তার বহুমুখী মূল্যায়ন নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">১. 'নুরজাহান চক্র' বা পলিটিক্যাল জুন্টা গঠন</div><p>নুরজাহান সিংহাসনে বসার পর থেকেই রাজদরবারে নিজের পারিবারিক ও রাজনৈতিক আধিপত্য বিস্তার করার জন্য একটি শক্তিশালী রাজনৈতিক বলয় তৈরি করেছিলেন, যা ইতিহাসে 'নুরজাহান চক্র' বা জুন্টা (Nur Jahan Junta) নামে পরিচিত।</p><p>এই চক্রের মূল চালিকাশক্তি ছিলেন স্বয়ং নুরজাহান, তাঁর চতুর পিতা ইতিমাদ-উদ্দৌলা (যিনি প্রধান উজির হয়েছিলেন), তাঁর সুযোগ্য ভাই আসফ খান এবং তৎকালীন যুবরাজ প্রিন্স খুররম (যিনি পরবর্তীতে সম্রাট শাহজাহান হন)।</p><p>এই পরিবারের সদস্যরাই মুঘল প্রশাসনের সমস্ত গুরুত্বপূর্ণ পদ এবং নীতিনির্ধারণী ক্ষমতা নিজেদের হাতের মুঠোয় পুরেছিলেন। এর ফলে যেকোনো নিয়োগ, বদলি বা নীতি নির্ধারণে নুরজাহানের মতামতের ওপর নির্ভর করতে হতো।</p><div class=\"h\">২. প্রকৃত ক্ষমতার অধিকারী ও শাহী ফরমান জারি</div><p>সম্রাট জাহাঙ্গীর অতিরিক্ত মদ্যপান এবং দীর্ঘ অসুস্থতার কারণে রাজকার্য থেকে ধীরে ধীরে দূরে সরে যাচ্ছিলেন। এই সুযোগে নুরজাহান সরাসরি রাজকীয় ক্ষমতার লাগাম নিজের হাতে তুলে নেন:</p><p>তিনি প্রতিদিন রাজদরবারের বারান্দায় এসে 'ঝরখা দর্শন' দিতেন এবং রাজমন্ত্রীদের সাথে আলোচনা করে সিদ্ধান্ত গ্রহণ করতেন।</p><p>সরকারি সমস্ত দলিলে ও আদেশে সম্রাটের স্বাক্ষরের পাশাপাশি নুরজাহানের স্বাক্ষর বা সীলমোহর থাকা বাধ্যতামূলক হয়ে পড়েছিল।</p><p>এমনকি তাঁর নামে রাজকীয় মুদ্রা বা সিক্কা জারি করা হয়েছিল এবং রাজকীয় ফরমানগুলোতে 'বাদশা বেগম নুরজাহান' উপাধি ব্যবহার করা হতো। মধ্যযুগের মুসলিম বিশ্বে কোনো নারীর নামে মুদ্রা জারি হওয়া ছিল এক অভূতপূর্ব ও ব্যতিক্রমী ঘটনা।</p><div class=\"h\">৩. উত্তরাধিকার রাজনীতি ও শাহজাহানের সাথে দ্বন্দ্ব</div><p>নুরজাহান রাজনৈতিকভাবে অত্যন্ত উচ্চাভিলাষী ছিলেন এবং তিনি চেয়েছিলেন সিংহাসনের উত্তরাধিকার যেন তাঁর অনুগত ও পসন্দসই ব্যক্তির হাতে যায়। এই উদ্দেশ্যে তিনি প্রথমে প্রিন্স খুররমকে (শাহজাহান) সমর্থন করেছিলেন এবং নিজের কন্যা লাডলি বেগমের সাথে জাহাঙ্গীরের কনিষ্ঠ পুত্র শাহরিয়ারের বিবাহ দেন।</p><p>কিন্তু পরবর্তীতে যখন শাহজাহান স্বাধীনচেতা ও অতিরিক্ত ক্ষমতাশালী হয়ে ওঠেন, তখন নুরজাহান তাঁর দিক থেকে মুখ ফিরিয়ে নেন এবং শাহরিয়ারকে সিংহাসনে বসানোর জন্য গোপনে ষড়যন্ত্র শুরু করেন।</p><p>এই উত্তরাধিকার দ্বন্দ্বের কারণে মুঘল রাজনীতিতে চরম ফাটল ধরে এবং শাহজাহান বিদ্রোহ ঘোষণা করেন, যা সাম্রাজ্যের অভ্যন্তরীণ স্থিতিশীলতাকে মারাত্মকভাবে নাড়া দিয়েছিল।</p><div class=\"h\">৪. সেনাপতি মহাবত খানের সাথে সংঘাত</div><p>নুরজাহানের ক্রমবর্ধমান রাজনৈতিক ক্ষমতা ও পারিবারিক আধিপত্য সেনাপতি মহাবত খানের মতো প্রভাবশালী মুঘল আমলাদের মধ্যে চরম ক্ষোভের জন্ম দিয়েছিল। মহাবত খান যখন নুরজাহানের এই একচ্ছত্র ক্ষমতার বিরুদ্ধে অবস্থান নেন, তখন নুরজাহান অত্যন্ত সাহসিকতার সাথে কূটকৌশল অবলম্বন করেন। তিনি খোদ জাহাঙ্গীরকে বন্দিদশা থেকে মুক্ত করার জন্য অত্যন্ত বুদ্ধিমত্তা ও বীরত্বের পরিচয় দিয়েছিলেন, যা তাঁর রাজনৈতিক দূরদর্শিতা ও সাহসিকতার প্রমাণ দেয়।</p><div class=\"h\">৫. শিল্প, সংস্কৃতি ও বাণিজ্যের পৃষ্ঠপোষকতা</div><p>রাজনীতির বাইরেও নুরজাহান মুঘল সংস্কৃতি ও অর্থনীতিতে গভীর ছাপ রেখে গেছেন:</p><p>তিনি আগ্রায় তাঁর পিতা ইতিমাদ-উদ্দৌলার স্মরণে যে মাজারটি নির্মাণ করেন, তা পরবর্তীকালে 'তাজমহল'-এর পূর্বসূরি হিসেবে মার্বেল পাথরের জাদুকরি কাজ ও 'পিয়েত্রা দুরা' (Pietra Dura) শৈলীর সূচনা করেছিল।</p><p>তিনি সুগন্ধি ইত্র বা গোলাপ জল আবিষ্কারের সাথে যুক্ত ছিলেন এবং পোশাক-পরিচ্ছদ ও নারীদের ফ্যাশনে নতুন ধারা নিয়ে এসেছিলেন। এছাড়া বাণিজ্যের প্রসারে তিনি বিভিন্ন পণ্যের ব্যবসা নিয়ন্ত্রণ করেছিলেন।</p><div class=\"h\">নুরজাহানের ভূমিকার মূল্যায়ন (ইতিবাচক ও নেতিবাচক দিক)</div><p><b>ইতিবাচক দিক:</b> নুরজাহান ছিলেন অত্যন্ত প্রখর বুদ্ধিমত্তা সম্পন্ন, দানশীল এবং সংকট মুহূর্তে ঠাণ্ডা মাথায় সিদ্ধান্ত নিতে সক্ষম এক নেত্রী। জাহাঙ্গীরের অসুস্থতার সময়ে তিনি যেভাবে সাম্রাজ্যকে গৃহযুদ্ধের হাত থেকে রক্ষা করে স্থিতিশীলতা বজায় রেখেছিলেন, তা প্রশংসনীয়।</p><p><b>নেতিবাচক দিক:</b> অন্যদিকে, তাঁর অতিরিক্ত পরিবারপ্রীতি এবং উত্তরাধিকার নিয়ে অতিমাত্রায় রাজনৈতিক হস্তক্ষেপ মুঘল রাজপরিবারে গৃহযুদ্ধ ও চরম অনৈক্য সৃষ্টি করেছিল। তাঁর উচ্চাভিলাষ অনেক সময় সাম্রাজ্যের বৃহত্তর স্বার্থকে ব্যাহত করেছিল।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, মুঘল রাজনীতিতে নুরজাহানের ভূমিকা ছিল একাধারে চমকপ্রদ, প্রভাবশালী ও অত্যন্ত বিতর্কিত। পুরুষতান্ত্রিক মধ্যযুগীয় রাজদরবারে দাঁড়িয়ে তিনি যেভাবে ক্ষমতার সর্বোচ্চ শিখরে আরোহণ করেছিলেন এবং মুঘল সাম্রাজ্যের ভাগ্য নিয়ন্ত্রণ করেছিলেন, তা ইতিহাসে বিরল। তিনি কেবল জাহাঙ্গীরের রানিই ছিলেন না, বরং তিনি ছিলেন এক প্রকৃত অর্থেই সার্বভৌম ক্ষমতার অধিকারী সাম্রাজ্য পরিচালিকা।</p>"],["দ্বীন-ই-ইলাহি কি? সম্রাট আকবরকে কেন 'মহান আকবর' বলা হয়?","<div class=\"h\">ভূমিকা</div><p>মুঘল সাম্রাজ্যের সর্বশ্রেষ্ঠ ও সর্বাধিক জনপ্রিয় সম্রাট হলেন জালাল উদ্দিন মোহাম্মদ আবর (১৫৫৬–১৬০৫ খ্রিস্টাব্দ)। তাঁর দীর্ঘ অর্ধশতাব্দীর রাজত্বকাল কেবল মুঘল সাম্রাজ্যের ভৌগোলিক বিস্তারই ঘটায়নি, বরং ভারতের সামাজিক, ধর্মীয়, রাজনৈতিক ও সাংস্কৃতিক জীবনে এক যুগান্তকারী ও প্রগতিশীল নবজাগরণের সূচনা করেছিল। বিভিন্ন ধর্মের মানুষের মধ্যে সম্প্রীতি বজায় রাখা এবং সুসংহত সাম্রাজ্য গড়ে তোলার জন্য তিনি যেমন 'দ্বীন-ই-ইলাহি' নামক নৈতিক ও আধ্যাত্মিক মতবাদ প্রবর্তন করেছিলেন, তেমনি তাঁর বহুমুখী প্রশাসনিক সংস্কারের কারণে তাঁকে ইতিহাসে \"মহান আকবর\" (Akbar the Great) নামে ভূষিত করা হয়েছে। নিচে এই দুটি বিষয়ে বিস্তারিত আলোচনা করা হলো।</p><div class=\"h\">ক. দ্বীন-ই-ইলাহি কী? (What is Din-i Ilahi?)</div><p>'দ্বীন-ই-ইলাহি' (দ্বীন অর্থ ধর্ম বা পথ, ইলাহি অর্থ আল্লাহর) বা 'তৌহিদ-ই-ইলাহি' হলো ১৫৮২ খ্রিস্টাব্দে সম্রাট আকবর কর্তৃক প্রবর্তিত একটি আধ্যাত্মিক ও নৈতিক মতবাদ।</p><p><b>পটভূমি:</b> আকবর বিভিন্ন ধর্ম নিয়ে আলোচনার জন্য ফতেহপুর সিক্রিতে 'ইবাদত খানা' (প্রার্থনা গৃহ) প্রতিষ্ঠা করেছিলেন। সেখানে ইসলাম, হিন্দুধর্ম, খ্রিস্টধর্ম, জৈনধর্ম, বৌদ্ধধর্ম এবং পারসিক জরাথুস্ট্র ধর্মের পন্ডিতদের বিতর্ক শুনে তিনি এই সিদ্ধান্তে উপনীত হন যে, প্রতিটি ধর্মের মধ্যেই সত্যের কিছু না কিছু উপাদান রয়েছে। কিন্তু গোঁড়ামি ও সাম্প্রদায়িকতা মানুষের মধ্যে বিভেদ তৈরি করছে। সকল ধর্মের ভালো দিকগুলো নিয়ে তিনি একটি সর্বজনীন ও সহনশীল নৈতিক আদর্শ গড়ে তুলতে চেয়েছিলেন।</p><p><b>প্রকৃতি ও বৈশিষ্ট্য:</b> দ্বীন-ই-ইলাহি কোনো নতুন ধর্ম বা ইসলাম ধর্ম থেকে বিচ্ছিন্ন কোনো আলাদা কিতাবভিত্তিক ধর্ম ছিল না। এটি ছিল মূলত আকবরের অনুসারী কিছু অভিজাত ও পন্ডিত ব্যক্তির জন্য একটি নৈতিক ভ্রাতৃত্ব সংঘ। এর মূল কথা ছিল—এক ঈশ্বর, নৈতিক জীবনযাপন, অহিংসা, পরমতসহিষ্ণুতা এবং সম্রাটের প্রতি সম্পূর্ণ আনুগত্য। এতে কোনো পবিত্র গ্রন্থ, বিশেষ উপাসনালয় বা পুরোহিত শ্রেণী ছিল না। আকবরের মৃত্যুর সাথে সাথেই এই মতবাদ মূলত বিলুপ্ত হয়ে যায়।</p><p>খ. সম্রাট আকবরকে কেন 'মহান আকবর' বলা হয়? (Why is he called Akbar the Great?)</p><p>আকবরকে কেবল তাঁর সামরিক বিজয়ের জন্য নয়, বরং তাঁর বহুমুখী ও সুদূরপ্রসারী সংস্কারগুলোর জন্য 'মহান' বলা হয়। তাঁর কৃতিত্বগুলো নিম্নরূপ:</p><p><b>১. অতুলনীয় প্রশাসনিক ও রাজস্ব সংস্কার:</b> আকবর সাম্রাজ্যকে সুশৃঙ্খলভাবে পরিচালনার জন্য অত্যন্ত আধুনিক প্রশাসনিক কাঠামো গড়ে তোলেন। তাঁর অর্থমন্ত্রী রাজা টোডরমলের সহায়তায় প্রবর্তিত 'দহশালা' ভূমি রাজস্ব ব্যবস্থা কৃষকদের নিরাপত্তা নিশ্চিত করে। এছাড়া প্রশাসনিক পদগুলোতে মেধার ভিত্তিতে পদায়নের জন্য তিনি 'মনসবদারী প্রথা' (Mansabdari System) চালু করেন, যা মুঘল প্রশাসনকে সুসংহত করেছিল।</p><p><b>২. ধর্মীয় সহনশীলতা ও ধর্মনিরপেক্ষ নীতি (সুলহ-ই-কুল):</b> আকবর মুঘল সাম্রাজ্যের অখণ্ডতা বজায় রাখার জন্য ধর্মীয় গোঁড়ামি দূর করেন। তিনি হিন্দুদের ওপর থেকে বৈষম্যমূলক জিজিয়া কর এবং তীর্থযাত্রী কর চিরতরে বাতিল করে দেন। সকল ধর্মের মানুষের প্রতি সমান সম্মান প্রদর্শনের এই নীতিকে 'সুলহ-ই-কুল' (সকলের সাথে শান্তি) বলা হয়।</p><p><b>৩. রাজপুত নীতি ও বন্ধুত্বের হাত:</b> আকবরের আগে কোনো মুসলিম শাসক রাজপুতদের সাথে বন্ধুত্বের সম্পর্ক গড়তে পারেননি। আকবর বৈবাহিক সম্পর্ক (যেমন: অম্বর রাজপরিবারের সাথে বিবাহ) এবং উচ্চপদ প্রদানের মাধ্যমে রাজপুতদের নিজের পক্ষে নিয়ে আসেন, যার ফলে মুঘল সাম্রাজ্য দীর্ঘস্থায়ী রাজনৈতিক স্থায়িত্ব লাভ করে।</p><p><b>৪. শিল্প, সাহিত্য ও সংস্কৃতির পৃষ্ঠপোষকতা (নবরত্ন):</b> আকবরের দরবার সাহিত্য ও শিল্পকলার কেন্দ্রবিন্দু ছিল। তাঁর সভাসদদের মধ্যে 'নবরত্ন' বা নয়জন প্রতিভাবান ব্যক্তিত্ব (যেমন: আবুল ফজল, বীরবল, তানসেন, রাজা টোডরমল ইত্যাদি) ছিলেন। তাঁর সময়ে ফার্সি সাহিত্যের অভূতপূর্ব বিকাশ ঘটে এবং 'আইন-ই-আকবরি' ও 'আকবরনামা'র মতো ঐতিহাসিক গ্রন্থ রচিত হয়।</p><p><b>৫. বিচারব্যবস্থা ও সামাজিক সংস্কার:</b> তিনি সতীদাহ প্রথা রদের চেষ্টা করেন, বাল্যবিবাহ নিরুৎসাহিত করেন এবং বিচার বিভাগে নিরপেক্ষতা বজায় রাখার জন্য কঠোর নির্দেশ দেন।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সম্রাট আকবর কেবল একজন দিগ্বিজয়ী সম্রাটই ছিলেন না; তিনি ছিলেন এক দূরদর্শী রাষ্ট্রনায়ক ও সমাজ সংস্কারক। তাঁর ধর্মীয় উদারতা, নিখুঁত প্রশাসন এবং প্রজাবান্ধব নীতি তাঁকে ভারতীয় ইতিহাসে অমর করে রেখেছে। তাই তাঁকে 'মহান আকবর' বলা সম্পূর্ণ সার্থক ও ঐতিহাসিক সত্য।</p>"],["সম্রাট হুমায়ুন ও শের শাহের মধ্যে সংঘর্ষের একটি বিবরণ দাও। এবং শের শাহের সাফল্যের কারণ কি?","<div class=\"h\">ভূমিকা</div><p>মুঘল সাম্রাজ্যের দ্বিতীয় সম্রাট হুমায়ুন (১৫৩০–১৫৪০ এবং ৫৫–১৫৫৬ খ্রিস্টাব্দ) এবং ভারতের ইতিহাসের অন্যতম শ্রেষ্ঠ দক্ষ প্রশাসক ও আফগান বীর শের শাহ সূরী (ফরিদ খান)-এর মধ্যকার দ্বন্দ্ব মধ্যযুগের এক অত্যন্ত নাটকীয় অধ্যায়। মুঘলদের ক্ষমতাচ্যুত করে ভারতের মাটিতে স্বল্পকালীন সময়ের জন্য আফগান বা সুরী সাম্রাজ্য প্রতিষ্ঠা করার পেছনে শের শাহের অসামান্য সামরিক প্রতিভা এবং হুমায়ুনের রাজনৈতিক দুর্বলতা প্রধান ভূমিকা পালন করেছিল। সম্রাট হুমায়ুন ও শের শাহের মধ্যকার এই ঐতিহাসিক সংঘর্ষ এবং শের শাহের সাফল্যের কারণগুলো নিচে বিস্তারিতভাবে আলোচনা করা হলো।</p><div class=\"h\">ক. সম্রাট হুমায়ুন ও শের শাহের মধ্যকার সংঘর্ষের বিবরণ</div><p>হুমায়ুনের সিংহাসন লাভের পর থেকেই পূর্ব ভারতে শের খানের ক্ষমতা দ্রুত বৃদ্ধি পেতে থাকে। শের খান বাংলার ও বিহারের আফগানদের একত্রিত করে মুঘলদের জন্য এক মারাত্মক হুমকি হয়ে দাঁড়ান। এই দুই নেতার মধ্যকার সংঘর্ষ দুটি ঐতিহাসিক যুদ্ধের মধ্য দিয়ে চরম রূপ নেয়:</p><p><b>১. চৌসার যুদ্ধ (১৫৩৯ খ্রিস্টাব্দ):</b> হুমায়ুন যখন বিশাল সৈন্যবাহিনী নিয়ে বাংলা ও বিহারের দিকে অগ্রসর হন, তখন শের খান অত্যন্ত সুকৌশলে যুদ্ধ এড়িয়ে যান এবং বর্ষাকালে মুঘলদের রসদ সরবরাহ বন্ধ করে দেন। ১৫৩৯ সালের ২৬ জুন গঙ্গা নদীর তীরে চৌসা নামক স্থানে দুই বাহিনীর মধ্যে যুদ্ধ হয়। শের খানের আকস্মিক ও রাতের বেলা অতর্কিত আক্রমণে মুঘল বাহিনী সম্পূর্ণ পরাস্ত হয়। হুমায়ুন কোনোমতে জীবন রক্ষা করতে গঙ্গা নদীতে ঝাঁপ দেন এবং এক ভিষ্টিয়ানি (পানির মশকের সাহায্যে জীবন রক্ষাকারী) ব্যক্তির সহায়তায় সাঁতরে বেঁচে ফেরেন। এই যুদ্ধে মুঘলদের চরম অপমানজনক পরাজয় ঘটে।</p><p><b>২. কনৌজের যুদ্ধ বা বিলগ্রামের যুদ্ধ (১৫৪০ খ্রিস্টাব্দ):</b> চৌসার পরাজয়ের গ্লানি মুছে ফেলতে এবং ভাগ্য পরীক্ষা করতে হুমায়ুন ১৫৪০ সালে কনৌজের নিকটবর্তী স্থানে শের খানের বিরুদ্ধে দ্বিতীয়বার চূড়ান্ত যুদ্ধ ঘোষণা করেন। এই যুদ্ধ বিলগ্রামের যুদ্ধ নামেও পরিচিত। কিন্তু হুমায়ুনের সৈন্যদের মনোবল তখন ভেঙে গিয়েছিল এবং অস্ত্রের মানও নিম্নমানের ছিল। শের খানের নিখুঁত রণকৌশলের কাছে মুঘল বাহিনী শোচনীয়ভাবে পরাজিত হয়। এই যুদ্ধের পর হুমায়ুন সর্বস্ব হারিয়ে দেশত্যাগ করতে বাধ্য হন এবং দীর্ঘ পনেরো বছর তাঁকে নির্বাসিত জীবন কাটাতে হয়। ভারতের মাটিতে মুঘল শাসনের সাময়িক পতন ঘটে এবং শের শাহ দিল্লির মসনদে বসে 'সুরী বংশ' প্রতিষ্ঠা করেন।</p><div class=\"h\">খ. শের শাহের সাফল্যের কারণসমূহ (Reasons for Sher Shah's Success)</div><p>সম্রাট হুমায়ুনের মতো বিশাল মুঘল সাম্রাজ্যের বিরুদ্ধে একজন সাধারণ জাগিরদারের পুত্র ফরিদ খান বা শের শাহের এই অভূতপূর্ব সাফল্যের পেছনে বেশ কিছু গুরুত্বপূর্ণ কারণ ও কৌশলগত শ্রেষ্ঠত্ব কাজ করেছিল:</p><p><b>১. শের শাহের অসাধারণ সামরিক প্রতিভা ও নেতৃত্ব:</b> শের শাহ ছিলেন জন্মগতভাবে একজন দূরদর্শী সেনাপতি এবং অসাধারণ রণকৌশলী। যুদ্ধের ময়দানে কখন কীভাবে আক্রমণ করতে হবে এবং শত্রুকে কীভাবে ফাঁদে ফেলতে হবে, সে বিষয়ে তাঁর নিখুঁত জ্ঞান ছিল। তাঁর সাহস ও দৃঢ়চেতা মনোভাব আফগান সৈন্যদের মধ্যে প্রবল আত্মবিশ্বাস তৈরি করেছিল।</p><p><b>২. সুশৃঙ্খল ও ঐক্যবদ্ধ আফগান সেনাবাহিনী:</b> শের শাহ ভারতের ছড়িয়ে-ছিটিয়ে থাকা বিক্ষিপ্ত আফগান শক্তিকে একত্রিত করে একটি সুসংগঠিত, অনুগত এবং পেশাদার সেনাবাহিনী গড়ে তুলেছিলেন। অন্যদিকে, মুঘল সেনাবাহিনী তখন অতিরিক্ত বিলাসী, অনৈক্যপূর্ণ এবং যুদ্ধক্লান্ত হয়ে পড়েছিল।</p><p><b>৩. হুমায়ুনের রাজনৈতিক ও সামরিক দুর্বলতা:</b> হুমায়ুন ব্যক্তিগতভাবে সাহসী ও শিক্ষিত হলেও একজন শাসক ও সেনাপতি হিসেবে তিনি ছিলেন অত্যন্ত খামখেয়ালি, অলস এবং সময়সচেতনতাহীন। তিনি শত্রুকে অবমূল্যায়ন করতেন এবং বিজয়ের ঠিক মুহূর্তে উদাসীন হয়ে উৎসব বা বিলাসে মগ্ন থাকতেন, যার পূর্ণ সুযোগ নিয়েছিলেন শের শাহ।</p><p><b>৪. সুকৌশলগত ও গুপ্তচর বৃত্তির শ্রেষ্ঠত্ব:</b> শের শাহের একটি অত্যন্ত শক্তিশালী ও দক্ষ গুপ্তচর বিভাগ ছিল। মুঘল শিবিরের প্রতিটি গোপন খবর তাঁর কাছে আগে থেকেই পৌঁছে যেত। এছাড়া তিনি যুদ্ধের শুরুতে শত্রু পক্ষের দুর্বলতা নিখুঁতভাবে বিচার করে পরিকল্পনা সাজাতেন।</p><p><b>৫. স্থানীয় জনগণের সমর্থন ও কূটনীতি:</b> শের শাহ সাধারণ কৃষক ও প্রজাদের কল্যাণে কাজ করায় স্থানীয় জনগোষ্ঠীর সহানুভূতি ও সমর্থন তাঁর পক্ষে ছিল। এছাড়া তিনি কূটনৈতিকভাবে মুঘলদের মিত্রদের দূরে সরিয়ে দিতে সক্ষম হয়েছিলেন।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, হুমায়ুন ও শের শাহের মধ্যকার সংঘর্ষ মধ্যযুগের ক্ষমতার পালাবদলে এক অত্যন্ত গুরুত্বপূর্ণ মোড় ছিল। শের শাহের অসাধারণ সামরিক মেধা, দূরদর্শিতা এবং সঠিক সময়ে সঠিক সিদ্ধান্ত নেওয়ার ক্ষমতার কারণেই তিনি হুমায়ুনকে পরাজিত করে ভারতের মসনদ দখল করতে পেরেছিলেন। যদিও এই সাফল্য দীর্ঘস্থায়ী হয়নি, তবুও শের শাহের প্রশাসনিক সংস্কার (যেমন: গ্র্যান্ড ট্রাংক রোড ও মুদ্রা ব্যবস্থা) ভারতীয় ইতিহাসে তাঁকে চিরস্মরণীয় করে রেখেছে।</p>"],["অথবা, সম্রাট শাহজাহানের পুত্রদের মধ্যে উত্তরাধিকার সংগ্রামের সংক্ষিপ্ত বিবরণ দাও।","<div class=\"h\">ভূমিকা</div><p>মুঘল সাম্রাজ্যের ইতিহাসে আকবরের রাজত্বকাল থেকে শুরু করে উত্তরাধিকার সংক্রান্ত কোনো নির্দিষ্ট বা শান্তিপূর্ণ আইন না থাকায় প্রতিবারই সম্রাটের মৃত্যুর পর কিংবা জীবনের শেষ পর্যায়ে তাঁর পুত্রদের মধ্যে সিংহাসন দখলের এক রক্তক্ষয়ী ও নির্মম প্রতিযোগিতা শুরু হতো। ১৬৫৮ খ্রিস্টাব্দে মুঘল সম্রাট শাহজাহানের গুরুতর অসুস্থতাকে কেন্দ্র করে তাঁর চার পুত্রের মধ্যে যে ঐতিহাসিক উত্তরাধিকার সংগ্রাম শুরু হয়েছিল, তা মুঘল সাম্রাজ্যের রাজনৈতিক মানচিত্রকে চিরকালের জন্য বদলে দিয়েছিল। সম্রাট শাহজাহানের চার পুত্র—দারা শিকো, শাহ সুজা, আওরঙ্গজেব এবং মুরাদ বক্স—সকলেই ছিলেন অত্যন্ত ambitious (উচ্চাভিলাষী) এবং নিজ নিজ প্রদেশের দক্ষ গভর্নর। ১৬৫৭ সালের শেষের দিকে শাহজাহান মারাত্মকভাবে অসুস্থ হয়ে পড়লে এবং তাঁর মৃত্যুর গুজব ছড়িয়ে পড়লে এই সুপ্ত ক্ষোভ ও ক্ষমতার লোভ প্রকাশ্য সংঘাতে রূপ নেয়। মুঘল রাজপরিবারের এই রক্তক্ষয়ী উত্তরাধিকার সংগ্রাম মধ্যযুগের ভারতের রাজনীতিতে এক চরম নাটকীয় ও ট্র্যাজেডিপূর্ণ অধ্যায় হিসেবে পরিচিত। নিচে শাহজাহানের পুত্রদের মধ্যকার এই উত্তরাধিকার সংগ্রামের বিস্তারিত বিবরণ আলোচনা করা হলো।</p><div class=\"h\">উত্তরাধিকার সংগ্রামের পটভূমি ও পাত্রগণ</div><p>শাহজাহানের চার পুত্রের রাজনৈতিক অবস্থান, চরিত্র এবং আদর্শগত পার্থক্য তাদের মধ্যকার সংঘর্ষকে অনিবার্য করে তুলেছিল:</p><p><b>দারা শিকো:</b> তিনি ছিলেন সম্রাট শাহজাহানের জ্যেষ্ঠ পুত্র, অত্যন্ত প্রিয়পাত্র এবং মুঘল সাম্রাজ্যের আইনগত উত্তরাধিকারী (শাহজাদা-ই-বুর্লন্দ)। তিনি উদারমনা, সুফি মতবাদে বিশ্বাসী এবং পন্ডিত ব্যক্তি ছিলেন, কিন্তু কঠোর সামরিক ও রাজনৈতিক কূটকৌশলে তিনি তাঁর ভাই আওরঙ্গজেবের তুলনায় অনেক দুর্বল ছিলেন। শাহজাহান তাঁকে উত্তর ভারতের কেন্দ্রস্থলে রেখেছিলেন এবং সমস্ত ক্ষমতা তাঁর হাতে দিতে চেয়েছিলেন।</p><p><b>শাহ সুজা:</b> তিনি ছিলেন বাংলার অত্যন্ত ধনী ও সমৃদ্ধ প্রদেশের গভর্নর। তিনি উদার স্বভাবের হলেও কিছুটা বিলাসী ছিলেন। বাংলার অফুরন্ত সম্পদ এবং নিজস্ব সামরিক শক্তির ওপর ভরসা করে তিনি নিজেকে স্বাধীন সুলতান হিসেবে ঘোষণা করার স্বপ্ন দেখতেন।</p><p><b>আওরঙ্গজেব:</b> তিনি ছিলেন শাহজাহানের তৃতীয় পুত্র এবং অত্যন্ত তীক্ষ্ণ বুদ্ধিমত্তা সম্পন্ন, কঠোর, ধর্মভীরু এবং দূরদর্শী সেনাপতি। দাক্ষিণাত্যের গভর্নর হিসেবে তিনি দীর্ঘকাল সফলভাবে যুদ্ধ পরিচালনা করেছিলেন এবং তাঁর প্রশাসনিক ও সামরিক মেধা ছিল অসাধারণ।</p><p><b>মুরাদ বক্স:</b> তিনি ছিলেন কনিষ্ঠ পুত্র এবং গুজরাটের গভর্নর। তিনি অত্যন্ত সাহসী ও যোদ্ধা প্রকৃতির ছিলেন, কিন্তু রাজনৈতিক দূরদর্শিতা ও কূটবুদ্ধির দিক থেকে তিনি ছিলেন অপরিপক্ব।</p><div class=\"h\">যুদ্ধের সূচনা ও প্রাথমিক ঘটনাবলি</div><p>১৬৫৭ সালের সেপ্টেম্বর মাসে সম্রাট শাহজাহান হঠাৎ গুরুতর অসুস্থ হয়ে পড়েন এবং আগ্রা দুর্গে চিকিৎসাধীন অবস্থায় তিনি জনসমক্ষে আসা বন্ধ করে দেন। এই সুযোগে রাজধানী থেকে চারপাশের প্রদেশগুলোতে সম্রাটের মৃত্যুর গুজব রটে যায়। এই গুজবই চার ভাইয়ের মধ্যে চূড়ান্ত লড়াইয়ের সূচনা করে:</p><p><b>বাংলার সুজার বিদ্রোহ:</b> সবার আগে বাংলার গভর্নর শাহ সুজা নিজেকে স্বাধীন সম্রাট বলে ঘোষণা করেন এবং বিশাল বাহিনী নিয়ে বাংলার রাজধানী রাজমহল থেকে দিল্লির দিকে অগ্রসর হন।</p><p><b>গুজরাটের মুরাদের স্বাধীনতা ঘোষণা:</b> এদিকে গুজরাটে বসে মুরাদ বক্স নিজেকে সম্রাট ঘোষণা করেন এবং মুদ্রায় নিজের নাম খোদাই করেন।</p><p><b>আওরঙ্গজেব ও মুরাদের গোপন চুক্তি:</b> আওরঙ্গজেব অত্যন্ত চতুরতার সাথে মুরাদ বক্সের সাথে যোগাযোগ করেন এবং যৌথভাবে দারা শিকোকে পরাজিত করার প্রস্তাব দেন। চুক্তি হয় যে, যুদ্ধ জয়ের পর সাম্রাজ্য দুই ভাইয়ের মধ্যে ভাগ করে নেওয়া হবে।</p><div class=\"h\">প্রধান যুদ্ধসমূহ</div><p>দারা শিকোর বিরুদ্ধে এই তিন ভাই ঐক্যবদ্ধ বা পৃথকভাবে লড়েছিলেন। প্রধান যুদ্ধগুলো সংঘটিত হয়েছিল:</p><div class=\"h\">১. বাহাদুরপুরের যুদ্ধ (১৬৫৮):</div><p>বাংলার সুজা যখন বিহার ও উত্তরপ্রদেশের দিকে এগিয়ে আসেন, তখন দারা শিকোর পুত্র সোলায়মান শিকো ও রাজা জয়সিংহের যৌথ বাহিনী বারানসির নিকট বাহাদুরপুরে সুজার বাহিনীকে আক্রমণ করে পরাজিত করেন। সুজা বাধ্য হয়ে বাংলায় পিছু হটতে বাধ্য হন।</p><div class=\"h\">২. ধর্মাট ও সামুগড়ের যুদ্ধ (১৬৫৮):</div><p>এদিকে আওরঙ্গজেব ও মুরাদ বক্সের যৌথ বাহিনী দাক্ষিণাত্যের দিক থেকে উত্তর ভারতের দিকে অগ্রসর হয়।</p><p><b>ধর্মতের যুদ্ধ:</b> ১৬৫৮ সালের ১৫ এপ্রিল উজ্জয়িনীর নিকট ধর্মত নামক স্থানে আওরঙ্গজেব ও মুরাদের সম্মিলিত শক্তির সাথে মুঘল রাজকীয় বাহিনীর (যাকে জাসবন্ত সিং নেতৃত্ব দিচ্ছিলেন) রক্তক্ষয়ী যুদ্ধ হয়। এই যুদ্ধে আওরঙ্গজেবের রণকৌশলের কাছে রাজকীয় বাহিনী শোচনীয়ভাবে পরাজিত হয়।</p><p><b>সামুগড়ের যুদ্ধ (নির্ণায়ক যুদ্ধ):</b> ১৬৫৮ সালের ২৯ মে আগ্রার নিকট সামুগড়ে দারা শিকোর সাথে আওরঙ্গজেব ও মুরাদের চূড়ান্ত যুদ্ধ সংঘটিত হয়। দারা শিকো বিশাল বাহিনী ও কামানের বহর নিয়ে যুদ্ধ করলেও শেষ মুহূর্তে যুদ্ধক্ষেত্রের একটি ভুল সিদ্ধান্তের কারণে (তিনি হাতি থেকে নেমে ঘোড়ায় চড়ার সময় তীরবিদ্ধ হন বা বিভ্রান্তি ছড়ায়) মুঘল বাহিনী ছত্রভঙ্গ হয়ে যায়। এই সামুগড়ের যুদ্ধই মূলত উত্তরাধিকার সংগ্রামের ভাগ্য নির্ধারণ করে দিয়েছিল। দারা শিকো পরাজিত হয়ে পালিয়ে যান।</p><div class=\"h\">দারা শিকো ও অন্যান্যদের শোচনীয় পরিণতি</div><p>সামুগড়ে জয়ের পর আওরঙ্গজেব আগ্রা দুর্গ দখল করেন এবং বৃদ্ধ ও অসুস্থ পিতা সম্রাট শাহজাহানকে আগ্রা দুর্গের অন্তঃপুরে গৃহবন্দি করেন। এরপর তিনি একে একে তাঁর বাকি ভাইদের দমন করেন:</p><p><b>মুরাদ বক্সের কারাবাস:</b> চুক্তি ভঙ্গ করে আওরঙ্গজেব মুরাদ বক্সকে মদ্যপানের আসরে কৌশলে বন্দি করেন এবং পরবর্তীতে গোয়ালিয়র দুর্গে কারাবন্দি করে হত্যা করেন।</p><p><b>সুজার পতন:</b> খাজওয়ার যুদ্ধে পরাজিত হয়ে শাহ সুজা আরাকান পাহাড়ে পালিয়ে যান এবং সেখানে নির্মমভাবে নিহত হন।</p><p><b>দারা শিকোর শিকার ও হত্যা:</b> দারা শিকো পালিয়ে যাওয়ার পর দীর্ঘকাল ধরে পালিয়ে বেড়ান। শেষ পর্যন্ত এক বিশ্বাসঘাতক জমিদারের সহায়তায় তাঁকে বন্দি করে অত্যন্ত অপমানজনকভাবে ঢাকায় ও দিল্লিতে ঘোরানো হয় এবং ১৬৫৯ সালে আওরঙ্গজেবের নির্দেশে তাঁকে হত্যা করা হয়।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সম্রাট শাহজাহানের পুত্রদের এই উত্তরাধিকার সংগ্রাম ছিল মুঘল ইতিহাসের সবচেয়ে নিষ্ঠুর ও রক্তক্ষয়ী ক্ষমতার লড়াই। এই লড়াইয়ে আওরঙ্গজেব তাঁর অসাধারণ সামরিক মেধা, কূটবুদ্ধি এবং আপসহীন মনোভাবের জোরে সমস্ত প্রতিদ্বন্দ্বীকে নির্মূল করে ১৬৫৮ সালে দিল্লির মসনদে আরোহণ করেন। এই সংগ্রামের ফলে একদিকে যেমন শাহজাহানের করুণ পরিণতি ঘটেছিল, অন্যদিকে আওরঙ্গজেবের রাজত্বকালে মুঘল সাম্রাজ্য তার সর্বশ্রেষ্ঠ ভৌগোলিক বিস্তারে পৌঁছালেও তা অভ্যন্তরীণভাবে দুর্বল হয়ে পড়েছিল।</p>"],["মূল্য নিয়ন্ত্রণ পদ্ধতি উল্লেখপূর্বক আলাউদ্দিন খিলজির প্রশাসনিক সংস্কারসমূহ লিখ।","<div class=\"h\">ভূমিকা</div><p>দিল্লি সালতানাতের খলজি রাজবংশের সর্বশ্রেষ্ঠ এবং ভারতীয় মুসলিম ইতিহাসের অন্যতম প্রতাপশালী, দূরদর্শী ও লৌহমানব শাসক হলেন সুলতান আলাউদ্দিন খলজি (১২৯৬–১৩১৬ খ্রিস্টাব্দ)। তিনি কেবল একজন অদম্য বিজেতাই ছিলেন না, বরং তিনি ছিলেন এক অনন্য সাধারণ প্রশাসক ও সংস্কারক। আলাউদ্দিন খলজি বুঝতে পেরেছিলেন যে, উত্তর ও দক্ষিণ ভারত জুড়ে বিশাল সাম্রাজ্য রক্ষা করতে হলে এবং বারবার আক্রমণকারী মঙ্গোলদের নির্মূল করতে হলে একটি বিশাল, স্থায়ী ও সুসজ্জিত পেশাদার সেনাবাহিনী প্রয়োজন। কিন্তু সেই বিশাল বাহিনীকে নিয়মিত নগদ বেতন দেওয়ার মতো অর্থনৈতিক সংস্থান রাজকোষের ছিল না। এই অর্থনৈতিক ও সামরিক সংকট সমাধানের জন্য তিনি অত্যন্ত সুকৃঙ্খল প্রশাসনিক সংস্কার এবং তাঁর বিখ্যাত 'মূল্য নিয়ন্ত্রণ বা বাজার নিয়ন্ত্রণ পদ্ধতি' (Price Control System) প্রবর্তন করেছিলেন। মধ্যযুগের অর্থনৈতিক ইতিহাসে এই সংস্কার এক অভূতপূর্ব ও অনন্য দৃষ্টান্ত স্থাপন করেছিল। নিচে আলাউদ্দিন খিলজির প্রশাসনিক সংস্কার এবং তাঁর বিখ্যাত মূল্য নিয়ন্ত্রণ পদ্ধতি বিস্তারিতভাবে আলোচনা করা হলো।</p><p>আলাউদ্দিন খলজির মূল্য নিয়ন্ত্রণ বা বাজার নিয়ন্ত্রণ পদ্ধতি (Market Control System)</p><p>আলাউদ্দিন খলজির প্রশাসনিক সংস্কারের মুকুটমণি হলো তাঁর বাজার নিয়ন্ত্রণ নীতি। কম বেতনে বিশাল সৈন্যবাহিনী টিকিয়ে রাখার জন্য তিনি নিত্যপ্রয়োজনীয় পণ্যের দাম কঠোরভাবে নির্ধারণ করে দিয়েছিলেন। এই পদ্ধতি কার্যকর করার জন্য তিনি বহুমুখী পদক্ষেপ গ্রহণ করেছিলেন:</p><div class=\"h\">১. পণ্যের মূল্য নির্ধারণ (Fixing Prices):</div><p>সুলতান বাজারকে চার ভাগে বিভক্ত করে সমস্ত নিত্যপ্রয়োজনীয় জিনিসের (যেমন—চাল, ডাল, গম, চিনি, তেল, ঘি, শাকসবজি, ফলমূল, ঘোড়া, দাস এবং সাধারণ কাপড়) সরকারি দাম কঠোরভাবে নির্ধারণ করে দেন। বাজারে যাতে পণ্যের কৃত্রিম সংকট তৈরি না হয় এবং উৎপাদন খরচ অনুযায়ী দাম নির্ধারিত থাকে, সে বিষয়ে তিনি কড়া নজর রাখেন।</p><div class=\"h\">২. বিশেষ বাজার প্রতিষ্ঠা ও শাহনা-ই-মন্ডি (Supervisors of Markets):</div><p>দিল্লিতে প্রতিটি পণ্যের জন্য আলাদা আলাদা বাজার স্থাপন করা হয়েছিল। যেমন—খাদ্যদ্রব্যের জন্য 'মন্ডি', কাপড় ও মূল্যবান বস্তুর জন্য 'সরাই-ই-আদল', ঘোড়া ও পশুর জন্য পৃথক বাজার। প্রতিটি বাজারের দেখভালের জন্য 'শাহনা-ই-মন্ডি' (시장 পরিদর্শক) নামক সৎ ও অভিজ্ঞ কর্মকর্তা নিয়োগ করা হতো।</p><div class=\"h\">৩. দেওয়ান-ই-রিয়াদ ও কঠোর গোয়েন্দা নেটওয়ার্ক:</div><p>বাজারের সঠিক তদারকি করার জন্য 'দেওয়ান-ই-রিয়াদ' নামক একটি আলাদা বিভাগ খোলা হয়। এই বিভাগের কর্মকর্তাদের পাশাপাশি সুলতান সারা শহরে অত্যন্ত বিশ্বস্ত ও গোপন গোচর বা গুপ্তচর ('বারিড' ও 'মুনহিয়ান') নিয়োগ করেছিলেন। এই গুপ্তচরেরা বাজারের প্রতিটি দোকানদারের গতিবিধি, ওজনে কম দেওয়া বা গোপনে বেশি দাম নেওয়া সংক্রান্ত তথ্য সরাসরি সুলতানের কাছে পৌঁছে দিত।</p><div class=\"h\">৪. কঠোর শাস্তি ও অপরাধ দমন:</div><p>মূল্য নিয়ন্ত্রণ নীতি অমান্য করার শাস্তি ছিল অত্যন্ত নির্মম ও অমানবিক। কোনো ব্যবসায়ী যদি ওজনে এক ছটাক কম দিত, তবে তার শরীর থেকে সমপরিমাণ মাংস কেটে নেওয়া হতো। মজুতদারি বা কালোবাজারি করার চেষ্টা করলে তাকে কঠোর কারাদণ্ড বা দেশান্তরী করা হতো। এই চরম শাস্তির ভয়ে তৎকালীন বাজারে কেউ সুচ বা সুতার দামও এক পয়সা বেশি নিতে সাহস পেত না। এমনকি কোনো কারণে পণ্যের সংকট দেখা দিলে সুলতান রেশনিং ব্যবস্থা চালু করে মাথাপিছু চাল ও গম বিক্রির নির্দেশ দিতেন।</p><div class=\"h\">আলাউদ্দিন খলজির অন্যান্য প্রশাসনিক সংস্কারসমূহ</div><p>বাজার নিয়ন্ত্রণ পদ্ধতির পাশাপাশি সাম্রাজ্যকে সুসংহত করার জন্য আলাউদ্দিন খলজি আরও বেশ কিছু যুগান্তকারী প্রশাসনিক সংস্কার সাধন করেছিলেন:</p><div class=\"h\">১. স্থায়ী ও বিশাল সেনাবাহিনী গঠন:</div><p>তিনিই প্রথম ভারতীয় শাসক যিনি সামন্তদের ওপর নির্ভরতা কমিয়ে সরাসরি কেন্দ্র থেকে একটি বিশাল, সুসজ্জিত ও স্থায়ী পেশাদার সৈন্যবাহিনী গঠন করেন এবং তাদের নগদ বেতনের ব্যবস্থা করেন।</p><div class=\"h\">২. সামরিক সংস্কার (দাগ ও চেহারা প্রথা):</div><p>সেনাবাহিনীর দুর্নীতি রোধ করতে এবং ছদ্মবেশ বা অযোগ্যদের প্রবেশ আটকাতে তিনি সেনাবাহিনীর ঘোড়ার গায়ে দাগ দেওয়ার 'দাগ' প্রথা এবং সৈনিকদের শারীরিক বিবরণ ও পরিচয়পত্র সংরক্ষণের 'চেহারা' প্রথা চালু করেন।</p><div class=\"h\">৩. ভূমি রাজস্ব ও রাজস্ব সংস্কার:</div><p>কৃষকদের ওপর থেকে মধ্যস্বত্বভোগী ও জমিদারদের (খুদ, মুকাদ্দাম ও চৌধুরী) অতিরিক্ত ক্ষমতা খর্ব করে তিনি সরাসরি কৃষকদের কাছ থেকে উৎপাদিত ফসলের অর্ধেক (৫০%) ভূমি রাজস্ব হিসেবে আদায় করার নিয়ম করেন। এর ফলে কৃষকরা শোষিত হলেও রাষ্ট্রের কোষাগার উপচে পড়া সম্পদে ভরে যায়।</p><div class=\"h\">৪. মদ্যপান ও সামাজিক নিয়ন্ত্রণ নিষিদ্ধকরণ:</div><p>সমাজে অপরাধপ্রবণতা ও অভিজাতদের ষড়যন্ত্র কমানোর জন্য তিনি দিল্লিতে মদ প্রস্তুত, বিক্রি ও পান সম্পূর্ণ নিষিদ্ধ ঘোষণা করেন। এছাড়া অভিজাতদের পারস্পরিক মেলামেশা, বিবাহ এবং পার্টি করার ওপর কঠোর নিষেধাজ্ঞা জারি করা হয়েছিল।</p><div class=\"h\">৫. গোয়েন্দা বিভাগ ও দমনমূলক নীতি:</div><p>অভিজাত ও অমাত্যরা যাতে কোনো ষড়যন্ত্র বা গোপন বৈঠক করতে না পারে, সেজন্য তিনি অত্যন্ত কড়া গোয়েন্দা নেটওয়ার্ক গড়ে তোলেন। উচ্চবিত্তদের ক্ষমতা খর্ব করার মাধ্যমে তিনি সম্পূর্ণ একচ্ছত্র রাজতন্ত্র প্রতিষ্ঠা করেছিলেন।</p><div class=\"h\">উপসংহার</div><p>পরিশেষে মূল্যায়ন করলে দেখা যায়, সুলতান আলাউদ্দিন খলজির প্রশাসনিক সংস্কার এবং তাঁর অসামান্য মূল্য নিয়ন্ত্রণ পদ্ধতি মধ্যযুগের অর্থনৈতিক ও সামরিক ইতিহাসে এক অনন্য কীর্তি ছিল। যদিও এই নীতিগুলো অত্যন্ত কঠোর ও দমনমূলক ছিল, তবুও এর ফলশ্রুতিতে মুদ্রাস্ফীতি রোধ করা সম্ভব হয়েছিল, কম বেতনে বিশাল সেনাবাহিনী টিকিয়ে রাখা গিয়েছিল এবং মঙ্গোল আক্রমণ সফলভাবে প্রতিহত করে দিল্লি সালতানাতকে চরম নিরাপত্তা ও সমৃদ্ধি দেওয়া সম্ভব হয়েছিল।</p>"],["টিকা লিখ।","<div class=\"h\">ক. নবরত্ন (Navaratna)</div><p>মুঘল সাম্রাজ্যের শ্রেষ্ঠ সম্রাট আকবরের (১৫৫৬–১৬০৫ খ্রিস্টাব্দ) রাজদরবার কেবল রাজনৈতিক ক্ষমতার কেন্দ্র ছিল না, বরং তা ছিল এশিয়ার শিল্প, সাহিত্য, বিজ্ঞান ও সংস্কৃতির অন্যতম প্রধান প্রাণকেন্দ্র। সম্রাট আকবর জ্ঞান ও প্রতিভাকে অত্যন্ত সম্মান করতেন এবং তাঁর রাজসভায় তৎকালীন ভারতের সেরা নয়জন প্রতিভাবান মনীষী ও পন্ডিতকে আশ্রয় দিয়েছিলেন। এই নয়জন অসাধারণ প্রতিভাধর ব্যক্তিকে একত্রে 'নবরত্ন' বা 'নয় রত্ন' বলা হয়। আকবরের এই নবরত্ন সভার সদস্যগণ নিজ নিজ ক্ষেত্রে অতুলনীয় দক্ষতার পরিচয় দিয়েছিলেন:</p><p>১. আবুল ফজল: আকবরের অত্যন্ত বিশ্বস্ত মন্ত্রী এবং ঐতিহাসিক, যিনি বিখ্যাত 'আকবরনামা' ও 'আইন-ই-কবরি' গ্রন্থ রচনা করেন।</p><p>২. ফাইজি: আবুল ফজলের ভাই এবং রাজদরবারের অন্যতম শ্রেষ্ঠ কবি ও অনুবাদক।</p><p>৩. তানসেন: ভারতের সর্বকালের অন্যতম শ্রেষ্ঠ সঙ্গীতশিল্পী ও সুরকার, যাঁর কণ্ঠের জাদুকরি সুর সমগ্র মিউজিক বিশ্বকে বিমোহিত করেছিল।</p><p>৪. রাজা বীরবল: আকবরের অত্যন্ত বুদ্ধিমান, রসিক এবং বিশ্বস্ত উপদেষ্টা, যিনি তাঁর চতুরতা ও বুদ্ধিমত্তার জন্য বিখ্যাত ছিলেন।</p><p>৫. রাজা টোডরমল: আকবরের মেধাবী অর্থমন্ত্রী, যাঁর উদ্ভাবিত 'দহশালা' ভূমি রাজস্ব ব্যবস্থা মুঘল অর্থনীতিকে সবচেয়ে মজবুত ভিত্তির ওপর দাঁড় করিয়েছিল।</p><p>৬. রাজা মানসিংহ: আকবরের প্রধান সেনাপতি এবং রাজপুত রাজপরিবারের সদস্য, যিনি মুঘল সাম্রাজ্যের সীমান্ত সম্প্রসারণে অসামান্য ভূমিকা রাখেন।</p><p>৭. ফৈজী বা মোল্লা দো পিয়াজা: আকবরের অন্যতম রসিক এবং বুদ্ধিদীপ্ত উপদেষ্টা।</p><p>৮. ফকির আজিজুদ্দিন: আকবরের প্রধান ধর্মীয় ও আধ্যাত্মিক উপদেষ্টা।</p><p>৯. আবদুর রহিম খান-ই-খানান: প্রখ্যাত সাহিত্যিক, কবি এবং সেনাপতি, যিনি তুর্কি ভাষার বাবরনামা ফার্সিতে অনুবাদ করেছিলেন।</p><p>এই নবরত্নদের উপস্থিতি আকবরের রাজসভাকে ইতিহাসের পাতায় চিরস্মরণীয় করে রেখেছে।</p><div class=\"h\">খ. পানিপথের ১ম যুদ্ধ (First Battle of Panipat)</div><p>ভারতীয় ইতিহাসের গতিধারা চিরকালের মতো পাল্টে দেওয়া অন্যতম প্রধান ও নির্ণায়ক যুদ্ধ হলো পানিপথের প্রথম যুদ্ধ, যা ১৫২৬ সালের ২১ এপ্রিল দিল্লির অদূরে পানিপথের ময়দানে সংঘটিত হয়েছিল। এই যুদ্ধেই মধ্য এশিয়ার গজনী থেকে আগত জহির উদ্দিন মোহাম্মদ বাবর এবং দিল্লি সালতানাতের শেষ আফগান সুলতান ইব্রাহিম লোদীর বাহিনী মুখোমুখি হয়েছিল।</p><p><b>কারণ:</b> বাবর মধ্য এশিয়া থেকে নিজের রাজ্য হারিয়ে ভারতের উর্বর ভূমি ও ধনসম্পদ জয় করার স্বপ্ন নিয়ে বারবার আক্রমণ করছিলেন। অন্যদিকে, ইব্রাহিম লোদীর অহংকারী ও কঠোর আচরণে তাঁর নিজের দেশের অনেক আফগান আমির ও সর্দার অসন্তুষ্ট হয়ে বাবরকে ভারতে আমন্ত্রণ জানিয়েছিলেন।</p><p><b>যুদ্ধের বিবরণ ও কৌশল:</b> ইব্রাহিম লোদীর সৈন্যসংখ্যা বাবরের চেয়ে বহুগুণ বেশি ছিল (প্রায় ১ লক্ষ সৈন্য ও হাতি)। কিন্তু বাবর মাত্র ১২ থেকে ১৫ হাজার সৈন্য নিয়ে অভিনব 'তুলঘুমা' (Tulghuma) রণকৌশল এবং কামানের নিখুঁত ব্যবহার করেন। ভারতীয় উপমহাদেশে সেসময়ে কামানের ব্যবহার সম্পূর্ণ নতুন ছিল। কামানের বিকট শব্দে লোদীর হাতির দল ভয়ে নিজেদের সৈন্যদের পদদলিত করতে শুরু করে।</p><p><b>ফলাফল:</b> এই যুদ্ধে ইব্রাহিম লোদীর শোচনীয় পরাজয় ঘটে এবং তিনি রণক্ষেত্রে নিহত হন। এই যুদ্ধের মাধ্যমেই ভারতের মাটিতে তিনশ বছরের দিল্লি সালতানাতের অবসান ঘটে এবং সম্রাট বাবরের হাত ধরে সূচিত হয় সুদীর্ঘ ও গৌরবোজ্জ্বল মুঘল সাম্রাজ্য।</p><div class=\"h\">গ. তাজমহল (Taj Mahal)</div><p>বিশ্বের সপ্তম আশ্চর্যের অন্যতম এবং মুঘল স্থাপত্যশিল্পের চরম উৎকর্ষ ও অমর প্রেমের প্রতীক হলো ভারতের আগ্রা শহরে যমুনা নদীর তীরে অবস্থিত তাজমহল। মুঘল সম্রাট শাহজাহান (১৬২৮–১৬৫৮ খ্রিস্টাব্দ) তাঁর অত্যন্ত প্রিয় ও প্রথমা স্ত্রী মমতাজ মহল-এর (যিনি চতুর্দশ সন্তান প্রসবের সময় মারা যান) গভীর স্মৃতি ও অমর প্রেমের নিদর্শন স্বরূপ এই শ্বেতশুভ্র মার্বেল পাথরের মাজারটি নির্মাণ করেছিলেন। ১৬৩২ খ্রিস্টাব্দে এর নির্মাণকাজ শুরু হয়ে দীর্ঘ বাইশ বছর পর ১৬৫৪/৫৫ খ্রিস্টাব্দে সমাপ্ত হয়। বিশ্বের বিভিন্ন প্রান্ত থেকে স্থপতি ও কারিগররা এসে এই রাজকীয় ইমারত নির্মাণে অংশ নেন, যার প্রধান স্থপতি ছিলেন উস্তাদ আহমদ লাহোরী। তাজমহলের মূল আকর্ষণ হলো এর সুউচ্চ গম্বুজ, চারপাশের মিনার এবং ভেতরের দেয়ালগুলোতে জেমস্টোন বা রত্নখচিত অপূর্ব ক্যালিগ্রাফি ও ফ্লোরাল ডিজাইন। এর চারপাশে নিখুঁত পারসিক চারবাগ শৈলীর বাগান একে আরও স্বর্গীয় রূপ দিয়েছে। তাজমহল কেবল মুঘল আমলের অর্থনৈতিক সমৃদ্ধি ও স্থাপত্যের শ্রেষ্ঠত্বের নিদর্শনই নয়, বরং এটি সমগ্র মানব সভ্যতার শিল্পকলার ইতিহাসে এক অতুলনীয় সৃষ্টি হিসেবে বিশ্বজুড়ে সমাদৃত।</p><div class=\"h\">ঘ. আওরঙ্গজেব (Aurangzeb)</div><p>মুঘল সাম্রাজ্যের ষষ্ঠ এবং শেষ শক্তিশালী ও প্রভাবশালী সম্রাট হলেন মহিউদ্দিন মোহাম্মদ আওরঙ্গজেব, যিনি সিংহাসনে বসে 'আলমগীর' (বিশ্ববিজয়ী) উপাধি ধারণ করেছিলেন (১৬৫৮–১৭
