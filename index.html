র ফল বলে মনে করত এবং আল্লাহর প্রতি কৃতজ্ঞতা প্রকাশ করত না। অবশেষে আল্লাহ তাকে ও তার প্রাসাদকে জমিনে ধসিয়ে দেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ قَارُونَ كَانَ مِنْ قَوْمِ مُوسَىٰ فَبَغَىٰ عَلَيْهِمْ وَآتَيْنَاهُ مِنَ الْكُنُوزِ مَا إِنَّ مَفَاتِحَهُ لَتَنُوءُ بِالْعُصْبَةِ أُولِي الْقُوَّةِ.</div></div><p>অর্থ: নিশ্চয়ই কারুন ছিল মূসার কওমের অন্তর্ভুক্ত। কিন্তু সে তাদের বিরুদ্ধে ঔদ্ধত্য প্রকাশ করেছিল। আর আমি তাকে এত ধনভান্ডার দিয়েছিলাম যে, তার চাবিগুলো বহন করা শক্তিশালী একদল লোকের জন্যও কষ্টকর ছিল। (সূরা আল-কাসাস: ৭৬)</p><div class=\"h hs hs2\">৯. শরিয়তের বিধান পালনে গড়িমসি ও অতিরিক্ত প্রশ্ন করা</div><p>বনি ইসরাঈলের লোকেরা আল্লাহর নির্দেশ পাওয়ার পর তা সহজভাবে পালন না করে অনেক সময় অপ্রয়োজনীয় প্রশ্ন ও জটিলতা সৃষ্টি করত। এর একটি দৃষ্টান্ত হলো গাভি জবাইয়ের ঘটনা। আল্লাহর নির্দেশ অনুযায়ী একটি গাভি জবাই করলেই তাদের দায়িত্ব পালন হয়ে যেত। কিন্তু তারা গাভির বয়স, রং ও বৈশিষ্ট্য সম্পর্কে বারবার প্রশ্ন করতে থাকে। ফলে তাদের জন্য বিষয়টি কঠিন হয়ে পড়ে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالُوا ادْعُ لَنَا رَبَّكَ يُبَيِّنْ لَنَا مَا هِيَ قَالَ إِنَّهُ يَقُولُ إِنَّهَا بَقَرَةٌ لَا فَارِضٌ وَلَا بِكْرٌ عَوَانٌ بَيْنَ ذَٰلِكَ فَافْعَلُوا مَا تُؤْمَرُونَ.</div></div><p>অর্থ: তারা বলল, তুমি তোমার প্রতিপালকের কাছে আমাদের জন্য প্রার্থনা করো, তিনি যেন আমাদের জানিয়ে দেন, সেটি কেমন গাভি। মূসা বললেন, আল্লাহ বলছেন, সেটি এমন গাভি, যা অতিবৃদ্ধও নয়, অল্পবয়সীও নয়; বরং মধ্যবয়সী। সুতরাং তোমাদের যা নির্দেশ দেওয়া হয়েছে, তা পালন করো। (সূরা আল-বাকারা: ৬৮)</p><div class=\"h hm\">উপসংহার</div><p>হযরত মূসা (আ.)-এর জীবন ছিল তাওহিদের প্রচার, জুলুমের বিরুদ্ধে সংগ্রাম, ধৈর্য ও আল্লাহর ওপর পূর্ণ নির্ভরতার এক উজ্জ্বল দৃষ্টান্ত। তিনি ফিরআউনের মতো অত্যাচারী শাসকের মোকাবিলা করেছেন এবং বনি ইসরাঈলকে দাসত্ব থেকে মুক্ত করেছেন। কিন্তু তাঁর কওমের অনেকেই আল্লাহর অসংখ্য নেয়ামত লাভ করার পরও অবাধ্যতা, অকৃতজ্ঞতা, শিরক ও বিরোধিতায় লিপ্ত হয়েছিল। তাঁদের এসব ঘটনা থেকে শিক্ষা পাওয়া যায় যে, শুধু আল্লাহর নেয়ামত লাভ করাই যথেষ্ট নয়; বরং তাঁর নির্দেশ মেনে চলা, নবী-রাসূলদের আনুগত্য করা এবং বিপদে-আপদে ধৈর্য ধারণ করাও প্রত্যেক মুমিনের অপরিহার্য দায়িত্ব।</p>"], ["মদিনা মুনাওয়ারায় হযরত মুহাম্মদ (সা.)-এর দাওয়াতের বিভিন্ন পর্ব বিস্তারিত আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>মহান আল্লাহ তাআলা মানবজাতির হেদায়েতের জন্য হযরত মুহাম্মদ (সা.)-কে সর্বশেষ নবী ও রাসূল হিসেবে প্রেরণ করেন। মক্কায় দীর্ঘ তেরো বছর দাওয়াতি কার্যক্রম পরিচালনার পর তিনি আল্লাহর নির্দেশে মদিনায় হিজরত করেন। মদিনায় এসে তিনি শুধু ইসলামের প্রচারই করেননি; বরং একটি আদর্শ ইসলামী সমাজ ও রাষ্ট্র প্রতিষ্ঠা করেন। সেখানে মসজিদ নির্মাণ, মুহাজির ও আনসারদের মধ্যে ভ্রাতৃত্ব স্থাপন, মদিনা সনদ প্রণয়ন, ইসলামী শিক্ষার বিস্তার, বিভিন্ন গোত্রের সঙ্গে সম্পর্ক স্থাপন এবং রাষ্ট্রীয় পর্যায়ে ইসলামের দাওয়াত পৌঁছে দেওয়ার মতো গুরুত্বপূর্ণ কার্যক্রম পরিচালনা করেন। মদিনায় তাঁর দাওয়াতি কার্যক্রম ছিল সুসংগঠিত, বহুমুখী ও বাস্তবভিত্তিক।</p><div class=\"h hm\">মদিনা মুনাওয়ারায় রাসূলুল্লাহ (সা.)-এর দাওয়াতের বিভিন্ন পর্ব</div><div class=\"h hs hs2\">১. মদিনায় হিজরত ও দাওয়াতি কার্যক্রমের সূচনা</div><p>মক্কার কাফিরদের অত্যাচার ও নির্যাতনের কারণে মুসলমানদের জন্য সেখানে বসবাস করা কঠিন হয়ে পড়েছিল। এ অবস্থায় আল্লাহর নির্দেশে রাসূলুল্লাহ (সা.) মদিনায় হিজরত করেন। এর আগে মদিনার আওস ও খাযরাজ গোত্রের অনেক ব্যক্তি ইসলাম গ্রহণ করেছিলেন। তাঁরা রাসূলুল্লাহ (সা.)-কে মদিনায় আমন্ত্রণ জানান এবং তাঁকে সাহায্য করার অঙ্গীকার করেন।</p><p>হিজরতের মাধ্যমে ইসলামের দাওয়াত নতুন পর্যায়ে প্রবেশ করে। মক্কায় মুসলমানরা নির্যাতিত ও দুর্বল অবস্থায় ছিলেন; কিন্তু মদিনায় তাঁরা স্বাধীনভাবে ইসলামের শিক্ষা প্রচার এবং একটি ইসলামী সমাজ প্রতিষ্ঠার সুযোগ লাভ করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ هَاجَرُوا فِي اللَّهِ مِنْ بَعْدِ مَا ظُلِمُوا لَنُبَوِّئَنَّهُمْ فِي الدُّنْيَا حَسَنَةً وَلَأَجْرُ الْآخِرَةِ أَكْبَرُ لَوْ كَانُوا يَعْلَمُونَ.</div></div><p>অর্থ: যারা নির্যাতিত হওয়ার পর আল্লাহর পথে হিজরত করেছে, আমি অবশ্যই তাদের দুনিয়ায় উত্তম আবাস দেব। আর আখিরাতের প্রতিদান তো আরও বড়, যদি তারা জানত। (সূরা আন-নাহল: ৪১)</p><div class=\"h hs hs2\">২. মসজিদে নববি নির্মাণ ও দাওয়াতের কেন্দ্র প্রতিষ্ঠা</div><p>মদিনায় পৌঁছে রাসূলুল্লাহ (সা.) সর্বপ্রথম যে গুরুত্বপূর্ণ কাজটি করেন, তা হলো মসজিদে নববি নির্মাণ। মসজিদটি শুধু নামাজ আদায়ের স্থান ছিল না; বরং এটি ছিল ইসলামের দাওয়াত, শিক্ষা, প্রশিক্ষণ, পরামর্শ, বিচারকার্য ও সামাজিক কার্যক্রমের কেন্দ্র।</p><p>রাসূলুল্লাহ (সা.) নিজেও সাহাবিদের সঙ্গে মসজিদ নির্মাণে অংশগ্রহণ করেন। এর মাধ্যমে তিনি মুসলমানদের মধ্যে পারস্পরিক সহযোগিতা, শ্রমের মর্যাদা এবং ঐক্যের শিক্ষা প্রদান করেন।</p><p>মসজিদে নববিকে কেন্দ্র করে সাহাবিদের মধ্যে কুরআন শিক্ষা, হাদিস শিক্ষা, ইবাদত ও নৈতিক প্রশিক্ষণের ব্যবস্থা গড়ে ওঠে। এভাবে মসজিদটি মদিনার ইসলামী সমাজ গঠনের প্রাণকেন্দ্রে পরিণত হয়।</p><div class=\"h hs hs2\">৩. মুহাজির ও আনসারদের মধ্যে ভ্রাতৃত্ব স্থাপন</div><p>মক্কা থেকে হিজরত করে আসা মুসলমানদের মুহাজির এবং মদিনার মুসলমানদের আনসার বলা হয়। মুহাজিররা মক্কায় নিজেদের ঘরবাড়ি, সম্পদ ও ব্যবসা-বাণিজ্য ছেড়ে এসেছিলেন। ফলে মদিনায় তাঁদের পুনর্বাসনের প্রয়োজন ছিল। রাসূলুল্লাহ (সা.) মুহাজির ও আনসারদের মধ্যে ভ্রাতৃত্ব স্থাপন করেন। এ ব্যবস্থাকে ইসলামের ইতিহাসে ‘মুআখাত’ বলা হয়।</p><p>এর ফলে আনসাররা মুহাজিরদের আশ্রয়, সম্পদ ও সহযোগিতা প্রদান করেন। তাঁদের মধ্যে এমন ভালোবাসা ও সহযোগিতা গড়ে ওঠে, যা মানবসমাজে বিরল দৃষ্টান্ত হিসেবে বিবেচিত।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ تَبَوَّءُوا الدَّارَ وَالْإِيمَانَ مِنْ قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلَا يَجِدُونَ فِي صُدُورِهِمْ حَاجَةً مِمَّا أُوتُوا وَيُؤْثِرُونَ عَلَىٰ أَنْفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ.</div></div><p>অর্থ: আর যারা তাঁদের আগে থেকেই মদিনায় বসবাস করেছিল এবং ঈমান গ্রহণ করেছিল, তারা তাদের কাছে হিজরত করে আসা লোকদের ভালোবাসে। মুহাজিরদের যা দেওয়া হয়েছে, সে বিষয়ে তারা নিজেদের অন্তরে কোনো প্রয়োজন অনুভব করে না। আর নিজেদের অভাব থাকা সত্ত্বেও তারা অন্যদের নিজেদের ওপর প্রাধান্য দেয়। (সূরা আল-হাশর: ৯)</p><div class=\"h hs hs2\">৪. মদিনা সনদ প্রণয়ন ও শান্তিপূর্ণ সহাবস্থানের ব্যবস্থা</div><p>মদিনায় মুসলমান, ইহুদি এবং বিভিন্ন গোত্রের লোকেরা বসবাস করত। তাদের মধ্যে পারস্পরিক বিরোধ ও সংঘাতের আশঙ্কা ছিল। তাই রাসূলুল্লাহ (সা.) মদিনার বিভিন্ন সম্প্রদায়ের সঙ্গে একটি লিখিত চুক্তি সম্পাদন করেন, যা ইতিহাসে ‘মদিনা সনদ’ নামে পরিচিত।</p><p>এ সনদের মাধ্যমে মদিনার বিভিন্ন সম্প্রদায়ের অধিকার ও দায়িত্ব নির্ধারণ করা হয়। মুসলমান ও ইহুদিদের মধ্যে পারস্পরিক নিরাপত্তা, ধর্মীয় স্বাধীনতা, সামাজিক দায়িত্ব এবং বহিঃশত্রুর বিরুদ্ধে সম্মিলিত প্রতিরক্ষার নীতি প্রতিষ্ঠিত হয়।</p><p>মদিনা সনদের মাধ্যমে রাসূলুল্লাহ (সা.) ন্যায়বিচার, শান্তি, সহনশীলতা ও সামাজিক ঐক্যের ভিত্তিতে একটি রাষ্ট্রীয় কাঠামো গড়ে তোলেন। এটি তাঁর দাওয়াতি কার্যক্রমের একটি গুরুত্বপূর্ণ অধ্যায়।</p><div class=\"h hs hs2\">৫. ইসলামী শিক্ষা ও প্রশিক্ষণের ব্যবস্থা</div><p>মদিনায় রাসূলুল্লাহ (সা.) ইসলামী শিক্ষার প্রসারে বিশেষ গুরুত্ব প্রদান করেন। মসজিদে নববিতে নিয়মিত কুরআন ও সুন্নাহ শিক্ষা দেওয়া হতো। সাহাবিগণ রাসূলুল্লাহ (সা.)-এর কাছ থেকে সরাসরি দ্বীনের বিধিবিধান শিখতেন এবং অন্যদের কাছে তা পৌঁছে দিতেন।</p><p>মসজিদে নববির এক পাশে দরিদ্র ও জ্ঞানার্জনে নিয়োজিত সাহাবিদের জন্য একটি স্থান নির্ধারণ করা হয়েছিল, যা ‘সুফফা’ নামে পরিচিত। সেখানে অবস্থানকারী সাহাবিদের ‘আসহাবে সুফফা’ বলা হয়। তাঁরা রাসূলুল্লাহ (সা.)-এর কাছ থেকে ইসলামী জ্ঞান অর্জন করতেন এবং পরবর্তী সময়ে বিভিন্ন অঞ্চলে দ্বীনের শিক্ষা প্রচারে ভূমিকা রাখতেন।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">بَلِّغُوا عَنِّي وَلَوْ آيَةً.</div></div><p>অর্থ: তোমরা আমার পক্ষ থেকে একটি আয়াত হলেও পৌঁছে দাও। (সহিহ বুখারি, হাদিস: ৩৪৬১)</p><p>এ হাদিসের মাধ্যমে রাসূলুল্লাহ (সা.) ইসলামের শিক্ষা প্রচার ও অন্যের কাছে পৌঁছে দেওয়ার গুরুত্ব তুলে ধরেছেন।</p><div class=\"h hs hs2\">৬. ব্যক্তিগত চরিত্র ও সামাজিক আচরণের মাধ্যমে দাওয়াত প্রদান</div><p>রাসূলুল্লাহ (সা.) মদিনায় মানুষের কাছে ইসলামের দাওয়াত পৌঁছে দেওয়ার ক্ষেত্রে নিজের উত্তম চরিত্র ও আদর্শকে বিশেষ গুরুত্ব দিতেন। তিনি ছিলেন সত্যবাদী, আমানতদার, দয়ালু, ক্ষমাশীল ও ন্যায়পরায়ণ। তিনি দরিদ্র, অসহায়, এতিম ও বিধবাদের প্রতি সদয় আচরণ করতেন।</p><p>তিনি মুসলমানদের পারস্পরিক সম্পর্ক সুন্দর করার পাশাপাশি অমুসলিমদের সঙ্গেও ন্যায়সংগত আচরণ করতেন। তাঁর উত্তম চরিত্র ও মানবিক আচরণে অনেক মানুষ ইসলামের প্রতি আকৃষ্ট হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ.</div></div><p>অর্থ: নিশ্চয়ই আপনি মহান চরিত্রের অধিকারী। (সূরা আল-কলম: ৪)</p><div class=\"h hs hs2\">৭. ইহুদি সম্প্রদায়কে ইসলামের দাওয়াত প্রদান</div><p>মদিনায় বসবাসকারী ইহুদি সম্প্রদায়ের সঙ্গে রাসূলুল্লাহ (সা.) বিভিন্ন পর্যায়ে আলোচনা ও যোগাযোগ করেন। তিনি তাদের এক আল্লাহর ইবাদত, নবুওয়াতের প্রতি বিশ্বাস এবং সত্য দ্বীন গ্রহণের আহ্বান জানান। তিনি তাদের সামনে কুরআনের সত্যতা ও ইসলামের শিক্ষা তুলে ধরেন।</p><p>ইহুদিদের অনেকেই রাসূলুল্লাহ (সা.)-এর নবুওয়াত সম্পর্কে জানার সুযোগ পেয়েও অহংকার, হিংসা ও গোত্রীয় স্বার্থের কারণে ইসলাম গ্রহণ করেনি। তাদের কিছু গোষ্ঠী মুসলমানদের সঙ্গে সম্পাদিত চুক্তি ভঙ্গ করে এবং ইসলামী রাষ্ট্রের বিরুদ্ধে ষড়যন্ত্রে লিপ্ত হয়। রাসূলুল্লাহ (সা.) এসব পরিস্থিতিতে ন্যায়বিচার ও চুক্তির নীতি অনুসারে ব্যবস্থা গ্রহণ করেন।</p><div class=\"h hs hs2\">৮. মুনাফিকদের মোকাবিলা ও মুসলিম সমাজকে সতর্ক করা</div><p>মদিনায় ইসলাম শক্তিশালী হওয়ার পর কিছু লোক বাহ্যিকভাবে ইসলাম গ্রহণ করলেও অন্তরে ইসলাম ও মুসলমানদের প্রতি বিদ্বেষ পোষণ করত। এদের মুনাফিক বলা হয়। আবদুল্লাহ ইবনে উবাই ছিল মদিনার মুনাফিকদের অন্যতম নেতা।</p><p>মুনাফিকরা মুসলমানদের মধ্যে বিভেদ সৃষ্টি, রাসূলুল্লাহ (সা.)-এর নেতৃত্বকে দুর্বল করা এবং ইসলামী সমাজের ঐক্য নষ্ট করার চেষ্টা করত। তারা বিভিন্ন সময়ে মিথ্যা প্রচার ও ষড়যন্ত্রে লিপ্ত হতো। রাসূলুল্লাহ (সা.) ধৈর্য, বিচক্ষণতা ও প্রজ্ঞার সঙ্গে তাদের মোকাবিলা করেন। পাশাপাশি কুরআনের মাধ্যমে মুসলমানদের মুনাফিকদের বৈশিষ্ট্য সম্পর্কে সতর্ক করা হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ وَلَنْ تَجِدَ لَهُمْ نَصِيرًا.</div></div><p>অর্থ: নিশ্চয়ই মুনাফিকরা জাহান্নামের সর্বনিম্ন স্তরে থাকবে এবং তুমি তাদের জন্য কোনো সাহায্যকারী পাবে না। (সূরা আন-নিসা: ১৪৫)</p><div class=\"h hs hs2\">৯. বিভিন্ন গোত্র ও সম্প্রদায়ের মধ্যে দাওয়াত প্রচার</div><p>রাসূলুল্লাহ (সা.) মদিনায় অবস্থান করলেও তাঁর দাওয়াত শুধু মদিনার অধিবাসীদের মধ্যে সীমাবদ্ধ রাখেননি। তিনি আশপাশের বিভিন্ন আরব গোত্রের কাছে ইসলামের বার্তা পৌঁছে দেন। বিভিন্ন গোত্রের প্রতিনিধি দল মদিনায় আসত এবং রাসূলুল্লাহ (সা.)-এর সঙ্গে সাক্ষাৎ করে ইসলামের শিক্ষা গ্রহণ করত।</p><p>তিনি তাঁদের কুরআন ও সুন্নাহর শিক্ষা দিতেন এবং প্রয়োজন অনুযায়ী শিক্ষক ও দাঈ পাঠাতেন। এর ফলে মদিনার বাইরে বিভিন্ন অঞ্চলেও ইসলামের প্রচার প্রসার লাভ করে।</p><div class=\"h hs hs2\">১০. ইসলামের দাওয়াত আন্তর্জাতিক পর্যায়ে পৌঁছে দেওয়া</div><p>হিজরতের পর মদিনায় ইসলামী রাষ্ট্র প্রতিষ্ঠিত হলে রাসূলুল্লাহ (সা.) আন্তর্জাতিক পর্যায়েও ইসলামের দাওয়াত পৌঁছে দেওয়ার উদ্যোগ গ্রহণ করেন। হিজরি ষষ্ঠ সালে হুদাইবিয়ার সন্ধির পর তিনি বিভিন্ন দেশের শাসক ও সম্রাটের কাছে ইসলামের দাওয়াত দিয়ে পত্র পাঠান।</p><p>তিনি রোমের সম্রাট হিরাক্লিয়াস, পারস্যের সম্রাট কিসরা, মিসরের শাসক মুকাওকিস, আবিসিনিয়ার বাদশাহ নাজাশি এবং অন্যান্য শাসকদের কাছে ইসলামের আহ্বান পৌঁছে দেন। এসব পত্রে তিনি এক আল্লাহর প্রতি ঈমান আনা এবং ইসলামের বিধান গ্রহণ করার আহ্বান জানান।</p><p class=\"bh\"><b>রোমের সম্রাট হিরাক্লিয়াসের কাছে পাঠানো পত্রে রাসূলুল্লাহ (সা.) বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَسْلِمْ تَسْلَمْ.</div></div><p>অর্থ: ইসলাম গ্রহণ করো, নিরাপদ থাকবে। (সহিহ বুখারি, হাদিস: ৭)</p><p>এভাবে রাসূলুল্লাহ (সা.) ইসলামের দাওয়াতকে আরব উপদ্বীপের সীমানা অতিক্রম করে আন্তর্জাতিক পর্যায়ে পৌঁছে দেন।</p><div class=\"h hs hs2\">১১. হুদাইবিয়ার সন্ধি ও শান্তিপূর্ণ দাওয়াতের সুযোগ সৃষ্টি</div><p>হিজরি ষষ্ঠ সালে রাসূলুল্লাহ (সা.) সাহাবিদের নিয়ে উমরাহ পালনের উদ্দেশ্যে মক্কার দিকে যাত্রা করেন। কিন্তু মক্কার কাফিররা তাঁদের বাধা দেয়। পরবর্তী সময়ে হুদাইবিয়া নামক স্থানে একটি সন্ধিচুক্তি সম্পাদিত হয়।</p><p>প্রাথমিকভাবে সন্ধির কিছু শর্ত মুসলমানদের কাছে কঠিন মনে হলেও এর ফলে মুসলমান ও মক্কার কাফিরদের মধ্যে যুদ্ধবিরতি প্রতিষ্ঠিত হয়। শান্তিপূর্ণ পরিবেশে মানুষ ইসলামের শিক্ষা জানার সুযোগ পায়। ফলে অনেক মানুষ ইসলাম গ্রহণ করে। এ সন্ধি ইসলামের দাওয়াত প্রসারের ক্ষেত্রে গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><div class=\"h hs hs2\">১২. মক্কা বিজয় ও সাধারণ ক্ষমা ঘোষণা</div><p>হিজরি অষ্টম সালে মক্কার কাফিররা হুদাইবিয়ার সন্ধি ভঙ্গ করলে রাসূলুল্লাহ (সা.) মক্কার দিকে অগ্রসর হন। তিনি মক্কা বিজয় করেন। কিন্তু বিজয়ের পর প্রতিশোধ গ্রহণ না করে সাধারণ ক্ষমা ঘোষণা করেন। যারা দীর্ঘদিন মুসলমানদের ওপর নির্যাতন চালিয়েছিল, তাদের অনেককেই তিনি ক্ষমা করে দেন।</p><p>তাঁর এই মহানুভবতা ও ক্ষমাশীলতা মানুষের হৃদয়ে গভীর প্রভাব ফেলে। মক্কা বিজয়ের পর বিপুলসংখ্যক মানুষ ইসলাম গ্রহণ করে। এ ঘটনা ইসলামের দাওয়াতের ইতিহাসে এক গুরুত্বপূর্ণ মাইলফলক।</p><div class=\"h hs hs2\">১৩. বিভিন্ন প্রতিনিধি দল গ্রহণ ও ইসলামের শিক্ষা প্রদান</div><p>মক্কা বিজয়ের পর আরবের বিভিন্ন গোত্রের প্রতিনিধি দল মদিনায় আসতে শুরু করে। তারা রাসূলুল্লাহ (সা.)-এর সঙ্গে সাক্ষাৎ করে ইসলাম সম্পর্কে জানতে চাইত। রাসূলুল্লাহ (সা.) তাদের ইসলামের মৌলিক শিক্ষা, ঈমান, সালাত, যাকাত ও অন্যান্য বিধিবিধান সম্পর্কে অবহিত করতেন।</p><p>তিনি তাঁদের নিজ নিজ এলাকায় ফিরে গিয়ে ইসলামের শিক্ষা প্রচারের নির্দেশ দিতেন। এভাবে প্রতিনিধি দলগুলোর মাধ্যমে ইসলামের দাওয়াত আরবের বিভিন্ন অঞ্চলে ছড়িয়ে পড়ে। ইতিহাসে এ সময়কে ‘আমুল উফুদ’ বা প্রতিনিধি দলের বছর হিসেবে পরিচিত করা হয়।</p><div class=\"h hs hs2\">১৪. বিদায় হজের ভাষণের মাধ্যমে দাওয়াতের পূর্ণতা</div><p>হিজরি দশম সালে রাসূলুল্লাহ (সা.) বিদায় হজ পালন করেন। এ সময় তিনি আরাফাতের ময়দানে ঐতিহাসিক ভাষণ প্রদান করেন। তিনি মানুষের জীবন, সম্পদ ও সম্মানের নিরাপত্তা, সুদ নিষিদ্ধকরণ, নারীদের অধিকার, মুসলমানদের পারস্পরিক ভ্রাতৃত্ব এবং কুরআন-সুন্নাহ অনুসরণের গুরুত্ব তুলে ধরেন।</p><p>তিনি উপস্থিত সাহাবিদের নির্দেশ দেন, যারা এখানে উপস্থিত আছে তারা যেন অনুপস্থিত ব্যক্তিদের কাছে তাঁর বাণী পৌঁছে দেয়। এ ভাষণের মাধ্যমে তিনি মানবজাতির জন্য ইসলামের মৌলিক শিক্ষা ও নৈতিক বিধানগুলো সুস্পষ্টভাবে তুলে ধরেন।</p><div class=\"h hm\">উপসংহার</div><p>মদিনা মুনাওয়ারায় রাসূলুল্লাহ (সা.)-এর দাওয়াতি কার্যক্রম ছিল অত্যন্ত সুপরিকল্পিত, ব্যাপক ও ফলপ্রসূ। তিনি মসজিদ নির্মাণের মাধ্যমে শিক্ষাকেন্দ্র প্রতিষ্ঠা করেন, মুহাজির ও আনসারদের মধ্যে ভ্রাতৃত্ব গড়ে তোলেন, মদিনা সনদের মাধ্যমে শান্তিপূর্ণ সমাজ প্রতিষ্ঠা করেন এবং বিভিন্ন সম্প্রদায় ও গোত্রের কাছে ইসলামের দাওয়াত পৌঁছে দেন। পরবর্তী সময়ে আন্তর্জাতিক পর্যায়ে পত্র প্রেরণ, মক্কা বিজয় এবং প্রতিনিধি দলগুলোর মাধ্যমে ইসলামের প্রচারকে আরও বিস্তৃত করেন। তাঁর এ দাওয়াতি কার্যক্রমের ফলেই মদিনা একটি আদর্শ ইসলামী সমাজ ও রাষ্ট্রে পরিণত হয় এবং ইসলাম বিশ্বব্যাপী বিস্তারের শক্তিশালী ভিত্তি লাভ করে।</p>"], ["হযরত আবু বকর সিদ্দীক (রা.)-এর খেলাফতকালের দাওয়াতি কার্যক্রম বিস্তারিত বর্ণনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হযরত আবু বকর সিদ্দীক (রা.) ছিলেন ইসলামের প্রথম খলিফা এবং রাসূলুল্লাহ (সা.)-এর ঘনিষ্ঠ সাহাবি। তিনি ছিলেন সত্যবাদিতা, ঈমান, ত্যাগ, ধৈর্য ও দৃঢ়তার অনন্য দৃষ্টান্ত। রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর মুসলিম উম্মাহ যখন গভীর সংকটের সম্মুখীন হয়, তখন তিনি খেলাফতের দায়িত্ব গ্রহণ করেন। তাঁর খেলাফতকাল ছিল মাত্র দুই বছর তিন মাসের মতো। এই স্বল্প সময়ে তিনি ইসলামের ভিত্তি সুদৃঢ় করেন, মিথ্যা নবুওয়াতের দাবিদারদের বিরুদ্ধে ব্যবস্থা গ্রহণ করেন, যাকাত অস্বীকারকারীদের মোকাবিলা করেন, পবিত্র কুরআন সংকলনের উদ্যোগ গ্রহণ করেন এবং ইসলামের দাওয়াতকে আরব উপদ্বীপের বাইরেও ছড়িয়ে দেওয়ার পথ সুগম করেন। তাঁর এসব কার্যক্রম ইসলামের ইতিহাসে অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hm\">হযরত আবু বকর সিদ্দীক (রা.)-এর খেলাফতকালের দাওয়াতি কার্যক্রম</div><div class=\"h hs hs2\">১. খেলাফতের দায়িত্ব গ্রহণ ও ইসলামী ঐক্য প্রতিষ্ঠা</div><p>হিজরি ১১ সালে রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর মুসলিম সমাজে নেতৃত্বের প্রশ্ন দেখা দেয়। এ সংকটময় সময়ে সাহাবিগণের পরামর্শ ও সম্মতিক্রমে হযরত আবু বকর (রা.) খলিফা নির্বাচিত হন। তিনি দায়িত্ব গ্রহণের পর মুসলমানদের ঐক্য ও সংহতি বজায় রাখার ওপর বিশেষ গুরুত্ব দেন।</p><p>খলিফা হিসেবে তাঁর প্রথম ভাষণে তিনি ঘোষণা করেন যে, তিনি আল্লাহ ও তাঁর রাসূলের আনুগত্যের ওপর প্রতিষ্ঠিত থাকবেন। তিনি নিজেকে জনগণের শাসক হিসেবে নয়, বরং দায়িত্বপ্রাপ্ত একজন সেবক হিসেবে বিবেচনা করতেন। তিনি জনগণকে সত্য ও ন্যায়ের পক্ষে সহযোগিতা করার এবং অন্যায় থেকে বিরত থাকার আহ্বান জানান।</p><p>তাঁর এ বক্তব্যে ইসলামী নেতৃত্বের মূলনীতি, জবাবদিহিতা এবং ন্যায়ভিত্তিক শাসনব্যবস্থার পরিচয় পাওয়া যায়।</p><div class=\"h hs hs2\">২. রাসূলুল্লাহ (সা.)-এর আদর্শ ও সুন্নাহ অনুসরণ</div><p>হযরত আবু বকর (রা.)-এর দাওয়াতি কার্যক্রমের অন্যতম বৈশিষ্ট্য ছিল রাসূলুল্লাহ (সা.)-এর আদর্শ ও সুন্নাহর যথাযথ অনুসরণ। তিনি ইসলামের বিধিবিধান পরিবর্তন না করে রাসূলুল্লাহ (সা.)-এর রেখে যাওয়া আদর্শ অনুযায়ী রাষ্ট্র পরিচালনা করেন।</p><p>রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর মুসলমানদের মধ্যে শোক ও হতাশা দেখা দিলে তিনি সবাইকে আল্লাহর ওপর নির্ভরশীল হওয়ার আহ্বান জানান। তিনি স্মরণ করিয়ে দেন যে, মুহাম্মদ (সা.) আল্লাহর রাসূল; কিন্তু আল্লাহ চিরঞ্জীব।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ أَفَإِنْ مَاتَ أَوْ قُتِلَ انْقَلَبْتُمْ عَلَىٰ أَعْقَابِكُمْ.</div></div><p>অর্থ: মুহাম্মদ একজন রাসূল মাত্র। তাঁর পূর্বেও বহু রাসূল অতিবাহিত হয়েছেন। সুতরাং তিনি যদি মৃত্যুবরণ করেন অথবা নিহত হন, তবে কি তোমরা পেছনে ফিরে যাবে? (সূরা আলে ইমরান: ১৪৪)</p><p>এই আয়াত পাঠ করে তিনি সাহাবিদের মনে দৃঢ়তা ফিরিয়ে আনেন এবং ইসলামের প্রতি অবিচল থাকার শিক্ষা দেন।</p><div class=\"h hs hs2\">৩. মিথ্যা নবুওয়াতের দাবিদারদের বিরুদ্ধে ব্যবস্থা গ্রহণ</div><p>রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর আরবের বিভিন্ন অঞ্চলে কয়েকজন ব্যক্তি মিথ্যা নবুওয়াতের দাবি করে। তাদের মধ্যে মুসাইলামা কাজ্জাব, তুলাইহা আল-আসাদি, সাজাহ এবং আসওয়াদ আনসি উল্লেখযোগ্য। তারা নিজেদের নবী দাবি করে সাধারণ মানুষকে বিভ্রান্ত করার চেষ্টা করে।</p><p>হযরত আবু বকর (রা.) বুঝতে পারেন, মিথ্যা নবুওয়াতের দাবিদারদের কার্যক্রম চলতে থাকলে ইসলামের আকিদা ও মুসলিম উম্মাহর ঐক্য মারাত্মকভাবে ক্ষতিগ্রস্ত হবে। তাই তিনি তাদের বিরুদ্ধে প্রয়োজনীয় ব্যবস্থা গ্রহণ করেন। বিভিন্ন সেনাদল প্রেরণ করে তাদের বিদ্রোহ দমন করেন এবং তাওহিদ ও খতমে নবুওয়াতের আকিদা সংরক্ষণ করেন।</p><p>মুসাইলামা কাজ্জাবের বিরুদ্ধে ইয়ামামার যুদ্ধে মুসলমানরা বড় ধরনের বিজয় অর্জন করেন। এর মাধ্যমে মিথ্যা নবুওয়াতের আন্দোলন দুর্বল হয়ে পড়ে।</p><div class=\"h hs hs2\">৪. যাকাত অস্বীকারকারীদের বিরুদ্ধে সংগ্রাম</div><p>হযরত আবু বকর (রা.)-এর খেলাফতকালের অন্যতম গুরুত্বপূর্ণ ঘটনা ছিল যাকাত অস্বীকারকারীদের বিরুদ্ধে ব্যবস্থা গ্রহণ। রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর আরবের কিছু গোত্র সালাত আদায় করতে রাজি থাকলেও যাকাত দিতে অস্বীকার করে। তারা মনে করত, রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর যাকাত প্রদানের বাধ্যবাধকতা আর নেই।</p><p>কিন্তু হযরত আবু বকর (রা.) এ মতের বিরোধিতা করেন। তিনি ঘোষণা করেন, সালাত ও যাকাতের মধ্যে কোনো পার্থক্য করা যাবে না। ইসলামের একটি মৌলিক বিধানকে অস্বীকার করার সুযোগ দেওয়া যায় না।</p><p class=\"bh\"><b>তিনি বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاللَّهِ لَأُقَاتِلَنَّ مَنْ فَرَّقَ بَيْنَ الصَّلَاةِ وَالزَّكَاةِ.</div></div><p>অর্থ: আল্লাহর শপথ! যে ব্যক্তি সালাত ও যাকাতের মধ্যে পার্থক্য করবে, আমি অবশ্যই তার বিরুদ্ধে যুদ্ধ করব। (সহিহ বুখারি, হাদিস: ১৩৯৯)</p><p>তাঁর এ দৃঢ় অবস্থানের ফলে যাকাতের বিধান প্রতিষ্ঠিত হয় এবং ইসলামী রাষ্ট্রের ঐক্য ও ধর্মীয় শৃঙ্খলা বজায় থাকে।</p><div class=\"h hs hs2\">৫. পবিত্র কুরআন সংকলনের উদ্যোগ গ্রহণ</div><p>হযরত আবু বকর (রা.)-এর খেলাফতকালের অন্যতম শ্রেষ্ঠ অবদান হলো পবিত্র কুরআন সংকলনের উদ্যোগ গ্রহণ। ইয়ামামার যুদ্ধে বহু হাফেজে কুরআন শহিদ হন। এতে হযরত উমর (রা.) আশঙ্কা প্রকাশ করেন যে, এভাবে হাফেজদের মৃত্যুবরণ অব্যাহত থাকলে কুরআনের সংরক্ষণে ভবিষ্যতে সমস্যা দেখা দিতে পারে।</p><p>তিনি আবু বকর (রা.)-কে কুরআন একত্রে সংকলনের পরামর্শ দেন। প্রথমে আবু বকর (রা.) কিছুটা দ্বিধাগ্রস্ত হলেও পরে বিষয়টির গুরুত্ব উপলব্ধি করে সম্মত হন। তিনি হযরত যায়েদ ইবনে সাবিত (রা.)-কে কুরআনের আয়াতগুলো সংগ্রহ ও সংকলনের দায়িত্ব দেন।</p><p>যায়েদ ইবনে সাবিত (রা.) অত্যন্ত সতর্কতার সঙ্গে লিখিত উপকরণ ও সাহাবিদের মুখস্থ পাঠের ভিত্তিতে কুরআনের আয়াতগুলো একত্র করেন। এভাবে পবিত্র কুরআন একটি সংকলিত পাণ্ডুলিপিতে সংরক্ষিত হয়।</p><p>এ উদ্যোগ ইসলামের দাওয়াতি কার্যক্রমে অত্যন্ত গুরুত্বপূর্ণ ভূমিকা পালন করে। কারণ কুরআনই ইসলামের প্রধান উৎস এবং মানবজাতির জন্য হেদায়েতের চিরন্তন গ্রন্থ।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ.</div></div><p>অর্থ: নিশ্চয়ই আমিই এ উপদেশবাণী (কুরআন) অবতীর্ণ করেছি এবং আমিই এর সংরক্ষক। (সূরা আল-হিজর: ৯)</p><div class=\"h hs hs2\">৬. উসামা ইবনে যায়েদ (রা.)-এর বাহিনী প্রেরণ</div><p>রাসূলুল্লাহ (সা.)-এর জীবনের শেষদিকে রোমানদের বিরুদ্ধে একটি সেনাবাহিনী প্রস্তুত করেছিলেন এবং হযরত উসামা ইবনে যায়েদ (রা.)-কে তার সেনাপতি নিযুক্ত করেছিলেন। কিন্তু রাসূলুল্লাহ (সা.)-এর ইন্তেকালের কারণে বাহিনীটি যাত্রা করতে পারেনি।</p><p>খলিফা হওয়ার পর হযরত আবু বকর (রা.) অনেকের পরামর্শ সত্ত্বেও রাসূলুল্লাহ (সা.)-এর নির্দেশ বাস্তবায়নের সিদ্ধান্ত নেন। তিনি উসামা (রা.)-এর বাহিনীকে শাম অভিমুখে পাঠান।</p><p>এ অভিযানের মাধ্যমে তিনি প্রমাণ করেন যে, রাসূলুল্লাহ (সা.)-এর নির্দেশ ও সিদ্ধান্ত বাস্তবায়নে কোনো শিথিলতা গ্রহণযোগ্য নয়। পাশাপাশি আরবের বিভিন্ন গোত্রকে মুসলিম রাষ্ট্রের শক্তি ও দৃঢ়তার বার্তা পৌঁছে দেওয়া হয়।</p><div class=\"h hs hs2\">৭. রিদ্দার যুদ্ধ পরিচালনা ও ইসলামের ভিত্তি সুদৃঢ় করা</div><p>রাসূলুল্লাহ (সা.)-এর ইন্তেকালের পর আরবের বিভিন্ন গোত্রের মধ্যে বিদ্রোহ, ধর্মত্যাগ এবং রাষ্ট্রীয় কর্তৃত্ব অস্বীকারের প্রবণতা দেখা দেয়। ইতিহাসে এসব ঘটনা ‘রিদ্দার যুদ্ধ’ নামে পরিচিত।</p><p>হযরত আবু বকর (রা.) বিদ্রোহীদের বিরুদ্ধে বিভিন্ন সেনাপতি ও বাহিনী প্রেরণ করেন। খালিদ ইবনে ওয়ালিদ (রা.)-সহ দক্ষ সেনাপতিরা এসব অভিযানে গুরুত্বপূর্ণ ভূমিকা পালন করেন।</p><p>রিদ্দার যুদ্ধের মাধ্যমে আরব উপদ্বীপে ইসলামী রাষ্ট্রের ঐক্য পুনঃপ্রতিষ্ঠিত হয়। মুসলমানদের মধ্যে শৃঙ্খলা ফিরে আসে এবং ইসলামের মৌলিক বিধানগুলো কার্যকর থাকে। এভাবে তিনি ইসলামের দাওয়াত ও রাষ্ট্রীয় ব্যবস্থার ভিত্তি রক্ষা করেন।</p><div class=\"h hs hs2\">৮. ইসলামের দাওয়াত আরব উপদ্বীপের বাইরে বিস্তারের উদ্যোগ</div><p>হযরত আবু বকর (রা.) শুধু অভ্যন্তরীণ সংকট মোকাবিলায় সীমাবদ্ধ থাকেননি; বরং ইসলামের দাওয়াতকে আরব উপদ্বীপের বাইরেও বিস্তারের উদ্যোগ গ্রহণ করেন। তাঁর খেলাফতকালে পারস্য ও রোমান সাম্রাজ্যের অধীন অঞ্চলগুলোতে ইসলামী বাহিনী প্রেরণ করা হয়।</p><p>ইরাকের দিকে খালিদ ইবনে ওয়ালিদ (রা.)-এর নেতৃত্বে মুসলিম বাহিনী অভিযান পরিচালনা করে। অন্যদিকে শাম অঞ্চলে আবু উবাইদা ইবনুল জাররাহ (রা.), আমর ইবনুল আস (রা.), ইয়াজিদ ইবনে আবু সুফিয়ান (রা.) এবং শুরাহবিল ইবনে হাসানা (রা.)-এর নেতৃত্বে বিভিন্ন বাহিনী প্রেরণ করা হয়।</p><p>এসব অভিযানের মাধ্যমে ইসলামের রাজনৈতিক ও ভৌগোলিক প্রভাব বিস্তারের পথ তৈরি হয়। একই সঙ্গে নতুন অঞ্চলের মানুষের কাছে ইসলামের দাওয়াত পৌঁছে দেওয়ার সুযোগ সৃষ্টি হয়। তবে এসব অভিযানের প্রধান উদ্দেশ্যকে কেবল ধর্মান্তরকরণ হিসেবে ব্যাখ্যা করা সঠিক নয়; বরং তৎকালীন সাম্রাজ্যিক সংঘাত, সীমান্তের নিরাপত্তা এবং ইসলামী রাষ্ট্রের সম্প্রসারণও এর সঙ্গে সম্পর্কিত ছিল।</p><div class=\"h hs hs2\">৯. ইসলামী রাষ্ট্রে ন্যায়বিচার ও জনকল্যাণ প্রতিষ্ঠা</div><p>হযরত আবু বকর (রা.) তাঁর শাসনামলে ন্যায়বিচার, সততা ও জনকল্যাণকে বিশেষ গুরুত্ব দেন। তিনি শাসক ও সাধারণ মানুষের মধ্যে সমতার নীতি প্রতিষ্ঠা করেন। ধনী-গরিব, শক্তিশালী-দুর্বল সবার জন্য ইসলামের বিধান সমানভাবে কার্যকর রাখেন।</p><p>তিনি সরকারি সম্পদকে ব্যক্তিগত সম্পদ মনে করতেন না। রাষ্ট্রীয় সম্পদের যথাযথ ব্যবহার এবং দরিদ্রদের অধিকার রক্ষায় সচেষ্ট ছিলেন। তাঁর এ ন্যায়ভিত্তিক শাসনব্যবস্থা ইসলামের সৌন্দর্য ও মানবকল্যাণমূলক আদর্শকে মানুষের সামনে তুলে ধরে।</p><div class=\"h hs hs2\">১০. দাঈ ও সাহাবিদের মাধ্যমে ইসলামের শিক্ষা প্রচার</div><p>হযরত আবু বকর (রা.) সাহাবিদের মধ্যে দ্বীনি জ্ঞান প্রচার ও ইসলামের শিক্ষা বিস্তারে উৎসাহ প্রদান করেন। সাহাবিগণ বিভিন্ন অঞ্চলে গিয়ে মানুষকে কুরআন, সুন্নাহ, সালাত, যাকাত ও ইসলামের অন্যান্য বিধিবিধান শিক্ষা দিতেন।</p><p>তিনি ইসলামের মৌলিক শিক্ষা ও রাসূলুল্লাহ (সা.)-এর আদর্শ অনুসরণের ওপর গুরুত্ব দেন। তাঁর খেলাফতকালে সাহাবিদের মাধ্যমে ইসলামের শিক্ষা আরবের বিভিন্ন অঞ্চলে ছড়িয়ে পড়ে।</p><div class=\"h hs hs2\">১১. খলিফার শাসননীতিতে দাওয়াতের আদর্শ প্রতিষ্ঠা</div><p>হযরত আবু বকর (রা.)-এর দাওয়াতি কার্যক্রমের আরেকটি গুরুত্বপূর্ণ দিক ছিল তাঁর ব্যক্তিগত জীবন ও শাসননীতির মাধ্যমে ইসলামের আদর্শ প্রতিষ্ঠা। তিনি অত্যন্ত সাধারণ জীবনযাপন করতেন এবং দায়িত্ব পালনে সততা ও আমানতদারির পরিচয় দিতেন।</p><p>তিনি ক্ষমতার অপব্যবহার করতেন না এবং জনগণের অধিকার রক্ষায় সচেষ্ট থাকতেন। তাঁর শাসনব্যবস্থায় পরামর্শ, জবাবদিহিতা, ন্যায়বিচার ও আল্লাহভীতির প্রতিফলন ঘটেছিল। এভাবে তাঁর ব্যক্তিত্ব ও কর্মের মাধ্যমে ইসলামের বাস্তব শিক্ষা মানুষের সামনে প্রকাশিত হয়।</p><div class=\"h hm\">উপসংহার</div><p>হযরত আবু বকর সিদ্দীক (রা.)-এর খেলাফতকাল ছিল ইসলামের ইতিহাসে অত্যন্ত সংকটপূর্ণ ও তাৎপর্যপূর্ণ সময়। তিনি স্বল্প সময়ের খেলাফতে মুসলিম উম্মাহর ঐক্য রক্ষা, মিথ্যা নবুওয়াতের দাবিদারদের দমন, যাকাতের বিধান প্রতিষ্ঠা, পবিত্র কুরআন সংকলন, রিদ্দার যুদ্ধ পরিচালনা এবং ইসলামের দাওয়াতকে আরব উপদ্বীপের বাইরে বিস্তারের ভিত্তি স্থাপন করেন। তাঁর দৃঢ় ঈমান, দূরদর্শিতা, সাহসিকতা ও আল্লাহর প্রতি অবিচল আস্থা ইসলামের ইতিহাসে চিরস্মরণীয় হয়ে আছে। তাই ইসলামের দাওয়াত ও প্রচার-প্রসারে হযরত আবু বকর সিদ্দীক (রা.)-এর অবদান অত্যন্ত গুরুত্বপূর্ণ ও অনস্বীকার্য।</p>"], ["উমাইয়া শাসনামলে ইসলামী দাওয়াহর প্রসার সম্পর্কে যা জান সংক্ষেপে লেখ।", "<div class=\"h hm\">ভূমিকা</div><p>উমাইয়া শাসনামল ইসলামের ইতিহাসে একটি গুরুত্বপূর্ণ অধ্যায়। হিজরি ৪১ সালে হযরত মুয়াবিয়া ইবনে আবু সুফিয়ান (রা.)-এর মাধ্যমে উমাইয়া শাসনামলের সূচনা হয় এবং হিজরি ১৩২ সাল পর্যন্ত এ শাসনব্যবস্থা অব্যাহত থাকে। এ সময় মুসলিম সাম্রাজ্য ব্যাপকভাবে বিস্তৃত হয় এবং ইসলামের দাওয়াত এশিয়া, আফ্রিকা ও ইউরোপের বিভিন্ন অঞ্চলে ছড়িয়ে পড়ে। উমাইয়া শাসকদের সামরিক অভিযান, প্রশাসনিক সংস্কার, আরবি ভাষার প্রসার, মসজিদ ও শিক্ষাকেন্দ্র প্রতিষ্ঠা এবং দাঈদের প্রচেষ্টার ফলে ইসলামী দাওয়াহ নতুন গতি লাভ করে।</p><div class=\"h hm\">উমাইয়া শাসনামলে ইসলামী দাওয়াহর প্রসার</div><div class=\"h hs hs2\">১. উত্তর আফ্রিকায় ইসলামের বিস্তার</div><p>উমাইয়া শাসনামলে উত্তর আফ্রিকায় ইসলামের দাওয়াত ব্যাপকভাবে বিস্তার লাভ করে। মিসর থেকে পশ্চিম দিকে মুসলিম বাহিনী অগ্রসর হয়ে লিবিয়া, তিউনিসিয়া, আলজেরিয়া ও মরক্কো অঞ্চলে ইসলামের প্রভাব প্রতিষ্ঠা করে। উকবা ইবনে নাফি (রহ.) উত্তর আফ্রিকায় ইসলামের প্রসারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। তিনি কায়রাওয়ান নগরী প্রতিষ্ঠা করেন, যা পরবর্তীকালে ইসলামী শিক্ষা ও দাওয়াতের অন্যতম কেন্দ্রে পরিণত হয়।</p><div class=\"h hs hs2\">২. স্পেনে ইসলামের দাওয়াত প্রসার</div><p>উমাইয়া শাসনামলে হিজরি ৯২ সালে তারিক ইবনে জিয়াদ (রহ.)-এর নেতৃত্বে মুসলিম বাহিনী স্পেনে প্রবেশ করে। পরবর্তী সময়ে মুসা ইবনে নুসাইর (রহ.)-এর সহযোগিতায় সেখানে মুসলিম শাসন প্রতিষ্ঠিত হয়। স্পেনে ইসলামের শিক্ষা, সংস্কৃতি, জ্ঞান-বিজ্ঞান ও সভ্যতার ব্যাপক প্রসার ঘটে। কর্ডোভা, সেভিল ও গ্রানাডার মতো শহরগুলো ইসলামী জ্ঞানচর্চা ও সংস্কৃতির গুরুত্বপূর্ণ কেন্দ্রে পরিণত হয়।</p><div class=\"h hs hs2\">৩. মধ্য এশিয়ায় ইসলামের বিস্তার</div><p>উমাইয়া শাসনামলে মধ্য এশিয়ায় ইসলামের দাওয়াত পৌঁছে যায়। কুতাইবা ইবনে মুসলিম (রহ.)-এর নেতৃত্বে মুসলিম বাহিনী বুখারা, সমরকন্দ ও খাওয়ারিজম অঞ্চলে অগ্রসর হয়। এর ফলে মধ্য এশিয়ার বিভিন্ন অঞ্চলে ইসলামের প্রভাব বিস্তৃত হয়। পরবর্তী সময়ে এসব অঞ্চল ইসলামী শিক্ষা, সাহিত্য ও সংস্কৃতির গুরুত্বপূর্ণ কেন্দ্রে পরিণত হয়।</p><div class=\"h hs hs2\">৪. ভারতীয় উপমহাদেশে ইসলামের আগমন</div><p>উমাইয়া শাসনামলে হিজরি ৯২ সালে মুহাম্মদ ইবনে কাসিম (রহ.) সিন্ধু অঞ্চলে অভিযান পরিচালনা করেন। এর মাধ্যমে ভারতীয় উপমহাদেশে মুসলিম রাজনৈতিক উপস্থিতির সূচনা হয়। সিন্ধু অঞ্চলে মসজিদ নির্মাণ, ইসলামী শিক্ষা প্রচার এবং মুসলমানদের বসতি স্থাপনের মাধ্যমে ইসলামের দাওয়াত বিস্তারের সুযোগ সৃষ্টি হয়।</p><div class=\"h hs hs2\">৫. আরবি ভাষা ও ইসলামী সংস্কৃতির প্রসার</div><p>উমাইয়া খলিফা আবদুল মালিক ইবনে মারওয়ান প্রশাসনিক ক্ষেত্রে আরবি ভাষাকে বিশেষ গুরুত্ব দেন। সরকারি দাপ্তরিক কাজে আরবি ভাষার প্রচলন এবং মুদ্রাব্যবস্থায় সংস্কার সাধনের ফলে বিভিন্ন অঞ্চলে আরবি ভাষার প্রসার ঘটে। আরবি ভাষার মাধ্যমে কুরআন, হাদিস ও ইসলামী জ্ঞানচর্চার সুযোগ বৃদ্ধি পায়। ফলে ইসলামী সংস্কৃতি ও সভ্যতার বিস্তার ত্বরান্বিত হয়।</p><div class=\"h hs hs2\">৬. মসজিদ ও শিক্ষাকেন্দ্র প্রতিষ্ঠা</div><p>উমাইয়া শাসনামলে বিভিন্ন অঞ্চলে মসজিদ নির্মাণ করা হয়। মসজিদগুলো শুধু ইবাদতের স্থান ছিল না; বরং কুরআন, হাদিস, ফিকহ ও ইসলামী শিক্ষার কেন্দ্র হিসেবেও ব্যবহৃত হতো। দামেস্কের উমাইয়া মসজিদসহ বিভিন্ন স্থাপনা ইসলামী শিক্ষা ও সংস্কৃতির প্রসারে গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><div class=\"h hs hs2\">৭. দাঈ ও আলেমদের ভূমিকা</div><p>উমাইয়া শাসনামলে বিভিন্ন সাহাবি, তাবেয়ি ও আলেম ইসলামের দাওয়াত প্রচারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। তাঁরা বিভিন্ন অঞ্চলে গিয়ে মানুষকে কুরআন ও সুন্নাহর শিক্ষা দিতেন। বিশেষ করে বসরা, কুফা, দামেস্ক ও মদিনায় ইসলামী জ্ঞানচর্চার কেন্দ্র গড়ে ওঠে। এসব কেন্দ্র থেকে বহু আলেম ও দাঈ তৈরি হন, যাঁরা ইসলামের শিক্ষা প্রচারে অবদান রাখেন।</p><div class=\"h hs hs2\">৮. প্রশাসনিক ও সামাজিক ব্যবস্থায় ইসলামের প্রভাব</div><p>উমাইয়া শাসনামলে বিস্তৃত মুসলিম সাম্রাজ্যে ইসলামী আইন, বিচারব্যবস্থা ও সামাজিক বিধান কার্যকর করার উদ্যোগ নেওয়া হয়। বিভিন্ন অঞ্চলে মুসলিম প্রশাসন প্রতিষ্ঠার ফলে ইসলামী জীবনব্যবস্থার পরিচিতি বৃদ্ধি পায়। মুসলিম ব্যবসায়ী, আলেম ও সাধারণ মানুষের সামাজিক যোগাযোগের মাধ্যমেও ইসলামের শিক্ষা বিভিন্ন জনগোষ্ঠীর কাছে পৌঁছে যায়।</p><div class=\"h hm\">উপসংহার</div><p>উমাইয়া শাসনামল ইসলামী দাওয়াহর প্রসারের ইতিহাসে একটি গুরুত্বপূর্ণ যুগ। এ সময়ে উত্তর আফ্রিকা, স্পেন, মধ্য এশিয়া ও সিন্ধু অঞ্চলে ইসলামের প্রভাব বিস্তৃত হয়। পাশাপাশি আরবি ভাষা, মসজিদ, শিক্ষাকেন্দ্র ও ইসলামী সংস্কৃতির প্রসার ঘটে। তবে এ কথা মনে রাখতে হবে যে, সাম্রাজ্য বিস্তার এবং মানুষের মধ্যে ইসলামের ধর্মীয় গ্রহণযোগ্যতা এক বিষয় নয়; বিভিন্ন অঞ্চলে ইসলাম গ্রহণের প্রক্রিয়া দীর্ঘ সময় ধরে আলেম, দাঈ, ব্যবসায়ী ও সাধারণ মুসলমানদের প্রচেষ্টায় সম্পন্ন হয়েছে। সামগ্রিকভাবে উমাইয়া শাসনামল ইসলামের ভৌগোলিক ও সাংস্কৃতিক বিস্তারে গুরুত্বপূর্ণ ভূমিকা পালন করেছে।</p>"], ["আব্বাসি যুগে ইসলামী দাওয়াহর পদ্ধতি বর্ণনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>আব্বাসি শাসনামল ইসলামের ইতিহাসে জ্ঞান-বিজ্ঞান, শিক্ষা-সংস্কৃতি ও দাওয়াতি কার্যক্রমের এক গুরুত্বপূর্ণ যুগ। হিজরি ১৩২ সালে উমাইয়া শাসনের অবসানের পর আবুল আব্বাস আস-সাফফাহর মাধ্যমে আব্বাসি খেলাফতের সূচনা হয়। এ শাসনামলে বাগদাদ মুসলিম বিশ্বের রাজনৈতিক, সাংস্কৃতিক ও জ্ঞানচর্চার প্রধান কেন্দ্রে পরিণত হয়। আব্বাসি খলিফা, আলেম, মুহাদ্দিস, ফকিহ, সুফি ও দাঈগণ বিভিন্ন পদ্ধতিতে ইসলামের দাওয়াত প্রচার করেন। শিক্ষা-প্রতিষ্ঠান, মসজিদ, অনুবাদ কার্যক্রম, সাহিত্যচর্চা, বিতর্ক, ব্যবসা-বাণিজ্য ও আধ্যাত্মিক সাধনার মাধ্যমে ইসলামী দাওয়াহ ব্যাপক বিস্তার লাভ করে।</p><div class=\"h hm\">আব্বাসি যুগে ইসলামী দাওয়াহর বিভিন্ন পদ্ধতি</div><div class=\"h hs hs2\">১. কুরআন ও সুন্নাহর শিক্ষার মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে ইসলামী দাওয়াতের অন্যতম প্রধান পদ্ধতি ছিল পবিত্র কুরআন ও রাসূলুল্লাহ (সা.)-এর সুন্নাহর শিক্ষা প্রচার। এ যুগে কুরআন ও হাদিসের সংকলন, ব্যাখ্যা এবং শিক্ষাদানের কার্যক্রম ব্যাপকভাবে বিস্তৃত হয়। ইমাম বুখারি, ইমাম মুসলিম, ইমাম আবু দাউদ, ইমাম তিরমিজি প্রমুখ মুহাদ্দিস হাদিস সংকলন ও প্রচারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। তাঁদের প্রচেষ্টায় ইসলামের মৌলিক শিক্ষা মুসলিম সমাজে সুসংহত হয়।</p><div class=\"h hs hs2\">২. মসজিদকেন্দ্রিক দাওয়াতি কার্যক্রম</div><p>আব্বাসি যুগে মসজিদগুলো ইসলামী দাওয়াত ও শিক্ষার অন্যতম প্রধান কেন্দ্রে পরিণত হয়। মসজিদে নিয়মিত কুরআন তিলাওয়াত, হাদিসের দরস, ফিকহ আলোচনা, ওয়াজ-নসিহত ও ধর্মীয় শিক্ষা প্রদান করা হতো। বাগদাদ, বসরা, কুফা, দামেস্ক ও অন্যান্য নগরীর মসজিদগুলোতে আলেম ও দাঈগণ মানুষকে ইসলামের শিক্ষা দিতেন। এর ফলে সাধারণ মানুষের মধ্যে ইসলামী জ্ঞান ও ধর্মীয় সচেতনতা বৃদ্ধি পায়।</p><div class=\"h hs hs2\">৩. মাদরাসা ও শিক্ষাপ্রতিষ্ঠানের মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে ইসলামী শিক্ষার প্রসারে বিভিন্ন শিক্ষাকেন্দ্র গড়ে ওঠে। মসজিদ, মক্তব, পাঠচক্র ও পরবর্তী সময়ে মাদরাসার মাধ্যমে কুরআন, হাদিস, ফিকহ, আরবি ভাষা ও অন্যান্য ইসলামী বিষয় শিক্ষা দেওয়া হতো। শিক্ষার্থীরা এসব প্রতিষ্ঠানে জ্ঞান অর্জন করে বিভিন্ন অঞ্চলে ইসলামের দাওয়াত পৌঁছে দিতেন। বিশেষ করে বাগদাদ, নিশাপুর ও অন্যান্য শহর জ্ঞানচর্চার গুরুত্বপূর্ণ কেন্দ্রে পরিণত হয়।</p><div class=\"h hs hs2\">৪. জ্ঞান-বিজ্ঞান ও অনুবাদ কার্যক্রমের মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে জ্ঞান-বিজ্ঞানের ব্যাপক উন্নতি ঘটে। খলিফা আল-মামুনের সময় বাগদাদে বাইতুল হিকমাহ বিশেষভাবে বিকশিত হয়। গ্রিক, সিরীয়, ফারসি ও ভারতীয় ভাষার বিভিন্ন গ্রন্থ আরবিতে অনুবাদ করা হয়। দর্শন, চিকিৎসাবিজ্ঞান, গণিত, জ্যোতির্বিজ্ঞান ও অন্যান্য জ্ঞানশাখার চর্চা বৃদ্ধি পায়। এ জ্ঞানচর্চা মুসলিম সমাজের বুদ্ধিবৃত্তিক বিকাশে ভূমিকা রাখে এবং যুক্তি, গবেষণা ও জ্ঞানভিত্তিক আলোচনার মাধ্যমে ইসলামের শিক্ষা তুলে ধরার সুযোগ সৃষ্টি করে।</p><div class=\"h hs hs2\">৫. বিতর্ক ও যুক্তিনির্ভর আলোচনার মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে বিভিন্ন ধর্ম, মতবাদ ও দর্শনের অনুসারীদের সঙ্গে মুসলিম আলেমদের বিতর্ক ও আলোচনা অনুষ্ঠিত হতো। এসব আলোচনায় আলেমগণ কুরআন, সুন্নাহ ও যুক্তির মাধ্যমে ইসলামের আকিদা ও বিধিবিধান ব্যাখ্যা করতেন। বিশেষ করে তাওহিদ, নবুওয়াত, আখিরাত ও ইসলামের মৌলিক বিশ্বাস সম্পর্কে বিভিন্ন প্রশ্নের উত্তর দেওয়া হতো। এ পদ্ধতির মাধ্যমে ইসলাম সম্পর্কে মানুষের ভুল ধারণা দূর করার চেষ্টা করা হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ.</div></div><p>অর্থ: তুমি মানুষকে তোমার প্রতিপালকের পথে আহ্বান করো হিকমত ও উত্তম উপদেশের মাধ্যমে এবং তাদের সঙ্গে বিতর্ক করো উত্তম পন্থায়। (সূরা আন-নাহল: ১২৫)</p><div class=\"h hs hs2\">৬. সাহিত্য, কবিতা ও লেখনীর মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে আরবি সাহিত্য, কবিতা, ইতিহাস ও ধর্মীয় গ্রন্থ রচনার ব্যাপক উন্নতি ঘটে। আলেম ও লেখকগণ ইসলামের আকিদা, নৈতিক শিক্ষা, শরিয়তের বিধান ও মুসলিম ইতিহাস নিয়ে বিভিন্ন গ্রন্থ রচনা করেন। এসব গ্রন্থের মাধ্যমে ইসলামের শিক্ষা বিভিন্ন অঞ্চলে ছড়িয়ে পড়ে। পত্রালাপ, উপদেশমূলক রচনা ও ধর্মীয় পুস্তকও দাওয়াতের গুরুত্বপূর্ণ মাধ্যম হিসেবে ব্যবহৃত হয়।</p><div class=\"h hs hs2\">৭. সুফি ও আধ্যাত্মিক সাধনার মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে সুফি সাধক ও আল্লাহভীরু ব্যক্তিরা ইসলামের নৈতিক ও আধ্যাত্মিক শিক্ষা প্রচারে গুরুত্বপূর্ণ ভূমিকা পালন করেন। তাঁরা আত্মশুদ্ধি, তাকওয়া, ইখলাস, ধৈর্য, দয়া ও মানবসেবার শিক্ষা দিতেন। তাঁদের ব্যক্তিগত চরিত্র ও উত্তম আচরণে অনেক মানুষ ইসলামের প্রতি আকৃষ্ট হতো। পরবর্তী সময়ে সুফি সাধক ও তাঁদের অনুসারীদের মাধ্যমে বিভিন্ন অঞ্চলে ইসলামের দাওয়াত বিস্তার লাভ করে।</p><div class=\"h hs hs2\">৮. ব্যবসা-বাণিজ্যের মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে মুসলিম ব্যবসায়ীরা বিভিন্ন দেশ ও অঞ্চলের সঙ্গে বাণিজ্যিক সম্পর্ক স্থাপন করেন। তাঁরা ভারত, চীন, মধ্য এশিয়া, আফ্রিকা ও অন্যান্য অঞ্চলে যাতায়াত করতেন। তাঁদের সততা, আমানতদারি, ন্যায়পরায়ণতা ও উত্তম আচরণের মাধ্যমে স্থানীয় জনগণ ইসলামের সৌন্দর্য সম্পর্কে জানতে পারে। বিশেষ করে ভারত মহাসাগরীয় বাণিজ্যপথে মুসলিম ব্যবসায়ীদের মাধ্যমে ইসলামের পরিচিতি বৃদ্ধি পায়।</p><div class=\"h hs hs2\">৯. দাঈ ও আলেমদের বিভিন্ন অঞ্চলে প্রেরণ</div><p>আব্বাসি যুগে ইসলামী জ্ঞান ও দাওয়াত প্রচারের জন্য আলেম, শিক্ষক ও দাঈগণ বিভিন্ন অঞ্চলে যাতায়াত করতেন। তাঁরা নতুন মুসলমানদের কুরআন, হাদিস, সালাত, সিয়াম ও অন্যান্য ইসলামী বিধান শিক্ষা দিতেন। বিভিন্ন অঞ্চলে ইসলামী শিক্ষার কেন্দ্র গড়ে তুলতে তাঁদের ভূমিকা ছিল গুরুত্বপূর্ণ। এভাবে দাওয়াতি কার্যক্রম স্থানীয় জনগোষ্ঠীর মধ্যে বিস্তার লাভ করে।</p><div class=\"h hs hs2\">১০. সামাজিক সেবা ও মানবকল্যাণের মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে মুসলিম সমাজে দান-সদকা, ওয়াকফ, অসহায়দের সাহায্য, চিকিৎসা ও জনকল্যাণমূলক কার্যক্রম পরিচালিত হতো। হাসপাতাল, পানির ব্যবস্থা, অতিথিশালা ও অন্যান্য জনসেবামূলক প্রতিষ্ঠান গড়ে ওঠে। এসব মানবকল্যাণমূলক কাজের মাধ্যমে ইসলামের দয়া, সহমর্মিতা ও সামাজিক দায়িত্ববোধের শিক্ষা বাস্তবে প্রকাশিত হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ.</div></div><p>অর্থ: তোমরা সৎকর্ম ও তাকওয়ার কাজে পরস্পর সহযোগিতা করো এবং পাপ ও সীমালঙ্ঘনের কাজে একে অপরকে সহযোগিতা করো না। (সূরা আল-মায়িদা: ২)</p><div class=\"h hs hs2\">১১. আন্তর্জাতিক যোগাযোগ ও পত্রালাপের মাধ্যমে দাওয়াত</div><p>আব্বাসি যুগে বিভিন্ন দেশের শাসক, জ্ঞানী ব্যক্তি ও ধর্মীয় নেতাদের সঙ্গে যোগাযোগ রক্ষা করা হতো। কূটনৈতিক সম্পর্ক, পত্রালাপ এবং জ্ঞান-বিনিময়ের মাধ্যমে ইসলামের শিক্ষা বিভিন্ন অঞ্চলে পরিচিতি লাভ করে। মুসলিম সাম্রাজ্যের বিস্তৃত যোগাযোগব্যবস্থা দাওয়াতি কার্যক্রমকে আরও সম্প্রসারিত করতে সহায়তা করে।</p><div class=\"h hs hs2\">১২. অনুবাদ ও জ্ঞানচর্চার মাধ্যমে ইসলামের বুদ্ধিবৃত্তিক পরিচিতি তুলে ধরা</div><p>আব্বাসি যুগে দর্শন, বিজ্ঞান ও চিকিৎসাবিষয়ক গ্রন্থ অনুবাদের পাশাপাশি মুসলিম পণ্ডিতগণ এসব বিষয়ে গবেষণা ও মৌলিক রচনা করেন। আল-খাওয়ারিজমি, আল-কিন্দি, আল-ফারাবি এবং অন্যান্য জ্ঞানী ব্যক্তিরা বিভিন্ন জ্ঞানশাখায় অবদান রাখেন। তাঁদের গবেষণা মুসলিম সভ্যতার বুদ্ধিবৃত্তিক বিকাশে ভূমিকা রাখে। এর মাধ্যমে মুসলিম সমাজে জ্ঞানচর্চার পরিবেশ তৈরি হয় এবং ইসলামী সভ্যতার পরিচিতি বিভিন্ন অঞ্চলে বিস্তৃত হয়।</p><div class=\"h hm\">উপসংহার</div><p>আব্বাসি যুগে ইসলামী দাওয়াহ বিভিন্ন পদ্ধতিতে বিস্তার লাভ করে। কুরআন-সুন্নাহর শিক্ষা, মসজিদ ও শিক্ষাপ্রতিষ্ঠান, জ্ঞান-বিজ্ঞান ও অনুবাদ কার্যক্রম, যুক্তিনির্ভর বিতর্ক, সাহিত্যচর্চা, সুফি সাধনা, ব্যবসা-বাণিজ্য এবং মানবকল্যাণমূলক কাজ ছিল এ যুগের দাওয়াতের উল্লেখযোগ্য মাধ্যম। এসব কার্যক্রমের ফলে বাগদাদসহ মুসলিম বিশ্বের বিভিন্ন অঞ্চল জ্ঞান, শিক্ষা ও সংস্কৃতির কেন্দ্রে পরিণত হয়। সামগ্রিকভাবে আব্বাসি যুগ ইসলামী দাওয়াহর বুদ্ধিবৃত্তিক, সাংস্কৃতিক ও শিক্ষাগত বিকাশের ইতিহাসে অত্যন্ত গুরুত্বপূর্ণ স্থান অধিকার করে আছে।</p>"], ["বর্তমান যুগে ইসলামী দাওয়াতের সফলতা লাভের উপযোগী পদ্ধতিসমূহ উল্লেখ কর।", "<div class=\"h hm\">ভূমিকা</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। মহান আল্লাহ তাআলা মানবজাতির হেদায়েতের জন্য যুগে যুগে নবী-রাসূল প্রেরণ করেছেন। তাঁদের প্রধান দায়িত্ব ছিল মানুষকে এক আল্লাহর ইবাদতের দিকে আহ্বান করা এবং সৎকর্মের নির্দেশ দেওয়া। রাসূলুল্লাহ (সা.)-এর মাধ্যমে নবুওয়াতের ধারার পরিসমাপ্তি ঘটলেও ইসলামের দাওয়াতের দায়িত্ব মুসলিম উম্মাহর ওপর অর্পিত হয়েছে। বর্তমান যুগ বিজ্ঞান, প্রযুক্তি, যোগাযোগ ও তথ্যপ্রযুক্তির যুগ। এ যুগে মানুষের চিন্তাভাবনা, জীবনযাত্রা ও যোগাযোগের মাধ্যম অনেক পরিবর্তিত হয়েছে। তাই ইসলামী দাওয়াতের সফলতার জন্য কুরআন-সুন্নাহর মূলনীতি অনুসরণের পাশাপাশি যুগোপযোগী, বাস্তবসম্মত ও কার্যকর পদ্ধতি গ্রহণ করা প্রয়োজন।</p><div class=\"h hm\">বর্তমান যুগে ইসলামী দাওয়াতের সফলতা লাভের উপযোগী পদ্ধতিসমূহ</div><div class=\"h hs hs2\">১. কুরআন ও সুন্নাহভিত্তিক দাওয়াত প্রদান</div><p>ইসলামী দাওয়াতের প্রধান ভিত্তি হলো পবিত্র কুরআন ও রাসূলুল্লাহ (সা.)-এর সুন্নাহ। তাই বর্তমান যুগে দাওয়াতের ক্ষেত্রে কুরআন ও সহিহ হাদিসের আলোকে ইসলামের সঠিক শিক্ষা তুলে ধরতে হবে। ব্যক্তিগত মতামত, কুসংস্কার ও ভিত্তিহীন বর্ণনার পরিবর্তে নির্ভরযোগ্য দলিলের মাধ্যমে মানুষকে ইসলামের প্রতি আহ্বান জানাতে হবে।</p><div class=\"h hs hs2\">২. হিকমত ও প্রজ্ঞার সঙ্গে দাওয়াত প্রদান</div><p>দাওয়াতের ক্ষেত্রে প্রজ্ঞা ও বিচক্ষণতা অত্যন্ত গুরুত্বপূর্ণ। প্রত্যেক মানুষের জ্ঞান, চিন্তাভাবনা, পরিবেশ ও মানসিক অবস্থা এক নয়। তাই ব্যক্তির অবস্থা বুঝে উপযুক্ত ভাষা ও পদ্ধতিতে ইসলামের শিক্ষা তুলে ধরতে হবে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ.</div></div><p>অর্থ: তুমি মানুষকে তোমার প্রতিপালকের পথে আহ্বান করো হিকমত ও উত্তম উপদেশের মাধ্যমে এবং তাদের সঙ্গে বিতর্ক করো উত্তম পন্থায়। (সূরা আন-নাহল: ১২৫)</p><div class=\"h hs hs2\">৩. উত্তম চরিত্র ও আদর্শের মাধ্যমে দাওয়াত</div><p>মানুষের কাছে ইসলামের সৌন্দর্য তুলে ধরার অন্যতম কার্যকর পদ্ধতি হলো নিজের জীবনে ইসলামের আদর্শ বাস্তবায়ন করা। একজন দাঈকে সত্যবাদী, আমানতদার, বিনয়ী, ধৈর্যশীল, ক্ষমাশীল ও ন্যায়পরায়ণ হতে হবে। তাঁর ব্যক্তিগত জীবন, পারিবারিক আচরণ ও সামাজিক কর্মকাণ্ডে ইসলামের সৌন্দর্য প্রকাশ পেতে হবে। কারণ অনেক সময় মানুষের কথা অপেক্ষা তার আচরণ অন্যের মনে বেশি প্রভাব সৃষ্টি করে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ.</div></div><p>অর্থ: নিশ্চয়ই আপনি মহান চরিত্রের অধিকারী। (সূরা আল-কলম: ৪)</p><div class=\"h hs hs2\">৪. আধুনিক তথ্যপ্রযুক্তির মাধ্যমে দাওয়াত প্রদান</div><p>বর্তমান যুগে ইন্টারনেট ও তথ্যপ্রযুক্তি দাওয়াতের অত্যন্ত শক্তিশালী মাধ্যম। ফেসবুক, ইউটিউব, হোয়াটসঅ্যাপ, টেলিগ্রাম, ওয়েবসাইট ও অন্যান্য সামাজিক যোগাযোগমাধ্যম ব্যবহার করে অল্প সময়ে বিপুলসংখ্যক মানুষের কাছে ইসলামের বার্তা পৌঁছানো সম্ভব। কুরআনের শিক্ষা, হাদিস, ইসলামী আলোচনা, প্রশ্নোত্তর, শিক্ষামূলক ভিডিও ও প্রবন্ধ প্রকাশের মাধ্যমে দাওয়াতের পরিধি বাড়ানো যায়। তবে এসব মাধ্যমে তথ্য প্রকাশের ক্ষেত্রে বিশুদ্ধতা ও দায়িত্বশীলতা বজায় রাখতে হবে।</p><div class=\"h hs hs2\">৫. শিক্ষাপ্রতিষ্ঠানের মাধ্যমে দাওয়াত</div><p>শিক্ষাপ্রতিষ্ঠান ইসলামী দাওয়াতের গুরুত্বপূর্ণ মাধ্যম। মক্তব, মাদরাসা, স্কুল, কলেজ ও বিশ্ববিদ্যালয়ে ইসলামের মৌলিক শিক্ষা, নৈতিকতা, মানবিক মূল্যবোধ ও জীবনবিধান সম্পর্কে জ্ঞান দেওয়ার ব্যবস্থা করতে হবে। শিক্ষার্থীদের বয়স ও জ্ঞান অনুযায়ী সহজ ভাষায় ইসলামের শিক্ষা তুলে ধরতে হবে। পাশাপাশি প্রশিক্ষিত শিক্ষক ও দাঈ তৈরি করতে হবে, যাঁরা সমাজে ইসলামের সঠিক বার্তা পৌঁছে দিতে সক্ষম হবেন।</p><div class=\"h hs hs2\">৬. গণমাধ্যম ও প্রকাশনার মাধ্যমে দাওয়াত</div><p>টেলিভিশন, রেডিও, সংবাদপত্র, ম্যাগাজিন, বই, সাময়িকী ও অনলাইন সংবাদমাধ্যমের মাধ্যমে ইসলামের শিক্ষা প্রচার করা যায়। ইসলামী ইতিহাস, নবী-রাসূলদের জীবনী, নৈতিক শিক্ষা, সামাজিক সমস্যা ও সমসাময়িক বিষয় নিয়ে গবেষণামূলক লেখা ও অনুষ্ঠান তৈরি করতে হবে। সহজবোধ্য ও আকর্ষণীয় উপস্থাপনার মাধ্যমে মানুষের কাছে ইসলামের সৌন্দর্য তুলে ধরতে হবে।</p><div class=\"h hs hs2\">৭. প্রশ্নোত্তর ও যুক্তিনির্ভর আলোচনার মাধ্যমে দাওয়াত</div><p>বর্তমান যুগের মানুষ বিভিন্ন বিষয়ে প্রশ্ন করে এবং যুক্তি ও প্রমাণের মাধ্যমে বিষয় বুঝতে চায়। তাই দাঈদের ইসলামের মৌলিক আকিদা, ইবাদত, শরিয়ত ও নৈতিকতা সম্পর্কে গভীর জ্ঞান অর্জন করতে হবে। সংশয় ও প্রশ্নের উত্তর ধৈর্য, যুক্তি ও দলিলের মাধ্যমে দিতে হবে। কারও প্রশ্নকে অবজ্ঞা করা বা তাকে অপমান করা যাবে না। বরং সুন্দর আলোচনার মাধ্যমে সত্য তুলে ধরতে হবে।</p><div class=\"h hs hs2\">৮. আন্তধর্মীয় সংলাপ ও পারস্পরিক সম্প্রীতি প্রতিষ্ঠা</div><p>বর্তমান বিশ্বে বিভিন্ন ধর্ম ও মতাদর্শের মানুষ পাশাপাশি বসবাস করে। তাই অন্য ধর্মের মানুষের সঙ্গে সৌহার্দ্যপূর্ণ সম্পর্ক বজায় রেখে ইসলামের প্রকৃত শিক্ষা তুলে ধরতে হবে। ধর্মীয় বিষয়ে আলোচনা ও সংলাপের ক্ষেত্রে শালীনতা, সহনশীলতা ও পারস্পরিক সম্মান বজায় রাখতে হবে। ইসলামের তাওহিদ, নবুওয়াত, আখিরাত ও নৈতিক শিক্ষার বিষয়গুলো যুক্তিসংগতভাবে উপস্থাপন করতে হবে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ.</div></div><p>অর্থ: আর তোমরা আহলে কিতাবের সঙ্গে উত্তম পন্থা ছাড়া বিতর্ক করো না; তবে তাদের মধ্যে যারা জুলুম করেছে, তাদের কথা স্বতন্ত্র। (সূরা আল-আনকাবুত: ৪৬)</p><div class=\"h hs hs2\">৯. সামাজিক সেবা ও মানবকল্যাণমূলক কাজের মাধ্যমে দাওয়াত</div><p>মানুষের বিপদে-আপদে পাশে দাঁড়ানো, দরিদ্রদের সাহায্য করা, অসুস্থদের চিকিৎসার ব্যবস্থা করা, এতিমদের লালন-পালন, বন্যা ও দুর্যোগে ত্রাণ বিতরণ এবং অসহায় মানুষের পুনর্বাসন ইসলামী দাওয়াতের কার্যকর মাধ্যম। এসব কাজের মাধ্যমে ইসলামের মানবিকতা, সহমর্মিতা ও ভ্রাতৃত্বের শিক্ষা বাস্তবে প্রকাশ পায়।</p><div class=\"h hs hs2\">১০. পরিবার ও সমাজভিত্তিক দাওয়াত</div><p>ইসলামী দাওয়াতের সূচনা হওয়া উচিত নিজের পরিবার থেকে। পরিবারের সদস্যদের কুরআন-সুন্নাহর শিক্ষা, সালাত, নৈতিকতা ও উত্তম আচরণের প্রতি উৎসাহিত করতে হবে। পাশাপাশি প্রতিবেশী, আত্মীয়স্বজন ও সমাজের মানুষের কাছে ইসলামের শিক্ষা পৌঁছে দিতে হবে। পারিবারিক আলোচনা, ইসলামী পাঠচক্র ও সামাজিক অনুষ্ঠানের মাধ্যমে এ কার্যক্রম পরিচালনা করা যায়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا.</div></div><p>অর্থ: হে মুমিনগণ! তোমরা নিজেদের এবং তোমাদের পরিবার-পরিজনকে আগুন থেকে রক্ষা করো। (সূরা আত-তাহরিম: ৬)</p><div class=\"h hs hs2\">১১. যুবসমাজকে দাওয়াতি কাজে সম্পৃক্ত করা</div><p>যুবসমাজ একটি দেশের গুরুত্বপূর্ণ শক্তি। তাদের মধ্যে দ্বীনি জ্ঞান, নৈতিকতা ও সামাজিক দায়িত্ববোধ সৃষ্টি করতে হবে। তরুণদের উপযোগী ভাষায় ইসলামের শিক্ষা তুলে ধরে দাওয়াতি কার্যক্রমে অংশগ্রহণের সুযোগ দিতে হবে। ইসলামী পাঠচক্র, স্বেচ্ছাসেবী সংগঠন, গবেষণা, লেখালেখি ও অনলাইন কার্যক্রমে তাদের সম্পৃক্ত করা যেতে পারে।</p><div class=\"h hs hs2\">১২. নারীদের মধ্যে দাওয়াতি কার্যক্রম পরিচালনা</div><p>সমাজের অর্ধেক জনগোষ্ঠী নারী। তাই নারীদের মধ্যে ইসলামী শিক্ষা প্রচার অত্যন্ত গুরুত্বপূর্ণ। নারীদের জন্য পৃথক শিক্ষাব্যবস্থা, কুরআন শিক্ষা, হাদিস আলোচনা, অনলাইন ক্লাস ও ইসলামী পাঠচক্রের ব্যবস্থা করতে হবে। প্রশিক্ষিত নারী দাঈ তৈরি করতে হবে, যাতে তাঁরা পরিবার ও সমাজে ইসলামের সঠিক শিক্ষা পৌঁছে দিতে পারেন।</p><div class=\"h hs hs2\">১৩. দাওয়াতি সংগঠন ও প্রতিষ্ঠান গড়ে তোলা</div><p>দাওয়াতি কার্যক্রমকে সুসংগঠিত ও ফলপ্রসূ করার জন্য যোগ্য আলেম, শিক্ষক, গবেষক ও সমাজকর্মীদের সমন্বয়ে দাওয়াতি প্রতিষ্ঠান গড়ে তুলতে হবে। এসব প্রতিষ্ঠানের মাধ্যমে পরিকল্পিতভাবে দাওয়াতি কার্যক্রম পরিচালনা, দাঈদের প্রশিক্ষণ, গবেষণা, প্রকাশনা ও জনসচেতনতামূলক কর্মসূচি গ্রহণ করা সম্ভব।</p><div class=\"h hs hs2\">১৪. ভাষাগত ও সাংস্কৃতিক বৈচিত্র্যের প্রতি গুরুত্ব প্রদান</div><p>বর্তমান বিশ্বে বিভিন্ন ভাষা ও সংস্কৃতির মানুষ বসবাস করে। তাই যে অঞ্চলে দাওয়াত দেওয়া হবে, সেখানকার মানুষের ভাষা, সংস্কৃতি, সামাজিক অবস্থা ও প্রয়োজন সম্পর্কে ধারণা রাখতে হবে। স্থানীয় ভাষায় ইসলামী বই, ভিডিও, ওয়েবসাইট ও শিক্ষামূলক উপকরণ তৈরি করতে হবে। এতে মানুষ সহজে ইসলামের শিক্ষা বুঝতে পারবে।</p><div class=\"h hs hs2\">১৫. ধৈর্য, সহনশীলতা ও ধারাবাহিকতা বজায় রাখা</div><p>দাওয়াতি কার্যক্রমে সব সময় দ্রুত সফলতা আসে না। অনেক সময় মানুষ বিরোধিতা করে, ভুল বোঝে অথবা দাওয়াত গ্রহণ করতে দেরি করে। তাই দাঈকে ধৈর্যশীল, সহনশীল ও অবিচল থাকতে হবে। কাউকে জোর করে ইসলামের পথে আনা যাবে না; বরং সুন্দর উপদেশ, যুক্তি ও উত্তম আচরণের মাধ্যমে সত্যের প্রতি আহ্বান জানাতে হবে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ وَلَا يَسْتَخِفَّنَّكَ الَّذِينَ لَا يُوقِنُونَ.</div></div><p>অর্থ: সুতরাং তুমি ধৈর্য ধারণ করো। নিশ্চয়ই আল্লাহর প্রতিশ্রুতি সত্য। যারা দৃঢ় বিশ্বাসী নয়, তারা যেন তোমাকে বিচলিত করতে না পারে। (সূরা আর-রূম: ৬০)</p><div class=\"h hm\">উপসংহার</div><p>বর্তমান যুগে ইসলামী দাওয়াতের সফলতার জন্য কুরআন-সুন্নাহভিত্তিক জ্ঞান, হিকমত, উত্তম চরিত্র, আধুনিক প্রযুক্তির ব্যবহার, শিক্ষাপ্রতিষ্ঠান, গণমাধ্যম, সামাজিক সেবা এবং সুসংগঠিত দাওয়াতি কার্যক্রম অত্যন্ত প্রয়োজনীয়। দাঈদের যুগের চাহিদা অনুযায়ী নিজেদের জ্ঞান ও দক্ষতা বৃদ্ধি করতে হবে। একই সঙ্গে ইসলামের মূলনীতি ও আদর্শের সঙ্গে কোনো আপস করা যাবে না। সর্বোপরি, আন্তরিকতা, ধৈর্য, প্রজ্ঞা ও উত্তম আচরণের মাধ্যমে মানুষের কাছে ইসলামের প্রকৃত সৌন্দর্য তুলে ধরতে পারলেই বর্তমান যুগে ইসলামী দাওয়াত সফলতা লাভ করবে।</p>"], ["হযরত ইবরাহিম (আ.)-এর জীবনী লেখ। অতঃপর তাঁর দাওয়াতের পদ্ধতি লিপিবদ্ধ কর।", "<div class=\"h hm\">ভূমিকা</div><p>হযরত ইবরাহিম (আ.) ছিলেন মহান আল্লাহর প্রেরিত একজন মর্যাদাবান নবী ও রাসূল। তিনি তাওহিদের দাওয়াত প্রচার, শিরক ও মূর্তিপূজার বিরুদ্ধে সংগ্রাম এবং আল্লাহর প্রতি পূর্ণ আত্মসমর্পণের জন্য ইতিহাসে অমর হয়ে আছেন। তাঁর পিতা ও নিজ সম্প্রদায়ের লোকেরা মূর্তিপূজায় লিপ্ত ছিল। তিনি তাঁদেরকে এক আল্লাহর ইবাদতের আহ্বান জানান এবং যুক্তি, প্রজ্ঞা, উত্তম উপদেশ ও বাস্তব দৃষ্টান্তের মাধ্যমে শিরকের অসারতা তুলে ধরেন। এজন্য তাঁকে ‘খলিলুল্লাহ’ বা আল্লাহর বন্ধু বলা হয়। তাঁর জীবন ও দাওয়াতি কার্যক্রম পরবর্তী নবী-রাসূল এবং সমগ্র মানবজাতির জন্য গুরুত্বপূর্ণ আদর্শ।</p><div class=\"h hm\">হযরত ইবরাহিম (আ.)-এর সংক্ষিপ্ত জীবনী</div><div class=\"h hs hs2\">১. জন্ম ও বংশপরিচয়</div><p>হযরত ইবরাহিম (আ.) প্রাচীন ব্যাবিলনীয় অঞ্চলে জন্মগ্রহণ করেন বলে ঐতিহাসিকভাবে উল্লেখ করা হয়। তাঁর পিতার নাম আযর। তিনি এমন এক সমাজে জন্মগ্রহণ করেন, যেখানে মানুষ মূর্তি, নক্ষত্র, চন্দ্র ও সূর্যের উপাসনা করত। তাঁর পিতা নিজেও মূর্তিপূজার সঙ্গে জড়িত ছিলেন। কিন্তু আল্লাহ তাআলা শৈশব থেকেই ইবরাহিম (আ.)-কে সঠিক পথের সন্ধান দান করেন এবং তাঁকে তাওহিদের মহান দায়িত্ব পালনের জন্য মনোনীত করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ آتَيْنَا إِبْرَاهِيمَ رُشْدَهُ مِنْ قَبْلُ وَكُنَّا بِهِ عَالِمِينَ.</div></div><p>অর্থ: আর অবশ্যই আমি ইবরাহিমকে পূর্বেই সঠিক পথের জ্ঞান দান করেছিলাম এবং আমি তাঁর সম্পর্কে সম্যক অবগত ছিলাম। (সূরা আল-আম্বিয়া: ৫১)</p><div class=\"h hs hs2\">২. নবুওয়াত লাভ</div><p>আল্লাহ তাআলা হযরত ইবরাহিম (আ.)-কে নবুওয়াত দান করেন এবং মানুষকে এক আল্লাহর ইবাদতের দিকে আহ্বান করার দায়িত্ব প্রদান করেন। তিনি তাঁর সম্প্রদায়ের কাছে তাওহিদের বাণী প্রচার করেন এবং মূর্তিপূজা, শিরক ও কুসংস্কারের বিরুদ্ধে সংগ্রাম শুরু করেন। তিনি মানুষকে বুঝিয়ে দেন যে, একমাত্র আল্লাহই সৃষ্টিকর্তা, পালনকর্তা ও ইবাদতের যোগ্য।</p><div class=\"h hs hs2\">৩. পিতা ও সম্প্রদায়ের কাছে দাওয়াত প্রদান</div><p>হযরত ইবরাহিম (আ.) সর্বপ্রথম নিজের পিতাকে ইসলামের দাওয়াত দেন। তিনি অত্যন্ত বিনয় ও সম্মানের সঙ্গে পিতাকে মূর্তিপূজা পরিত্যাগ করে এক আল্লাহর ইবাদত করার আহ্বান জানান। কিন্তু তাঁর পিতা এ দাওয়াত গ্রহণ না করে তাঁকে হুমকি দেন এবং নিজের কাছ থেকে দূরে চলে যেতে বলেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِذْ قَالَ لِأَبِيهِ يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ شَيْئًا.</div></div><p>অর্থ: স্মরণ করো, যখন তিনি তাঁর পিতাকে বলেছিলেন, হে আমার পিতা! আপনি এমন কিছুর ইবাদত করেন কেন, যা শুনতে পায় না, দেখতে পায় না এবং আপনার কোনো উপকারও করতে পারে না? (সূরা মারইয়াম: ৪২)</p><div class=\"h hs hs2\">৪. মূর্তিপূজার বিরুদ্ধে প্রতিবাদ</div><p>হযরত ইবরাহিম (আ.)-এর সম্প্রদায়ের লোকেরা বিভিন্ন মূর্তির পূজা করত। তিনি তাদের বোঝানোর চেষ্টা করেন যে, যেসব মূর্তি নিজেরা কথা বলতে পারে না, নিজেদের উপকার বা ক্ষতি করতে পারে না, সেগুলো কখনো উপাস্য হতে পারে না।</p><p>একদিন তাঁর সম্প্রদায়ের লোকেরা উৎসবে বাইরে গেলে তিনি তাদের মূর্তিগুলোর কাছে যান এবং প্রধান মূর্তিটি ছাড়া অন্য মূর্তিগুলো ভেঙে ফেলেন। পরে সম্প্রদায়ের লোকেরা ফিরে এসে এ ঘটনা জানতে চাইলে তিনি তাদের সামনে মূর্তিপূজার অসারতা তুলে ধরেন।</p><div class=\"h hs hs2\">৫. নমরুদের সঙ্গে বিতর্ক</div><p>হযরত ইবরাহিম (আ.)-এর দাওয়াতের বিরোধিতা করেছিল তৎকালীন অত্যাচারী শাসক নমরুদ। সে আল্লাহর অস্তিত্ব ও ক্ষমতা নিয়ে অহংকারপূর্ণ বিতর্কে লিপ্ত হয়। ইবরাহিম (আ.) তাকে বোঝান যে, আল্লাহ সূর্যকে পূর্ব দিক থেকে উদিত করেন; সুতরাং সে যেন সূর্যকে পশ্চিম দিক থেকে উদিত করে দেখায়। এতে নমরুদ নিরুত্তর হয়ে যায়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَلَمْ تَرَ إِلَى الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ إِذْ قَالَ إِبْرَاهِيمُ رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ قَالَ أَنَا أُحْيِي وَأُمِيتُ قَالَ إِبْرَاهِيمُ فَإِنَّ اللَّهَ يَأْتِي بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ فَبُهِتَ الَّذِي كَفَرَ.</div></div><p>অর্থ: তুমি কি সেই ব্যক্তির কথা জানো না, যে ইবরাহিমের সঙ্গে তাঁর প্রতিপালক সম্পর্কে বিতর্ক করেছিল, কারণ আল্লাহ তাকে রাজত্ব দান করেছিলেন? যখন ইবরাহিম বললেন, আমার প্রতিপালক জীবন দান করেন এবং মৃত্যু ঘটান। সে বলল, আমিও জীবন দান করি ও মৃত্যু ঘটাই। ইবরাহিম বললেন, নিশ্চয়ই আল্লাহ সূর্যকে পূর্ব দিক থেকে উদিত করেন, তুমি তা পশ্চিম দিক থেকে উদিত করো। তখন কাফির ব্যক্তি হতবুদ্ধি হয়ে গেল। (সূরা আল-বাকারা: ২৫৮)</p><div class=\"h hs hs2\">৬. অগ্নিকুণ্ডে নিক্ষেপ ও আল্লাহর সাহায্য লাভ</div><p>হযরত ইবরাহিম (আ.) মূর্তিপূজার বিরুদ্ধে প্রতিবাদ করায় তাঁর সম্প্রদায়ের লোকেরা ক্ষিপ্ত হয়ে ওঠে। তারা তাঁকে আগুনে নিক্ষেপ করার সিদ্ধান্ত নেয়। বিশাল অগ্নিকুণ্ড তৈরি করে তাঁকে তাতে নিক্ষেপ করা হয়। কিন্তু মহান আল্লাহর নির্দেশে আগুন তাঁর জন্য শীতল ও নিরাপদ হয়ে যায়। ফলে তিনি সম্পূর্ণ নিরাপদে রক্ষা পান।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ.</div></div><p>অর্থ: আমি বললাম, হে আগুন! তুমি ইবরাহিমের জন্য শীতল ও নিরাপদ হয়ে যাও। (সূরা আল-আম্বিয়া: ৬৯)</p><div class=\"h hs hs2\">৭. হিজরত ও আল্লাহর পথে আত্মত্যাগ</div><p>নিজ সম্প্রদায়ের বিরোধিতা ও নির্যাতনের কারণে হযরত ইবরাহিম (আ.) আল্লাহর নির্দেশে হিজরত করেন। তিনি আল্লাহর সন্তুষ্টির জন্য নিজের জন্মভূমি ত্যাগ করেন এবং অন্য অঞ্চলে গমন করেন। তাঁর সঙ্গে তাঁর স্ত্রী সারাহ (আ.) এবং ভাতিজা হযরত লূত (আ.)-এর সম্পর্কিত ঘটনাও ইসলামের ইতিহাসে উল্লেখযোগ্য। তিনি জীবনের প্রতিটি ক্ষেত্রে আল্লাহর নির্দেশের প্রতি আনুগত্য প্রকাশ করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقَالَ إِنِّي مُهَاجِرٌ إِلَىٰ رَبِّي إِنَّهُ هُوَ الْعَزِيزُ الْحَكِيمُ.</div></div><p>অর্থ: আর তিনি বলেছিলেন, নিশ্চয়ই আমি আমার প্রতিপালকের উদ্দেশ্যে হিজরত করছি। নিশ্চয়ই তিনি পরাক্রমশালী, প্রজ্ঞাময়। (সূরা আল-আনকাবুত: ২৬)</p><div class=\"h hs hs2\">৮. হযরত ইসমাইল (আ.)-এর জন্ম ও কাবা নির্মাণ</div><p>হযরত ইবরাহিম (আ.)-এর জীবনে অন্যতম গুরুত্বপূর্ণ ঘটনা হলো তাঁর পুত্র হযরত ইসমাইল (আ.)-এর জন্ম। আল্লাহর নির্দেশে তিনি স্ত্রী হাজেরা (আ.) ও শিশুপুত্র ইসমাইল (আ.)-কে মক্কার জনমানবহীন উপত্যকায় রেখে আসেন। পরবর্তী সময়ে সেখানে জমজম কূপের সৃষ্টি হয় এবং জনবসতি গড়ে ওঠে।</p><p>পরবর্তীকালে আল্লাহর নির্দেশে হযরত ইবরাহিম (আ.) ও তাঁর পুত্র ইসমাইল (আ.) পবিত্র কাবাঘর নির্মাণ করেন। তাঁরা কাবাঘর নির্মাণের সময় আল্লাহর কাছে তাঁদের আমল কবুল করার জন্য দোয়া করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ.</div></div><p>অর্থ: আর স্মরণ করো, যখন ইবরাহিম ও ইসমাইল কাবাঘরের ভিত্তি উঁচু করছিলেন এবং বলছিলেন, হে আমাদের প্রতিপালক! আমাদের পক্ষ থেকে কবুল করুন। নিশ্চয়ই আপনি সর্বশ্রোতা, সর্বজ্ঞ। (সূরা আল-বাকারা: ১২৭)</p><div class=\"h hs hs2\">৯. পুত্রকে কোরবানির পরীক্ষা</div><p>হযরত ইবরাহিম (আ.)-এর জীবনে সবচেয়ে কঠিন পরীক্ষাগুলোর একটি ছিল স্বপ্নে নিজের প্রিয় পুত্রকে কোরবানি করার নির্দেশ পাওয়া। তিনি স্বপ্নের কথা পুত্র ইসমাইল (আ.)-কে জানালে তিনিও আল্লাহর নির্দেশ পালনে সম্মতি দেন। তাঁরা উভয়েই আল্লাহর প্রতি পূর্ণ আনুগত্য প্রকাশ করেন। তখন আল্লাহ তাআলা ইসমাইল (আ.)-এর পরিবর্তে একটি পশু কোরবানি করার ব্যবস্থা করেন। এ ঘটনার মাধ্যমে পিতা-পুত্রের ঈমান, আনুগত্য ও আত্মত্যাগের অনন্য দৃষ্টান্ত প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">১০. খলিলুল্লাহ উপাধি লাভ</div><p>হযরত ইবরাহিম (আ.) আল্লাহর প্রতি গভীর ভালোবাসা, আনুগত্য ও আত্মত্যাগের কারণে ‘খলিলুল্লাহ’ উপাধিতে ভূষিত হন। এর অর্থ আল্লাহর ঘনিষ্ঠ বন্ধু। আল্লাহ তাআলা তাঁকে বিশেষ মর্যাদা দান করেন এবং মানবজাতির জন্য আদর্শ হিসেবে প্রতিষ্ঠিত করেন।</p><div class=\"h hm\">হযরত ইবরাহিম (আ.)-এর দাওয়াতের পদ্ধতি</div><div class=\"h hs hs2\">১. তাওহিদের দাওয়াত প্রদান</div><p>হযরত ইবরাহিম (আ.)-এর দাওয়াতের মূল বিষয় ছিল তাওহিদ বা এক আল্লাহর ইবাদত। তিনি মানুষকে মূর্তিপূজা ও শিরক পরিত্যাগ করে একমাত্র সৃষ্টিকর্তা আল্লাহর ইবাদত করার আহ্বান জানান। তিনি তাঁর পিতা ও সম্প্রদায়কে বোঝান যে, আল্লাহ ছাড়া অন্য কেউ ইবাদতের যোগ্য নয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ.</div></div><p>অর্থ: আর অবশ্যই আমি প্রত্যেক জাতির মধ্যে রাসূল পাঠিয়েছি এ নির্দেশ দিয়ে যে, তোমরা আল্লাহর ইবাদত করো এবং তাগুতকে বর্জন করো। (সূরা আন-নাহল: ৩৬)</p><div class=\"h hs hs2\">২. পরিবার থেকে দাওয়াতের সূচনা</div><p>হযরত ইবরাহিম (আ.) নিজের পিতা আযরকে প্রথমে দাওয়াত দেন। তিনি পিতার সঙ্গে অত্যন্ত বিনয় ও সম্মানের সঙ্গে কথা বলতেন। বারবার ‘ইয়া আবাতি’ অর্থাৎ ‘হে আমার পিতা’ বলে সম্বোধন করে তাঁকে মূর্তিপূজা থেকে বিরত থাকার আহ্বান জানান। এতে বোঝা যায়, দাওয়াতের ক্ষেত্রে পরিবারের সদস্যদের অগ্রাধিকার দেওয়া এবং তাদের সঙ্গে সুন্দর আচরণ করা অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hs hs2\">৩. যুক্তি ও প্রমাণের মাধ্যমে দাওয়াত</div><p>হযরত ইবরাহিম (আ.) তাঁর সম্প্রদায়ের সামনে যুক্তি ও প্রমাণের মাধ্যমে আল্লাহর অস্তিত্ব ও একত্ববাদ তুলে ধরেন। তিনি নক্ষত্র, চন্দ্র ও সূর্যের উদয়-অস্তের বিষয়টি উল্লেখ করে বুঝিয়ে দেন যে, যেসব বস্তু অস্ত যায় ও পরিবর্তিত হয়, সেগুলো কখনো উপাস্য হতে পারে না। প্রকৃত উপাস্য হলেন সেই সত্তা, যিনি সমগ্র বিশ্বজগতের সৃষ্টিকর্তা ও নিয়ন্ত্রক।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَمَّا جَنَّ عَلَيْهِ اللَّيْلُ رَأَىٰ كَوْكَبًا قَالَ هَٰذَا رَبِّي فَلَمَّا أَفَلَ قَالَ لَا أُحِبُّ الْآفِلِينَ.</div></div><p>অর্থ: অতঃপর যখন রাতের অন্ধকার তাকে আচ্ছন্ন করল, তখন সে একটি নক্ষত্র দেখে বলল, এটি আমার প্রতিপালক। পরে যখন তা অস্ত গেল, তখন সে বলল, যারা অস্ত যায়, আমি তাদের ভালোবাসি না। (সূরা আল-আনআম: ৭৬)</p><p>এভাবে তিনি যুক্তির মাধ্যমে মানুষকে চিন্তা করতে এবং সত্য উপলব্ধি করতে উদ্বুদ্ধ করেন।</p><div class=\"h hs hs2\">৪. প্রশ্নের মাধ্যমে ভুল বিশ্বাসের অসারতা প্রকাশ</div><p>হযরত ইবরাহিম (আ.) মানুষের প্রচলিত বিশ্বাসকে প্রশ্নের মাধ্যমে যাচাই করতে উৎসাহিত করতেন। তিনি মূর্তিপূজারিদের জিজ্ঞাসা করেন, তারা যেসব মূর্তির পূজা করে, সেগুলো কি তাদের কথা শুনতে পায়, উপকার করতে পারে কিংবা ক্ষতি করতে পারে? এ প্রশ্নের মাধ্যমে তিনি তাদের বিশ্বাসের দুর্বলতা প্রকাশ করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَا هَٰذِهِ التَّمَاثِيلُ الَّتِي أَنْتُمْ لَهَا عَاكِفُونَ.</div></div><p>অর্থ: স্মরণ করো, যখন তিনি তাঁর পিতা ও সম্প্রদায়কে বলেছিলেন, এসব মূর্তি কী, যেগুলোর পূজায় তোমরা নিবিষ্ট হয়ে আছ? (সূরা আল-আম্বিয়া: ৫২)</p><div class=\"h hs hs2\">৫. বাস্তব উদাহরণের মাধ্যমে দাওয়াত</div><p>হযরত ইবরাহিম (আ.) শুধু কথার মাধ্যমে দাওয়াত দেননি; বরং বাস্তব উদাহরণও উপস্থাপন করেছেন। মূর্তিগুলো ভেঙে দিয়ে তিনি তাদের সামনে মূর্তিপূজার অসারতা প্রকাশ করেন। এরপর প্রধান মূর্তিটিকে রেখে তাদের প্রশ্ন করেন, যদি মূর্তিগুলো কথা বলতে পারে, তবে বড় মূর্তিটিকে জিজ্ঞাসা করো। এর মাধ্যমে তিনি তাদের নিজেদের বিশ্বাস নিয়ে চিন্তা করতে বাধ্য করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ بَلْ فَعَلَهُ كَبِيرُهُمْ هَٰذَا فَاسْأَلُوهُمْ إِنْ كَانُوا يَنْطِقُونَ.</div></div><p>অর্থ: তিনি বললেন, বরং এদের এ বড়টিই এ কাজ করেছে। সুতরাং এদের জিজ্ঞাসা করো, যদি তারা কথা বলতে পারে। (সূরা আল-আম্বিয়া: ৬৩)</p><div class=\"h hs hs2\">৬. শাসক ও ক্ষমতাবানদের কাছে দাওয়াত প্রদান</div><p>হযরত ইবরাহিম (আ.) তৎকালীন শাসক নমরুদের কাছেও তাওহিদের দাওয়াত পৌঁছে দেন। তিনি ক্ষমতাবান ব্যক্তির সামনে সত্য কথা বলতে ভয় পাননি। যুক্তির মাধ্যমে নমরুদের অহংকার ও মিথ্যা দাবিকে খণ্ডন করেন। এর মাধ্যমে বোঝা যায়, দাওয়াতের দায়িত্ব শুধু সাধারণ মানুষের মধ্যে সীমাবদ্ধ নয়; বরং সমাজের নেতৃত্বস্থানীয় ব্যক্তিদের কাছেও সত্যের বার্তা পৌঁছে দিতে হবে।</p><div class=\"h hs hs2\">৭. ধৈর্য ও সহনশীলতার মাধ্যমে দাওয়াত</div><p>হযরত ইবরাহিম (আ.) তাঁর দাওয়াতের পথে অসংখ্য বাধা ও নির্যাতনের সম্মুখীন হন। তাঁর পিতা তাঁকে প্রত্যাখ্যান করেন, সম্প্রদায়ের লোকেরা বিরোধিতা করে এবং তাঁকে আগুনে নিক্ষেপ করে। কিন্তু তিনি দাওয়াতের দায়িত্ব থেকে পিছিয়ে যাননি। বরং ধৈর্য ও দৃঢ়তার সঙ্গে আল্লাহর পথে অবিচল থাকেন। এ থেকে শিক্ষা পাওয়া যায়, দাওয়াতের কাজে সফল হতে হলে ধৈর্য ও সহনশীলতা অপরিহার্য।</p><div class=\"h hs hs2\">৮. উত্তম ভাষা ও ভদ্র আচরণের মাধ্যমে দাওয়াত</div><p>হযরত ইবরাহিম (আ.) তাঁর পিতার বিরোধিতা সত্ত্বেও তাঁর সঙ্গে সম্মানজনক ভাষায় কথা বলেছেন। তিনি পিতাকে অপমান বা গালিগালাজ করেননি। বরং ভালোবাসা ও আন্তরিকতার সঙ্গে সত্যের দিকে আহ্বান জানিয়েছেন। এতে প্রমাণিত হয়, দাওয়াতের ক্ষেত্রে ভাষা ও আচরণের সৌন্দর্য অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hs hs2\">৯. হিজরত ও আত্মত্যাগের মাধ্যমে দাওয়াত</div><p>নিজ সম্প্রদায়ের বিরোধিতা ও নির্যাতনের কারণে হযরত ইবরাহিম (আ.) আল্লাহর নির্দেশে হিজরত করেন। তিনি নিজের জন্মভূমি, পরিবার ও পরিচিত পরিবেশ ছেড়ে আল্লাহর দ্বীনের জন্য নতুন স্থানে গমন করেন। এর মাধ্যমে তিনি দেখিয়েছেন যে, দ্বীনের দাওয়াত ও আল্লাহর সন্তুষ্টির জন্য প্রয়োজনে ব্যক্তিগত স্বার্থ ও আরাম-আয়েশ ত্যাগ করতে হয়।</p><div class=\"h hs hs2\">১০. পরিবার ও ভবিষ্যৎ প্রজন্মের মধ্যে দাওয়াতের ব্যবস্থা</div><p>হযরত ইবরাহিম (আ.) শুধু নিজের যুগের মানুষকে দাওয়াত দেননি; বরং ভবিষ্যৎ প্রজন্মের হেদায়েতের জন্যও দোয়া করেছেন। তিনি নিজের সন্তানদের মধ্যে সালাত প্রতিষ্ঠা, তাওহিদ ও দ্বীনি আদর্শ বজায় রাখার জন্য আল্লাহর কাছে প্রার্থনা করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ.</div></div><p>অর্থ: হে আমার প্রতিপালক! আমাকে সালাত প্রতিষ্ঠাকারী বানান এবং আমার বংশধরদের মধ্য থেকেও। হে আমাদের প্রতিপালক! আমার দোয়া কবুল করুন। (সূরা ইবরাহিম: ৪০)</p><div class=\"h hs hs2\">১১. দোয়ার মাধ্যমে দাওয়াতি কার্যক্রমকে শক্তিশালী করা</div><p>হযরত ইবরাহিম (আ.) দাওয়াতি কার্যক্রমের পাশাপাশি আল্লাহর কাছে সাহায্য প্রার্থনা করতেন। তিনি নিজের ও সন্তানদের ঈমান, ইবাদত এবং ভবিষ্যৎ বংশধরদের হেদায়েতের জন্য দোয়া করতেন। তিনি মক্কাকে নিরাপদ নগরী হিসেবে প্রতিষ্ঠা এবং সেখানকার অধিবাসীদের জন্য রিজিকের ব্যবস্থা করার দোয়াও করেন। এ থেকে বোঝা যায়, দাওয়াতের কাজে প্রচেষ্টার পাশাপাশি আল্লাহর কাছে সাহায্য চাওয়া জরুরি।</p><div class=\"h hm\">উপসংহার</div><p>হযরত ইবরাহিম (আ.)-এর জীবন ছিল তাওহিদ, আত্মত্যাগ, ধৈর্য, সাহসিকতা ও আল্লাহর প্রতি পূর্ণ আনুগত্যের অনন্য দৃষ্টান্ত। তিনি পিতা, পরিবার, সম্প্রদায় ও শাসক—সবার কাছে ইসলামের দাওয়াত পৌঁছে দিয়েছেন। তাঁর দাওয়াতের পদ্ধতিতে যুক্তি, প্রমাণ, প্রশ্ন, বাস্তব উদাহরণ, উত্তম আচরণ, ধৈর্য ও দোয়ার সমন্বয় দেখা যায়। তিনি প্রতিকূল পরিস্থিতিতেও সত্যের পথে অবিচল ছিলেন। তাই বর্তমান যুগের দাঈদের জন্য তাঁর জীবন ও দাওয়াতি পদ্ধতি অনুসরণ করা অত্যন্ত গুরুত্বপূর্ণ। তাঁর আদর্শ অনুসরণ করে প্রজ্ঞা, আন্তরিকতা ও উত্তম চরিত্রের মাধ্যমে মানুষের কাছে ইসলামের প্রকৃত শিক্ষা পৌঁছে দেওয়া সম্ভব।</p>"], ["রাসূল (সা.)-এর দাওয়াতি জীবনে যেসব প্রতিবন্ধকতার মুখোমুখি হয়েছিলেন, তা বিস্তারিত আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>হযরত মুহাম্মদ (সা.) ছিলেন মহান আল্লাহর সর্বশেষ নবী ও রাসূল। তিনি সমগ্র মানবজাতির হেদায়েতের জন্য প্রেরিত হয়েছিলেন। নবুওয়াত লাভের পর তিনি মানুষকে তাওহিদ, ন্যায়বিচার, মানবতা ও পরকালীন মুক্তির দিকে আহ্বান জানান। কিন্তু তাঁর দাওয়াতি জীবন মোটেও সহজ ছিল না। মক্কার মুশরিকদের বিরোধিতা, পারিবারিক ও সামাজিক চাপ, শারীরিক নির্যাতন, অর্থনৈতিক অবরোধ, হত্যার ষড়যন্ত্র, মুনাফিকদের চক্রান্ত এবং বিভিন্ন যুদ্ধ ও সংঘাতের মতো অসংখ্য প্রতিবন্ধকতার সম্মুখীন হতে হয়েছিল তাঁকে। এত বাধা-বিপত্তির মধ্যেও তিনি ধৈর্য, সাহস, প্রজ্ঞা ও আল্লাহর ওপর পূর্ণ আস্থা রেখে দাওয়াতের কাজ অব্যাহত রাখেন।</p><p>রাসূলুল্লাহ (সা.)-এর দাওয়াতি জীবনের প্রতিবন্ধকতাসমূহ</p><div class=\"h hs hs2\">১. মক্কার মুশরিকদের বিরোধিতা</div><p>রাসূলুল্লাহ (সা.) যখন মানুষকে এক আল্লাহর ইবাদতের আহ্বান জানান, তখন মক্কার মুশরিক নেতারা তাঁর বিরোধিতা শুরু করে। কারণ তাদের সমাজে মূর্তিপূজা, কুসংস্কার ও গোত্রীয় অহংকার প্রচলিত ছিল। রাসূলুল্লাহ (সা.) এসব অন্যায়ের বিরুদ্ধে কথা বলায় তারা নিজেদের ধর্মীয় ও সামাজিক অবস্থান হুমকির মুখে পড়েছে বলে মনে করে। ফলে তারা তাঁর দাওয়াত গ্রহণ না করে বিভিন্নভাবে বাধা সৃষ্টি করে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذَا رَآكَ الَّذِينَ كَفَرُوا إِنْ يَتَّخِذُونَكَ إِلَّا هُزُوًا أَهَٰذَا الَّذِي يَذْكُرُ آلِهَتَكُمْ وَهُمْ بِذِكْرِ الرَّحْمَٰنِ هُمْ كَافِرُونَ.</div></div><p>অর্থ: আর কাফিররা যখন তোমাকে দেখে, তখন তারা তোমাকে কেবল উপহাসের পাত্র হিসেবেই গ্রহণ করে। তারা বলে, এই কি সেই ব্যক্তি, যে তোমাদের উপাস্যদের সমালোচনা করে? অথচ তারা নিজেরাই রহমানের স্মরণ অস্বীকার করে। (সূরা আল-আম্বিয়া: ৩৬)</p><div class=\"h hs hs2\">২. মিথ্যা অপবাদ ও অপপ্রচার</div><p>মক্কার কাফিররা রাসূলুল্লাহ (সা.)-এর দাওয়াতকে বাধাগ্রস্ত করার জন্য তাঁর বিরুদ্ধে বিভিন্ন মিথ্যা অপবাদ প্রচার করত। কখনো তাঁকে জাদুকর, কখনো কবি, কখনো গণক এবং কখনো পাগল বলে আখ্যায়িত করত। তারা সাধারণ মানুষের কাছে তাঁর সম্পর্কে ভুল ধারণা সৃষ্টি করার চেষ্টা করত, যাতে মানুষ তাঁর কথা শুনতে আগ্রহী না হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقَالُوا يَا أَيُّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْرُ إِنَّكَ لَمَجْنُونٌ.</div></div><p>অর্থ: তারা বলত, হে সেই ব্যক্তি, যার ওপর উপদেশবাণী অবতীর্ণ হয়েছে! নিশ্চয়ই তুমি একজন পাগল। (সূরা আল-হিজর: ৬)</p><div class=\"h hs hs2\">৩. শারীরিক নির্যাতন ও অত্যাচার</div><p>রাসূলুল্লাহ (সা.)-এর দাওয়াতের বিরোধিতা করতে গিয়ে কাফিররা তাঁকে শারীরিকভাবে নির্যাতন করত। একবার তিনি কাবাঘরের কাছে সালাত আদায় করার সময় আবু জাহল ও তার সহযোগীরা তাঁকে কষ্ট দেওয়ার চেষ্টা করে। আবার একবার সিজদারত অবস্থায় তাঁর পিঠের ওপর উটের নাড়িভুঁড়ি চাপিয়ে দেওয়া হয়। এসব নির্যাতনের উদ্দেশ্য ছিল তাঁকে দাওয়াতের কাজ থেকে বিরত রাখা।</p><p>তাঁর সাহাবিরাও ভয়াবহ নির্যাতনের শিকার হন। হযরত বিলাল (রা.)-কে উত্তপ্ত বালুর ওপর শুইয়ে বুকের ওপর ভারী পাথর চাপা দেওয়া হতো। হযরত খাব্বাব (রা.)-কেও নির্যাতন করা হতো। হযরত ইয়াসির (রা.) ও তাঁর স্ত্রী সুমাইয়া (রা.) নির্যাতনের শিকার হন। সুমাইয়া (রা.) ইসলামের প্রথম শহিদ হিসেবে পরিচিত।</p><div class=\"h hs hs2\">৪. সামাজিক ও পারিবারিক চাপ সৃষ্টি</div><p>মক্কার নেতারা রাসূলুল্লাহ (সা.)-এর দাওয়াত বন্ধ করার জন্য তাঁর পরিবার ও আত্মীয়স্বজনের ওপর চাপ সৃষ্টি করত। তারা তাঁর চাচা আবু তালিবকে বিভিন্নভাবে বোঝানোর চেষ্টা করে, যেন তিনি রাসূলুল্লাহ (সা.)-কে দাওয়াতের কাজ থেকে বিরত রাখেন। তারা কখনো সম্পদ, ক্ষমতা ও নেতৃত্বের প্রলোভন দেখায়, আবার কখনো কঠোর হুমকি প্রদান করে।</p><p>কিন্তু আবু তালিব জীবনের শেষ পর্যন্ত তাঁকে সামাজিকভাবে সহযোগিতা ও সুরক্ষা দিয়ে যান। রাসূলুল্লাহ (সা.) নিজেও আত্মীয়স্বজনের বিরোধিতা সত্ত্বেও দাওয়াতের কাজ চালিয়ে যান।</p><div class=\"h hs hs2\">৫. অর্থনৈতিক ও সামাজিক অবরোধ</div><p>মক্কার কুরাইশ নেতারা রাসূলুল্লাহ (সা.), তাঁর পরিবার ও মুসলমানদের ওপর সামাজিক ও অর্থনৈতিক অবরোধ আরোপ করে। তাঁরা বনি হাশিম ও বনি মুত্তালিবের সঙ্গে বিবাহ, ক্রয়-বিক্রয় ও সামাজিক যোগাযোগ বন্ধ রাখার সিদ্ধান্ত নেয়। ফলে মুসলমানদের পাশাপাশি রাসূলুল্লাহ (সা.)-এর পরিবারও ভয়াবহ খাদ্যসংকট ও কষ্টের সম্মুখীন হয়।</p><p>এ অবরোধ প্রায় তিন বছর স্থায়ী হয়েছিল। এ সময় মুসলমানদের অনেকেই খাদ্যাভাব ও অভাব-অনটনের মধ্যে জীবনযাপন করেন। কিন্তু তাঁরা ঈমান ও দাওয়াতের কাজ থেকে বিচ্যুত হননি।</p><div class=\"h hs hs2\">৬. হত্যার ষড়যন্ত্র</div><p>রাসূলুল্লাহ (সা.)-এর দাওয়াত বন্ধ করতে না পেরে মক্কার নেতারা তাঁকে হত্যা করার পরিকল্পনা করে। তারা বিভিন্ন গোত্রের একজন করে যুবক নির্বাচন করে সম্মিলিতভাবে তাঁকে আক্রমণ করার সিদ্ধান্ত নেয়, যাতে হত্যার দায় কোনো একক গোত্রের ওপর না পড়ে।</p><p>কিন্তু আল্লাহ তাআলা তাঁকে তাদের ষড়যন্ত্র থেকে রক্ষা করেন। তিনি হযরত আবু বকর (রা.)-কে সঙ্গে নিয়ে মদিনার উদ্দেশ্যে হিজরত করেন। এভাবে আল্লাহর বিশেষ সাহায্যে রাসূলুল্লাহ (সা.) শত্রুদের ষড়যন্ত্র থেকে নিরাপদে বেরিয়ে আসেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ يَمْكُرُ بِكَ الَّذِينَ كَفَرُوا لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ وَاللَّهُ خَيْرُ الْمَاكِرِينَ.</div></div><p>অর্থ: আর স্মরণ করো, যখন কাফিররা তোমার বিরুদ্ধে ষড়যন্ত্র করছিল, তোমাকে বন্দি করার জন্য অথবা হত্যা করার জন্য অথবা দেশ থেকে বের করে দেওয়ার জন্য। তারা ষড়যন্ত্র করছিল এবং আল্লাহও পরিকল্পনা করছিলেন। আর আল্লাহ সর্বোত্তম পরিকল্পনাকারী। (সূরা আল-আনফাল: ৩০)</p><div class=\"h hs hs2\">৭. তায়েফে দাওয়াত দিতে গিয়ে নির্যাতনের শিকার</div><p>মক্কার কাফিরদের বিরোধিতা ও নির্যাতন বেড়ে গেলে রাসূলুল্লাহ (সা.) তায়েফে ইসলামের দাওয়াত পৌঁছে দেওয়ার উদ্দেশ্যে গমন করেন। কিন্তু তায়েফের নেতারা তাঁর দাওয়াত গ্রহণ করেনি। বরং তারা তাঁকে উপহাস করে এবং উচ্ছৃঙ্খল লোকদের তাঁর পেছনে লেলিয়ে দেয়। ফলে তাঁকে পাথর নিক্ষেপ করে আহত করা হয় এবং তাঁর পবিত্র শরীর রক্তাক্ত হয়ে যায়।</p><p>এত নির্যাতনের পরও তিনি তাদের জন্য বদদোয়া করেননি। বরং আশা প্রকাশ করেছিলেন, তাদের বংশধরদের মধ্য থেকে এমন মানুষ জন্মগ্রহণ করবে, যারা এক আল্লাহর ইবাদত করবে। এটি তাঁর অসাধারণ ধৈর্য, ক্ষমাশীলতা ও দাওয়াতি প্রজ্ঞার পরিচয়।</p><div class=\"h hs hs2\">৮. আবু তালিব ও খাদিজা (রা.)-এর ইন্তেকাল</div><p>নবুওয়াতের দশম বছরে রাসূলুল্লাহ (সা.)-এর জীবনে দুটি অত্যন্ত বেদনাদায়ক ঘটনা ঘটে। তাঁর চাচা আবু তালিব এবং প্রিয় স্ত্রী হযরত খাদিজা (রা.) ইন্তেকাল করেন। আবু তালিব তাঁকে সামাজিক ও গোত্রীয়ভাবে সুরক্ষা দিতেন এবং খাদিজা (রা.) তাঁকে মানসিক, আর্থিক ও পারিবারিকভাবে সহযোগিতা করতেন।</p><p>তাঁদের ইন্তেকালের ফলে রাসূলুল্লাহ (সা.) ব্যক্তিগতভাবে গভীর শোকের সম্মুখীন হন। একই সঙ্গে মক্কার কাফিরদের বিরোধিতা ও অত্যাচার আরও বেড়ে যায়। এ বছরটি ইসলামের ইতিহাসে ‘আমুল হুযন’ বা শোকের বছর নামে পরিচিত।</p><div class=\"h hs hs2\">৯. মুসলমানদের ওপর নির্যাতন ও হিজরতে বাধ্য হওয়া</div><p>মক্কার কাফিররা শুধু রাসূলুল্লাহ (সা.)-কেই নয়, বরং তাঁর অনুসারীদেরও নানাভাবে নির্যাতন করত। দুর্বল ও অসহায় মুসলমানদের ওপর বিশেষভাবে অত্যাচার চালানো হতো। ফলে রাসূলুল্লাহ (সা.)-এর নির্দেশে কিছু সাহাবি প্রথমে হাবশায় হিজরত করেন। পরবর্তী সময়ে মুসলমানরা মদিনায় হিজরত করেন।</p><p>হিজরতের ফলে মুসলমানরা নিজেদের জন্মভূমি, ঘরবাড়ি ও সম্পদ ছেড়ে যেতে বাধ্য হন। এটি ছিল দাওয়াতি জীবনের একটি বড় পরীক্ষা। তবে মদিনায় গিয়ে তাঁরা স্বাধীনভাবে ইসলামের দাওয়াত প্রচারের সুযোগ লাভ করেন।</p><div class=\"h hs hs2\">১০. মদিনায় ইহুদি সম্প্রদায়ের বিরোধিতা</div><p>মদিনায় হিজরতের পর রাসূলুল্লাহ (সা.)-কে নতুন ধরনের প্রতিবন্ধকতার সম্মুখীন হতে হয়। সেখানে বসবাসকারী ইহুদি সম্প্রদায়ের কিছু গোষ্ঠী তাঁর নবুওয়াতের বিরোধিতা করে। তারা বিভিন্ন সময়ে বিতর্ক, চুক্তিভঙ্গ ও ষড়যন্ত্রের মাধ্যমে মুসলিম সমাজকে দুর্বল করার চেষ্টা করে।</p><p>রাসূলুল্লাহ (সা.) প্রথমে তাদের সঙ্গে শান্তিপূর্ণ সহাবস্থান ও পারস্পরিক সহযোগিতার ব্যবস্থা করেন। কিন্তু তাদের কয়েকটি গোষ্ঠী চুক্তি ভঙ্গ করে মুসলমানদের বিরুদ্ধে শত্রুতামূলক কর্মকাণ্ডে জড়িয়ে পড়ে। ফলে পরিস্থিতি অনুযায়ী রাসূলুল্লাহ (সা.) প্রয়োজনীয় ব্যবস্থা গ্রহণ করেন।</p><div class=\"h hs hs2\">১১. মুনাফিকদের ষড়যন্ত্র ও বিভেদ সৃষ্টি</div><p>মদিনায় ইসলাম শক্তিশালী হওয়ার পর কিছু লোক বাহ্যিকভাবে ইসলাম গ্রহণ করলেও অন্তরে ইসলাম ও মুসলমানদের প্রতি বিদ্বেষ পোষণ করত। এদের মুনাফিক বলা হয়। আবদুল্লাহ ইবনে উবাই ছিল মদিনার মুনাফিকদের অন্যতম নেতা।</p><p>মুনাফিকরা মুসলমানদের মধ্যে বিভেদ সৃষ্টি, রাসূলুল্লাহ (সা.)-এর নেতৃত্বকে দুর্বল করা এবং ইসলামী সমাজের ঐক্য নষ্ট করার চেষ্টা করত। তারা বিভিন্ন সময়ে মিথ্যা অপবাদ ও গুজব ছড়িয়ে মুসলমানদের ক্ষতিগ্রস্ত করার চেষ্টা করে। বিশেষ করে ইফকের ঘটনা ছিল তাদের অপপ্রচারের একটি ভয়াবহ দৃষ্টান্ত।</p><div class=\"h hs hs2\">১২. যুদ্ধ ও সামরিক সংঘাতের প্রতিবন্ধকতা</div><p>মদিনায় হিজরতের পরও মক্কার কাফিররা মুসলমানদের শান্তিতে থাকতে দেয়নি। তারা মুসলমানদের বিরুদ্ধে বিভিন্ন সামরিক অভিযান পরিচালনা করে। ফলে মুসলমানদের বদর, উহুদ, খন্দকসহ বিভিন্ন যুদ্ধে অংশগ্রহণ করতে হয়।</p><p>বদর যুদ্ধে মুসলমানরা বিজয় লাভ করলেও উহুদ যুদ্ধে সাময়িক বিপর্যয়ের সম্মুখীন হন। খন্দকের যুদ্ধে বিভিন্ন গোত্রের সম্মিলিত বাহিনী মদিনা আক্রমণের চেষ্টা করে। এসব যুদ্ধের কারণে মুসলমানদের জানমাল ও নিরাপত্তা হুমকির মুখে পড়ে এবং দাওয়াতি কার্যক্রমও নানা বাধার সম্মুখীন হয়।</p><div class=\"h hs hs2\">১৩. দাওয়াতের পথে প্রলোভন ও আপসের প্রস্তাব</div><p>মক্কার নেতারা রাসূলুল্লাহ (সা.)-কে দাওয়াতের কাজ থেকে বিরত রাখার জন্য বিভিন্ন প্রলোভন দেখিয়েছিল। তারা তাঁকে সম্পদ, নেতৃত্ব ও ক্ষমতা দেওয়ার প্রস্তাব দেয়। এমনকি মূর্তিপূজা ও ইসলামের মধ্যে আপস করারও চেষ্টা করে। কিন্তু রাসূলুল্লাহ (সা.) এসব প্রস্তাব দৃঢ়ভাবে প্রত্যাখ্যান করেন।</p><p>তিনি তাওহিদের আদর্শে কোনো আপস করেননি এবং আল্লাহর নির্দেশ অনুযায়ী দাওয়াতের কাজ অব্যাহত রাখেন। এ ঘটনা প্রমাণ করে, দাওয়াতের ক্ষেত্রে সত্য ও আদর্শের ব্যাপারে আপসহীন থাকা জরুরি।</p><div class=\"h hs hs2\">১৪. সাধারণ মানুষের অজ্ঞতা ও কুসংস্কার</div><p>রাসূলুল্লাহ (সা.) এমন একটি সমাজে দাওয়াত প্রদান করেছিলেন, যেখানে মূর্তিপূজা, গোত্রীয় অহংকার, কন্যাসন্তান হত্যা, সুদ, মদ্যপান, জুয়া ও নানা ধরনের কুসংস্কার প্রচলিত ছিল। মানুষ দীর্ঘদিন ধরে এসব অন্যায়কে সামাজিক রীতি হিসেবে গ্রহণ করেছিল। তাই তাদের চিন্তাভাবনা ও জীবনব্যবস্থায় পরিবর্তন আনা ছিল অত্যন্ত কঠিন কাজ।</p><p>রাসূলুল্লাহ (সা.) ধীরে ধীরে কুরআনের শিক্ষা, নৈতিক উপদেশ ও বাস্তব প্রশিক্ষণের মাধ্যমে মানুষের মধ্যে পরিবর্তন আনেন। তিনি তাদের অজ্ঞতা দূর করে জ্ঞান, ন্যায়বিচার ও মানবিকতার শিক্ষা দেন।</p><div class=\"h hs hs2\">১৫. আত্মীয়স্বজন ও গোত্রীয় স্বার্থের বিরোধিতা</div><p>আরব সমাজে গোত্রীয় মর্যাদা ও পারিবারিক ঐতিহ্যকে অত্যন্ত গুরুত্ব দেওয়া হতো। রাসূলুল্লাহ (সা.) যখন সব মানুষকে এক আল্লাহর ইবাদত ও সমতার শিক্ষা দেন, তখন অনেক গোত্রপ্রধান মনে করে যে, এতে তাদের সামাজিক মর্যাদা ও নেতৃত্ব ক্ষতিগ্রস্ত হবে। ফলে তারা নিজেদের গোত্রীয় স্বার্থ রক্ষার জন্য তাঁর দাওয়াতের বিরোধিতা করে।</p><p>তারা বংশ, সম্পদ ও ক্ষমতার ভিত্তিতে মানুষের শ্রেষ্ঠত্ব নির্ধারণ করতে চাইত। কিন্তু রাসূলুল্লাহ (সা.) ঘোষণা করেন, মানুষের প্রকৃত মর্যাদা নির্ধারিত হয় তাকওয়ার মাধ্যমে।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন,</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ.</div></div><p>অর্থ: নিশ্চয়ই আল্লাহর কাছে তোমাদের মধ্যে সেই ব্যক্তিই অধিক মর্যাদাবান, যে তোমাদের মধ্যে অধিক তাকওয়াবান। (সূরা আল-হুজুরাত: ১৩)</p><div class=\"h hs hs2\">১৬. আন্তর্জাতিক পর্যায়ে দাওয়াতের প্রতিবন্ধকতা</div><p>রাসূলুল্লাহ (সা.) মদিনায় ইসলামী রাষ্ট্র প্রতিষ্ঠার পর বিভিন্ন দেশের শাসক ও সম্রাটের কাছে ইসলামের দাওয়াত পৌঁছে দেন। তিনি রোম, পারস্য, মিসর ও আবিসিনিয়ার শাসকদের কাছে পত্র পাঠান। কিন্তু সবাই তাঁর দাওয়াত গ্রহণ করেনি। কেউ কেউ তা প্রত্যাখ্যান করে, আবার কেউ সম্মানজনক আচরণ করলেও ইসলাম গ্রহণ করেনি। বিশেষ করে পারস্যের সম্রাট কিসরা রাসূলুল্লাহ (সা.)-এর পত্রের প্রতি অসম্মান প্রদর্শন করে তা ছিঁড়ে ফেলে। এভাবে আন্তর্জাতিক পর্যায়েও তাঁকে বিরোধিতা ও প্রত্যাখ্যানের সম্মুখীন হতে হয়েছিল।</p><div class=\"h hm\">উপসংহার</div><p>রাসূলুল্লাহ (সা.)-এর দাওয়াতি জীবন ছিল অসংখ্য বাধা-বিপত্তি, নির্যাতন, ষড়যন্ত্র ও কঠিন পরীক্ষায় পরিপূর্ণ। মক্কার মুশরিকদের বিরোধিতা, শারীরিক নির্যাতন, অর্থনৈতিক অবরোধ, তায়েফের ঘটনা, প্রিয়জনদের ইন্তেকাল, মুনাফিকদের ষড়যন্ত্র এবং বিভিন্ন যুদ্ধ ও সংঘাত তাঁর দাওয়াতি জীবনের উল্লেখযোগ্য প্রতিবন্ধকতা। কিন্তু তিনি কখনো হতাশ হননি কিংবা সত্যের পথ থেকে বিচ্যুত হননি। বরং ধৈর্য, প্রজ্ঞা, ক্ষমাশীলতা, সাহসিকতা ও আল্লাহর ওপর পূর্ণ আস্থার মাধ্যমে সব বাধা অতিক্রম করেছেন। অবশেষে তাঁর দাওয়াতের মাধ্যমে আরব উপদ্বীপে ইসলামের বিজয় প্রতিষ্ঠিত হয় এবং ইসলাম বিশ্বব্যাপী বিস্তারের পথ লাভ করে। তাই রাসূলুল্লাহ (সা.)-এর দাওয়াতি জীবন বর্তমান যুগের দাঈদের জন্য ধৈর্য, দৃঢ়তা ও আদর্শিক অবিচলতার সর্বোত্তম শিক্ষা।</p>"]]}]}, "dv": ["রচনামূলক প্রশ্ন"], "ex": "2026-11-10"}, , , , {"n": "ইসলামিক স্টাডিজ ৩য় পত্র", "c": "#F43F5E", "k": "ই৩", "d": {"রচনামূলক প্রশ্ন": [{"n": "রচনামূলক", "c": "#F43F5E", "q": [["ইসলামের সংজ্ঞা দাও। অতপর ইসলামের রুকনসমূহ আলোচনা কর।", ""], ["ইসলামের পরিচয় দাও। আর্থসামাজিক সমস্যা সমাধানে ইসলামের ভূমিকা লিপিবদ্ধ কর।", ""], ["আভিধানিক ও শরয়ী দৃষ্টিকোণ থেকে ইসলাম এর পরিচয় দাও। অতপর ইসলাম ও অন্যান্য আসমানি ধর্মসমূহের তুলনামূলক আলোচনা কর।", ""], ["আল্লাহর বাণী ان الدين عند الله الاسلام এর আলোকে অন্যান্য ধর্মের উপর ইসলামের শ্রেষ্ঠত্ব সম্পর্কে আলোচনা কর।", ""], ["তাওহীদ অর্থ কি? তা কত প্রকার? মানবজীবনে তাওহীদের গুরুত্ব বিশদভাবে বর্ণনা কর।", ""], ["আকিদা অর্থ কি? ঈমান, আকিদা ও কালাম এর মধ্যে পার্থক্য কি? ইসলামি আকিদার মূল উৎসসমূহ এবং গুরুত্ব সংক্ষেপে লিখ।", ""], ["শিরকের পরিচয় বর্ণনা কর। শিরকের কারণ বর্ণনাপূর্বক সমাজে প্রচলিত বিভিন্ন প্রকারের শিরক সম্পর্কে আলোচনা কর।", ""], ["আল্লাহ তায়ালার বাণী ان الشرك لظلم عظيم এর বিশদভাবে ব্যাখ্যা কর।", ""], ["মুহাম্মদ স. এর রিসালাতের প্রতি বিশ্বাস স্থাপনের উদ্দেশ্য কি? তার রিসালাতের প্রতি বিশ্বাসের বিভিন্ন দিকের বিস্তারিত আলোচনা কর।", ""], ["নবুওয়াত ও রিসালাতের পরিচয় দাও। রাসূলগণকে প্রেরণ করার হেকমত কি? প্রমাণ কর যে, মুহাম্মদ স. সর্বশেষ ও সর্বশ্রেষ্ঠ নবী।", ""], ["হুকুমসহ সালাতের ফরজ, ওয়াজিব, সুন্নত ও মুস্তাহ
