:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.08);--fs:16px;--a1:#0f766e;--a2:#0e7490}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mu:#94a3b8;--ln:#243049;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:12px 12px 18px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:6px;max-width:1000px;margin:0 auto}.top h1{flex:1;margin:0;font-size:21px;line-height:1.25}
.tb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 11px;backdrop-filter:blur(6px)}.tb:active{transform:scale(.94)}
header>p{max-width:1000px;margin:6px auto 0;color:rgba(255,255,255,.85)}
.hero{max-width:1000px;margin:14px auto 0;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 14px}
.ring{position:relative;flex:none;width:84px;height:84px}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}.st div{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 2px}.st b{display:block;font-size:20px;line-height:1.2}.st small{font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 10px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;margin:6px 0 8px}
.tile b{display:block;font-size:18px;line-height:1.25}.tile small{color:var(--mu);font-size:14px}.tile.off{opacity:.5}
.big{display:flex;gap:14px;align-items:center}.big .ic{margin:6px 0;flex:none}
.pb{height:7px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .4s}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 10px 8px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;max-width:1000px;margin:0 auto 8px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.zb{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:0 12px;font-weight:700}.chips{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:20px;padding:2px 12px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.strip{max-width:1000px;margin:8px auto 0;font-size:14px;color:var(--mu);display:flex;gap:10px;align-items:center}.strip .pb{flex:1;margin:0;--c:var(--a1)}
.sec{margin-bottom:22px}.sh{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px}
.sh span{margin-left:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh)}
.no{float:left;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin:1px 9px 2px 0}
.q{font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;cursor:pointer}.q::after{content:' ▾';color:var(--c)}.card.show .q::after{content:' ▴'}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;clear:both}.ib{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:0 10px;font-size:14px}
.card.bm .bm,.card.kn .kn{background:var(--c);color:#fff;border-color:var(--c)}.card.kn{opacity:.8}
.a{font-size:var(--fs);margin-top:8px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--tx);border-radius:12px;padding:6px 12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(-4px)}}
.hid .a{display:none}.hid .card.show .a{display:block}.a b{color:var(--c)}
.alw .q::after{content:none!important}.alw .q{cursor:default}.hid .a{cursor:pointer}
.a .h{font-weight:700;color:var(--c);margin:12px 0 2px;padding-left:8px;border-left:4px solid var(--c)}.a p{margin:2px 0 6px;text-align:justify}
.ay{margin:8px 0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--c);text-align:center}.ay .ar{font:400 calc(var(--fs)*1.7)/2 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif}.ay .rf{color:var(--mu);font-size:.9em}
.empty{text-align:center;color:var(--mu);padding:30px}
.zi{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:20px;padding:4px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}.zi.on{opacity:1}


.qt3{background:color-mix(in srgb,var(--c) 10%,var(--card));border:0;border-radius:28px;box-shadow:none;padding:12px 16px}.qt3 .no{border-radius:12px}
.qt6{background:#0b0f1a;color:#e8edf8;border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}.qt6 .no{box-shadow:0 0 10px var(--c)}
.at8 .a{background:color-mix(in srgb,var(--c) 8%,var(--card))}.at8 .a .h{background:var(--c);color:#fff;border:0;border-radius:0 16px 16px 0;margin-left:-12px;padding:2px 14px;display:inline-block}.at8 .ay{border:0;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.15);border-radius:6px}

:root{--bg:#f3f5f1;--card:#fff;--tx:#10231d;--mu:#667a72;--ln:#e3e9e4;--sh:0 1px 2px rgba(16,35,29,.05),0 8px 24px -8px rgba(16,35,29,.12);--r:22px}

body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -80px,color-mix(in srgb,var(--a1) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

<script>
const S=[{"n":"আস সীরাত আন নববিয়্যাহ","c":"#15803D","k":"সি","d":{}},{"n":"দাওয়াহ ১ম পত্র","c":"#7C3AED","k":"দা১","d":{"প্রশ্নসমূহ":[{"n":"দাওয়াহ","c":"#7C3AED","q":[["ইসলামী দাওয়াহর প্রকৃতি ও পরিধি। (মূল প্রশ্ন ৫)","<div class=\"h hd\">উপস্থাপনা</div><p>পৃথিবীতে মানব আগমনের প্রথম প্রহর থেকে ইসলামী দাওয়াতের ধারা সূচিত হয়েছে। হযরত আদম (আ) প্রথম দায়ী হিসেবে তাঁর বংশধরদের নিকট প্রথম দাওয়াতি কাজ করেছেন। পর্যায়ক্রমে পরবর্তীকালের সকল নবী রাসূল এবং তাঁদের অনুসারী প্রকৃত মুসলিমগণ দাওয়াতের কাজেই তাঁদের জীবন উৎসর্গ করেছেন। দাওয়াতের বিশ্বজনীন রূপটি সর্বশেষ নবী ও রাসূল হযরত মুহাম্মদ (স)-এর সময়ে এসে পূর্ণতা লাভ করেছে। রাসূল (স)-এর পরে তাঁর সাহাবীগণ, পরবর্তীতে তাবেয়ী, তাবে-তাবেয়ী, মুহাদ্দিস, ফকীহ, মুফাসসির, ইসলামী চিন্তাবিদ আলেমগণ দাওয়াতি কাজ আঞ্জাম দিয়েছেন। যুগের চাহিদা ও সমসাময়িক প্রেক্ষাপট বিবেচনায় কখনো কখনো দাওয়াতের কৌশল ও পদ্ধতিগত পরিবর্তন আনা আবশ্যক হয়ে পড়ে। এ বিষয়গুলো বিশ্লেষণ করলেই দাওয়াতের প্রকৃতি ও পরিসর সম্পর্কে সম্যক জ্ঞান লাভ করা যায়।</p><div class=\"h hd\">ইসলামী দাওয়াহ-এর পরিচয়</div><div class=\"h hd3\">ক. আভিধানিক অর্থ</div><p>দুটি শব্দযোগে গঠিত একটি মুরাক্কাব। একে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ বলা হয়।</p><p>এর প্রথমটি হচ্ছে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَة</span>ُ; এটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">نَصَر</span>َ-এর মাসদার।</p><p><b>এর আভিধানিক অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> আহ্বান করা</div><div><b>২.</b> দাওয়াত দেয়া</div><div><b>৩.</b> আমন্ত্রণ জানানো</div><div><b>৪.</b> to invite</div><div><b>৫.</b> to call</div><div><b>৬.</b> তাবলীগ বা পৌঁছে দেয়া</div></div><p>আর দ্বিতীয়টি হচ্ছে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْإِسْلَامِيَّة</span>ُ; এটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">إِفْعَال</span>-এর মাসদার।</p><p><b>এর আভিধানিক অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> ইসলামী</div><div><b>২.</b> ইসলামসম্মত</div></div><p>সুতরাং <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ-এর আভিধানিক অর্থ :</p><div class=\"mn\"><div><b>১.</b> ইসলামী দাওয়াত</div><div><b>২.</b> ইসলামসম্মত দাওয়াত</div></div><div class=\"h hd3\">খ. পারিভাষিক সংজ্ঞা</div><p><b>১.</b> <span class=\"sc\">ইসলামী শরীয়তের পরিভাষায়</span> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ হলো—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هِيَ نِدَاءُ النَّاسِ إِلَى الْإِسْلَامِ وَأَحْكَامِهِ بِإِعْلَانِ السَّلْطَنَةِ الْكَامِلَةِ لِلَّهِ.</div></div><p>অর্থাৎ, মহান আল্লাহর নিরঙ্কুশ ক্ষমতা ঘোষণার মাধ্যমে মানুষকে ইসলামের বিধিবিধানের প্রতি আহ্বান জানানোর নামই <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ তথা ইসলামী দাওয়াত।</p><p><b>২.</b> <span class=\"sc\">কতিপয় আলেম বলেছেন</span>—</p><blockquote class=\"qt qb\"><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ دُعَاءُ النَّاسِ إِلَى الْإِسْلَامِ وَعَقَائِدِهِ وَأَحْكَامِهِ بِإِعْلَانِ السَّلْطَنَةِ الْكَامِلَةِ لِلَّهِ عَزَّ وَجَلَّ.</div></div><p>অর্থাৎ, মহান আল্লাহর নিরঙ্কুশ ক্ষমতা ঘোষণার মাধ্যমে মানুষকে ইসলাম এবং এর আকায়েদ ও আহকামের প্রতি আহ্বান করাকে ইসলামী দাওয়াত বলা হয়।</p></blockquote><p><b>৩.</b> <span class=\"sc\">আল্লামা ইবনে কাসীর (রহ:) বলেছেন</span>—</p><blockquote class=\"qt qi\"><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">لَا إِلٰهَ إِلَّا اللّٰه</span>ُ-এর প্রতি আহ্বান করাকেই <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ তথা ইসলামী দাওয়াহ বলা হয়।</p></blockquote><p><b>৪.</b> সর্বোপরি, ইসলামী দাওয়াত বলতে বোঝায়, আল্লাহর দিকে মানুষকে আহ্বান জানানো, যেন তারা গায়রুল্লাহর অনুসরণ বাদ দিয়ে আল্লাহর দিকে ধাবিত হয় এবং তাগুত নামক অপশক্তিকে হৃদয়-মন থেকে মুছে দিয়ে আল্লাহর গুণে গুণান্বিত হয়ে ইহকালের শান্তি ও পরকালের কল্যাণে নিয়োজিত হয়।</p><div class=\"h hd\">ইসলামী দাওয়াহ-এর প্রকৃতি</div><p>ইসলামী দাওয়াহ ইসলামের শিক্ষা, জীবন দর্শন, মূল্যবোধ ও বিধিবিধানের প্রচারণার মাধ্যম। লক্ষ্যগত একনিষ্ঠতা, উদ্দেশ্যগত বিশালতা, আদর্শগত চিরন্তনতা এবং পরিণামগত সাফল্য প্রভৃতি কারণে ইসলামী দাওয়াহ বিশেষ প্রকৃতি ও বৈশিষ্ট্যের ধারক। নিম্নে ইসলামী দাওয়াহ-এর প্রকৃতি তুলে ধরা হলো।</p><p><b>১. আল্লাহর আহ্বান :</b> ইসলামী দাওয়াহ মূলত আল্লাহর পক্ষ থেকে মানবজাতির জন্য ইসলামের প্রতি আহ্বান। তবে দাওয়াতের এ কাজ সরাসরি আল্লাহ তায়ালা করেন না। তিনি মানুষের মধ্য থেকে কয়েকজনকে নির্বাচিত করেন এবং তাঁদেরকে অহীর জ্ঞানে সমৃদ্ধ করে দাওয়াতের নির্দেশনা দান করেন। নির্বাচিত এ মানুষেরাই হলেন আল্লাহর নবী ও রাসূল। নবী রাসূলগণের দাওয়াত প্রকৃতপক্ষে মহান আল্লাহরই আহ্বান। কুরআন মাজীদের বিভিন্ন আয়াত থেকে তার প্রমাণ পাওয়া যায়। যেমন একটি আয়াত হচ্ছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أُولَٰئِكَ يَدْعُونَ إِلَى النَّارِ ۖ وَاللَّهُ يَدْعُو إِلَى الْجَنَّةِ وَالْمَغْفِرَةِ بِإِذْنِهِ ۖ وَيُبَيِّنُ آيَاتِهِ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ.</div></div><p><b>২. আল্লাহর পথের দিকে আহ্বান :</b> ইসলামী দাওয়াতে মহান আল্লাহই একমাত্র উপজীব্য। এ দাওয়াতে মানুষকে আল্লাহর দিকে, আল্লাহর পথের দিকে, তাঁর করুণা ও নেয়ামতের দিকে আহ্বান জানানো হয়। আল্লাহর সকল নবী রাসূল এবং তাঁদের অনুসারী দায়ীগণ নিজেদের স্বার্থসিদ্ধি বা ক্ষমতা বৃদ্ধির জন্য দাওয়াতি কাজ করেননি; বরং তাঁদের একমাত্র লক্ষ্য ছিল মানুষকে আল্লাহর পথের দিকে আহ্বান জানানো। কুরআন মাজীদে মহানবী (স)-এর দাওয়াত প্রসঙ্গে যা বলা হয়েছে তা থেকেও বিষয়টির সুস্পষ্ট প্রমাণ পাওয়া যায়। যেমন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا النَّبِيُّ إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا وَنَذِيرًا ۝ وَدَاعِيًا إِلَى اللَّهِ بِإِذْنِهِ وَسِرَاجًا مُنِيرًا.</div></div><p><b>৩. বিশ্বজনীন :</b> ইসলামী দাওয়াতের বিশেষ প্রকৃতি হচ্ছে, এ দাওয়াহ কোনো বিশেষ এলাকা, জাতি, গোষ্ঠী, ধর্ম, বর্ণ, ধনী, গরিব প্রভৃতির জন্য নির্দিষ্ট নয়। বিশেষ কোনো রাজনৈতিক বা ক্ষমতাসীন দলকে দাওয়াত প্রদান ও গ্রহণের একক অধিকার প্রদান করা হয়নি। দাওয়াত দেয়া ও গ্রহণের অধিকার সকলের জন্য উন্মুক্ত রাখা হয়েছে। পৃথিবীর যে কোনো প্রান্তরে যে কোনো যোগ্যতার মানুষ আল্লাহর আদেশ এবং রাসূল (স)-এর নির্দেশনা মেনে দাওয়াত গ্রহণ ও প্রদান করতে পারে। এজন্য মহান আল্লাহ রাসূল (স)-কে সমগ্র বিশ্ববাসীর জন্যই প্রেরণ করেছেন। যেমন কুরআনে এসেছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ.</div></div><p><b>৪. প্রথম আহ্বান :</b> বিশ্বমানবকে আল্লাহর পথে আনয়নের প্রথম আহ্বান হলো ইসলামী দাওয়াহ। পৃথিবীর প্রথম মানব হযরত আদম (আ) মহান আল্লাহর নির্দেশে এর ধারা শুরু করেন। শেষনবী হযরত মুহাম্মদ (স)ও প্রাচীনতম এ দাওয়াতের স্বীকৃতি প্রদান করেই নিজের দাওয়াতি কাজ শুরু করার আদেশ পেয়েছিলেন। আল্লাহ তায়ালা তাঁকে আদেশ দিয়েছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ مَا كُنْتُ بِدْعًا مِنَ الرُّسُلِ وَمَا أَدْرِي مَا يُفْعَلُ بِي وَلَا بِكُمْ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰ إِلَيَّ وَمَا أَنَا إِلَّا نَذِيرٌ مُبِينٌ.</div></div><p><b>৫. সর্বশেষ ও চূড়ান্ত দাওয়াহ :</b> হযরত আদম (আ) যে দাওয়াতের সূচনা করেছেন, যুগে যুগে আবির্ভূত নবী রাসূলগণ যে দাওয়াতের পূর্ণতা বিধানের কাজ করেছেন, সে দাওয়াত চূড়ান্ত পূর্ণতা লাভ করেছে সর্বশেষ ও সর্বশ্রেষ্ঠ নবী ও রাসূল হযরত মুহাম্মদ (স)-এর মাধ্যমে। তাঁর পরে আর কোনো নবী রাসূল আগমন করবেন না। আর কোনো নতুন দাওয়াতের প্রয়োজন হবে না। যে কারণে ইসলামী দাওয়াহ হলো সর্বশেষ ও চূড়ান্ত দাওয়াহ।</p><p><b>৬. পরিপূর্ণ আহ্বান :</b> ইসলামী দাওয়াহ কোনো আংশিক দাওয়াহ নয় এবং এটি জীবনের বিশেষ কোনো দিক বা বিভাগের প্রতিও আহ্বান নয়; বরং ইসলামী দাওয়াহ হলো মানবজাতির জন্য আল্লাহর পক্ষ থেকে পরিপূর্ণ আহ্বান। কারণ ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। মানুষের জীবনের সকল দিক ও বিভাগের সকল সমস্যার বিস্তারিত সমাধান ইসলামে দেয়া হয়েছে। আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا.</div></div><p><b>৭. সহজবোধ্য :</b> ইসলামী দাওয়াহ খুবই সহজবোধ্য বিষয়। এক্ষেত্রে সবসময়ই অত্যন্ত সহজপদ্ধতি অবলম্বন করা হয়েছে। কারণ মহান আল্লাহ সকল ক্ষেত্রে সহজতর নীতি অবলম্বনকেই তাঁর কর্মধারা হিসেবে ঘোষণা করেছেন। তিনি বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ.</div></div><p>আল্লাহ তায়ালার এ কর্মধারা অনুসরণেই ইসলামী দাওয়াতকে সবসময় সহজতর পদ্ধতিতে পেশ করার চেষ্টা করা হয়েছে। দাওয়াতকে সহজবোধ্যভাবে গ্রহণীয় করে উপস্থাপনের নির্দেশ দিয়ে আল্লাহ তায়ালা বলেছেন—</p><p>[আয়াত — মূল বই থেকে বসাতে হবে]</p><p>এ কারণেই রাসূল (স) যখন কোথাও দায়ী প্রেরণ করতেন তিনি তাঁদেরকে বিশেষভাবে বলে দিতেন— “তোমাদের প্রেরণ করা হচ্ছে সহজতর পন্থা অবলম্বনকারী হিসেবে; কঠোরতা আরোপ করার জন্য নয়।”</p><p><b>৮. সত্যের আহ্বান :</b> ইসলামী দাওয়াহ চিরায়ত সত্য ও শাশ্বত সুন্দরের আহ্বান। কুরআন মাজীদে ইসলামী দাওয়াতের এ সত্যমুখী প্রকৃতি বিভিন্নভাবে তুলে ধরা হয়েছে। আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُمُ الْحَقُّ مِنْ رَبِّكُمْ ۖ فَمَنِ اهْتَدَىٰ فَإِنَّمَا يَهْتَدِي لِنَفْسِهِ ۖ وَمَنْ ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا ۖ وَمَا أَنَا عَلَيْكُمْ بِوَكِيلٍ.</div></div><p>দাওয়াতের আহ্বান তাই সত্যের আহ্বান এবং সত্যের প্রতি আহ্বান। এ সত্যকে বিজয়ী করার দায়িত্ব নিয়েই বিশ্বনবী হযরত মুহাম্মদ (স) পৃথিবীতে আবির্ভূত হয়েছেন। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَىٰ وَدِينِ الْحَقِّ لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ الْمُشْرِكُونَ.</div></div><p><b>৯. সুস্পষ্ট ও উন্মুক্ত :</b> ইসলামী দাওয়াতে গোপন বা লুকানো কোনো বিষয় নেই। এর মধ্যে কোনো অস্পষ্টতা, দুর্বোধ্যতা নেই; বরং ইসলামী দাওয়াতের বিষয়বস্তু, লক্ষ্য ও উদ্দেশ্য, পথ ও পদ্ধতি এবং উৎস সবই সুস্পষ্ট এবং উন্মুক্ত। ধনী গরিব, সাদা কালো, ছোট বড়, নারী পুরুষ, সবল দুর্বল, রাজা প্রজা, শাসক শাসিত, জ্ঞানী মূর্খ, ছাত্র শিক্ষক, মুনিব কর্মচারী নির্বিশেষে সকল মানুষের ক্ষেত্রেই ইসলামী দাওয়াতের এ স্পষ্টতা ও উন্মুক্ততা বিদ্যমান। যে কেউ এর অভ্যন্তরে প্রবেশ করতে পারে। যে কোনো বিষয়ে জিজ্ঞাসা করে মনের সংশয় দূর করে নিতে পারে।</p><p><b>১০. ধর্মীয় স্বাধীনতার স্বীকৃতি :</b> ইসলামী দাওয়াহ ধর্মীয় স্বাধীনতা পরিপন্থী নয়। এতে কাউকে ইসলামগ্রহণ করতে বাধ্য করা হয় না; বরং সহজবোধ্য ভাষায়, যৌক্তিকভাবে ইসলামী জীবন দর্শনের বিভিন্ন বিষয় উল্লেখ করে ইসলামগ্রহণের আহ্বান জানানো হয়। এরপর যার ইচ্ছা এ দাওয়াত গ্রহণ করে আর যার ইচ্ছা এ দাওয়াত গ্রহণ করা থেকে বিরত থাকে। দাওয়াতদানকারীর দায়িত্ব নয় লোকদেরকে ইসলামী দাওয়াহ গ্রহণে বাধ্য করা। স্বয়ং রাসূল (স)-এরও এ ধরনের দায়িত্ব ছিল না। আল্লাহ তায়ালা বলেন—</p><p>[আয়াত — মূল বই থেকে বসাতে হবে]</p><p>অন্য আয়াতে আল্লাহ তায়ালা বলেন—</p><p>[আয়াত — মূল বই থেকে বসাতে হবে]</p><div class=\"h hd\">ইসলামী দাওয়াতের পরিধি</div><p>পৃথিবীতে প্রথম মানব হযরত আদম (আ) থেকেই ইসলামী দাওয়াতের ধারা সূচিত হয়। দাওয়াতের এ বিশ্বজনীন রূপটি সর্বশেষ নবী ও রাসূল হযরত মুহাম্মদ (স)-এর সময়ে এসে পূর্ণতা লাভ করে। যুগের চাহিদা ও সমসাময়িক প্রেক্ষাপট বিবেচনায় দাওয়াতের কৌশল ও পদ্ধতিগত পরিবর্তন আনতে হয়। এ বিষয়গুলো বিশ্লেষণ করলেই দাওয়াতের পরিধি সম্পর্কে বিস্তারিত জ্ঞান লাভ করা যায়। ইসলামী দাওয়াতের বিবিধ পরিধির মধ্যে নিম্নে উল্লেখযোগ্য কয়েকটি পরিধি তুলে ধরা হলো।</p><p><b>১. সময়গত পরিধি :</b> প্রথম নবী হযরত আদম (আ)-এর সময় থেকে দাওয়াতের যাত্রা শুরু হয়। পরবর্তীতে যত নবী রাসূল আগমন করেন, তাঁদের প্রত্যেকেই আল্লাহর পক্ষ থেকে দাওয়াতের সুমহান দায়িত্ব নিয়ে পৃথিবীতে আগমন করেন। এ ধারায় আল্লাহর পক্ষ থেকে সকলের শেষে আগমন করেন সর্বশেষ ও সর্বশ্রেষ্ঠ নবী ও রাসূল হযরত মুহাম্মদ (স)। নবী রাসূলগণের দাওয়াতি কাজের বর্ণনা দিয়ে মহান আল্লাহ বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">شَرَعَ لَكُمْ مِنَ الدِّينِ مَا وَصَّىٰ بِهِ نُوحًا وَالَّذِي أَوْحَيْنَا إِلَيْكَ وَمَا وَصَّيْنَا بِهِ إِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَىٰ ۖ أَنْ أَقِيمُوا الدِّينَ وَلَا تَتَفَرَّقُوا فِيهِ.</div></div><p>দাওয়াত দেয়া নবী রাসূলগণের সার্বক্ষণিক কাজ ছিল। যে কারণে তাঁরা যতক্ষণ জীবিত ছিলেন এবং দাওয়াত দেয়ার মতো শারীরিক ও মানসিক ক্ষমতার অধিকারী ছিলেন, ততক্ষণ দাওয়াতের কাজ করেছেন। সর্বশেষ নবী ও রাসূল হযরত মুহাম্মদ (স)-এর দাওয়াত সর্বকালীন। যতদিন পৃথিবী থাকবে, ততদিন এ দাওয়াতের আবেদন বিদ্যমান থাকবে।</p><p>তাই ইসলামী দাওয়াতের পরিসর অত্যন্ত ব্যাপক। সৃষ্টির সূচনা থেকে সমাপ্তি পর্যন্ত তা বিদ্যমান। এ কারণেই দাওয়াতের দায়িত্বে নিয়োজিত ব্যক্তিগণ আমৃত্যু দাওয়াতি কাজ করেছেন।</p><p><b>২. সমাজগত পরিধি :</b> ইসলাম একটি বিশ্বজনীন ও সর্বকালীন জীবনাদর্শ। পৃথিবীর সকল কালের ও সকল দেশের মানুষের জন্য এটি মহান আল্লাহ মনোনীত একমাত্র জীবনব্যবস্থা। যে কারণে ইসলামী দাওয়াতের সমাজগত পরিধিও ব্যাপক। বিশ্বজাহানের যেসব স্থানে মানববসতি রয়েছে এবং মানুষ যেখানে যেখানে মানবসমাজ গড়ে তুলেছে, তার প্রতিটি স্থান ইসলামী দাওয়াতের পরিসরভুক্ত। তাই ইসলামী দাওয়াতের ক্ষেত্রে দেশ, কাল, জাতি, ধর্ম, বর্ণ, সম্প্রদায়, গোষ্ঠী, শ্রেণি, পেশা, বয়স, আর্থিক অবস্থা ইত্যাদি কোনোভাবেই মূল্যায়িত হয় না। কাউকে কোনো কারণেই এর পরিসর থেকে বের করে দেয়ার উপায় নেই। রাসূল (স)-এর দাওয়াতি কর্মের পরিধি বর্ণনায় কুরআন মাজীদে ইরশাদ হয়েছে—</p><p>[আয়াত — মূল বই থেকে বসাতে হবে]</p><p>অন্য এক আয়াতে এসেছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ.</div></div><p>এ কারণে দাওয়াতের কোনো সুনির্দিষ্ট সমাজ নেই এবং নির্ধারিত কোনো মানবগোষ্ঠী নেই; বরং বিশ্ব মানবসমাজের পুরোটাই ইসলামী দাওয়াতের আওতাভুক্ত।</p><p><b>৩. বিষয়গত পরিধি :</b> ইসলামী দাওয়াতের বিষয়গত পরিধি মানুষের গোটা জীবন। কারণ ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। মানুষের জীবনের এমন কোনো দিক ও বিভাগ নেই, যে সম্পর্কে ইসলাম সুস্পষ্ট কোনো নির্দেশনা দান করেনি। মানুষের জীবনে এমন কোনো সমস্যা নেই, যার সমাধান ইসলাম প্রদান করেনি। যে কারণে ইসলামী দাওয়াতে মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক, অর্থনৈতিক, রাজনৈতিক, ধর্মীয়, রাষ্ট্রীয়, শিক্ষা, সাংস্কৃতিক, নৈতিক, আত্মিক, আধ্যাত্মিক, জাতীয়, আন্তর্জাতিকসহ সকল দিকই অন্তর্ভুক্ত থাকে। আংশিক ইসলাম মেনে চলার কোনো সুযোগ আল্লাহ তায়ালা রাখেননি। তিনি বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَفَتُؤْمِنُونَ بِبَعْضِ الْكِتَابِ وَتَكْفُرُونَ بِبَعْضٍ.</div></div><p>সুতরাং মানুষের জীবনের সকল দিক, বিভাগ ও বিষয়ই ইসলামী দাওয়াতের অন্তর্ভুক্ত। জীবনের বিশেষ কোনো অংশকে ঘিরে ইসলামী দাওয়াত আবর্তিত হয়নি।</p><p><b>৪. স্থানগত পরিধি :</b> ইসলামী দাওয়াতের সুনির্দিষ্ট, নির্ধারিত বা সীমিত কোনো গণ্ডি নেই। স্থানগত বা ক্ষেত্রগত সীমাবদ্ধতা ইসলামী দাওয়াতে নেই। পরিবার, শিক্ষা প্রতিষ্ঠান, প্রশিক্ষণকেন্দ্র, মসজিদ, মাদরাসা, সেমিনার, সিম্পোজিয়াম, ওয়াজ-মাহফিল, ব্যবসায়কেন্দ্র, কলকারখানা, পরিবহন এবং লোকালয়ে সুবিধাজনক যে কোনো সময় আল্লাহর নির্দেশনা ও রাসূল (স)-এর আদর্শ অনুসারে সকল স্থানে দাওয়াতি কার্যক্রম পরিচালনা করা যায়। নবী রাসূলগণ নিজের পরিবারে দাওয়াতের মাধ্যমে তাঁদের দাওয়াতি কার্যক্রম শুরু করেছেন। পরবর্তীতে তাঁদের দাওয়াত দেশ বিদেশের বিভিন্ন স্থানে ছড়িয়ে পড়েছে।</p><p>সুতরাং দাওয়াতের স্থান বা ক্ষেত্র বিশ্বের প্রতিটি লোকালয়। যেখানে মানুষ বসবাস করে সেখানেই দাওয়াতি কার্যক্রম পরিচালনা করা যাবে। বিরূপ পরিস্থিতির দোহাই দিয়ে বা অনুকূল অবস্থার সুবিধা নিয়ে কোনো এলাকাকেই দাওয়াতের হক থেকে বঞ্চিত করা যাবে না।</p><p><b>৫. মাধ্যম ও পদ্ধতিগত পরিধি :</b> ইসলামী দাওয়াহ সাময়িক কোনো আবেগ বা হঠাৎ উচ্ছ্বাসের বহিঃপ্রকাশ নয়; বরং এটি একটি পরিকল্পিত, প্রজ্ঞাময় ও আবশ্যক কাজ। মুসলিম হতে হলে এবং মুসলমানিত্ব টিকিয়ে রাখতে হলে মুসলিম এবং অমুসলিমদের মধ্যে দাওয়াতের এ কাজ অব্যাহত রাখা অনিবার্য। এ অনিবার্য কাজ সম্পাদনের জন্য যে সকল মাধ্যম ও পদ্ধতি ব্যবহার করা যাবে সেগুলো দাওয়াতের মাধ্যম ও পদ্ধতিগত পরিসরের অন্তর্ভুক্ত। এক্ষেত্রে সাধারণ রীতি হলো, যে পদ্ধতি ও মাধ্যম ইসলামের অন্য কোনো মূলনীতি বিরুদ্ধ নয় সে সকল মাধ্যম ও পদ্ধতির সবগুলো দাওয়াতের ক্ষেত্রে ব্যবহার করা যাবে। যেমন ওয়াজ নসীহত, শিক্ষা, প্রশিক্ষণ, গবেষণা, লেখালেখি, সমাজকর্ম, বৈজ্ঞানিক বিভিন্ন প্রচার মাধ্যম, রেডিও, টেলিভিশন, ব্যানার, ফেস্টুন, লিফলেট, পোস্টার, সেমিনার, সিম্পোজিয়াম, পথসভা, নাটক ইত্যাদি যে কোনো একটি বা সবগুলোকে দাওয়াতের মাধ্যম হিসেবে ব্যবহারের ক্ষেত্রে কোনো আপত্তি নেই, যদি বিষয়গুলোর মধ্যে ইসলামবিরোধী কোনো কিছুর অস্তিত্ব না থাকে। দাওয়াতের কাজে বৈজ্ঞানিক বিভিন্ন আবিষ্কার ব্যবহার না করা নিতান্তই মূর্খতা ছাড়া আর কিছুই নয়।</p><p>মহানবী (স)-এর দাওয়াতি কার্যক্রম বিশ্লেষণ করলে দেখা যায়, তিনি সকল অবস্থায় গতিশীলতা প্রতিষ্ঠার চেষ্টা করেছেন। তিনি সমকালীন পদ্ধতি ও মাধ্যমসমূহের মধ্যে সবচেয়ে আধুনিক মাধ্যম ও পদ্ধতি ব্যবহারের প্রয়াস পেয়েছেন। ব্যক্তিগত, সমষ্টিগত, প্রকাশ্য অপ্রকাশ্য, কথন লিখন সবধরনের মাধ্যমই তিনি ব্যবহার করেছেন। কখনো আবেগ অনুভূতি কাজে লাগিয়েছেন। কখনো দাওয়াতি কাজে ব্যবহার করেছেন ক্ষুরধার, সহজবোধ্য ও অকাট্য যুক্তি। আবার কখনো দাওয়াতের জন্য গড়ে তুলেছেন সুদৃঢ় বন্ধুত্ব। ক্ষেত্রবিশেষে কাজে লাগিয়েছেন বংশীয় বা ব্যক্তিত্বের সুসম্পর্ক।</p><div class=\"h hd\">উপসংহার</div><p>ইসলামী দাওয়াতের উদ্দেশ্য ও লক্ষ্য অতি মহৎ। এর ক্ষেত্র ও পরিধি অতি ব্যাপক। আল্লাহর আদেশে পৃথিবীতে দাওয়াতের কার্যক্রম শুরু করেছেন নবী রাসূলগণ। পরবর্তীতে আলেমগণ দাওয়াতের সে ধারা অব্যাহত রেখেছেন। এ দাওয়াহ পৃথিবীর সকল মানুষের, সকল ধর্ম ও বর্ণের, অঞ্চল ও গোত্রের এবং সকল কালের লোকদের জন্য সমানভাবে বিদ্যমান। মুসলিম জাতি সাধারণভাবে দাওয়াতের এ কাজের জন্য দায়িত্বপ্রাপ্ত। কোনো মুসলিমই এ দায়িত্ব অস্বীকার করতে পারে না এবং দায়িত্ব পালনে অবহেলা করতে পারে না। কারণ এর ওপরই মুসলিম জাতির অস্তিত্ব ও সাফল্য নির্ভর করে।</p>"],["ইলমুদ দাওয়াহর উৎপত্তি ও ক্রমবিকাশ। (মূল প্রশ্ন ১০)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলাম একটি বিশ্বজনীন শান্তি ও কল্যাণের ধর্ম। এ ধর্মের যথাযথ প্রচার, প্রসার ও প্রতিষ্ঠার একমাত্র উপায় হলো দাওয়াত। ইসলামের উৎপত্তি ও ক্রমবিকাশের সাথে দাওয়াতের উৎপত্তি ও ক্রমবিকাশ একই সূত্রে গাঁথা। ইসলামের প্রচার, প্রসার, প্রতিষ্ঠা ও সংরক্ষণের প্রথম প্রহর থেকেই ইসলামী দাওয়াহ-এর সামগ্রিক বিষয়টিও এর সাথে সম্পৃক্ত। যে কারণে ইসলামের উৎপত্তি ও ক্রমবিকাশের ইতিহাস এবং দাওয়াতের উৎপত্তি ও ক্রমবিকাশের ধারাকে এক ও অভিন্ন এবং পরস্পরের পরিপূরক বলা যায়।</p><div class=\"h hd\">ইসলামী দাওয়াহ-এর পরিচয়</div><div class=\"h hd3\">ক. আভিধানিক অর্থ</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَة</span>ُ দুটি শব্দযোগে গঠিত একটি মুরাক্কাব। একে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ বলা হয়।</p><p>এর প্রথমটি হচ্ছে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَة</span>ُ; এটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">نَصَر</span>َ-এর মাসদার।</p><p><b>এর আভিধানিক অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> আহ্বান করা</div><div><b>২.</b> দাওয়াত দেয়া</div><div><b>৩.</b> আমন্ত্রণ জানানো</div><div><b>৪.</b> to invite</div><div><b>৫.</b> to call</div><div><b>৬.</b> তাবলীগ বা পৌঁছে দেয়া</div></div><p>আর দ্বিতীয়টি হচ্ছে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْإِسْلَامِيَّة</span>ُ; এটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">إِفْعَال</span>-এর মাসদার।</p><p><b>এর আভিধানিক অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> ইসলামী</div><div><b>২.</b> ইসলামসম্মত</div></div><p>সুতরাং <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ-এর আভিধানিক অর্থ :</p><div class=\"mn\"><div><b>১.</b> ইসলামী দাওয়াত</div><div><b>২.</b> ইসলামসম্মত দাওয়াত</div></div><div class=\"h hd3\">খ. পারিভাষিক সংজ্ঞা</div><p><b>১.</b> <span class=\"sc\">ইসলামী শরীয়তের পরিভাষায়</span> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ হলো—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هِيَ نِدَاءُ النَّاسِ إِلَى الْإِسْلَامِ وَأَحْكَامِهِ بِإِعْلَانِ السَّلْطَنَةِ الْكَامِلَةِ لِلَّهِ.</div></div><p>অর্থাৎ, মহান আল্লাহর নিরঙ্কুশ ক্ষমতা ঘোষণার মাধ্যমে মানুষকে ইসলামের বিধিবিধানের প্রতি আহ্বান জানানোর নামই <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ তথা ইসলামী দাওয়াত।</p><p><b>২.</b> <span class=\"sc\">কতিপয় আলেম বলেছেন</span>—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ دُعَاءُ النَّاسِ إِلَى الْإِسْلَامِ وَعَقَائِدِهِ وَأَحْكَامِهِ بِإِعْلَانِ السَّلْطَنَةِ الْكَامِلَةِ لِلَّهِ عَزَّ وَجَلَّ.</div></div><p>অর্থাৎ, মহান আল্লাহর নিরঙ্কুশ ক্ষমতা ঘোষণার মাধ্যমে মানুষকে ইসলাম এবং এর আকায়েদ ও আহকামের প্রতি আহ্বান করাকে ইসলামী দাওয়াত বলা হয়।</p><p><b>৩.</b> <span class=\"sc\">আল্লামা ইবনে কাসীর (রহ:) বলেছেন</span>—</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">لَا إِلٰهَ إِلَّا اللّٰه</span>ُ-এর প্রতি আহ্বান করাকেই <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَةُ الْإِسْلَامِيَّة</span>ُ তথা ইসলামী দাওয়াহ বলা হয়।</p><p><b>৪.</b> সর্বোপরি, ইসলামী দাওয়াত বলতে বোঝায়, আল্লাহর দিকে মানুষকে আহ্বান জানানো, যেন তারা গায়রুল্লাহর অনুসরণ বাদ দিয়ে আল্লাহর দিকে ধাবিত হয় এবং তাগুত নামক অপশক্তিকে হৃদয়-মন থেকে মুছে দিয়ে আল্লাহর গুণে গুণান্বিত হয়ে ইহকালের শান্তি ও পরকালের কল্যাণে নিয়োজিত হয়।</p><div class=\"h hd\">ইসলামী দাওয়াহর উৎপত্তি</div><p>ইসলামী দাওয়াহর মাধ্যমে ইসলামের প্রতি আনুগত্যের দাওয়াত দেয়া হয়। এ আনুগত্যের ২টি পর্যায় রয়েছে। একটি হচ্ছে প্রকৃতিগত বা স্বভাবগত আনুগত্য আর অপরটি হচ্ছে স্বাধীন ইচ্ছানির্ভর আনুগত্য। এ স্বাধীন ইচ্ছানির্ভর আনুগত্যের ধারায় আল্লাহ তায়ালা প্রথমে সৃষ্টি করেন জিন জাতিকে এবং তাদেরকে সঠিক পথে পরিচালনার ব্যবস্থা করেন। এ ব্যবস্থায়ই ইসলামী দাওয়াতের উৎপত্তি প্রত্যক্ষ করা যায়। কিন্তু জিনজাতি তাদের সৃষ্টির উদ্দেশ্য সাধনে ব্যর্থতা প্রদর্শন করলে আল্লাহ তায়ালা নতুন আরেকটি স্বাধীন ইচ্ছাশক্তিসম্পন্ন জাতি সৃষ্টি করেন। এ জাতির নাম মানুষ জাতি। আল্লাহ মানুষকে মর্যাদা, ক্ষমতা ও বিশ্বজাহানের ওপর আধিপত্য দান করেন। বিশ্বজাহানের সবকিছুকে মানুষের আনুগত্য বানিয়ে দেন। এর বিনিময়ে মানুষ আল্লাহর কতোটা কৃতজ্ঞতা জ্ঞাপন করে এবং তাঁর হুকুমের আনুগত্য করে তা পরীক্ষা নিরীক্ষা করার ব্যবস্থা করেন। মানুষকে তাঁর খলিফা মনোনীত করে বিশ্বজাহান আবাদের এক অভূতপূর্ব ব্যবস্থা কায়েম করেন। কুরআন মাজীদে আল্লাহর এ পরিকল্পনা তুলে ধরে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً قَالُوا أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّي أَعْلَمُ مَا لَا تَعْلَمُونَ.</div></div><p>এ প্রেক্ষাপটে আল্লাহ তায়ালা প্রথম মানব হযরত আদম (আ)-কে সৃষ্টি করেন। সকল বস্তু ও বিষয়ের নাম সম্পর্কিত জ্ঞান দেয়ার মাধ্যমে তাঁকে হেদায়াত বা সঠিক পথের প্রথম নির্দেশনা প্রদান করেন। এরপর তাঁকে সুনির্দিষ্ট আদেশ ও সুস্পষ্ট নিষেধাজ্ঞা প্রদান করে আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقُلْنَا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ.</div></div><p>স্বাধীন ইচ্ছার অধিকারী আদম (আ) আল্লাহর এ আদেশ মেনে স্ত্রীকে নিয়ে জান্নাতে বসবাস শুরু করলেও শয়তানের প্ররোচনায় তাঁরা নিষেধাজ্ঞা লঙ্ঘন করলেন। ফলে আল্লাহ তাঁকে সপরিবারে জান্নাত ত্যাগ করে পৃথিবীতে চলে আসার নির্দেশ দিলেন। তারপর বলে দিলেন যে, পৃথিবীতে আসার পর যারা আল্লাহর পথনির্দেশনা মেনে চলবে, তাদের কোনো চিন্তা ও ভয় থাকবে না। আর যারা অমান্য করবে, তারা জাহান্নামে নিক্ষিপ্ত হবে। কুরআন মাজীদে এ প্রসঙ্গে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا ۖ فَإِمَّا يَأْتِيَنَّكُمْ مِنِّي هُدًى فَمَنْ تَبِعَ هُدَايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ۝ وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَابُ النَّارِ هُمْ فِيهَا خَالِدُونَ.</div></div><p>হযরত আদম (আ) পৃথিবীতে আগমনের পর আল্লাহর নিকট ক্ষমা প্রার্থনা করে দীর্ঘদিন অতিবাহিত করলেন। বিভিন্ন বর্ণনা থেকে জানা যায়, প্রায় সাড়ে তিনশত বছর হযরত আদম (আ) ও তাঁর স্ত্রী আল্লাহর নিকট ক্ষমা চেয়ে অবশেষে ক্ষমা পেয়েছিলেন। মহান আল্লাহ তাঁদের ক্ষমা প্রার্থনার পদ্ধতি শিখিয়ে দিলেন এবং ক্ষমা করলেন। এরপর হযরত আদম ও হাওয়া (আ) পৃথিবীতে স্বাভাবিক জীবনযাপন শুরু করলেন। তাঁদের ঔরসে প্রথম মানব সন্তান পৃথিবীতে এল। আল্লাহর নির্দেশে তিনি সন্তানদের নামকরণ, লালনপালন ও প্রাসঙ্গিক দায়িত্বসমূহ পালন করলেন। সাথে সাথে তাদেরকে আল্লাহর আদেশ, তাঁর নিষেধ এবং ইবাদতের পদ্ধতি অবহিত করলেন। আর এভাবেই পৃথিবীতে ইসলামী দাওয়াত-এর যাত্রা শুরু হলো।</p><p>সুতরাং উল্লিখিত আলোচনায় প্রতীয়মান হয় যে, পৃথিবীর প্রথম মানব হযরত আদম (আ)-এর বংশধারা বিস্তৃত হওয়ার সাথে সাথে পৃথিবীতে ইসলামী দাওয়াতের উৎপত্তি ঘটে। আর তিনি এ দাওয়াতের প্রথম দায়ী হিসেবে দায়িত্ব পালন করেন।</p><div class=\"h hd\">ইসলামী দাওয়াতের ক্রমবিকাশ</div><p>ইসলামী দাওয়াহ মৌলিকভাবে দুটি বিশেষ ধারায় বিকশিত হয়েছে। যথা— ক. নবুয়তিধারা, খ. খেলাফতিধারা।</p><p>মহানবী (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">س</span>) তাঁর এক বাণীতে ইসলামী দাওয়াহ বিকাশের এ ধারা দুটি সম্পর্কে আলোকপাত করেছেন। তিনি বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كَانَتْ بَنُو إِسْرَائِيلَ تَسُوسُهُمُ الْأَنْبِيَاءُ، كُلَّمَا هَلَكَ نَبِيٌّ خَلَفَهُ نَبِيٌّ، وَإِنَّهُ لَا نَبِيَّ بَعْدِي، وَسَيَكُونُ خُلَفَاءُ.</div></div><p>অর্থাৎ, ইসরাঈল জাতির নেতৃত্ব দিতেন আল্লাহর নবীগণ। যখন কোনো নবী ইন্তেকাল করতেন, তখন নতুন নবী তাঁর স্থলাভিষিক্ত হতেন। কিন্তু আমার পরে আর কোনো নবী হবে না; হবে কেবল খলিফা। নিম্নে ধারা দুটির বিস্তারিত আলোচনা পেশ করা হলো—</p><div class=\"h hd2\">ক. দাওয়াহ বিকাশের নবুয়তিধারা</div><p>হযরত আদম (আ) থেকে শুরু করে মহানবী (স) পর্যন্ত সময়ে পৃথিবীতে যুগে যুগে অসংখ্য নবী রাসূল আগমন করেছেন। আল্লাহর এ নবী রাসূলগণ প্রত্যেকে পর্যায়ক্রমে পৃথিবীতে ইসলামী দাওয়াতের কাজে নিজেদেরকে নিরন্তর সম্পৃক্ত রেখেছেন এবং দাওয়াতের ধারাকে উৎপত্তির ধারা থেকে ক্রমান্বয়ে পূর্ণতার ধারায় নিয়ে গেছেন। কুরআন মাজীদে এ প্রসঙ্গে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">شَرَعَ لَكُمْ مِنَ الدِّينِ مَا وَصَّىٰ بِهِ نُوحًا وَالَّذِي أَوْحَيْنَا إِلَيْكَ وَمَا وَصَّيْنَا بِهِ إِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَىٰ ۖ أَنْ أَقِيمُوا الدِّينَ وَلَا تَتَفَرَّقُوا فِيهِ.</div></div><p>উল্লেখ্য, অন্যান্য বিষয়ের উৎপত্তি ও ক্রমবিকাশ বলতে যে রকম ধারাবাহিকতা ও কার্যক্রমের কথা বোঝানো হয়, ইসলামী দাওয়াতের ক্ষেত্রে তা প্রযোজ্য হয় না। কারণ মৌলিক দিক থেকে ইসলামী দাওয়াহ হযরত আদম (আ)-এর সময় যেমন ছিল হযরত মুহাম্মদ (স)-এর সময়ে এসেও তার কোনো ব্যত্যয় ঘটেনি। প্রত্যেক নবী রাসূলই তাওহীদ, রিসালাত ও আখেরাত এ তিনটি মৌলিক বিষয়কে উপজীব্য করে দাওয়াত প্রদান করেছেন।</p><div class=\"h hd2\">পূর্ববর্তী নবী রাসূলগণের দাওয়াত</div><p>আল্লাহ তায়ালা মানুষকে আশরাফুল মাখলুকাত বা সৃষ্টির সেরা মর্যাদা দিয়েছেন। কিন্তু শয়তানের প্ররোচনায় মানুষ আল্লাহর এ দানের কথা ভুলে যায়। তারা বিভিন্নরকম পাপে লিপ্ত হয়। আল্লাহর বিধানের বিরোধিতা করে। ফলে তাদের জীবনে পতন ও ধ্বংস নেমে আসে। প্রিয় সৃষ্টি মানুষের এ পতন ও ধ্বংস রোধ করার জন্য আল্লাহ তায়ালা নির্বাচিত কিছু লোকদের পৃথিবীতে প্রেরণ করেন। তাদেরকে তিনি কিতাব প্রদান করেন। তাদের ওপর অহী নাযিল করেন। তাঁরা হলেন নবী ও রাসূল। কুরআনের বর্ণনালোকে এখানে কয়েকজন নবী রাসূলের দাওয়াত সম্পর্কে সংক্ষেপে আলোচনা করা হলো—</p><p><b>১. হযরত নূহ (আ)-এর দাওয়াত :</b> প্রাচীন ইরাকের কুর্দিস্থান অঞ্চলে হযরত নূহ (আ) প্রেরিত হন। তিনি দীর্ঘ ৯৫০ বছর দাওয়াতের কাজ করেন। তাঁর দাওয়াতি কাজের বর্ণনা দিয়ে মহান আল্লাহ বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَى قَوْمِهِ إِنِّي لَكُمْ نَذِيرٌ مُبِينٌ ۝ أَنْ لَا تَعْبُدُوا إِلَّا اللَّهَ إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٍ.</div></div><p><b>২. হযরত ইবরাহীম (আ)-এর দাওয়াত :</b> হযরত নূহ (আ)-এর পরে পৃথিবীর সকল মানুষের কাছে আল্লাহর দ্বীনের দাওয়াত পৌঁছে দেয়ার দায়িত্ব নিয়ে প্রেরিত হন হযরত ইবরাহীম (আ)। তিনি যখন প্রেরিত হন তখন ইরাকের উর নগরে নমরূদের পৃষ্ঠপোষকতায় বাতিল শক্তি প্রতিষ্ঠিত ছিল। তাঁর পিতাও তাদের অন্তর্ভুক্ত ছিলেন। ফলে তিনি দ্বীনের দাওয়াত শুরু করেন তাঁর পিতার কাছে দাওয়াত পেশের মাধ্যমে। কুরআন মাজীদে তাঁর দাওয়াতের বিবরণ দিয়ে আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ Āزَرَ أَتَتَّخِذُ أَصْنَامًا آلِهَةً إِنِّي أَرَاكَ وَقَوْمَكَ فِي ضَلَالٍ مُبِينٍ.</div></div><p><b>৩. হযরত হুদ (আ)-এর দাওয়াত :</b> প্রাচীন আরবের প্রভাবশালী জাতি আদের নিকট আল্লাহ তায়ালা হযরত হুদ (আ)-কে প্রেরণ করেন। তারা পাপাচারে লিপ্ত ছিল। তাদের কাছে প্রেরিত হয়ে হযরত হুদ (আ) দ্বীনের দাওয়াত পেশ করেন।</p><p><b>৪. হযরত সালেহ (আ)-এর দাওয়াত :</b> প্রাচীন আরবের একটি অন্যতম প্রভাবশালী জাতি ছিল সামূদ। আল্লাহর আইন লঙ্ঘন করে তারা পাপাচার ও অনাচারে ডুবে গিয়েছিল। তাদের কাছে আল্লাহ তায়ালা হযরত সালেহ (আ)-কে প্রেরণ করেন। সালেহ (আ) তাদের নিকট দ্বীনের দাওয়াত পেশ করেন। তাঁর দাওয়াতের উল্লেখ করে আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِلَى ثَمُودَ أَخَاهُمْ صَالِحًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ.</div></div><p><b>৫. হযরত শুয়াইব (আ)-এর দাওয়াত :</b> হযরত শুয়াইব (আ) প্রেরিত হয়েছিলেন মাদায়েনবাসীর নিকট। মাদায়েনবাসী ওজনে কমবেশি করার পাপে অভ্যস্ত ছিল। তাদের জন্য শুয়াইব (আ)-এর দাওয়াতে এ সম্পর্কে নির্দেশিত ছিল। তাঁর দাওয়াতের কথা উল্লেখ করে আল্লাহ বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِلَى مَدْيَنَ أَخَاهُمْ شُعَيْبًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَهٍ غَيْرُهُ وَلَا تَنْقُصُوا الْمِكْيَالَ وَالْمِيزَانَ إِنِّي أَرَاكُمْ بِخَيْرٍ وَإِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ مُحِيطٍ.</div></div><p><b>৬. হযরত ইউসুফ (আ)-এর দাওয়াত :</b> হযরত ইউসুফ (আ)-এর দাওয়াতি এলাকা ছিল মিসর। আল্লাহ তায়ালা তাঁকে মিসরে নবী হিসেবে প্রেরণ করেছিলেন। সেখানে তিনি আল্লাহর নির্দেশনা অনুসারে দাওয়াতি কাজ পরিচালনা করেন।</p><p><b>৭. হযরত মুসা (আ)-এর দাওয়াত :</b> হযরত মুসা (আ)-কে আল্লাহ তায়ালা ফিরাউন ও তার জাতির কাছে প্রেরণ করেছিলেন। বিশেষত ইসরাঈল জাতির মুক্তির জন্য তিনি প্রেরিত হয়েছিলেন। প্রেরিত হওয়ার পর আল্লাহর নির্দেশ অনুসারে তিনি ফিরাউন ও তাঁর অনুসারী এবং ইসরাঈল জাতির কাছে দ্বীনের দাওয়াত পেশ করেন।</p><p><b>৮. হযরত ঈসা (আ)-এর দাওয়াত :</b> রাসূল (স)-এর সবচেয়ে নিকটতম পূর্ববর্তী রাসূল হলেন হযরত ঈসা (আ)। তিনি সমকালীন বিশ্বের সকল মানুষ বিশেষত ইসরাঈল জাতির কাছে প্রেরিত হয়েছিলেন। নিতান্তই শৈশব থেকে তিনি দাওয়াতে দ্বীনের কাজ শুরু করেন। কুরআন মাজীদে তাঁর দাওয়াতি কাজের বিবরণ দিয়ে ইরশাদ হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا ۝ وَجَعَلَنِي مُبَارَكًا أَيْنَ مَا كُنْتُ وَأَوْصَانِي بِالصَّلَاةِ وَالزَّكَاةِ مَا دُمْتُ حَيًّا.</div></div><p><b>৯. বিশ্বনবী মুহাম্মদ (স)-এর দাওয়াত :</b> হযরত ঈসা (আ)-এর যুগ শেষ হওয়ার প্রায় ছয় শতাব্দী পর সর্বশেষ ও সর্বশ্রেষ্ঠ রাসূল বিশ্বনবী হযরত মুহাম্মদ (স)-কে আল্লাহ তায়ালা কুফর, শিরক, নেফাক, ফিসক, অজ্ঞতা ও জুলুমের বিরুদ্ধে শাশ্বত সত্য ও সুন্দরের দাওয়াতসহ প্রেরণ করেন। আল্লাহর নির্দেশে মহানবী (স) তাঁর গোটা জীবন উৎসর্গ করেন দাওয়াতের চিরায়ত কাজে। তাঁর নিরন্তর সাধনায়, অবিরাম শ্রমে, অবিশ্রান্ত চেষ্টায়, অন্তহীন ত্যাগে এভাবে ইসলামী দাওয়াহ সর্বাঙ্গীণ পূর্ণতা অর্জন করতে সক্ষম হয়।</p><div class=\"h hd2\">খ. দাওয়াহ বিকাশের খেলাফতিধারা</div><p>মহানবী (স)-এর ওফাতের পর ইসলামী দাওয়াতের যে বিকাশধারা তাকে খেলাফতি ধারার বিকাশ হিসেবে চিহ্নিত করা যায়। কেননা পরবর্তীকালে যারা দাওয়াতের কাজ করেছেন তাঁরা রাসূল (স)-এর খলিফা হিসেবেই দাওয়াতি কাজ আঞ্জাম দিয়েছেন। দাওয়াতের খেলাফতি ধারার বিকাশে পাঁচটি যুগের কথা বিশেষভাবে উল্লেখ করা যায়। এগুলো হলো—</p><p>১. খোলাফায়ে রাশেদীনের যুগ,</p><p>২. উমাইয়া যুগ,</p><p>৩. আব্বাসীয় যুগ,</p><p>৪. আব্বাসীয় পরবর্তী যুগ এবং</p><p>৫. আধুনিক যুগ।</p><p>নিম্নে এ সম্পর্কে সংক্ষেপে আলোচনা পেশ করা হলো—</p><p><b>খোলাফায়ে রাশেদীনের যুগে ইসলামী দাওয়াতের বিকাশধারা :</b> মহানবী (স)-এর ওফাতের পর তাঁর সাহাবীগণ কুরআন সুন্নাহর শিক্ষা এবং তাঁর জীবনাদর্শকে ধারণ করে পৃথিবীর দিগদিগন্তে ছড়িয়ে পড়েন। কুরআন মাজীদের ভাষা, বর্ণনার অলৌকিকত্ব, মহানবী (স)-এর বাণী ও জীবনচরিতের অনন্যতা পৃথিবীর মানুষকে ইসলামগ্রহণের জন্য অনুপ্রাণিত করে। খোলাফায়ে রাশেদার চার সদস্য যথাক্রমে হযরত আবু বকর, ওমর, ওসমান ও আলী (রা) এক্ষেত্রে সামনে থেকে নেতৃত্ব প্রদান করেন। তাঁদের যুগে ইসলামী দাওয়াতের কাজ ব্যক্তিগত ও রাষ্ট্রীয় উদ্যোগে পরিচালিত হতো।</p><p><b>উমাইয়া যুগে ইসলামী দাওয়াতের বিকাশধারা :</b> খোলাফায়ে রাশেদীনের মহান যুগ শেষে মুসলিম বিশ্বে উমাইয়ারা ইসলামী আদর্শ ও নীতি-দর্শন বিরুদ্ধ রাজতান্ত্রিক শাসন প্রচলন করে। ফলে রাষ্ট্রীয়ভাবে ইসলামী দাওয়াতের ধারাকে আরো এগিয়ে নিয়ে যাওয়ার সুযোগ অনেকাংশে রুদ্ধ হয়ে পড়ে। তবে সেসময় মহানবী (স)-এর সাহাবীগণের অনুসরণে তাবেয়ীগণ ইসলামী দাওয়াতের দায়িত্ব পালন করেন।</p><p><b>আব্বাসীয় যুগে ইসলামী দাওয়াতের বিকাশধারা :</b> ৭৫০ খ্রিস্টাব্দে উমাইয়াদের হটিয়ে আব্বাসীয়রা ক্ষমতাসীন হয়। এ সময়ে জ্ঞানবিজ্ঞানের বিভিন্ন ক্ষেত্রে মুসলিম মনীষীগণ রাষ্ট্রীয় পৃষ্ঠপোষকতা লাভ করলেও ইসলামী দাওয়াতের কাজে নানারকম বাধার সম্মুখীন হয়েছেন। শাসক গোষ্ঠীর বাধা উপেক্ষা করে ইমাম আবু হানীফা, ইমাম মুহাম্মদ, সুফিয়ান সাওরী, ফুদাইল ইবনে ইয়াদ, জুনায়েদ বোগদাদী প্রমুখ মনীষীগণ দাওয়াতি কাজে অসামান্য অবদান রাখেন। এছাড়া হযরত আবদুল কাদের জিলানী (র)-এর দাওয়াতে অসংখ্য মানুষ ইসলামগ্রহণ করেন।</p><p><b>আব্বাসীয় পরবর্তী যুগে ইসলামী দাওয়াতের বিকাশধারা :</b> আব্বাসীয়দের পতনের পর তাতাররা রাষ্ট্রক্ষমতা গ্রহণ করে এবং বাগদাদসহ মুসলিম বিশ্বের সর্বত্র ধ্বংসযজ্ঞ পরিচালনা করে। এ সময়ে আল্লাহর পথে জীবন উৎসর্গ করার প্রত্যয় নিয়ে ইসলামী দাওয়াহ-এর ঝাণ্ডা উড্ডীন করেন ইমাম ইবনে তাইমিয়া (র)। তাঁর প্রাণান্তকর চেষ্টায় সিরিয়া ও মিসরে মুসলমানগণ তাতারদের প্রতিহত করতে সক্ষম হন। পরবর্তী সময়ে তাতারগণ ইসলামগ্রহণ করলে ইসলামী দাওয়াতের উজ্জ্বলতম নতুন অধ্যায় রচিত হয়।</p><p><b>আধুনিক যুগে ইসলামী দাওয়াতের বিকাশধারা :</b> হিজরী দশম শতকে মুসলিম উম্মাহ রাজনৈতিক ভাগ্য বিপর্যয়ের শিকার হলে বিভিন্ন দেশে ইসলামের দায়ীগণ নিজেদের অর্থসম্পদ ও জীবন কুরবানি দিয়ে দাওয়াতের ধারা অব্যাহত রাখেন। ভারতবর্ষে শায়খ আহমদ সিরহিন্দী ইসলামী দাওয়াতের কাজে অগ্রণী ভূমিকা পালন করেন। এরপর বাংলা, বিহার এবং উড়িষ্যায় ইসলাম প্রচার ও প্রতিষ্ঠা এবং বিদয়াতের বিরুদ্ধে আন্দোলন গড়ে তুলতে ব্যাপক অবদান রাখেন হাজী শরীয়তুল্লাহ, মাওলানা বেলায়েত আলী, মাওলানা কারামত আলী জৌনপুরী এবং মাওলানা আবু বকর সিদ্দীক প্রমুখ। তাঁদের পাশাপাশি মাওলানা কাসেম নানুতুবী, মাওলানা রশীদ আহমদ গাঙ্গুহী, মাওলানা আশরাফ আলী থানভী, মাওলানা হুসাইন আহমদ মাদানী, সাইয়্যেদ আবুল হাসান আলী নদভী (র) প্রমুখ অনন্য অবদান রাখেন।</p><div class=\"h hd\">উপসংহার</div><p>ইসলামের উৎপত্তি ও ক্রমবিকাশের সাথে সাথে ইসলামী দাওয়াতেরও উৎপত্তি ও ক্রমবিকাশ ঘটেছে। কারণ ইসলামের উৎপত্তি ও ক্রমবিকাশের সাথে দাওয়াতের উৎপত্তি ও ক্রমবিকাশ একই সূত্রে গাঁথা। সারাবিশ্ব থেকে অদ্যাবধি ক্ষমতালিপ্সু শাসকগোষ্ঠী ইসলামী দাওয়াতের যে ধারাকে রুদ্ধ করতে চান, নির্মূল করতে চান, সেটিই ইসলামী দাওয়াতের মূলধারা। যুগে যুগে অসংখ্য মর্দে মুজাহিদ নিজেদের জান-মাল কুরবানির মাধ্যমে দাওয়াতের এ ধারাকে জীবিত রেখেছেন। কেয়ামত পর্যন্ত কোনো মানুষই ইসলামী দাওয়াতের এ ধারা রুদ্ধ করতে পারবে না।</p>"],["ইসলামী দাওয়াহর হুকুম ও বিধান। (মূল প্রশ্ন ১২)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলামের প্রচার, প্রসার ও প্রতিষ্ঠার অন্যতম প্রক্রিয়া হলো দাওয়াত. বিশ্বব্যাপী ইসলামের পতাকা উড্ডীন করার জন্য যুগে যুগে নবীরাসূলগণ দাওয়াতি কার্যক্রম করেছেন. তাঁদের অবর্তমানে এ দায়িত্ব অর্পিত হয়েছে উম্মতে মুহাম্মদীর ওপর. কাজেই নবীর উম্মত সকল মুসলিমকেই এ দায়িত্ব পালনে তৎপর হতে হবে. বিশেষ করে ইসলামী ব্যক্তিত্ব, মুসলিম নেতৃবৃন্দ ও রাষ্ট্রীয় কর্ণধারগণকে এ ব্যাপারে অগ্রণী ভূমিকা পালন করতে হবে.</p><div class=\"h hd\">দাওয়াহ-এর পরিচয়</div><div class=\"h hd3\">ক. আভিধানিক অর্থ</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّعْوَة</span>ُ শব্দটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">نَصَر</span>َ-এর মাসদার.</p><p><b>এর আভিধানিক অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> আহ্বান করা</div><div><b>২.</b> ডাকা</div><div><b>৩.</b> মনোযোগ আকর্ষণ করা</div><div><b>৪.</b> তাবলীগ বা পৌঁছানো</div><div><b>৫.</b> আমন্ত্রণ জানানো</div><div><b>৬.</b> দাবি</div><div><b>৭.</b> প্রচার</div><div><b>৮.</b> অনুরোধ</div><div><b>৯.</b> To invite</div><div><b>১০.</b> To convene</div><div><b>১১.</b> To call</div></div><p>সুতরাং যিনি আহ্বান করেন বা ডাকেন, তাকে আরবিতে বলা হয় <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> তথা আহ্বায়ক. ইংরেজিতে Convener বলা হয়.</p><div class=\"h hd3\">খ. পারিভাষিক সংজ্ঞা</div><p>আল্লাহ রাব্বুল আলামীন বিশ্বজাহানের একচ্ছত্র অধিপতি. তাঁর কোনো অংশীদার নেই. তিনি মানব ও জিন জাতিকে একমাত্র তাঁরই নির্দেশ অনুযায়ী জীবন পরিচালনার নির্দেশ দিয়েছেন. সুতরাং ইসলামী জীবনব্যবস্থার দিকে আহ্বানকেই 'ইসলামী দাওয়াত' বলে.</p><p>মুসলিম পণ্ডিতবর্গ ইসলামী দাওয়াহ'র সংজ্ঞা নিরূপণে বিভিন্ন মতামত ব্যক্ত করেছেন; যার কারণে ইসলামী দাওয়াহ প্রসঙ্গে ব্যাপক ধারণা পাওয়া যায়.</p><p><b>১.</b> <span class=\"sc\">শায়খুল ইসলাম আল্লামা ইবনে তাইমিয়া (রহ:) বলেন</span>—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الدَّعْوَةُ إِلَى اللَّهِ هِيَ الدَّعْوَةُ إِلَى الْإِيمَانِ بِهِ وَبِمَا جَاءَتْ بِهِ رُسُلُهُ بِتَصْدِيقِهِمْ فِيمَا أَخْبَرَنَا بِهِ وَطَاعَتِهِمْ فِيمَا أَمَرُوا.</div></div><p>অর্থাৎ, দাওয়াত ইলাল্লাহ হলো আল্লাহ তায়ালার প্রতি এবং তাঁর রাসূলগণ যা আনয়ন করেছেন তার প্রতি দৃঢ়বিশ্বাস স্থাপন, তাঁরা যেসব বিষয়ের সংবাদ প্রদান করেছেন সেগুলোর সত্যতা প্রতিপাদন, তাঁরা যেসব বিষয়ের প্রতি নির্দেশ দিয়েছেন সেগুলোর প্রতি আনুগত্যের আহ্বান জানানো.</p><p><b>২.</b> <span class=\"sc\">আল্লামা ইবনে কাসীর (রহ:) বলেছেন</span>—</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">لَا إِلٰهَ إِلَّا اللّٰه</span>ُ-এর প্রতি আহ্বান করাকেই দাওয়াত বলা হয়.</p><p><b>৩.</b> <span class=\"sc\">আল আযহার বিশ্ববিদ্যালয়ের প্রফেসর ড. আহমদ গালুশ বলেন</span>—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الدَّعْوَةُ إِلَى الْإِسْلَامِ تَعْنِي الْمُحَاوَلَةَ الْعَمَلِيَّةَ أَوِ الْقَوْلِيَّةَ لِإِمَالَةِ النَّاسِ إِلَيْهِ.</div></div><p>অর্থাৎ, মানুষকে ইসলামের দিকে নিয়ে আসার জন্য কার্যত বা বাচনিক সকল প্রচেষ্টার অপর নাম ইসলামী দাওয়াত.</p><p><b>৪.</b> <span class=\"sc\">মুহাম্মদ আবুল ফাতাহ আল বায়ানুনী বলেন</span>—</p><p>দাওয়াত হলো মানুষের নিকট ইসলাম ও তার শিক্ষা প্রচার করা এবং বাস্তব জীবনে এর সমন্বয় সাধন করা.</p><p><b>৫.</b> <span class=\"sc\">কেউ কেউ মনে করেন</span>—</p><p>ইসলামী দাওয়াত বলতে শুধু ওয়ায নসীহত কিংবা মসজিদ মহল্লায় গিয়ে নামায রোযার কথা বলা বা অমুসলিমদেরকে ইসলাম কবুল করার আহ্বান জানানো কিংবা তাদের নিকট ইসলাম পেশ করাকে বোঝায়. মূলত এগুলো হলো দাওয়াতের অংশবিশেষ. দাওয়াত আরো ব্যাপক কর্মসূচি ও কর্মপ্রচেষ্টার সমষ্টির নাম. মোটকথা, দাওয়াত বলতে বোঝায়, আল্লাহর দিকে মানুষকে আহ্বান জানানো, যাতে তারা গায়রুল্লাহর অনুসরণ বাদ দিয়ে আল্লাহর পথে ধাবিত হয়. তাগুত নামক অপশক্তিকে হৃদয় মন থেকে মুছে আল্লাহর গুণে গুণান্বিত হয়ে ইহকালের শান্তি ও পরকালের কল্যাণে ব্রতী হয়.</p><div class=\"h hd\">ইসলামী দাওয়াহর হুকুম</div><p>ইসলামী দাওয়াহর হুকুম ফরযে আইন নাকি ফরযে কেফায়া, এ ব্যাপারে শরীয়ত বিশেষজ্ঞ ওলামায়ে কেরামের বক্তব্য হচ্ছে, ইসলামী দাওয়াহ-এর কাজ প্রতিটি মুসলিম নারী-পুরুষের ক্ষমতা ও যোগ্যতা অনুসারে করা ফরযে আইন তথা সবার জন্য ফরয. এজন্য যারা সমাজে ও রাষ্ট্রে দায়িত্ব ও ক্ষমতায় রয়েছেন তাদের জন্য এ দায়িত্ব অধিকাংশ ক্ষেত্রে ফরযে আইন. দায়িত্ব ও ক্ষমতা যত বেশি, দাওয়াত, আদেশ ও নিষেধের দায়িত্বও তত বেশি. তাছাড়া আল্লাহর কাছে জবাবদিহিতার ভয়ও তাদের তত বেশি. আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الَّذِينَ إِنْ مَكَّنَّاهُمْ فِي الْأَرْضِ أَقَامُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَأَمَرُوا بِالْمَعْرُوفِ وَنَهَوْا عَنِ الْمُنْكَرِ وَلِلَّهِ عَاقِبَةُ الْأُمُورِ.</div></div><p>অর্থাৎ, যাদেরকে আমি পৃথিবীতে প্রতিষ্ঠা দান করলে বা ক্ষমতাবান করলে তারা সালাত কায়েম করে, যাকাত প্রদান করে, সৎকাজের আদেশ দেয় এবং অসৎ কাজে নিষেধ করে. আর সকল কর্মের পরিণাম আল্লাহরই নিকটে রয়েছে.</p><p>এজন্য এ বিষয়ে শাসকগোষ্ঠী, প্রশাসনের সাথে জড়িত ব্যক্তিবর্গ, আঞ্চলিক প্রশাসকবর্গ, বিচারকবর্গ, আলেমগণ, বুদ্ধিজীবীগণ এবং সমাজের অন্যান্য প্রভাবশালী ব্যক্তিবর্গের দায়িত্ব অন্যদের চেয়ে বেশি, তাদের জন্য আশঙ্কাও বেশি. তাদের মধ্যে কেউ যদি দায়িত্ব পালন না করে চুপচাপ থাকেন, তবে তার পরিণতি হবে কঠিন ও ভয়াবহ.</p><p>অনুরূপভাবে নিজের পরিবার-পরিজন, অধীনস্থ লোকজন ও নিজের প্রভাবাধীন মানুষদের ইসলামী দাওয়াত দেয়া এবং আদেশ-নিষেধ করা গৃহকর্তা বা কর্মকর্তার জন্য ফরযে আইন. কারণ আল্লাহ তাকে এদের ওপর ক্ষমতাবান ও দায়িত্বশীল করেছেন এবং তিনি তাকে এদের বিষয়ে জিজ্ঞাসাবাদ করবেন. যেমন হাদীসে এসেছে, রাসূল (স) ইরশাদ করেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَلَا كُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِهِ - فَالْإِمَامُ رَاعٍ وَهُوَ مَسْئُولٌ عَنْ رَعِيَّتِهِ.</div></div><p>অর্থাৎ, সাবধান! তোমরা সকলেই অভিভাবকত্বের দায়িত্বপ্রাপ্ত এবং প্রত্যেককেই তার দায়িত্বাধীনদের সম্পর্কে জিজ্ঞাসাবাদ করা হবে. নেতা, কর্তৃত্বশীল ব্যক্তি, শাসক বা প্রশাসক মানুষের ওপর দায়িত্বপ্রাপ্ত অভিভাবক. সুতরাং তাকে তার অধীনস্থ জনগণ সম্পর্কে জিজ্ঞাসাবাদ করা হবে.</p><p>কিন্তু এর অর্থ এই নয় যে, দাওয়াতি কাজ এবং অন্যায় ও অসৎ কর্মের প্রতিবাদ করা শুধু এদেরই দায়িত্ব; বরং তা সকল মুসলমানের দায়িত্ব. সমাজের যিনিই অন্যায় বা গর্হিত কোনো কর্ম দেখবেন, তার ওপরই দায়িত্ব হয়ে যাবে সাধ্য ও সুযোগমতো তার সংশোধন বা প্রতিকার করা. কেননা হাদীসে এসেছে, রাসূল (স) ইরশাদ করেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ وَذَلِكَ أَضْعَفُ الْإِيمَانِ.</div></div><p>অর্থাৎ, তোমাদের কেউ যদি কোনো অন্যায় দেখতে পায় তবে সে তাকে তার বাহুবল দিয়ে প্রতিহত করবে. যদি তাতে সক্ষম না হয়, তবে সে তার বক্তব্যের মাধ্যমে তা পরিবর্তন করবে. এতেও যদি সক্ষম না হয়, তাহলে অন্তর দিয়ে তার পরিবর্তন কামনা করবে. আর এটা হলো ঈমানের দুর্বলতম পর্যায়.</p><p>শক্তি ও সামর্থ্য থাকা সত্ত্বেও জাতির কেউ যদি অন্যায়ের প্রতিবাদ ও প্রতিরোধ না করে এবং দাওয়াতের মাধ্যমে ইসলামের সঠিক বিষয়টি তুলে না ধরে, তাহলে সে জাতির ওপর আল্লাহ তায়ালা ভয়াবহ আযাব চাপিয়ে দিবেন. যেমন হাদীসে এসেছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">عَنْ جَرِيرِ بْنِ عَبْدِ اللَّهِ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ مَا مِنْ رَجُلٍ يَكُونُ قَوْمٌ يَعْمَلُ فِيهِمْ بِالْمَعَاصِي يَقْدِرُونَ عَلَى أَنْ يُغَيِّرُوا عَلَيْهِ وَلَا يُغَيِّرُونَ إِلَّا أَصَابَهُمُ اللَّهُ مِنْهُ بِعِقَابِ قَبْلَ أَنْ يَمُوتُوا.</div></div><p>অর্থাৎ, হযরত জারীর ইবনে আবদুল্লাহ (রা) হতে বর্ণিত. তিনি বলেন, আমি রাসূলুল্লাহ (স)-কে এ কথা বলতে শুনেছি যে, যে জাতির মধ্যে কোনো এক ব্যক্তি পাপকার্যে লিপ্ত হয়, আর উক্ত জাতির লোকেরা শক্তি থাকা সত্ত্বেও তা হতে তাকে বিরত রাখে না, আল্লাহ সে জাতির ওপর মৃত্যুর পূর্বেই এক ভয়াবহ আযাব চাপিয়ে দেন.</p><p>এরপর দ্বীনি জ্ঞান ও চেতনাসম্পন্ন ব্যক্তিদের ওপর ইসলামী দাওয়াহ বা দাওয়াতি কাজ করা ফরযে আইন. কেননা আল্লাহ তায়ালা তাদের কাছ থেকে দ্বীনি জ্ঞান প্রচার-প্রসার ও তা গোপন না করার অঙ্গীকার নিয়েছেন. যেমন কুরআন মাজীদে এসেছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ أَخَذَ اللَّهُ مِيثَاقَ الَّذِينَ أُوتُوا الْكِتَابَ لَتُبَيِّنُنَّهُ لِلنَّاسِ وَلَا تَكْتُمُونَهُ فَنَبَذُوهُ وَرَاءَ ظُهُورِهِمْ وَاشْتَرَوْا بِهِ ثَمَنًا قَلِيلًا فَبِئْسَ مَا يَشْتَرُونَ.</div></div><p>অর্থাৎ, আল্লাহ যখন আহলে কিতাবদের কাছ থেকে অঙ্গীকার গ্রহণ করলেন যে, তারা মানুষের নিকট আসমানী কিতাবের জ্ঞান বর্ণনা করবে এবং তা গোপন করবে না, তখন তারা সে অঙ্গীকারকে নিজেদের পিছনে ফেলে রাখল. আর তারা সামান্য মূল্যের বিনিময়ে তা বেচাকেনা করল. সুতরাং কতই না মন্দ তাদের এ বেচনাকেনা.</p><p>এ বিষয়ের ভয়াবহতা সম্পর্কে হাদীসে এসেছে, রাসূলুল্লাহ (স) ইরশাদ করেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ سُئِلَ عَنْ عِلْمٍ فَكَتَمَهُ أَلْجَمَهُ اللَّهُ عَزَّ وَجَلَّ بِلِجَامٍ مِنَ النَّارِ يَوْمَ الْقِيَامَةِ.</div></div><p>অর্থাৎ, যে ব্যক্তিকে দ্বীনি জ্ঞান সম্পর্কে জিজ্ঞাসা করা হলো, অতঃপর সে তা গোপন রাখল, আল্লাহ তায়ালা কেয়ামতের দিন তাকে আগুনের লাগাম পরাবেন.</p><div class=\"h hd\">ইসলামী দাওয়াহ ফরযে আইন হওয়ার কারণ</div><p>শরীয়ত বিশেষজ্ঞ ওলামায়ে কেরামের দৃষ্টিতে ইসলামী দাওয়াহ ফরযে আইন হওয়ার কারণ দুটি. যথা—</p><p>১. ক্ষমতা, ২. জানা ও দেখা.</p><p><b>১. ক্ষমতা :</b> যদি কেউ ইসলামী শরীয়তবিরোধী কোনো অন্যায় কাজ সমাজে দেখতে পান এবং তিনি এ অন্যায়টির প্রতিবাদ ও প্রতিরোধ করার ক্ষমতা রাখেন, তাহলে তার জন্য তা ফরযে আইনে পরিণত হয়. পরিবারের অভিভাবক, এলাকার বা দেশের রাজনৈতিক বা প্রশাসনিক কর্মকর্তা ও নেতৃবৃন্দের জন্য এ দায়িত্বটি এ পর্যায়ে ফরযে আইন.</p><p><b>২. জানা ও দেখা :</b> যদি কেউ জানতে পারেন যে, তিনি ছাড়া অন্য কেউ অন্যায়টি দেখেনি বা জানেনি, তবে তার জন্য তা নিষেধ করা ও পরিত্যাগের জন্য দাওয়াত দেয়া ফরযে আইনে পরিণত হয়. সর্বাবস্থায় এর প্রতিবাদ, প্রতিকার ও দাওয়াত হবে সাধ্যানুযায়ী হাত দিয়ে, মুখ দিয়ে বা অন্তর দিয়ে.</p><div class=\"h hd\">অক্ষমতায় ইসলামী দাওয়াতের হুকুম</div><p>উপরে উল্লিখিত আয়াতে কুরআন ও হাদীস থেকে স্পষ্টরূপে জানা যায় যে, ক্ষমতা থাকা না থাকার ভিত্তিতে ইসলামী দাওয়াতের দায়িত্ব ব্যক্তির ওপর বর্তাবে. এজন্য ফকীহগণ বলেছেন, ব্যক্তির সামর্থ্য ও ক্ষমতা না থাকলে ইসলামী দাওয়াত ও আদেশ-নিষেধের এ দায়িত্বটি সাধারণভাবে ফরযে কিফায়া. এ অবস্থায় যদি সমাজের একাধিক মানুষ কোনো অন্যায় বা শরীয়তবিরোধী কর্মের কথা জানতে পারেন বা দেখতে পান, তাহলে তার প্রতিবাদ বা প্রতিকার করা তাদের সকলের ওপর ফরযে কিফায়া. অর্থাৎ কিছু সংখ্যক মানুষ করলে সবাই পাপমুক্ত হয়ে যাবে. আর যদি কেউ না করে তাহলে সকলেই গুনাহগার হবে. এ বিষয়ে কুরআন মাজীদে মহান আল্লাহ বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ.</div></div><p>অর্থাৎ, আর তোমাদের মধ্যে এমন একটি দল অবশ্যই থাকতে হবে, যারা মানুষকে কল্যাণের পথে আহ্বান জানাবে, সৎকাজের আদেশ দেবে এবং অসৎ কাজে বাধা দেবে, আর তারাই সফলকাম.</p><p>অপর আয়াতে আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كُنْتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنْكَرِ وَتُؤْمِنُونَ بِاللَّهِ.</div></div><p>অর্থাৎ, তোমরাই হলে সর্বোত্তম উম্মত. মানবজাতির কল্যাণের জন্যই তোমাদের উদ্ভব ঘটানো হয়েছে. তোমরা মানুষকে সৎকাজের আদেশ দিবে ও অন্যায় কাজে বাধা দিবে এবং আল্লাহর প্রতি ঈমান আনবে.</p><div class=\"h hd\">উপসংহার</div><p>আল্লাহর যমীনে তাঁর দ্বীন প্রতিষ্ঠার ক্ষেত্রে ইসলামী দাওয়াতের গুরুত্ব অপরিসীম. এটি নবী রাসূলগণের মিশন. কাজেই নবী রাসূলগণের উত্তরসূরি হিসেবে এ মহান দায়িত্ব পালন করা সকল মুসলমানের ওপরই বাধ্যতামূলক. বিশেষ করে ইসলামী ব্যক্তিত্ব, মুসলিম নেতৃবৃন্দ, সমাজের ক্ষমতাবান ব্যক্তি ও রাষ্ট্রীয় কর্ণধারদের ওপর এ দায়িত্বপালন করা ফরযে আইন আর অন্যদের জন্য ফরযে কিফায়া.</p>"],["ইসলামী দাওয়াহর লক্ষ্য ও উদ্দেশ্য। (মূল প্রশ্ন ২২)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলাম একমাত্র শান্তি ও কল্যাণের ধর্ম. এ ধর্মের যথাযথ প্রচার, প্রসার ও প্রতিষ্ঠার একমাত্র উপায় হলো ইসলামী দাওয়াহ. যুগে যুগে আল্লাহ তায়ালা পৃথিবীর মানুষের ইহকালীন শান্তি ও পরকালীন মুক্তির জন্য যেসব নবী রাসূল প্রেরণ করেছেন, তাঁরা প্রত্যেকেই শান্তির ধর্ম ইসলামের প্রচার ও প্রসার করেছেন. নবী রাসূলগণের পর এ গুরুদায়িত্ব অর্পিত হয়েছে নায়েবে রাসূল আলেমসমাজ ও সমগ্র মুসলিম উম্মাহর ওপর. নিম্নে প্রশ্নালোকে ইসলামী দাওয়াহ-এর লক্ষ্য ও উদ্দেশ্য সম্পর্কে আলোচনা করা হলো.</p><div class=\"h hd\">ইসলামী দাওয়াহর লক্ষ্য</div><p>ব্যক্তিগত বা জাতিগত স্বার্থসিদ্ধি, বৈষয়িক লাভ, অর্থ-বিত্ত ও ক্ষমতা অর্জন ইত্যাদি কোনো লক্ষ্যে ইসলামী দাওয়াহ পরিচালিত হবে না. ইসলামী দাওয়াহ-এর সুনির্দিষ্ট ও সুদূরপ্রসারী লক্ষ্য রয়েছে. যেমন—</p><p><b>আল্লাহর ইবাদত প্রবর্তন :</b> আল্লাহ তায়ালা মানবজাতিকে তাঁর ইবাদতের জন্য সৃষ্টি করেছেন. পার্থিব জীবনে আল্লাহ মানুষকে যা করার আদেশ দিয়েছেন সেগুলো করা এবং যা থেকে বিরত থাকার আদেশ দিয়েছেন তা থেকে বিরত থাকাই ইবাদত, ইসলামী দাওয়াহ-এর প্রথম লক্ষ্য হচ্ছে মানবসমাজে আল্লাহর ইবাদত প্রবর্তন করা. আল্লাহ তায়ালা নিজেই বলেছেন—</p><p><b>শান্তি প্রতিষ্ঠা :</b> মানবসমাজের বিবিধ চাহিদা পূরণের মাধ্যমে শান্তি প্রতিষ্ঠার চেষ্টা করা দাওয়াতের অন্যতম লক্ষ্য. এ বিষয়ে আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَابْتَغِ فِيمَا آتَاكَ اللهُ الدَّارَ الْآخِرَةَ وَلَا تَنْسَ نَصِيبَكَ مِنَ الدُّنْيَا وَأَحْسِنْ كَمَا أَحْسَنَ اللهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ ـ إِنَّ اللهَ لَا يُحِبُّ الْمُفْسِدِينَ.</div></div><p>আয়াতটিতে আখেরাতের লক্ষ্য অর্জনের তাগিদ দেয়া হয়েছে. দুনিয়াকে ভুলে যেতে নিষেধ করা হয়েছে. সাথে সাথে অন্যের প্রতি অনুগ্রহ করা এবং সমাজে বিশৃঙ্খলা সৃষ্টি না করার নির্দেশ দেয়া হয়েছে. এতে ইহকাল, পরকালসহ ব্যক্তি ও সমাজজীবনে শান্তি প্রতিষ্ঠার পথ বলে দেয়া হয়েছে. ইসলামী দাওয়াহ এ পথ অনুসরণের মাধ্যমে মানুষের সামগ্রিক শান্তি নিশ্চিত করতে চায়.</p><p><b>আল্লাহর দ্বীন প্রতিষ্ঠা :</b> আল্লাহর যমীনে তাঁর দেয়া দ্বীন বা জীবনব্যবস্থা প্রতিষ্ঠা করা দাওয়াতের মূল লক্ষ্য. এ পথে বাধা অপসারণ করা, আল্লাহর বিধান সমাজে চালু করা এবং সমাজে সার্বিক কর্তৃত্ব প্রতিষ্ঠা করা দ্বীন প্রতিষ্ঠার অন্তর্ভুক্ত. ইসলামী দাওয়াতের মাধ্যমে আল্লাহর দ্বীন প্রতিষ্ঠাকেই মূল লক্ষ্য হিসেবে গণ্য করা হয়. কারণ এ লক্ষ্য পূর্ণ হলে অবশিষ্ট অন্যান্য লক্ষ্যসমূহ স্বাভাবিকভাবেই পূর্ণ হয়ে যায়.</p><p><b>সত্যকে বিজয়ী করা :</b> ইসলামী দাওয়াত সত্যকে বিজয়ী করা এবং বাতিলকে নির্মূল করার লক্ষ্যে পরিচালিত হয়.</p><p><b>হেদায়াতের পথে নিয়ে আসা :</b> মানুষকে গোমরাহির পথ থেকে রক্ষা করে হেদায়াতের পথে নিয়ে আসা এবং অন্ধকার মত ও পথ থেকে আলোর পথে নিয়ে আসাই ইসলামী দাওয়াহ-এর অন্যতম লক্ষ্য. এ লক্ষ্য বাস্তবায়ন হলে মানবজাতি সকল ভ্রান্ত ধর্ম-কর্ম ও মতবাদের নিষ্পেষণ হতে মুক্ত হয়ে ইসলামের সুশীতল ছায়াতলে আশ্রয় নিতে পারে.</p><p><b>ইসলামী শিক্ষা প্রচার :</b> ইসলামী দাওয়াতের অন্যতম প্রধান লক্ষ্য হচ্ছে, ইসলামী শিক্ষার প্রচার এবং মানুষের কাছে তা পৌঁছে দেয়া. নবী রাসূলগণের দাওয়াতের লক্ষ্য এটিই ছিল.</p><p><b>প্রশিক্ষণদান ও দায়ী তৈরিকরণ :</b> ইসলামী দাওয়াতের অন্যতম লক্ষ্য হলো যারা দাওয়াত গ্রহণ করেছে তাদেরকে ইসলামের বিধিবিধান ও নীতিমালার আলোকে প্রয়োজনীয় প্রশিক্ষণ প্রদান করা. সাথে সাথে দাওয়াতের কাজ অব্যাহত রাখার জন্য নতুন নতুন দায়ী তথা দ্বীনপ্রচারক তৈরি করা. দাওয়াতের এ কাজের ইঙ্গিত দিয়ে আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنْذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ - وَاخْفِضْ جَنَاحَكَ لِمَنِ اتَّبَعَكَ مِنَ الْمُؤْمِنِينَ.</div></div><p>সুতরাং শুধু দাওয়াত দিলেই চলবে না; বরং এ দাওয়াতে যারা সাড়া দেবে তাদের সযত্নে শিক্ষা ও প্রশিক্ষণের মাধ্যমে খাঁটি মুসলিম ও দায়ীতে পরিণত করতে হবে.</p><p><b>পরিশুদ্ধতা অর্জন :</b> ইসলামী দাওয়াতের অন্যতম লক্ষ্য হলো মানুষের মনে ও সমাজের অভ্যন্তরে তাকওয়ার বীজ বপন করে ইসলামী বিধিবিধান চর্চার মাধ্যমে ব্যক্তি ও সমাজজীবনকে কুফর, শিরক, নিফাক, ফিসক ও ফাসাদের অপবিত্রতা থেকে পরিশুদ্ধ করা. সমাজ থেকে নাস্তিকতা, অংশীবাদ, অন্যায়, অবিচার ও অরাজকতা দূর করা.</p><p><b>আলোকিত মানবসমাজ গড়ে তোলা :</b> জ্ঞানবিজ্ঞান চর্চার মাধ্যমে শিক্ষা, সংস্কৃতি ও প্রযুক্তিগত উন্নয়ন সাধনে কাজ করার লক্ষ্যে ইসলামী দাওয়াত পরিচালিত হয়, যাতে সমাজের সকল স্তর ও পর্যায়ের লোক জ্ঞানালোকে উদ্ভাসিত হয়ে আলোকিত মানবসমাজ গড়ে তুলতে পারে. সামাজিক ও সাংস্কৃতিক পরিশুদ্ধতা, চারিত্রিক উৎকর্ষ ও উন্নত সভ্যতা গড়ে তোলার উপযোগী উন্নত প্রযুক্তি, প্রকৌশল এবং প্রয়োজনীয় বিষয়সমূহ আবিষ্কার ও ব্যবহার করতে পারে.</p><p><b>খেলাফতের দায়িত্বপালন :</b> পৃথিবীতে খেলাফতের দায়িত্ব পালন ইসলামী দাওয়াতের অন্যতম লক্ষ্য. আল্লাহ তায়ালা মানবসভ্যতার বিকাশ ও উন্নয়নের জন্য এবং পৃথিবী আবাদ করার জন্য তাঁর অন্যান্য সৃষ্টির তুলনায় মানুষকে বিশেষ যোগ্যতা ও প্রতিভা দান করেছেন. যাতে মানুষ তাদের মহান স্রষ্টা আল্লাহর দেয়া বিধান অনুসারে সেগুলো বাস্তবায়ন করে তাঁর ইচ্ছা পূর্ণ করতে পারে. এটাই খেলাফত বা মহান আল্লাহর কর্তৃত্বের প্রতিনিধিত্ব. কুরআন মাজীদে এ প্রসঙ্গে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الَّذِي جَعَلَكُمْ خَلَائِفَ الْأَرْضِ وَرَفَعَ بَعْضَكُمْ فَوْقَ بَعْضٍ دَرَجَاتٍ لِيَبْلُوَكُمْ فِي مَا آتَاكُمْ إِنَّ رَبَّكَ سَرِيعُ الْحِسَابِ وَإِنَّهُ لَغَفُورٌ رَحِيمٌ.</div></div><p><b>মানুষের মুক্তি ও কল্যাণ নিশ্চিত করা :</b> আল্লাহ তায়ালা মানুষকে বিশেষ মর্যাদা ও দায়িত্ব দিয়ে পৃথিবীতে প্রেরণ করেছেন. তাদের দায়িত্বের মধ্যে এটাও অন্তর্ভুক্ত যে, তারা সকলে একে অন্যের মুক্তি ও কল্যাণ নিশ্চিত করার জন্য কাজ করবে. ইসলামী দাওয়াত এ লক্ষ্য অর্জনের অন্যতম উপায়.</p><p><b>আখেরাত সম্পর্কে জ্ঞানদান :</b> মানুষ জন্মগ্রহণ করার পরপরই মানুষের জন্য সবচেয়ে শাশ্বত সত্য হিসেবে যে বিষয়টি প্রতিষ্ঠিত তা হলো মৃত্যু. মৃত্যুর মধ্য দিয়ে মানুষ একটি চিরস্থায়ী ও অনন্তকালীন জীবনে প্রবেশ করে. সে জীবনের শুরু আছে, শেষ নেই. সে জীবনের নাম আখেরাত তথা পরকাল. দাওয়াতের অন্যতম প্রধান উদ্দেশ্য হলো মানুষের কাছে আখেরাতের জ্ঞান তুলে ধরা.</p><p><b>দুনিয়ার করণীয় নির্দেশ :</b> মানুষ পৃথিবীতে চিরস্থায়ী নয়. এখানে সে একটি নির্দিষ্ট সময় পর্যন্ত অবস্থান করবে. এরপর তাকে অনন্তকালের জীবন আখেরাতে প্রবেশ করতে হবে. কিন্তু সে আখেরাতের জীবনে সুখে থাকবে নাকি দুঃখে থাকবে তা নির্ভর করবে দুনিয়ার জীবনের ওপর. সেজন্য মানুষের দুনিয়া সম্পর্কে যথাযথ জ্ঞান থাকা আবশ্যক. দাওয়াতের লক্ষ্য হলো মানুষকে দুনিয়ার জীবনের গুরুত্ব সম্পর্কে অবহিত করা এবং এখানে তার করণীয় নির্দেশ করা.</p><p><b>জান্নাত জাহান্নামের জ্ঞানদান :</b> ইসলামী দাওয়াতের অন্যতম লক্ষ্য হলো মানুষকে জান্নাত ও জাহান্নামের জ্ঞানদান করা. তাদেরকে এ বিষয়ে অবহিত করা যে, আল্লাহ তায়ালা জান্নাত ও জাহান্নাম সৃষ্টি করেছেন. দুনিয়াতে যারা ভালো কাজ করবে এবং আল্লাহর হুকুম মেনে চলবে তাদেরকে তিনি জান্নাত প্রবেশ করাবেন. আর যারা মন্দ কাজ করবে এবং তাঁর হুকুম মেনে চলবে না তাদেরকে তিনি জাহান্নামে নিক্ষেপ করবেন.</p><p><b>সত্যের পথে আহ্বান জানানো :</b> ইসলামী দাওয়াতের অন্যতম লক্ষ্য হলো, চিরন্তন সত্যের পথে মানুষকে আহ্বান জানানো. কেননা মানুষের সত্য মিথ্যা সম্পর্কে জ্ঞানের অভাব রয়েছে. যে বিষয়টিকে তার প্রবৃত্তি সমর্থন করে আর শয়তান যার প্ররোচনা দেয়— মানুষ সে কাজ করতে নিবেদিত হয়. মানুষকে প্রকৃত সত্যের জ্ঞান দেয়া এবং তার প্রতি আহ্বান জানানো তাই ইসলামী দাওয়াতের প্রধান লক্ষ্য.</p><div class=\"h hd\">ইসলামী দাওয়াহর উদ্দেশ্য</div><p>ইসলামী দাওয়াহ-এর একমাত্র উদ্দেশ্য হচ্ছে, আল্লাহর সন্তুষ্টি অর্জন করা. তাই দাওয়াত হবে একান্তভাবেই আল্লাহর দিকে. এ কারণে নিজের সুনাম, সুখ্যাতি, অর্থসম্পদ, ব্যক্তিগত বা গোষ্ঠীগত স্বার্থ কিংবা নিছক রাজনৈতিক উদ্দেশ্য চরিতার্থ করার জন্য দাওয়াত হলে তাকে ইসলামী দাওয়াত বলা যাবে না. আল্লাহ তায়ালা এজন্য অত্যন্ত স্পষ্ট করে বলে দিয়েছেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">أَدْعُ إِلَى سَبِيلِ رَبِّك</span>َ অর্থাৎ, তুমি মানুষকে তোমার প্রতিপালকের পথে আহ্বান কর.</p><p>মুসলিম জীবনের অনিবার্য কাজ ও অবিভাজ্য অংশ হলো ইসলামী দাওয়াত. এর মাধ্যমে আল্লাহর সন্তুষ্টি অর্জন করাই মুসলিমদের একমাত্র সাধনা. অবশ্য কেবল দাওয়াত নয়; বরং মুসলমানদের জন্য আল্লাহ তায়ালা যতগুলো কাজের আদেশ করেছেন, তার প্রতিটির নেপথ্য লক্ষ্যই একমাত্র আল্লাহর সন্তুষ্টি অর্জন করা. যেমন—</p><p>আনুষ্ঠানিক ইবাদতের উদ্দেশ্য ব্যাখ্যা করে আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">تَرَاهُمْ رُكَّعًا سُجَّدًا يَبْتَغُونَ فَضْلًا مِنَ اللهِ وَرِضْوَانًا سِيمَاهُمْ فِي وُجُوهِهِمْ مِنْ أَثَرِ السُّجُودِ</div></div><p>আল্লাহর সন্তুষ্টির জন্য ব্যয়ের আদেশ দিয়ে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا تُنْفِقُونَ مِنْ خَيْرٍ فَلِأَنْفُسِكُمْ وَمَا تُنْفِقُونَ إِلَّا ابْتِغَاءَ وَجْهِ اللهِ.</div></div><p>আল্লাহর সন্তুষ্টির জন্য জেহাদে বের হওয়ার বিষয়ে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنْ كُنْتُمْ خَرَجْتُمْ جِهَادًا فِي سَبِيلِي وَابْتِغَاءَ مَرْضَاتِي تُسِرُّونَ إِلَيْهِمْ بِالْمَوَدَّةِ وَأَنَا أَعْلَمُ بِمَا أَخْفَيْتُمْ وَمَا أَعْلَنْتُمْ وَمَنْ يَفْعَلْهُ مِنْكُمْ فَقَدْ ضَلَّ سَوَاءَ السَّبِيلِ.</div></div><p>মুসলমানদের সবধরনের কাজ, চাই সামাজিক, রাজনৈতিক, অর্থনৈতিক বা ধর্মীয় যে প্রকারেরই হোক না কেন, সকল ক্ষেত্রে তার একমাত্র উদ্দেশ্য হবে আল্লাহর সন্তুষ্টি অর্জন করা. এ প্রসঙ্গে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا خَيْرَ فِي كَثِيرٍ مِنْ نَجْوَاهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَاحٍ بَيْنَ النَّاسِ وَمَنْ يَفْعَلْ ذَلِكَ ابْتِغَاءَ مَرْضَاتِ اللهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا.</div></div><p>কুরআন মাজীদে মুসলমানদেরকে তাই আল্লাহর জন্য সকল কিছু নিবেদন করার শিক্ষা দেয়া হয়েছে. বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ ۝ لَا شَرِيكَ لَهُ وَبَذَلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ.</div></div><p>অর্থাৎ, বলুন! আমার নামায, আমার কুরবানি, আমার জীবন ও আমার মৃত্যু বিশ্বজাহানের প্রতিপালকের জন্য; তাঁর কোনো শরীক নেই. আমি তাঁর প্রতি অনুগত থাকার আদেশ পেয়েছি এবং আমিই প্রথম মুসলিম.</p><p>সুতরাং ইসলামী দাওয়াতের একমাত্র উদ্দেশ্য আল্লাহর সন্তুষ্টি অর্জন করা. কারণ দাওয়াতকে জীবনে ধারণ করা এবং একে একান্তভাবে আল্লাহর সন্তুষ্টির অনুগামী করার মধ্যে মানবজীবনের পরম সৌভাগ্য ও প্রভূত কল্যাণ নিহিত.</p><div class=\"h hd\">উপসংহার</div><p>মানবজীবনে ইসলামী দাওয়াহ-এর উদ্দেশ্য ও লক্ষ্য অতি মহৎ. কাজেই একে একমাত্র আল্লাহর সন্তুষ্টি অর্জনের মাধ্যম হিসেবেই গ্রহণ করতে হবে. তাহলে উদ্দেশ্য যেমন সফল হবে, তেমনি কর্মফল লাভের ক্ষেত্রেও সফলতা অর্জন সম্ভব হবে.</p>"],["ইসলামী দায়ীর গুণাবলি ও স্তরবিন্যাস। (মূল প্রশ্ন ২৪)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলাম একটি বিশ্বজনীন শান্তি ও কল্যাণের ধর্ম. এ শান্তির ধর্মের যথাযথ প্রচার, প্রসার ও প্রতিষ্ঠার একমাত্র উপায় হলো দাওয়াত. যুগে যুগে মহান আল্লাহ বিশ্বমানবতার ইহলৌকিক শান্তি ও পারলৌকিক চিরমুক্তির জন্য যেসব নবী ও রাসূল প্রেরণ করেছেন, তাঁরা প্রত্যেকেই এ সত্য ধর্ম ইসলামের প্রচার করেছেন. নবী ও রাসূলগণের পর এ গুরুদায়িত্ব অর্পিত হয়েছে তাঁর উম্মতের ওপর. ইসলামী দায়ীর কতিপয় গুণাবলি ও স্তরবিন্যাস রয়েছে.</p><div class=\"h hd\">ইসলামী দায়ীর গুণাবলি</div><p>দাওয়াতের পদ্ধতি সামনে রেখে দাওয়াতি কাজ করাই দাওয়াতের ক্ষেত্রে একজন দায়ীর শ্রেষ্ঠ গুণ. তাছাড়া একজন ব্যক্তি হিসেবে দাওয়াতি কাজের জন্য আরো কিছু গুণ থাকা দরকার, যাকে নিম্নলিখিত ধারায় ভাগ করা যায়— ক. মানবীয় প্রকৃতি ও স্বভাবজাত গুণাবলি, খ. অর্জিত গুণাবলি, গ. জ্ঞানগত গুণাবলি, ঘ. সাংগঠনিক গুণাবলি.</p><div class=\"h hd2\">ক. মানবীয় প্রকৃতি ও স্বভাবজাত গুণাবলি</div><p><b>১. মেধাবী হওয়া :</b> যারা দাওয়াতি কাজ করবেন তাদের মেধাবী হওয়া বাঞ্ছনীয়. স্মৃতিশক্তি দুর্বল হলে অনেক সময় বিষয়বস্তু বা তার পক্ষে দলীল প্রমাণ যথাযথভাবে উপস্থাপনে অসুবিধা দেখা দিতে পারে. তাছাড়া দায়ী প্রতিভাবান হলে দাওয়াতের ক্ষেত্রে উদ্ভূত বিভিন্ন সমস্যা সমাধানের ক্ষেত্রে কার্যকরী ভূমিকা রাখা সহজ হয়. তাই মেধাশক্তি দায়ীর একটি গুরুত্বপূর্ণ গুণ.</p><p><b>২. শক্তিমত্তা :</b> দায়ীকে শক্তিশালী হওয়া বাঞ্ছনীয়. কেননা দুর্বল শরীর স্বাস্থ্যের অধিকারী হলে দাওয়াতের জন্য চলাফেরা ও বিভিন্ন দায়িত্ব পালনে সে বাধাগ্রস্ত হতে পারে. এজন্য মহানবী (স) বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الأُومِنُ الضَّعِيفُ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الْقَوِيِّ</div></div><p>অর্থাৎ, দুর্বল মুমিনের চেয়ে শক্তিশালী মুমিন আল্লাহর নিকট অধিক প্রিয়.</p><p><b>৩. আমানতের রক্ষণাবেক্ষণ :</b> আমানত রক্ষা করা মুমিনজীবনের অন্যতম বৈশিষ্ট্য. এটা ছাড়া মুমিনের পরিচয় হয় না. এ মর্মে আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ.</div></div><p>অর্থাৎ, যারা তাদের আমানত ও প্রতিশ্রুতি রক্ষা করে. তাই একজন ইসলামী দায়ীর ক্ষেত্রেও এটি একটি অপরিহার্য গুণ. এজন্য দেখা যায়, সকল নবীই নিজেদেরকে আমানতদার হিসেবে পেশ করতেন. তাঁদের বক্তব্য ছিল, আল কুরআনের ভাষায় : <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">إِنِّي لَكُمْ رَسُولٌ أَمِين</span>ٌ.</p><p><b>৪. সাহসিকতা :</b> কাপুরুষতা একজন দায়ীর গুণ নয়; বরং সাহসিকতাই ইসলামী দায়ীর গুণ. দাওয়াতি কাজটি একটি ঝুঁকিপূর্ণ কাজ. এখানে পদক্ষেপ নিতে হলে প্রয়োজন সাহসিকতা. আর এর উৎস হলো, একমাত্র আল্লাহকেই সর্বশক্তিমান হিসেবে বিশ্বাস করা. আল্লাহ ছাড়া আর কেউই দায়ীর কোনো ক্ষতি করতে পারবে না. এ থেকেই দায়ীর অন্তরে সাহসিকতা জন্ম নেয়. এ ধরনের সাহসী দায়ীই ইসলামী দাওয়াতের ক্ষেত্রে কাম্য. এ মর্মে ইরশাদ হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا مَنْ يَرْتَدَّ مِنْكُمْ عَنْ دِينِهِ فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ يُجَاهِدُونَ فِي سَبِيلِ اللَّهِ وَلَا يَخَافُونَ لَوْمَةَ لَائِمٍ ۚ ذَلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ ۚ وَاللَّهُ وَاسِعٌ عَلِيمٌ.</div></div><p>অর্থাৎ, হে মুমিনগণ! তোমাদের মধ্যে যে স্বীয় ধর্ম থেকে ফিরে যাবে, অচিরেই আল্লাহ এমন এক সম্প্রদায় সৃষ্টি করবেন, যাদেরকে তিনি ভালোবাসেন এবং তারা তাঁকে ভালোবাসবে. তারা মুসলমানদের প্রতি বিনয় নম্র হবে এবং কাফেরদের প্রতি কঠোর হবে. তারা আল্লাহর পথে জেহাদ করবে এবং কোনো তিরস্কারকারীর তিরস্কারে ভীত হবে না. আল্লাহর নবী রাসূলগণও সাহসী ভূমিকা নিতেন. যেমন আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الَّذِينَ يُبَلِّغُونَ رِسَالَاتِ اللَّهِ وَيَخْشَوْنَهُ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا اللَّهَ ۗ وَكَفَى بِاللَّهِ حَسِيبًا.</div></div><p>অর্থাৎ, সেই নবীগণ আল্লাহর পয়গাম প্রচার করতেন ও তাঁকে ভয় করতেন. তাঁরা আল্লাহ ব্যতীত অন্য কাউকে ভয় করতেন না. হিসাবগ্রহণের জন্য আল্লাহ যথেষ্ট. তাই মহানবী (স) বলেছেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">أَفْضَلُ الْجِهَادِ كَلِمَةُ حَقٍّ عِنْدَ سُلْطَانٍ جَائِر</span>ٍ.</p><p>অর্থাৎ, অত্যাচারী শাসকের সামনে হক কথা বলাই শ্রেষ্ঠ জেহাদ.</p><p><b>৫. লজ্জা ও শালীনতাবোধ :</b> লজ্জা ও শালীনতাবোধ দায়ীর এক গুরুত্বপূর্ণ গুণ. লজ্জাহীন ব্যক্তি যা ইচ্ছা তা-ই করতে পারে. সুতরাং ইসলামী মূল্যবোধ সংরক্ষণ ও উন্নত সংস্কৃতির চর্চা এবং অপরের নিকট থেকে সম্মানলাভ করতে হলে এ গুণে গুণান্বিত হতে হবে. এজন্য লজ্জা ঈমানের অঙ্গ. মহানবী (স) বলেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَان</span>ِ.</p><p><b>৬. ধৈর্য ও সংযম :</b> মানবজীবনে ধৈর্য ও সংযম প্রদর্শনের আবশ্যকতা অনস্বীকার্য. এটা দায়ীর অপরিহার্য গুণ. আর এটি দাওয়াতি কাজের মেরুদণ্ড. এ কাজে বিভিন্ন মেজাজের লোকের সাথে মিশতে হয়. কারো নিকট থেকে কটু কথা, হাসি, ঠাট্টা বিদ্রূপ শুনতে হয়. কেউ অসদাচরণ করতে পারে, অবজ্ঞা করতে পারে কিংবা দাওয়াতে কাঙ্ক্ষিত ফলাফল আসতে দেরি হতে পারে. এসব ক্ষেত্রে ধৈর্য ও সংযম ছাড়া টিকে থাকা বড় কঠিন. এজন্য আল্লাহ তায়ালার নির্দেশ হলো— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُل</span>ِ.</p><p><b>৭. ক্ষমা :</b> দায়ীকে ক্ষমা করে দেয়ার মতো মহান গুণের অধিকারী হতে হবে. এতে শ্রোতার মনের বিদ্বেষভাব দূরীভূত হয়ে দায়ীর সাথে গড়ে উঠবে এক অপূর্ব ভালোবাসা. এদিকে ইশারা করে আল্লাহ তায়ালা ইরশাদ করেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيمٌ.</div></div><p>অর্থাৎ, যার সাথে তোমার শত্রুতা আছে, সেও হয়ে যাবে তোমার অন্তরঙ্গ বন্ধু. রাসূল (স) বলেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">صِلْ مَنْ قَطَعَكَ وَاعْفُ عَمَّنْ ظَلَمَكَ وَأَحْسِنْ إِلَى مَنْ أَسَاءَ إِلَيْك</span>َ.</p><p><b>৮. স্বভাবজাত আকর্ষণ :</b> কিছু কিছু মানুষ আছে, যাদের মাঝে স্বাভাবিক আকর্ষণ থাকে. তারা অপরকে সহজেই আকৃষ্ট করতে পারে. এটা আল্লাহর মহাদান. দায়ীর মাঝে এ গুণটি থাকলে খুবই ভালো.</p><div class=\"h hd2\">খ. অর্জিত গুণাবলি</div><p><b>১. সত্যবাদিতা :</b> সত্যবাদিতা এমন এক গুণ, যার ব্যাপারে কুরআন সুন্নাহে বিশেষ গুরুত্ব দেয়া হয়েছে. কথাবার্তায় সত্যবাদিতা দায়ীর অপরিহার্য গুণ. মহানবী (স) বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">عَلَيْكُمْ بِالصِّدْقِ فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ...</div></div><p>অর্থাৎ, সত্য কথা বলা তোমাদের ওপর কর্তব্য. কেননা সত্যবাদিতা মানুষের নেক কাজের পথ উন্মুক্ত করে. আর নেক কাজ মানুষকে জান্নাতে প্রবেশ করায়.</p><p><b>২. আতিথেয়তা :</b> আতিথেয়তা একটি মহৎ গুণ. মেহমানদারীর মাধ্যমে কোনো ব্যক্তি অন্যকে সহজেই আপন করতে পারে. এর মাধ্যমে পারস্পরিক সম্পর্ক দৃঢ় হয়. বিনিময় ও লেনদেন এবং সহযোগিতার মাত্রা বৃদ্ধি পায়. তাই আল্লাহর দ্বীনের একজন দায়ীকে এ ধর্মীয় ও সামাজিক গুণটি অর্জন করতে হবে.</p><p><b>৩. দয়া মমতা :</b> দয়া মমতা আল্লাহর একটি বিশেষ গুণ; যা গোটা সৃষ্টি জগৎব্যাপী প্রসারিত. তাই একজন দায়ীকে দয়াবান হতে হবে.</p><p><b>৪. অঙ্কে ভেঙে না পড়া, আত্মনিয়ন্ত্রণ করা :</b> দায়ীকে সামান্য একটু ব্যাপারে বা অসংগতিতে কিংবা প্রতিকূল পরিবেশে ভেঙে পড়লে চলবে না. তাকে ধৈর্য ধরতে হবে. আত্মসংবরণ করতে হবে.</p><p><b>৫. তাকওয়া :</b> তাকওয়া মুমিন জীবনের মানদণ্ড. মুত্তাকী হওয়া দায়ীর বড় গুণ. দায়ী যদি পরহেযগার না হন, তবে তার আচার আচরণে অনেক বিচ্যুতি প্রকাশ পেতে পারে.</p><p><b>৬. দৃঢ় ইচ্ছাশক্তি :</b> মানুষ যা কিছু চিন্তা করে তা তার ইচ্ছাশক্তির মাধ্যমেই বাস্তবায়ন করে. এ ইচ্ছাশক্তিতে প্রবৃত্তির তাড়না, অলসতা বা আরামপ্রিয়তা বা ভীতি ইত্যাদি দিক প্রভাব বিস্তার করে.</p><p><b>৭. শুভাকাঙ্ক্ষী হওয়া :</b> দায়ীর মনে মাদউর প্রতি দরদ থাকা বাঞ্ছনীয়. দরদহীন ব্যক্তি কখনো প্রকৃত দায়ী হতে পারে না.</p><div class=\"h hd2\">গ. জ্ঞানগত গুণাবলি</div><p><b>১. অনুধাবন ও হৃদয়ঙ্গম করার ক্ষমতা :</b> দায়ীকে যে কোনো বিষয় সহজেই অনুধাবন করার ক্ষমতা অর্জন করতে হবে.</p><p><b>২. বৈচিত্র্যময় বৈশিষ্ট্যের অধিকারী মানুষ সম্পর্কে জ্ঞান :</b> এ বিশ্বে বৈচিত্র্যময় বৈশিষ্ট্যের অধিকারী মানুষ রয়েছে. তাদের মনস্তাত্ত্বিক, অর্থনৈতিক, সামাজিক ও রাজনৈতিক পরিবেশ সম্পর্কে ওয়াকিফহাল থাকতে হবে.</p><p><b>৩. দাওয়াত সম্পর্কে জ্ঞান :</b> দাওয়াতের বিষয়বস্তু, ইতিহাস, পদ্ধতি, কৌশল, মাধ্যম এবং সমসাময়িক প্রসঙ্গ সম্পর্কে ওয়াকিফহাল থাকতে হবে.</p><p><b>৪. সূক্ষ্ম দৃষ্টিভঙ্গি ও সিদ্ধান্তে পৌঁছার সামর্থ্য :</b> দাওয়াতি কাজে সূক্ষ্মদর্শী হতে হবে. বিভিন্ন দিক পর্যালোচনা, অনুসন্ধান ও বিবেচনা করে সিদ্ধান্তে পৌঁছার সামর্থ্য অর্জন করতে হবে.</p><p><b>৫. জ্ঞানের জগতে প্রাধান্য :</b> ইসলাম সম্পর্কে নিখুঁত ও বিস্তারিত জ্ঞানলাভ করতে হবে. নৈতিক দর্শন, ইসলামের মৌলিক তত্ত্ব, বিজ্ঞান, সাহিত্য, আইন ও সমাজবিদ্যার বিভিন্ন শাখায় দখল থাকতে হবে.</p><div class=\"h hd2\">ঘ. সাংগঠনিক গুণাবলি</div><p><b>১. দায়িত্ব সচেতনতা :</b> রাসূলে কারীম (স) বলেছেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">كُلُّكُمْ رَاعٍ وَكُلُّكُمْ مَسْئُولٌ عَنْ رَعِيَّتِه</span>ِ.</p><p><b>২. সাংগঠনিক শৃঙ্খলাবোধ ও সুনিপুণতা :</b> শৃঙ্খলাবোধ জাগ্রত করতে হবে এবং প্রতিটি কাজ সুশৃঙ্খল ও যথাযথভাবে পালনে অভ্যস্ত হতে হবে.</p><p><b>৩. কুরবানির মনোবৃত্তি ও প্রস্তুতি :</b> আল্লাহর দ্বীন প্রচার ও প্রতিষ্ঠা করতে হলে নিজের জানমাল কুরবানি করার মনোবৃত্তি থাকতে হবে.</p><p><b>৪. আল্লাহর প্রতি অগাধ ভালোবাসা :</b> সাংগঠনিকভাবে দাওয়াতের কাজ করতে হলে সবচেয়ে বেশি প্রয়োজন আল্লাহর প্রতি অগাধ ভালোবাসা.</p><p><b>৫. বিনয় ও আত্মসম্মানবোধ :</b> অপরের সঙ্গে চলতে গেলে বিনয় ও আত্মসম্মানবোধ বজায় রাখতে হবে.</p><p><b>৬. জেহাদী চেতনা :</b> কুপ্রবৃত্তির বিরুদ্ধে, শয়তানী কুমন্ত্রণার বিরুদ্ধে এবং তাগুতি শক্তির বিরুদ্ধে জেহাদী চেতনায় উদ্বুদ্ধ হতে হবে.</p><p><b>৭. বিচক্ষণতা ও ভারসাম্য :</b> পরিবেশ পরিস্থিতি অনুধাবন এবং মেজাজের ভারসাম্য রক্ষা করতে হবে.</p><p><b>৮. পারস্পরিক পরামর্শের মনোবৃত্তি :</b> দায়ী ও সহযাত্রীদের মধ্যে পরামর্শের ভিত্তিতে অগ্রসর হওয়া উচিত.</p><p><b>৯. ইখলাস ও আত্মসমালোচনা :</b> একমাত্র আল্লাহর সন্তুষ্টি অর্জনের জন্য কাজ করার মানসিকতা এবং আত্মসমালোচনায় অভ্যস্ততা থাকতে হবে.</p><div class=\"h hd\">উপসংহার</div><p>ইসলামে দাওয়াতের গুরুত্ব ও মর্যাদা অপরিসীম. নবী রাসূলগণের উত্তরসূরি হিসেবে এ মহান দায়িত্ব পালন করতে হলে দায়ীকে উপরোল্লিখিত গুণের অধিকারী হতে হবে এবং দাওয়াতদানের সর্বোত্তম পদ্ধতি ও কৌশল অবলম্বন করতে হবে.</p>"],["ইসলামী দাঈর পরিচয়, প্রকারসমূহ ও গুণাবলি। (মূল প্রশ্ন ২৫)","<div class=\"h hd\">উপস্থাপনা</div><p>আল্লাহ তায়ালার বাণী— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">أَدْعُ إِلَى سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَة</span>ِ. আল্লাহপ্রদত্ত ও রাসূল (স) প্রদর্শিত একমাত্র জীবনবিধান ইসলাম. ইসলামের প্রচার, প্রসার ও প্রতিষ্ঠার অন্যতম প্রক্রিয়া হলো দাওয়াত. বিশ্বব্যাপী ইসলামের পতাকা উড্ডীন করার লক্ষ্যে ইসলামের চিরন্তন শাশ্বত বিধানের প্রতি আহ্বান করা ঈমানের অনিবার্য দাবি. এ উদ্দেশ্যকে সামনে রেখেই যুগে যুগে নবী ও রাসূলগণের আগমন ঘটেছে. নবী-রাসূলদের আগমন বন্ধ হলেও দাওয়াতের কাজ বন্ধ হয়নি. নবীর অবর্তমানে এ দায়িত্ব অর্পিত হয়েছে উম্মতে মুহাম্মদীর ওপর. কাজেই কেয়ামত পর্যন্ত বিশ্ব মুসলিম উম্মাহর জন্য এ দায়িত্ব পালন করা অনস্বীকার্য.</p><div class=\"h hd\">দায়ীর পরিচয়</div><div class=\"h hd3\">ক. আভিধানিক অর্থ</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> শব্দটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَعَا</span> থেকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">فَاعِل</span>-এর এবং <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مِصْدَر</span>-এর সীগাহ. এর <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مَادَّة د-ع-و</span> জিনসে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مُعْتَل لَام</span>.</p><p><b>এর অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> আহ্বানকারী</div><div><b>২.</b> ডাকদানকারী</div><div><b>৩.</b> দাওয়াতদানকারী</div><div><b>৪.</b> আমন্ত্রণ প্রদানকারী</div><div><b>৫.</b> মনোযোগ আকর্ষণকারী</div><div><b>৬.</b> তাবলীগকারী</div></div><p>ইংরেজিতে বলা হয় Convener.</p><div class=\"h hd3\">খ. পারিভাষিক সংজ্ঞা</div><p><b>১.</b> <span class=\"sc\">ইসলামী শরীয়তের পরিভাষায়</span> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয়—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الَّذِي دَعَا النَّاسَ إِلَى الْإِسْلَامِ وَأَحْكَامِهِ بِإِعْلَانِ السَّلْطَنَةِ الْكَامِلَةِ لِلَّهِ.</div></div><p>অর্থাৎ, মহান আল্লাহর নিরঙ্কুশ ক্ষমতা ঘোষণার মাধ্যমে যিনি মানুষকে ইসলাম ও ইসলামের বিধিবিধানের প্রতি আহ্বান করেন তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয়.</p><p><b>২.</b> <span class=\"sc\">আল্লামা ইবনে কাসীর (রহ:) বলেছেন</span>—</p><p>যিনি মানুষদেরকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">لَا إِلٰهَ إِلَّا اللّٰه</span>ُ-এর প্রতি আহ্বান করেন, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয়.</p><p><b>৩.</b> <span class=\"sc\">অধিকাংশ আলেমের মতে</span>—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الَّذِي يَدْعُو كَافَّةَ النَّاسِ إِلَى حُكُومَةِ اللَّهِ وَتَنْفِيذِ أَحْكَامِهِ فِي هَذِهِ الْأَرْضِ وَإِقَامَةِ الدَّوْلَةِ الْإِسْلَامِيَّةِ عَلَى مَنْهَجِ السُّنَنِ النَّبَوِيَّةِ وَطَرِيقَةِ الْخُلَفَاءِ الرَّاشِدِينَ لِوَجْهِ اللَّهِ تَعَالَى.</div></div><p>অর্থাৎ, একমাত্র আল্লাহর সন্তুষ্টি অর্জনের উদ্দেশ্যে রাসূল (স) ও খোলাফায়ে রাশেদীনের তরিকায় এ পৃথিবীতে আল্লাহর হুকুমাত ও তাঁর বিধানাবলি এবং ইসলামী রাষ্ট্র প্রতিষ্ঠার দিকে যিনি গণমানুষকে আহ্বান করেন, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয়.</p><p><b>৪.</b> <span class=\"sc\">কতিপয় আলেম বলেছেন</span>—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الَّذِي يَدْعُو النَّاسَ إِلَى الْإِسْلَامِ وَعَقَائِدِهِ وَأَحْكَامِهِ بِإِعْلَانِ السَّلْطَنَةِ الْكَامِلَةِ لِلَّهِ عَزَّ وَجَلَّ.</div></div><p>অর্থাৎ, যিনি মহান আল্লাহর নিরঙ্কুশ ক্ষমতা ঘোষণার মাধ্যমে মানুষকে ইসলাম, এর আকায়েদ ও আহকামের প্রতি আহ্বান করেন, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয়.</p><p><b>৫.</b> <span class=\"sc\">কতিপয় ইসলামী চিন্তাবিদ বলেছেন</span>—</p><p>যিনি আল্লাহ তায়ালার বাণী প্রচারের মাধ্যমে মানুষের সাথে আল্লাহ তায়ালার যোগসূত্র স্থাপন করে দেন, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ
