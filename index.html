','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয়.</p><p><b>৬.</b> <span class=\"sc\">কেউ বলেছেন</span>—</p><p>কুরআন মাজীদের বিভিন্ন আয়াতের আলোকে জানা যায় যে, <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলা হয় তাকে যিনি ইসলামের প্রতি গণমানুষকে দাওয়াত দেন.</p><p><b>৭.</b> এক কথায়, <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">دَاعِي</span> বলতে বোঝায়, যিনি আল্লাহর দিকে মানুষকে আহ্বান জানান, যেন তারা গায়রুল্লাহর অনুসরণ বাদ দিয়ে আল্লাহর দিকে ধাবিত হয় এবং তাগুত নামক অপশক্তিকে হৃদয়মন থেকে মুছে দিয়ে আল্লাহর গুণে গুণান্বিত হয়ে ইহকালের শান্তি ও পরকালের কল্যাণে নিয়োজিত হয়.</p><div class=\"h hd\">ইসলামী দায়ীর প্রকারভেদ</div><p>ইসলামের পথে আহ্বানকারী তথা প্রত্যেক দায়ীর মূল উদ্দেশ্য হলো মানুষকে ইহকালীন কল্যাণ ও পরকালীন মুক্তির পথে আহ্বান করা. তাই এর সুনির্দিষ্ট প্রকার পাওয়া না গেলেও একে কয়েকভাগে ভাগ করা যায়. নিচে তা তুলে ধরা হলো—</p><p>১. <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى العِبَادَة</span> : ইসলামী দায়ীদের অধিকাংশই ইবাদত তথা নামায, রোযা, যাকাত, আমল ইত্যাদির মাধ্যমে মানুষকে আল্লাহ পর্যন্ত পৌঁছার পথ প্রদর্শন করে থাকেন. এ প্রকারের দায়ীদেরকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى العِبَادَة</span> তথা ইবাদতের পথে আহ্বানকারী বলা হয়.</p><p>২. <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى الجَنَّة</span> : ইসলামপন্থি কতিপয় দায়ী মানুষকে জান্নাতের দিকে আহ্বান করে থাকেন. তাদের মতে, একজন মুমিনের মূল লক্ষ্য হওয়া উচিত জান্নাত লাভ করা. জান্নাতপ্রাপ্তিই বান্দার প্রকৃত সাফল্য. এ প্রকারের দায়ীদেরকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى الجَنَّة</span> বলা হয়.</p><p>৩. <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى اللّٰه</span> : আল্লাহপ্রাপ্তিই মুমিন জীবনের বড় সাফল্য. আল্লাহকে না পেলে কোনো ইবাদত বা আমলেরই মূল্য নেই. এ প্রকারের ইসলামী দায়ীদেরকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى اللّٰه</span> বলা হয়. এ প্রসঙ্গে এক কবি সুন্দরভাবে বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">حور و غلمان جتنے نعمتہائے تو سب سے برتر نعمت دیدار تو.</div></div><p>তাসাউফের অন্যতম শীর্ষ ব্যক্তি আল্লামা শামসুল হক ফরিদপুরী (র) বলেছেন, তুমি জগতের সবকিছু পেয়েছ কিন্তু আল্লাহকে পাওনি, তবে তুমি কিছুই পাওনি.</p><p>৪. <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى التَّصَوُّف</span> : ইসলামপন্থি কিছু দায়ী এমন রয়েছেন, যারা মানুষকে সূফিবাদের পথে আহ্বান করে থাকেন. এ প্রকারের মুসলিম দায়ীদেরকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدَّاعِي إِلَى التَّصَوُّف</span> বলা হয়. এরা পীর-মুরিদিকে মূল পাথেয় মনে করে থাকেন.</p><div class=\"h hd\">দায়ীর গুণাবলি</div><p>দ্বীনি দাওয়াত একটি পবিত্র ও মহান দায়িত্ব. এ মহান দায়িত্ব পালন করতে দায়ীকে অবশ্যই আকর্ষণীয় ব্যক্তিত্ব ও বাঞ্ছিত গুণাবলির অধিকারী হতে হবে. অন্যথা দাওয়াতের মূল উদ্দেশ্য ব্যর্থ হয়ে যেতে পারে. নিম্নে কুরআন ও হাদীসের আলোকে দায়ীর প্রয়োজনীয় গুণাবলি সম্পর্কে আলোচনা পেশ করা হলো—</p><p><b>১. দ্বীনি জ্ঞান থাকা :</b> একজন দায়ীকে দ্বীনি জ্ঞানসম্পন্ন হতে হবে. তাঁকে ইসলাম ও আকায়েদ সম্পর্কে যথেষ্ট জ্ঞানের অধিকারী হতে হবে. যাতে তিনি সাধারণ মানুষের কাছে ইসলামের যাবতীয় বিধিবিধান সম্পর্কে আলোচনা ও যুক্তি উপস্থাপন করতে পারেন. এ প্রসঙ্গে কুরআন মাজীদে আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَلَوْلَا نَفَرَ مِنْ كُلِّ فِرْقَةٍ مِنْهُمْ طَائِفَةٌ لِيَتَفَقَّهُوا فِي الدِّينِ وَلِيُنْذِرُوا قَوْمَهُمْ إِذَا رَجَعُوا إِلَيْهِمْ لَعَلَّهُمْ يَحْذَرُونَ.</div></div><p>অর্থাৎ, তাদের প্রত্যেক সম্প্রদায় থেকে একদল লোক দ্বীন সম্পর্কে জ্ঞান লাভের পর তাদের নিজ নিজ সম্প্রদায়ের নিকট প্রত্যাবর্তন করে তাদের সতর্ক করে না কেন? আশা করা যায় তারা সতর্ক হবে.</p><p><b>২. দায়ীর আমল ঠিক থাকা :</b> দায়ী যা প্রচার করবেন তা অবশ্যই তাকে ব্যক্তিগতভাবে আমল করতে হবে. কারণ নবী করীম (স) সব বিষয়েই আগে নিজে আমল করতেন এবং পরে অপরকে আমল করার নির্দেশ দিতেন. এ সম্পর্কে কুরআন মাজীদে আল্লাহ তায়ালা বলেছেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُم</span>ْ...</p><p><b>৩. দায়ীর ভাষা মিষ্ট হওয়া :</b> দায়ীর ভাষা অবশ্যই মিষ্ট ও প্রাঞ্জল হতে হবে. তবেই তাঁর সুন্দর উপস্থাপনার প্রতি জনগণ আকৃষ্ট হয়ে সহজে দ্বীন বুঝতে পারবে. এ কারণে মহান আল্লাহ তায়ালা হযরত মুসা ও হারুন (আ)-কে ফিরাউনের নিকট পাঠানোর পূর্বেই বলে দিয়েছিলেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">فَقُولَا لَهُ قَوْلًا لَيِّنًا</span>...</p><p><b>৪. কথাবার্তায় যুক্তি থাকা :</b> দায়ীর কথাবার্তায় বিভিন্ন কলাকৌশল ও যৌক্তিকতা থাকতে হবে. দ্বীনের পথে মানুষকে উত্তম পন্থায় বুদ্ধিমত্তা ও যুক্তির সাথে আহ্বান করতে হবে. শ্রোতারা যেন সহজেই তার কথা বুঝতে পারে সেভাবে উপস্থাপনা করতে হবে. এ সম্পর্কে কুরআন মাজীদে আল্লাহ তায়ালা বলেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْعُ إِلَى سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ.</div></div><p>অর্থাৎ, তুমি তোমার প্রতিপালকের দিকে হেকমত ও উত্তম উপদেশের মাধ্যমে আহ্বান কর এবং উত্তম যুক্তি পেশ কর.</p><p><b>৫. বক্তৃতার মাধ্যমে আকৃষ্ট করা :</b> দায়ীকে সুন্দর ও গোছালো বক্তৃতার মাধ্যমে শ্রোতাদের আকৃষ্ট করতে হবে.</p><p><b>৬. প্রয়োজনে বক্তব্যের পুনরাবৃত্তি করা :</b> বক্তব্যের মধ্যে কোনো গুরুত্বপূর্ণ বিষয় কঠিন মনে হলে তা শ্রোতাদের সামনে একাধিকবার পুনরাবৃত্তি করতে হবে.</p><p><b>৭. শ্রোতা মানসিকতার প্রতি লক্ষ্য রাখা :</b> দায়ীকে বক্তব্য দেয়ার সময় অবশ্যই শ্রোতার মানসিকতার প্রতি লক্ষ্য রাখতে হবে.</p><p><b>৮. বল প্রয়োগ না করা :</b> দায়ী জবরদস্তি করে কারো নিকট দ্বীন প্রচার করবে না বা দাওয়াতি কাজ করবে না. কুরআন মাজীদে বলা হয়েছে— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">لَا إِكْرَاهَ فِي الدِّين</span>ِ.</p><p><b>৯. উত্তম চরিত্রের অধিকারী হওয়া :</b> দায়ীকে অবশ্যই উত্তম চরিত্র ও মহানবীর (স) আদর্শের পরিপূর্ণ অনুসারী হতে হবে.</p><p><b>১০. আল্লাহর সন্তুষ্টি অর্জনের লক্ষ্য থাকা :</b> দ্বীনের দাওয়াতদানের লক্ষ্য হতে হবে মানুষের কল্যাণ কামনা ও আল্লাহর সন্তুষ্টি অর্জন. রাসূল (স) ইরশাদ করেছেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدِّينُ النَّصِيحَة</span>ُ.</p><p><b>১১. আমলের মাধ্যমে দাওয়াত দেয়া :</b> দায়ী কথার চেয়ে আমলের মাধ্যমে বেশি বেশি দাওয়াতিকার্য পরিচালনা করবেন.</p><p><b>১২. ধৈর্যশীল হওয়া :</b> দায়ী চরম ধৈর্যশীল হবেন.</p><p><b>১৩. পরিকল্পনা গ্রহণ করা :</b> দায়ীকে পরিকল্পনাভিত্তিক দাওয়াতি কাজ করতে হবে.</p><p><b>১৪. দাওয়াতের ক্ষেত্র নির্ধারণ করা :</b> দায়ীকে দাওয়াতদানের ক্ষেত্র নির্ধারণপূর্বক দাওয়াতি কার্যক্রম চালাতে হবে.</p><p><b>১৫. অন্য ধর্ম ও ভাষা সম্পর্কে জ্ঞান থাকা :</b> দায়ীকে অবশ্যই অন্য ধর্ম ও ভাষা সম্পর্কে সম্যক জ্ঞান রাখতে হবে.</p><div class=\"h hd\">উপসংহার</div><p>ইসলামে দাওয়াতের গুরুত্ব ও মর্যাদা অপরিসীম. নবী-রাসূলগণের উত্তরসূরি হিসেবে এ মহান দায়িত্ব পালন করতে হলে দায়ীকে উপরোল্লিখিত গুণের অধিকারী হতে হবে এবং দাওয়াতদানের সর্বোত্তম পদ্ধতি ও কৌশল অবলম্বন করতে হবে.</p>"],["ইসলামী দাওয়াতের ক্ষেত্রে নবী করীম (সা.)-এর চারিত্রিক গুণাবলি। (মূল প্রশ্ন ২৯)","<div class=\"h hd\">উপস্থাপনা</div><p>বিশ্বের ইতিহাসে যে সকল মনীষী সার্বিক গুণে গুণান্বিত, তাঁদের মধ্যে মহানবী (স) অতুলনীয়. তাঁর এ মহান চারিত্রিক বৈশিষ্ট্য বিশ্বের সমগ্র মানবজাতির জন্য উত্তম আদর্শ. আল কুরআনে আল্লাহ তায়ালা ইরশাদ করেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللهِ أُسْوَةٌ حَسَنَةٌ لِمَنْ كَانَ يَرْجُو اللهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللهَ كَثِيرًا.</div></div><p>মানবজীবনের এমন কোনো দিক নেই যাতে তাঁর উত্তম আদর্শের ছোঁয়া নেই. তিনি ছিলেন একজন সফল সেনাপতি, দূরদর্শী শাসক, বিজ্ঞ রাজনীতিবিদ, আদর্শ সমাজ সংস্কারক, সংসারী ও অভিভাবক. তাঁর সমকক্ষ কোনো ব্যক্তিই হতে পারে না, আর তা আদৌ সম্ভব নয়. তাঁর তুলনা তিনি নিজেই.</p><p>মহানবী (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">س</span>)-এর চারিত্রিক গুণাবলি</p><p>একজন চরিত্রবান পুরুষ হওয়ার জন্য যে সকল গুণ থাকা প্রয়োজন সেসবের অপূর্ব সমাবেশ ঘটেছিল মহানবী (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">س</span>)-এর চরিত্রে. তাঁর চরিত্র সম্পর্কে আল্লাহ তায়ালা কুরআন মাজীদে ঘোষণা করেন, <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">وَإِنَّكَ لَعَلَى خُلُقٍ عَظِيم</span>ٍ অর্থাৎ, হে নবী! নিশ্চয় আপনি উত্তম চরিত্রের অধিকারী. মহানবী (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">س</span>)-এর চারিত্রিক গুণাবলির কতিপয় দিক নিম্নে আলোচনা করা হলো.</p><p><b>১. সর্বশ্রেষ্ঠ মানব :</b> হযরত মুহাম্মদ (স) ছিলেন ধরাপৃষ্ঠে আগত অনাগত সকল মানুষের সর্বশ্রেষ্ঠ মানব. তাঁর মতো ন্যায়নিষ্ঠা ও উন্নত চারিত্রিক গুণাবলিসম্পন্ন মানুষ পৃথিবীতে কখনো আসেনি আর ভবিষ্যতেও আসবে না.</p><p><b>২. প্রগাঢ় বিশ্বাসী :</b> তাঁর সর্বোৎকৃষ্ট চারিত্রিক গুণাবলির মূল ভিত্তি ছিল আল্লাহর প্রতি প্রগাঢ় বিশ্বাস. সুখে দুঃখে, দরিদ্র এতিম অবস্থা থেকে শুরু করে রাজ্য শাসকের মর্যাদায় উন্নীত হয়েও প্রতিটি মুহূর্তে মহানবী (স) আল্লাহর প্রতি দৃঢ়বিশ্বাসী ও নির্ভরশীল ছিলেন.</p><p><b>৩. সত্যবাদিতা ও বিশ্বস্ততা :</b> বিশ্বস্ততা ও সত্যবাদিতার জন্য মহানবী (স) বাল্যকালেই আরব সমাজে সুখ্যাতি অর্জন করেছিলেন. আরব সমাজের লোকেরা বাল্যকালে তাঁকে ‘আল আমীন’ বলে ডাকত. তিনি কঠিন বিপদেও মিথ্যার আশ্রয় নিতেন না. মহানবী (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">س</span>)-এর জীবনের প্রতিটি অধ্যায়ই সত্যবাদিতা ও বিশ্বস্ততায় পরিপূর্ণ.</p><p><b>৪. সততা ও সদানন্দ স্বভাব :</b> মহানবী (স)-এর চরিত্রের অন্যতম অলঙ্কার সততা. জীবনের কঠিন সময়ও তিনি বাস্তবতার বিপরীত কোনো পন্থ অবলম্বন করেননি. চরম বিপদেও তিনি হাসিমুখে সকলের সাথে শুভেচ্ছা বিনিময় করতেন.</p><p><b>৫. ন্যায়পরায়ণতা :</b> ন্যায়পরায়ণতা ছিল রাসূল (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">س</span>)-এর অত্যুজ্জ্বল চারিত্রিক বৈশিষ্ট্য. তিনিই পৃথিবীতে সর্বপ্রথম ন্যায়পরায়ণতার আলোকে সমাজ ও রাষ্ট্র পরিচালনা করেছেন. তিনি আত্মীয় অনাত্মীয়, ধনী গরিব, ছোট বড়, ধর্ম বর্ণ নির্বিশেষে সকল মানুষের মাঝে কোনো পার্থক্য করেননি.</p><p><b>৬. ওয়াদা পালন :</b> ওয়াদা পালন মানব চরিত্রের উত্তম গুণাবলির অন্যতম. মহানবী (স) জীবনের সর্বস্তরে ওয়াদা পালনে সচেষ্ট ছিলেন. ইসলামের শত্রুদের সাথে সম্পাদিত বিভিন্ন ওয়াদা ও সন্ধিস<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">م</span>ূহ তাঁর পক্ষ থেকে কখনো ভঙ্গ করা হয়নি.</p><p><b>৭. মার্জিত ব্যবহার :</b> মহানবী (স)-এর ব্যবহার ছিল অত্যন্ত মার্জিত. তিনি সকলের সাথে বিনয়সহ কথা বলতেন. জীবনের কোনো অংশেই তিনি কারো সাথে দুর্ব্যবহার ও রূঢ় আচরণ করেননি. তিনি শত্রুদের সাথেও বিনয়ের সাথে কথা বলতেন.</p><p><b>৮. সাহসী যোদ্ধা :</b> মহানবী (স) ছিলেন অসীম সাহসী যোদ্ধা. তিনি তাঁর দৃঢ়তা ও সাহসিকতার দ্বারা অনেক পরাক্রমশালী শত্রু বাহিনীকেও পরাস্ত করতে সক্ষম হয়েছিলেন.</p><p><b>৯. বিপ্লবী বীর :</b> মহানবী (স) ছিলেন একজন প্রখ্যাত বিপ্লবী বীর. অন্ধকারে নিপতিত আরব জাতির সামাজিক, রাজনৈতিক, ধর্মীয়, রাষ্ট্রীয় সকল ক্ষেত্রেই তিনি বৈপ্লবিক পরিবর্তন সাধন করে কৃতিত্বের স্বাক্ষর রাখেন.</p><p><b>১০. পরম ক্ষমাশীল :</b> মহানবী (স) ছিলেন পরম ক্ষমাশীল ও দয়ালু. তিনি শত্রুকে ক্ষমা করে ইসলামের দাওয়াত দিতেন. মক্কা বিজয়ের পর অত্যাচারী আরব জাতিকে তিনি সাধারণ ক্ষমা দান করে তাঁর অনুপম চরিত্রেরই বহিঃপ্রকাশ করেছেন.</p><p><b>১১. ধৈর্যশীল :</b> ধৈর্যশীলতা ছিল মহানবী (স)-এর চরিত্রের অন্যতম দিক. তিনি তায়েফে পাথরের আঘাতে জর্জরিত হওয়ার পরও ধৈর্যধারণ করে তায়েফবাসীর হেদায়াতের জন্য পরম করুণাময় আল্লাহর দরবারে প্রার্থনা করেছিলেন.</p><p><b>১২. সুদক্ষ শাসক ও কূটনীতিবিদ :</b> মহানবী (স) ছিলেন একজন সুদক্ষ শাসক ও সফল কূটনীতিবিদ. তাঁর দক্ষতা ও কূটনৈতিক জ্ঞান দিয়েই তিনি মদিনাকে বিশ্বের আদর্শ রাষ্ট্র হিসেবে প্রতিষ্ঠা করেছিলেন. হোদায়বিয়ার সন্ধি ও মদিনা সনদে তাঁর রাজনৈতিক ও কূটনৈতিক প্রজ্ঞার শ্রেষ্ঠ পরিচয় ফুটে উঠেছে.</p><p><b>১৩. উত্তম প্রতিবেশী :</b> মহানবী (স) ছিলেন প্রতিবেশীর প্রকৃত সাহায্যকারী. তিনি প্রতিবেশীদের সাথে কোমল কণ্ঠে কথা বলতেন. তাদের সুখদুঃখে, বিপদাপদে সর্বদা পাশে থাকতেন.</p><p><b>১৪. দয়ালু মহামানব :</b> অভাবগ্রস্তকে তিনি কখনো হতাশ করেননি. নিজে না খেয়েও তিনি গরিব, মুসাফির ও ক্ষুধার্তের ক্ষুধা নিবৃত্ত করতেন. শত্রুমিত্র, স্বজনপরজন, সকলের জন্য তাঁর অবারিত করুণা সমভাবে বর্ষিত হতো.</p><p><b>১৫. অনাড়ম্বর জীবন :</b> মহানবী (স) ছিলেন একজন আদর্শ সংসারকর্মী. তিনি বিশাল সাম্রাজ্যের অধিপতি হওয়া সত্ত্বেও নিজের জামা নিজেই সেলাই করতেন. মদিনার মসজিদে নববী নির্মাণের সময় তিনি নিজের মাথায় বোঝা নিয়ে সে প্রমাণ রেখেছেন. তিনি একাধারে স্নেহবান পিতা, প্রেমময় স্বামী ও ধৈর্যশীল সংসারী ছিলেন.</p><div class=\"h hd\">উপসংহার</div><p>মহানবী (স) ছিলেন মানবজাতির জন্য এক মহান আদর্শ. তাঁর চরিত্রে উত্তম মানবিক গুণাবলির সফল সমাবেশ ঘটেছিল. বিশ্বের সর্বকালের শ্রেষ্ঠ শাসক, সংস্কারক ও রাজনীতিবিদ হিসেবে যেমন তিনি খ্যাতিমান, তেমনি একজন সহজ, স্বাভাবিক, কোমল ও সুন্দর মনের মানুষ হিসেবেও তিনি সর্বকালের সর্বশ্রেষ্ঠ মহামানব.</p>"],["দায়ীর স্তরবিন্যাস ও দায়ী তৈরিকরণ পদ্ধতি। (মূল প্রশ্ন ৩০)","<div class=\"h hd\">উপস্থাপনা</div><p>যিনি দাওয়াতের কাজ করেন তাঁকে দায়ী বলে. দায়ী এমন ব্যক্তি যিনি মানুষের কাছে ইসলামের আদর্শ পৌঁছে দেন. ইসলামগ্রহণের আহ্বান জানান এবং কুরআন হাদীসের শিক্ষা প্রচার করেন. এক কথায়, ইসলামের প্রচার, প্রসার, প্রতিষ্ঠা ও সংরক্ষণে দায়ী মুখ্য ভূমিকা পালন করেন. কিন্তু যে কেউ এ কাজ করতে পারে না. এজন্য দায়ীকে বিশেষ কিছু বৈশিষ্ট্য, গুণাবলি ও আখলাকের অধিকারী হতে হয়. অর্জন করতে হয় দাওয়াতি কাজ করার যোগ্যতা, পূরণ করতে হয় কুরআন ও হাদীসের নির্ধারিত শর্তসমূহ. নিম্নে প্রশ্নালোকে আলোচনা পেশ করা হলো.</p><div class=\"h hd\">দায়ী-এর স্তরবিন্যাস</div><p>সৃষ্টির শুরু থেকে অদ্যাবধি যেসব মহামনীষী ইসলামের খেদমত করেছেন তাদের স্তর প্রথমত দু'প্রকার. যথা— ১. নবুয়তি, ২. খেলাফতি. নিম্নে বিস্তারিত আলোচনা পেশ করা হলো—</p><p><b>১. নবুয়তি :</b> হযরত আদম (আ) থেকে শুরু করে মহানবী (স) পর্যন্ত সময়ে পৃথিবীতে যুগে যুগে অসংখ্য নবী রাসূল আগমন করেছেন. আল্লাহর এ নবী রাসূলগণ প্রত্যেকে পর্যায়ক্রমে পৃথিবীতে ইসলামী দাওয়াতের কাজে নিজেদেরকে নিরন্তর সম্পৃক্ত রেখেছেন এবং দাওয়াতের ধারাকে উৎপত্তির ধারা থেকে ক্রমান্বয়ে পূর্ণতার ধারায় নিয়ে গেছেন. কুরআন মাজীদে এ প্রসঙ্গে বলা হয়েছে—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">شَرَعَ لَكُمْ مِنَ الدِّينِ مَا وَصَّى بِهِ نُوحًا وَالَّذِي أَوْحَيْنَا إِلَيْكَ وَمَا وَصَّيْنَا بِهِ إِبْرَاهِيمَ وَمُوسَى وَعِيسَى أَنْ أَقِيمُوا الدِّينَ وَلَا تَتَفَرَّقُوا فِيهِ.</div></div><p>উল্লেখ্য, অন্যান্য বিষয়ের উৎপত্তি ও ক্রমবিকাশ বলতে যে রকম ধারাবাহিকতা ও কার্যক্রমের কথা বোঝানো হয়, ইসলামী দাওয়াতের ক্ষেত্রে তা প্রযোজ্য হয় না. কারণ মৌলিক দিক থেকে ইসলামী দাওয়াহ হযরত আদম (আ)-এর সময় যেমন ছিল হযরত মুহাম্মদ (স)-এর সময়ে এসেও তার কোনো ব্যত্যয় ঘটেনি. প্রত্যেক নবী রাসূলই তাওহীদ, রিসালাত ও আখেরাত এ তিনটি মৌলিক বিষয়কে উপজীব্য করে দাওয়াত প্রদান করেছেন.</p><p><b>২. খেলাফতি :</b> মহানবী (স)-এর ওফাতের পর ইসলামী দাওয়াতের যে বিকাশধারা, তাকে খেলাফতি ধারার বিকাশ হিসেবে চিহ্নিত করা যায়. কেননা পরবর্তীকালে যারা দাওয়াতের কাজ করেছেন তাঁরা রাসূল (স)-এর খলিফা হিসেবেই দাওয়াতি কাজ আঞ্জাম দিয়েছেন. দাওয়াতের খেলাফতি ধারার বিকাশে পাঁচটি যুগের কথা বিশেষভাবে উল্লেখ করা যায়. এগুলো হলো— ১. খোলাফায়ে রাশেদীনের যুগ, ২. উমাইয়া যুগ, ৩. আব্বাসীয় যুগ, ৪. আব্বাসীয় পরবর্তী যুগ এবং ৫. আধুনিক যুগ.</p><p>নিম্নে এ সম্পর্কে সংক্ষেপে আলোচনা পেশ করা হলো—</p><p><b>১. খোলাফায়ে রাশেদীনের যুগ :</b> মহানবী (স)-এর ওফাতের পর তাঁর সাহাবীগণ কুরআন সুন্নাহর শিক্ষা এবং তাঁর জীবনাদর্শকে ধারণ করে পৃথিবীর দিগদিগন্তে ছড়িয়ে পড়েন. কুরআন মাজীদের ভাষা, বর্ণনার অলৌকিকত্ব, মহানবী (স)-এর বাণী ও জীবনচরিতের অনন্যতা পৃথিবীর মানুষকে ইসলামগ্রহণের জন্য অনুপ্রাণিত করে. খোলাফায়ে রাশেদার চার সদস্য যথাক্রমে হযরত আবু বকর, ওমর, ওসমান ও আলী (রা) এক্ষেত্রে সামনে থেকে নেতৃত্ব প্রদান করেন. তাঁদের যুগে ইসলামী দাওয়াতের কাজ ব্যক্তিগত ও রাষ্ট্রীয় উদ্যোগে পরিচালিত হতো. এ সময়ে কোনো রাষ্ট্র দখল বা ক্ষমতা বিস্তারের জন্য যুদ্ধ করা হতো না বা কোনো অভিযান পরিচালনা করা হতো না; বরং যুদ্ধ ও অভিযানের একমাত্র লক্ষ্য ছিল দাওয়াতের কাজকে ত্বরান্বিত করা.</p><p><b>২. উমাইয়া যুগ :</b> খোলাফায়ে রাশেদীনের মহান যুগ শেষে মুসলিম বিশ্বে উমাইয়ারা ইসলামী আদর্শ ও নীতি-দর্শন বিরুদ্ধ রাজতান্ত্রিক শাসন প্রচলন করে. ফলে রাষ্ট্রীয়ভাবে ইসলামী দাওয়াতের ধারাকে আরো এগিয়ে নিয়ে যাওয়ার সুযোগ অনেকাংশে রুদ্ধ হয়ে পড়ে. তবে সেসময় মহানবী (স)-এর সাহাবীগণের অনুসরণে তাবেয়ীগণ ইসলামী দাওয়াতের দায়িত্ব পালন করেন. তাঁদের মধ্যে হযরত আলী ইবনুল হুসাইন, হাসান আল মুসান্না, আবদুল্লাহ আল মাহদী, আবদুল্লাহ ইবনে ওমর, সাঈদ ইবনে মুসাইয়াব ও উরওয়া ইবনে যোবায়ের প্রমুখের নাম বিশেষভাবে উল্লেখযোগ্য. সে সময় তাঁরা সবাই ইসলামী দাওয়াতের ধারাকে বেগবান রাখার ক্ষেত্রে বিশেষ অবদান রাখেন.</p><p><b>৩. আব্বাসীয় যুগ :</b> ৭৫০ খ্রিস্টাব্দে উমাইয়াদের হটিয়ে আব্বাসীয়রা ক্ষমতাসীন হয়. এ সময়ে জ্ঞানবিজ্ঞানের বিভিন্ন ক্ষেত্রে মুসলিম মনীষীগণ রাষ্ট্রীয় পৃষ্ঠপোষকতা লাভ করলেও ইসলামী দাওয়াতের কাজে নানারকম বাধার সম্মুখীন হয়েছেন. শাসক গোষ্ঠীর বাধা উপেক্ষা করে ইমাম আবু হানীফা, ইমাম মুহাম্মদ, সুফিয়ান সাওরী, ফুদাইল ইবনে ইয়াদ, জুনায়েদ বোগদাদী, মারূফ আল কারখী এবং বিশর আল হাফী প্রমুখ মনীষীগণ দাওয়াতি কাজে অসামান্য অবদান রাখেন. এছাড়া আরো অবিস্মরণীয় অবদান রাখেন হযরত আবদুল কাদের জিলানী (র). এ যুগে তিনি ছাড়াও আরো যারা ইসলামী দাওয়াতের ধারা অবিচ্ছিন্ন রাখার ক্ষেত্রে গুরুত্বপূর্ণ ভূমিকা পালন করেন তাঁদের মধ্যে শায়খ বাহাউদ্দিন মুলতানী, আবদুর রহমান ইবনে জাওযী, সুলতান সালাহ উদ্দীন আইয়ূবী, শায়খুল ইসলাম ইযায়ুদ্দিন ইবনে সালাম এবং জালালুদ্দিন রুমী প্রমুখের নাম বিশেষভাবে উল্লেখযোগ্য.</p><p><b>৪. আব্বাসীয় পরবর্তী যুগ :</b> আব্বাসীয়দের পতনের পর তাতাররা রাষ্ট্রক্ষমতা গ্রহণ করে. তারা বাগদাদসহ মুসলিম বিশ্বের সর্বত্র অকল্পনীয় ধ্বংসযজ্ঞ পরিচালনা করে. হত্যা করে অসংখ্য পীর, মাশায়েখ ও আলেমকে. এ সময়ে আল্লাহর পথে জীবন উৎসর্গ করার প্রত্যয় নিয়ে ইসলামী দাওয়াহ-এর ঝাণ্ডা উড্ডীন করেন ইমাম ইবনে তাইমিয়া (র). তাঁর প্রাণান্তকর চেষ্টায় সিরিয়া ও মিসরে মুসলমানগণ তাতারদের প্রতিহত করতে সক্ষম হন. পরবর্তী সময়ে ইমাম ইবনে তাইমিয়া (র) এবং অপরাপর দায়ীর অবিরাম চেষ্টার তাতারগণ ইসলামগ্রহণ করলে ইসলামী দাওয়াতের উজ্জ্বলতম নতুন অধ্যায় রচিত হয়.</p><p><b>৫. আধুনিক যুগ :</b> হিজরী দশম শতকে মুসলিম উম্মাহ সত্যিকারের পতনের শিকার হয়. মুসলিম উম্মাহর রাজনৈতিক ভাগ্য বিপর্যয়ের এমন ভয়ানক দুঃসময়েও আল্লাহর দ্বীনের দাওয়াত বন্ধ ছিল না. নানা দেশে ইসলামের দায়ীগণ নিজেদের অর্থসম্পদ ও জীবন কুরবানি দিয়ে দাওয়াতের ধারা অব্যাহত রাখেন. যেমন— ভারতবর্ষে শায়খ আহমদ সিরহিন্দী (র) ইসলামী দাওয়াতের কাজে অগ্রণী ভূমিকা পালন করেন. তাঁরই পথ ধরে ইসলামী দাওয়াতের কাজে অবদান রাখেন খাজা মুহাম্মদ মাসুম, শায়খ আদম বিন নূরী, শায়খ মুহাম্মদ সাঈদ, শাহ মুহাম্মদ ইয়াহইয়া, শায়খ বদরুদ্দীন, খাজা মুহাম্মদ আকিল এবং খাজা আল্লা বখশ প্রমুখ. এরপর বাংলা, বিহার এবং উড়িষ্যায় ইসলাম প্রচার ও প্রতিষ্ঠা এবং বিদয়াতের বিরুদ্ধে আন্দোলন গড়ে তুলতে ব্যাপক অবদান রাখেন হাজী শরীয়তুল্লাহ, মাওলানা বেলায়েত আলী, মাওলানা কারামত আলী জৌনপুরী এবং মাওলানা আবু বকর সিদ্দীক প্রমুখ. তাঁদের পাশাপাশি মাওলানা কাসেম নানুতুবী, মাওলানা রশীদ আহমদ গাঙ্গুহী, মাওলানা মাহমুদুল হাসান দেওবন্দী, মাওলানা আশরাফ আলী থানভী, মাওলানা শিব্বির আহমদ ওসমানী, মাওলানা আনওয়ার শাহ কাশ্মীরী, মাওলানা শিবলী নুমানী, সাইয়্যেদ সোলায়মান নদভী, ড. মুহাম্মদ ইকবাল এবং সাইয়্যেদ আবুল হাসান আলী নদভী (র) প্রমুখের নাম বিশেষভাবে উল্লেখযোগ্য.</p><div class=\"h hd\">দায়ী তৈরিকরণ পন্থা</div><p>দ্বীনি দাওয়াত একটি পবিত্র ও মহান দায়িত্ব. এ মহান দায়িত্ব পালন করতে দায়ীকে অবশ্যই আকর্ষণীয় ব্যক্তিত্ব ও বাঞ্ছিত গুণাবলি এবং কাঙ্ক্ষিত আখলাকের অধিকারী হতে হবে; অন্যথা দাওয়াতের মূল উদ্দেশ্য ব্যর্থ হয়ে যেতে পারে. নিম্নে কুরআন ও হাদীসের আলোকে একজন দায়ীর আখলাক কিরূপ হওয়া উচিত, সে সম্পর্কে আলোচনা তুলে ধরা হলো—</p><p><b>১. খাঁটি মুসলিম হওয়া :</b> যেহেতু দায়ী ইসলাম প্রচার করবেন এবং ইসলামের প্রতি মানুষকে আহ্বান জানাবেন, কাজেই তাকে খাঁটি মুসলিম হতে হবে. ইসলামের শিক্ষা ও মূল্যবোধে তাকে পুরোপুরি ঈমান রাখতে হবে. ব্যক্তি নিজে পূর্ণাঙ্গরূপে ইসলামকে না মেনে কিংবা খাঁটি মুসলিম না হয়ে যদি ইসলাম প্রচার করেন, সে প্রচার হবে অর্থহীন. তাই একজন দায়ী প্রকৃত ও পূর্ণাঙ্গ মুসলমান হবেন.</p><p><b>২. দ্বীনি জ্ঞান থাকা :</b> একজন দায়ীকে দ্বীনি জ্ঞানসম্পন্ন হতে হবে. তাকে ইসলাম ও আকাইদ সম্পর্কে যথেষ্ট জ্ঞানের অধিকারী হতে হবে. যাতে তিনি সাধারণ মানুষের কাছে ইসলামের যাবতীয় বিধিবিধান সম্পর্কে আলোচনা ও যুক্তি উপস্থাপন করতে পারেন.</p><p><b>৩. মানবদরদী হওয়া :</b> দায়ীকে অবশ্যই মানবদরদী হতে হবে. মানুষ আল্লাহ তায়ালার হুকুম ভুলে গিয়ে ধ্বংসের পথে চলছে জেনে দায়ীর দরদী মনে তাদেরকে ধ্বংস থেকে রক্ষা করার তাগিদ থাকতে হবে.</p><p><b>৪. নির্লোভ ও ত্যাগী হওয়া :</b> দায়ীর অন্যতম আখলাক হবে তিনি অর্থসম্পদ, সুখভোগ, পরিবার পরিজন ইত্যাদি সকল বিষয়ে নির্লোভ এবং ত্যাগী হবেন. তার জীবন উৎসর্গ করবেন আল্লাহর সন্তুষ্টির কাছে.</p><p><b>৫. দায়ী নিজে আমলকারী হওয়া :</b> দায়ী যা প্রচার করবেন তা অবশ্যই তাকে ব্যক্তিগতভাবে আমল করতে হবে. কারণ নবী করীম (স) সব বিষয়েই আগে নিজে আমল করতেন এবং পরে অপরকে আমল করার নির্দেশ দিতেন.</p><p><b>৬. কথায় কাজে মিল থাকা :</b> দায়ীর একটি অন্যতম আখলাক হচ্ছে, তার কথায় ও কাজে মিল থাকবে. তিনি যা বলবেন, তা করে দেখাবেন. তার কোনো কাজই তার কথার বিপরীত হবে না.</p><p><b>৭. সত্যবাদী ও বিশ্বস্ত হওয়া :</b> দায়ী সত্যবাদী হবেন. সমাজে সত্যবাদী হিসেবে তার গ্রহণযোগ্যতা থাকবে. দায়ী বিশ্বস্ত হবেন. যে কোনো তথ্য ও লেনদেনে মানুষ তার ওপর আস্থা রাখবে.</p><p><b>৮. ভাষা মিষ্ট হওয়া :</b> দায়ীর ভাষা অবশ্যই মিষ্ট ও প্রাঞ্জল হতে হবে. তবেই তার সুন্দর উপস্থাপনার প্রতি মানুষ আকৃষ্ট হয়ে সহজে বুঝতে পারবে.</p><p><b>৯. ভাষা ও শব্দ স্পষ্ট হওয়া :</b> প্রচার কাজে দায়ী স্পষ্ট ভাষা ও শব্দ ব্যবহার করবেন. সাধারণ মানুষ বুঝতে পারে এমন স্পষ্ট ও সহজ ভাষা প্রয়োগ করবেন.</p><p><b>১০. কথাবার্তায় যুক্তি থাকা :</b> দায়ীর কথাবার্তায় বিভিন্ন কলাকৌশল ও যৌক্তিকতা থাকতে হবে. দ্বীনের পথে মানুষকে উত্তম পন্থায় বুদ্ধিমত্তা ও যুক্তির সাথে আহ্বান করতে হবে.</p><p><b>১১. ধৈর্যশীল হওয়া :</b> দায়ীকে সর্বাবস্থায় ধৈর্যশীল হতে হবে. এ পথে অনেক কষ্ট, লাঞ্ছনা, গঞ্জনা, জেল, জুলুম ও অত্যধিক প্রতিবন্ধকতা রয়েছে.</p><p><b>১২. তাওয়াক্কুলকারী হওয়া :</b> দায়ী হতে হলে আল্লাহর ওপর তাওয়াক্কুলের গুণ অনিবার্যভাবে থাকতে হবে. আল্লাহর ওপর ভরসা ছাড়া দাওয়াতের কাজ করা হলে সে কাজ ফলপ্রসূ হবে না.</p><p><b>১৩. সত্য প্রকাশক হওয়া :</b> সকল অনুকূল ও প্রতিকূল পরিবেশে দায়ী সর্বদা সত্য প্রকাশ করবেন. কোনো ব্যক্তি বা গোষ্ঠীর স্বার্থের বিপক্ষে যায় বলে সত্য প্রকাশ করা থেকে বিরত থাকবেন না.</p><p><b>১৪. সাহসী হওয়া :</b> দাওয়াতের পথ খুবই ঝুঁকিপূর্ণ. পরিপূর্ণ ইসলামের দাওয়াতে এ বাধার কোনো সীমা-পরিসীমা নেই. সুতরাং এসব ঝুঁকিপূর্ণ অবস্থায় সাহসিকতার পরিচয় দিয়ে দাওয়াতি মিশন নিয়ে সামনে এগুতে হবে.</p><p><b>১৫. নির্মল চরিত্রের অধিকারী হওয়া :</b> দায়ীকে অবশ্যই উত্তম চরিত্র ও মহানবী (স)-এর আদর্শের পরিপূর্ণ অনুসারী এবং নির্মল চরিত্রের অধিকারী হতে হবে.</p><p><b>১৬. পরিস্থিতি বোঝার যোগ্য হওয়া :</b> দায়ী নিজের পাণ্ডিত্য ও জ্ঞানের গভীরতা প্রকাশের জন্য সবার কাছে একই রকম প্রচার চালাবেন না; বরং পরিস্থিতি অনুযায়ী মানুষের গ্রহণ করার ক্ষমতা বিবেচনা করে প্রচার চালাবেন.</p><p><b>১৭. প্রয়োজনে বক্তব্যের পুনরাবৃত্তি করা :</b> বক্তব্যের মধ্যে কোনো গুরুত্বপূর্ণ বিষয় কঠিন মনে হলে তা শ্রোতাদের সামনে একাধিকবার পুনরাবৃত্তি করতে হবে, যাতে শ্রোতারা তা ভালোভাবে বুঝে নিতে পারে.</p><p><b>১৮. শ্রোতার মানসিকতার প্রতি লক্ষ্য রাখা :</b> দায়ীকে বক্তব্য দেয়ার সময় অবশ্যই শ্রোতার মানসিকতার প্রতি লক্ষ্য রাখতে হবে. এমন বক্তব্য পরিহার করতে হবে, যে বক্তব্যের কারণে শ্রোতারা বিরক্তিবোধ করেন.</p><p><b>১৯. বল প্রয়োগ না করা :</b> দায়ী অমুসলিমদেরকে ইসলামগ্রহণের দাওয়াত দেবেন; কিন্তু তা গ্রহণ না করলে তার ওপর বল প্রয়োগ করবেন না. জোর প্রয়োগে তাকে মত ত্যাগে বাধ্য করবেন না.</p><p><b>২০. আমলের মাধ্যমে দাওয়াত দেয়া :</b> দায়ী নিজের কথার চেয়ে আমলের মাধ্যমে বেশি বেশি দাওয়াতিকার্য পরিচালনা করবেন. কারণ কথার চেয়ে বাস্তবে দৃষ্টান্ত স্থাপন করা বেশি কার্যকর.</p><p><b>২১. সেবাধর্মী হওয়া :</b> দায়ী সেবাধর্মী হবেন. মানুষ সুখে তার সঙ্গ পাবে, দুঃখে তার সেবা পাবে. সকল ক্ষেত্রে তাকে পাশে পাবে.</p><p><b>২২. পরিকল্পনা গ্রহণ করা :</b> দায়ীকে পরিকল্পনা ভিত্তিক দাওয়াতি কাজ করতে হবে. তাকে বাতিল ধর্মবিশ্বাস ও চিন্তাধারার মূলোৎপাটন করে ইসলামী জিন্দেগীর বাস্তবতা তুলে ধরতে হবে.</p><p><b>২৩. দাওয়াতের ক্ষেত্র নির্ধারণ করা :</b> দায়ীকে দাওয়াতদানের ক্ষেত্র নির্ধারণপূর্বক দাওয়াতি কার্যক্রম চালাতে হবে. তাকে জানতে হবে যে, দ্বীনের আলো হতে বঞ্চিত সকল ব্যক্তি, সমাজ ও জাতিই ইসলামের দাওয়াতি কর্মসূচির অন্তর্ভুক্ত.</p><p><b>২৪. অন্য ধর্ম ও ভাষা সম্পর্কে জ্ঞান থাকা :</b> দায়ীকে অবশ্যই অন্য ধর্ম ও ভাষা সম্পর্কে সম্যক জ্ঞান রাখতে হবে. কারণ দায়ী নিজ ভাষাভাষী মানুষ ছাড়াও যখন অন্য ধর্মাবলম্বীর নিকট দ্বীন প্রচার করবে, তখন তাদেরকে তাদের ভাষায় বুঝিয়ে ইসলামের শ্রেষ্ঠত্ব প্রমাণ করে দিতে হবে.</p><p><b>২৫. অন্যের কল্যাণকামী হওয়া :</b> দায়ীর সবচেয়ে প্রভাবশালী আখলাকের মধ্যে অন্যতম প্রধান হচ্ছে, মানুষের কল্যাণকামিতা. রাসূল (স) ইরশাদ করেছেন— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الدِّينُ النَّصِيحَة</span>ُ. কাজেই নেতৃত্ব ও কর্তৃত্ব লাভ বা জাগতিক কোনো স্বার্থ এর লক্ষ্য হতে পারবে না.</p><div class=\"h hd\">উপসংহার</div><p>ইসলামে দাওয়াতের গুরুত্ব ও মর্যাদা অপরিসীম. এর উদ্দেশ্য ও লক্ষ্য অতি মহৎ. এর ক্ষেত্র ও পরিধি অতি ব্যাপক. নবী রাসূলগণের উত্তরসূরি হিসেবে বর্তমান প্রেক্ষাপটে এ মহান দায়িত্ব পালন করতে হলে দায়ীকে উপরোল্লিখিত আখলাক গুণাবলির অধিকারী হতে হবে, আধুনিক জ্ঞানসম্পন্ন হতে হবে এবং দাওয়াতদানের সর্বোত্তম পদ্ধতি ও কৌশল অবলম্বন করতে হবে. আল্লাহর যমীনে তাঁর দ্বীন কায়েম করতে চাইলে এ ছাড়া আর কোনো বিকল্প ব্যবস্থা নেই.</p>"],["মাদউ-এর পরিচয়, প্রকারভেদ ও বৈশিষ্ট্যসমূহ। (মূল প্রশ্ন ৩১)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলামী দাওয়াহ মুমিন জীবনের অবিচ্ছেদ্য অংশ. প্রিয়নবী (স) নবুয়তের তেইশ বছরের জীবনে এ দাওয়াতি কাজই করেছেন. যুগে যুগে নবী-রাসূলগণ ছিলেন দায়ী. আর তাঁদের উম্মতগণ ছিলেন মাদউ. বলতে গেলে দাওয়াতের মূল ক্ষেত্রই হলো এই মাদউ. মাদউ না থাকলে দাওয়াতের স্বার্থকতা নেই. মাদউ ঠিক রাখতেই মহানবী (স) তায়েফে নির্মম অত্যাচারের শিকার হয়েও তাদের ধ্বংস কামনা করেননি. তাই ইসলামী দাওয়াতে মাদউর গুরুত্ব অপরিসীম.</p><div class=\"h hd\">মাদউ-এর পরিচয়</div><div class=\"h hd3\">ক. আভিধানিক অর্থ</div><p>শব্দটির সীগাহ ইসমে মাফউল বাবে মুজাররাদ মাসদার <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مَدْعُو</span>ّ... মাদদাহ <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">د-ع-و</span> জিনসে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مُعْتَل لَام</span>.</p><p><b>এর অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> দাওয়াতকৃত</div><div><b>২.</b> নিমন্ত্রিত</div><div><b>৩.</b> আমন্ত্রিত</div><div><b>৪.</b> আহ্বানকৃত</div><div><b>৫.</b> কাঙ্ক্ষিত</div><div><b>৬.</b> অভিহিত</div><div><b>৭.</b> কথিত</div></div><div class=\"h hd3\">খ. পারিভাষিক সংজ্ঞা</div><p><b>১.</b> <span class=\"sc\">ইসলামী পরিভাষায়</span> মাদউ বলা হয়— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْمَدْعُو لِمَنْ يُبَلَّغُ الدَّعْوَة</span>َ.</p><p>অর্থাৎ, ইসলামের দাওয়াত যার কাছে পৌঁছানো হয় তাকে মাদউ বলা হয়.</p><p><b>২.</b> ইসলামের সুমহান আদর্শ তুলে ধরার জন্য যাকে বাছাই করা হয় তাকে মাদউ বলে. এ হিসেবে যিনি দাওয়াতি কাজ করেন তিনি দায়ী আর যাকে দাওয়াত দেয়া হয় তিনি মাদউ.</p><p><b>৩.</b> মাদউ মানে যাকে দাওয়াত দেয়া হয়, সে ব্যক্তি বা ব্যক্তি সমষ্টি.</p><p>ইসলামী দাওয়াহ গোটা মানবজাতির জন্য. এ প্রসঙ্গে মহানবী (স)-কে উদ্দেশ্য করে আল কুরআনে বলা হয়— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا</span>... অতএব আরব অনারর সকলেই ইসলামী দাওয়াহর মাদউ. প্রাচ্য ও পাশ্চাত্যের লোক বলে কাউকে আলাদা করা হয় না.</p><div class=\"h hd\">মাদউ-এর প্রকারভেদ ও বৈশিষ্ট্য</div><p>বিশ্ব মানবতা ইসলামী দাওয়াহ-এর মাদউ. এরপরও দাওয়াতের ক্ষেত্রে বিভিন্ন দৃষ্টিকোণ থেকে মাদউকে চারভাগে বিভাজন করা যায়. যথা— ক. সৃষ্টিগত দিক দিয়ে মাদউ, খ. আত্মীয়তার নৈকট্যতার দিক দিয়ে মাদউ, গ. বয়সগত দিক দিয়ে মাদউ, ঘ. ধর্মীয় দিক দিয়ে মাদউ. নিচে প্রত্যেকটির বৈশিষ্ট্যসহ বিস্তারিত আলোচনা তুলে ধরা হলো—</p><p><b>ক. সৃষ্টিগত দিক দিয়ে মাদউ :</b> সৃষ্টিগত দিক দিয়ে মাদউ নারী-পুরুষ দু'ভাগে বিভক্ত. অর্থাৎ, শুধু পুরুষদেরই দাওয়াত দেয়া হবে না; বরং মহিলাদেরকেও দাওয়াত দিতে হবে. দ্বীন সম্পর্কে জানার ক্ষেত্রে নারী-পুরুষের অধিকার সমান. এ মর্মে কুরআনে বলা হয়েছে— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَى وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَة</span>ً...</p><p>ইসলামী চিন্তাবিদগণের দৃষ্টিভঙ্গি হলো নারীদেরকে দাওয়াত প্রদানের ক্ষেত্রে প্রাধান্য দেয়া উচিত. কারণ একজন নারী মানে একটি ঘর, একটি শিক্ষা প্রতিষ্ঠান. যেখান থেকে নতুন প্রজন্ম শিক্ষা লাভ করে, তাদের জীবনের ভিত্তি রচিত হয়. এজন্য নারীদের মাঝে কুরআন চর্চা ও হেকমত শিক্ষা দেয়ার জন্য আল্লাহ তায়ালা আদেশ করেছেন.</p><p><b>নারী-পুরুষ :</b> নারী-পুরুষের মাঝে সৃষ্টিগতভাবেই কিছু বৈশিষ্ট্য আছে, যা দাওয়াতের ক্ষেত্রেও বিবেccio. যেমন, পুরুষরা সাধারণ কর্কশ মেজাজী, হিম্মত ও সাহসিকতায় অগ্রগামী, ঝুঁকি নিতে পারে. তারা অধিক কৌতূহলী, পরিশ্রমী, কোনো কাজে চলমান ও অধ্যবসায়ী, অধিক চিন্তাশীল, সূক্ষ্মদর্শী এবং পরস্পর আত্মরক্ষী. পক্ষান্তরে নারীর হৃদয় অধিক কোমল, বেশি আবেগপ্রবণ, মমতাময়ী, পরসেবী, সৌন্দর্য বিলাসী, নাটকীয়তায় অধিক পারদর্শী, সামাজিক প্রবণতাপ্রবল, প্রেরণাময়ী, প্রেমময়ী, আক্রমণের মুখে সহায়ক অন্বেষণী ইত্যাদি.</p><p><b>প্রাপ্তবয়স্ক :</b> দাওয়াহ বিশেষজ্ঞগণের কেউ কেউ মনে করেন মাদউকে প্রাপ্তবয়স্ক, বুদ্ধিমান ও বালেগ হতে হবে. তবে প্রফেসর আবদুল করীম যায়দান ও ড. মহিউদ্দীন আরওয়াঈ বলেন, আমার মতে এটা যথাযথ নয়. কারণ এটা মেনে নিলে শিশু, আহ্মক, বোকা, বোবা ও পাগল ইত্যাদি শ্রেণির লোকজনকে দাওয়াতের গতি থেকে বের করে দিতে হয়, যা বিজ্ঞজনোচিত নয়.</p><p><b>প্রতিবন্ধী :</b> এমনিভাবে যারা সৃষ্টিগতভাবে তথা শারীরিক বা মানসিক প্রতিবন্ধী তাদেরকে উপেক্ষা করা যাবে না. ইসলামী দায়ীদের জন্য উচিত নয়, পাগল ও অন্যান্য প্রতিবন্ধী এবং শিশুদেরকে দাওয়াতের গণ্ডি থেকে বের করে দেয়া এবং অমুসলিম মিশনারিদের হাতে ছেড়ে দেয়া.</p><p><b>খ. আত্মীয়তার নৈকট্যতার দিক দিয়ে মাদউ :</b> অনেক মাদউ আছেন যারা দায়ীর রক্ত সম্পর্কিত আত্মীয়স্বজন. সাধারণ জনগণের চেয়ে দায়ীর নিকট তাদের গুরুত্ব আলাদা. রক্তের টানে দায়ীর কথার প্রভাব বেশি হয়ে থাকে. তারপর তাদের পক্ষ থেকে দায়ীর বিরুদ্ধে প্রতিরোধ গড়ে তোলা বা নির্যাতন করার আশঙ্কা কম. সুতরাং দাওয়াত দিতে হবে— ক. প্রথমে পরিবারস্থ স্বজনদেরকে, খ. অতঃপর নিকটতম আত্মীয়স্বজনকে, গ. তারপর বন্ধুবান্ধব ও পরিচিতজনকে, ঘ. এরপর প্রতিবেশীকে, ঙ. তারপর অন্যদেরকে.</p><p><b>গ. বয়সগত দিক দিয়ে মাদউ :</b> বয়সের তারতম্যেও মাদউর মাঝে তারতম্য ঘটে. বয়সের দিক দিয়ে কেউ শিশু, কেউ যুবক, কেউ পৌঢ় বা বৃদ্ধ. মনস্তাত্ত্বিক গবেষণায় দেখা গেছে, মানুষের বয়সের এ তারতম্যের কারণে তারা বৈচিত্র্যময় মনস্তাত্ত্বিক সময় অতিবাহিত করে. শিশুদেরকে দাওয়াতের ক্ষেত্রে বস্তুগত দিকনির্দেশনা ও উপমা উদাহরণের উপর জোর দিতে হবে. যুবকদের বেশি বেশি স্বপ্ন ও আশা আকাঙ্ক্ষা জাগাতে হবে. সেখানে বৃদ্ধদেরকে মৃত্যুর ভয়, পরকালীন জীবন ও পূর্বতন জীবনযুদ্ধের অভিজ্ঞতামূলক স্মৃতিচারণ করে আকৃষ্ট করতে হবে.</p><p><b>ঘ. ধর্মীয় দিক দিয়ে মাদউ :</b> মানুষ বিভিন্ন ধর্মের অনুসারী. যেমন কুরআন মাজীদে ইরশাদ হয়েছে— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">كَانَ النَّاسُ أُمَّةً وَاحِدَةً فَبَعَثَ اللَّهُ النَّبِيِّينَ مُبَشِّرِينَ وَمُنْذِرِين</span>َ...</p><p>দাওয়াত দেয়ার পর প্রথমতঃ মানুষ দু'ভাগে বিভক্ত হয়. কেউ সাড়া দেয়, আর কেউ সাড়া দেয় না, অস্বীকার করে. যারা সাড়া দেয়, তারা মুমিন মুসলমান. আর যারা দাওয়াতে সাড়া দেয়নি; বরং অস্বীকার করল তারা কাফের. এছাড়া মানুষের মধ্যে এমন দল বা লোক আছে, যারা বাহ্যত ইসলামগ্রহণ করেছে বলে প্রকাশ করলেও গোপনে কুফরির মাঝেই নিপতিত, তারা হলো মুনাফিক.</p><div class=\"h hd\">উপসংহার</div><p>পৃথিবীর সব মানুষই আল্লাহর তাওহীদ ও নবী করীম (স)-এর রিসালাতের মাদউ. মাদউকে কেন্দ্র করেই যুগে যুগে নবী-রাসূলগণকে পাঠানো হয়েছে এবং আসমানী কিতাব অবতীর্ণ করা হয়েছে. মহানবী (স) সর্বশেষ নবী হওয়ার সুবাদে আর কোনো নবী-রাসূল আগমন করবেন না. তাই প্রতিটি দায়ী এখন মাদউ-তে পরিণত হয়ে গেছে. ফলে একদিকে মানুষ যেমন মাদউ তেমনি দায়ীও বটে.</p>"],["পবিত্র কুরআন ও হাদীসের আলোকে ইসলামী দাওয়াহর গুরুত্ব ও ফযিলত। (মূল প্রশ্ন নম্বর উল্লেখ নেই)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলাম একটি বিশ্বজনীন শান্তি ও কল্যাণের ধর্ম। এই ধর্মের সঠিক প্রচার, প্রসার ও প্রতিষ্ঠার মূল হাতিয়ার হলো দাওয়াত। যুগে যুগে মানবজাতির মুক্তি ও শান্তির জন্য প্রেরিত নবী-রাসূলগণ এই দায়িত্ব পালন করেছেন এবং তাঁদের উত্তরসূরি হিসেবে উম্মতে মুহাম্মদী ও আলেম সমাজের ওপর এই গুরুদায়িত্ব বর্তেছে। নিচে পবিত্র কুরআন ও হাদীসের আলোকে দাওয়াহর গুরুত্ব ও ফযিলত সংক্ষেপে আলোচনা করা হলো:</p><div class=\"h hd2\">১. ইসলামী দাওয়াহর গুরুত্ব</div><p>মানবজীবনে ও সমাজে দাওয়াতি কাজের গুরুত্ব ও প্রয়োজনীয়তা অপরিসীম। নিচে এর প্রধান দিকগুলো তুলে ধরা হলো:</p><p><b>আল্লাহর নির্দেশ:</b> মানবজাতিকে আল্লাহর পথে আহ্বান করা স্বয়ং মহান আল্লাহর নির্দেশ। আল কুরআনে রাসূল (স)-কে সুন্দর পন্থায় ও প্রজ্ঞার সাথে মানুষকে দাওয়াত দেওয়ার নির্দেশ দেওয়া হয়েছে।</p><p><b>রাসূল (স)-এর নির্দেশনা:</b> ইসলামের বাণী মানুষের কাছে পৌঁছে দেওয়ার জন্য রাসূলুল্লাহ (স) কঠোর তাগিদ দিয়েছেন এবং একটিমাত্র আয়াত হলেও তা প্রচার করতে বলেছেন।</p><p><b>নবী-রাসূলগণের মূল মিশন:</b> হযরত আদম (আ) থেকে শুরু করে বিশ্বনবী পর্যন্ত সকল নবী-রাসূলের মূল লক্ষ্য ও মিশন ছিল আল্লাহর যমীনে তাঁর দ্বীন প্রচার করা।</p><p><b>মুমিন জীবনের কর্মপন্থা:</b> প্রকৃত মুমিনের জীবনের অন্যতম প্রধান লক্ষ্য হলো দাওয়াতের মাধ্যমে সমাজে শান্তি ও ইসলামের সুমহান আদর্শ প্রতিষ্ঠা করা।</p><p><b>খেলাফতের দায়িত্ব:</b> পৃথিবীতে মানবজাতিকে খেলাফতের দায়িত্ব দেওয়া হয়েছে, আর এই খেলাফতের অন্যতম প্রধান কাজ হলো আল্লাহর একত্ববাদ ও শ্রেষ্ঠত্বের বার্তা মানুষের কাছে পৌঁছে দেওয়া।</p><p><b>মহামানবদের আদর্শ:</b> ইতিহাসের সকল মহান ব্যক্তিত্ব ও সংস্কারক তাঁদের জীবনের সিংহভাগ সময় দ্বীনি দাওয়াতের কাজে উৎসর্গ করেছেন।</p><p><b>উম্মতে মুহাম্মদীর দায়িত্ব:</b> শ্রেষ্ঠ জাতি হিসেবে উম্মতে মুহাম্মদীর অন্যতম প্রধান বৈশিষ্ট্য ও দায়িত্ব হলো সৎকাজের আদেশ এবং অসৎকাজে নিষেধ করা।</p><p><b>অপরিহার্যতা ও শাস্তির ভয়:</b> দাওয়াতের কাজ থেকে বিরত থাকলে সমাজের সাধারণ ও বিশেষ শ্রেণি নির্বিশেষে আল্লাহর আযাব বা শাস্তির মুখোমুখি হওয়ার তীব্র ঝুঁকি থাকে।</p><p><b>মুসলমানদের মাঝে সচেতনতা:</b> গাফেল বা দ্বীনবিমুখ মুসলমানদের মাঝে সচেতনতা তৈরি করতে এবং সমাজকে বিপর্যয় থেকে রক্ষা করতে দাওয়াতের গুরুত্ব অপরিসীম।</p><div class=\"h hd2\">২. ইসলামী দাওয়াহর ফযিলত</div><p>দৈনন্দিন জীবনে ও পরকালের মুক্তির ক্ষেত্রে দাওয়াতির কাজের অসামান্য ফযিলত ও সওয়াব রয়েছে। এর মধ্যে উল্লেখযোগ্য কয়েকটি দিক হলো:</p><p><b>শ্রেষ্ঠত্বের মাপকাঠি:</b> যারা আল্লাহর দিকে মানুষকে আহ্বান করেন এবং নেক আমল করেন, কুরআনের ঘোষণা অনুযায়ী তাঁদের চেয়ে উত্তম কথা আর কারো হতে পারে না।</p><p><b>ব্যাপক ও বিশাল সওয়াব:</b> দাওয়াতি কাজের প্রভাব অত্যন্ত সুদূরপ্রসারী। কারো মাধ্যমে একজন ব্যক্তিও যদি হিদায়াত লাভ করে, তবে তা দুনিয়ার মূল্যবান সম্পদের চেয়েও অধিক কল্যাণকর।</p><p><b>রাসূল (স)-এর বিশেষ দোয়া:</b> যে ব্যক্তি দ্বীনের কথা শুনে তা অন্যের নিকট পৌঁছে দেয়, রাসূল (স) সে সমস্ত দায়ী বা প্রচারকের চেহারা উজ্জ্বল হওয়ার জন্য বিশেষ দোয়া করেছেন।</p><p><b>সৃষ্টির দোয়া লাভ:</b> মানুষকে সৎ শিক্ষা দানকারীর জন্য আল্লাহ রহমতের পাশাপাশি ফেরেশতাকুল, আসমান-জমিনের বাসিন্দা, এমনকি পানির মাছ ও গর্তের পিপীলিকা পর্যন্ত দোয়া করতে থাকে।</p><p><b>আযাব থেকে মুক্তি:</b> নিয়মিত দাওয়াত ও সৎ কাজের আদেশ বজায় রাখলে আল্লাহর পক্ষ থেকে আসার সম্ভাব্য বিপদ ও আজাব থেকে রক্ষা পাওয়া যায়।</p><p><b>মৃত্যুর পরও সওয়াব অব্যাহত থাকা:</b> মানুষের মৃত্যুর পর সব আমল বন্ধ হয়ে গেলেও উপকারী জ্ঞান বা দাওয়াতের ফলস্বরূপ সদকায়ে জারিয়ার সওয়াব মৃত্যুর পরেও অবিরাম <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">جاری</span> থাকে।</p><div class=\"h hd\">উপসংহার</div><p>মানবজীবনে ইসলামী দাওয়াহর গুরুত্ব ও ফযিলত অত্যন্ত ব্যাপক। নবীগণের উত্তরসূরি হিসেবে সকল সচেতন মুসলমানের ওপর এই মহান দায়িত্ব পালন করা অপরিহার্য। এর মাধ্যমেই কেবল সমাজে শান্তি প্রতিষ্ঠা এবং আল্লাহর সন্তুষ্টি অর্জন করা সম্ভব।</p>"],["ইসলামী দাওয়াহর বিষয়বস্তু হিসেবে আকিদার গুরুত্ব। (মূল প্রশ্ন ৪৬)","<div class=\"h hd\">উপস্থাপনা</div><p>ইসলামী দাওয়াহ-এর অন্যতম বিষয়বস্তু হচ্ছে আকিদা. এটি ঈমানের পরিপূরক শব্দ. তাৎপর্যে ও ব্যাপ্তিতে ইসলামে আকিদা ও ঈমানের বিষয়সমূহ এক ও অভিন্ন. ইসলামী দাওয়াতকে কার্যকর ও ফলপ্রসূ করার জন্য দায়ীকে অবশ্যই সহীহ আকিদায় বিশ্বাসী হতে হবে. ইসলামের ধারক ও বাহক সর্বকালের সর্বশ্রেষ্ঠ মহামানব বিশ্বনবী মুহাম্মদ (স) ও তাঁর সাহাবায়ে কেরাম তারই উজ্জ্বল দৃষ্টান্ত. দায়ীর আকিদায় গড়মিল হলে তার দাওয়াতি কাজ কখনো ফলপ্রসূ হবে না এবং সাধারণ মানুষসহ জ্ঞানীগুণী ব্যক্তিবর্গও তার কথা গ্রহণ করবে না. কাজেই দায়ীর আকিদা অবশ্যই সহীহশুদ্ধ হতে হবে. অতএব ইসলামী দাওয়াহ-এর বিষয়বস্তু হিসেবে আকিদার গুরুত্ব অপরিসীম. নিম্নে প্রশ্নালোকে এ সম্পর্কিত আলোচনা পেশ করা হলো.</p><div class=\"h hd\">আকিদার পরিচয়</div><div class=\"h hd3\">ক. আভিধানিক অর্থ</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْعَقِيدَة</span>ُ শব্দটি আরবি একবচন. এর বহুবচন হচ্ছে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْعَقَائِد</span>ُ; এটা <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">عَقْد</span>ٌ শব্দমূল থেকে গৃহীত.</p><p><b>এর আভিধানিক অর্থ :</b></p><div class=\"mn\"><div><b>১.</b> বিশ্বাস (believe)</div><div><b>২.</b> আস্থা (faith)</div><div><b>৩.</b> মতাদর্শ (ideology)</div><div><b>৪.</b> পরিপূর্ণ করা, পালন করা</div></div><p>যেমন কুরআনে এসেছে— <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">وَالَّذِينَ عَقَدَتْ أَيْمَانُكُمْ فَأْتُوهُمْ نَصِيبَهُم</span>ْ.</p><div class=\"h hd3\">খ. পারিভাষিক সংজ্ঞা</div><p><b>১.</b> <span class=\"sc\">ইসলামী শরীয়তের পরিভাষায়</span> এমন এক বিষয়, যার দ্বারা দলীল প্রমাণসহ ধর্মীয় বিশ্বাসসমূহ প্রমাণ করা এবং সন্দেহ সংশয় বিদূরিত করা যায়.</p><p><b>২.</b> <span class=\"sc\">আহলুস সুন্নাহ ওয়াল জামায়াতের মতে</span>—</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْعَقِيدَةُ هِيَ الْخِصَالُ الَّتِي أَخَذَ النَّاسُ وَيُقِيمُ عَلَيْه</span>ِ. অর্থাৎ, মানুষের এমন কতগুলো অভ্যাসকে আকিদা বলা হয়, যা সে গ্রহণ করে এবং সেগুলোর ওপর স্থির থাকে.</p><p><b>৩.</b> <span class=\"sc\">ড. সালেহ ইবনে ফাওয়াল (রহ:) বলেন</span>—</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْعَقِيدَةُ هِيَ الَّتِي بَعَثَ اللَّهُ بِهَا رُسُلَهُ وَأَنْزَلَ بِهَا كُتُبَهُ وَأَوْجَبَهَا عَلَى جَمِيعِ خَلْقِهِ الْجِنِّ وَالْإِنْس</span>ِ.</p><p><b>৪.</b> <span class=\"sc\">আল্লামা মোল্লা আলী কারী (রহ:)-এর মতে</span>—</p><p>আকিদা এমন ইলম, যাতে এমন সব বিষয়ের আলোচনা করা হয়, যেগুলোর প্রতি ঈ<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">مان</span> আনা অত্যাবশ্যক.</p><p><b>৫.</b> <span class=\"sc\">আহমদ ইবনে মুহাম্মদ আল কাইয়ুমী বলেন</span>—</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif;font-size:1.25em\">الْعَقِيدَةُ مَا يَدِينُ الْإِنْسَانُ بِهِ كَمَا يُقَالُ وَلَهُ عَقِيدَةٌ حَسَنَةٌ أَيْ سَالِمَة</span>ٌ. অর্থাৎ, মানুষ ধর্ম হিসেবে যা গ্রহণ করে, তাকে আকিদা বলা হয়. যেমন বলা হয়, তার ভালো আকিদা আছে, অর্থাৎ তার সন্দেহমুক্ত বিশ্বাস আছে.</p><p><b>৬.</b> <span class=\"sc\">আল ফারাবী (রহ:) বলেছেন</span>—</p><p>আকিদা জ্ঞানবিজ্ঞানের এমন এক শাখা, যা মানুষকে এমন যোগ্যতা প্রদান করে, যাতে সে শরীয়ত বর্ণিত বিশ্বাসসমূহ সত্য বলে প্রমাণ করতে পারে এবং বিরোধী মতাদর্শকে খণ্ডন করতে পারে.</p><p><b>৭.</b> <span class=\"sc\">কেউ বলেছেন</span>—</p><p>দ্বীনের মধ্যে আকিদা হলো, যা কর্ম ব্যতীত শুধু বিশ্বাসকে উদ্দেশ্য করা হয়. যেমন আল্লাহর অস্তিত্ব ও রাসূলগণের প্রেরণ সংক্রান্ত বিষয়ে বিশ্বাস স্থাপন করা.</p><p><b>৮.</b> বস্তুত আকিদা হচ্ছে দ্বীনি বিশ্বাসের ঐ জ্ঞানের নাম, যার মধ্যে আল্লাহর জাত ও সিফাত দলীল প্রমাণের আলোকে এমনভাবে আলোচনা করা হয়, যার মাধ্যমে সন্দেহ সংশয় দূরীভূত হয় এবং ঈমান সুদৃঢ় হয়.</p><div class=\"h hd\">ইসলামী দাওয়াতের ক্ষেত্রে আকিদার গুরুত্ব</div><p>ইসলামী দাওয়াহ-এর বিষয়বস্তু হিসেবে আকিদা-এর গুরুত্ব অপরিসীম. সহীহ শুদ্ধ আকিদার অধিকারী হওয়া ছাড়া ইসলামী দাওয়াহ-এর কাজ কখনোই সম্ভব নয়. কেননা একটি উত্তম আদর্শ ও মতবাদ প্রচার করতে হলে প্রচারককে অবশ্যই বিশুদ্ধ আকিদার অধিকারী হতে হবে. অন্যথা কেউ তার কথা গ্রহণ করবে না.</p><p>বিশ্বনবী হযরত মুহাম্মদ (স), সাহাবায়ে কেরাম, তাবেয়ী, তাবে তাবেয়ী ও ওলামায়ে কেরাম যুগে যুগে ইসলামী বিশুদ্ধ আকিদার অধিকারী ছিলেন বলেই ইসলামের ব্যাপক প্রচার ও প্রসার করতে সক্ষম হয়েছেন. তাঁদের বিশুদ্ধ আকিদার নমুনা ও চরিত্র মাধুর্যে মুগ্ধ হয়েই দলে দলে লোক ইসলামের সুশীতল ছায়াতলে আশ্রয় নিয়েছেন. তাঁদের আকিদা বিশ্বাস সর্বযুগে ও সর্বকালে ছিল সহীহ শুদ্ধ ও নির্ভেজাল. ফলে তাঁদের দ্বারা ইসলামের প্রচার ও প্রসারের মাধ্যমে বিশ্ববিজয় সম্ভবপর হয়েছিল. নিম্নে ইসলামী দাওয়াহ-এর বিষয়বস্তু হিসেবে বিশুদ্ধ আকিদার গুরুত্বপূর্ণ কতিপয় দিক তুলে ধরা হলো. যেমন—</p><p><b>১. বিশুদ্ধ আকিদা শিরকমুক্ত আল্লাহর ইবাদত শেখায় :</b> বিশুদ্ধ ইসলামী আকিদা দায়ীকেসহ প্রতিটি মুসলিমকে নিরঙ্কুশ ও শিরকমুক্তভাবে আল্লাহর ইবাদত করতে শেখায়. আর মানুষ সৃষ্টির ব্যাপারে মহান আল্লাহর উদ্দেশ্যও তাই. মহান আল্লাহ এ বিষয়ে ইরশাদ করেছেন—</p><div class=\"ay ay2\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونَ ۝ مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَمَا أُرِيدُ أَنْ يُطْعِمُونَ</div></div><p><b>২. নির্ভেজাল ঈমানের অধিকারী বানায় :</b> ইসলামী আকিদার লালন দায়ীসহ সর্বস্তরের মুসলমানদেরকে দৃঢ় ও নির্ভেজাল ঈমানের অধিকারী হতে সহায়তা করে. এর ফলে মানুষ ঈমানের ওপর অবিচল থাকতে পারে.</p>"]]}]},"dv":["প্রশ্নসমূহ"],"ex":"2026-11-02"},{"n":"দাওয়াহ ২য় পত্র","c":"#9333EA","k":"দা২","d":{},"dv":["বড় প্রশ্ন","ছোট প্রশ্ন"],"ex":"2026-11-10"},{"n":"দাওয়াহ ৩য় পত্র","c":"#A855F7","k":"দা৩","d":{},"dv":["বড় প্রশ্ন","ছোট প্রশ্ন"],"ex":"2026-11-05"},{"n":"","c":"#64748b","k":"","d":{}},{"n":"ইসলামিক স্টাডিজ ২য় পত্র","c":"#E11D48","k":"ই২","d":{"হাদিসের অনুবাদ":[{"n":"সালাত পর্ব","c":"#E11D48","q":[["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن عبد الرحمن بن أبي ليلى قال حدثنى اصحاب محمد صلى الله عليه وسلم ان عبد الله بن زيد الانصاري رأى الاذان في المنام فأتى النبي صلى الله عليه وسلم فاخبره فقال علمه بلالا فقام بلال فاذن مثنى مثنى</span>",""],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن انس بن مالك قال كانوا قد أرادوا أن يضربوا بالناقوس وأن يرفعوا نارا لاعلام الصلوة حتى رأى ذلك الرجل تلك الرويا فأمر بلالا أن يشفع الاذان ويوتر الاقامة</span>",""],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن عبادة بن الصامت قال صلى بنا رسول الله صلى الله عليه وسلم صلوة الفجر فتعايت عليه القراءة فلما سلم قال انقرؤون خلفي قلنا نعم يا رسول الله قال فلا تفعلوا الا بفاتحة الكتاب فانه لا صلوة لمن لم يقرأ بها</span>",""],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن نافع قال اقبلنا مع ابن عمر رضى الله عنه حتى اذا كنا ببعض الطريق استصرخ على زوجته بنت ابي عبيد فراح مسرعا حتى غابت الشمس فنودى بالصلاة فلم ينزل حتى اذا أمسى فظننا انه قد نسي فقلت الصلاة فكست حتى اذا كاد الشفق أن يغيب نزل فصلي المغرب وغاب الشفق فصلي العشاء وقال هكذا كنا نفعل مع رسول الله صلى الله عليه وسلم اذا جد بنا السير.</span>",""],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن ابي هريرة رضى الله عنه قال قال رسول الله صلى الله عليه وسلم : آرايتم لو ان نهرا بباب احدكم يغتسل فيه كل يوم خمسا هل يبقى من درنه شيئ قالوا لا يبقى من درنه شيء قال فذالك مثل صلوات الخمس يمحو الله بهن الخطايا - (متفق عليه)</span>",""]]},{"n":"বিবাহ পর্ব","c":"#E11D48","q":[["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن جابر (رض) قال قال رسول الله صلى الله عليه وسلم : اذا خطب أحدكم المرأة فان استطاع ان ينظر الى ما يدعوه إلى نكاحها فليفعل. وعن عمرو بن شعيب عن أبيه وعن جده عن النبي صلى الله عليه وسلم : اذا زوج أحدكم عبده امته فلا ينظرن الى عورتها</span>",""],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عن ع
