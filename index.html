:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.08);--fs:16px;--a1:#0f766e;--a2:#0e7490}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mu:#94a3b8;--ln:#243049;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:12px 12px 18px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:6px;max-width:1000px;margin:0 auto}.top h1{flex:1;margin:0;font-size:21px;line-height:1.25}
.tb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 11px;backdrop-filter:blur(6px)}.tb:active{transform:scale(.94)}
header>p{max-width:1000px;margin:6px auto 0;color:rgba(255,255,255,.85)}
.hero{max-width:1000px;margin:14px auto 0;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 14px}
.ring{position:relative;flex:none;width:84px;height:84px}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}.st div{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 2px}.st b{display:block;font-size:20px;line-height:1.2}.st small{font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 10px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;margin:6px 0 8px}
.tile b{display:block;font-size:18px;line-height:1.25}.tile small{color:var(--mu);font-size:14px}.tile.off{opacity:.5}
.big{display:flex;gap:14px;align-items:center}.big .ic{margin:6px 0;flex:none}
.pb{height:7px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .4s}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 10px 8px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;max-width:1000px;margin:0 auto 8px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.zb{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:0 12px;font-weight:700}.chips{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:20px;padding:2px 12px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.strip{max-width:1000px;margin:8px auto 0;font-size:14px;color:var(--mu);display:flex;gap:10px;align-items:center}.strip .pb{flex:1;margin:0;--c:var(--a1)}
.sec{margin-bottom:22px}.sh{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px}
.sh span{margin-left:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh)}
.no{float:left;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin:1px 9px 2px 0}
.q{font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;cursor:pointer}.q::after{content:' ▾';color:var(--c)}.card.show .q::after{content:' ▴'}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;clear:both}.ib{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:0 10px;font-size:14px}
.card.bm .bm,.card.kn .kn{background:var(--c);color:#fff;border-color:var(--c)}.card.kn{opacity:.8}
.a{font-size:var(--fs);margin-top:8px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--tx);border-radius:12px;padding:6px 12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(-4px)}}
.hid .a{display:none}.hid .card.show .a{display:block}.a b{color:var(--c)}
.alw .q::after{content:none!important}.alw .q{cursor:default}.hid .a{cursor:pointer}
.a .h{font-weight:700;color:var(--c);margin:12px 0 2px;padding-left:8px;border-left:4px solid var(--c)}.a p{margin:2px 0 6px;text-align:justify}
.ay{margin:8px 0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--c);text-align:center}.ay .ar{font:400 calc(var(--fs)*1.7)/2 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif}.ay .rf{color:var(--mu);font-size:.9em}
.empty{text-align:center;color:var(--mu);padding:30px}
.zi{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:20px;padding:4px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}.zi.on{opacity:1}


.qt3{background:color-mix(in srgb,var(--c) 10%,var(--card));border:0;border-radius:28px;box-shadow:none;padding:12px 16px}.qt3 .no{border-radius:12px}
.qt6{background:#0b0f1a;color:#e8edf8;border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}.qt6 .no{box-shadow:0 0 10px var(--c)}
.at8 .a{background:color-mix(in srgb,var(--c) 8%,var(--card))}.at8 .a .h{background:var(--c);color:#fff;border:0;border-radius:0 16px 16px 0;margin-left:-12px;padding:2px 14px;display:inline-block}.at8 .ay{border:0;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.15);border-radius:6px}

:root{--bg:#f3f5f1;--card:#fff;--tx:#10231d;--mu:#667a72;--ln:#e3e9e4;--sh:0 1px 2px rgba(16,35,29,.05),0 8px 24px -8px rgba(16,35,29,.12);--r:22px}

body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -80px,color-mix(in srgb,var(--a1) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

<script>
const S=[{"n": "আস সীরাত আন নববিয়্যাহ", "c": "#15803D", "k": "সি", "d": {}}, , {"n": "দাওয়াহ ২য় পত্র", "c": "#9333EA", "k": "দা২", "d": {}, "dv": ["বড় প্রশ্ন", "ছোট প্রশ্ন"], "ex": "2026-11-10"}, , , {"n": "ইসলামিক স্টাডিজ ২য় পত্র", "c": "#E11D48", "k": "ই২", "d": {"হাদিসের অনুবাদ": [{"n": "সালাত পর্ব", "c": "#E11D48", "q": [["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى قَالَ: حَدَّثَنِي أَصْحَابُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّ عَبْدَ اللَّهِ بْنَ زَيْدٍ الْأَنْصَارِيَّ رَأَى الْأَذَانَ فِي الْمَنَامِ، فَأَتَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَأَخْبَرَهُ، فَقَالَ: عَلِّمْهُ بِلَالًا، فَقَامَ بِلَالٌ فَأَذَّنَ مَثْنَى مَثْنَى.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এর باب الأذان كيف هو (আজান কীভাবে প্রবর্তিত হলো) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামের অন্যতম গুরুত্বপূর্ণ ইবাদত হলো নামাজ। মুসলমানদের জামাতে নামাজের জন্য আহ্বান জানানোর উদ্দেশ্যে আজানের প্রচলন করা হয়। আলোচ্য হাদিসে আজান প্রবর্তনের ঐতিহাসিক ঘটনা বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবদুর রহমান ইবনে আবি লায়লা (রহ.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.)-এর সাহাবিগণ আমাকে জানিয়েছেন যে, আবদুল্লাহ ইবনে যায়েদ আনসারি (রা.) একবার স্বপ্নে আজানের শব্দগুলো দেখতে পান। অতঃপর তিনি নবী করিম (সা.)-এর কাছে এসে বিষয়টি জানালেন। রাসুলুল্লাহ (সা.) তাঁর কথা শুনে খুশি হলেন এবং বললেন, তুমি এই শব্দগুলো বিলালকে শিখিয়ে দাও। তখন বিলাল (রা.) দাঁড়িয়ে আজানের শব্দগুলো দুইবার করে উচ্চারণ করলেন।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে জানা যায়, আজানের প্রচলন স্বপ্নের মাধ্যমে শুরু হলেও রাসুলুল্লাহ (সা.)-এর অনুমোদনের মাধ্যমে তা ইসলামের গুরুত্বপূর্ণ নিদর্শনে পরিণত হয়।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ نَافِعٍ، قَالَ: أَقْبَلْنَا مَعَ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُ، حَتَّى إِذَا كُنَّا بِبَعْضِ الطَّرِيقِ، اسْتُصْرِخَ عَلَى زَوْجَتِهِ بِنْتِ أَبِي عُبَيْدٍ، فَرَاحَ مُسْرِعًا، حَتَّى غَابَتِ الشَّمْسُ، فَنُودِيَ بِالصَّلَاةِ، فَلَمْ يَنْزِلْ، حَتَّى إِذَا أَمْسَى، فَظَنَنَّا أَنَّهُ قَدْ نَسِيَ، فَقُلْتُ: الصَّلَاةَ، فَسَكَتَ، حَتَّى إِذَا كَادَ الشَّفَقُ أَنْ يَغِيبَ، نَزَلَ فَصَلَّى الْمَغْرِبَ، وَغَابَ الشَّفَقُ فَصَلَّى الْعِشَاءَ، وَقَالَ: هَكَذَا كُنَّا نَفْعَلُ مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا جَدَّ بِنَا السَّيْرُ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এর সফরে দুই ওয়াক্ত সালাত একত্রে আদায়সংক্রান্ত অধ্যায় থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম একটি সহজ ও বাস্তবসম্মত জীবনব্যবস্থা। সফরের কষ্ট ও বিশেষ পরিস্থিতি বিবেচনায় শরিয়ত নামাজ আদায়ের ক্ষেত্রে কিছু বিশেষ সুযোগ দিয়েছে। আলোচ্য হাদিসে সফরের সময় মাগরিব ও এশার নামাজ একত্রে আদায়ের বিষয়টি আলোচনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>নাফি (রহ.) থেকে বর্ণিত। তিনি বলেন, আমরা আবদুল্লাহ ইবনে উমর (রা.)-এর সঙ্গে সফরে বের হলাম। পথের এক স্থানে পৌঁছালে তাঁর স্ত্রী বিনতে আবি উবাইদের অসুস্থতার সংবাদ দিয়ে তাঁকে ডেকে পাঠানো হলো। তখন তিনি দ্রুত পথ চলতে শুরু করলেন। এভাবে চলতে চলতে সূর্য ডুবে গেল। নামাজের জন্য তাঁকে ডাক দেওয়া হলো, কিন্তু তিনি বাহন থেকে নামলেন না।</p><p>সন্ধ্যা ঘনিয়ে এলে আমাদের মনে হলো, হয়তো তিনি নামাজের কথা ভুলে গেছেন। তাই আমি তাঁকে বললাম, নামাজের সময় হয়েছে। কিন্তু তিনি নীরব রইলেন। অবশেষে যখন গোধূলির লাল আভা প্রায় মিলিয়ে যাওয়ার উপক্রম হলো, তখন তিনি বাহন থেকে নেমে মাগরিবের নামাজ আদায় করলেন। এরপর গোধূলির আভা সম্পূর্ণ মিলিয়ে গেলে এশার নামাজ আদায় করলেন। তারপর বললেন, রাসুলুল্লাহ (সা.)-এর সঙ্গে সফরে যখন আমাদের দ্রুত পথ চলার প্রয়োজন হতো, তখন আমরা এভাবেই করতাম।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস দ্বারা প্রমাণিত হয়, বিশেষ প্রয়োজনে সফরের সময় মাগরিব ও এশার নামাজ একত্রে আদায় করার অবকাশ রয়েছে।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عُبَادَةَ بْنِ الصَّامِتِ قَالَ: صَلَّى بِنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَلَاةَ الْفَجْرِ، فَتَعَايَا عَلَيْهِ الْقِرَاءَةُ، فَلَمَّا سَلَّمَ قَالَ: أَتَقْرَؤُونَ خَلْفِي؟ قُلْنَا: نَعَمْ يَا رَسُولَ اللَّهِ، قَالَ: فَلَا تَفْعَلُوا إِلَّا بِفَاتِحَةِ الْكِتَابِ، فَإِنَّهُ لَا صَلَاةَ لِمَنْ لَمْ يَقْرَأْ بِهَا.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এর باب القراءة خلف الإمام (ইমামের পেছনে কিরাআত পাঠ অধ্যায়) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>নামাজে ইমামের পেছনে কিরাআত পাঠ করা নিয়ে ফকিহদের মধ্যে মতপার্থক্য রয়েছে। আলোচ্য হাদিসে ইমামের পেছনে সূরা ফাতিহা পাঠের গুরুত্ব সম্পর্কে আলোচনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>উবাদা ইবনে সামিত (রা.) থেকে বর্ণিত। তিনি বলেন, একদিন রাসুলুল্লাহ (সা.) আমাদের নিয়ে ফজরের নামাজ আদায় করলেন। নামাজের সময় তাঁর কিরাআত পড়তে কিছুটা অসুবিধা হলো। নামাজ শেষে তিনি আমাদের জিজ্ঞাসা করলেন, তোমরা কি আমার পেছনে কিরাআত পাঠ করো? আমরা বললাম, হ্যাঁ, হে আল্লাহর রাসুল! তখন তিনি বললেন, তোমরা সূরা ফাতিহা ছাড়া অন্য কিছু পাঠ করবে না। কারণ, যে ব্যক্তি সূরা ফাতিহা পাঠ করে না, তার নামাজ পূর্ণাঙ্গ হয় না।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে নামাজে সূরা ফাতিহা পাঠের গুরুত্ব এবং ইমামের পেছনে কিরাআত পাঠের বিষয়টি জানা যায়।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَرَأَيْتُمْ لَوْ أَنَّ نَهْرًا بِبَابِ أَحَدِكُمْ يَغْتَسِلُ فِيهِ كُلَّ يَوْمٍ خَمْسًا، هَلْ يَبْقَى مِنْ دَرَنِهِ شَيْءٌ؟ قَالُوا: لَا يَبْقَى مِنْ دَرَنِهِ شَيْءٌ، قَالَ: فَذَلِكَ مَثَلُ الصَّلَوَاتِ الْخَمْسِ، يَمْحُو اللَّهُ بِهِنَّ الْخَطَايَا. (مُتَّفَقٌ عَلَيْهِ)</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب الصلاة (সালাত অধ্যায়)-এ বর্ণিত হয়েছে। এর মূল উৎস সহিহ বুখারি ও সহিহ মুসলিম।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামে পাঁচ ওয়াক্ত নামাজ অত্যন্ত গুরুত্বপূর্ণ ইবাদত। নামাজের মাধ্যমে বান্দার গুনাহ মাফ হয় এবং আত্মিক পবিত্রতা অর্জিত হয়। আলোচ্য হাদিসে পাঁচ ওয়াক্ত নামাজের মাধ্যমে গুনাহ মাফ হওয়ার বিষয়টি তুলে ধরা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবু হুরায়রা (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কারো বাড়ির দরজার সামনে যদি একটি নদী প্রবাহিত থাকে এবং সে প্রতিদিন তাতে পাঁচবার গোসল করে, তাহলে তার শরীরে কি কোনো ময়লা অবশিষ্ট থাকবে? সাহাবিগণ বললেন, না, তার শরীরে কোনো ময়লা অবশিষ্ট থাকবে না। তখন রাসুলুল্লাহ (সা.) বললেন, পাঁচ ওয়াক্ত নামাজের দৃষ্টান্তও এমন। এর মাধ্যমে আল্লাহ তাআলা বান্দার গুনাহসমূহ মুছে দেন।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে বোঝা যায়, নিয়মিত পাঁচ ওয়াক্ত নামাজ আদায়ের মাধ্যমে বান্দার ছোটখাটো গুনাহ মাফ হয় এবং আত্মিক পবিত্রতা অর্জিত হয়।</p>"]]}, {"n": "বিবাহ পর্ব", "c": "#E11D48", "q": [["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ جَابِرٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا خَطَبَ أَحَدُكُمُ الْمَرْأَةَ، فَإِنِ اسْتَطَاعَ أَنْ يَنْظُرَ إِلَى مَا يَدْعُوهُ إِلَى نِكَاحِهَا فَلْيَفْعَلْ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب النظر إلى المخطوبة (বিয়ের প্রস্তাব দেওয়া নারীকে দেখার অধ্যায়) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>বিবাহের পূর্বে পাত্র-পাত্রীর একে অপরকে দেখার বৈধতা ইসলামে রয়েছে। বিবাহ একটি গুরুত্বপূর্ণ ও স্থায়ী বন্ধন। তাই বিবাহের সিদ্ধান্ত নেওয়ার আগে পাত্রীকে দেখে নেওয়ার বিষয়টি আলোচ্য হাদিসে তুলে ধরা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>জাবির (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কেউ যখন কোনো নারীকে বিবাহের প্রস্তাব দেয়, তখন যদি তার পক্ষে ওই নারীকে এমনভাবে দেখা সম্ভব হয়, যা তাকে বিবাহের প্রতি আগ্রহী করে তোলে, তাহলে সে যেন তা দেখে নেয়।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে বোঝা যায়, বিবাহের পূর্বে পাত্রের জন্য পাত্রীকে দেখে নেওয়া বৈধ। এতে ভবিষ্যৎ দাম্পত্য জীবনে পারস্পরিক আকর্ষণ ও ভালোবাসা সৃষ্টি হতে সহায়তা করে।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">وَعَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، وَعَنْ جَدِّهِ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا زَوَّجَ أَحَدُكُمْ عَبْدَهُ أَمَتَهُ، فَلَا يَنْظُرَنَّ إِلَى عَوْرَتِهَا.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب النظر إلى المخطوبة وبيان العورات (বিয়ের প্রস্তাব দেওয়া নারীকে দেখা ও সতর সম্পর্কিত অধ্যায়) থেকে সংকলিত। হাদিসটি আবু দাউদেও বর্ণিত হয়েছে।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামে মানুষের সতর সংরক্ষণের ওপর বিশেষ গুরুত্ব দেওয়া হয়েছে। বৈধ সম্পর্কের ক্ষেত্রেও সতরের বিধান মেনে চলতে হয়। আলোচ্য হাদিসে সতর দেখা থেকে বিরত থাকার নির্দেশ দেওয়া হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আমর ইবনে শুআইব (রহ.) তাঁর পিতা ও দাদার সূত্রে নবী করিম (সা.) থেকে বর্ণনা করেন। রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কেউ যখন তার দাসের সঙ্গে তার দাসীকে বিবাহ দেয়, তখন সে যেন তার সতরের দিকে দৃষ্টিপাত না করে।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে বোঝা যায়, বিবাহের সম্পর্ক প্রতিষ্ঠিত হলেও সতরের বিধান মেনে চলা আবশ্যক।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: إِذَا خَطَبَ أَحَدُكُمُ الْمَرْأَةَ، فَقَدَرَ عَلَى أَنْ يَرَى مِنْهَا مَا يُعْجِبُهُ فَلْيَفْعَلْ. قَالَ جَابِرٌ: فَلَقَدْ خَطَبْتُ امْرَأَةً مِنْ بَنِي سَلَمَةَ، فَكُنْتُ أَتَخَبَّأُ فِي أُصُولِ النَّخْلِ حَتَّى رَأَيْتُ مِنْهَا بَعْضَ مَا يُعْجِبُنِي، فَخَطَبْتُهَا فَتَزَوَّجْتُهَا.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب الرجل يريد تزويج المرأة هل يحل له النظر إليها أم لا (কোনো নারীকে বিবাহ করতে ইচ্ছুক ব্যক্তির জন্য তাকে দেখা বৈধ কি না) অধ্যায় থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>বিবাহের আগে পাত্র-পাত্রীর একে অপরকে দেখার বিষয়টি ইসলামে অনুমোদিত। আলোচ্য হাদিসে সাহাবি জাবির (রা.)-এর পাত্রী দেখার একটি বাস্তব ঘটনা বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>জাবির ইবনে আবদুল্লাহ (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, তোমাদের কেউ যখন কোনো নারীকে বিবাহের প্রস্তাব দেয়, তখন যদি সে ওই নারীকে এমন কিছু দেখার সুযোগ পায়, যা তাকে বিবাহের প্রতি আকৃষ্ট করে, তাহলে সে যেন তা দেখে নেয়।</p><p>জাবির (রা.) বলেন, আমি বনু সালামা গোত্রের একজন নারীকে বিবাহের প্রস্তাব দিয়েছিলাম। এরপর আমি খেজুরগাছের গোড়ার আড়ালে লুকিয়ে থাকতাম, যাতে তাঁর এমন কিছু দেখতে পারি, যা আমাকে তাঁর প্রতি আকৃষ্ট করে। অবশেষে আমি তাঁর এমন কিছু বিষয় দেখতে পেলাম, যা আমার ভালো লাগল। এরপর আমি তাঁকে বিবাহের প্রস্তাব দিলাম এবং তাঁকে বিবাহ করলাম।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে প্রমাণিত হয়, বিবাহের পূর্বে পাত্রের জন্য পাত্রীকে দেখে নেওয়া বৈধ এবং এতে ভবিষ্যৎ দাম্পত্য জীবনে পারস্পরিক ভালোবাসা সৃষ্টি হতে পারে।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا نَغْزُو مَعَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَلَيْسَ لَنَا نِسَاءٌ، فَقُلْنَا: يَا رَسُولَ اللَّهِ، أَلَا نَسْتَخْصِي؟ فَنَهَانَا عَنْ ذَلِكَ، وَرَخَّصَ لَنَا أَنْ نَنْكِحَ بِالثَّوْبِ إِلَى أَجَلٍ، ثُمَّ قَرَأَ هَذِهِ الْآيَةَ: ﴿لَا تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ وَلَا تَعْتَدُوا إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ﴾.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب النكاح (বিবাহ অধ্যায়)-এর باب نكاح المتعة (সাময়িক বিবাহ অধ্যায়) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামের প্রাথমিক যুগে বিশেষ পরিস্থিতিতে সাময়িক বিবাহের অনুমতি দেওয়া হয়েছিল। পরবর্তীতে এ বিষয়ে শরিয়তের চূড়ান্ত বিধান নির্ধারিত হয়। আলোচ্য হাদিসে সাময়িক বিবাহের প্রাথমিক অনুমতির ঘটনা বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবদুল্লাহ ইবনে মাসউদ (রা.) থেকে বর্ণিত। তিনি বলেন, আমরা রাসুলুল্লাহ (সা.)-এর সঙ্গে বিভিন্ন যুদ্ধে অংশগ্রহণ করতাম। তখন আমাদের সঙ্গে কোনো স্ত্রী থাকত না। তাই আমরা রাসুলুল্লাহ (সা.)-কে বললাম, হে আল্লাহর রাসুল! আমরা কি খোজা হয়ে যাব? তিনি আমাদের তা করতে নিষেধ করলেন এবং নির্দিষ্ট সময়ের জন্য কোনো নারীর সঙ্গে বিবাহবন্ধনে আবদ্ধ হওয়ার অনুমতি দিলেন। এরপর তিনি এ আয়াত পাঠ করলেন, তোমরা আল্লাহ তোমাদের জন্য যেসব পবিত্র বস্তু হালাল করেছেন, সেগুলো হারাম করো না এবং সীমালঙ্ঘন করো না। নিশ্চয়ই আল্লাহ সীমালঙ্ঘনকারীদের পছন্দ করেন না।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে সাময়িক বিবাহের প্রাথমিক অনুমতির বিষয়টি জানা যায়। তবে পরবর্তীতে সাময়িক বিবাহ নিষিদ্ধ হয়েছে।</p>"]]}, {"n": "অর্থনৈতিক লেনদেন ও সুদ পর্ব", "c": "#E11D48", "q": [["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ أَبِي قَيْسٍ مَوْلَى عَمْرِو بْنِ الْعَاصِ قَالَ: كَتَبَ أَبُو بَكْرٍ الصِّدِّيقُ رَضِيَ اللَّهُ عَنْهُ إِلَى أُمَرَاءِ الْأَجْنَادِ حِينَ قَدِمَ الشَّامَ: أَمَّا بَعْدُ، فَإِنَّكُمْ قَدْ هَبَطْتُمْ أَرْضَ الرِّبَا، فَلَا تَتَبَايَعُوا الذَّهَبَ بِالذَّهَبِ إِلَّا وَزْنًا بِوَزْنٍ، وَلَا الْوَرِقَ بِالْوَرِقِ إِلَّا وَزْنًا بِوَزْنٍ، وَلَا الطَّعَامَ بِالطَّعَامِ إِلَّا كَيْلًا بِكَيْلٍ. قَالَ أَبُو قَيْسٍ: قَرَأْتُ كِتَابَهُ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصرف (মুদ্রা বিনিময় অধ্যায়)-এর باب الربا (সুদ অধ্যায়) থেকে সংকলিত। ج 4</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম সুদকে কঠোরভাবে নিষিদ্ধ করেছে। বিশেষ করে স্বর্ণ, রৌপ্য ও খাদ্যদ্রব্যের বিনিময়ের ক্ষেত্রে সুদের বিধান মেনে চলা জরুরি। আলোচ্য হাদিসে আবু বকর (রা.)-এর লিখিত নির্দেশনার মাধ্যমে সুদমুক্ত লেনদেনের নিয়ম তুলে ধরা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>আবু কাইস (রহ.) থেকে বর্ণিত। তিনি বলেন, আবু বকর সিদ্দিক (রা.) শাম দেশে পৌঁছানোর সময় সেনাপতিদের কাছে একটি চিঠি লিখলেন। চিঠিতে তিনি বললেন, তোমরা এমন একটি দেশে প্রবেশ করেছ, যেখানে সুদের প্রচলন রয়েছে। সুতরাং তোমরা স্বর্ণের বিনিময়ে স্বর্ণ লেনদেন করলে সমান ওজনে বিনিময় করবে। একইভাবে রৌপ্যের বিনিময়ে রৌপ্য লেনদেন করলেও সমান ওজনে বিনিময় করবে। আর খাদ্যের বিনিময়ে খাদ্য লেনদেন করলে সমান পরিমাণে বিনিময় করবে। আবু কাইস (রহ.) বলেন, আমি তাঁর চিঠিটি পড়েছি।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে জানা যায়, সুদমুক্ত লেনদেনের ক্ষেত্রে সমজাতীয় পণ্যের বিনিময়ে সমতা বজায় রাখা অত্যন্ত জরুরি।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عُمَرَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: الذَّهَبُ بِالذَّهَبِ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالْوَرِقُ بِالْوَرِقِ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالْبُرُّ بِالْبُرِّ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالشَّعِيرُ بِالشَّعِيرِ رِبًا إِلَّا هَاءَ وَهَاءَ، وَالتَّمْرُ بِالتَّمْرِ رِبًا إِلَّا هَاءَ وَهَاءَ. (مُتَّفَقٌ عَلَيْهِ)</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম খতিব তিবরিজি (রহ.) সংকলিত مشكاة المصابيح (মিশকাতুল মাসাবিহ) গ্রন্থের كتاب البيوع (ক্রয়-বিক্রয় অধ্যায়)-এর باب الربا (সুদ অধ্যায়) থেকে সংকলিত। এটি সহিহ বুখারি ও সহিহ মুসলিমেও বর্ণিত হয়েছে।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলামে সুদ সম্পূর্ণ নিষিদ্ধ। স্বর্ণ, রৌপ্য ও নির্দিষ্ট খাদ্যদ্রব্যের বিনিময়ের ক্ষেত্রে সুদের বিধান রয়েছে। আলোচ্য হাদিসে এসব পণ্যের বিনিময়ের নিয়ম এবং হাতে হাতে লেনদেনের গুরুত্ব আলোচনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>উমর (রা.) থেকে বর্ণিত। তিনি বলেন, রাসুলুল্লাহ (সা.) বলেছেন, স্বর্ণের বিনিময়ে স্বর্ণ, রৌপ্যের বিনিময়ে রৌপ্য, গমের বিনিময়ে গম, যবের বিনিময়ে যব এবং খেজুরের বিনিময়ে খেজুর লেনদেনের ক্ষেত্রে সুদ প্রযোজ্য হয়; তবে উভয় পক্ষের লেনদেন তাৎক্ষণিকভাবে হাতে হাতে সম্পন্ন হলে তা বৈধ। অর্থাৎ এসব সমজাতীয় পণ্যের বিনিময়ে পরিমাণে সমতা এবং তাৎক্ষণিক হস্তান্তর বজায় রাখতে হবে।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে সুদমুক্ত লেনদেনের ক্ষেত্রে সমতা ও তাৎক্ষণিক হস্তান্তরের গুরুত্ব প্রমাণিত হয়।</p>"], ["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">عَنْ عُبَادَةَ بْنِ الصَّامِتِ رَضِيَ اللَّهُ عَنْهُ، قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: الذَّهَبُ بِالذَّهَبِ مِثْلًا بِمِثْلٍ، الْكَفَّةُ بِالْكَفَّةِ، وَالْفِضَّةُ بِالْفِضَّةِ مِثْلًا بِمِثْلٍ، الْكَفَّةُ بِالْكَفَّةِ، وَالْبُرُّ بِالْبُرِّ مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ، وَالشَّعِيرُ بِالشَّعِيرِ مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ، وَالتَّمْرُ بِالتَّمْرِ مِثْلًا بِمِثْلٍ، يَدًا بِيَدٍ، حَتَّى ذَكَرَ الْمِلْحَ.</span>", "<div class=\"h\">উৎস ও সংকলন</div><p>হাদিসটি ইমাম আবু জাফর আত-ত্বহাবী (রহ.) রচিত شرح معاني الآثار (শরহু মা‘আনিল আছার) গ্রন্থের كتاب الصرف (মুদ্রা বিনিময় অধ্যায়)-এর باب الربا (সুদ অধ্যায়) থেকে সংকলিত।</p><div class=\"h\">প্রসঙ্গ</div><p>সুদমুক্ত অর্থনৈতিক লেনদেন প্রতিষ্ঠার জন্য স্বর্ণ, রৌপ্য ও খাদ্যদ্রব্যের বিনিময়ে শরিয়তের নির্ধারিত নিয়ম অনুসরণ করা জরুরি। আলোচ্য হাদিসে এসব পণ্যের বিনিময়ে সমতা ও তাৎক্ষণিক হস্তান্তরের বিধান বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><p>উবাদা ইবনে সামিত (রা.) থেকে বর্ণিত। তিনি বলেন, আমি রাসুলুল্লাহ (সা.)-কে বলতে শুনেছি, স্বর্ণের বিনিময়ে স্বর্ণ লেনদেন করতে হলে উভয় পক্ষের পরিমাণ সমান হতে হবে এবং ওজনও সমান হতে হবে। একইভাবে রৌপ্যের বিনিময়ে রৌপ্য লেনদেন করলেও সমান পরিমাণ ও সমান ওজন বজায় রাখতে হবে।</p><p>আর গমের বিনিময়ে গম, যবের বিনিময়ে যব এবং খেজুরের বিনিময়ে খেজুর লেনদেন করলে উভয় পক্ষের পরিমাণ সমান হতে হবে এবং হাতে হাতে বিনিময় করতে হবে। এরপর রাসুলুল্লাহ (সা.) লবণের কথাও উল্লেখ করলেন। অর্থাৎ এসব পণ্যের বিনিময়ের ক্ষেত্রেও সুদের বিধান প্রযোজ্য এবং লেনদেনের সময় শরিয়তের নির্ধারিত নিয়ম মেনে চলতে হবে।</p><div class=\"h\">মন্তব্য</div><p>এ হাদিস থেকে সুদমুক্ত লেনদেনের মৌলিক নীতিমালা জানা যায়। সমজাতীয় সুদযোগ্য পণ্যের বিনিময়ে সমতা ও তাৎক্ষণিক হস্তান্তরের বিধান মেনে চলা জরুরি।</p>"]]}], "রচনামূলক প্রশ্ন": [{"n": "রচনামূলক", "c": "#E11D48", "q": [["হাদিস কাকে বলে? ইহা কত প্রকার? অতঃপর মানবজীবনে হাদিসের প্রয়োজনীয়তা বর্ণনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>শরীয়তের দ্বিতীয় মূল উৎস হলো মহানবী (স.)-এর পবিত্র বাণী আল-হাদীস। এটি পবিত্র আল-কুরআনের বাস্তব ও জীবন্ত ব্যাখ্যা। রাসূল (স.)-এর বাণী, কর্ম, আদর্শ ও গুণাবলি মানবজাতির জন্য হেদায়াতস্বরূপ। তাই ইসলামী শরীয়ত ও মানবজীবনে হাদীসের গুরুত্ব অপরিসীম। নিম্নে প্রশ্নের আলোকে হাদীসের সংজ্ঞা, গুরুত্ব, প্রকারভেদ এবং হাদীস ও খবরের মধ্যে পার্থক্য আলোচনা করা হলো।</p><div class=\"h hm\">১ : <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">تَعْرِيفُ الْحَدِيثِ</span> (হাদীসের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيث</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إِسْم</span> তথা বিশেষ্য। এটি একবচন, এর বহুবচন <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَحَادِيثُ</span>। এর মূল ধাতু <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">ح-د-ث</span> এবং এটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">قَدِيم</span> (পুরাতন) শব্দের বিপরীত।</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيث</span> শব্দের আভিধানিক অর্থ নিম্নরূপ—</p><p style=\"padding-left:4px\"><b>১।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقَوْلُ</span> — কথা বা বাণী।</p><p style=\"padding-left:4px\"><b>২।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْوَعْظُ</span> — উপদেশ।</p><p style=\"padding-left:4px\"><b>৩।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقِصَّةُ</span> — কাহিনী বা ঘটনা।</p><p style=\"padding-left:4px\"><b>৪।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْخَبَرُ وَالنَّبَأُ</span> — সংবাদ বা খবর।</p><p style=\"padding-left:4px\"><b>৫।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْجَدِيدُ</span> — নতুন বা অভিনব।</p><p>ইংরেজি অর্থ: Message, News, Conversation.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p>হাদীসের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. আল্লামা ইবনে হাজার আসকালানি (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ هُوَ أَقْوَالُ النَّبِيِّ وَأَفْعَالُهُ وَتَقْرِيرُهُ</div></div><p>অর্থ: মহানবী (স.)-এর কথা, কাজ ও মৌনসম্মতিকে হাদীস বলে।</p><p class=\"bh\"><b>২. শায়খ আবদুল হক মুহাদ্দিসে দেহলভী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ يُطْلَقُ عَلَى قَوْلِ النَّبِيِّ ﷺ وَفِعْلِهِ وَتَقْرِيرِهِ</div></div><p>অর্থ: মহানবী (স.)-এর কথা, কাজ ও মৌনসম্মতিকে হাদীস বলা হয়।</p><p class=\"bh\"><b>৩. আল্লামা ইবনে হুমাম (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ هُوَ أَقْوَالُ الرَّسُولِ ﷺ فَقَطْ</div></div><p>অর্থ: রাসূল (স.)-এর বাণীই হাদীস।</p><div class=\"h hs hs2\">ব্যাখ্যা:</div><p>সারকথা, মহানবী (স.)-এর কথা, কাজ, অনুমোদন ও মৌনসম্মতিকে হাদীস বলা হয়। ইসলামী জীবনব্যবস্থা ও শরিয়তের বিধান জানার অন্যতম প্রধান মাধ্যম হলো হাদীস।</p><div class=\"h hm\"><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَقْسَامُ الْحَدِيثِ</span> (হাদীসের প্রকারভেদ)</div><p>সনদের শেষ সীমা বা বর্ণনার সম্বন্ধ বিবেচনায় হাদীস প্রধানত তিন প্রকার। যথা—</p><p style=\"padding-left:4px\"><b>১।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مَرْفُوعٌ</span> (হাদীসে মারফূ)</p><p style=\"padding-left:4px\"><b>২।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مَوْقُوفٌ</span> (হাদীসে মাওকুফ)</p><p style=\"padding-left:4px\"><b>৩।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مَقْطُوعٌ</span> (হাদীসে মাকতূ)</p><div class=\"h hs\">১। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مَرْفُوعٌ</span> (হাদীসে মারফূ)</div><div class=\"h hs hs2\">আভিধানিক অর্থ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَرْفُوعٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">رَفْعٌ</span> মাসদার থেকে নির্গত। এর অর্থ</p><p style=\"padding-left:4px\"><b>১.</b> উন্নত,</p><p style=\"padding-left:4px\"><b>২.</b> সমুন্নত,</p><p style=\"padding-left:4px\"><b>৩.</b> মর্যাদাপূর্ণ</p><p style=\"padding-left:4px\"><b>৪.</b> উচ্চ মর্যাদাসম্পন্ন।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p>পারিভাষিকভাবে মারফূ হাদীস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا انْتَهَى إِلَى النَّبِيِّ ﷺ يُقَالُ لَهُ الْمَرْفُوعُ</div></div><p>অর্থ: যে হাদীসের সনদ রাসূলুল্লাহ (স.) পর্যন্ত পৌঁছেছে, তাকে মারফূ হাদীস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْمَرْفُوعُ هُوَ مَا انْتَهَى إِلَى النَّبِيِّ ﷺ</div></div><p>অর্থ: যে হাদীসের বর্ণনাসূত্র মহানবী (স.) পর্যন্ত পৌঁছেছে, তাকে মারফূ হাদীস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত তহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ الْمَرْفُوعُ مَا أُضِيفَ إِلَى رَسُولِ اللَّهِ ﷺ مِنْ قَوْلٍ أَوْ فِعْلٍ أَوْ تَقْرِيرٍ أَوْ صِفَةٍ</div></div><p>অর্থ: রাসূলুল্লাহ (স.)-এর কথা, কাজ, সমর্থন অথবা গুণাবলির সঙ্গে সম্পর্কযুক্ত হাদীসকে মারফূ হাদীস বলে।</p><div class=\"h hs hs2\">উদাহরণ:</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ</div></div><p>অর্থ: নিশ্চয়ই সকল কাজ নিয়তের ওপর নির্ভরশীল।</p><p>হুকুম: মারফূ হাদীস শরিয়তের দলিল হিসেবে গ্রহণযোগ্য। মারফূ হাদীসের সঙ্গে মাওকুফ ও মাকতূ হাদীসের দ্বন্দ্ব দেখা দিলে মারফূ হাদীস অগ্রাধিকার পাবে।</p><div class=\"h hs\">২। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مَوْقُوفٌ</span> (হাদীসে মাওকুফ)</div><div class=\"h hs hs2\">আভিধানিক অর্থ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَوْقُوفٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْوَقْفُ</span> মাসদার থেকে নির্গত। এর অর্থ</p><p style=\"padding-left:4px\"><b>১.</b> স্থগিত,</p><p style=\"padding-left:4px\"><b>২.</b> বিরত,</p><p style=\"padding-left:4px\"><b>৩.</b> থেমে থাকা</p><p style=\"padding-left:4px\"><b>৪.</b> স্থিরীকৃত।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p>পারিভাষিকভাবে মাওকুফ হাদীস হলো—</p><p class=\"bh\"><b>ক. জমহুর মুহাদ্দিসীনের ভাষায়—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا انْتَهَى إِلَى الصَّحَابِيِّ يُقَالُ لَهُ الْمَوْقُوفُ</div></div><p>অর্থ: যে হাদীসের বর্ণনাসূত্র সাহাবি পর্যন্ত পৌঁছেছে, তাকে মাওকুফ হাদীস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْمَوْقُوفُ هُوَ مَا يَنْتَهِي إِلَى الصَّحَابِيِّ</div></div><p>অর্থ: যে হাদীসের বর্ণনাসূত্র সাহাবি পর্যন্ত পৌঁছেছে, তাকে মাওকুফ হাদীস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত তহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا أُضِيفَ إِلَى الصَّحَابِيِّ مِنْ قَوْلٍ أَوْ فِعْلٍ أَوْ تَقْرِيرٍ</div></div><p>অর্থ: সাহাবির কথা, কাজ ও সমর্থনের সঙ্গে সম্পর্কযুক্ত বর্ণনাকে মাওকুফ হাদীস বলে।</p><div class=\"h hs hs2\">উদাহরণ:</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">عَنْ زَيْدِ بْنِ ثَابِتٍ قَالَ لَا قِرَاءَةَ مَعَ الْإِمَامِ فِي شَيْءٍ</div></div><p>অর্থ: যায়েদ ইবনে সাবিত (রা.) বলেন, ইমামের সঙ্গে কোনো অবস্থায় কিরাআত নেই।</p><p>হুকুম: মাওকুফ হাদীস কুরআন ও সুন্নাহর পরিপন্থী না হলে শরিয়তের দলিল হিসেবে গ্রহণযোগ্য হতে পারে। তবে কুরআন ও সুন্নাহর বিরোধী হলে তা গ্রহণযোগ্য হবে না।</p><div class=\"h hs\">৩। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيثٌ مَقْطُوعٌ</span> (হাদীসে মাকতূ)</div><div class=\"h hs hs2\">আভিধানিক অর্থ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَقْطُوعٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">قَطْعٌ</span> মাসদার থেকে নির্গত। এর অর্থ</p><p style=\"padding-left:4px\"><b>১.</b> বিচ্ছিন্ন,</p><p style=\"padding-left:4px\"><b>২.</b> কর্তিত,</p><p style=\"padding-left:4px\"><b>৩.</b> পৃথক</p><p style=\"padding-left:4px\"><b>৪.</b> বিচ্ছিন্নকৃত।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p>পারিভাষিকভাবে মাকতূ হাদীস হলো—</p><p class=\"bh\"><b>ক. জমহুর ওলামায়ে কেরামের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا انْتَهَى إِلَى التَّابِعِيِّ يُقَالُ لَهُ الْمَقْطُوعُ</div></div><p>অর্থ: যে হাদীসের বর্ণনাসূত্র তাবেয়ি পর্যন্ত পৌঁছেছে, তাকে মাকতূ হাদীস বলে।</p><p class=\"bh\"><b>খ. আল্লামা ইবনে হাজার আসকালানি (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا يَنْتَهِي إِلَى التَّابِعِيِّ مِنْ دُونِ الصَّحَابِيِّ</div></div><p>অর্থ: সাহাবিকে বাদ দিয়ে যে বর্ণনা তাবেয়ি পর্যন্ত পৌঁছেছে, তাকে মাকতূ হাদীস বলে।</p><p class=\"bh\"><b>গ. ড. মাহমুদ আত তহহান বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا أُضِيفَ إِلَى التَّابِعِيِّ مِنْ قَوْلٍ أَوْ فِعْلٍ أَوْ تَقْرِيرٍ</div></div><p>অর্থ: তাবেয়ির কথা, কাজ ও সমর্থনের সঙ্গে সম্পর্কযুক্ত বর্ণনাকে মাকতূ হাদীস বলে।</p><div class=\"h hs hs2\">উদাহরণ:</div><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالَ الْحَسَنُ الْبَصْرِيُّ: لَيْسَ الْوُضُوءُ بِشَرْطٍ</div></div><p>অর্থ: হাসান বসরি (র.) বলেন, অজু শর্ত নয়।</p><p>হুকুম: সাধারণভাবে মাকতূ হাদীস শরিয়তের স্বতন্ত্র দলিল হিসেবে গ্রহণযোগ্য নয়। তবে কোনো তাবেয়ির বক্তব্য সাহাবিদের যুগে ব্যাপকভাবে প্রচলিত থাকলে এবং এ বিষয়ে শরিয়তের কোনো বিরোধী বক্তব্য পাওয়া না গেলে বিশেষ ক্ষেত্রে তা দলিল হিসেবে গ্রহণযোগ্য হতে পারে।</p><div class=\"h hm\">হাদীসের গুরুত্ব ও প্রয়োজনীয়তা</div><div class=\"h hs\">১. শরিয়তের দ্বিতীয় মূল উৎস:</div><p>ইসলামী শরিয়তের প্রথম উৎস হলো আল-কুরআন এবং দ্বিতীয় উৎস হলো আল-হাদীস। কুরআনে মানবজীবনের বিভিন্ন বিধান মূলনীতি আকারে বর্ণিত হয়েছে, আর হাদীসের মাধ্যমে সেসব বিধানের বিস্তারিত ব্যাখ্যা ও বাস্তব প্রয়োগ জানা যায়। তাই শরিয়তের বিধান যথাযথভাবে বুঝতে ও পালন করতে হাদীসের গুরুত্ব অপরিসীম। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ</div></div><p>অর্থ: হে মুমিনগণ! তোমরা আল্লাহর আনুগত্য করো এবং রাসূলের আনুগত্য করো। (সূরা আন-নিসা: ৫৯)</p><div class=\"h hs\">২. কুরআনের ব্যাখ্যা:</div><p>হাদীস পবিত্র আল-কুরআনের বাস্তব ও কার্যকর ব্যাখ্যা। কুরআনের অনেক বিধান সংক্ষিপ্তভাবে বর্ণিত হয়েছে, যার বিস্তারিত ব্যাখ্যা মহানবী (স.) তাঁর কথা ও কাজের মাধ্যমে তুলে ধরেছেন। যেমন কুরআনে নামাজ প্রতিষ্ঠার নির্দেশ রয়েছে, কিন্তু নামাজের রাকাত, সময় ও আদায়ের বিস্তারিত পদ্ধতি হাদীস থেকে জানা যায়। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنْزَلْنَا إِلَيْكَ الذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ</div></div><p>অর্থ: আর আমি আপনার প্রতি কুরআন অবতীর্ণ করেছি, যাতে মানুষের জন্য যা নাজিল করা হয়েছে, তা আপনি তাদের কাছে সুস্পষ্টভাবে ব্যাখ্যা করেন। (সূরা আন-নাহল: ৪৪)</p><div class=\"h hs\">৩. রাসূল (স.)-এর আনুগত্যের মাধ্যম:</div><p>রাসূল (স.)-এর আনুগত্য করা প্রত্যেক মুসলমানের জন্য অপরিহার্য। তাঁর আদেশ-নিষেধ, শিক্ষা ও আদর্শ অনুসরণ করার মাধ্যমেই প্রকৃত আনুগত্য প্রকাশ পায়। আর রাসূল (স.)-এর নির্দেশনা ও জীবনাদর্শ জানার প্রধান মাধ্যম হলো হাদীস। তাই রাসূলের আনুগত্য করতে হলে হাদীস অধ্যয়ন ও অনুসরণ করা অত্যন্ত জরুরি। আল্লাহ তায়ালা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ</div></div><p>অর্থ: যে রাসূলের আনুগত্য করল, সে প্রকৃতপক্ষে আল্লাহরই আনুগত্য করল। (সূরা আন-নিসা: ৮০)</p><div class=\"h hs\">৪. ইসলামী জীবনব্যবস্থার পূর্ণাঙ্গ নির্দেশনা:</div><p>হাদীস মানুষের ব্যক্তিগত, পারিবারিক, সামাজিক, অর্থনৈতিক ও রাষ্ট্রীয় জীবনের প্রতিটি ক্ষেত্রে সঠিক দিকনির্দেশনা প্রদান করে। মানুষের পারস্পরিক সম্পর্ক, লেনদেন, অধিকার ও কর্তব্য সম্পর্কে হাদীসে বিস্তারিত আলোচনা রয়েছে। ফলে হাদীস অনুসরণের মাধ্যমে একজন মুসলমান সুন্দর ও সুশৃঙ্খল জীবন গঠন করতে পারে।</p><div class=\"h hs\">৫. ইবাদতের পদ্ধতি জানার মাধ্যম:</div><p>ইসলামের বিভিন্ন ইবাদত পালনের সঠিক নিয়মকানুন হাদীসের মাধ্যমে জানা যায়। পবিত্র কুরআনে নামাজ, রোজা, হজ ও জাকাতের নির্দেশ থাকলেও এগুলোর বিস্তারিত পদ্ধতি রাসূল (স.) হাদীসের মাধ্যমে শিক্ষা দিয়েছেন। তাই ইবাদতকে সঠিক ও পরিপূর্ণভাবে আদায় করার জন্য হাদীসের জ্ঞান অপরিহার্য। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي</div></div><p>অর্থ: তোমরা আমাকে যেভাবে নামাজ আদায় করতে দেখেছ, সেভাবে নামাজ আদায় করো। (সহিহ বুখারি)</p><div class=\"h hs\">৬. উত্তম চরিত্র গঠনের মাধ্যম:</div><p>মানুষের নৈতিক ও চারিত্রিক উন্নয়নে হাদীসের ভূমিকা অত্যন্ত গুরুত্বপূর্ণ। হাদীসে সততা, ন্যায়পরায়ণতা, ধৈর্য, ক্ষমাশীলতা, বিনয়, দয়া ও মানবিকতার শিক্ষা দেওয়া হয়েছে। এসব গুণাবলি অর্জনের মাধ্যমে মানুষ আদর্শ চরিত্রের অধিকারী হতে পারে। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا بُعِثْتُ لِأُتَمِّمَ مَكَارِمَ الْأَخْلَاقِ</div></div><p>অর্থ: নিশ্চয়ই আমি উত্তম চরিত্রের পূর্ণতা সাধনের জন্য প্রেরিত হয়েছি।</p><div class=\"h hs\">৭. হেদায়াত ও মুক্তির পথ:</div><p>হাদীস মানুষকে সঠিক পথের সন্ধান দেয় এবং অন্যায়, পাপাচার ও ভ্রান্তি থেকে দূরে থাকতে সাহায্য করে। রাসূল (স.)-এর আদর্শ অনুসরণ করলে মানুষ আল্লাহর সন্তুষ্টি অর্জন করতে পারে। তাই দুনিয়ার শান্তি ও আখিরাতের মুক্তির জন্য হাদীসের শিক্ষা অনুসরণ করা অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h hs\">৮. হাদীস সংরক্ষণ ও প্রচারের গুরুত্ব:</div><p>ইসলামের শিক্ষা পরবর্তী প্রজন্মের কাছে পৌঁছে দেওয়ার জন্য হাদীস সংরক্ষণ ও প্রচার করা অত্যন্ত গুরুত্বপূর্ণ। সাহাবায়ে কেরাম (রা.) থেকে শুরু করে মুহাদ্দিসগণ অত্যন্ত সতর্কতার সঙ্গে হাদীস সংগ্রহ, সংকলন ও সংরক্ষণ করেছেন। প্রত্যেক মুসলমানের উচিত বিশুদ্ধ হাদীসের জ্ঞান অর্জন করা এবং তা অন্যের কাছে পৌঁছে দেওয়া। রাসূল (স.) বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">بَلِّغُوا عَنِّي وَلَوْ آيَةً</div></div><p>অর্থ: আমার পক্ষ থেকে একটি বাণী হলেও পৌঁছে দাও।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, হাদীস ইসলামী জীবনব্যবস্থার অন্যতম প্রধান ভিত্তি। কুরআনের বিধান বুঝতে, ইবাদত যথাযথভাবে পালন করতে এবং রাসূলুল্লাহ (সা.)-এর আদর্শ অনুসরণ করতে হাদীসের গুরুত্ব অপরিসীম। তাই ইসলামের সঠিক জ্ঞান অর্জন ও সুন্দর জীবন গঠনের জন্য হাদীস অধ্যয়ন ও অনুসরণ করা প্রত্যেক মুসলমানের কর্তব্য।</p>"], ["হাদিস কাকে বলে? সনদের দিক থেকে হাদিস কত প্রকার? হাদিস ও খবরের মধ্যে পার্থক্য কী? উদাহরণসহ লেখ।", "<div class=\"h hm\">উপস্থাপনা</div><p>শরীয়তের দ্বিতীয় মূল উৎস হলো মহানবী (স.)-এর পবিত্র বাণী আল-হাদীস। এটি পবিত্র আল-কুরআনের বাস্তব ও জীবন্ত ব্যাখ্যা। রাসূল (স.)-এর বাণী, কর্ম, আদর্শ ও গুণাবলি মানবজাতির জন্য হেদায়াতস্বরূপ। তাই ইসলামী শরীয়ত ও মানবজীবনে হাদীসের গুরুত্ব অপরিসীম। নিম্নে প্রশ্নের আলোকে হাদীসের সংজ্ঞা, গুরুত্ব, প্রকারভেদ এবং হাদীস ও খবরের মধ্যে পার্থক্য আলোচনা করা হলো।</p><div class=\"h hm\">১ : <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">تَعْرِيفُ الْحَدِيثِ</span> (হাদীসের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيث</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">إِسْم</span> তথা বিশেষ্য। এটি একবচন, এর বহুবচন <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَحَادِيثُ</span>। এর মূল ধাতু <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">ح-د-ث</span> এবং এটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">قَدِيم</span> (পুরাতন) শব্দের বিপরীত।</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيث</span> শব্দের আভিধানিক অর্থ নিম্নরূপ—</p><p style=\"padding-left:4px\"><b>১।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقَوْلُ</span> — কথা বা বাণী।</p><p style=\"padding-left:4px\"><b>২।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْوَعْظُ</span> — উপদেশ।</p><p style=\"padding-left:4px\"><b>৩।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْقِصَّةُ</span> — কাহিনী বা ঘটনা।</p><p style=\"padding-left:4px\"><b>৪।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْخَبَرُ وَالنَّبَأُ</span> — সংবাদ বা খবর।</p><p style=\"padding-left:4px\"><b>৫।</b> <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْجَدِيدُ</span> — নতুন বা অভিনব।</p><p>ইংরেজি অর্থ: Message, News, Conversation.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p>হাদীসের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. আল্লামা ইবনে হাজার আসকালানি (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ هُوَ أَقْوَالُ النَّبِيِّ وَأَفْعَالُهُ وَتَقْرِيرُهُ</div></div><p>অর্থ: মহানবী (স.)-এর কথা, কাজ ও মৌনসম্মতিকে হাদীস বলে।</p><p class=\"bh\"><b>২. শায়খ আবদুল হক মুহাদ্দিসে দেহলভী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ يُطْلَقُ عَلَى قَوْلِ النَّبِيِّ ﷺ وَفِعْلِهِ وَتَقْرِيرِهِ</div></div><p>অর্থ: মহানবী (স.)-এর কথা, কাজ ও মৌনসম্মতিকে হাদীস বলা হয়।</p><p class=\"bh\"><b>৩. আল্লামা ইবনে হুমাম (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ هُوَ أَقْوَالُ الرَّسُولِ ﷺ فَقَطْ</div></div><p>অর্থ: রাসূল (স.)-এর বাণীই হাদীস।</p><div class=\"h hs hs2\">ব্যাখ্যা:</div><p>সারকথা, মহানবী (স.)-এর কথা, কাজ, অনুমোদন ও মৌনসম্মতিকে হাদীস বলা হয়। ইসলামী জীবনব্যবস্থা ও শরিয়তের বিধান জানার অন্যতম প্রধান মাধ্যম হলো হাদীস।</p><div class=\"h hm\">সনদের দিক থেকে হাদিসের প্রকারভেদ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أقسام الحديث باعتبار السند</span>)</div><p>সনদের বর্ণনাকারীর সংখ্যা বা আধিক্য ও স্বল্পতার ভিত্তিতে হাদিস প্রধানত দুই প্রকার। যথা—</p><p style=\"padding-left:4px\"><b>ক.</b> হাদিসে মুতাওয়াতির (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الحديث المتواتر</span>)</p><p style=\"padding-left:4px\"><b>খ.</b> হাদিসে আহাদ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الحديث الآحاد</span>)</p><div class=\"h hs\">ক. হাদিসে মুতাওয়াতির (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الحديث المتواتر</span>)</div><p>আভিধানিক অর্থ: মুতাওয়াতির শব্দটি আরবি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">تواتر</span> শব্দ থেকে গঠিত। এর আভিধানিক অর্থ হলো</p><p style=\"padding-left:4px\"><b>১.</b> ধারাবাহিকতা</p><p style=\"padding-left:4px\"><b>২.</b> পরম্পরা</p><p style=\"padding-left:4px\"><b>৩.</b> একের পর এক আসা</p><p style=\"padding-left:4px\"><b>৪.</b> বিরতিহীনভাবে সংঘটিত হওয়া।</p><p>যেমন বলা হয়—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">تَوَاتَرَ الْمَطَرُ</div></div><p>অর্থ: অবিরাম বৃষ্টিপাত হয়েছে।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p class=\"bh\"><b>ইমাম ইবনে হাজার আসকালানী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَنْ يَكُونَ لَهُ طُرُقٌ بِلَا عَدَدٍ مُعَيَّنٍ فَهُوَ الْمُتَوَاتِرُ</div></div><p>অর্থ: যে হাদিসের বর্ণনাপথের সংখ্যা নির্দিষ্ট কোনো সংখ্যায় সীমাবদ্ধ নয়, তাকে মুতাওয়াতির হাদিস বলে।</p><p class=\"bh\"><b>আল-মানার গ্রন্থের প্রণেতা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الْخَبَرُ الَّذِي رَوَاهُ قَوْمٌ لَا يُحْصَى عَدَدُهُمْ وَلَا يُتَوَهَّمُ تَوَاطُؤُهُمْ عَلَى الْكَذِبِ وَيَدُومُ هَذَا الْحَدُّ فَيَكُونُ آخِرُهُ كَأَوَّلِهِ وَأَوَّلُهُ كَآخِرِهِ وَأَوْسَطُهُ كَطَرَفَيْهِ</div></div><p>অর্থ: মুতাওয়াতির এমন সংবাদ, যা এত অধিকসংখ্যক বর্ণনাকারী বর্ণনা করেছেন যে, তাঁদের পক্ষে মিথ্যার ওপর একমত হওয়া অসম্ভব বলে বিবেচিত হয়। আর বর্ণনার এ আধিক্য সনদের প্রতিটি স্তরে বিদ্যমান থাকে।</p><div class=\"h hs hs2\">উদাহরণ:</div><p>রাসূলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ</div></div><p>অর্থ: যে ব্যক্তি ইচ্ছাকৃতভাবে আমার ওপর মিথ্যা আরোপ করবে, সে যেন জাহান্নামে তার ঠিকানা তৈরি করে নেয়।</p><p>এ হাদিসটি অসংখ্য সাহাবি এবং পরবর্তী যুগের বহু রাবি বর্ণনা করেছেন।</p><div class=\"h hm\">মুতাওয়াতির হাদিসের হুকুম</div><p>মুতাওয়াতির হাদিসের হুকুম সম্পর্কে আলেমদের মধ্যে কয়েকটি মত রয়েছে।</p><div class=\"h hs\">প্রথমত: আহলে সুন্নাত ওয়াল জামায়াতের মত</div><p style=\"padding-left:4px\"><b>১।</b> মুতাওয়াতির হাদিস অকাট্য ও নিশ্চিত জ্ঞানের (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عِلْمٌ يَقِينِيٌّ</span>) উপকারিতা প্রদান করে।</p><p style=\"padding-left:4px\"><b>২।</b> এ হাদিসের ওপর আমল করা ওয়াজিব।</p><p style=\"padding-left:4px\"><b>৩।</b> অকাট্যভাবে প্রমাণিত মুতাওয়াতির হাদিস অস্বীকার করা গুরুতর অপরাধ।</p><p style=\"padding-left:4px\"><b>৪।</b> এর দ্বারা কুরআনের কোনো বিধানের ব্যাখ্যা ও বিশদ বিবরণ প্রদান করা যায়।</p><div class=\"h hs\">দ্বিতীয়ত: মুতাযিলা সম্প্রদায়ের মত</div><p style=\"padding-left:4px\"><b>১।</b> মুতাওয়াতির হাদিস প্রশান্তিমূলক জ্ঞানের (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عِلْمُ الطُّمَأْنِينَةِ</span>) উপকারিতা প্রদান করে।</p><p style=\"padding-left:4px\"><b>২।</b> এ হাদিস অস্বীকারকারীকে কাফের বলা যাবে না।</p><p style=\"padding-left:4px\"><b>৩।</b> তাদের মতে, এর দ্বারা কুরআনের আয়াত রহিতকরণ বৈধ।</p><div class=\"h hs\">তৃতীয়ত: আবু বকর দাক্কাক (র.)-এর মত</div><p style=\"padding-left:4px\"><b>১।</b> এ হাদিসের মাধ্যমে প্রমাণভিত্তিক জ্ঞান (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عِلْمٌ اسْتِدْلَالِيٌّ</span>) অর্জিত হয়।</p><p style=\"padding-left:4px\"><b>২।</b> তাঁর মতে, এ হাদিস অস্বীকারকারীকে কাফের বলা যাবে।</p><div class=\"h hs\">খ. হাদিসে আহাদ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الحديث الآحاد</span>)</div><div class=\"h hs hs2\">আভিধানিক অর্থ:</div><p>আহাদ শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَحَدٌ</span> শব্দের বহুবচন। এর অর্থ হলো</p><p style=\"padding-left:4px\"><b>১.</b> একক</p><p style=\"padding-left:4px\"><b>২.</b> অদ্বিতীয়</p><p style=\"padding-left:4px\"><b>৩.</b> এক</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ هُوَ اللَّهُ أَحَدٌ</div></div><p>অর্থ: বলুন, তিনি আল্লাহ, এক ও অদ্বিতীয়।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা:</div><p class=\"bh\"><b>ইমাম ইবনে হাজার আসকালানী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَبَرُ الْوَاحِدِ فِي الِاصْطِلَاحِ مَا لَمْ يَجْمَعْ فِيهِ شُرُوطُ التَّوَاتُرِ</div></div><p>অর্থ: পরিভাষায় যে হাদিসের মধ্যে মুতাওয়াতিরের শর্তাবলি পাওয়া যায় না, তাকে খবর ওয়াহিদ বা হাদিসে আহাদ বলে।</p><p class=\"bh\"><b>ড. মুহাম্মদ ইজায বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَبَرُ الْآحَادِ وَهُوَ مَا رَوَاهُ الْوَاحِدُ أَوِ الْإِثْنَانِ فَأَكْثَرُ</div></div><p>অর্থ: যে সংবাদ একজন, দুজন অথবা তার চেয়ে অধিকসংখ্যক রাবি বর্ণনা করেছেন, তাকে খবরুল আহাদ বলে।</p><div class=\"h hs hs2\">উদাহরণ:</div><p>রাসূলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ</div></div><p>অর্থ: তোমাদের কেউ ততক্ষণ পর্যন্ত পূর্ণ মুমিন হতে পারবে না, যতক্ষণ না আমি তার কাছে তার পিতা, সন্তান এবং সমগ্র মানবজাতির চেয়ে অধিক প্রিয় হই।</p><div class=\"h hm\">হাদিসে আহাদের হুকুম (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حكم حديث الآحاد</span>)</div><p>হাদিসে আহাদের হুকুম সম্পর্কে মুহাদ্দিস ও উসুলবিদ আলেমদের মধ্যে মতভেদ রয়েছে। এ বিষয়ে প্রধান মতগুলো নিম্নরূপ—</p><div class=\"h hs\">প্রথমত: আহলে সুন্নাত ওয়াল জামায়াতের মত</div><p style=\"padding-left:4px\"><b>১।</b> সহিহ ও হাসান হাদিসে আহাদ গ্রহণযোগ্য এবং তা দ্বারা আমল করা ওয়াজিব।</p><p style=\"padding-left:4px\"><b>২।</b> বিশুদ্ধ হাদিসে আহাদ শরিয়তের দলিল হিসেবে গণ্য হয়।</p><p style=\"padding-left:4px\"><b>৩।</b> অধিকাংশ উসুলবিদের মতে, হাদিসে আহাদ নিজে অকাট্য জ্ঞান (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عِلْمٌ يَقِينِيٌّ</span>) প্রদান করে না; বরং প্রবল ধারণা (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">ظَنٌّ غَالِبٌ</span>) প্রদান করে।</p><p style=\"padding-left:4px\"><b>৪।</b> তবে বিশেষ প্রমাণ ও গ্রহণযোগ্যতার অতিরিক্ত কারণ থাকলে হাদিসে আহাদ নিশ্চিত জ্ঞানের উপকারিতাও প্রদান করতে পারে।</p><div class=\"h hs\">দ্বিতীয়ত: মুহাদ্দিসগণের একটি মত</div><p style=\"padding-left:4px\"><b>১।</b> বিশুদ্ধ হাদিসে আহাদ গ্রহণযোগ্য এবং এর ওপর আমল করা ওয়াজিব।</p><p style=\"padding-left:4px\"><b>২।</b> গ্রহণযোগ্য হাদিসে আহাদ কখনো কখনো জ্ঞানের উপকারিতাও প্রদান করে।</p><p style=\"padding-left:4px\"><b>৩।</b> বিশেষ করে উম্মাহর কাছে ব্যাপকভাবে গৃহীত ও সমর্থিত হাদিসে আহাদ নিশ্চিত জ্ঞানের উপকারিতা প্রদান করতে পারে।</p><div class=\"h hs\">তৃতীয়ত: কিছু উসুলবিদের মত</div><p style=\"padding-left:4px\"><b>১।</b> হাদিসে আহাদ মূলত প্রবল ধারণামূলক জ্ঞানের (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عِلْمٌ ظَنِّيٌّ</span>) উপকারিতা প্রদান করে।</p><p style=\"padding-left:4px\"><b>২।</b> আকিদার ক্ষেত্রে শুধু হাদিসে আহাদের ওপর নির্ভর করার বিষয়ে তাঁদের মধ্যে মতভেদ রয়েছে।</p><p style=\"padding-left:4px\"><b>৩।</b> শরিয়তের বিধান প্রমাণের ক্ষেত্রে শর্তসাপেক্ষে হাদিসে আহাদ গ্রহণযোগ্য।</p><p>সারকথা: মুতাওয়াতির হাদিস অকাট্য জ্ঞানের উপকারিতা প্রদান করে। আর বিশুদ্ধ হাদিসে আহাদ গ্রহণযোগ্য শরয়ি দলিল এবং এর ওপর আমল করা ওয়াজিব। অধিকাংশ আলেমের মতে, এটি প্রবল ধারণামূলক জ্ঞানের উপকারিতা প্রদান করে।</p><div class=\"h hm\">হাদিসে আহাদের প্রকারভেদ</div><p>হাদিসে আহাদ প্রধানত তিন প্রকার। যথা—</p><p style=\"padding-left:4px\"><b>১।</b> গরিব (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">غريب</span>)</p><p style=\"padding-left:4px\"><b>২।</b> আজিজ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عزيز</span>)</p><p style=\"padding-left:4px\"><b>৩।</b> মশহুর (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مشهور</span>)</p><div class=\"h hm\"><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْفَرْقُ بَيْنَ الْحَدِيثِ وَالْخَبَرِ</span> (হাদীস ও খবরের মধ্যে পার্থক্য)</div><p>আপাতদৃষ্টিতে হাদীস ও খবরের মধ্যে তেমন কোনো পার্থক্য দেখা না গেলেও মুহাদ্দিসীনে কেরাম এ দুটির মধ্যে কিছু পার্থক্য তুলে ধরেছেন। নিম্নে তা আলোচনা করা হলো—</p><div class=\"h hs\">১. আভিধানিক পার্থক্য:</div><p>হাদীস: <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَدِيث</span> শব্দটি একবচন, এর বহুবচন <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَحَادِيث</span>। এর আভিধানিক অর্থ কথা, নতুন, ঘটনা, উপদেশ ইত্যাদি।</p><p>খবর: <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">خَبَر</span> শব্দটি একবচন, এর বহুবচন <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَخْبَار</span>। এর আভিধানিক অর্থ সংবাদ বা খবর।</p><div class=\"h hs\">২. পারিভাষিক পার্থক্য:</div><p class=\"bh\"><b>ক. নুযহাতুন নাযার গ্রন্থকারের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْحَدِيثُ مَا جَاءَ عَنِ النَّبِيِّ ﷺ وَالْخَبَرُ هُوَ مَا جَاءَ مِنْ غَيْرِهِمَا</div></div><p>অর্থ: মহানবী (স.) থেকে যা বর্ণিত হয়েছে, তাকে হাদীস বলে। আর মহানবী (স.) ছাড়া অন্যদের থেকে যা বর্ণিত হয়েছে, তাকে খবর বলে।</p><p class=\"bh\"><b>খ. জমহুর মুহাদ্দিসীনের মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا فَرْقَ بَيْنَهُمَا</div></div><p>অর্থ: হাদীস ও খবরের মধ্যে কোনো পার্থক্য নেই। উভয় শব্দ একই অর্থে ব্যবহৃত হয়। অর্থাৎ রাসূল (স.), সাহাবি ও তাবেয়িগণের কথা, কাজ ও সমর্থনকে উভয় শব্দের মাধ্যমে বোঝানো হয়।</p><div class=\"h hs\">গ. কোনো কোনো মুহাদ্দিসের মতে:</div><p>রাসূলুল্লাহ (স.)-এর কথা, কাজ ও সমর্থনকে হাদীস বলা হয়। আর সাহাবি ও তাবেয়িগণের কথা, কাজ ও সমর্থনকে খবর বলা হয়।</p><div class=\"h hs\">ঘ. কোনো কোনো আলেমের মতে:</div><p>রাসূল (স.), সাহাবি ও তাবেয়িগণের কথা, কাজ ও সমর্থনকে হাদীস বলা হয়। আর রাজা-বাদশাহদের কাহিনী ও প্রাচীনকালের ঘটনাবলিকে খবর বলা হয়।</p><div class=\"h hs\">ঙ. কোনো কোনো আলেমের মতে:</div><p>হাদীস ও খবরের মধ্যে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">عُمُومٌ وَخُصُوصٌ مُطْلَقٌ</span> তথা ব্যাপক ও বিশেষের সম্পর্ক রয়েছে। অর্থাৎ, প্রত্যেক হাদীসই খবর, কিন্তু প্রত্যেক খবর হাদীস নয়।</p><p class=\"bh\"><b>চ. আল্লামা ইবনে হাজার আসকালানি (র.)-এর মতে—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كُلُّ حَدِيثٍ خَبَرٌ وَبَعْضُ الْخَبَرِ حَدِيثٌ وَبَعْضُ الْخَبَرِ لَيْسَ بِحَدِيثٍ</div></div><p>অর্থ: প্রত্যেক হাদীসই খবর, কোনো কোনো খবর হাদীস এবং কোনো কোনো খবর হাদীস নয়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, হাদীস ও খবরের মধ্যে পার্থক্য নির্ধারণে মুহাদ্দিসীনে কেরামের মধ্যে একাধিক মত রয়েছে। তবে অধিকাংশ মুহাদ্দিসের মতে, এ দুটি শব্দ একই অর্থে ব্যবহৃত হয়। আবার অনেকের মতে, হাদীস ও খবরের মধ্যে ব্যাপক ও বিশেষের সম্পর্ক বিদ্যমান।</p>"], ["মুকাসসিরীন-এর পরিচয় দাও এবং মুকাসসিরীন সাহাবীগণের নাম ও তাঁদের বর্ণিত হাদিসের সংখ্যা উল্লেখ কর।", "<div class=\"h hm\">ভূমিকা</div><p>মহান আল্লাহর পক্ষ থেকে প্রেরিত সর্বশেষ নবী হযরত মুহাম্মদ (সা.)-এর পবিত্র বাণী, কর্ম ও অনুমোদনকে হাদিস বলা হয়। সাহাবায়ে কেরাম (রা.) অত্যন্ত নিষ্ঠা ও আন্তরিকতার সঙ্গে রাসুলুল্লাহ (সা.)-এর হাদিস সংরক্ষণ ও পরবর্তী প্রজন্মের কাছে পৌঁছে দিয়েছেন। তাঁদের মধ্যে কতিপয় সাহাবি অসংখ্য হাদিস বর্ণনা করেছেন। হাদিসশাস্ত্রে অধিক হাদিস বর্ণনাকারী এসব সাহাবিকে ‘মুকসিরুন’ বলা হয়। নিম্নে মুকসিরুন-এর পরিচয় ও সংজ্ঞা আলোচনা করা হলো।</p><div class=\"h hm\">মুকসিরুন-এর পরিচয় ও সংজ্ঞা</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p>মুকসিরুন (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">المكثرون</span>) শব্দটি আরবি ‘কাসরাতুন’ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">كثرة</span>) শব্দ থেকে উদ্ভূত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> অধিকতা।</p><p style=\"padding-left:4px\"><b>২।</b> আধিক্য।</p><p style=\"padding-left:4px\"><b>৩।</b> প্রাচুর্য।</p><p style=\"padding-left:4px\"><b>৪।</b> সংখ্যাধিক্য।</p><p style=\"padding-left:4px\"><b>৫।</b> বিপুল পরিমাণ।</p><p style=\"padding-left:4px\"><b>৬।</b> অধিক হারে বর্ণনা করা।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p class=\"bh\"><b>ইমাম সুয়ূতি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْمُكْثِرُونَ هُمُ الصَّحَابَةُ الَّذِينَ رَوَوْا أَلْفَ حَدِيثٍ فَأَكْثَرَ.</div></div><p>অর্থ: যেসব সাহাবি এক হাজার বা তার বেশি হাদিস বর্ণনা করেছেন, তাঁদের মুকসিরুন বলা হয়।</p><p class=\"bh\"><b>আল্লামা ইরাকি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْمُكْثِرُونَ مِنَ الصَّحَابَةِ سَبْعَةٌ.</div></div><p>অর্থ: অধিক হাদিস বর্ণনাকারী সাহাবির সংখ্যা সাতজন।</p><p class=\"bh\"><b>ইমাম নববী (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَكْثَرُهُمْ حَدِيثًا أَبُو هُرَيْرَةَ، ثُمَّ ابْنُ عُمَرَ، وَابْنُ عَبَّاسٍ، وَجَابِرُ بْنُ عَبْدِ اللَّهِ، وَأَنَسُ بْنُ مَالِكٍ، وَعَائِشَةُ.</div></div><p>অর্থ: সাহাবিদের মধ্যে সর্বাধিক হাদিস বর্ণনাকারী হলেন আবু হুরায়রা (রা.)। এরপর আবদুল্লাহ ইবনে উমর, আবদুল্লাহ ইবনে আব্বাস, জাবির ইবনে আবদুল্লাহ, আনাস ইবনে মালিক এবং আয়িশা (রা.)।</p><p class=\"bh\"><b>ইমাম সাখাবি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الَّذِينَ زَادَ حَدِيثُهُمْ عَلَى أَلْفٍ سِتَّةٌ.</div></div><p>অর্থ: যেসব সাহাবির বর্ণিত হাদিসের সংখ্যা এক হাজারের বেশি, তাঁদের সংখ্যা ছয়জন।</p><div class=\"h hs hs2\">সারকথা :</div><p>যেসব সাহাবি রাসুলুল্লাহ (সা.) থেকে এক হাজার বা তার বেশি হাদিস বর্ণনা করেছেন, তাঁদের মুকসিরুন বলা হয়। হাদিসশাস্ত্রে অধিক হাদিস বর্ণনাকারী সাহাবিদের বোঝাতে এ পরিভাষা ব্যবহৃত হয়। প্রসিদ্ধ মতে, মুকসিরুন সাহাবির সংখ্যা সাতজন। তাঁদের মধ্যে সর্বাধিক হাদিস বর্ণনা করেছেন আবু হুরায়রা (রা.)।</p><div class=\"h hm\">মুকসিরুন সাহাবিদের পরিচয় ও তাঁদের বর্ণিত হাদিসের সংখ্যা</div><p>প্রখ্যাত মুহাদ্দিসদের মতে, অধিক হাদিস বর্ণনাকারী মুকসিরুন সাহাবি সাতজন। তাঁরা হলেন—</p><div class=\"h hs\">ক. হযরত আবু হুরায়রা (রা.) :</div><p>তিনি সর্বাধিক হাদিস বর্ণনাকারী সাহাবি। তাঁর প্রকৃত নাম সম্পর্কে মুহাদ্দিসদের মধ্যে মতভেদ রয়েছে। তিনি ৭ম হিজরিতে খায়বার যুদ্ধের সময় ইসলাম গ্রহণ করেন। অল্প সময় রাসুলুল্লাহ (সা.)-এর সাহচর্যে থাকলেও হাদিস শিক্ষা, মুখস্থ ও সংরক্ষণে অসাধারণ মনোযোগী ছিলেন। তিনি আহলে সুফফার অন্তর্ভুক্ত ছিলেন। তাঁর বর্ণিত হাদিসের সংখ্যা ৫৩৭৪টি।</p><div class=\"h hs\">খ. হযরত আবদুল্লাহ ইবনে উমর (রা.) :</div><p>তিনি দ্বিতীয় খলিফা হযরত উমর (রা.)-এর পুত্র। তিনি অল্প বয়সেই ইসলাম গ্রহণ করেন এবং রাসুলুল্লাহ (সা.)-এর সঙ্গে বিভিন্ন যুদ্ধে অংশগ্রহণ করেন। সুন্নাহ অনুসরণে তিনি অত্যন্ত সতর্ক ও নিষ্ঠাবান ছিলেন। রাসুলুল্লাহ (সা.)-এর কথা ও কাজ যথাযথভাবে অনুসরণ করতেন। তাঁর বর্ণিত হাদিসের সংখ্যা ২৬৩০টি।</p><div class=\"h hs\">গ. হযরত আনাস ইবনে মালিক (রা.) :</div><p>তিনি একজন বিশিষ্ট আনসারি সাহাবি। তাঁর মা উম্মে সুলাইম (রা.) তাঁকে ছোটবেলায় রাসুলুল্লাহ (সা.)-এর খেদমতে নিয়োজিত করেন। তিনি প্রায় দশ বছর রাসুলুল্লাহ (সা.)-এর সেবা করার সৌভাগ্য লাভ করেন। এ সময় তিনি নবিজির দৈনন্দিন জীবন, আচার-আচরণ ও বিভিন্ন ঘটনা কাছ থেকে পর্যবেক্ষণ করেন। তাঁর বর্ণিত হাদিসের সংখ্যা ২২৮৬টি।</p><div class=\"h hs\">ঘ. হযরত আয়েশা সিদ্দিকা (রা.) :</div><p>তিনি হযরত আবু বকর সিদ্দিক (রা.)-এর কন্যা এবং রাসুলুল্লাহ (সা.)-এর সম্মানিত স্ত্রী। তিনি উম্মুল মুমিনিন হিসেবে পরিচিত। তিনি ছিলেন অসাধারণ জ্ঞানী, বিচক্ষণ ও প্রখর স্মৃতিশক্তির অধিকারী। হাদিস, ফিকহ ও ইসলামী জ্ঞানের বিভিন্ন শাখায় তাঁর বিশেষ অবদান রয়েছে। বিশেষ করে পারিবারিক জীবন ও নারীদের বিধানসংক্রান্ত বহু হাদিস তিনি বর্ণনা করেছেন। তাঁর বর্ণিত হাদিসের সংখ্যা ২২১০টি।</p><div class=\"h hs\">ঙ. হযরত আবদুল্লাহ ইবনে আব্বাস (রা.) :</div><p>তিনি রাসুলুল্লাহ (সা.)-এর চাচাতো ভাই এবং হযরত আব্বাস (রা.)-এর পুত্র। তিনি অল্প বয়সেই রাসুলুল্লাহ (সা.)-এর সাহচর্য লাভ করেন। জ্ঞান অর্জন ও কুরআন-হাদিস অধ্যয়নে তিনি অত্যন্ত আগ্রহী ছিলেন। তাঁর অসাধারণ জ্ঞানের কারণে তিনি ‘তারজুমানুল কুরআন’ ও ‘হিবরুল উম্মাহ’ উপাধিতে পরিচিত হন। তাঁর বর্ণিত হাদিসের সংখ্যা ১৬৬০টি।</p><div class=\"h hs\">চ. হযরত জাবির ইবনে আবদুল্লাহ (রা.) :</div><p>তিনি একজন বিশিষ্ট আনসারি সাহাবি। তিনি রাসুলুল্লাহ (সা.)-এর সঙ্গে বিভিন্ন যুদ্ধে অংশগ্রহণ করেন এবং তাঁর কাছ থেকে বহু হাদিস শিক্ষা করেন। বিশেষ করে হজ, ইবাদত ও সামাজিক জীবনসংক্রান্ত বিভিন্ন বিষয়ে তাঁর বর্ণিত হাদিস গুরুত্বপূর্ণ। তিনি দীর্ঘদিন জীবিত থেকে হাদিস শিক্ষা ও প্রচারে অবদান রাখেন। তাঁর বর্ণিত হাদিসের সংখ্যা ১৫৪০টি।</p><div class=\"h hs\">ছ. হযরত আবু সাঈদ খুদরি (রা.) :</div><p>তিনি একজন বিশিষ্ট আনসারি সাহাবি। তাঁর প্রকৃত নাম সা‘দ ইবনে মালিক ইবনে সিনান (রা.)। তিনি অল্প বয়স থেকেই রাসুলুল্লাহ (সা.)-এর সাহচর্য লাভ করেন এবং বিভিন্ন সময় তাঁর কাছ থেকে হাদিস শিক্ষা করেন। তিনি ইবাদত, আখলাক, ফিতনা ও ইসলামী বিধিবিধানসংক্রান্ত বহু হাদিস বর্ণনা করেছেন। তাঁর বর্ণিত হাদিসের সংখ্যা ১১৭০টি।</p><div class=\"h hm\">মুকসিরুন সাহাবিদের সংখ্যা নির্ধারণে মতভেদ</div><p>মুকসিরুন সাহাবিদের সংখ্যা নির্ধারণের ক্ষেত্রে মুহাদ্দিসদের মধ্যে সামান্য মতপার্থক্য রয়েছে। অধিকাংশ মুহাদ্দিসের মতে, মুকসিরুন সাহাবির সংখ্যা সাতজন। তবে কোনো কোনো মুহাদ্দিস তাঁদের সংখ্যা ছয়জন বলে উল্লেখ করেছেন। এ মতপার্থক্যের মূল কারণ হলো হাদিস গণনা ও বর্ণনার পদ্ধতিগত পার্থক্য। প্রসিদ্ধ সাতজনের মধ্যে আবু সাঈদ খুদরি (রা.)-এর নামও বিশেষভাবে উল্লেখযোগ্য।</p><div class=\"h hm\">মুকসিরুন সাহাবিদের বিশেষ বৈশিষ্ট্য</div><p>মুকসিরুন সাহাবিগণ হাদিস সংরক্ষণ, মুখস্থকরণ ও প্রচারে অসাধারণ ভূমিকা পালন করেছেন। তাঁদের মধ্যে কেউ দীর্ঘদিন রাসুলুল্লাহ (সা.)-এর সাহচর্য লাভ করেছেন, কেউ পারিবারিক জীবনের ঘনিষ্ঠ বিষয়গুলো সংরক্ষণ করেছেন এবং কেউ হাদিস শিক্ষা ও প্রচারে বিশেষভাবে আত্মনিয়োগ করেছেন। তাঁদের অসাধারণ স্মৃতিশক্তি, জ্ঞানপিপাসা ও সুন্নাহর প্রতি গভীর অনুরাগ তাঁদের অধিক হাদিস বর্ণনার অন্যতম বৈশিষ্ট্য।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, মুকসিরুন সাহাবিগণ হাদিসশাস্ত্রের ইতিহাসে অত্যন্ত গুরুত্বপূর্ণ স্থান অধিকার করে আছেন। তাঁদের আন্তরিক প্রচেষ্টা, অসাধারণ স্মৃতিশক্তি ও হাদিস সংরক্ষণের নিষ্ঠার ফলে রাসুলুল্লাহ (সা.)-এর অসংখ্য বাণী, কর্ম ও আদর্শ পরবর্তী প্রজন্মের কাছে পৌঁছেছে। ইসলামী জ্ঞানচর্চা ও হাদিস সংরক্ষণে তাঁদের অবদান চিরস্মরণীয় হয়ে থাকবে।</p>"], ["ইমাম তাহাভী (র.)-এর সংক্ষিপ্ত জীবনী এবং ‘শারহু মায়ানিল আছার’ রচনায় তাঁর অনুসৃত পদ্ধতি লিপিবদ্ধ কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলামি শরিয়তের দ্বিতীয় প্রধান উৎস হলো হাদিস। রাসুলুল্লাহ (সা.)-এর বাণী, কর্ম ও অনুমোদনের মাধ্যমে মুসলমানরা জীবনের বিভিন্ন বিধিবিধান জানতে পারে। হাদিসের ব্যাখ্যা, বিশ্লেষণ এবং ফিকহি বিধান নির্ণয়ে যুগে যুগে বহু প্রখ্যাত মুহাদ্দিস গুরুত্বপূর্ণ অবদান রেখেছেন। তাঁদের মধ্যে ইমাম আবু জাফর আত-তাহাবি (রহ.) অন্যতম। তিনি ছিলেন একজন বিখ্যাত মুহাদ্দিস, ফকিহ ও হানাফি মাজহাবের বিশিষ্ট আলেম। তাঁর রচিত শরহু মাআনিল আছার হাদিসশাস্ত্রের একটি গুরুত্বপূর্ণ ও মূল্যবান গ্রন্থ। এ গ্রন্থে তিনি বিভিন্ন হাদিসের বাহ্যিক বিরোধ দূর করে সেগুলোর মধ্যে সমন্বয় সাধন এবং শরিয়তের বিধান নির্ণয়ের পদ্ধতি তুলে ধরেছেন।</p><div class=\"h hm\">ইমাম তাহাবি (রহ.)-এর সংক্ষিপ্ত জীবনী</div><div class=\"h hs\">ক. নাম ও পরিচয় :</div><p>ইমাম তাহাবি (রহ.)-এর পূর্ণ নাম আবু জাফর আহমদ ইবনে মুহাম্মদ ইবনে সালামা আল-আযদি আত-তাহাবি আল-মিসরি। তিনি ইমাম তাহাবি নামে অধিক পরিচিত। তিনি ছিলেন একজন বিখ্যাত মুহাদ্দিস, ফকিহ, গবেষক ও হানাফি মাজহাবের অন্যতম শ্রেষ্ঠ ইমাম। হাদিস ও ফিকহশাস্ত্রে তাঁর গভীর পাণ্ডিত্য ছিল।</p><div class=\"h hs\">খ. জন্ম ও বংশপরিচয় :</div><p>ইমাম তাহাবি (রহ.) ২৩৯ হিজরিতে মিসরের ত্বহা নামক গ্রামে জন্মগ্রহণ করেন। তাঁর নামের সঙ্গে ‘তাহাবি’ উপাধিটি জন্মস্থানের নাম থেকেই যুক্ত হয়েছে। তিনি একটি জ্ঞানী ও ধর্মপরায়ণ পরিবারে বেড়ে ওঠেন। তাঁর পরিবারে ইসলামি জ্ঞানচর্চার পরিবেশ বিদ্যমান ছিল।</p><div class=\"h hs\">গ. শিক্ষাজীবন :</div><p>ইমাম তাহাবি (রহ.) শৈশব থেকেই ইসলামি জ্ঞান অর্জনে মনোনিবেশ করেন। তিনি প্রথমে তাঁর মামা বিখ্যাত শাফেয়ি আলেম ইমাম ইসমাইল ইবনে ইয়াহইয়া আল-মুযানি (রহ.)-এর কাছে শিক্ষা গ্রহণ করেন। পরবর্তীতে তিনি হানাফি মাজহাবের দিকে ঝুঁকে পড়েন এবং এ মাজহাবের বিখ্যাত আলেমদের কাছ থেকে হাদিস ও ফিকহশাস্ত্র অধ্যয়ন করেন। দীর্ঘ অধ্যয়ন ও গবেষণার মাধ্যমে তিনি একজন প্রখ্যাত মুহাদ্দিস ও ফকিহ হিসেবে প্রতিষ্ঠিত হন।</p><div class=\"h hs\">ঘ. শিক্ষক ও ছাত্রবৃন্দ :</div><p>ইমাম তাহাবি (রহ.) তৎকালীন বহু বিখ্যাত আলেমের কাছ থেকে জ্ঞান অর্জন করেন। তাঁর উল্লেখযোগ্য শিক্ষকদের মধ্যে ছিলেন—</p><p style=\"padding-left:4px\"><b>১।</b> ইমাম ইসমাইল ইবনে ইয়াহইয়া আল-মুযানি (রহ.)</p><p style=\"padding-left:4px\"><b>২।</b> ইমাম ইউনুস ইবনে আবদুল আ'লা (রহ.)</p><p style=\"padding-left:4px\"><b>৩।</b> ইমাম আহমদ ইবনে শুআইব আন-নাসায়ি (রহ.)</p><p style=\"padding-left:4px\"><b>৪।</b> ইমাম বকর ইবনে কুতাইবা (রহ.)</p><p>তাঁর কাছ থেকেও বহু শিক্ষার্থী হাদিস ও ফিকহশাস্ত্র শিক্ষা গ্রহণ করেন। তাঁদের মধ্যে আবু বকর ইবনে আবি দাউদ এবং আবু আল-কাসিম আত-তাবারানি (রহ.) উল্লেখযোগ্য।</p><div class=\"h hs\">ঙ. জ্ঞান ও গবেষণায় অবদান :</div><p>ইমাম তাহাবি (রহ.) হাদিস, ফিকহ, আকিদা ও ইসলামি আইনশাস্ত্রে অসাধারণ দক্ষতা অর্জন করেন। তিনি শুধু হাদিস বর্ণনা ও সংকলনেই সীমাবদ্ধ ছিলেন না; বরং হাদিসের ব্যাখ্যা, বিভিন্ন বর্ণনার মধ্যে আপাতবিরোধ নিরসন এবং শরিয়তের বিধান নির্ণয়ে বিশেষ অবদান রাখেন।</p><div class=\"h hs\">চ. উল্লেখযোগ্য গ্রন্থ :</div><p>ইমাম তাহাবি (রহ.) বহু গুরুত্বপূর্ণ গ্রন্থ রচনা করেন। তাঁর উল্লেখযোগ্য গ্রন্থগুলো হলো—</p><p style=\"padding-left:4px\"><b>১।</b> শরহু মাআনিল আছার</p><p style=\"padding-left:4px\"><b>২।</b> শরহু মুশকিলিল আছার</p><p style=\"padding-left:4px\"><b>৩।</b> আল-আকিদাতুত তাহাবিয়্যাহ</p><p style=\"padding-left:4px\"><b>৪।</b> আহকামুল কুরআন</p><p style=\"padding-left:4px\"><b>৫।</b> মুখতাসারুত তাহাবি</p><div class=\"h hs\">ছ. ইন্তেকাল :</div><p>ইমাম তাহাবি (রহ.) ৩২১ হিজরিতে মিসরের ফুসতাত নগরে ইন্তেকাল করেন। হাদিস ও ফিকহশাস্ত্রে তাঁর অসামান্য অবদানের কারণে তিনি মুসলিম জ্ঞানজগতে চিরস্মরণীয় হয়ে আছেন।</p><div class=\"h hm\">শরহু মাআনিল আছার রচনায় ইমাম তাহাবি (রহ.)-এর অনুসৃত পদ্ধতি</div><p>ইমাম তাহাবি (রহ.) তাঁর বিখ্যাত গ্রন্থ শরহু মাআনিল আছার সংকলনের ক্ষেত্রে অত্যন্ত গবেষণাধর্মী ও যুক্তিনির্ভর পদ্ধতি অনুসরণ করেন। এ গ্রন্থে তিনি মূলত শরিয়তের বিধান-সম্পর্কিত হাদিসগুলোর ব্যাখ্যা, বিভিন্ন বর্ণনার মধ্যে আপাতবিরোধ নিরসন এবং সঠিক বিধান নির্ণয়ের চেষ্টা করেছেন। তাঁর অনুসৃত পদ্ধতিগুলো নিম্নে আলোচনা করা হলো—</p><div class=\"h hs\">ক. হাদিসের বিষয়ভিত্তিক সংকলন :</div><p>তিনি হাদিসগুলোকে বিভিন্ন বিষয় ও অধ্যায় অনুযায়ী সাজিয়েছেন। যেমন—পবিত্রতা, সালাত, সাওম, যাকাত, হজ, বিবাহ, লেনদেন ও অন্যান্য ফিকহি বিষয়। ফলে পাঠক সহজেই প্রয়োজনীয় বিষয়ের হাদিস খুঁজে পেতে পারেন।</p><div class=\"h hs\">খ. আপাতবিরোধপূর্ণ হাদিসের সমন্বয় :</div><p>একই বিষয়ে বর্ণিত দুটি হাদিসের মধ্যে বাহ্যিকভাবে বিরোধ দেখা দিলে তিনি সেগুলোর মধ্যে সমন্বয় সাধনের চেষ্টা করেছেন। তিনি প্রমাণ করেছেন যে, অনেক ক্ষেত্রে হাদিসের মধ্যে প্রকৃত কোনো বিরোধ নেই; বরং প্রেক্ষাপট ও ব্যাখ্যার পার্থক্যের কারণে এমনটি মনে হয়।</p><div class=\"h hs\">গ. নাসিখ ও মানসুখ নির্ণয় :</div><p>তিনি হাদিসের মধ্যে কোনো বিধান রহিত হয়েছে কি না, তা অনুসন্ধান করেছেন। কোনো হাদিসের বিধান পরবর্তী অন্য হাদিস দ্বারা রহিত হলে তিনি নাসিখ ও মানসুখ নির্ণয়ের মাধ্যমে বিষয়টি পরিষ্কার করেছেন।</p><div class=\"h hs\">ঘ. হাদিসের ব্যাখ্যা ও বিশ্লেষণ :</div><p>তিনি শুধু হাদিস সংকলন করেননি; বরং প্রতিটি হাদিসের অর্থ, উদ্দেশ্য ও প্রেক্ষাপট বিশ্লেষণ করেছেন। এর মাধ্যমে হাদিসের প্রকৃত মর্ম ও শরিয়তের বিধান তুলে ধরেছেন।</p><div class=\"h hs\">ঙ. আলেমদের মতামত উপস্থাপন :</div><p>কোনো বিষয়ে বিভিন্ন আলেমের মতামত ও তাঁদের যুক্তি তিনি গ্রন্থে উল্লেখ করেছেন। এক পক্ষের বক্তব্যের বিপরীতে অন্য পক্ষের দলিলও তুলে ধরেছেন। এরপর দলিলের আলোকে গ্রহণযোগ্য মত নির্ণয়ের চেষ্টা করেছেন।</p><div class=\"h hs\">চ. কুরআন ও সুন্নাহর আলোকে সিদ্ধান্ত গ্রহণ :</div><p>তিনি কোনো মতামত গ্রহণের ক্ষেত্রে পবিত্র কুরআন ও রাসুলুল্লাহ (সা.)-এর বিশুদ্ধ সুন্নাহকে প্রধান ভিত্তি হিসেবে গ্রহণ করেছেন। পাশাপাশি ইজমা এবং সাহাবি ও তাবেয়িদের সর্বজনস্বীকৃত বক্তব্য ও বর্ণনাকেও দলিল হিসেবে ব্যবহার করেছেন।</p><div class=\"h hs\">ছ. সনদ ও বর্ণনাকারী যাচাই :</div><p>তিনি হাদিসের সনদ ও বর্ণনাকারীদের অবস্থা পর্যালোচনা করেছেন। কোনো হাদিসের গ্রহণযোগ্যতা নির্ণয়ের ক্ষেত্রে বর্ণনাকারীদের নির্ভরযোগ্যতা এবং বর্ণনার বিশুদ্ধতার প্রতি বিশেষ গুরুত্ব দিয়েছেন।</p><div class=\"h hs\">জ. ফিকহি বিধান নির্ণয় :</div><p>তিনি বিভিন্ন হাদিসের আলোকে ইবাদত, লেনদেন ও সামাজিক জীবনের বিধিবিধান নির্ণয় করেছেন। বিশেষ করে হানাফি ফিকহের আলোকে বিভিন্ন মাসআলা আলোচনা করলেও দলিলের ভিত্তিতে মতামত বিশ্লেষণ করেছেন।</p><div class=\"h hs\">ঝ. যুক্তি ও প্রমাণের ভিত্তিতে মতামত নির্বাচন :</div><p>তিনি শুধু কোনো মাজহাবের মতামত উল্লেখ করেই ক্ষান্ত হননি; বরং কুরআন, হাদিস, ইজমা ও সাহাবিদের বক্তব্যের আলোকে বিভিন্ন মতামত যাচাই করেছেন। যাঁর বক্তব্যকে অধিক গ্রহণযোগ্য মনে করেছেন, তাঁর পক্ষে প্রমাণ উপস্থাপন করেছেন।</p><div class=\"h hs\">ঞ. গবেষণাধর্মী আলোচনা :</div><p>তিনি প্রতিটি বিষয় গভীরভাবে পর্যালোচনা করে বিভিন্ন হাদিসের বর্ণনা, ব্যাখ্যা ও দলিল একত্র করেছেন। ফলে গ্রন্থটি শুধু হাদিস সংকলন নয়; বরং হাদিসভিত্তিক ফিকহি গবেষণার একটি গুরুত্বপূর্ণ গ্রন্থে পরিণত হয়েছে।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইমাম তাহাবি (রহ.) ছিলেন হাদিস ও ফিকহশাস্ত্রের একজন অসাধারণ পণ্ডিত। তাঁর রচিত শরহু মাআনিল আছার হাদিসের ব্যাখ্যা, আপাতবিরোধ নিরসন, নাসিখ-মানসুখ নির্ণয় এবং শরিয়তের বিধান প্রতিষ্ঠার ক্ষেত্রে একটি গুরুত্বপূর্ণ গ্রন্থ। তিনি এ গ্রন্থে কুরআন, সুন্নাহ, ইজমা ও সাহাবিদের বক্তব্যের আলোকে বিভিন্ন মাসআলা বিশ্লেষণ করেছেন। তাই হাদিস ও ফিকহশাস্ত্রে তাঁর অবদান মুসলিম উম্মাহর কাছে চিরস্মরণীয় হয়ে থাকবে।</p>"], ["ইমাম তাহাভী (র.)-এর রচিত ‘শারহু মায়ানিল আছার’ গ্রন্থের বৈশিষ্ট্যাবলি আলোচনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলামি শরিয়তের দ্বিতীয় প্রধান উৎস হলো হাদিস। রাসুলুল্লাহ (সা.)-এর বাণী, কর্ম ও অনুমোদনের মাধ্যমে মুসলমানরা জীবনের বিভিন্ন বিধিবিধান জানতে পারে। হাদিসের ব্যাখ্যা, বিশ্লেষণ, আপাতবিরোধ নিরসন এবং ফিকহি বিধান নির্ণয়ের ক্ষেত্রে যুগে যুগে বহু প্রখ্যাত মুহাদ্দিস গুরুত্বপূর্ণ অবদান রেখেছেন। তাঁদের মধ্যে ইমাম আবু জাফর আত-তাহাবি (রহ.) অন্যতম। তাঁর রচিত শরহু মাআনিল আছার হাদিস ও ফিকহশাস্ত্রের একটি গুরুত্বপূর্ণ গবেষণাধর্মী গ্রন্থ। এ গ্রন্থে তিনি বিভিন্ন হাদিসের ব্যাখ্যা, সনদ পর্যালোচনা, নাসিখ-মানসুখ নির্ণয় এবং শরিয়তের বিধান প্রতিষ্ঠার পদ্ধতি তুলে ধরেছেন।</p><div class=\"h hm\">শরহু মাআনিল আছার গ্রন্থের পরিচয়</div><p>শরহু মাআনিল আছার ইমাম আবু জাফর আহমদ ইবনে মুহাম্মদ আত-তাহাবি (রহ.)-এর একটি বিখ্যাত হাদিসগ্রন্থ। এ গ্রন্থে তিনি মূলত শরিয়তের বিধান-সম্পর্কিত হাদিসগুলো সংকলন ও বিশ্লেষণ করেছেন। বিশেষ করে যেসব হাদিসের মধ্যে বাহ্যিকভাবে বিরোধ দেখা যায়, সেগুলোর মধ্যে সমন্বয় সাধন এবং সঠিক বিধান নির্ণয়ের চেষ্টা করেছেন। তিনি এ গ্রন্থে কুরআন, সুন্নাহ, ইজমা, সাহাবি ও তাবেয়িদের বক্তব্যের আলোকে বিভিন্ন মাসআলা বিশ্লেষণ করেছেন।</p><div class=\"h hm\">শরহু মাআনিল আছার গ্রন্থের বৈশিষ্ট্যাবলি</div><p>ইমাম তাহাবি (রহ.) তাঁর এ গ্রন্থে অত্যন্ত গবেষণাধর্মী, যুক্তিনির্ভর ও দলিলভিত্তিক পদ্ধতি অনুসরণ করেছেন। নিম্নে গ্রন্থটির উল্লেখযোগ্য বৈশিষ্ট্যগুলো আলোচনা করা হলো—</p><div class=\"h hs\">ক. আপাতবিরোধপূর্ণ হাদিসের সমন্বয় :</div><p>এ গ্রন্থের অন্যতম প্রধান বৈশিষ্ট্য হলো একই বিষয়ে বর্ণিত হাদিসগুলোর মধ্যে বাহ্যিক বিরোধ দেখা দিলে সেগুলোর সমন্বয় সাধন করা। তিনি মনে করতেন, অনেক ক্ষেত্রে হাদিসের মধ্যে প্রকৃত কোনো বিরোধ থাকে না; বরং প্রেক্ষাপট, সময় ও ব্যাখ্যার পার্থক্যের কারণে এমনটি মনে হয়।</p><p>এ প্রসঙ্গে তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْآثَارَ الْمَأْثُورَةَ عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الْأَحْكَامِ الَّتِي يَتَوَهَّمُ ... أَنَّ بَعْضَهَا يَنْقُضُ بَعْضًا.</div></div><p>অর্থ: রাসুলুল্লাহ (সা.) থেকে বর্ণিত বিধান-সম্পর্কিত এমন কিছু হাদিস রয়েছে, যেগুলো দেখে কেউ কেউ মনে করে যে, একটির সঙ্গে অন্যটির বিরোধ রয়েছে।</p><p>এ বক্তব্যের মাধ্যমে তিনি হাদিসের বাহ্যিক বিরোধ নিরসনের গুরুত্ব তুলে ধরেছেন।</p><div class=\"h hs\">খ. নাসিখ ও মানসুখ নির্ণয় :</div><p>ইমাম তাহাবি (রহ.) হাদিসের মধ্যে কোনো বিধান রহিত হয়েছে কি না, তা অনুসন্ধান করেছেন। কোনো হাদিসের বিধান পরবর্তী অন্য হাদিস দ্বারা রহিত হলে তিনি নাসিখ ও মানসুখ নির্ণয়ের মাধ্যমে বিষয়টি পরিষ্কার করেছেন। ফলে পাঠক জানতে পারেন কোন বিধানটি কার্যকর এবং কোনটি রহিত হয়েছে।</p><p>তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مِنْ نَاسِخِهَا مِنْ مَنْسُوخِهَا.</div></div><p>অর্থ: হাদিসগুলোর মধ্যে কোনটি রহিতকারী এবং কোনটি রহিত হয়েছে, তা নির্ণয় করা।</p><p>এটি তাঁর গ্রন্থের অন্যতম গুরুত্বপূর্ণ বৈশিষ্ট্য।</p><div class=\"h hs\">গ. আলেমদের মতামত ও ব্যাখ্যা উপস্থাপন :</div><p>কোনো বিষয়ে বিভিন্ন আলেম ও ফকিহের মতামত তিনি গ্রন্থে উল্লেখ করেছেন। এক পক্ষের বক্তব্যের বিপরীতে অন্য পক্ষের যুক্তি ও দলিলও তুলে ধরেছেন। এরপর প্রমাণের ভিত্তিতে গ্রহণযোগ্য মত নির্ণয়ের চেষ্টা করেছেন।</p><p>এ প্রসঙ্গে তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَتَأْوِيلِ الْعُلَمَاءِ وَاحْتِجَاجِ بَعْضِهِمْ عَلَى بَعْضٍ.</div></div><p>অর্থ: আলেমদের ব্যাখ্যা এবং তাঁদের একে অপরের বিরুদ্ধে উপস্থাপিত যুক্তি ও দলিল।</p><p>এ থেকে বোঝা যায়, তিনি বিভিন্ন আলেমের মতামত তুলনামূলকভাবে আলোচনা করেছেন।</p><div class=\"h hs\">ঘ. কুরআন ও সুন্নাহর আলোকে বিধান নির্ণয় :</div><p>তিনি শরিয়তের বিধান নির্ণয়ের ক্ষেত্রে পবিত্র কুরআন ও রাসুলুল্লাহ (সা.)-এর সুন্নাহকে প্রধান ভিত্তি হিসেবে গ্রহণ করেছেন। কোনো মতামত গ্রহণের ক্ষেত্রে তিনি কুরআন ও বিশুদ্ধ সুন্নাহর দলিলকে বিশেষ গুরুত্ব দিয়েছেন।</p><p>তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">بِمَا يَصِحُّ بِهِ مِثْلُهُ مِنْ كِتَابٍ أَوْ سُنَّةٍ.</div></div><p>অর্থ: কুরআন অথবা সুন্নাহর গ্রহণযোগ্য দলিলের মাধ্যমে।</p><p>এ পদ্ধতি তাঁর দলিলনির্ভর গবেষণার পরিচয় বহন করে।</p><div class=\"h hs\">ঙ. ইজমার মাধ্যমে দলিল প্রতিষ্ঠা :</div><p>ইমাম তাহাবি (রহ.) শুধু কুরআন ও সুন্নাহর ওপর নির্ভর করেননি; বরং প্রয়োজন অনুসারে ইজমাকেও দলিল হিসেবে গ্রহণ করেছেন। কোনো বিষয়ে আলেমদের ঐকমত্য থাকলে তিনি সেটিকে বিধান প্রতিষ্ঠার ক্ষেত্রে গুরুত্ব দিয়েছেন।</p><p>তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَوْ إِجْمَاعٍ.</div></div><p>অর্থ: অথবা ইজমার মাধ্যমে।</p><p>এতে শরিয়তের বিধান নির্ণয়ে তাঁর প্রমাণভিত্তিক পদ্ধতির পরিচয় পাওয়া যায়।</p><div class=\"h hs\">চ. সাহাবি ও তাবেয়িদের বক্তব্যের গুরুত্ব :</div><p>তিনি সাহাবায়ে কেরাম ও তাবেয়িদের বক্তব্যকে বিশেষ গুরুত্ব দিয়েছেন। তাঁদের থেকে বর্ণিত ঐকমত্যপূর্ণ ও ধারাবাহিক বক্তব্যের মাধ্যমে বিভিন্ন মাসআলার সমাধান উপস্থাপন করেছেন।</p><p>তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَوْ تَوَاتُرٍ مِنْ أَقَاوِيلِ الصَّحَابَةِ أَوْ تَابِعِيهِمْ.</div></div><p>অর্থ: অথবা সাহাবি ও তাবেয়িদের বক্তব্যের ধারাবাহিক ও ব্যাপক বর্ণনার মাধ্যমে।</p><p>এতে বোঝা যায়, তিনি পূর্ববর্তী প্রজন্মের আলেমদের জ্ঞান ও মতামতকে তাঁর গবেষণায় যথেষ্ট গুরুত্ব দিয়েছেন।</p><div class=\"h hs\">ছ. হাদিসের সনদ ও বর্ণনাকারী পর্যালোচনা :</div><p>ইমাম তাহাবি (রহ.) হাদিসের সনদ ও বর্ণনাকারীদের অবস্থা যাচাই করেছেন। কোনো হাদিস গ্রহণের ক্ষেত্রে বর্ণনাকারীদের নির্ভরযোগ্যতা, সনদের ধারাবাহিকতা এবং বর্ণনার বিশুদ্ধতার প্রতি গুরুত্ব দিয়েছেন। তিনি বিভিন্ন সনদ ও বর্ণনার পার্থক্য তুলে ধরে হাদিসের গ্রহণযোগ্যতা বিশ্লেষণ করেছেন।</p><div class=\"h hs\">জ. বিষয়ভিত্তিক অধ্যায় বিন্যাস :</div><p>তিনি হাদিসগুলোকে বিভিন্ন বিষয় ও অধ্যায় অনুযায়ী সাজিয়েছেন। যেমন—পবিত্রতা, সালাত, যাকাত, সাওম, হজ, বিবাহ, তালাক, ক্রয়-বিক্রয়, বিচারব্যবস্থা ও অন্যান্য ফিকহি বিষয়। এতে পাঠক সহজেই প্রয়োজনীয় বিষয়ের হাদিস খুঁজে পেতে পারেন।</p><div class=\"h hs\">ঝ. ফিকহি বিধান নির্ণয় :</div><p>গ্রন্থটির অন্যতম গুরুত্বপূর্ণ বৈশিষ্ট্য হলো হাদিসের আলোকে বিভিন্ন ফিকহি বিধান আলোচনা করা। বিশেষ করে ইবাদত, লেনদেন, পারিবারিক ও সামাজিক জীবনের বিভিন্ন মাসআলা তিনি দলিলসহ উপস্থাপন করেছেন। তিনি হাদিসের অর্থ ও প্রেক্ষাপট বিশ্লেষণ করে সেখান থেকে শরিয়তের বিধান নির্ণয় করেছেন।</p><div class=\"h hs\">ঞ. বিভিন্ন মতের তুলনামূলক আলোচনা :</div><p>তিনি বিভিন্ন ফিকহি মাজহাব ও আলেমদের মতামত তুলনামূলকভাবে আলোচনা করেছেন। প্রত্যেক মতের পক্ষে উপস্থাপিত দলিলগুলো পর্যালোচনা করেছেন এবং যুক্তি ও প্রমাণের আলোকে গ্রহণযোগ্য মত নির্ণয়ের চেষ্টা করেছেন। এতে গ্রন্থটি তুলনামূলক ফিকহের একটি গুরুত্বপূর্ণ উৎসে পরিণত হয়েছে।</p><div class=\"h hs\">ট. গবেষণাধর্মী ও যুক্তিনির্ভর আলোচনা :</div><p>ইমাম তাহাবি (রহ.) শুধু হাদিস সংগ্রহের মধ্যে সীমাবদ্ধ থাকেননি; বরং প্রতিটি বিষয় গভীরভাবে পর্যালোচনা করেছেন। তিনি বিভিন্ন হাদিসের বর্ণনা, সনদ, মতন, অর্থ ও বিধান সম্পর্কে বিস্তারিত গবেষণামূলক আলোচনা করেছেন।</p><p>এ প্রসঙ্গে তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنِّي نَظَرْتُ فِي ذَلِكَ وَبَحَثْتُ عَنْهُ بَحْثًا شَدِيدًا.</div></div><p>অর্থ: আমি এ বিষয়ে গভীরভাবে চিন্তা-ভাবনা করেছি এবং অত্যন্ত গুরুত্বসহকারে গবেষণা করেছি।</p><p>এ বক্তব্য তাঁর গবেষণার গভীরতা ও আন্তরিকতার পরিচয় বহন করে।</p><div class=\"h hs\">ঠ. অধ্যায় ও বিষয়ের সুশৃঙ্খল বিন্যাস :</div><p>তিনি গ্রন্থের প্রতিটি অংশে নির্দিষ্ট বিষয়ের হাদিসগুলো একত্র করেছেন। ফলে একই ধরনের মাসআলা ও বিধান সম্পর্কে এক জায়গায় বিস্তারিত আলোচনা পাওয়া যায়। তাঁর এ পদ্ধতি পাঠক ও গবেষকদের জন্য বিশেষ সহায়ক।</p><p>তিনি বলেন—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَجَعَلْتُ ذَلِكَ كُتُبًا، ذَكَرْتُ فِي كُلِّ كِتَابٍ مِنْهَا جِنْسًا مِنْ تِلْكَ الْأَجْنَاسِ.</div></div><p>অর্থ: আমি সেগুলোকে বিভিন্ন গ্রন্থ বা অধ্যায়ে বিন্যস্ত করেছি এবং প্রত্যেকটিতে একটি নির্দিষ্ট বিষয়ের আলোচনা সংকলন করেছি।</p><div class=\"h hs\">ড. হানাফি ফিকহের আলোকে আলোচনা :</div><p>ইমাম তাহাবি (রহ.) হানাফি মাজহাবের একজন বিশিষ্ট আলেম ছিলেন। তাই তাঁর গ্রন্থে হানাফি ফিকহের বিভিন্ন মতামত ও দলিলের আলোচনা বিশেষভাবে স্থান পেয়েছে। তবে তিনি অন্যান্য আলেমের মতামত ও তাঁদের দলিলও পর্যালোচনা করেছেন। এ কারণে গ্রন্থটি হানাফি ফিকহ ও হাদিসভিত্তিক গবেষণার জন্য বিশেষ গুরুত্বপূর্ণ।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইমাম তাহাবি (রহ.)-এর রচিত শরহু মাআনিল আছার হাদিস ও ফিকহশাস্ত্রের একটি অনন্য গবেষণাধর্মী গ্রন্থ। এতে হাদিসের ব্যাখ্যা, আপাতবিরোধ নিরসন, নাসিখ-মানসুখ নির্ণয়, আলেমদের মতামত বিশ্লেষণ এবং শরিয়তের বিধান প্রতিষ্ঠার ক্ষেত্রে গুরুত্বপূর্ণ আলোচনা স্থান পেয়েছে। বিশেষ করে কুরআন, সুন্নাহ, ইজমা, সাহাবি ও তাবেয়িদের বক্তব্যের আলোকে দলিল উপস্থাপনের পদ্ধতি এ গ্রন্থের বিশেষ বৈশিষ্ট্য। তাই হাদিসের অর্থ অনুধাবন, ফিকহি বিধান নির্ণয় এবং ইসলামি গবেষণার ক্ষেত্রে শরহু মাআনিল আছার একটি অমূল্য ও স্মরণীয় গ্রন্থ।</p>"], ["সিহাহ সিত্তাহ কী? ইমাম তিরমিযী (র.)-এর জীবনী সংক্ষেপে লেখ এবং জামেউত তিরমিযীর বৈশিষ্ট্যাবলি আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>ইসলামী শরিয়তের দ্বিতীয় প্রধান উৎস হলো হাদিস। রাসুলুল্লাহ (সা.)-এর বাণী, কর্ম ও অনুমোদন সংরক্ষণের জন্য যুগে যুগে মুহাদ্দিসগণ অসামান্য অবদান রেখেছেন। তাঁরা নিরলস প্রচেষ্টার মাধ্যমে অসংখ্য হাদিস সংকলন করেছেন। এসব সংকলনের মধ্যে ছয়টি হাদিসগ্রন্থ বিশেষ মর্যাদা ও প্রসিদ্ধি লাভ করেছে। এ ছয়টি প্রসিদ্ধ হাদিসগ্রন্থ সম্মিলিতভাবে ‘সিহাহ সিত্তাহ’ নামে পরিচিত। নিম্নে সিহাহ সিত্তাহ-এর পরিচয় ও সংজ্ঞা আলোচনা করা হলো।</p><div class=\"h hm\">সিহাহ সিত্তাহ-এর পরিচয়</div><div class=\"h hs hs2\">আভিধানিক অর্থ :</div><p>সিহাহ সিত্তাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الصحاح الستة</span>) দুটি আরবি শব্দের সমন্বয়ে গঠিত। যথা—</p><div class=\"h hs hs3\">ক. সিহাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الصحاح</span>) :</div><p>এটি সহিহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">صحيح</span>) শব্দের বহুবচন। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> বিশুদ্ধ।</p><p style=\"padding-left:4px\"><b>২।</b> নির্ভুল।</p><p style=\"padding-left:4px\"><b>৩।</b> নির্ভরযোগ্য।</p><p style=\"padding-left:4px\"><b>৪।</b> প্রামাণিক।</p><div class=\"h hs hs3\">খ. সিত্তাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الستة</span>) :</div><p>এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> ছয়।</p><p style=\"padding-left:4px\"><b>২।</b> ছয়টি।</p><p>সুতরাং সিহাহ সিত্তাহ-এর আভিধানিক অর্থ হলো ছয়টি বিশুদ্ধ বা প্রসিদ্ধ হাদিসগ্রন্থ।</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা :</div><p class=\"bh\"><b>ইমাম মুহাম্মদ ইবনে তাহির আল-মাকদিসি (রহ.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْكُتُبُ السِّتَّةُ هِيَ صَحِيحُ الْبُخَارِيِّ وَصَحِيحُ مُسْلِمٍ وَسُنَنُ أَبِي دَاوُدَ وَالتِّرْمِذِيِّ وَالنَّسَائِيِّ وَابْنِ مَاجَهْ.</div></div><p>অর্থ: ছয়টি হাদিসগ্রন্থ হলো—সহিহ বুখারি, সহিহ মুসলিম, সুনান আবু দাউদ, জামে তিরমিজি, সুনান নাসায়ি ও সুনান ইবনে মাজাহ।</p><p class=\"bh\"><b>ইমাম নববী (রহ.) বলেন—</
