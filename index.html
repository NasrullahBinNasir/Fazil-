:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.08);--fs:16px;--a1:#0f766e;--a2:#0e7490}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mu:#94a3b8;--ln:#243049;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:12px 12px 18px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:6px;max-width:1000px;margin:0 auto}.top h1{flex:1;margin:0;font-size:21px;line-height:1.25}
.tb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 11px;backdrop-filter:blur(6px)}.tb:active{transform:scale(.94)}
header>p{max-width:1000px;margin:6px auto 0;color:rgba(255,255,255,.85)}
.hero{max-width:1000px;margin:14px auto 0;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 14px}
.ring{position:relative;flex:none;width:84px;height:84px}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}.st div{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 2px}.st b{display:block;font-size:20px;line-height:1.2}.st small{font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 10px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;margin:6px 0 8px}
.tile b{display:block;font-size:18px;line-height:1.25}.tile small{color:var(--mu);font-size:14px}.tile.off{opacity:.5}
.big{display:flex;gap:14px;align-items:center}.big .ic{margin:6px 0;flex:none}
.pb{height:7px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .4s}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 10px 8px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;max-width:1000px;margin:0 auto 8px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.zb{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:0 12px;font-weight:700}.chips{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:20px;padding:2px 12px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.strip{max-width:1000px;margin:8px auto 0;font-size:14px;color:var(--mu);display:flex;gap:10px;align-items:center}.strip .pb{flex:1;margin:0;--c:var(--a1)}
.sec{margin-bottom:22px}.sh{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px}
.sh span{margin-left:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh)}
.no{float:left;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin:1px 9px 2px 0}
.q{font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;cursor:pointer}.q::after{content:' ▾';color:var(--c)}.card.show .q::after{content:' ▴'}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;clear:both}.ib{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:0 10px;font-size:14px}
.card.bm .bm,.card.kn .kn{background:var(--c);color:#fff;border-color:var(--c)}.card.kn{opacity:.8}
.a{font-size:var(--fs);margin-top:8px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--tx);border-radius:12px;padding:6px 12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(-4px)}}
.hid .a{display:none}.hid .card.show .a{display:block}.a b{color:var(--c)}
.alw .q::after{content:none!important}.alw .q{cursor:default}.hid .a{cursor:pointer}
.a .h{font-weight:700;color:var(--c);margin:12px 0 2px;padding-left:8px;border-left:4px solid var(--c)}.a p{margin:2px 0 6px;text-align:justify}
.ay{margin:8px 0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--c);text-align:center}.ay .ar{font:400 calc(var(--fs)*1.7)/2 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif}.ay .rf{color:var(--mu);font-size:.9em}
.empty{text-align:center;color:var(--mu);padding:30px}
.zi{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:20px;padding:4px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}.zi.on{opacity:1}


.qt3{background:color-mix(in srgb,var(--c) 10%,var(--card));border:0;border-radius:28px;box-shadow:none;padding:12px 16px}.qt3 .no{border-radius:12px}
.qt6{background:#0b0f1a;color:#e8edf8;border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}.qt6 .no{box-shadow:0 0 10px var(--c)}
.at8 .a{background:color-mix(in srgb,var(--c) 8%,var(--card))}.at8 .a .h{background:var(--c);color:#fff;border:0;border-radius:0 16px 16px 0;margin-left:-12px;padding:2px 14px;display:inline-block}.at8 .ay{border:0;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.15);border-radius:6px}

:root{--bg:#f3f5f1;--card:#fff;--tx:#10231d;--mu:#667a72;--ln:#e3e9e4;--sh:0 1px 2px rgba(16,35,29,.05),0 8px 24px -8px rgba(16,35,29,.12);--r:22px}

body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -80px,color-mix(in srgb,var(--a1) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

<script>
const S=[{"n": "আস সীরাত আন নববিয়্যাহ", "c": "#15803D", "k": "সি", "d": {}}, {"n": "দাওয়াহ ১ম পত্র", "c": "#7C3AED", "k": "দা১", "d": {}, "dv": ["বড় প্রশ্ন", "ছোট প্রশ্ন"], "ex": "2026-11-02"}, {"n": "দাওয়াহ ২য় পত্র", "c": "#9333EA", "k": "দা২", "d": {}, "dv": ["বড় প্রশ্ন", "ছোট প্রশ্ন"], "ex": "2026-11-10"}, {"n": "দাওয়াহ ৩য় পত্র", "c": "#A855F7", "k": "দা৩", "d": {"প্রশ্নসমূহ": [{"n": "দাওয়াহ ৩য় পত্র", "c": "#A855F7", "q": [["মানহাজের আভিধানিক ও পারিভাষিক পরিচয় দাও। অতঃপর ইসলামী দাওয়াতের ক্ষেত্রে মানহাজের মূলনীতি, প্রকারভেদ ও উদ্দেশ্যাবলি বিস্তারিত আলোচনা কর।", "<div class=\"h\">উপস্থাপনা</div><p>আল্লাহপ্রদত্ত ও রাসুল (সা.) প্রদর্শিত একমাত্র পূর্ণাঙ্গ জীবনবিধান হলো ইসলাম। ইসলামের প্রচার, প্রসার ও প্রতিষ্ঠার অন্যতম প্রধান মাধ্যম হচ্ছে দাওয়াত। এর মূল উদ্দেশ্য হলো মানুষকে আল্লাহর সার্বভৌমত্ব ও ইসলামের চিরন্তন বিধানের প্রতি আহ্বান জানানো। যুগে যুগে নবী-রাসুলগণ এ মহান দায়িত্ব পালন করেছেন। সর্বশেষ নবী হযরত মুহাম্মদ (সা.)-এর আগমনের মাধ্যমে নবুওয়াতের ধারার পরিসমাপ্তি ঘটলেও দাওয়াতের কার্যক্রম বন্ধ হয়নি। বরং এ দায়িত্ব অর্পিত হয়েছে উম্মতে মুহাম্মদীর ওপর। তাই ইসলামে দাওয়াতের গুরুত্ব ও অপরিহার্যতা অপরিসীম।</p><div class=\"h\">মানহাজের পরিচয় ও আভিধানিক অর্থ</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَنْهَجُ</span> শব্দের আভিধানিক অর্থ—</p><p style=\"padding-left:4px\"><b>১।</b> পথ</p><p style=\"padding-left:4px\"><b>২।</b> পন্থা</p><p style=\"padding-left:4px\"><b>৩।</b> পদ্ধতি</p><p style=\"padding-left:4px\"><b>৪।</b> প্রণালি</p><p style=\"padding-left:4px\"><b>৫।</b> রাস্তা</p><p style=\"padding-left:4px\"><b>৬।</b> কারিকুলাম</p><div class=\"h\">মানহাজের পারিভাষিক সংজ্ঞা</div><p><b>১। আল-কামুসুল মুহিত অভিধানে রয়েছে—</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اَلْمَنْهَجُ أَسْتَعِيرُ لِلطَّرِيقَةِ الْإِلَهِيَّةِ مِنَ الدِّينِ مِنْ حَيْثُ أَنَّ مِنْ شَرْعِ فِيهَا عَلَى الْحَقِيقَةِ</div></div><p>অর্থাৎ, সঠিক পদ্ধতিতে দ্বীন প্রচারের মাধ্যমে আল্লাহর পথে মানুষকে উদ্বুদ্ধ করাকে মানহাজ বলে।</p><p><b>২। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">تاج العَرُوسُ</span> গ্রন্থকারের মতে—</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الطَّرِيقُ الْوَاضِحُ أَسْتَعِيرُ ذَلِكَ لِلطَّرِيقَةِ الْإِلَهِيَّةِ مِنَ الدِّينِ</div></div><p>অর্থাৎ, মানহাজ হলো এমন প্রশস্ত পথ, যদ্বারা আল্লাহকে চেনার পদ্ধতি প্রমাণিত হয়।</p><p><b>৩। আল্লামা রাগেব ইস্ফাহানীর মতে—</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الطَّرِيقُ الْمُسْتَقِيمُ الْإِلَهِيَّةُ لَا عَيْبَ فِيهِ</div></div><p>অর্থাৎ, নিখুঁত পন্থায় আল্লাহ তায়ালার পর্যন্ত পৌঁছার সরল পথই মানহাজ।</p><div class=\"h\">মানহাজের প্রকারভেদ বা শ্রেণিবিভাগ</div><p>দাওয়াতের প্রধান ও মৌলিক উৎস হলো আল-কুরআনুল কারীম। ইসলামী দাওয়াতের পদ্ধতি ও কৌশল সম্পর্কে আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اُدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِيْ هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِيْنَ</div><div class=\"rf\">সূরা আন-নাহল, আয়াত: ১২৫</div></div><p>অর্থ: আপনি আপনার প্রতিপালকের পথে মানুষকে আহ্বান করুন হিকমাহ বা প্রজ্ঞা, উত্তম উপদেশ এবং সর্বোত্তম পন্থায় যুক্তিতর্কের মাধ্যমে। নিশ্চয়ই আপনার প্রতিপালক ভালোভাবেই জানেন কে তাঁর পথ থেকে বিচ্যুত হয়েছে এবং কে সঠিক পথে পরিচালিত হয়েছে।</p><p>উপরিউক্ত আয়াতে আল্লাহ তায়ালা ইসলামী দাওয়াতের তিনটি মৌলিক পদ্ধতি বর্ণনা করেছেন। যথা—</p><p style=\"padding-left:4px\"><b>১।</b> হিকমাহ অবলম্বন।</p><p style=\"padding-left:4px\"><b>২।</b> মাওয়িযাহ হাসানাহ তথা উত্তম উপদেশ।</p><p style=\"padding-left:4px\"><b>৩।</b> মুজাদালাহ বিল আহসান তথা সর্বোত্তম পন্থায় যুক্তিতর্ক।</p><p>নিম্নে এগুলোর আলোচনা তুলে ধরা হলো—</p><div class=\"h\">১। হিকমাহ অবলম্বন (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الحكمة</span>)</div><p>ইসলামী দাওয়াতের প্রথম পদ্ধতি হলো হিকমাহ অবলম্বন। হিকমাহ অর্থ প্রজ্ঞা, বিচক্ষণতা ও দূরদর্শিতা। এর পারিভাষিক সংজ্ঞা হলো—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هِيَ الْإِصَابَةُ فِي الْقَوْلِ وَالْفِعْلِ وَوَضْعُ كُلِّ شَيْءٍ مَوْضِعَهُ</div></div><p>অর্থ: কথা ও কাজে যথার্থতা অবলম্বন করা এবং প্রতিটি বিষয়কে তার উপযুক্ত স্থানে স্থাপন করাকে হিকমাহ বলে।</p><p>ইসলামী দাওয়াতের ক্ষেত্র ব্যাপক হওয়ায় এর প্রতিটি পর্যায়ে হিকমাহর প্রয়োগ অত্যন্ত গুরুত্বপূর্ণ। দাওয়াতের প্রস্তুতি, পরিকল্পনা, স্থান-কাল-পাত্র বিবেচনা, বিষয় নির্বাচন, উপস্থাপন এবং দায়ীর ব্যক্তিগত আচার-আচরণসহ বিভিন্ন ক্ষেত্রে হিকমাহ অবলম্বন করতে হয়।</p><p><b>দাওয়াতের ক্ষেত্রে হিকমাহর প্রয়োগক্ষেত্রসমূহ:</b></p><p style=\"padding-left:4px\"><b>১।</b> সুষ্ঠু পরিকল্পনা প্রণয়ন।</p><p style=\"padding-left:4px\"><b>২।</b> তাড়াহুড়া পরিত্যাগ করা।</p><p style=\"padding-left:4px\"><b>৩।</b> সমসাময়িক যুগসমস্যা ও ঘটনাবলি তুলে ধরা।</p><p style=\"padding-left:4px\"><b>৪।</b> স্থান ও পরিবেশ বিবেচনা করা।</p><p style=\"padding-left:4px\"><b>৫।</b> ব্যক্তির অবস্থা, যোগ্যতা ও মানসিকতা বিবেচনা করা।</p><p style=\"padding-left:4px\"><b>৬।</b> সত্য ও অকাট্য যুক্তির আশ্রয় নেওয়া।</p><p style=\"padding-left:4px\"><b>৭।</b> পর্যায়ক্রমে দাওয়াত উপস্থাপন করা।</p><p style=\"padding-left:4px\"><b>৮।</b> প্রয়োজনে দাওয়াত বারবার উপস্থাপন করা।</p><p style=\"padding-left:4px\"><b>৯।</b> সহজ ও সাবলীল পন্থায় দাওয়াত প্রদান করা।</p><p style=\"padding-left:4px\"><b>১০।</b> ব্যক্তিগত ও সমষ্টিগত যোগাযোগের সমন্বয় করা।</p><p style=\"padding-left:4px\"><b>১১।</b> মানুষের দোষত্রুটি সংশোধনে যথাসম্ভব নমনীয়তা অবলম্বন করা।</p><p style=\"padding-left:4px\"><b>১২।</b> কোমলতা ও কঠোরতার যথাযথ সমন্বয় করা।</p><div class=\"h\">২। মাওয়িযাহ হাসানাহ তথা উত্তম উপদেশ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الموعظة الحسنة</span>)</div><p>ইসলামী দাওয়াতের দ্বিতীয় পদ্ধতি হলো মাওয়িযাহ হাসানাহ তথা উত্তম উপদেশ প্রদান।</p><p>আভিধানিক অর্থ: <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَوْعِظَة</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">وَعْظٌ</span> থেকে উদ্ভূত। এর অর্থ উপদেশ, নসীহত ও শুভাকাঙ্ক্ষামূলক কথা। আর <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَسَنَة</span> অর্থ সুন্দর, উত্তম ও কল্যাণকর।</p><p>মাওয়িযাহ হাসানাহ বলতে এমন উপদেশকে বোঝায়, যা সুন্দর, কোমল ও হৃদয়গ্রাহী ভাষায় প্রদান করা হয় এবং যার মাধ্যমে শ্রোতার মন সত্য গ্রহণের জন্য প্রস্তুত হয়। যেমন—কোনো ভালো কাজের সওয়াব ও উপকারিতা এবং মন্দ কাজের শাস্তি ও অপকারিতা তুলে ধরা।</p><p>মাওয়িযাহ হাসানাহর উদ্দেশ্য হলো শ্রোতার অন্তরে ইতিবাচক প্রভাব সৃষ্টি করা, তার সন্দেহ দূর করা এবং সত্য গ্রহণে তাকে উৎসাহিত করা। উপদেশের মধ্যে যেন অপমান, বিদ্রূপ, অহংকার কিংবা ব্যক্তিগত স্বার্থের প্রকাশ না ঘটে, সে বিষয়েও সতর্ক থাকতে হয়।</p><p><b>মাওয়িযাহ হাসানাহর সংজ্ঞা—</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مِنَ الْمَقَالَةِ الْمُشْتَمِلَةِ عَلَى الْمَوْعِظَةِ الْحَسَنَةِ الَّتِي يَسْتَحْسِنُهَا السَّامِعُ وَتَكُونُ فِي نَفْسِهَا حَسَنَةً بِاعْتِبَارِ انْتِفَاعِ السَّامِعِ بِهَا</div></div><p>অর্থ: মাওয়িযাহ হাসানাহ হলো এমন বক্তব্য, যা শ্রোতার কাছে সুন্দর ও গ্রহণযোগ্য মনে হয় এবং শ্রোতার উপকার সাধনের কারণে নিজেও উত্তম ও কল্যাণকর হয়ে ওঠে।</p><p><b>সদুপদেশ প্রদানের ক্ষেত্রে অনুসরণীয় পদ্ধতিসমূহ:</b></p><p style=\"padding-left:4px\"><b>১।</b> হিকমাহ বা প্রজ্ঞা অবলম্বন করা।</p><p style=\"padding-left:4px\"><b>২।</b> দায়ীর আন্তরিকতা ও নিঃস্বার্থ মনোভাব প্রকাশ করা।</p><p style=\"padding-left:4px\"><b>৩।</b> ভ্রাতৃত্ব, সৌহার্দ্য ও ভালোবাসার পরিবেশ সৃষ্টি করা।</p><p style=\"padding-left:4px\"><b>৪।</b> বন্ধুত্বপূর্ণ ও কোমল ভাষা ব্যবহার করা।</p><p style=\"padding-left:4px\"><b>৫।</b> সাবলীল ও সহজবোধ্য ভাষায় কথা বলা।</p><p style=\"padding-left:4px\"><b>৬।</b> শান্ত, শিষ্ট ও ধীরস্থিরভাবে উপদেশ প্রদান করা।</p><p style=\"padding-left:4px\"><b>৭।</b> উপদেশ প্রদানে পরিমিতিবোধ অবলম্বন করা।</p><p style=\"padding-left:4px\"><b>৮।</b> উপদেশকে তাকওয়া ও আল্লাহভীতির সঙ্গে সম্পর্কিত করা।</p><p style=\"padding-left:4px\"><b>৯।</b> কথা ও কাজের মধ্যে সামঞ্জস্য রাখা।</p><p style=\"padding-left:4px\"><b>১০।</b> উৎসাহ প্রদান ও সতর্কীকরণের মধ্যে ভারসাম্য বজায় রাখা।</p><p style=\"padding-left:4px\"><b>১১।</b> ইহকালীন ও পরকালীন কল্যাণ একসঙ্গে তুলে ধরা।</p><p style=\"padding-left:4px\"><b>১২।</b> আল-কুরআন ও সুন্নাহর বাণী ব্যবহার করা।</p><div class=\"h\">৩। মুজাদালাহ বিল আহসান তথা উত্তম পন্থায় যুক্তিতর্ক (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">المجادلة بالتي هي أحسن</span>)</div><p>ইসলামী দাওয়াতের তৃতীয় পদ্ধতি হলো মুজাদালাহ বিল আহসান। এর অর্থ হলো উত্তম পন্থায় যুক্তিতর্ক, আলোচনা ও বিতর্কের মাধ্যমে সত্যকে প্রতিষ্ঠা করা।</p><p>আভিধানিক অর্থ: মুজাদালাহ শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">جدال</span> থেকে উদ্ভূত। এর অর্থ বিতর্ক, তর্ক-বিতর্ক বা যুক্তি বিনিময়।</p><p>পারিভাষিক সংজ্ঞা: ড. সাইয়েদ রিয়ক তাবীল এ প্রসঙ্গে বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هُوَ الْحِوَارُ وَتَبَادُلُ الْأَدِلَّةِ وَالْبَرَاهِينِ بَيْنَ الْأَطْرَافِ دَعْمًا لِمَا يَرَاهُ كُلٌّ مِنْهُمَا مِنْ فِكْرٍ وَمَا يَعْتَقِدُهُ مِنْ رَأْيٍ</div></div><p>অর্থ: বিভিন্ন পক্ষের নিজস্ব চিন্তাধারা ও বিশ্বাস প্রতিষ্ঠার উদ্দেশ্যে পরস্পরের মধ্যে দলিল-প্রমাণ বিনিময় ও সংলাপ করাকে মুজাদালাহ বলে।</p><p>তবে ইসলামী দাওয়াতের ক্ষেত্রে মুজাদালাহ বিল আহসান বলতে শালীনতা, ভদ্রতা ও উত্তম যুক্তির মাধ্যমে প্রতিপক্ষের সঙ্গে আলোচনা করে সত্যকে প্রতিষ্ঠা করাকে বোঝায়। এখানে ব্যক্তিগত আক্রমণ, অহংকার কিংবা প্রতিপক্ষকে অপমান করার কোনো সুযোগ নেই।</p><p><b>দাওয়াতের ক্ষেত্রে মুজাদালাহর প্রয়োগক্ষেত্রসমূহ:</b></p><p style=\"padding-left:4px\"><b>১।</b> সত্যকে বিজয়ী ও প্রতিষ্ঠিত করার উদ্দেশ্যে বিতর্ক করা।</p><p style=\"padding-left:4px\"><b>২।</b> আলোচ্য বিষয় সম্পর্কে গভীর জ্ঞান ও পর্যাপ্ত দলিল-প্রমাণ নিয়ে বিতর্কে অংশগ্রহণ করা।</p><p style=\"padding-left:4px\"><b>৩।</b> প্রতিপক্ষের অবস্থা, মানসিকতা ও জ্ঞানগত যোগ্যতা বিবেচনা করে যুক্তি উপস্থাপন করা।</p><p style=\"padding-left:4px\"><b>৪।</b> বিতর্কের পরিবেশকে অন্ধ পক্ষপাত ও পূর্বনির্ধারিত সিদ্ধান্ত থেকে মুক্ত রাখা।</p><p style=\"padding-left:4px\"><b>৫।</b> বিতর্কে প্রচলিত ও গ্রহণযোগ্য যুক্তি-প্রমাণ এবং যথাযথ উপস্থাপন-পদ্ধতি অবলম্বন করা।</p><div class=\"h\">মানহাজের উদ্দেশ্যসমূহ</div><p>ইসলামী দাওয়াহর ক্ষেত্রে মানহাজ বা সঠিক পদ্ধতি অনুসরণের কয়েকটি গুরুত্বপূর্ণ উদ্দেশ্য রয়েছে। নিম্নে তা উল্লেখ করা হলো—</p><p style=\"padding-left:4px\"><b>১। আল্লাহর সন্তুষ্টি অর্জন:</b> সঠিক মানহাজ অনুসরণের প্রধান উদ্দেশ্য হলো একমাত্র আল্লাহ তায়ালার সন্তুষ্টি অর্জন করা এবং তাঁর নির্দেশিত পথে মানুষকে আহ্বান করা।</p><p style=\"padding-left:4px\"><b>২। মানুষকে সঠিক পথে পরিচালিত করা:</b> মানুষকে শিরক, কুফর, কুসংস্কার ও পাপাচার থেকে ফিরিয়ে এনে তাওহিদ ও ইসলামের সঠিক পথে পরিচালিত করা।</p><p style=\"padding-left:4px\"><b>৩। ইসলামের বাণী যথাযথভাবে পৌঁছে দেওয়া:</b> কুরআন ও সুন্নাহর আলোকে ইসলামের শিক্ষা মানুষের কাছে সঠিক, সুন্দর ও সহজবোধ্যভাবে উপস্থাপন করা।</p><p style=\"padding-left:4px\"><b>৪। মানুষের মধ্যে ইসলামী জ্ঞান বিস্তার করা:</b> মানুষের অজ্ঞতা দূর করে তাদের মধ্যে কুরআন, সুন্নাহ ও ইসলামী বিধিবিধান সম্পর্কে সঠিক জ্ঞান ছড়িয়ে দেওয়া।</p><p style=\"padding-left:4px\"><b>৫। নৈতিক ও চারিত্রিক উন্নয়ন সাধন:</b> মানুষের মধ্যে সততা, ন্যায়পরায়ণতা, ধৈর্য, বিনয়, আমানতদারি ও উত্তম চরিত্রের বিকাশ ঘটানো।</p><p style=\"padding-left:4px\"><b>৬। সমাজে শান্তি ও সম্প্রীতি প্রতিষ্ঠা:</b> পারস্পরিক হিংসা-বিদ্বেষ, বিভেদ ও সংঘাত দূর করে সমাজে ভ্রাতৃত্ব, ঐক্য, ন্যায়বিচার ও শান্তি প্রতিষ্ঠা করা।</p><p style=\"padding-left:4px\"><b>৭। দাওয়াহকে কার্যকর ও ফলপ্রসূ করা:</b> মানুষের বয়স, জ্ঞান, মানসিকতা ও সামাজিক অবস্থান বিবেচনা করে উপযুক্ত পদ্ধতিতে দাওয়াত প্রদান করা, যাতে দাওয়াহ মানুষের হৃদয়ে প্রভাব বিস্তার করতে পারে।</p><p style=\"padding-left:4px\"><b>৮। ভ্রান্ত চিন্তাধারা ও অপসংস্কৃতি দূর করা:</b> সমাজে প্রচলিত কুসংস্কার, ভ্রান্ত আকিদা, অনৈতিকতা ও ইসলামবিরোধী চিন্তাধারার বিরুদ্ধে জ্ঞানভিত্তিক সচেতনতা সৃষ্টি করা।</p><p style=\"padding-left:4px\"><b>৯। ইসলামী আদর্শের বাস্তবায়ন:</b> ব্যক্তি, পরিবার ও সমাজজীবনে ইসলামের আদর্শ ও বিধিবিধান প্রতিষ্ঠার পরিবেশ তৈরি করা।</p><p style=\"padding-left:4px\"><b>১০। ইহকালীন কল্যাণ ও পরকালীন মুক্তি নিশ্চিত করা:</b> মানুষকে আল্লাহর আনুগত্য ও রাসূলুল্লাহ (সা.)-এর আদর্শ অনুসরণের মাধ্যমে দুনিয়ার শান্তি এবং আখিরাতের সফলতার পথে পরিচালিত করা।</p><p><b>সারকথা:</b> মানহাজের মূল উদ্দেশ্য হলো কুরআন ও সুন্নাহর নির্দেশনা অনুযায়ী প্রজ্ঞাপূর্ণ ও সুন্দর পদ্ধতিতে মানুষকে ইসলামের পথে আহ্বান করা এবং ব্যক্তি ও সমাজজীবনে ইসলামী আদর্শ প্রতিষ্ঠায় ভূমিকা রাখা।</p><div class=\"h\">উপসংহার</div><p>ইসলামে দাওয়াতের গুরুত্ব ও মর্যাদা অপরিসীম। এর উদ্দেশ্য ও লক্ষ্য অতি মহৎ। এর ক্ষেত্র ও পরিধি অতি ব্যাপক। নবীগণের উত্তরসূরি হিসেবে এ মহান দায়িত্ব ওলামায়ে দীনের ওপর বর্তালেও সকল মুসলিমকেই এ দায়িত্ব পালনে তৎপর হতে হবে। বিশেষ করে ইসলামী ব্যক্তিত্ব, মুসলিম নেতৃবৃন্দ ও রাষ্ট্রীয় কর্ণধারগণ কর্তৃক এ ব্যাপারে অগ্রণী ভূমিকা পালন করা আবশ্যক।</p>"], ["দাওয়াহর অর্থ কী? মদিনার জীবনে রাসূলুল্লাহ (সা.) মানুষকে আল্লাহর দিকে আহ্বানের ক্ষেত্রে কেমন পদ্ধতি অনুসরণ করেছিলেন? বিশদভাবে লেখ।", "<div class=\"h\">ভূমিকা:</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনবিধান। এ জীবনবিধানের প্রচার, প্রসার ও প্রতিষ্ঠার অন্যতম মাধ্যম হলো দাওয়াহ। রাসূলুল্লাহ (সা.) মক্কায় দীর্ঘ তেরো বছর প্রতিকূল পরিবেশে ইসলামের দাওয়াত প্রদান করেন। অতঃপর মদিনায় হিজরত করে অনুকূল পরিবেশে ইসলামের প্রচার-প্রসার, আদর্শ সমাজ গঠন এবং ইসলামী রাষ্ট্র প্রতিষ্ঠায় বিভিন্ন যুগোপযোগী কর্মসূচি গ্রহণ করেন। তাঁর মাদানী জীবনের দাওয়াতি কার্যক্রম মানবজাতির জন্য এক অনন্য আদর্শ।</p><div class=\"h\">দাওয়াহর অর্থ ও সংজ্ঞা</div><p><b>১। আভিধানিক অর্থ:</b></p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">دَعْوَةٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">دَعَا</span> – <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">يَدْعُو</span> – <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">دَعْوَةً</span> ধাতু থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p>১। আহ্বান করা। ২। ডাকা। ৩। নিমন্ত্রণ করা। ৪। প্রচার করা। ৫। উৎসাহিত করা। ৬। আমন্ত্রণ জানানো।</p><p><b>২। পারিভাষিক সংজ্ঞা:</b></p><p>ইসলামী চিন্তাবিদ ও আলেমগণ বিভিন্নভাবে দাওয়াহর সংজ্ঞা প্রদান করেছেন। নিম্নে দুজন বিশিষ্ট আলেমের সংজ্ঞা তুলে ধরা হলো—</p><p>ক. শায়খুল ইসলাম ইবনে তাইমিয়া (রহ.) বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الدَّعْوَةُ إِلَى اللَّهِ هِيَ الدَّعْوَةُ إِلَى الْإِيمَانِ بِهِ وَبِمَا جَاءَتْ بِهِ رُسُلُهُ</div></div><p>অর্থ: আল্লাহর প্রতি দাওয়াত হলো তাঁর প্রতি এবং তাঁর রাসূলগণ যা নিয়ে এসেছেন, তার প্রতি ঈমান আনার আহ্বান জানানো।</p><p>খ. ড. সাইয়েদ মুহাম্মদ আল-ওয়াকিল বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الدَّعْوَةُ إِلَى اللَّهِ هِيَ جَمْعُ النَّاسِ إِلَى الْخَيْرِ، وَدَلَالَتُهُمْ عَلَى الرُّشْدِ</div></div><p>অর্থ: মানুষকে কল্যাণের পথে একত্রিত করা এবং তাদের সঠিক পথের দিশা দেওয়াকে আল্লাহর পথে দাওয়াত বলে।</p><p>সারকথা: মানুষকে আল্লাহর একত্ববাদে বিশ্বাস স্থাপন, তাঁর আনুগত্য স্বীকার এবং কুরআন ও সুন্নাহর নির্দেশিত পথে জীবন পরিচালনার আহ্বান জানানোই ইসলামী দাওয়াহ।</p><div class=\"h\">মাদানী জীবনে রাসূলুল্লাহ (সা.)-এর দাওয়াত পদ্ধতি ও কর্মসূচি</div><p><b>১। প্রথম মসজিদ নির্মাণ:</b> মদিনায় হিজরতের পথে কুবা নামক স্থানে রাসূলুল্লাহ (সা.) অবস্থান করেন এবং সেখানে একটি মসজিদ নির্মাণ করেন। এটি মসজিদে কুবা নামে পরিচিত। এটি ইসলামের প্রথম মসজিদ হিসেবে প্রসিদ্ধ।</p><p><b>২। প্রথম জুমার নামাজ আদায়:</b> কুবা থেকে মদিনায় যাওয়ার পথে বনু সালিম ইবনে আওফ গোত্রের এলাকায় রাসূলুল্লাহ (সা.) সাহাবিদের নিয়ে প্রথম জুমার নামাজ আদায় করেন এবং গুরুত্বপূর্ণ উপদেশ প্রদান করেন।</p><p><b>৩। মসজিদে নববী নির্মাণ:</b> মদিনায় পৌঁছে রাসূলুল্লাহ (সা.) একটি মসজিদ নির্মাণ করেন, যা মসজিদে নববী নামে পরিচিত। এটি ইবাদত, শিক্ষা, বিচার, পরামর্শ, সামাজিক ও রাষ্ট্রীয় কার্যক্রম পরিচালনার প্রধান কেন্দ্র ছিল।</p><p><b>৪। সুফফা বিদ্যাপীঠ প্রতিষ্ঠা:</b> মসজিদে নববীর এক পাশে সুফফা নামক শিক্ষাকেন্দ্র প্রতিষ্ঠা করা হয়। এখানে দরিদ্র ও জ্ঞানপিপাসু সাহাবিগণ অবস্থান করে রাসূলুল্লাহ (সা.)-এর কাছ থেকে ইসলামী শিক্ষা গ্রহণ করতেন। তাঁদের আসহাবুস সুফফা বলা হয়।</p><p><b>৫। নামাজ ও আজানের প্রচলন:</b> মদিনায় এসে রাসূলুল্লাহ (সা.) জামাতের সঙ্গে প্রকাশ্যে নামাজ আদায়ের ব্যবস্থা করেন। মুসলমানদের নামাজের জন্য আহ্বান জানাতে আজানের প্রচলন করেন। হজরত বিলাল (রা.) প্রথম মুয়াজ্জিন হিসেবে দায়িত্ব পালন করেন।</p><p><b>৬। মুসলিম ভ্রাতৃত্ব প্রতিষ্ঠা:</b> রাসূলুল্লাহ (সা.) আনসার ও মুহাজিরদের মধ্যে ভ্রাতৃত্ব স্থাপন করেন। পাশাপাশি আউস ও খাযরাজ গোত্রের দীর্ঘদিনের বিরোধ দূর করে তাদের মধ্যে ঐক্য, ভালোবাসা ও সম্প্রীতি প্রতিষ্ঠা করেন।</p><p><b>৭। আন্তর্জাতিক চুক্তি সম্পাদন:</b> মদিনায় শান্তি ও নিরাপত্তা প্রতিষ্ঠা এবং বিভিন্ন সম্প্রদায়ের মধ্যে সম্প্রীতি বজায় রাখার জন্য রাসূলুল্লাহ (সা.) বিভিন্ন চুক্তি সম্পাদন করেন। এর মধ্যে উল্লেখযোগ্য হলো—</p><p>ক. মদিনা সনদ: ৬২২ খ্রিষ্টাব্দে মদিনার মুসলিম, ইহুদি ও অন্যান্য সম্প্রদায়ের মধ্যে শান্তি, নিরাপত্তা ও পারস্পরিক অধিকার প্রতিষ্ঠার লক্ষ্যে এ সনদ প্রণীত হয়।</p><p>খ. হুদায়বিয়ার সন্ধি: ৬২৮ খ্রিষ্টাব্দে কুরাইশদের সঙ্গে এ সন্ধি সম্পাদিত হয়। এর ফলে শান্তিপূর্ণ পরিবেশ সৃষ্টি হয় এবং ইসলামের দাওয়াত ব্যাপকভাবে ছড়িয়ে পড়ার সুযোগ লাভ করে।</p><p>গ. অন্যান্য চুক্তি: নাজরানের খ্রিষ্টান, আবিসিনিয়ার খ্রিষ্টান, তায়েফের সাকিফ গোত্র ও বাহরাইনের বিভিন্ন সম্প্রদায়ের সঙ্গে রাসূলুল্লাহ (সা.) চুক্তি ও সমঝোতা সম্পাদন করেন।</p><p><b>৮। পত্র ও দূত প্রেরণ:</b> ইসলামের দাওয়াত আন্তর্জাতিক পর্যায়ে ছড়িয়ে দেওয়ার জন্য রাসূলুল্লাহ (সা.) বিভিন্ন দেশের শাসকদের কাছে পত্র ও দূত প্রেরণ করেন। তাঁদের মধ্যে রোম সম্রাট হিরাক্লিয়াস, পারস্য সম্রাট খসরু পারভেজ, মিসরের শাসক মুকাওকিস এবং আবিসিনিয়ার বাদশাহ নাজাশী উল্লেখযোগ্য।</p><p><b>৯। বিভিন্ন ফরমান ও প্রশাসনিক নির্দেশ প্রদান:</b> রাসূলুল্লাহ (সা.) বিভিন্ন সাহাবি ও গোত্রের নামে জমি বরাদ্দ এবং প্রশাসনিক নির্দেশসংবলিত ফরমান প্রদান করেন। এর মাধ্যমে কৃষি, অর্থনীতি ও সামাজিক ব্যবস্থাপনার উন্নয়ন সাধিত হয়।</p><p><b>১০। যুদ্ধ ও নিরাপত্তামূলক অভিযান:</b> ইসলামের দাওয়াত ও মুসলিম সমাজের নিরাপত্তা রক্ষায় রাসূলুল্লাহ (সা.) বিভিন্ন যুদ্ধ ও অভিযানে অংশগ্রহণ করেন। উল্লেখযোগ্য হলো বদর, উহুদ, খন্দক, খায়বার, মুতাহ, হুনাইন ও তাবুক অভিযান। এসব ঘটনায় মুসলিম সমাজের নিরাপত্তা ও রাষ্ট্রের স্থিতিশীলতা গুরুত্বপূর্ণ ছিল।</p><p><b>১১। সামাজিক বিধিবিধান প্রবর্তন:</b> মাদানী জীবনে রাসূলুল্লাহ (সা.) বিবাহ-তালাক, মিরাস, পারিবারিক অধিকার, লেনদেন, হালাল-হারাম, শিক্ষা ও সংস্কৃতিসহ বিভিন্ন সামাজিক বিধান প্রতিষ্ঠা করেন।</p><p><b>১২। যাকাতভিত্তিক অর্থব্যবস্থা প্রতিষ্ঠা:</b> রাসূলুল্লাহ (সা.) সুদ নিষিদ্ধ করে যাকাতভিত্তিক অর্থনৈতিক ব্যবস্থা প্রতিষ্ঠা করেন। এর মাধ্যমে দরিদ্র, অসহায় ও বঞ্চিত মানুষের অধিকার নিশ্চিত করার ব্যবস্থা করেন।</p><p><b>১৩। সমাজ সংস্কার:</b> রাসূলুল্লাহ (সা.) মদ্যপান, জুয়া, সুদ, নারী নির্যাতন, কুসংস্কার ও অন্যান্য অনৈতিক কার্যকলাপের বিরুদ্ধে ব্যবস্থা গ্রহণ করেন। ফলে মদিনায় ন্যায়বিচার, মানবিকতা ও শান্তিপূর্ণ সমাজব্যবস্থা প্রতিষ্ঠিত হয়।</p><div class=\"h\">ইসলামী দাওয়াহর মৌলিক পদ্ধতি</div><p>দাওয়াহর প্রধান উৎস আল-কুরআন। আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اُدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِيْ هِيَ أَحْسَنُ</div></div><p>অর্থ: আপনি আপনার প্রতিপালকের পথে মানুষকে আহ্বান করুন হিকমাহ, উত্তম উপদেশ এবং সর্বোত্তম পন্থায় যুক্তিতর্কের মাধ্যমে।</p><div class=\"rf\">সূরা আন-নাহল, আয়াত: ১২৫</div><p>এ আয়াতের আলোকে দাওয়াহর তিনটি মৌলিক পদ্ধতি হলো—</p><p><b>১। হিকমাহ অবলম্বন:</b> হিকমাহ অর্থ প্রজ্ঞা, বিচক্ষণতা ও দূরদর্শিতা। মানুষের বয়স, জ্ঞান, মানসিকতা, স্থান-কাল ও পরিবেশ বিবেচনা করে উপযুক্ত পদ্ধতিতে দাওয়াত প্রদান করাকে হিকমাহ বলে। এর অন্তর্ভুক্ত হলো সুষ্ঠু পরিকল্পনা, ধৈর্য, সহজ উপস্থাপন, সত্যনিষ্ঠ যুক্তি এবং কোমল আচরণ।</p><p><b>২। মাওয়িযাহ হাসানাহ:</b> এর অর্থ উত্তম ও হৃদয়গ্রাহী উপদেশ। ভালোবাসা, আন্তরিকতা ও কোমল ভাষায় মানুষকে নেক কাজের সওয়াব এবং অন্যায়ের পরিণতি সম্পর্কে অবহিত করাকে মাওয়িযাহ হাসানাহ বলে। এ ক্ষেত্রে সাবলীল ভাষা, উৎসাহ ও সতর্কীকরণের সমন্বয় এবং কথা ও কাজের মিল থাকা জরুরি।</p><p><b>৩। মুজাদালাহ বিল আহসান:</b> এর অর্থ উত্তম পন্থায় যুক্তিতর্ক করা। দলিল-প্রমাণ, সুন্দর যুক্তি ও শালীন আলোচনার মাধ্যমে প্রতিপক্ষের ভুল ধারণা দূর করে সত্য প্রতিষ্ঠা করাকে মুজাদালাহ বিল আহসান বলে। এ ক্ষেত্রে গভীর জ্ঞান, পর্যাপ্ত প্রমাণ, প্রতিপক্ষের অবস্থান বিবেচনা এবং অহংকার ও বিদ্রূপ পরিহার করা জরুরি।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, মদিনার জীবনে রাসূলুল্লাহ (সা.)-এর দাওয়াতি কার্যক্রম ছিল সুপরিকল্পিত, বাস্তবসম্মত ও বহুমুখী। মসজিদ নির্মাণ, শিক্ষাব্যবস্থা প্রতিষ্ঠা, ভ্রাতৃত্ব সৃষ্টি, আন্তর্জাতিক চুক্তি, সামাজিক সংস্কার ও অর্থনৈতিক সুবিচার প্রতিষ্ঠার মাধ্যমে তিনি একটি আদর্শ ইসলামী সমাজ ও রাষ্ট্র গড়ে তোলেন। তাই তাঁর মাদানী জীবনের দাওয়াতি পদ্ধতি ও কর্মসূচি সর্বকালের দায়ীদের জন্য অনুসরণীয় আদর্শ।</p>"], ["নবী ও রাসূলগণের দাওয়াত প্রদানের অভিন্ন পদ্ধতিসমূহ বর্ণনা কর।", "<div class=\"h\">ভূমিকা :</div><p>আল্লাহপ্রদত্ত ও রাসূল (স)-প্রদর্শিত একমাত্র জীবনবিধান হলো ইসলাম। ইসলামের প্রচার ও প্রসারের অন্যতম মাধ্যম হলো দাওয়াত। মানবজাতির হেদায়েতের জন্য যুগে যুগে আল্লাহ তাআলা অসংখ্য নবী ও রাসূল প্রেরণ করেছেন। তাঁরা বিভিন্ন যুগে, বিভিন্ন জাতি ও পরিবেশে বিভিন্ন পদ্ধতি অবলম্বন করে মানুষকে আল্লাহর পথে আহ্বান করেছেন। তাঁদের দাওয়াতের মূল উদ্দেশ্য ছিল মানুষকে শিরক, কুফর ও পাপাচার থেকে মুক্ত করে এক আল্লাহর ইবাদতের দিকে ফিরিয়ে আনা।</p><div class=\"h\">নবী ও রাসূলগণের দাওয়াত প্রদানের পদ্ধতি</div><p><b>১। হযরত নূহ (আ)-এর দাওয়াত</b></p><p>হযরত নূহ (আ) তাঁর জাতিকে দীর্ঘ ৯৫০ বছর ধরে আল্লাহর একত্ববাদের দাওয়াত দিয়েছেন। তিনি দিন-রাত, প্রকাশ্যে ও গোপনে বিভিন্ন পদ্ধতিতে মানুষকে আল্লাহর পথে আহ্বান করেন। কিন্তু তাঁর জাতির অধিকাংশ মানুষ দাওয়াত গ্রহণ করেনি।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا وَإِنِّي كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوا أَصَابِعَهُمْ فِي آذَانِهِمْ وَاسْتَغْشَوْا ثِيَابَهُمْ وَأَصَرُّوا وَاسْتَكْبَرُوا اسْتِكْبَارًا.</div></div><p>(সূরা নূহ, আয়াত: ৫-৭)</p><p>অর্থাৎ, নিশ্চয় আমি আমার সম্প্রদায়কে রাত-দিন আহ্বান করেছি। কিন্তু আমার আহ্বান তাদের পলায়নপরতাই বৃদ্ধি করেছে। আর যখনই আমি তাদের আহ্বান করেছি, যাতে আপনি তাদের ক্ষমা করেন, তখন তারা নিজেদের কানে আঙুল দিয়েছে, কাপড় দিয়ে নিজেদের ঢেকে নিয়েছে, জেদ ধরেছে এবং চরম অহংকার করেছে।</p><p><b>২। হযরত ইবরাহিম (আ)-এর দাওয়াত</b></p><p>হযরত ইবরাহিম (আ) তাঁর পিতা ও সম্প্রদায়ের লোকদের মূর্তিপূজা থেকে বিরত থাকার আহ্বান জানান। তিনি যুক্তি ও প্রজ্ঞার মাধ্যমে মূর্তিপূজার অসারতা তুলে ধরেন এবং মানুষকে এক আল্লাহর ইবাদতের প্রতি আহ্বান করেন।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَا هَٰذِهِ التَّمَاثِيلُ الَّتِي أَنْتُمْ لَهَا عَاكِفُونَ.</div></div><p>(সূরা আল-আম্বিয়া, আয়াত: ৫২)</p><p>অর্থাৎ, যখন তিনি তাঁর পিতা ও সম্প্রদায়কে বললেন, তোমরা এসব মূর্তির পূজায় কেন নিবিষ্ট রয়েছ?</p><p><b>৩। হযরত হুদ (আ)-এর দাওয়াত</b></p><p>হযরত হুদ (আ) 'আদ' জাতির কাছে প্রেরিত হয়েছিলেন। তিনি তাঁর সম্প্রদায়কে এক আল্লাহর ইবাদত করতে এবং শিরক ও অহংকার পরিহার করতে আহ্বান জানান। তিনি তাদের বোঝান যে, আল্লাহ ছাড়া অন্য কোনো উপাস্য নেই।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ أَفَلَا تَتَّقُونَ.</div></div><p>(সূরা আল-আ'রাফ, আয়াত: ৬৫)</p><p>অর্থাৎ, আর আদ জাতির কাছে তাদের ভাই হুদকে পাঠিয়েছিলাম। তিনি বলেছিলেন, হে আমার সম্প্রদায়! তোমরা আল্লাহর ইবাদত করো। তিনি ছাড়া তোমাদের অন্য কোনো উপাস্য নেই। তবুও কি তোমরা তাকওয়া অবলম্বন করবে না?</p><p><b>৪। হযরত সালেহ (আ)-এর দাওয়াত</b></p><p>হযরত সালেহ (আ) সামুদ জাতির নিকট প্রেরিত হয়েছিলেন। তিনি তাঁর জাতিকে এক আল্লাহর ইবাদত করতে এবং পৃথিবীতে বিপর্যয় সৃষ্টি না করতে আহ্বান জানান। আল্লাহর নিদর্শন হিসেবে তিনি তাদের সামনে উটনী প্রদর্শন করেন।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَالِحًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ قَدْ جَاءَتْكُمْ بَيِّنَةٌ مِنْ رَبِّكُمْ هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً.</div></div><p>(সূরা আল-আ'রাফ, আয়াত: ৭৩)</p><p>অর্থাৎ, আর সামুদ জাতির কাছে তাদের ভাই সালেহকে পাঠিয়েছিলাম। তিনি বলেছিলেন, হে আমার সম্প্রদায়! তোমরা আল্লাহর ইবাদত করো। তিনি ছাড়া তোমাদের অন্য কোনো উপাস্য নেই। তোমাদের রবের পক্ষ থেকে তোমাদের কাছে স্পষ্ট প্রমাণ এসেছে। এটি আল্লাহর উটনী, তোমাদের জন্য একটি নিদর্শন।</p><p><b>৫। হযরত শুয়াইব (আ)-এর দাওয়াত</b></p><p>হযরত শুয়াইব (আ) মাদইয়ানবাসীর কাছে প্রেরিত হয়েছিলেন। তাঁর জাতির লোকেরা মাপে ও ওজনে কম দিত এবং মানুষের অধিকার নষ্ট করত। তিনি তাদেরকে এক আল্লাহর ইবাদত করার পাশাপাশি ব্যবসা-বাণিজ্যে সততা বজায় রাখা এবং মানুষের অধিকার প্রতিষ্ঠার আহ্বান জানান।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ وَلَا تَنْقُصُوا الْمِكْيَالَ وَالْمِيزَانَ.</div></div><p>(সূরা হুদ, আয়াত: ৮৪)</p><p>অর্থাৎ, আর মাদইয়ানবাসীর কাছে তাদের ভাই শুয়াইবকে পাঠিয়েছিলাম। তিনি বলেছিলেন, হে আমার সম্প্রদায়! তোমরা আল্লাহর ইবাদত করো। তিনি ছাড়া তোমাদের অন্য কোনো উপাস্য নেই। আর তোমরা মাপ ও ওজনে কম দিও না।</p><p><b>৬। হযরত ইউসুফ (আ)-এর দাওয়াত</b></p><p>হযরত ইউসুফ (আ) কারাগারে অবস্থানকালেও দাওয়াতের কাজ চালিয়ে যান। তিনি কারাগারের সঙ্গীদের কাছে এক আল্লাহর ইবাদতের আহ্বান জানান এবং মিথ্যা উপাস্যগুলোর অসারতা তুলে ধরেন। তিনি প্রশ্নোত্তরের মাধ্যমে অত্যন্ত সুন্দরভাবে তাওহিদের শিক্ষা প্রদান করেন।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا صَاحِبَيِ السِّجْنِ أَأَرْبَابٌ مُتَفَرِّقُونَ خَيْرٌ أَمِ اللَّهُ الْوَاحِدُ الْقَهَّارُ.</div></div><p>(সূরা ইউসুফ, আয়াত: ৩৯)</p><p>অর্থাৎ, হে আমার কারাগারের দুই সঙ্গী! বহু প্রভু ভালো, নাকি একক ও পরাক্রমশালী আল্লাহ?</p><p><b>৭। হযরত মূসা (আ)-এর দাওয়াত</b></p><p>হযরত মূসা (আ) ফেরাউনের কাছে আল্লাহর একত্ববাদের দাওয়াত নিয়ে প্রেরিত হন। তিনি ফেরাউনকে সত্যের পথে আহ্বান করেন। আল্লাহ তাআলা তাঁকে ফেরাউনের সঙ্গে কোমল ভাষায় কথা বলার নির্দেশ দেন। এর মাধ্যমে বোঝা যায়, দাওয়াতের ক্ষেত্রে নম্রতা ও সুন্দর ভাষার গুরুত্ব অপরিসীম।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَقُولَا لَهُ قَوْلًا لَيِّنًا لَعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَىٰ.</div></div><p>(সূরা ত্বহা, আয়াত: ৪৪)</p><p>অর্থাৎ, তোমরা তার সঙ্গে নম্র ভাষায় কথা বলবে। হয়তো সে উপদেশ গ্রহণ করবে অথবা ভয় করবে।</p><p><b>৮। হযরত ঈসা (আ)-এর দাওয়াত</b></p><p>হযরত ঈসা (আ) বনি ইসরাইলের কাছে প্রেরিত হয়েছিলেন। তিনি তাদেরকে এক আল্লাহর ইবাদত করার আহ্বান জানান এবং আল্লাহর পক্ষ থেকে প্রাপ্ত নিদর্শন ও মুজিজার মাধ্যমে নিজের নবুয়তের সত্যতা প্রমাণ করেন। তিনি মানুষকে আল্লাহভীতি ও নৈতিক জীবনযাপনের শিক্ষা দেন।</p><p><b>আয়াত :</b></p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِذْ قَالَ عِيسَى ابْنُ مَرْيَمَ يَا بَنِي إِسْرَائِيلَ اعْبُدُوا اللَّهَ رَبِّي وَرَبَّكُمْ إِنَّهُ مَنْ يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّارُ.</div></div><p>(সূরা আল-মায়িদা, আয়াত: ৭২)</p><p>অর্থাৎ, স্মরণ করো, যখন মারইয়ামের পুত্র ঈসা বলেছিলেন, হে বনি ইসরাইল! তোমরা আল্লাহর ইবাদত করো, যিনি আমার রব এবং তোমাদেরও রব। নিশ্চয় যে ব্যক্তি আল্লাহর সঙ্গে শরিক করে, আল্লাহ তার জন্য জান্নাত হারাম করে দিয়েছেন এবং তার ঠিকানা জাহান্নাম।</p><div class=\"h\">উপসংহার :</div><p>পরিশেষে বলা যায়, নবী ও রাসূলগণের দাওয়াত প্রদানের পদ্ধতি ছিল অত্যন্ত বিচিত্র, প্রজ্ঞাপূর্ণ ও যুগোপযোগী। কেউ দিন-রাত দাওয়াত দিয়েছেন, কেউ যুক্তি ও প্রমাণের মাধ্যমে মানুষকে বুঝিয়েছেন, কেউ কোমল ভাষা ব্যবহার করেছেন, আবার কেউ প্রশ্নোত্তরের মাধ্যমে তাওহিদের শিক্ষা দিয়েছেন। তাঁদের এসব পদ্ধতি থেকে শিক্ষা নিয়ে বর্তমান যুগেও প্রজ্ঞা, ধৈর্য, নম্রতা ও সুন্দর আচরণের মাধ্যমে মানুষের কাছে ইসলামের দাওয়াত পৌঁছে দিতে হবে।</p>"], ["হিকমাহ কী? এর রোকনসমূহ কী কী? হিকমাহ অর্জনের পদ্ধতিসমূহ সংক্ষেপে বর্ণনা কর।", "<div class=\"h\">উপস্থাপনা</div><p>ইসলামী দাওয়াহর অন্যতম প্রধান ভিত্তি হলো হিকমাহ বা প্রজ্ঞা। মানুষকে আল্লাহর পথে আহ্বান করার ক্ষেত্রে শুধু জ্ঞান থাকাই যথেষ্ট নয়; বরং কখন, কোথায়, কাকে এবং কীভাবে দাওয়াত দিতে হবে, সে সম্পর্কেও যথাযথ জ্ঞান ও বিচক্ষণতা থাকা প্রয়োজন। তাই দাওয়াহর ক্ষেত্রে হিকমাহর গুরুত্ব অপরিসীম। পবিত্র কুরআন ও সুন্নাহতে দাওয়াহ প্রদানের ক্ষেত্রে হিকমাহ অবলম্বনের বিশেষ নির্দেশনা দেওয়া হয়েছে।</p>\n<div class=\"h\">হিকমাহর পরিচয় ও অর্থ</div>\n<p><b>১। আভিধানিক অর্থ:</b></p>\n<p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حِكْمَةٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَكَمَ</span> ধাতু থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p>\n<p style=\"padding-left:4px\"><b>১।</b> প্রজ্ঞা।</p>\n<p style=\"padding-left:4px\"><b>২।</b> জ্ঞান।</p>\n<p style=\"padding-left:4px\"><b>৩।</b> বিচক্ষণতা।</p>\n<p style=\"padding-left:4px\"><b>৪।</b> দূরদর্শিতা।</p>\n<p style=\"padding-left:4px\"><b>৫।</b> ন্যায়বিচার।</p>\n<p style=\"padding-left:4px\"><b>৬।</b> সঠিক সিদ্ধান্ত গ্রহণ।</p>\n<p style=\"padding-left:4px\"><b>৭।</b> কোনো বিষয়ের যথার্থতা অনুধাবন করা।</p>\n<p><b>২। পারিভাষিক সংজ্ঞা:</b></p>\n<p>ইসলামী পরিভাষায় হিকমাহর কয়েকটি সংজ্ঞা নিম্নে তুলে ধরা হলো—</p>\n<p><b>ক. ইসলামী পরিভাষায় হিকমাহর সংজ্ঞা হলো—</b></p>\n<div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هِيَ الْإِصَابَةُ فِي الْقَوْلِ وَالْفِعْلِ وَوَضْعُ كُلِّ شَيْءٍ مَوْضِعَهُ</div></div>\n<p>অর্থ: কথা ও কাজে যথার্থতা অবলম্বন করা এবং প্রতিটি বিষয় ও বস্তুকে যথাযথ স্থানে রাখাকে হিকমাহ বলে।</p>\n<p><b>খ. আল্লামা তাকি উসমানি (দা.বা.)-এর মতে:</b> স্থান-কাল-পাত্র এবং ব্যক্তির মন-মানসিকতা বুঝে মানানসইভাবে ইসলামী দাওয়াত উপস্থাপনের কৌশলকে হিকমাহ বলে।</p>\n<p><b>সারকথা:</b> জ্ঞান, প্রজ্ঞা, বিচক্ষণতা ও দূরদর্শিতার মাধ্যমে স্থান-কাল-পাত্র বিবেচনা করে যথাযথ কথা ও কাজ সম্পাদন করাই হিকমাহ।</p>\n<div class=\"h\">কুরআন ও হাদিসের আলোকে হিকমাহর গুরুত্ব</div>\n<p>পবিত্র কুরআনে আল্লাহ তায়ালা হিকমাহকে বিশেষ নিয়ামত হিসেবে উল্লেখ করে বলেন—</p>\n<div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يُؤْتِي الْحِكْمَةَ مَنْ يَشَاءُ ۚ وَمَنْ يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا</div><div class=\"rf\">সূরা আল-বাকারা, আয়াত: ২৬৯</div></div>\n<p>অর্থ: তিনি যাকে ইচ্ছা হিকমাহ দান করেন। আর যাকে হিকমাহ দান করা হয়েছে, তাকে নিশ্চয়ই প্রভূত কল্যাণ দান করা হয়েছে।</p>\n<p>এ আয়াত থেকে বোঝা যায়, হিকমাহ আল্লাহর পক্ষ থেকে এক বিশেষ নিয়ামত। এটি মানুষের চিন্তা, কথা ও কাজকে সঠিক পথে পরিচালিত করে।</p>\n<p>দাওয়াহর ক্ষেত্রে হিকমাহ অবলম্বনের নির্দেশ দিয়ে আল্লাহ তায়ালা বলেন—</p>\n<div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اُدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ</div><div class=\"rf\">সূরা আন-নাহল, আয়াত: ১২৫</div></div>\n<p>অর্থ: আপনি আপনার প্রতিপালকের পথে মানুষকে আহ্বান করুন হিকমাহ বা প্রজ্ঞা এবং উত্তম উপদেশের মাধ্যমে।</p>\n<p>রাসূলুল্লাহ (সা.) বলেছেন—</p>\n<div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ</div><div class=\"rf\">সহিহ বুখারি ও সহিহ মুসলিম</div></div>\n<p>অর্থ: আল্লাহ যার কল্যাণ চান, তাকে দ্বীনের গভীর জ্ঞান দান করেন।</p>\n<p>এ হাদিস থেকে বোঝা যায়, দ্বীনের গভীর জ্ঞান অর্জন হিকমাহ লাভের অন্যতম গুরুত্বপূর্ণ মাধ্যম।</p>\n<div class=\"h\">হিকমাহর রোকনসমূহ</div>\n<p>ইসলামী দাওয়াহর ক্ষেত্রে হিকমাহর গুরুত্ব অপরিসীম। হিকমাহর কয়েকটি মৌলিক ভিত্তি বা রোকন রয়েছে। নিম্নে তা তুলে ধরা হলো—</p>\n<p><b>১। আল-কুরআন (القرآن):</b> হিকমাহর প্রধান রোকন হলো আল-কুরআন। আল্লাহর পথে আহ্বান করার ক্ষেত্রে কুরআন মাজিদের জ্ঞানই সর্বশ্রেষ্ঠ। কুরআন মাজিদের জ্ঞানবিহীন কোনো হিকমাহ বা কৌশল গ্রহণযোগ্য নয়। কুরআন সম্পর্কে যার জ্ঞান নেই, তার দাওয়াহর ভিত্তি দুর্বল হয়ে পড়ে। তাই একজন দায়ীর জন্য কুরআনের আয়াত, অর্থ, ব্যাখ্যা ও বিধিবিধান সম্পর্কে যথাযথ জ্ঞান থাকা অপরিহার্য।</p>\n<p><b>২। সুন্নাতুন নববী (السنة النبوية):</b> হিকমাহর অন্যতম রোকন হলো নবী করিম (সা.)-এর বাণী, কর্ম ও অনুমোদন তথা সুন্নাহ। সুন্নাহ সম্পর্কে অজ্ঞ ব্যক্তির হিকমাহ ইসলামী দাওয়াহর ক্ষেত্রে গ্রহণযোগ্য নয়। কুরআন মাজিদের জ্ঞানের পাশাপাশি রাসূলুল্লাহ (সা.)-এর জীবন, কর্মপদ্ধতি, আচার-আচরণ ও দাওয়াত প্রদানের কৌশল সম্পর্কে যথাযথ ধারণা থাকা আবশ্যক। কারণ তাঁর সুন্নাহ অনুসরণের মাধ্যমেই সঠিকভাবে হিকমাহ অবলম্বন করা সম্ভব।</p>\n<p><b>৩। সাহাবায়ে কেরামের চরিত্র (سيرة الصحابة):</b> ইসলামী দাওয়াহর ক্ষেত্রে হিকমাহ অবলম্বনের অন্যতম গুরুত্বপূর্ণ রোকন হলো সাহাবায়ে কেরামের জীবন ও চরিত্র। সাহাবায়ে কেরাম ছিলেন রাসূলুল্লাহ (সা.)-এর প্রত্যক্ষ প্রশিক্ষণপ্রাপ্ত আদর্শ মানুষ। তাঁদের জ্ঞান, ধৈর্য, ত্যাগ, সততা, বিচক্ষণতা ও দাওয়াতি কর্মপদ্ধতি পরবর্তী মুসলিম উম্মাহর জন্য অনুসরণীয় আদর্শ।</p>\n<p>আল্লাহ তায়ালা সাহাবায়ে কেরামের মর্যাদা সম্পর্কে বলেন—</p>\n<div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ وَالَّذِينَ اتَّبَعُوهُمْ بِإِحْسَانٍ رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ</div><div class=\"rf\">সূরা আত-তাওবা, আয়াত: ১০০</div></div>\n<p>অর্থ: মুহাজির ও আনসারদের মধ্যে যারা প্রথম অগ্রগামী এবং যারা নিষ্ঠার সঙ্গে তাঁদের অনুসরণ করেছে, আল্লাহ তাঁদের প্রতি সন্তুষ্ট হয়েছেন এবং তাঁরাও তাঁর প্রতি সন্তুষ্ট হয়েছে।</p>\n<p>রাসূলুল্লাহ (সা.) সাহাবিদের মর্যাদা সম্পর্কে বলেছেন—</p>\n<div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَيْرُ النَّاسِ قَرْنِي ثُمَّ الَّذِينَ يَلُونَهُمْ ثُمَّ الَّذِينَ يَلُونَهُمْ</div><div class=\"rf\">সহিহ বুখারি ও সহিহ মুসলিম</div></div>\n<p>অর্থ: সর্বোত্তম মানুষ হলো আমার যুগের মানুষ, অতঃপর তাদের পরবর্তী যুগের মানুষ, অতঃপর তাদের পরবর্তী যুগের মানুষ।</p>"], ["হিকমাহ কী? এর রুকন, স্তর এবং দাওয়াহ ইলাল্লাহর ক্ষেত্রে এর গুরুত্ব সম্পর্কে আলোচনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলামী দাওয়াহর অন্যতম প্রধান ভিত্তি হলো হিকমাহ বা প্রজ্ঞা। মানুষকে আল্লাহর পথে আহ্বান করার ক্ষেত্রে শুধু জ্ঞান ও বক্তব্যের দক্ষতা যথেষ্ট নয়; বরং স্থান, কাল, পাত্র, ব্যক্তির মন-মানসিকতা ও পরিবেশ বিবেচনা করে উপযুক্ত পদ্ধতিতে দাওয়াত প্রদান করা অপরিহার্য। এ কারণেই পবিত্র কুরআনে আল্লাহ তায়ালা দাওয়াহর ক্ষেত্রে হিকমাহ অবলম্বনের নির্দেশ দিয়েছেন। একজন দায়ীর দাওয়াতকে কার্যকর, গ্রহণযোগ্য ও ফলপ্রসূ করার জন্য হিকমাহর রুকন, স্তর ও গুরুত্ব সম্পর্কে জ্ঞান থাকা প্রয়োজন।</p><div class=\"h\">হিকমাহর পরিচয় ও অর্থ</div><p style=\"padding-left:4px\"><b>১।</b> আভিধানিক অর্থ:</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حِكْمَةٌ</span> শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَكَمَ</span> ধাতু থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> প্রজ্ঞা।</p><p style=\"padding-left:4px\"><b>২।</b> জ্ঞান।</p><p style=\"padding-left:4px\"><b>৩।</b> বিচক্ষণতা।</p><p style=\"padding-left:4px\"><b>৪।</b> দূরদর্শিতা।</p><p style=\"padding-left:4px\"><b>৫।</b> ন্যায়বিচার।</p><p style=\"padding-left:4px\"><b>৬।</b> সঠিক সিদ্ধান্ত গ্রহণ।</p><p style=\"padding-left:4px\"><b>২।</b> পারিভাষিক সংজ্ঞা:</p><p>ইসলামী পরিভাষায় হিকমাহর সংজ্ঞা হলো—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هِيَ الْإِصَابَةُ فِي الْقَوْلِ وَالْفِعْلِ وَوَضْعُ كُلِّ شَيْءٍ مَوْضِعَهُ</div></div><p>অর্থ: কথা ও কাজে যথার্থতা অবলম্বন করা এবং প্রতিটি বিষয় ও বস্তুকে তার উপযুক্ত স্থানে স্থাপন করাকে হিকমাহ বলে।</p><p>আল্লামা তাকি উসমানি (দা.বা.)-এর ব্যাখ্যা অনুযায়ী: স্থান-কাল-পাত্র এবং ব্যক্তির মন-মানসিকতা বুঝে মানানসইভাবে ইসলামী দাওয়াত উপস্থাপনের কৌশলকে হিকমাহ বলে।</p><p><b>সারকথা:</b> জ্ঞান, প্রজ্ঞা, বিচক্ষণতা ও দূরদর্শিতার মাধ্যমে পরিস্থিতি বিবেচনা করে যথাযথ পদ্ধতিতে কথা ও কাজ সম্পাদন করাই হিকমাহ।</p><div class=\"h\">কুরআন ও হাদিসের আলোকে হিকমাহর গুরুত্ব</div><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يُؤْتِي الْحِكْمَةَ مَنْ يَشَاءُ ۚ وَمَنْ يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا</div></div><p>অর্থ: তিনি যাকে ইচ্ছা হিকমাহ দান করেন। আর যাকে হিকমাহ দান করা হয়েছে, তাকে নিশ্চয়ই প্রভূত কল্যাণ দান করা হয়েছে।</p><p>সূরা আল-বাকারা, আয়াত: ২৬৯।</p><p>এ আয়াত থেকে বোঝা যায়, হিকমাহ আল্লাহর পক্ষ থেকে বিশেষ নিয়ামত এবং মানুষের জীবনে কল্যাণ অর্জনের অন্যতম মাধ্যম।</p><p>রাসূলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ</div></div><p>অর্থ: আল্লাহ যার কল্যাণ চান, তাকে দ্বীনের গভীর জ্ঞান দান করেন।</p><p>সহিহ বুখারি ও সহিহ মুসলিম।</p><p>হিকমাহর রুকনসমূহ</p><p>ইসলামী দাওয়াহর ক্ষেত্রে হিকমাহর কয়েকটি মৌলিক ভিত্তি বা রুকন রয়েছে। যথা—</p><p style=\"padding-left:4px\"><b>১।</b> আল-কুরআন (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">القرآن</span>):</p><p>হিকমাহর প্রধান রুকন হলো আল-কুরআন। আল্লাহর পথে আহ্বান করার ক্ষেত্রে কুরআন মাজিদের জ্ঞানই সর্বশ্রেষ্ঠ ভিত্তি। কুরআনের জ্ঞান ছাড়া ইসলামী দাওয়াহর কোনো পদ্ধতি যথার্থ হতে পারে না। একজন দায়ীর কুরআনের আয়াত, অর্থ, তাফসির ও বিধিবিধান সম্পর্কে যথাযথ জ্ঞান থাকা আবশ্যক।</p><p><b>২। সুন্নাতুন নববী (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">السنة النبوية</span>):</b></p><p>হিকমাহর দ্বিতীয় রুকন হলো রাসূলুল্লাহ (সা.)-এর বাণী, কর্ম ও অনুমোদন তথা সুন্নাহ। কুরআনের পাশাপাশি তাঁর জীবন, চরিত্র, আচরণ ও দাওয়াত প্রদানের পদ্ধতি সম্পর্কে জ্ঞান অর্জন করতে হবে। কারণ রাসূলুল্লাহ (সা.)-এর সুন্নাহ অনুসরণের মাধ্যমেই দাওয়াহর ক্ষেত্রে সঠিক প্রজ্ঞা ও কৌশল অবলম্বন করা সম্ভব।</p><p><b>৩। সাহাবায়ে কেরামের চরিত্র (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">سيرة الصحابة</span>):</b></p><p>হিকমাহর অন্যতম গুরুত্বপূর্ণ রুকন হলো সাহাবায়ে কেরামের জীবন ও চরিত্র। তাঁদের জ্ঞান, ধৈর্য, ত্যাগ, সততা, বিচক্ষণতা ও দাওয়াতি কর্মপদ্ধতি পরবর্তী মুসলিম উম্মাহর জন্য অনুসরণীয় আদর্শ।</p><p>রাসূলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">خَيْرُ النَّاسِ قَرْنِي ثُمَّ الَّذِينَ يَلُونَهُمْ ثُمَّ الَّذِينَ يَلُونَهُمْ</div></div><p>অর্থ: সর্বোত্তম মানুষ হলো আমার যুগের মানুষ, অতঃপর তাদের পরবর্তী যুগের মানুষ, অতঃপর তাদের পরবর্তী যুগের মানুষ।</p><p>সহিহ বুখারি ও সহিহ মুসলিম।</p><div class=\"h\">হিকমাহর স্তরসমূহ</div><p>দাওয়াহর ক্ষেত্রে মানুষের জ্ঞান, মানসিকতা ও গ্রহণক্ষমতা অনুযায়ী হিকমাহ প্রয়োগের তিনটি মৌলিক পদ্ধতি রয়েছে। আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اُدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِيْ هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</div></div><p>অর্থ: আপনি আপনার প্রতিপালকের পথে মানুষকে আহ্বান করুন হিকমাহ বা প্রজ্ঞা, উত্তম উপদেশ এবং সর্বোত্তম পন্থায় যুক্তিতর্কের মাধ্যমে। নিশ্চয়ই আপনার প্রতিপালক ভালোভাবেই জানেন কে তাঁর পথ থেকে বিচ্যুত হয়েছে এবং কে সঠিক পথে পরিচালিত হয়েছে।</p><p>সূরা আন-নাহল, আয়াত: ১২৫।</p><p>এ আয়াতের আলোকে হিকমাহর স্তর বা দাওয়াহর তিনটি মৌলিক পদ্ধতি হলো—</p><p><b>১। হিকমাহর মাধ্যমে দাওয়াহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">بِالْحِكْمَةِ</span>):</b></p><p>এটি দাওয়াহর অন্যতম প্রজ্ঞাপূর্ণ পদ্ধতি। জ্ঞানী, বুদ্ধিমান ও চিন্তাশীল ব্যক্তিদের কাছে কুরআন-সুন্নাহর দলিল, যুক্তি ও বাস্তব প্রমাণের মাধ্যমে ইসলামের বাণী উপস্থাপন করাকে হিকমাহর মাধ্যমে দাওয়াহ বলে। এতে ব্যক্তির জ্ঞান ও বুদ্ধিবৃত্তিক যোগ্যতা বিবেচনা করা হয়।</p><p><b>২। মাওয়িযাহ হাসানাহর মাধ্যমে দাওয়াহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْمَوْعِظَةِ الْحَسَنَةِ</span>):</b></p><p>এ স্তরে কোমল ভাষা, সুন্দর উপদেশ, উৎসাহ ও সতর্কীকরণের মাধ্যমে মানুষকে ইসলামের পথে আহ্বান করা হয়। সাধারণ মানুষ ও যাদের হৃদয়ে উপদেশের প্রভাব বেশি পড়ে, তাদের জন্য এ পদ্ধতি বিশেষভাবে কার্যকর।</p><p><b>৩। মুজাদালাহ বিল আহসানের মাধ্যমে দাওয়াহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْمُجَادَلَةِ بِالَّتِي هِيَ أَحْسَنُ</span>):</b></p><p>এ স্তরে বিরোধী মতাদর্শের মানুষ কিংবা প্রশ্ন ও আপত্তি উত্থাপনকারীদের সঙ্গে উত্তম পন্থায় আলোচনা ও যুক্তিতর্ক করা হয়। কুরআন, সুন্নাহ ও অকাট্য যুক্তির মাধ্যমে তাদের ভুল ধারণা দূর করে সত্য প্রতিষ্ঠা করাই এ পদ্ধতির উদ্দেশ্য। এক্ষেত্রে শালীনতা, ধৈর্য ও উত্তম আচরণ বজায় রাখতে হয়।</p><div class=\"h\">দাওয়াহ ইলাল্লাহর ক্ষেত্রে হিকমাহর গুরুত্ব</div><p>ইসলামী দাওয়াহর ক্ষেত্রে হিকমাহর গুরুত্ব ও প্রভাব অত্যন্ত ব্যাপক। নিম্নে কয়েকটি দিক তুলে ধরা হলো—</p><p><b>১। দাওয়াহকে ফলপ্রসূ করা:</b> হিকমাহ অবলম্বনের মাধ্যমে দাওয়াহ মানুষের কাছে সহজবোধ্য ও গ্রহণযোগ্য হয়। ফলে দাওয়াতের উদ্দেশ্য সফল হওয়ার সম্ভাবনা বৃদ্ধি পায়।</p><p><b>২। মানুষের মন জয় করা:</b> কোমল আচরণ, সুন্দর ভাষা ও প্রজ্ঞাপূর্ণ উপস্থাপনার মাধ্যমে মানুষের হৃদয়ে ভালোবাসা ও বিশ্বাস সৃষ্টি করা যায়।</p><p><b>৩। ভুল ধারণা দূর করা:</b> যুক্তিপূর্ণ আলোচনা ও যথাযথ দলিল উপস্থাপনের মাধ্যমে মানুষের ভুল ধারণা, সন্দেহ ও সংশয় দূর করা সম্ভব হয়।</p><p><b>৪। বিরোধ ও সংঘাত পরিহার:</b> হিকমাহ দায়ীকে ধৈর্য, সহনশীলতা ও নম্রতা শিক্ষা দেয়। ফলে অপ্রয়োজনীয় বিতর্ক, বিবাদ ও সংঘাত থেকে রক্ষা পাওয়া যায়।</p><p><b>৫। ব্যক্তিভেদে দাওয়াহ প্রদান:</b> প্রত্যেক মানুষের জ্ঞান, বুদ্ধি, বয়স ও মানসিকতা এক নয়। হিকমাহর মাধ্যমে ব্যক্তির অবস্থা অনুযায়ী দাওয়াহর পদ্ধতি নির্ধারণ করা যায়।</p><p><b>৬। ইসলামের সৌন্দর্য তুলে ধরা:</b> উত্তম চরিত্র, সুন্দর ব্যবহার ও বাস্তবসম্মত উপস্থাপনার মাধ্যমে ইসলামের প্রকৃত সৌন্দর্য মানুষের সামনে প্রকাশ পায়।</p><p><b>৭। দাওয়াহর প্রসার ও স্থায়িত্ব নিশ্চিত করা:</b> সঠিক পরিকল্পনা, ধৈর্য ও প্রজ্ঞাপূর্ণ পদ্ধতি অনুসরণের ফলে দাওয়াহ দীর্ঘস্থায়ী ও ব্যাপকভাবে সম্প্রসারিত হতে পারে।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, হিকমাহ ইসলামী দাওয়াহর প্রাণ ও অন্যতম প্রধান ভিত্তি। আল-কুরআন, সুন্নাহ ও সাহাবায়ে কেরামের আদর্শকে অনুসরণ করে মানুষের অবস্থা অনুযায়ী দাওয়াহ প্রদান করাই প্রকৃত হিকমাহ। তাই প্রত্যেক দায়ীর উচিত জ্ঞান, প্রজ্ঞা, ধৈর্য ও উত্তম আচরণের সমন্বয়ে হিকমাহ অবলম্বন করা। তাহলেই ইসলামী দাওয়াহ অধিক কার্যকর ও ফলপ্রসূ হবে।</p>"], ["মাওয়িযাহ হাসানাহ কী? ইসলাম প্রসারে এর গুরুত্ব সম্পর্কে আলোচনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। এ জীবনব্যবস্থার শিক্ষা মানুষের কাছে পৌঁছে দেওয়ার অন্যতম কার্যকর পদ্ধতি হলো মাওয়িযাহ হাসানাহ বা উত্তম উপদেশ। মানুষের হৃদয়ে ঈমান, আল্লাহভীতি ও নৈতিক মূল্যবোধ জাগ্রত করতে সুন্দর ভাষা, কোমল আচরণ, হৃদয়গ্রাহী বক্তব্য এবং কল্যাণকর উপদেশের বিশেষ ভূমিকা রয়েছে। তাই ইসলামী দাওয়াহর ক্ষেত্রে মাওয়িযাহ হাসানাহ অত্যন্ত গুরুত্বপূর্ণ একটি পদ্ধতি। এর মাধ্যমে মানুষকে ভালো কাজের প্রতি উৎসাহিত করা এবং অন্যায় ও পাপাচার থেকে বিরত থাকার আহ্বান জানানো হয়।</p><div class=\"h\">মাওয়িযাহ হাসানাহর পরিচয় ও অর্থ</div><p style=\"padding-left:4px\"><b>১।</b> আভিধানিক অর্থ:</p><p>মাওয়িযাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مَوْعِظَةٌ</span>) শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">وَعَظَ</span> ধাতু থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> উপদেশ।</p><p style=\"padding-left:4px\"><b>২।</b> নসিহত।</p><p style=\"padding-left:4px\"><b>৩।</b> সদুপদেশ।</p><p style=\"padding-left:4px\"><b>৪।</b> সতর্কবাণী।</p><p style=\"padding-left:4px\"><b>৫।</b> হৃদয়গ্রাহী বক্তব্য।</p><p>আর হাসানাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَسَنَةٌ</span>) শব্দের অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সুন্দর।</p><p style=\"padding-left:4px\"><b>২।</b> উত্তম।</p><p style=\"padding-left:4px\"><b>৩।</b> ভালো।</p><p style=\"padding-left:4px\"><b>৪।</b> কল্যাণকর।</p><p>সুতরাং মাওয়িযাহ হাসানাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْمَوْعِظَةُ الْحَسَنَةُ</span>) অর্থ হলো উত্তম উপদেশ, সুন্দর নসিহত বা হৃদয়গ্রাহী সদুপদেশ।</p><p style=\"padding-left:4px\"><b>২।</b> পারিভাষিক সংজ্ঞা:</p><p>ক. ইমাম ইবনে কাসীর (রহ.) বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالْمَوْعِظَةِ الْحَسَنَةِ أَيْ بِمَا فِيهِ مِنَ الزَّوَاجِرِ وَالْوَقَائِعِ بِالنَّاسِ ذَكِّرْهُمْ بِهَا لِيَحْذَرُوا بَأْسَ اللَّهِ تَعَالَى</div></div><p>অর্থ: মাওয়িযাহ হাসানাহ হলো এমন উপদেশ, যার মধ্যে সতর্কবাণী ও মানুষের পরিণতির বিবরণ রয়েছে। এসবের মাধ্যমে মানুষকে স্মরণ করিয়ে দিতে হবে, যাতে তারা আল্লাহর শাস্তি থেকে সতর্ক হয়।</p><p>তাফসির ইবনে কাসীর, সূরা আন-নাহল, আয়াত: ১২৫।</p><p>খ. ইমাম বাগাভী (রহ.) বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالْمَوْعِظَةُ الْحَسَنَةُ يَعْنِي مَوَاعِظَ الْقُرْآنِ</div></div><p>অর্থ: মাওয়িযাহ হাসানাহ বলতে কুরআনের উপদেশসমূহকে বোঝায়।</p><p>তাফসির আল-বাগাভী, সূরা আন-নাহল, আয়াত: ১২৫।</p><p>গ. শায়খ আবদুর রহমান আস-সা‘দী (রহ.) বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَهُوَ الْأَمْرُ وَالنَّهْيُ الْمَقْرُونُ بِالتَّرْغِيبِ وَالتَّرْهِيبِ</div></div><p>অর্থ: মাওয়িযাহ হাসানাহ হলো এমন আদেশ ও নিষেধ, যার সঙ্গে উৎসাহ প্রদান ও সতর্কীকরণ যুক্ত থাকে।</p><p>তাফসির আস-সা‘দী, সূরা আন-নাহল, আয়াত: ১২৫।</p><p><b>সারকথা:</b> কুরআন-সুন্নাহর আলোকে কোমল ভাষা, সুন্দর আচরণ, উৎসাহ ও সতর্কীকরণের মাধ্যমে মানুষকে আল্লাহর পথে আহ্বান করাই মাওয়িযাহ হাসানাহ।</p><div class=\"h\">কুরআনের আলোকে মাওয়িযাহ হাসানাহর গুরুত্ব</div><p>আল্লাহ তায়ালা পবিত্র কুরআনে রাসূলুল্লাহ (সা.)-কে উত্তম উপদেশের মাধ্যমে মানুষকে আল্লাহর পথে আহ্বান করার নির্দেশ দিয়েছেন। তিনি বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ</div></div><p>অর্থ: আপনি আপনার প্রতিপালকের পথে মানুষকে আহ্বান করুন হিকমাহ বা প্রজ্ঞা, উত্তম উপদেশ এবং সর্বোত্তম পন্থায় যুক্তিতর্কের মাধ্যমে। নিশ্চয়ই আপনার প্রতিপালক ভালোভাবেই জানেন কে তাঁর পথ থেকে বিচ্যুত হয়েছে এবং কে সঠিক পথে পরিচালিত হয়েছে।</p><p>সূরা আন-নাহল, আয়াত: ১২৫।</p><p>এ আয়াত থেকে প্রমাণিত হয় যে, ইসলাম প্রচারের ক্ষেত্রে উত্তম উপদেশ একটি গুরুত্বপূর্ণ দাওয়াতি পদ্ধতি।</p><p>আল্লাহ তায়ালা আরও বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَبِمَا رَحْمَةٍ مِّنَ اللَّهِ لِنْتَ لَهُمْ وَلَوْ كُنْتَ فَظًّا غَلِيظَ الْقَلْبِ لَانْفَضُّوا مِنْ حَوْلِكَ</div></div><p>অর্থ: আল্লাহর রহমতেই আপনি তাদের প্রতি কোমল হয়েছেন। আর আপনি যদি রূঢ় ও কঠোর হৃদয়ের হতেন, তাহলে তারা আপনার আশপাশ থেকে সরে যেত।</p><p>সূরা আলে ইমরান, আয়াত: ১৫৯।</p><p>এ আয়াত থেকে বোঝা যায়, মানুষের কাছে ইসলামের বাণী পৌঁছানোর ক্ষেত্রে কোমলতা ও উত্তম আচরণ অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">ইসলাম প্রসারে মাওয়িযাহ হাসানাহর গুরুত্ব</div><p>ইসলাম প্রসারে মাওয়িযাহ হাসানাহর গুরুত্ব অপরিসীম। নিম্নে এর কয়েকটি গুরুত্বপূর্ণ দিক তুলে ধরা হলো—</p><p style=\"padding-left:4px\"><b>১।</b> মানুষের হৃদয় জয় করা:</p><p>উত্তম উপদেশ মানুষের হৃদয়ে গভীর প্রভাব সৃষ্টি করে। কোমল ভাষা, সুন্দর আচরণ ও আন্তরিক বক্তব্যের মাধ্যমে মানুষের মনে দাওয়াতদাতার প্রতি ভালোবাসা ও শ্রদ্ধা জন্মায়। ফলে ইসলামের বাণী গ্রহণ করা সহজ হয়।</p><p><b>২। ইসলামের প্রতি আগ্রহ সৃষ্টি করা:</b></p><p>মাওয়িযাহ হাসানাহর মাধ্যমে মানুষকে ইসলামের সৌন্দর্য, কল্যাণ ও জীবনঘনিষ্ঠ শিক্ষা সম্পর্কে অবহিত করা যায়। জান্নাতের সুসংবাদ, আল্লাহর রহমত ও নেক আমলের ফজিলত তুলে ধরে মানুষকে ইসলামের প্রতি আগ্রহী করা সম্ভব।</p><p><b>৩। অন্যায় ও পাপাচার থেকে বিরত রাখা:</b></p><p>উত্তম উপদেশের মাধ্যমে মানুষকে পাপের পরিণতি, জাহান্নামের শাস্তি এবং অন্যায় কাজের ক্ষতিকর দিক সম্পর্কে সতর্ক করা হয়। ফলে মানুষ অন্যায় ও পাপাচার থেকে বিরত থাকার অনুপ্রেরণা পায়।</p><p style=\"padding-left:4px\"><b>৪।</b> ঈমান ও তাকওয়া বৃদ্ধি করা:</p><p>কুরআনের আয়াত, হাদিস, জান্নাত-জাহান্নামের আলোচনা এবং আল্লাহর নিয়ামতের স্মরণ মানুষের অন্তরে ঈমান ও তাকওয়া বৃদ্ধি করে। এর ফলে মানুষ আল্লাহর আনুগত্যে অধিক মনোযোগী হয়।</p><p style=\"padding-left:4px\"><b>৫।</b> নৈতিক চরিত্র গঠন করা:</p><p>মাওয়িযাহ হাসানাহ মানুষকে সত্যবাদিতা, আমানতদারি, ধৈর্য, ক্ষমাশীলতা, নম্রতা ও মানবিকতার শিক্ষা দেয়। ফলে ব্যক্তিগত ও সামাজিক জীবনে উত্তম চরিত্র গড়ে ওঠে।</p><p style=\"padding-left:4px\"><b>৬।</b> ভুল ধারণা ও সংশয় দূর করা:</p><p>অনেক মানুষ ইসলামের বিভিন্ন বিধান সম্পর্কে অজ্ঞতা বা ভুল ধারণার কারণে বিভ্রান্ত হয়। সুন্দরভাবে উপদেশ প্রদান ও সহজ ভাষায় বিষয়গুলো বুঝিয়ে বলার মাধ্যমে তাদের সংশয় ও ভুল ধারণা দূর করা যায়।</p><p><b>৭। সামাজিক শান্তি ও সম্প্রীতি প্রতিষ্ঠা:</b></p><p>উত্তম উপদেশ মানুষকে পারস্পরিক ভালোবাসা, সহানুভূতি, ক্ষমা ও সহনশীলতার শিক্ষা দেয়। ফলে সমাজে হিংসা-বিদ্বেষ, ঝগড়া-বিবাদ ও সংঘাত কমে আসে এবং শান্তি-শৃঙ্খলা প্রতিষ্ঠিত হয়।</p><p><b>৮। ইসলামের ব্যাপক প্রচার ও প্রসার:</b></p><p>কঠোরতা ও রূঢ় আচরণের পরিবর্তে সুন্দর ভাষা ও আন্তরিক উপদেশের মাধ্যমে মানুষকে ইসলামের দিকে আহ্বান করলে দাওয়াত অধিক গ্রহণযোগ্য হয়। এভাবে ব্যক্তি থেকে পরিবার, পরিবার থেকে সমাজ এবং সমাজ থেকে বৃহত্তর জনগোষ্ঠীর মধ্যে ইসলামের শিক্ষা ছড়িয়ে পড়ে।</p><p><b>৯। রাসূলুল্লাহ (সা.)-এর আদর্শ অনুসরণ:</b></p><p>রাসূলুল্লাহ (সা.) মানুষের সঙ্গে কোমল আচরণ করতেন এবং সুন্দর ভাষায় তাদের উপদেশ দিতেন। তাঁর দাওয়াতি জীবনের এ আদর্শ অনুসরণ করলে একজন দায়ী প্রকৃত ইসলামী পদ্ধতিতে দাওয়াহ পরিচালনা করতে পারেন।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, মাওয়িযাহ হাসানাহ ইসলামী দাওয়াহর একটি গুরুত্বপূর্ণ ও কার্যকর পদ্ধতি। এর মাধ্যমে মানুষের হৃদয়ে ঈমান, তাকওয়া ও নৈতিক মূল্যবোধ সৃষ্টি করা যায়। ইসলাম প্রসারে একজন দায়ীর উচিত কুরআন-সুন্নাহর আলোকে জ্ঞান, আন্তরিকতা, কোমল ভাষা ও উত্তম আচরণের মাধ্যমে মানুষকে উপদেশ প্রদান করা। তাহলেই ইসলামের শিক্ষা মানুষের জীবনে বাস্তবায়িত হবে এবং সমাজে শান্তি, সম্প্রীতি ও নৈতিকতা প্রতিষ্ঠিত হবে।</p>"], ["মুজাদালাহ কী? তা কত প্রকার ও কী কী? দাওয়াহর ক্ষেত্রে মুজাদালাহ হাসানাহর গুরুত্ব বর্ণনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলামী দাওয়াতদানকারীরা এ সমাজের শ্রেষ্ঠ রূহানি চিকিৎসক। চিকিৎসক যেমন রোগীর অবস্থা বুঝে চিকিৎসা দেন, তেমনি ইসলামের পথে দাওয়াতদানকারীও মানুষের অবস্থা বুঝে ইসলামের পথে তাকে আহ্বান জানাবেন। নবী করীম (সা.) একেকজনকে একেক বিষয়ের প্রতি বেশি গুরুত্ব আরোপ করেছেন। বিশেষ করে চিন্তাবিভক্ত বা সন্দেহপ্রবণ মানুষকে যৌক্তিকভাবে ও যুক্তিতর্কের মাধ্যমে দ্বীনের প্রতি আহ্বান জানাতে হবে।</p><div class=\"h\">مُجَادَلَة-এর আভিধানিক অর্থ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَة</span> শব্দটি বাবে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُفَاعَلَة</span>-এর মাসদার। এর অর্থ—</p><p style=\"padding-left:4px\"><b>১।</b> যুক্তিপূর্ণ প্রমাণ।</p><p style=\"padding-left:4px\"><b>২।</b> পারস্পরিক দলিল উপস্থাপন।</p><p style=\"padding-left:4px\"><b>৩।</b> তর্কযুদ্ধে লিপ্ত হওয়া।</p><p>৪। সামনাসামনি দলিল উপস্থাপন করা।</p><p style=\"padding-left:4px\"><b>৫।</b> আলোচনা ও তর্ক-বিতর্ক।</p><div class=\"h\">مُجَادَلَة-এর শরয়ী সংজ্ঞা:</div><p>১। সত্যকে প্রতিষ্ঠা করার জন্য উপযুক্ত ও যুক্তিপূর্ণ প্রমাণ ও দলিল পেশ করাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَة</span> বলে।</p><p style=\"padding-left:4px\"><b>২।</b> ড. সাইয়েদ রিযক তাবীল বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْمُجَادَلَةُ هِيَ الْحِوَارُ وَتَبَادُلُ الْأَدِلَّةِ وَالْبَرَاهِينِ بَيْنَ الْأَطْرَافِ دَعْمًا لِمَا يَرَاهُ كُلُّ مِنْهُمَا مِنْ فِكْرٍ وَمَا يَعْتَقِدُهُ مِنْ رَأْيٍ.</div></div><p>অর্থাৎ, বিভিন্ন পক্ষ স্বীয় চিন্তা ও বিশ্বাসমত অভিমত প্রতিষ্ঠা করার লক্ষ্যে ভিন্নমতাবলম্বী পক্ষসমূহের পারস্পরিক দলিল-প্রমাণাদি বিনিময় ও সংলাপকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَة</span> বলে।</p><p>৩। ইসলামের বিরুদ্ধবাদীদের উপস্থাপিত অভিযোগকে উপযুক্ত দলিলের মাধ্যমে খণ্ডন করাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَة</span> বলে।</p><div class=\"h\">مُجَادَلَة-এর প্রকারভেদ:</div><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَة</span> তথা তর্ক-বিতর্ককে দু'ভাগে ভাগ করা হয়েছে। যথা—</p><p>১। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةٌ بِالْخَيْرِ</span> (উত্তম পদ্ধতিতে যুক্তিতর্ক)।</p><p>২। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةٌ بِالشَّرِّ</span> (অনুত্তম পদ্ধতিতে যুক্তিতর্ক)।</p><p><b>১। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةٌ بِالْخَيْرِ</span> (উত্তম পন্থায় বিতর্ক):</b></p><p>সত্যকে প্রতিষ্ঠা করা, ভুল ধারণা দূর করা এবং মানুষকে সঠিক পথে পরিচালিত করার উদ্দেশ্যে সুন্দর ভাষা, যুক্তি ও উপযুক্ত দলিল-প্রমাণের মাধ্যমে যে বিতর্ক করা হয়, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةٌ بِالْخَيْرِ</span> বলে। এ ধরনের বিতর্কে নম্রতা, ভদ্রতা, সহনশীলতা ও উত্তম আচরণ বজায় রাখা হয়। প্রতিপক্ষকে অপমান বা পরাজিত করা এর উদ্দেশ্য নয়; বরং যুক্তি ও প্রমাণের মাধ্যমে সত্যকে সুস্পষ্টভাবে তুলে ধরাই এর মূল লক্ষ্য।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ</div></div><p>অর্থাৎ, তাদের সঙ্গে সর্বোত্তম পন্থায় বিতর্ক কর।</p><p><b>২। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةٌ بِالْبَاطِلِ</span> (বাতিল পন্থায় বিতর্ক):</b></p><p>সত্যকে প্রত্যাখ্যান করা, মিথ্যা ও ভিত্তিহীন যুক্তি উপস্থাপন করা এবং সত্যকে ব্যর্থ করে দেওয়ার উদ্দেশ্যে যে তর্ক-বিতর্ক করা হয়, তাকে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةٌ بِالْبَاطِلِ</span> বলে। এ ধরনের বিতর্কে সত্য গ্রহণের মানসিকতা থাকে না; বরং হঠকারিতা, অহংকার ও অসৎ উদ্দেশ্য প্রাধান্য পায়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَجَادَلُوا بِالْبَاطِلِ لِيُدْحِضُوا بِهِ الْحَقَّ</div></div><p>অর্থাৎ, তারা মিথ্যা তর্ক-বিতর্কে প্রবৃত্ত হয়েছিল, যেন এর মাধ্যমে সত্যকে ব্যর্থ করে দিতে পারে।</p><div class=\"h\">উত্তম পন্থায় তর্ক-বিতর্কের নির্দেশ:</div><p>পবিত্র কুরআনে আল্লাহ তায়ালা উত্তম পন্থায় তর্ক-বিতর্ক করার নির্দেশ দিয়েছেন। <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">جِدَال</span> শব্দটি কুরআনে বিভিন্ন স্থানে উল্লেখিত হয়েছে। তন্মধ্যে উল্লেখযোগ্য কয়েকটি আয়াত নিম্নে তুলে ধরা হলো—</p><p><b>১। মানুষের স্বভাবগত বৈশিষ্ট্য হিসেবে তর্কপ্রবণতা:</b></p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَكَانَ الْإِنْسَانُ أَكْثَرَ شَيْءٍ جَدَلًا</div></div><p>অর্থাৎ, সমগ্র সৃষ্টিজীবের মধ্যে মানুষ সর্বাধিক তর্কপ্রিয়।</p><p><b>২। হজরত নূহ (আ.)-এর সঙ্গে তাঁর সম্প্রদায়ের বিতর্ক:</b></p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قَالُوا يَا نُوحُ قَدْ جَادَلْتَنَا فَأَكْثَرْتَ جِدَالَنَا</div></div><p>অর্থাৎ, তারা বলল, হে নূহ! আপনি আমাদের সঙ্গে বিতর্ক করেছেন এবং অনেক বেশি বিতর্ক করেছেন।</p><p><b>৩। আহলে কিতাবের সঙ্গে উত্তম পন্থায় বিতর্ক:</b></p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ</div></div><p>অর্থাৎ, আহলে কিতাবের সঙ্গে উত্তম পন্থা ব্যতীত তর্ক-বিতর্ক করো না।</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">بِالَّتِي هِيَ أَحْسَنُ</span>-এর তাৎপর্য:</p><p><span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">بِالَّتِي هِيَ أَحْسَنُ</span> অর্থ হলো সর্বোত্তম পদ্ধতিতে যুক্তিতর্ক করা। অর্থাৎ, দাওয়াতের কাজে কোথাও তর্ক-বিতর্কের প্রয়োজন দেখা দিলে তা অবশ্যই উত্তম পন্থায় করতে হবে। এ ক্ষেত্রে কথাবার্তায় নম্রতা, ভদ্রতা ও কোমলতা অবলম্বন করতে হবে। এমন যুক্তি ও প্রমাণ উপস্থাপন করতে হবে, যা প্রতিপক্ষ সহজে বুঝতে সক্ষম হয়। পরিচিত, প্রসিদ্ধ ও গ্রহণযোগ্য বক্তব্যের মাধ্যমে যুক্তি তুলে ধরতে হবে, যাতে প্রতিপক্ষের সন্দেহ দূর হয় এবং সে হঠকারিতার পথ পরিহার করে।</p><p>কুরআনের অন্যান্য আয়াত থেকেও প্রমাণিত হয় যে, উত্তম পন্থায় তর্ক-বিতর্ক শুধু মুসলমানদের সঙ্গে নয়; বরং আহলে কিতাবের সঙ্গেও করতে হবে। এমনকি হজরত মুসা ও হারুন (আ.)-কে ফিরাউনের মতো অবাধ্য শাসকের সঙ্গে কথা বলার ক্ষেত্রেও নম্রতা অবলম্বনের নির্দেশ দেওয়া হয়েছিল। আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَقُولَا لَهُ قَوْلًا لَيِّنًا</div></div><p>অর্থাৎ, তোমরা তার সঙ্গে কোমল ভাষায় কথা বলবে।</p><p>উপরিউক্ত আয়াতগুলো প্রমাণ করে যে, ইসলামী দাওয়াতের ক্ষেত্রে তর্ক-বিতর্ক করতে হলে তা উত্তম পন্থায় করতে হবে। প্রতিপক্ষের সঙ্গে অত্যন্ত ভদ্রচিত্তে, নম্র ও মিষ্টি ভাষায় কথা বলতে হবে। সত্য প্রতিষ্ঠা ও মানুষের সংশয় দূর করাই হবে এর মূল উদ্দেশ্য।</p><div class=\"h\">দাওয়াতের ক্ষেত্রে মুজাদালাহ হাসানাহর গুরুত্ব:</div><p>কুরআন মাজিদে মহান আল্লাহ দাওয়াতের ক্ষেত্রে <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">مُجَادَلَةُ بِالْأَحْسَنِ</span> তথা উত্তম পন্থায় বিতর্ক করার নির্দেশ দিয়েছেন। তিনি বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ</div></div><p>অর্থাৎ, তাদের সঙ্গে সর্বোত্তম পন্থায় বিতর্ক কর।</p><p>ইসলামী দাওয়াতের ক্ষেত্রে যুক্তিতর্কের মাধ্যমে মানুষকে সত্যের পথে আহ্বান জানাতে হলে বেশ কিছু মূলনীতি অনুসরণ করতে হয়। নিম্নে তা আলোচনা করা হলো—</p><p><b>১। সত্যকে বিজয়ী করাই হবে মূল লক্ষ্য:</b></p><p>দাওয়াতের কাজে একজন দাঈ সর্বাত্মকভাবে অর্থহীন বিতর্ক এড়িয়ে চলার চেষ্টা করবেন। অপ্রয়োজনীয় তর্ক-বিতর্কে সময় নষ্ট করবেন না। তবে বিশেষ প্রয়োজনে বিতর্কে অংশগ্রহণ করতে হলে উত্তম পদ্ধতি অবলম্বন করবেন। প্রতিপক্ষকে ব্যক্তিগতভাবে আঘাত না করে যুক্তি ও প্রমাণের মাধ্যমে নিজের বক্তব্য উপস্থাপন করবেন। এ ক্ষেত্রে তাঁর একমাত্র লক্ষ্য হবে সত্যকে প্রতিষ্ঠিত করা এবং মিথ্যার অসারতা তুলে ধরা।</p><p><b>২। পর্যাপ্ত জ্ঞান ও দলিল-প্রমাণ রাখা:</b></p><p>যে বিষয়ে বিতর্ক হবে, সে বিষয়ে দাঈর পর্যাপ্ত জ্ঞান থাকা আবশ্যক। কারণ বিষয়ভিত্তিক জ্ঞান না থাকলে প্রতিপক্ষের বিভিন্ন প্রশ্ন ও আপত্তির যথাযথ জবাব দেওয়া সম্ভব হয় না। পাশাপাশি নিজের বক্তব্যের সমর্থনে প্রয়োজনীয় তথ্য, যুক্তি ও নির্ভরযোগ্য দলিল-প্রমাণ প্রস্তুত রাখতে হবে। এতে দাঈর বক্তব্য শক্তিশালী, গ্রহণযোগ্য ও প্রভাবশালী হয়।</p><p><b>৩। প্রতিপক্ষের অবস্থার আলোকে পদক্ষেপ গ্রহণ:</b></p><p>আল্লাহ তায়ালা উত্তম পন্থায় বিতর্ক করার যে নির্দেশ দিয়েছেন, তার অন্যতম তাৎপর্য হলো প্রতিপক্ষের অবস্থা বুঝে উপযুক্ত পদ্ধতি অবলম্বন করা। বিতর্কের সময় প্রতিপক্ষের জ্ঞান, মর্যাদা, চিন্তাভাবনা, প্রজ্ঞা ও দক্ষতা বিবেচনা করে তার উপযোগী ভাষা ও যুক্তি উপস্থাপন করতে হবে। কারণ সবার বুদ্ধিমত্তা, জ্ঞান ও উপলব্ধির ক্ষমতা এক নয়। তাই সবার ক্ষেত্রে একই যুক্তি ও বক্তব্য গ্রহণযোগ্য হয় না। এ জন্য একজন দাঈকে পরিস্থিতি অনুযায়ী কৌশল ও পদ্ধতি পরিবর্তন করতে হবে।</p><p><b>৪। ইসলামসম্মত বৈচিত্র্য আনয়ন:</b></p><p>বিতর্ককে মনোগ্রাহী, গ্রহণযোগ্য ও সর্বসাধারণের কাছে মর্মস্পর্শী করে তোলার জন্য এতে ইসলামসম্মত বিভিন্ন বৈচিত্র্য আনয়ন করা আবশ্যক। একই ধরনের বক্তব্য ও উপস্থাপনা সব শ্রেণির মানুষের কাছে সমানভাবে গ্রহণযোগ্য হয় না। তাই পরিস্থিতি ও শ্রোতাদের উপযোগী ভাষা, যুক্তি ও উপস্থাপনার বৈচিত্র্য অবলম্বন করতে হবে। এতে বিতর্ক সফল হবে এবং কাঙ্ক্ষিত উদ্দেশ্য সাধন সম্ভব হবে।</p><p><b>৫। বিষয়বিরোধী কথা ও কাজ বর্জন করা:</b></p><p>দাঈর অন্যতম কর্তব্য হলো, তিনি যে বিষয়টি প্রতিষ্ঠার জন্য বিতর্ক করবেন, বাস্তব জীবনেও সে বিষয়ের বিরোধী কোনো কথা বা কাজে অংশগ্রহণ করবেন না। কারণ দাঈ নিজেই যদি নিজের বক্তব্যের বিপরীত কাজ করেন, তাহলে প্রতিপক্ষ সহজেই তাঁর আচরণকে প্রমাণ হিসেবে উপস্থাপন করে তাঁকে অপদস্থ করতে পারে। তাই দাঈর কথা ও কাজের মধ্যে সামঞ্জস্য থাকা জরুরি।</p><p><b>৬। আন্তরিকতা বজায় রেখে বিতর্ক করা:</b></p><p>বিতর্কের ক্ষেত্রে উত্তম পন্থা অবলম্বনের অন্যতম শর্ত হলো আন্তরিকতা বজায় রাখা। বিতর্ক যেন কখনো ঝগড়া বা ব্যক্তিগত বিরোধে পরিণত না হয়। যুক্তিতর্কের মাধ্যমে প্রতিপক্ষকে বোঝানোর চেষ্টা করতে হবে। প্রতিপক্ষ যেন অনুভব করতে পারে যে, দাঈ তার প্রতি গভীর মমতা ও আন্তরিকতা পোষণ করেন এবং তাকে সঠিক পথে ফিরিয়ে আনার উদ্দেশ্যেই যুক্তি ও প্রমাণ উপস্থাপন করছেন।</p><p><b>৭। অপ্রাসঙ্গিক বিষয়ে বিতর্ক না করা:</b></p><p>বিতর্কের মূল বিষয় বাদ দিয়ে অপ্রাসঙ্গিক বিষয়ে জড়িয়ে পড়া দাঈর জন্য সমীচীন নয়। বরং যে বিষয় নিয়ে বিতর্ক হচ্ছে, সে বিষয়ের মধ্যেই আলোচনা সীমাবদ্ধ রাখা উচিত। অপ্রয়োজনীয় প্রসঙ্গ এড়িয়ে মূল বিষয়ের ওপর গুরুত্ব দিলে বিতর্ক সহজে সমাধানের দিকে এগিয়ে যায় এবং কাঙ্ক্ষিত লক্ষ্য অর্জন করা সম্ভব হয়।</p><p><b>৮। চরমপন্থা পরিহার করা:</b></p><p>দাঈ বিতর্কের ক্ষেত্রে অতিরিক্ত কঠোর বা চরমপন্থী বক্তব্য দেবেন না। আবার প্রয়োজনের তুলনায় অতিরিক্ত নমনীয়তাও অবলম্বন করবেন না। বরং পরিস্থিতি, বিষয়বস্তু ও প্রতিপক্ষের অবস্থা বিবেচনা করে যথাযথ বক্তব্য উপস্থাপন করবেন। সব ক্ষেত্রে চরমপন্থা পরিহার করে মধ্যমপন্থা অবলম্বন করাই একজন দাঈর জন্য শ্রেয়।</p><div class=\"h\">উপসংহার:</div><p>ইসলামী দাওয়াহ প্রদানের ক্ষেত্রে একই কৌশল ও উপস্থাপনা সব জায়গায় সমানভাবে কার্যকর হয় না। তাই স্থান, কাল ও পাত্রভেদে ইসলামী দাওয়াহ উপস্থাপন করতে হবে। এক্ষেত্রে উল্লিখিত পদ্ধতিসমূহ অনুসরণ করলে দাওয়াতের সফলতা ও কার্যকারিতা বৃদ্ধি পাবে। কেননা ইসলামী দাওয়াহ উপস্থাপনার ওপর দাওয়াতের সফলতা অনেকাংশে নির্ভর করে। অতএব, আমাদের উচিত উল্লিখিত পদ্ধতিসমূহ অনুসরণ করে স্থান, কাল ও পাত্রভেদে দাওয়াহ উপস্থাপন করা।</p>"], ["উসওয়াতুন হাসানাহ (القدوة الحسنة) বলতে কী বুঝ? ইসলামী দাওয়াহর ক্ষেত্রে এর গুরুত্ব বর্ণনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম শুধু কথার মাধ্যমে প্রচারের ধর্ম নয়; বরং বাস্তব জীবনে ইসলামের শিক্ষা ও আদর্শের প্রতিফলন ঘটানোও ইসলামী দাওয়াহর অন্যতম গুরুত্বপূর্ণ মাধ্যম। মানুষ অনেক সময় বক্তৃতা ও উপদেশের চেয়ে একজন আদর্শবান মানুষের বাস্তব জীবন থেকে বেশি প্রভাবিত হয়। তাই ইসলামী দাওয়াহর ক্ষেত্রে উসওয়াতুন হাসানাহ বা উত্তম আদর্শের গুরুত্ব অপরিসীম। একজন দায়ী যখন নিজের কথা, কাজ, চরিত্র ও আচরণের মাধ্যমে ইসলামের শিক্ষা বাস্তবায়ন করেন, তখন তাঁর জীবনই অন্যদের জন্য দাওয়াহর মাধ্যম হয়ে ওঠে।</p><div class=\"h\">উসওয়াতুন হাসানাহর পরিচয় ও অর্থ</div><p><b>১। আভিধানিক অর্থ:</b></p><p>উসওয়াহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أُسْوَةٌ</span>) শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">أَسَا</span> ধাতু থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> আদর্শ।</p><p style=\"padding-left:4px\"><b>২।</b> অনুসরণীয় ব্যক্তি।</p><p style=\"padding-left:4px\"><b>৩।</b> অনুকরণীয় দৃষ্টান্ত।</p><p style=\"padding-left:4px\"><b>৪।</b> নমুনা।</p><p style=\"padding-left:4px\"><b>৫।</b> অনুসরণযোগ্য পদ্ধতি।</p><p>আর হাসানাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">حَسَنَةٌ</span>) শব্দের অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সুন্দর।</p><p style=\"padding-left:4px\"><b>২।</b> উত্তম।</p><p style=\"padding-left:4px\"><b>৩।</b> ভালো।</p><p style=\"padding-left:4px\"><b>৪।</b> কল্যাণকর।</p><p>সুতরাং উসওয়াতুন হাসানাহ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْأُسْوَةُ الْحَسَنَةُ</span>) অর্থ হলো উত্তম আদর্শ, সুন্দর দৃষ্টান্ত বা অনুসরণীয় নমুনা।</p><p><b>২। পারিভাষিক সংজ্ঞা:</b></p><p>ক. ইমাম রাগিব আল-ইসফাহানী (রহ.) বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْأُسْوَةُ وَالْإِسْوَةُ كَالْقِدْوَةِ، وَهِيَ الْحَالَةُ الَّتِي يَكُونُ الْإِنْسَانُ عَلَيْهَا فِي اتِّبَاعِ غَيْرِهِ</div></div><p>অর্থ: উসওয়াহ হলো এমন অবস্থা, যেখানে মানুষ অন্য কোনো ব্যক্তির আদর্শ ও আচরণ অনুসরণ করে।</p><p>খ. ইমাম ইবনে কাসীর (রহ.) বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">هَذِهِ الْآيَةُ أَصْلٌ كَبِيرٌ فِي التَّأَسِّي بِرَسُولِ اللَّهِ ﷺ فِي أَقْوَالِهِ وَأَفْعَالِهِ وَأَحْوَالِهِ</div></div><p>অর্থ: এ আয়াত রাসূলুল্লাহ (সা.)-এর কথা, কাজ ও সামগ্রিক জীবনাচরণ অনুসরণের একটি গুরুত্বপূর্ণ ভিত্তি।</p><p>গ. ইমাম কুরতুবী (রহ.)-এর বাংলা ব্যাখ্যা:</p><p>উসওয়াহ হলো এমন আদর্শ, যার অনুসরণ ও অনুকরণ করা হয়।</p><p><b>সারকথা:</b> রাসূলুল্লাহ (সা.)-এর কথা, কাজ, চরিত্র ও জীবনাদর্শ অনুসরণ করে নিজের জীবনকে অন্যদের জন্য অনুকরণীয় দৃষ্টান্ত হিসেবে গড়ে তোলাই উসওয়াতুন হাসানাহ।</p><div class=\"h\">কুরআনের আলোকে উসওয়াতুন হাসানাহ</div><p>পবিত্র কুরআনে আল্লাহ তায়ালা রাসূলুল্লাহ (সা.)-এর জীবনকে সমগ্র মুসলিম উম্মাহর জন্য উত্তম আদর্শ হিসেবে ঘোষণা করেছেন। তিনি বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِّمَنْ كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا</div></div><p>অর্থ: নিশ্চয়ই তোমাদের জন্য আল্লাহর রাসূলের মধ্যে রয়েছে উত্তম আদর্শ; যারা আল্লাহ ও পরকালের আশা রাখে এবং অধিক পরিমাণে আল্লাহকে স্মরণ করে, তাদের জন্য।</p><div class=\"rf\">সূরা আল-আহযাব, আয়াত: ২১</div><p>এ আয়াত থেকে প্রমাণিত হয় যে, রাসূলুল্লাহ (সা.)-এর জীবন, চরিত্র, আচরণ ও কর্মপদ্ধতি মুসলমানদের জন্য অনুসরণীয় আদর্শ।</p><p>আল্লাহ তায়ালা আরও বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ</div></div><p>অর্থ: নিশ্চয়ই আপনি মহান চরিত্রের অধিকারী।</p><div class=\"rf\">সূরা আল-কলম, আয়াত: ৪</div><p>এ আয়াত রাসূলুল্লাহ (সা.)-এর মহান চরিত্রের প্রমাণ বহন করে। তাঁর চরিত্র ও জীবনাদর্শ অনুসরণ করা ইসলামী দাওয়াহর অন্যতম ভিত্তি।</p><div class=\"h\">ইসলামী দাওয়াহর ক্ষেত্রে উসওয়াতুন হাসানাহর গুরুত্ব</div><p>ইসলামী দাওয়াহর ক্ষেত্রে উসওয়াতুন হাসানাহর গুরুত্ব অপরিসীম। নিম্নে এর কয়েকটি গুরুত্বপূর্ণ দিক আলোচনা করা হলো—</p><p><b>১। দাওয়াহকে বাস্তব ও কার্যকর করা:</b></p><p>উসওয়াতুন হাসানাহর মাধ্যমে ইসলামের শিক্ষা শুধু কথার মধ্যে সীমাবদ্ধ থাকে না; বরং বাস্তব জীবনে প্রতিফলিত হয়। একজন দায়ী যখন নিজের জীবনে ইসলামের বিধান মেনে চলেন, তখন তাঁর দাওয়াহ অধিক কার্যকর ও গ্রহণযোগ্য হয়।</p><p><b>২। মানুষের আস্থা ও বিশ্বাস অর্জন:</b></p><p>সৎ, বিশ্বস্ত ও আদর্শবান ব্যক্তির কথা মানুষ সহজে বিশ্বাস করে। একজন দায়ীর কথা ও কাজের মধ্যে মিল থাকলে মানুষের মনে তাঁর প্রতি আস্থা সৃষ্টি হয়। ফলে তারা তাঁর দাওয়াত গ্রহণে আগ্রহী হয়।</p><p><b>৩। রাসূলুল্লাহ (সা.)-এর আদর্শ অনুসরণ:</b></p><p>রাসূলুল্লাহ (সা.) ছিলেন সমগ্র মানবজাতির জন্য সর্বোত্তম আদর্শ। তাঁর ইবাদত, লেনদেন, পারিবারিক জীবন, সামাজিক আচরণ ও দাওয়াতি কার্যক্রম অনুসরণ করার মাধ্যমে একজন দায়ী প্রকৃত ইসলামী আদর্শের অধিকারী হতে পারেন।</p><p><b>৪। উত্তম চরিত্র গঠনে সহায়তা:</b></p><p>উসওয়াতুন হাসানাহ মানুষকে সত্যবাদিতা, আমানতদারি, ধৈর্য, ক্ষমাশীলতা, বিনয়, দয়া ও ন্যায়পরায়ণতার শিক্ষা দেয়। ফলে ব্যক্তি নিজের চরিত্র উন্নত করতে পারে এবং সমাজে নৈতিকতার প্রসার ঘটে।</p><p><b>৫। অমুসলিমদের কাছে ইসলামের সৌন্দর্য তুলে ধরা:</b></p><p>একজন মুসলমানের উত্তম আচরণ ও মানবিক গুণাবলি অমুসলিমদের কাছেও ইসলামের সৌন্দর্য প্রকাশ করে। অনেক সময় একজন মুসলমানের সততা, ন্যায়পরায়ণতা ও মানবিক আচরণ অন্যদের ইসলামের প্রতি আকৃষ্ট করে।</p><p><b>৬। কথা ও কাজের মধ্যে সামঞ্জস্য সৃষ্টি:</b></p><p>ইসলামী দাওয়াহর ক্ষেত্রে কথা ও কাজের মধ্যে মিল থাকা অত্যন্ত জরুরি। একজন দায়ী যদি মানুষকে যে কাজের উপদেশ দেন, নিজে তা পালন না করেন, তাহলে তাঁর দাওয়াতের প্রভাব কমে যায়। তাই নিজের জীবনে ইসলামের শিক্ষা বাস্তবায়ন করা অপরিহার্য।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ ۝ كَبُرَ مَقْتًا عِنْدَ اللَّهِ أَنْ تَقُولُوا مَا لَا تَفْعَلُونَ</div></div><p>অর্থ: হে মুমিনগণ! তোমরা এমন কথা কেন বলো, যা তোমরা নিজেরা করো না? তোমরা যা করো না, তা বলা আল্লাহর কাছে অত্যন্ত অসন্তোষজনক।</p><div class=\"rf\">সূরা আস-সাফ, আয়াত: ২–৩</div><p><b>৭। মানুষের মধ্যে ভালো কাজের অনুপ্রেরণা সৃষ্টি:</b></p><p>আদর্শবান ব্যক্তির জীবন অন্যদের জন্য অনুপ্রেরণার উৎস। তাঁর ইবাদত, পরোপকার, দানশীলতা ও উত্তম আচরণ দেখে মানুষও ভালো কাজ করতে উৎসাহিত হয়। এভাবে সমাজে সৎকর্মের প্রসার ঘটে।</p><p><b>৮। সামাজিক শান্তি ও সম্প্রীতি প্রতিষ্ঠা:</b></p><p>উসওয়াতুন হাসানাহ মানুষকে সহনশীলতা, পারস্পরিক সম্মান, ক্ষমা ও সহমর্মিতার শিক্ষা দেয়। একজন দায়ী নিজের আচরণের মাধ্যমে এসব গুণের দৃষ্টান্ত স্থাপন করলে সমাজে শান্তি, শৃঙ্খলা ও সম্প্রীতি প্রতিষ্ঠিত হয়।</p><p><b>৯। দাওয়াহর স্থায়ী প্রভাব সৃষ্টি:</b></p><p>কথার প্রভাব অনেক সময় সাময়িক হয়; কিন্তু একজন আদর্শবান ব্যক্তির বাস্তব জীবন মানুষের মনে দীর্ঘস্থায়ী প্রভাব সৃষ্টি করে। তাঁর চরিত্র ও কর্মপদ্ধতি অনুসরণ করে পরবর্তী প্রজন্মও ইসলামের শিক্ষা গ্রহণ করতে পারে।</p><p><b>১০। দায়ীর গ্রহণযোগ্যতা বৃদ্ধি:</b></p><p>একজন দায়ীর সততা, নিষ্ঠা, আমানতদারি ও উত্তম চরিত্র তাঁর সামাজিক গ্রহণযোগ্যতা বৃদ্ধি করে। ফলে সমাজের বিভিন্ন শ্রেণি-পেশার মানুষ তাঁর কথা শুনতে এবং ইসলামের শিক্ষা গ্রহণ করতে আগ্রহী হয়।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, উসওয়াতুন হাসানাহ ইসলামী দাওয়াহর অন্যতম গুরুত্বপূর্ণ মাধ্যম। রাসূলুল্লাহ (সা.)-এর জীবন ও চরিত্রই এর সর্বোত্তম দৃষ্টান্ত। একজন দায়ীকে শুধু কথার মাধ্যমে নয়, বরং নিজের জীবন, চরিত্র ও আচরণের মাধ্যমে ইসলামের শিক্ষা তুলে ধরতে হবে। তাই ইসলামী দাওয়াহকে কার্যকর ও ফলপ্রসূ করতে প্রত্যেক দায়ীর জন্য উসওয়াতুন হাসানাহ অবলম্বন করা অপরিহার্য।</p>"], ["জিহাদের পরিচয় দাও। জিহাদ ও সন্ত্রাসের মধ্যে পার্থক্য কী? দাওয়াহর ক্ষেত্রে জিহাদের গুরুত্ব আলোচনা কর।", "<div class=\"h\">উপস্থাপনা:</div><p>ইসলাম শান্তি, ন্যায়বিচার ও মানবকল্যাণের ধর্ম। ইসলামের শিক্ষা ও আদর্শ প্রতিষ্ঠা এবং মানুষের কাছে সত্যের বাণী পৌঁছে দেওয়ার জন্য সর্বাত্মক প্রচেষ্টা চালানোকে জিহাদ বলা হয়। জিহাদ শুধু যুদ্ধ বা অস্ত্রধারণের মধ্যে সীমাবদ্ধ নয়; বরং নিজের প্রবৃত্তির বিরুদ্ধে সংগ্রাম, জ্ঞানচর্চা, সত্য প্রচার, অন্যায় প্রতিরোধ এবং আল্লাহর সন্তুষ্টির জন্য বৈধ পথে সর্বোচ্চ চেষ্টা করাও জিহাদের অন্তর্ভুক্ত। অন্যদিকে নিরপরাধ মানুষকে হত্যা, ভয়ভীতি প্রদর্শন ও বিশৃঙ্খলা সৃষ্টি করা সন্ত্রাস। তাই ইসলামী দাওয়াহর ক্ষেত্রে জিহাদের প্রকৃত পরিচয় ও সন্ত্রাসের সঙ্গে এর পার্থক্য জানা অত্যন্ত জরুরি।</p><div class=\"h\">জিহাদের পরিচয় ও অর্থ</div><p><b>১। আভিধানিক অর্থ:</b></p><p>জিহাদ (<span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">الْجِهَادُ</span>) শব্দটি <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">جَهْدٌ</span> বা <span dir=\"rtl\" lang=\"ar\" style=\"font-family:'MuhammadiQ','Amiri',serif;font-size:1.15em\">جُهْدٌ</span> ধাতু থেকে নির্গত। এর আভিধানিক অর্থ হলো—</p><p style=\"padding-left:4px\"><b>১।</b> সর্বাত্মক চেষ্টা করা।</p><p style=\"padding-left:4px\"><b>২।</b> কঠোর পরিশ্রম করা।</p><p>৩। সাধ্যানুযায়ী প্রচেষ্টা চালানো।</p><p style=\"padding-left:4px\"><b>৪।</b> কষ্ট ও বাধা অতিক্রম করা।</p><p style=\"padding-left:4px\"><b>৫।</b> সংগ্রাম ও সাধনা করা।</p><p>৬। নিজের সামর্থ্য ও শক্তি ব্যয় করা।</p><p>সুতরাং জিহাদের আভিধানিক অর্থ হলো কোনো উদ্দেশ্য অর্জনের জন্য সর্বশক্তি ও সামর্থ্য দিয়ে চেষ্টা-সাধনা করা।</p><p><b>২। পারিভাষিক সংজ্ঞা:</b></p><p>ক. ইমাম ইবনে আসীর (রহ.)-এর ব্যাখ্যা অনুযায়ী—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْجِهَادُ مُحَارَبَةُ الْأَعْدَاءِ، وَهُوَ الْمُبَالَغَةُ وَاسْتِفْرَاغُ مَا فِي الْوُسْعِ وَالطَّاقَةِ مِنْ قَوْلٍ أَوْ فِعْلٍ</div></div><p>অর্থ: জিহাদ হলো শত্রুর মোকাবিলা করা এবং কথা বা কাজের মাধ্যমে নিজের সামর্থ্য ও শক্তির সর্বোচ্চ প্রচেষ্টা ব্যয় করা।</p><p>খ. ফকিহদের পরিভাষায়—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قِتَالُ مُسْلِمٍ كَافِرًا غَيْرَ ذِي عَهْدٍ لِإِعْلَاءِ كَلِمَةِ اللَّهِ</div></div><p>অর্থ: আল্লাহর বাণী সমুন্নত করার উদ্দেশ্যে চুক্তিবদ্ধ নয় এমন শত্রুর বিরুদ্ধে মুসলমানের যুদ্ধ করাকে জিহাদ বলা হয়।</p><p>গ. ইমাম ইবনে কুদামা (রহ.) বলেছেন—</p><p>জিহাদ হলো আল্লাহর সন্তুষ্টি অর্জন এবং তাঁর দ্বীনকে সমুন্নত রাখার উদ্দেশ্যে সর্বোচ্চ সামর্থ্য ও শক্তি ব্যয় করে প্রচেষ্টা চালানো।</p><p><b>সারকথা:</b> আল্লাহর সন্তুষ্টি অর্জন, সত্য প্রতিষ্ঠা, অন্যায় প্রতিরোধ এবং ইসলামের কল্যাণকর শিক্ষা প্রচারের জন্য নিজের সামর্থ্য অনুযায়ী সর্বাত্মক প্রচেষ্টা চালানোই জিহাদ।</p><div class=\"h\">কুরআনের আলোকে জিহাদের গুরুত্ব</div><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ</div></div><p>অর্থ: আর যারা আমার পথে সর্বাত্মক প্রচেষ্টা চালায়, আমি অবশ্যই তাদের আমার পথসমূহের দিশা দেব। নিশ্চয়ই আল্লাহ সৎকর্মশীলদের সঙ্গে আছেন।</p><div class=\"rf\">সূরা আল-আনকাবুত, আয়াত: ৬৯</div><p>এ আয়াত থেকে বোঝা যায়, আল্লাহর সন্তুষ্টির জন্য আন্তরিক প্রচেষ্টা চালানো মুমিনের গুরুত্বপূর্ণ দায়িত্ব।</p><div class=\"h\">জিহাদ ও সন্ত্রাসের মধ্যে পার্থক্য</div><p>জিহাদ ও সন্ত্রাস সম্পূর্ণ ভিন্ন দুটি বিষয়। জিহাদের উদ্দেশ্য হলো ন্যায় ও কল্যাণ প্রতিষ্ঠা করা; আর সন্ত্রাসের মাধ্যমে মানুষের মধ্যে ভয়, আতঙ্ক ও বিশৃঙ্খলা সৃষ্টি করা হয়। নিম্নে এদের পার্থক্য তুলে ধরা হলো—</p><p><b>১। উদ্দেশ্যের দিক থেকে:</b> জিহাদের উদ্দেশ্য আল্লাহর সন্তুষ্টি, সত্য প্রতিষ্ঠা ও অন্যায় প্রতিরোধ। পক্ষান্তরে সন্ত্রাসের উদ্দেশ্য ভয়ভীতি সৃষ্টি, ধ্বংসযজ্ঞ ও নিজেদের অবৈধ স্বার্থ হাসিল করা।</p><p><b>২। পদ্ধতির দিক থেকে:</b> জিহাদ পরিচালিত হয় ইসলামী নীতিমালা ও ন্যায়সংগত পদ্ধতিতে। অন্যদিকে সন্ত্রাসে অন্যায়, জুলুম, হত্যা ও সহিংসতার আশ্রয় নেওয়া হয়।</p><p><b>৩। নিরপরাধ মানুষের নিরাপত্তা:</b> জিহাদে নিরপরাধ নারী, শিশু ও সাধারণ মানুষের জীবন ও সম্পদের নিরাপত্তা রক্ষা করা অপরিহার্য। কিন্তু সন্ত্রাসে নিরপরাধ মানুষও হামলার শিকার হয়।</p><p><b>৪। সীমা ও নিয়মের দিক থেকে:</b> জিহাদে শরিয়তের নির্ধারিত সীমা অতিক্রম করা নিষিদ্ধ। সন্ত্রাসে কোনো নৈতিক বা আইনগত সীমার তোয়াক্কা করা হয় না।</p><p><b>৫। কর্তৃত্বের দিক থেকে:</b> সশস্ত্র জিহাদ ব্যক্তিগত বা কোনো অননুমোদিত গোষ্ঠীর খেয়ালখুশিমতো পরিচালিত হয় না; এর জন্য বৈধ কর্তৃত্ব ও শরিয়তসম্মত বিধান প্রযোজ্য। সন্ত্রাসী কর্মকাণ্ড সাধারণত ব্যক্তি বা গোষ্ঠীর বেআইনি উদ্যোগে সংঘটিত হয়।</p><p><b>৬। ফলাফলের দিক থেকে:</b> জিহাদের ন্যায়সংগত উদ্দেশ্য হলো নিরাপত্তা, ন্যায়বিচার ও মানবকল্যাণ প্রতিষ্ঠা করা। সন্ত্রাসের ফল হলো প্রাণহানি, আতঙ্ক, অশান্তি ও সামাজিক বিপর্যয়।</p><p>আল্লাহ তায়ালা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَعْتَدُوا إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ</div></div><p>অর্থ: তোমরা সীমালঙ্ঘন করো না। নিশ্চয়ই আল্লাহ সীমালঙ্ঘনকারীদের ভালোবাসেন না।</p><div class=\"rf\">সূরা আল-বাকারা, আয়াত: ১৯০</div><div class=\"h\">দাওয়াহর ক্ষেত্রে জিহাদের গুরুত্ব</div><p>ইসলামী দাওয়াহর ক্ষেত্রে জিহাদের গুরুত্ব
