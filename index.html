বাণী প্রদান</div><p>মানুষকে সৎকর্মের পুরস্কারের সুসংবাদ এবং অসৎকর্মের পরিণতি সম্পর্কে সতর্ক করার জন্য রাসূলগণ প্রেরিত হয়েছেন। আল্লাহ তাআলা বলেন—</p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>رُسُلًا مُبَشِّرِينَ وَمُنْذِرِينَ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَى اللَّهِ حُجَّةٌ بَعْدَ الرُّسُلِ.</div></div><p>অর্থ: রাসূলগণকে সুসংবাদদাতা ও সতর্ককারী হিসেবে পাঠানো হয়েছে, যাতে রাসূলদের আগমনের পর আল্লাহর বিরুদ্ধে মানুষের কোনো অভিযোগ না থাকে। (সূরা আন-নিসা: ১৬৫)</p><div class='h hs hs2'>৬। মানবজাতির জন্য আদর্শ স্থাপন</div><p>নবী-রাসূলগণ তাঁদের কথা, কাজ, চরিত্র ও জীবনাচরণের মাধ্যমে মানুষের সামনে বাস্তব আদর্শ উপস্থাপন করেছেন। তাঁদের অনুসরণের মাধ্যমে মানুষ সুন্দর ও সুশৃঙ্খল জীবন গঠন করতে পারে।</p><div class='h hs hs2'>৭। মানবজাতিকে পবিত্র ও পরিশুদ্ধ করা</div><p>মানুষের অন্তরকে শিরক, কুফর, হিংসা, অহংকার ও অন্যান্য নৈতিক অবক্ষয় থেকে পবিত্র করা নবী-রাসূলদের অন্যতম দায়িত্ব। তাঁরা মানুষকে আত্মশুদ্ধি ও উত্তম চরিত্রের শিক্ষা দিয়েছেন।</p><div class='h hs hs2'>৮। মানবজাতির মধ্যে ন্যায়বিচার প্রতিষ্ঠা</div><p>সমাজে অন্যায়, অবিচার, জুলুম ও বৈষম্য দূর করে ন্যায়বিচার প্রতিষ্ঠার জন্য নবী-রাসূলগণ প্রেরিত হয়েছেন। তাঁরা আল্লাহর বিধান অনুযায়ী মানুষের অধিকার ও কর্তব্য নির্ধারণ করেছেন।</p><div class='h hs hs2'>৯। মানুষের মতবিরোধের সমাধান করা</div><p>মানুষের মধ্যে ধর্মীয়, সামাজিক ও নৈতিক বিষয়ে মতবিরোধ সৃষ্টি হলে নবী-রাসূলগণ আল্লাহর নির্দেশনা অনুযায়ী তার সমাধান করেছেন এবং মানুষকে ঐক্য ও ভ্রাতৃত্বের শিক্ষা দিয়েছেন।</p><div class='h hs hs2'>১০। পরকাল সম্পর্কে অবহিত করা</div><p>মানুষের মৃত্যুর পর পুনরুত্থান, হিসাব-নিকাশ, জান্নাত ও জাহান্নাম সম্পর্কে অবহিত করার জন্য নবী-রাসূলগণ প্রেরিত হয়েছেন। তাঁরা মানুষকে পরকালের প্রস্তুতি গ্রহণের শিক্ষা দিয়েছেন।</p><div class='h hm'>প্রমাণ কর যে, হজরত মুহাম্মদ (সা.) সর্বশেষ নবী</div><p>হজরত মুহাম্মদ (সা.) আল্লাহ তাআলার প্রেরিত সর্বশেষ নবী ও রাসূল। তাঁর আগমনের মাধ্যমে নবুওয়াতের ধারার পরিসমাপ্তি ঘটেছে। তাঁর পরে কিয়ামত পর্যন্ত আর কোনো নবী বা রাসূল আগমন করবেন না। কুরআন, হাদিস ও ইসলামের অকাট্য দলিলের মাধ্যমে বিষয়টি প্রমাণিত।</p><div class='h hs hs2'>১। কুরআনের সুস্পষ্ট ঘোষণা</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>مَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِنْ رِجَالِكُمْ وَلَكِنْ رَسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ وَكَانَ اللَّهُ بِكُلِّ شَيْءٍ عَلِيمًا.</div></div><p>অর্থ: মুহাম্মদ তোমাদের কোনো পুরুষের পিতা নন; বরং তিনি আল্লাহর রাসূল এবং সর্বশেষ নবী। আর আল্লাহ সর্ববিষয়ে সর্বজ্ঞ। (সূরা আল-আহযাব: ৪০)</p><p>এ আয়াতে خَاتَمَ النَّبِيِّينَ শব্দের মাধ্যমে আল্লাহ তাআলা স্পষ্টভাবে ঘোষণা করেছেন যে, মুহাম্মদ (সা.) সর্বশেষ নবী। তাঁর পরে আর কোনো নবী আসবেন না।</p><div class='h hs hs2'>২। রাসূল (সা.)-এর হাদিস দ্বারা প্রমাণ</div><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>أَنَا خَاتَمُ النَّبِيِّينَ، لَا نَبِيَّ بَعْدِي.</div></div><p>অর্থ: আমিই সর্বশেষ নবী, আমার পরে আর কোনো নবী নেই। (সহিহ মুসলিম)</p><p>এ হাদিসে রাসূলুল্লাহ (সা.) নিজেই তাঁর সর্বশেষ নবী হওয়ার বিষয়টি সুস্পষ্টভাবে ঘোষণা করেছেন।</p><div class='h hs hs2'>৩। দ্বীনকে পরিপূর্ণ ঘোষণা</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا.</div></div><p>অর্থ: আজ আমি তোমাদের জন্য তোমাদের দ্বীনকে পূর্ণাঙ্গ করে দিলাম, তোমাদের ওপর আমার নিয়ামত সম্পূর্ণ করলাম এবং ইসলামকে তোমাদের জন্য দ্বীন হিসেবে মনোনীত করলাম। (সূরা আল-মায়িদাহ: ৩)</p><p>এ আয়াত দ্বারা প্রমাণিত হয় যে, রাসূলুল্লাহ (সা.)-এর মাধ্যমে ইসলামকে পূর্ণাঙ্গ জীবনব্যবস্থা হিসেবে প্রতিষ্ঠিত করা হয়েছে। তাই নতুন কোনো নবী বা নতুন শরিয়তের প্রয়োজন নেই।</p><div class='h hs hs2'>৪। পূর্ববর্তী নবীদের ধারার সমাপ্তি</div><p class='bh'><b>রাসূলুল্লাহ (সা.) নিজেকে পূর্ববর্তী নবীদের নির্মিত প্রাসাদের সর্বশেষ ইটের সঙ্গে তুলনা করেছেন। তিনি বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>فَأَنَا اللَّبِنَةُ، وَأَنَا خَاتَمُ النَّبِيِّينَ.</div></div><p>অর্থ: আমিই সেই শেষ ইট এবং আমিই সর্বশেষ নবী। (সহিহ বুখারি ও সহিহ মুসলিম)</p><p>এ হাদিস দ্বারা বোঝা যায়, পূর্ববর্তী নবীদের মাধ্যমে যে নবুওয়াতের প্রাসাদ নির্মিত হয়েছিল, মুহাম্মদ (সা.)-এর মাধ্যমে তা পূর্ণতা লাভ করেছে।</p><div class='h hs hs2'>৫। তাঁর রিসালাত সমগ্র মানবজাতির জন্য</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا.</div></div><p>অর্থ: আমি আপনাকে সমগ্র মানবজাতির জন্য সুসংবাদদাতা ও সতর্ককারী হিসেবে প্রেরণ করেছি। (সূরা সাবা: ২৮)</p><p>পূর্ববর্তী অনেক নবী নির্দিষ্ট জাতি বা সম্প্রদায়ের কাছে প্রেরিত হয়েছিলেন। কিন্তু মুহাম্মদ (সা.) সমগ্র মানবজাতির জন্য প্রেরিত হয়েছেন। তাঁর রিসালাত কিয়ামত পর্যন্ত কার্যকর থাকবে।</p><div class='h hm'>প্রমাণ কর যে, হজরত মুহাম্মদ (সা.) সর্বশ্রেষ্ঠ নবী</div><p>হজরত মুহাম্মদ (সা.) শুধু সর্বশেষ নবীই নন; বরং তিনি মর্যাদা, সম্মান, চারিত্রিক উৎকর্ষ, রিসালাতের ব্যাপকতা এবং মানবজাতির প্রতি অবদানের দিক থেকেও সর্বশ্রেষ্ঠ নবী ও রাসূল। কুরআন ও হাদিসের আলোকে তাঁর শ্রেষ্ঠত্ব নিম্নরূপ—</p><div class='h hs hs2'>১। তিনি সমগ্র সৃষ্টির জন্য রহমত</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ.</div></div><p>অর্থ: আমি আপনাকে সমগ্র জগতের জন্য রহমত হিসেবেই প্রেরণ করেছি। (সূরা আল-আম্বিয়া: ১০৭)</p><p>এ আয়াত দ্বারা প্রমাণিত হয় যে, রাসূলুল্লাহ (সা.) সমগ্র জগতের জন্য রহমতস্বরূপ প্রেরিত হয়েছেন। এটি তাঁর শ্রেষ্ঠত্বের অন্যতম বড় প্রমাণ।</p><div class='h hs hs2'>২। তিনি সর্বোত্তম চরিত্রের অধিকারী</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ.</div></div><p>অর্থ: নিশ্চয়ই আপনি মহান চরিত্রের অধিকারী। (সূরা আল-কলম: ৪)</p><p>এ আয়াতে আল্লাহ তাআলা স্বয়ং রাসূলুল্লাহ (সা.)-এর মহান চরিত্রের প্রশংসা করেছেন। তাঁর সততা, ক্ষমাশীলতা, দয়া, ধৈর্য ও ন্যায়পরায়ণতা তাঁকে অনন্য মর্যাদায় অধিষ্ঠিত করেছে।</p><div class='h hs hs2'>৩। তিনি সমগ্র মানবজাতির জন্য আদর্শ</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ.</div></div><p>অর্থ: নিশ্চয়ই তোমাদের জন্য আল্লাহর রাসূলের মধ্যে রয়েছে উত্তম আদর্শ। (সূরা আল-আহযাব: ২১)</p><p>রাসূলুল্লাহ (সা.)-এর জীবন মানবজাতির জন্য সর্বোত্তম অনুসরণীয় আদর্শ। ব্যক্তিগত, পারিবারিক, সামাজিক, রাজনৈতিক ও রাষ্ট্রীয় জীবনের প্রতিটি ক্ষেত্রে তাঁর আদর্শ অনুসরণযোগ্য।</p><div class='h hs hs2'>৪। তিনি সর্বশেষ নবী ও রাসূল</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَلَكِنْ رَسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ.</div></div><p>অর্থ: বরং তিনি আল্লাহর রাসূল এবং সর্বশেষ নবী। (সূরা আল-আহযাব: ৪০)</p><p>নবুওয়াতের ধারার সর্বশেষ নবী হওয়া তাঁর বিশেষ মর্যাদা ও শ্রেষ্ঠত্বের অন্যতম নিদর্শন।</p><div class='h hs hs2'>৫। তিনি কিয়ামতের দিন আদমসন্তানের নেতা</div><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>أَنَا سَيِّدُ وَلَدِ آدَمَ يَوْمَ الْقِيَامَةِ وَلَا فَخْرَ.</div></div><p>অর্থ: কিয়ামতের দিন আমিই আদমসন্তানের নেতা হব, এতে কোনো অহংকার নেই। (সহিহ মুসলিম)</p><p>এ হাদিস দ্বারা প্রমাণিত হয় যে, কিয়ামতের দিন সমগ্র আদমসন্তানের মধ্যে রাসূলুল্লাহ (সা.) সর্বোচ্চ মর্যাদার অধিকারী হবেন।</p><div class='h hs hs2'>৬। তাঁকে মাকামে মাহমুদ দান করা হবে</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>عَسَىٰ أَنْ يَبْعَثَكَ رَبُّكَ مَقَامًا مَحْمُودًا.</div></div><p>অর্থ: আশা করা যায়, আপনার প্রতিপালক আপনাকে প্রশংসিত স্থানে অধিষ্ঠিত করবেন। (সূরা আল-ইসরা: ৭৯)</p><p>এ আয়াতে রাসূলুল্লাহ (সা.)-কে মাকামে মাহমুদ তথা প্রশংসিত মর্যাদায় অধিষ্ঠিত করার সুসংবাদ দেওয়া হয়েছে। হাদিসে এ মর্যাদাকে মহান শাফাআতের সঙ্গে ব্যাখ্যা করা হয়েছে।</p><div class='h hs hs2'>৭। তাঁকে সর্বজনীন ও পূর্ণাঙ্গ শরিয়ত প্রদান করা হয়েছে</div><p>আল্লাহ তাআলা ইসলামকে তাঁর মাধ্যমে পূর্ণাঙ্গ জীবনব্যবস্থা হিসেবে প্রতিষ্ঠিত করেছেন। তাঁর আনীত শরিয়ত কিয়ামত পর্যন্ত সমগ্র মানবজাতির জন্য প্রযোজ্য। ফলে তাঁর রিসালাতের ব্যাপকতা ও স্থায়িত্ব তাঁকে বিশেষ মর্যাদায় অধিষ্ঠিত করেছে।</p><div class='h hm'>উপসংহার</div><p>পরিশেষে বলা যায়, নবুওয়াত ও রিসালাত মানবজাতির হিদায়াতের জন্য আল্লাহ তাআলার এক মহান নিয়ামত। রাসূলগণ মানুষকে তাওহীদ, ঈমান, ন্যায়বিচার ও নৈতিকতার শিক্ষা দিয়েছেন। তাঁদের প্রেরণের মাধ্যমে আল্লাহ তাআলা মানুষের সামনে সত্যের পথ সুস্পষ্ট করেছেন। আর হজরত মুহাম্মদ (সা.) হলেন সেই নবী ও রাসূল, যাঁর মাধ্যমে নবুওয়াতের ধারার পরিসমাপ্তি ঘটেছে এবং ইসলাম পূর্ণাঙ্গ জীবনব্যবস্থা হিসেবে প্রতিষ্ঠিত হয়েছে। তিনি সর্বশেষ নবী, সর্বশ্রেষ্ঠ রাসূল এবং সমগ্র মানবজাতির জন্য উত্তম আদর্শ। তাই প্রত্যেক মুসলমানের কর্তব্য হলো তাঁর প্রতি পূর্ণ ঈমান রাখা, তাঁকে ভালোবাসা এবং তাঁর সুন্নাহ অনুসরণ করে জীবন পরিচালনা করা।</p>"], ["পাঁচ ওয়াক্ত সালাতের দলিলসহ পরিচয় দাও। ব্যক্তি ও সমাজজীবনে সালাতের প্রভাব বর্ণনাপূর্বক এর আধ্যাত্মিক গুরুত্ব লেখ।", "<div class='h hm'>ভূমিকা</div><p>ইসলামের পাঁচটি মৌলিক স্তম্ভের মধ্যে সালাত অন্যতম। ঈমানের পরই সালাতের স্থান। সালাত এমন একটি গুরুত্বপূর্ণ ইবাদত, যা বান্দার সঙ্গে আল্লাহ তাআলার সরাসরি সম্পর্ক স্থাপন করে। প্রতিদিন পাঁচ ওয়াক্ত সালাত আদায় করা প্রত্যেক প্রাপ্তবয়স্ক ও সুস্থ মস্তিষ্কসম্পন্ন মুসলমানের ওপর ফরজ। সালাত মানুষকে অশ্লীলতা ও অন্যায় কাজ থেকে বিরত রাখে এবং ব্যক্তিগত, পারিবারিক ও সামাজিক জীবনে শৃঙ্খলা, পবিত্রতা ও নৈতিকতা প্রতিষ্ঠা করে। নিম্নে পাঁচ ওয়াক্ত সালাতের পরিচয়, দলিল, ব্যক্তি ও সমাজজীবনে এর প্রভাব এবং আধ্যাত্মিক গুরুত্ব আলোচনা করা হলো।</p><div class='h hm'>সালাত (الصَّلَاةُ)-এর পরিচয়</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>صَلَاة শব্দটি আরবি। এটি صَلَّى ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الدُّعَاءُ — দোয়া বা প্রার্থনা করা।</p><p>২। الرَّحْمَةُ — রহমত বা দয়া।</p><p>৩। الِاسْتِغْفَارُ — ক্ষমা প্রার্থনা করা।</p><p>৪। التَّعْظِيمُ — সম্মান ও মর্যাদা প্রদান করা।</p><p>৫। التَّبْرِيكُ — বরকত কামনা করা।</p><p>ইংরেজি অর্থ: Prayer, Worship, Supplication.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>সালাতের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class='bh'><b>১। ইমাম আল-জুরজানি (র.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الصَّلَاةُ هِيَ عِبَادَةٌ مَخْصُوصَةٌ تَشْتَمِلُ عَلَى أَقْوَالٍ وَأَفْعَالٍ مَعْلُومَةٍ، مُفْتَتَحَةٌ بِالتَّكْبِيرِ وَمُخْتَتَمَةٌ بِالتَّسْلِيمِ.</div></div><p>অর্থ: সালাত হলো একটি বিশেষ ইবাদত, যা নির্দিষ্ট কিছু কথা ও কাজের সমন্বয়ে গঠিত। এটি তাকবিরের মাধ্যমে শুরু হয় এবং সালামের মাধ্যমে শেষ হয়।</p><p class='bh'><b>২। ইমাম ইবনে কুদামাহ (র.)-এর সংজ্ঞার মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الصَّلَاةُ هِيَ أَقْوَالٌ وَأَفْعَالٌ مَخْصُوصَةٌ، تَفْتَتِحُ بِالتَّكْبِيرِ وَتَخْتَتِمُ بِالتَّسْلِيمِ.</div></div><p>অর্থ: সালাত হলো নির্দিষ্ট কিছু কথা ও কাজ, যা তাকবিরের মাধ্যমে শুরু হয় এবং সালামের মাধ্যমে শেষ হয়।</p><div class='h hm'>পাঁচ ওয়াক্ত সালাত ফরজ হওয়ার দলিল</div><p>ইসলামে প্রতিদিন পাঁচ ওয়াক্ত সালাত আদায় করা ফরজ। কুরআন ও হাদিসে এর সুস্পষ্ট প্রমাণ রয়েছে।</p><div class='h hs hs2'>কুরআনের দলিল</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا.</div></div><p>অর্থ: নিশ্চয়ই সালাত মুমিনদের ওপর নির্ধারিত সময়ে ফরজ করা হয়েছে। (সূরা আন-নিসা: ১০৩)</p><p class='bh'><b>অন্যত্র আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَىٰ غَسَقِ اللَّيْلِ وَقُرْآنَ الْفَجْرِ.</div></div><p>অর্থ: সূর্য ঢলে পড়ার পর থেকে রাতের অন্ধকার পর্যন্ত সালাত কায়েম করুন এবং ফজরের কুরআন পাঠও। (সূরা আল-ইসরা: ৭৮)</p><div class='h hs hs2'>হাদিসের দলিল</div><p>হজরত আবদুল্লাহ ইবনে আব্বাস (রা.) থেকে বর্ণিত, রাসূলুল্লাহ (সা.) হজরত মুয়াজ ইবনে জাবাল (রা.)-কে ইয়েমেনে পাঠানোর সময় বলেন—</p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>فَأَعْلِمْهُمْ أَنَّ اللَّهَ افْتَرَضَ عَلَيْهِمْ خَمْسَ صَلَوَاتٍ فِي كُلِّ يَوْمٍ وَلَيْلَةٍ.</div></div><p>অর্থ: তাদের জানিয়ে দেবে যে, আল্লাহ তাআলা তাদের ওপর প্রতি দিন ও রাতে পাঁচ ওয়াক্ত সালাত ফরজ করেছেন। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class='h hm'>পাঁচ ওয়াক্ত সালাতের পরিচয়</div><p>প্রতিদিন পাঁচ ওয়াক্ত সালাত আদায় করা প্রত্যেক মুসলমানের ওপর ফরজ। সালাতগুলো হলো—</p><p>১। ফজর: সুবহে সাদিক থেকে সূর্যোদয়ের পূর্ব পর্যন্ত দুই রাকাত ফরজ সালাত আদায় করতে হয়।</p><p>২। যোহর: সূর্য পশ্চিম দিকে ঢলে পড়ার পর থেকে আসরের ওয়াক্ত শুরু হওয়ার আগ পর্যন্ত চার রাকাত ফরজ সালাত আদায় করতে হয়।</p><p>৩। আসর: আসরের নির্ধারিত সময় শুরু হওয়ার পর থেকে সূর্যাস্তের আগ পর্যন্ত চার রাকাত ফরজ সালাত আদায় করতে হয়।</p><p>৪। মাগরিব: সূর্যাস্তের পর থেকে পশ্চিম আকাশের লাল আভা বিলীন হওয়ার আগ পর্যন্ত তিন রাকাত ফরজ সালাত আদায় করতে হয়।</p><p>৫। এশা: মাগরিবের সময় শেষ হওয়ার পর থেকে সুবহে সাদিকের আগ পর্যন্ত চার রাকাত ফরজ সালাত আদায় করতে হয়।</p><div class='h hm'>ব্যক্তিজীবনে সালাতের প্রভাব</div><p>ব্যক্তিজীবনে সালাতের প্রভাব অত্যন্ত ব্যাপক। সালাত মানুষের আত্মিক, নৈতিক, শারীরিক ও চারিত্রিক উন্নয়নে গুরুত্বপূর্ণ ভূমিকা পালন করে। নিম্নে তা আলোচনা করা হলো—</p><div class='h hs hs2'>১। আল্লাহর সঙ্গে সম্পর্ক স্থাপন</div><p>সালাতের মাধ্যমে বান্দা সরাসরি আল্লাহ তাআলার দরবারে উপস্থিত হয় এবং তাঁর কাছে নিজের প্রয়োজন, দুর্বলতা ও অপরাধের কথা তুলে ধরে। ফলে আল্লাহর সঙ্গে বান্দার সম্পর্ক গভীর ও দৃঢ় হয়।</p><div class='h hs hs2'>২। আত্মশুদ্ধি ও চরিত্র গঠন</div><p>সালাত মানুষের অন্তরকে পাপ-পঙ্কিলতা থেকে পবিত্র করে এবং আত্মাকে পরিশুদ্ধ করে। নিয়মিত সালাত আদায়ের মাধ্যমে মানুষের মধ্যে তাকওয়া, সততা, ধৈর্য ও আত্মসংযম সৃষ্টি হয়।</p><div class='h hs hs2'>৩। অশ্লীলতা ও অন্যায় থেকে বিরত রাখা</div><p class='bh'><b>সালাতের অন্যতম প্রধান প্রভাব হলো মানুষকে অন্যায় ও অশ্লীল কাজ থেকে বিরত রাখা। আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ.</div></div><p>অর্থ: নিশ্চয়ই সালাত অশ্লীল ও মন্দ কাজ থেকে বিরত রাখে। (সূরা আল-আনকাবুত: ৪৫)</p><div class='h hs hs2'>৪। সময়ানুবর্তিতা ও শৃঙ্খলাবোধ সৃষ্টি</div><p>পাঁচ ওয়াক্ত সালাত নির্দিষ্ট সময়ে আদায় করতে হয়। ফলে মানুষের মধ্যে সময়ের মূল্যায়ন, নিয়মানুবর্তিতা ও শৃঙ্খলাবোধ সৃষ্টি হয়। ব্যক্তি তার দৈনন্দিন কাজকর্মও সময় অনুযায়ী পরিচালনা করতে শেখে।</p><div class='h hs hs2'>৫। ধৈর্য ও মানসিক প্রশান্তি অর্জন</div><p class='bh'><b>সালাত মানুষের দুশ্চিন্তা, হতাশা ও মানসিক অস্থিরতা দূর করতে সাহায্য করে। আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ.</div></div><p>অর্থ: হে মুমিনগণ! তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো। (সূরা আল-বাকারা: ১৫৩)</p><div class='h hs hs2'>৬। পাপ মোচন ও গুনাহ থেকে মুক্তি</div><p>নিয়মিত সালাত আদায়ের মাধ্যমে আল্লাহ তাআলা বান্দার ছোটখাটো গুনাহ ক্ষমা করেন। রাসূলুল্লাহ (সা.) পাঁচ ওয়াক্ত সালাতকে এমন নদীর সঙ্গে তুলনা করেছেন, যাতে প্রতিদিন পাঁচবার গোসল করলে শরীরে কোনো ময়লা অবশিষ্ট থাকে না। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class='h hs hs2'>৭। আত্মসংযম ও দায়িত্ববোধ সৃষ্টি</div><p>সালাত মানুষকে প্রবৃত্তির কুপ্রবৃত্তি নিয়ন্ত্রণ করতে শেখায়। সালাতের মাধ্যমে ব্যক্তি আল্লাহর সামনে জবাবদিহির অনুভূতি অর্জন করে এবং নিজের কাজকর্মের ব্যাপারে সচেতন হয়।</p><div class='h hm'>সমাজজীবনে সালাতের প্রভাব</div><p>সালাত শুধু ব্যক্তিগত ইবাদত নয়; বরং এটি সমাজজীবনেও গুরুত্বপূর্ণ ইতিবাচক প্রভাব বিস্তার করে। সালাতের মাধ্যমে সমাজে সাম্য, ঐক্য, ভ্রাতৃত্ব, সহযোগিতা ও নৈতিকতা প্রতিষ্ঠিত হয়। নিম্নে কুরআন ও হাদিসের দলিলসহ সমাজজীবনে সালাতের প্রভাব আলোচনা করা হলো—</p><div class='h hs hs2'>১। সামাজিক ঐক্য ও ভ্রাতৃত্ব প্রতিষ্ঠা</div><p>জামাতে সালাত আদায়ের মাধ্যমে ধনী-গরিব, ছোট-বড়, শাসক-শাসিত সবাই একই কাতারে দাঁড়ায়। এতে মানুষের মধ্যে ভ্রাতৃত্ব, সাম্য ও ঐক্যের বন্ধন সুদৃঢ় হয়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ.</div></div><p>অর্থ: মুমিনগণ পরস্পর ভাই ভাই। সুতরাং তোমরা তোমাদের দুই ভাইয়ের মধ্যে মীমাংসা করে দাও। (সূরা আল-হুজুরাত: ১০)</p><div class='h hs hs2'>২। সাম্য ও বৈষম্য দূরীকরণ</div><p>সালাতে কোনো ব্যক্তি তার অর্থ, বংশ, পদমর্যাদা কিংবা সামাজিক অবস্থানের কারণে বিশেষ সুবিধা পায় না। সবাই একই নিয়মে আল্লাহর সামনে দাঁড়ায়। ফলে সামাজিক বৈষম্য ও অহংকার দূর হয়।</p><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّ اللَّهَ لَا يَنْظُرُ إِلَىٰ صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَىٰ قُلُوبِكُمْ وَأَعْمَالِكُمْ.</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ তোমাদের চেহারা ও সম্পদের দিকে তাকান না; বরং তিনি তোমাদের অন্তর ও আমলের দিকে তাকান। (সহিহ মুসলিম)</p><div class='h hs hs2'>৩। পারস্পরিক সহযোগিতা ও সহমর্মিতা সৃষ্টি</div><p>মসজিদে নিয়মিত একত্রিত হওয়ার ফলে মুসল্লিদের মধ্যে পরিচিতি ও আন্তরিকতা বৃদ্ধি পায়। একে অপরের বিপদ-আপদ সম্পর্কে জানা যায় এবং সহযোগিতার মনোভাব তৈরি হয়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ.</div></div><p>অর্থ: তোমরা সৎকর্ম ও তাকওয়ার কাজে পরস্পর সহযোগিতা করো এবং পাপ ও সীমালঙ্ঘনের কাজে সহযোগিতা করো না। (সূরা আল-মায়িদাহ: ২)</p><div class='h hs hs2'>৪। নৈতিক ও আদর্শ সমাজ গঠন</div><p>সালাত মানুষকে সততা, ন্যায়পরায়ণতা, আমানতদারি ও উত্তম আচরণের শিক্ষা দেয়। সালাতের শিক্ষা বাস্তব জীবনে অনুসরণ করলে সমাজ থেকে দুর্নীতি, প্রতারণা ও অন্যায় কমে আসে।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ.</div></div><p>অর্থ: নিশ্চয়ই সালাত অশ্লীল ও মন্দ কাজ থেকে বিরত রাখে। (সূরা আল-আনকাবুত: ৪৫)</p><div class='h hs hs2'>৫। সামাজিক অপরাধ ও অনাচার প্রতিরোধ</div><p>নিয়মিত সালাত আদায়কারী ব্যক্তি আল্লাহর কাছে জবাবদিহির অনুভূতি ধারণ করে। ফলে চুরি, ডাকাতি, মিথ্যা, সুদ, ঘুষ ও অন্যান্য অপরাধ থেকে বিরত থাকার মানসিকতা গড়ে ওঠে।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَأَقِمِ الصَّلَاةَ إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ.</div></div><p>অর্থ: তুমি সালাত কায়েম করো। নিশ্চয়ই সালাত অশ্লীল ও মন্দ কাজ থেকে বিরত রাখে। (সূরা আল-আনকাবুত: ৪৫)</p><div class='h hs hs2'>৬। নেতৃত্ব ও আনুগত্যের শিক্ষা</div><p>জামাতে সালাত আদায়ের সময় ইমামের অনুসরণ করতে হয়। ইমামের আগে কোনো কাজ করা যায় না। এর মাধ্যমে সমাজে সুশৃঙ্খল নেতৃত্ব, নিয়ম মানা ও পারস্পরিক দায়িত্ববোধের শিক্ষা পাওয়া যায়।</p><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّمَا جُعِلَ الْإِمَامُ لِيُؤْتَمَّ بِهِ، فَلَا تَخْتَلِفُوا عَلَيْهِ.</div></div><p>অর্থ: ইমামকে অনুসরণ করার জন্যই নিযুক্ত করা হয়েছে। সুতরাং তোমরা তাঁর বিরোধিতা করো না। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class='h hs hs2'>৭। সামাজিক সচেতনতা ও সম্প্রীতি বৃদ্ধি</div><p>মসজিদকে কেন্দ্র করে মুসলমানদের মধ্যে সামাজিক যোগাযোগ ও সম্প্রীতি গড়ে ওঠে। সমাজের সমস্যা, মানুষের অভাব-অনটন ও পারস্পরিক দায়িত্ব সম্পর্কে সচেতনতা বৃদ্ধি পায়।</p><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>مَنْ غَدَا إِلَى الْمَسْجِدِ أَوْ رَاحَ، أَعَدَّ اللَّهُ لَهُ فِي الْجَنَّةِ نُزُلًا كُلَّمَا غَدَا أَوْ رَاحَ.</div></div><p>অর্থ: যে ব্যক্তি সকাল-সন্ধ্যায় মসজিদে যাতায়াত করে, সে যখনই যাতায়াত করে, আল্লাহ তার জন্য জান্নাতে আপ্যায়নের ব্যবস্থা করেন। (সহিহ বুখারি ও সহিহ মুসলিম)</p><div class='h hm'>সালাতের আধ্যাত্মিক গুরুত্ব</div><p>সালাতের আধ্যাত্মিক গুরুত্ব অত্যন্ত গভীর। এটি শুধু শারীরিক কিছু কাজের সমষ্টি নয়; বরং মানুষের আত্মা, অন্তর ও আল্লাহর সঙ্গে সম্পর্ক উন্নয়নের অন্যতম মাধ্যম। নিম্নে কুরআন ও হাদিসের দলিলসহ সালাতের আধ্যাত্মিক গুরুত্ব আলোচনা করা হলো—</p><div class='h hs hs2'>১। আল্লাহর নৈকট্য লাভ</div><p>সালাতের মাধ্যমে বান্দা আল্লাহ তাআলার নৈকট্য অর্জন করে। সিজদার মাধ্যমে মানুষ তার সর্বোচ্চ বিনয় ও আনুগত্য প্রকাশ করে।</p><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ.</div></div><p>অর্থ: বান্দা তার প্রতিপালকের সবচেয়ে নিকটবর্তী হয় যখন সে সিজদারত থাকে। (সহিহ মুসলিম)</p><div class='h hs hs2'>২। আল্লাহর স্মরণ ও আত্মিক প্রশান্তি</div><p>সালাত মানুষকে বারবার আল্লাহর স্মরণে ফিরিয়ে আনে। দুনিয়ার ব্যস্ততা থেকে মুক্ত হয়ে বান্দা যখন সালাতে দাঁড়ায়, তখন তার অন্তরে প্রশান্তি ও স্থিরতা সৃষ্টি হয়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ.</div></div><p>অর্থ: জেনে রেখো, আল্লাহর স্মরণেই অন্তরসমূহ প্রশান্তি লাভ করে। (সূরা আর-রাদ: ২৮)</p><div class='h hs hs2'>৩। বিনয় ও অহংকারমুক্তির শিক্ষা</div><p>সালাতের রুকু ও সিজদার মাধ্যমে মানুষ আল্লাহর সামনে নিজের অসহায়ত্ব ও দাসত্ব প্রকাশ করে। এতে অহংকার, আত্মগরিমা ও আত্মম্ভরিতা দূর হয় এবং বিনয়ী মনোভাব সৃষ্টি হয়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>قَدْ أَفْلَحَ الْمُؤْمِنُونَ ۝ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ.</div></div><p>অর্থ: নিশ্চয়ই মুমিনগণ সফলকাম হয়েছে, যারা নিজেদের সালাতে বিনয় ও একাগ্রতা অবলম্বন করে। (সূরা আল-মুমিনুন: ১–২)</p><div class='h hs hs2'>৪। আল্লাহর প্রতি ভালোবাসা ও কৃতজ্ঞতা বৃদ্ধি</div><p>সালাতের মাধ্যমে বান্দা আল্লাহর অসংখ্য নিয়ামতের কথা স্মরণ করে এবং তাঁর প্রতি কৃতজ্ঞতা প্রকাশ করে। এতে আল্লাহর প্রতি ভালোবাসা, ভক্তি ও আনুগত্য বৃদ্ধি পায়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ.</div></div><p>অর্থ: তোমরা আমাকে স্মরণ করো, আমিও তোমাদের স্মরণ করব। আমার প্রতি কৃতজ্ঞতা প্রকাশ করো এবং অকৃতজ্ঞ হয়ো না। (সূরা আল-বাকারা: ১৫২)</p><div class='h hs hs2'>৫। তাকওয়া ও আল্লাহভীতি সৃষ্টি</div><p>নিয়মিত সালাত আদায়ের মাধ্যমে মানুষের অন্তরে আল্লাহর ভয় ও জবাবদিহির অনুভূতি জাগ্রত হয়। ফলে সে গোপনে ও প্রকাশ্যে আল্লাহর বিধান মেনে চলার চেষ্টা করে।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَأَقِمِ الصَّلَاةَ لِذِكْرِي.</div></div><p>অর্থ: আর আমাকে স্মরণ করার জন্য সালাত কায়েম করো। (সূরা ত্ব-হা: ১৪)</p><div class='h hs hs2'>৬। আত্মার পরিশুদ্ধি ও অন্তরের রোগ দূরীকরণ</div><p>সালাত মানুষের অন্তর থেকে হিংসা, বিদ্বেষ, অহংকার, লোভ ও অহেতুক দুনিয়াপ্রীতি দূর করতে সাহায্য করে। এর মাধ্যমে আত্মিক উন্নতি ও নৈতিক পবিত্রতা অর্জিত হয়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>قَدْ أَفْلَحَ مَنْ زَكَّاهَا ۝ وَقَدْ خَابَ مَنْ دَسَّاهَا.</div></div><p>অর্থ: নিশ্চয়ই সে সফল হয়েছে, যে নিজের আত্মাকে পরিশুদ্ধ করেছে। আর সে ব্যর্থ হয়েছে, যে তাকে কলুষিত করেছে। (সূরা আশ-শামস: ৯–১০)</p><div class='h hs hs2'>৭। আল্লাহর ওপর নির্ভরশীলতা বৃদ্ধি</div><p>মানুষ জীবনের বিভিন্ন বিপদ, দুঃখ-কষ্ট ও সংকটে সালাতের মাধ্যমে আল্লাহর সাহায্য প্রার্থনা করে। এতে আল্লাহর ওপর ভরসা, ধৈর্য ও আত্মবিশ্বাস বৃদ্ধি পায়।</p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ.</div></div><p>অর্থ: তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো। (সূরা আল-বাকারা: ৪৫)</p><div class='h hm'>উপসংহার</div><p>পরিশেষে বলা যায়, সালাত ইসলামের অন্যতম প্রধান ভিত্তি এবং মুমিনের জীবনের অপরিহার্য ইবাদত। পাঁচ ওয়াক্ত সালাত মানুষকে আল্লাহর সঙ্গে গভীর সম্পর্ক স্থাপন, আত্মশুদ্ধি, নৈতিক উন্নতি ও আধ্যাত্মিক প্রশান্তি অর্জনে সাহায্য করে। অন্যদিকে সমাজে সাম্য, ঐক্য, ভ্রাতৃত্ব, সহযোগিতা ও ন্যায়বিচার প্রতিষ্ঠায় গুরুত্বপূর্ণ ভূমিকা পালন করে। সালাতের প্রকৃত সুফল অর্জন করতে হলে শুধু আনুষ্ঠানিকভাবে সালাত আদায় করলেই হবে না; বরং সালাতের শিক্ষা ও আদর্শ বাস্তব জীবনে প্রতিফলিত করতে হবে। তাই প্রত্যেক মুসলমানের উচিত যথাসময়ে পাঁচ ওয়াক্ত সালাত আদায় করা এবং সালাতের মাধ্যমে ব্যক্তি ও সমাজজীবনকে সুন্দর ও কল্যাণময় করে গড়ে তোলা।</p>"]]}], "সংক্ষিপ্ত প্রশ্ন": [{"n": "সংক্ষিপ্ত", "c": "#F43F5E", "q": [["বিশ্ব অর্থনৈতিক সমস্যা সমাধানে ইসলামের ভূমিকা আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>অর্থনৈতিক সমস্যা বর্তমান বিশ্বের অন্যতম প্রধান সমস্যা। দারিদ্র্য, বেকারত্ব, সম্পদের অসম বণ্টন, সুদ, দুর্নীতি, মজুতদারি ও অর্থনৈতিক শোষণের কারণে বিশ্বব্যাপী নানা সংকট সৃষ্টি হচ্ছে। ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা হিসেবে এসব সমস্যার ন্যায়ভিত্তিক ও কল্যাণকর সমাধান প্রদান করেছে। ইসলামের অর্থনৈতিক ব্যবস্থা ন্যায়বিচার, মানবিকতা, সম্পদের সুষম বণ্টন এবং শোষণমুক্ত সমাজ প্রতিষ্ঠার ওপর প্রতিষ্ঠিত।</p><div class=\"h hm\">বিশ্ব অর্থনৈতিক সমস্যা সমাধানে ইসলামের ভূমিকা</div><div class=\"h hs hs2\">১। সুদমুক্ত অর্থনৈতিক ব্যবস্থা প্রতিষ্ঠা</div><p>সুদ অর্থনৈতিক বৈষম্য ও শোষণের অন্যতম কারণ। সুদের মাধ্যমে ধনী ব্যক্তি আরও ধনী হয় এবং ঋণগ্রহীতা অনেক সময় ঋণের বোঝায় জর্জরিত হয়। ইসলাম সুদকে সম্পূর্ণ হারাম ঘোষণা করেছে এবং হালাল ব্যবসা-বাণিজ্যকে উৎসাহিত করেছে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا</div></div><p>অর্থ: আল্লাহ ব্যবসাকে হালাল করেছেন এবং সুদকে হারাম করেছেন। (সূরা আল-বাকারা: ২৭৫)</p><div class=\"h hs hs2\">২। সম্পদের সুষম বণ্টন</div><p>ইসলাম সম্পদ যেন শুধু ধনীদের মধ্যে সীমাবদ্ধ না থাকে, সে ব্যবস্থা করেছে। যাকাত, সদকা, ফিতরা ও উত্তরাধিকার আইনের মাধ্যমে সমাজের বিভিন্ন শ্রেণির মানুষের মধ্যে সম্পদ বণ্টিত হয়। ফলে অর্থনৈতিক বৈষম্য কমে এবং সমাজে ভারসাম্য প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنْكُمْ</div></div><p>অর্থ: যাতে সম্পদ তোমাদের মধ্যে শুধু ধনীদের মধ্যেই আবর্তিত না হয়। (সূরা আল-হাশর: ৭)</p><div class=\"h hs hs2\">৩। দারিদ্র্য বিমোচন ও যাকাত ব্যবস্থা</div><p>দারিদ্র্য বিশ্ব অর্থনীতির একটি বড় সমস্যা। ইসলাম যাকাতকে ফরজ করে ধনীদের সম্পদে দরিদ্রদের অধিকার প্রতিষ্ঠা করেছে। যাকাতের অর্থ দরিদ্র, মিসকিন, ঋণগ্রস্ত ও অসহায় মানুষের কল্যাণে ব্যয় করা হয়। এর মাধ্যমে দারিদ্র্য বিমোচন ও সামাজিক নিরাপত্তা নিশ্চিত করা সম্ভব।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ</div></div><p>অর্থ: তোমরা সালাত প্রতিষ্ঠা করো এবং যাকাত প্রদান করো। (সূরা আল-বাকারা: ৪৩)</p><div class=\"h hs hs2\">৪। বেকারত্ব দূরীকরণ ও কর্মসংস্থান সৃষ্টি</div><p>ইসলাম অলসতা ও কর্মবিমুখতাকে নিরুৎসাহিত করে। হালাল উপার্জন, ব্যবসা-বাণিজ্য, কৃষি, শিল্প ও উৎপাদনশীল কর্মকাণ্ডে মানুষকে উৎসাহিত করে। এর ফলে কর্মসংস্থান বৃদ্ধি পায় এবং বেকারত্ব দূরীকরণে সহায়তা করে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَإِذَا قُضِيَتِ الصَّلَاةُ فَانْتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِنْ فَضْلِ اللَّهِ</div></div><p>অর্থ: অতঃপর সালাত সমাপ্ত হলে তোমরা পৃথিবীতে ছড়িয়ে পড়ো এবং আল্লাহর অনুগ্রহ অনুসন্ধান করো। (সূরা আল-জুমুআ: ১০)</p><div class=\"h hs hs2\">৫। শ্রমিকের অধিকার ও ন্যায্য মজুরি প্রতিষ্ঠা</div><p>ইসলাম শ্রমিকের মর্যাদা ও অধিকার নিশ্চিত করেছে। শ্রমিকের ন্যায্য মজুরি প্রদান, তার সঙ্গে ভালো আচরণ এবং তার শ্রমের যথাযথ মূল্য দেওয়ার নির্দেশ দিয়েছে। এতে শ্রমিক-মালিকের মধ্যে সুসম্পর্ক প্রতিষ্ঠিত হয় এবং অর্থনৈতিক শোষণ কমে।</p><p class=\"bh\"><b>রাসূলুল্লাহ (সা.) বলেছেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَعْطُوا الْأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ</div></div><p>অর্থ: শ্রমিকের ঘাম শুকানোর আগেই তার মজুরি দিয়ে দাও। (সুনান ইবনে মাজাহ)</p><div class=\"h hs hs2\">৬। ব্যবসায় ন্যায়নীতি ও সততা প্রতিষ্ঠা</div><p>ইসলাম ব্যবসা-বাণিজ্যে সততা, স্বচ্ছতা ও ন্যায়বিচারের নির্দেশ দিয়েছে। প্রতারণা, ওজনে কম দেওয়া, মিথ্যা শপথ, মজুতদারি ও কালোবাজারি নিষিদ্ধ করেছে। এর ফলে বাজারে ন্যায্য প্রতিযোগিতা এবং ক্রেতা-বিক্রেতার অধিকার প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَيْلٌ لِلْمُطَفِّفِينَ ۝ الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ ۝ وَإِذَا كَالُوهُمْ أَوْ وَزَنُوهُمْ يُخْسِرُونَ</div></div><p>অর্থ: দুর্ভোগ তাদের জন্য, যারা মাপে কম দেয়। যারা মানুষের কাছ থেকে মেপে নেওয়ার সময় পূর্ণমাত্রায় গ্রহণ করে, আর যখন তাদের মেপে বা ওজন করে দেয়, তখন কম দেয়। (সূরা আল-মুতাফফিফিন: ১–৩)</p><div class=\"h hs hs2\">৭। দুর্নীতি ও অর্থনৈতিক শোষণ প্রতিরোধ</div><p>ঘুষ, আত্মসাৎ, জালিয়াতি ও অবৈধভাবে সম্পদ অর্জন অর্থনৈতিক ব্যবস্থাকে ধ্বংস করে। ইসলাম এসব কাজ কঠোরভাবে নিষিদ্ধ করেছে। এর ফলে সমাজে ন্যায়বিচার, স্বচ্ছতা ও জবাবদিহি প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ</div></div><p>অর্থ: তোমরা অন্যায়ভাবে একে অপরের সম্পদ ভোগ করো না। (সূরা আল-বাকারা: ১৮৮)</p><div class=\"h hs hs2\">৮। হালাল উপার্জন ও বৈধ অর্থনৈতিক কর্মকাণ্ড</div><p>ইসলাম হালাল উপার্জনকে উৎসাহিত করেছে এবং জুয়া, প্রতারণা, চুরি, সুদ ও অবৈধ ব্যবসা নিষিদ্ধ করেছে। বৈধ উপায়ে সম্পদ অর্জন এবং তা সঠিকভাবে ব্যয় করার মাধ্যমে একটি সুস্থ ও নৈতিক অর্থনৈতিক ব্যবস্থা গড়ে ওঠে।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا النَّاسُ كُلُوا مِمَّا فِي الْأَرْضِ حَلَالًا طَيِّبًا</div></div><p>অর্থ: হে মানুষ! পৃথিবীতে যা কিছু হালাল ও পবিত্র রয়েছে, তা থেকে আহার করো। (সূরা আল-বাকারা: ১৬৮)</p><div class=\"h hs hs2\">৯। অপচয় ও অপব্যয় রোধ</div><p>অপচয় অর্থনৈতিক সংকটের অন্যতম কারণ। ইসলাম প্রয়োজন অনুযায়ী ব্যয় করার নির্দেশ দিয়েছে এবং অপচয়কে নিষিদ্ধ করেছে। এতে ব্যক্তিগত ও রাষ্ট্রীয় সম্পদের সঠিক ব্যবহার নিশ্চিত হয় এবং ভবিষ্যতের জন্য সম্পদ সংরক্ষণ করা সম্ভব হয়।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تُبَذِّرْ تَبْذِيرًا ۝ إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ</div></div><p>অর্থ: তুমি অপব্যয় করো না। নিশ্চয়ই অপব্যয়কারীরা শয়তানের ভাই। (সূরা আল-ইসরা: ২৬–২৭)</p><div class=\"h hs hs2\">১০। সামাজিক নিরাপত্তা ও মানবকল্যাণ প্রতিষ্ঠা</div><p>ইসলাম এতিম, বিধবা, অসহায়, ঋণগ্রস্ত ও দরিদ্র মানুষের অধিকার নিশ্চিত করেছে। সমাজের সামর্থ্যবান ব্যক্তিদের অসহায় মানুষের পাশে দাঁড়ানোর নির্দেশ দিয়েছে। ফলে সমাজে কেউ সম্পূর্ণ অসহায় অবস্থায় পড়ে থাকে না এবং অর্থনৈতিক নিরাপত্তা বৃদ্ধি পায়।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا</div></div><p>অর্থ: তারা আল্লাহর ভালোবাসায় মিসকিন, এতিম ও বন্দিকে খাবার দান করে। (সূরা আল-ইনসান: ৮)</p><div class=\"h hs hs2\">১১। ঋণগ্রস্ত মানুষের প্রতি সহানুভূতি</div><p>ইসলাম ঋণগ্রস্ত ব্যক্তির প্রতি সহানুভূতিশীল আচরণের নির্দেশ দিয়েছে। কোনো ব্যক্তি ঋণ পরিশোধে অক্ষম হলে তাকে সময় দেওয়ার নির্দেশ রয়েছে। এর ফলে অসহায় ঋণগ্রহীতা সুদের চক্র ও অতিরিক্ত অর্থনৈতিক চাপ থেকে রক্ষা পাওয়ার সুযোগ পায়।</p><p class=\"bh\"><b>মহান আল্লাহ বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ</div></div><p>অর্থ: আর ঋণগ্রহীতা যদি অভাবগ্রস্ত হয়, তবে সচ্ছলতা আসা পর্যন্ত তাকে অবকাশ দাও। (সূরা আল-বাকারা: ২৮০)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইসলাম বিশ্ব অর্থনৈতিক সমস্যার সমাধানে একটি ভারসাম্যপূর্ণ, ন্যায়ভিত্তিক ও মানবকল্যাণমুখী ব্যবস্থা প্রদান করেছে। সুদমুক্ত অর্থনীতি, যাকাত, সম্পদের সুষম বণ্টন, শ্রমিকের অধিকার, হালাল উপার্জন এবং দুর্নীতি প্রতিরোধের মাধ্যমে ইসলাম অর্থনৈতিক বৈষম্য ও শোষণ দূর করতে পারে। তাই বিশ্বে শান্তি, সমৃদ্ধি ও অর্থনৈতিক ন্যায়বিচার প্রতিষ্ঠার জন্য ইসলামের অর্থনৈতিক নীতিমালা বাস্তবায়ন করা অত্যন্ত জরুরি।</p>"], ["তাওহীদ কাকে বলে? এর প্রকারসমূহ বর্ণনা কর।", "<div class=\"h hm\">উপস্থাপনা</div><p>ইসলামি আকিদার মূল ভিত্তি হলো তাওহীদ। তাওহীদ অর্থ আল্লাহ তাআলাকে এক ও অদ্বিতীয় হিসেবে বিশ্বাস করা এবং তাঁর সত্তা, গুণাবলি ও ইবাদতে কাউকে অংশীদার না করা। সমগ্র সৃষ্টিজগতের একমাত্র স্রষ্টা, পালনকর্তা ও বিধানদাতা হলেন মহান আল্লাহ। সকল নবী-রাসূলের দাওয়াতের মূল বিষয় ছিল তাওহীদ। তাই ইসলামী জীবনব্যবস্থায় তাওহীদের গুরুত্ব অপরিসীম। নিম্নে প্রশ্নের আলোকে তাওহীদের আভিধানিক ও পারিভাষিক অর্থ আলোচনা করা হলো।</p><div class=\"h hm\">১ : تَعْرِيفُ التَّوْحِيدِ (তাওহীদের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>تَوْحِيد শব্দটি আরবি। এটি وَحَّدَ يُوَحِّدُ تَوْحِيدًا ধাতু থেকে নির্গত। এর মূল ধাতু হলো و-ح-د। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْإِفْرَادُ — একক বা অদ্বিতীয় করা।</p><p>২। الْوَحْدَانِيَّةُ — একত্ব বা এককত্ব।</p><p>৩। التَّفْرِيدُ — একক বলে স্বীকার করা।</p><p>৪। الِاعْتِقَادُ بِالْوَحْدَةِ — একত্বে বিশ্বাস করা।</p><p>৫। نَفْيُ الشَّرِيكِ — অংশীদারিত্ব অস্বীকার করা।</p><p>ইংরেজি অর্থ: Oneness, Unity, Monotheism, Uniqueness.</p><div class=\"h hs hs2\">পারিভাষিক সংজ্ঞা</div><p>তাওহীদের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম ইবনে তাইমিয়্যাহ (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">التَّوْحِيدُ هُوَ إِفْرَادُ اللَّهِ بِمَا يَخْتَصُّ بِهِ مِنَ الرُّبُوبِيَّةِ وَالْأُلُوهِيَّةِ وَالْأَسْمَاءِ وَالصِّفَاتِ</div></div><p>অর্থ: আল্লাহর জন্য তাঁর একক বৈশিষ্ট্যসমূহ তথা প্রভুত্ব, উপাস্যত্ব, নাম ও গুণাবলিতে তাঁকে একক বলে স্বীকার করাই তাওহীদ।</p><p>২. ইমাম ইবনুল কাইয়্যিম (র.)-এর বক্তব্যের আলোকে—</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">التَّوْحِيدُ هُوَ إِفْرَادُ اللَّهِ بِالْعِبَادَةِ وَالْخَلْقِ وَالْأَمْرِ وَالْأَسْمَاءِ وَالصِّفَاتِ</div></div><p>অর্থ: ইবাদত, সৃষ্টি, পরিচালনা, নাম ও গুণাবলিতে একমাত্র আল্লাহকে একক বলে স্বীকার করাই তাওহীদ।</p><div class=\"h hm\">তাওহীদের প্রকারভেদ</div><p>ইসলামী আকিদাশাস্ত্রে তাওহীদকে সাধারণত তিন ভাগে আলোচনা করা হয়। যথা—</p><div class=\"h hs hs2\">১। তাওহীদুর রুবুবিয়্যাহ (تَوْحِيدُ الرُّبُوبِيَّةِ)</div><p>আল্লাহ তায়ালাকে সমগ্র বিশ্বজগতের একমাত্র সৃষ্টিকর্তা, পালনকর্তা, রিজিকদাতা, জীবনদাতা, মৃত্যুদাতা ও নিয়ন্ত্রণকারী হিসেবে বিশ্বাস করাকে তাওহীদুর রুবুবিয়্যাহ বলে। আকাশমণ্ডলী, পৃথিবী এবং এর মধ্যবর্তী সবকিছুর সৃষ্টিকর্তা একমাত্র আল্লাহ। বিশ্বজগতের পরিচালনা ও নিয়ন্ত্রণে তাঁর কোনো শরিক বা অংশীদার নেই। মানুষের জীবন-মৃত্যু, রিজিক ও ভাগ্য সবকিছু তাঁর জ্ঞান ও ক্ষমতার অধীন।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ</div></div><p>অর্থ: আল্লাহ সবকিছুর সৃষ্টিকর্তা এবং তিনি সবকিছুর তত্ত্বাবধায়ক। (সূরা আয-যুমার, আয়াত: ৬২)</p><div class=\"h hs hs2\">২। তাওহীদুল উলুহিয়্যাহ (تَوْحِيدُ الْأُلُوهِيَّةِ)</div><p>একমাত্র আল্লাহ তায়ালাকে ইবাদতের যোগ্য হিসেবে বিশ্বাস করা এবং সব ধরনের ইবাদত তাঁর জন্য নির্দিষ্ট করাকে তাওহীদুল উলুহিয়্যাহ বলে। সালাত, সাওম, দোয়া, কুরবানি, মানত, সিজদা ও অন্যান্য ইবাদত একমাত্র আল্লাহর সন্তুষ্টির জন্য সম্পাদন করতে হবে। কোনো সৃষ্টি, ব্যক্তি বা বস্তুকে আল্লাহর ইবাদতে অংশীদার করা যাবে না। সকল নবী-রাসুলের দাওয়াতের মূল উদ্দেশ্য ছিল মানুষকে এক আল্লাহর ইবাদতের দিকে আহ্বান করা।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ</div></div><p>অর্থ: তাদের কেবল এ নির্দেশই দেওয়া হয়েছিল যে, তারা যেন একনিষ্ঠভাবে আল্লাহর ইবাদত করে এবং তাঁর প্রতি একাগ্র থাকে। (সূরা আল-বাইয়্যিনাহ, আয়াত: ৫)</p><div class=\"h hs hs2\">৩। তাওহীদুল আসমা ওয়াস সিফাত (تَوْحِيدُ الْأَسْمَاءِ وَالصِّفَاتِ)</div><p>আল্লাহ তায়ালার সুন্দর নামসমূহ ও পূর্ণাঙ্গ গুণাবলির ক্ষেত্রে তাঁকে এক ও অদ্বিতীয় হিসেবে বিশ্বাস করাকে তাওহীদুল আসমা ওয়াস সিফাত বলে। আল্লাহর নাম ও গুণাবলি তাঁর মর্যাদার উপযোগী। তিনি সর্বজ্ঞ, সর্বশক্তিমান, সর্বশ্রোতা, সর্বদ্রষ্টা ও পরম দয়ালু। কোনো সৃষ্টির জ্ঞান, ক্ষমতা বা গুণাবলির সঙ্গে আল্লাহর গুণাবলির তুলনা করা যায় না। তাঁর নাম ও গুণাবলির ক্ষেত্রে কোনো বিকৃতি, অস্বীকার কিংবা সৃষ্টির সঙ্গে সাদৃশ্য স্থাপন করা উচিত নয়।</p><p class=\"bh\"><b>আল্লাহ তায়ালা বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ</div></div><p>অর্থ: তাঁর মতো কিছুই নেই। তিনি সর্বশ্রোতা, সর্বদ্রষ্টা। (সূরা আশ-শূরা, আয়াত: ১১)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, তাওহীদ ইসলামের মূল ভিত্তি এবং মানবজীবনের সার্বিক কল্যাণের প্রধান উৎস। এটি মানুষের বিশ্বাসকে বিশুদ্ধ করে, শিরক ও কুসংস্কার থেকে মুক্ত রাখে এবং নৈতিক, আধ্যাত্মিক ও সামাজিক জীবনে ইতিবাচক পরিবর্তন আনে। ব্যক্তিজীবনে আত্মশুদ্ধি, পারিবারিক জীবনে শান্তি এবং সমাজজীবনে সাম্য ও ন্যায়বিচার প্রতিষ্ঠার জন্য তাওহীদের শিক্ষা অপরিহার্য। তাই ইহকালীন শান্তি ও পরকালীন মুক্তি লাভের জন্য প্রত্যেক মানুষের জীবনে বিশুদ্ধ তাওহীদের বাস্তব প্রতিফলন ঘটানো অত্যন্ত জরুরি।</p>"], ["حُبُّ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ — এর গুরুত্ব আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লামের প্রতি ভালোবাসা ঈমানের অপরিহার্য দাবি। তাঁর প্রতি ভালোবাসা ছাড়া পূর্ণাঙ্গ মুমিন হওয়া সম্ভব নয়। তাঁর আদর্শ অনুসরণ, সুন্নাহর প্রতি আনুগত্য এবং তাঁর নির্দেশ বাস্তবায়নের মাধ্যমে এ ভালোবাসার প্রকৃত প্রকাশ ঘটে। ইসলামে রাসূলুল্লাহ ﷺ-এর ভালোবাসার গুরুত্ব অপরিসীম।</p><div class=\"h hm\">রাসূলুল্লাহ ﷺ-এর ভালোবাসার গুরুত্ব</div><div class=\"h hs hs2\">১। পূর্ণাঙ্গ ঈমানের পরিচায়ক</div><p>রাসূলুল্লাহ ﷺ-কে ভালোবাসা ঈমানের গুরুত্বপূর্ণ অংশ। কোনো ব্যক্তি ততক্ষণ পর্যন্ত পূর্ণাঙ্গ মুমিন হতে পারে না, যতক্ষণ না সে রাসূলুল্লাহ ﷺ-কে নিজের পিতা, সন্তান ও সমগ্র মানবজাতির চেয়ে বেশি ভালোবাসে।</p><p class=\"bh\"><b>রাসূলুল্লাহ ﷺ বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ</div></div><p>অর্থ: তোমাদের কেউ ততক্ষণ পর্যন্ত পূর্ণাঙ্গ মুমিন হতে পারবে না, যতক্ষণ না আমি তার কাছে তার পিতা, সন্তান ও সমগ্র মানুষের চেয়ে অধিক প্রিয় হই।</p><div class=\"h hs hs2\">২। আল্লাহর ভালোবাসা লাভের মাধ্যম</div><p>রাসূলুল্লাহ ﷺ-কে ভালোবাসা এবং তাঁর অনুসরণ করা আল্লাহর ভালোবাসা লাভের অন্যতম মাধ্যম। যে ব্যক্তি রাসূলের আদর্শ অনুসরণ করে, আল্লাহ তাকে ভালোবাসেন এবং তার গুনাহ ক্ষমা করেন।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ إِنْ كُنْتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ</div></div><p>অর্থ: বলুন, যদি তোমরা আল্লাহকে ভালোবাস, তাহলে আমার অনুসরণ করো। আল্লাহ তোমাদের ভালোবাসবেন এবং তোমাদের পাপসমূহ ক্ষমা করবেন। (সূরা আলে ইমরান: ৩১)</p><div class=\"h hs hs2\">৩। রাসূলের সুন্নাহ অনুসরণের অনুপ্রেরণা</div><p>রাসূলুল্লাহ ﷺ-এর প্রতি প্রকৃত ভালোবাসা মানুষকে তাঁর সুন্নাহ অনুসরণে উদ্বুদ্ধ করে। তাঁর ইবাদত, আচার-আচরণ, লেনদেন ও জীবনাদর্শ অনুসরণের মাধ্যমে একজন মুমিন নিজের জীবনকে সুন্দরভাবে পরিচালিত করতে পারে।</p><div class=\"h hs hs2\">৪। আখিরাতে রাসূলের সান্নিধ্য লাভ</div><p>রাসূলুল্লাহ ﷺ-কে ভালোবাসার অন্যতম প্রতিদান হলো আখিরাতে তাঁর সান্নিধ্য লাভের সৌভাগ্য। একজন সাহাবি রাসূলুল্লাহ ﷺ-কে জিজ্ঞাসা করেছিলেন, কিয়ামত কখন হবে? তিনি পাল্টা জিজ্ঞাসা করলেন, তুমি কিয়ামতের জন্য কী প্রস্তুতি নিয়েছ? সাহাবি বললেন, আল্লাহ ও তাঁর রাসূলের ভালোবাসা। তখন তিনি বললেন:</p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الْمَرْءُ مَعَ مَنْ أَحَبَّ</div></div><p>অর্থ: মানুষ তার সঙ্গেই থাকবে, যাকে সে ভালোবাসে।</p><div class=\"h hs hs2\">৫। চরিত্র গঠনের অন্যতম মাধ্যম</div><p>রাসূলুল্লাহ ﷺ-এর প্রতি ভালোবাসা মানুষকে তাঁর উন্নত চরিত্র অনুসরণে উৎসাহিত করে। তাঁর সততা, আমানতদারি, ক্ষমাশীলতা, দয়া, বিনয় ও ধৈর্যের গুণাবলি গ্রহণের মাধ্যমে মানুষ উত্তম চরিত্রের অধিকারী হয়।</p><div class=\"h hs hs2\">৬। দ্বীনের ওপর অবিচল থাকার শক্তি</div><p>রাসূলুল্লাহ ﷺ-এর প্রতি গভীর ভালোবাসা মুমিনকে দ্বীনের পথে দৃঢ় থাকতে সাহায্য করে। বিপদ-আপদ, নির্যাতন ও প্রতিকূল পরিস্থিতিতেও সে ইসলামের আদর্শ থেকে বিচ্যুত হয় না। সাহাবায়ে কেরামের জীবন রাসূলপ্রেম ও দ্বীনের প্রতি অবিচলতার উজ্জ্বল দৃষ্টান্ত।</p><div class=\"h hs hs2\">৭। উম্মতের ঐক্য ও ভ্রাতৃত্ব প্রতিষ্ঠা</div><p>রাসূলুল্লাহ ﷺ-এর ভালোবাসা সমগ্র মুসলিম উম্মাহকে একই আদর্শ ও আকিদার বন্ধনে আবদ্ধ করে। তাঁর আদর্শ অনুসরণের মাধ্যমে মুসলমানদের মধ্যে পারস্পরিক ভালোবাসা, সহযোগিতা, ভ্রাতৃত্ব ও ঐক্য সৃষ্টি হয়।</p><div class=\"h hs hs2\">৮। রাসূলের সম্মান ও মর্যাদা রক্ষা</div><p>রাসূলুল্লাহ ﷺ-কে ভালোবাসার দাবি হলো তাঁর সম্মান ও মর্যাদা রক্ষা করা। তাঁর প্রতি যথাযথ দরুদ ও সালাম পাঠ করা, তাঁর শান-মানের প্রতি শ্রদ্ধাশীল থাকা এবং তাঁর সম্পর্কে অসম্মানজনক বক্তব্য ও আচরণ থেকে বিরত থাকা প্রত্যেক মুমিনের দায়িত্ব।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ ও তাঁর ফেরেশতাগণ নবীর প্রতি দরুদ পাঠ করেন। হে মুমিনগণ! তোমরাও তাঁর প্রতি দরুদ পাঠ করো এবং যথাযথভাবে সালাম পেশ করো। (সূরা আল-আহযাব: ৫৬)</p><div class=\"h hs hs2\">৯। জান্নাত লাভের আশাবাদ</div><p>রাসূলুল্লাহ ﷺ-এর প্রতি প্রকৃত ভালোবাসা মানুষকে তাঁর আনুগত্য ও আদর্শ অনুসরণে উদ্বুদ্ধ করে। আর তাঁর আনুগত্য জান্নাত লাভের অন্যতম মাধ্যম।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَمَنْ يُطِعِ اللَّهَ وَالرَّسُولَ فَأُولَٰئِكَ مَعَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِمْ</div></div><p>অর্থ: যারা আল্লাহ ও রাসূলের আনুগত্য করে, তারা তাদের সঙ্গে থাকবে, যাদের প্রতি আল্লাহ অনুগ্রহ করেছেন। (সূরা আন-নিসা: ৬৯)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, রাসূলুল্লাহ ﷺ-এর প্রতি ভালোবাসা মুমিনের ঈমানের অপরিহার্য দাবি। এ ভালোবাসা শুধু মুখের দাবি নয়; বরং তাঁর সুন্নাহ অনুসরণ, আদর্শ বাস্তবায়ন ও তাঁর নির্দেশের প্রতি আনুগত্যের মাধ্যমে তা প্রমাণ করতে হয়। তাই প্রত্যেক মুসলমানের উচিত রাসূলুল্লাহ ﷺ-কে নিজের জীবনের সবকিছুর চেয়ে বেশি ভালোবাসা এবং তাঁর আদর্শ অনুযায়ী জীবন পরিচালনা করা।</p>"], ["ইসলামী অর্থনীতি ও প্রচলিত অর্থনীতির তুলনামূলক আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>মানবজীবনের অর্থনৈতিক কর্মকাণ্ড পরিচালনার জন্য বিভিন্ন অর্থনৈতিক ব্যবস্থা প্রচলিত রয়েছে। এর মধ্যে ইসলামী অর্থনীতি ও প্রচলিত অর্থনীতি উল্লেখযোগ্য। ইসলামী অর্থনীতি কুরআন-সুন্নাহর ওপর প্রতিষ্ঠিত, আর প্রচলিত অর্থনীতি মানবসৃষ্ট নীতিমালার ওপর প্রতিষ্ঠিত। উভয়ের মধ্যে মৌলিক কিছু পার্থক্য রয়েছে। নিম্নে তা আলোচনা করা হলো।</p><div class=\"h hm\">ইসলামী অর্থনীতি ও প্রচলিত অর্থনীতির তুলনামূলক আলোচনা</div><div class=\"h hs hs2\">১। উৎস ও ভিত্তি</div><p>ইসলামী অর্থনীতির মূল ভিত্তি হলো পবিত্র আল-কুরআন ও সুন্নাহ। এর যাবতীয় নীতিমালা আল্লাহপ্রদত্ত বিধানের আলোকে পরিচালিত হয়। অন্যদিকে প্রচলিত অর্থনীতি মানুষের চিন্তা, গবেষণা, অভিজ্ঞতা ও বিভিন্ন অর্থনৈতিক মতবাদের ওপর প্রতিষ্ঠিত।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنِ الْحُكْمُ إِلَّا لِلَّهِ</div></div><p>অর্থ: বিধান দেওয়ার অধিকার একমাত্র আল্লাহরই। (সূরা ইউসুফ: ৪০)</p><div class=\"h hs hs2\">২। লক্ষ্য ও উদ্দেশ্য</div><p>ইসলামী অর্থনীতির লক্ষ্য হলো মানুষের ইহকালীন কল্যাণ ও পরকালীন মুক্তি নিশ্চিত করা। অন্যদিকে প্রচলিত অর্থনীতির প্রধান লক্ষ্য হলো মানুষের অভাব পূরণ, সম্পদের সর্বোচ্চ ব্যবহার এবং অর্থনৈতিক সমৃদ্ধি অর্জন।</p><div class=\"h hs hs2\">৩। সম্পদের মালিকানা</div><p>ইসলামী অর্থনীতিতে প্রকৃত মালিক আল্লাহ তাআলা। মানুষ সম্পদের ব্যবহারকারী ও আমানতদার মাত্র। অন্যদিকে প্রচলিত অর্থনীতিতে ব্যক্তিগত মালিকানাকে অধিক গুরুত্ব দেওয়া হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">لِلَّهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ</div></div><p>অর্থ: আকাশমণ্ডলী ও পৃথিবীতে যা কিছু রয়েছে, সবই আল্লাহর। (সূরা আল-বাকারা: ২৮৪)</p><div class=\"h hs hs2\">৪। সুদ ও মুনাফার বিধান</div><p>ইসলামী অর্থনীতিতে সুদ সম্পূর্ণ হারাম; তবে বৈধ ব্যবসা-বাণিজ্য ও মুনাফা অর্জন হালাল। অন্যদিকে প্রচলিত অর্থনীতিতে সুদকে ঋণ ও বিনিয়োগের অন্যতম মাধ্যম হিসেবে ব্যবহার করা হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا</div></div><p>অর্থ: আল্লাহ ব্যবসাকে হালাল করেছেন এবং সুদকে হারাম করেছেন। (সূরা আল-বাকারা: ২৭৫)</p><div class=\"h hs hs2\">৫। সম্পদ উপার্জন ও বণ্টন</div><p>ইসলামী অর্থনীতিতে হালাল উপায়ে সম্পদ উপার্জন এবং ন্যায়সংগত বণ্টনের ওপর গুরুত্ব দেওয়া হয়েছে। যাকাত, সদকা, ফিতরা ও উত্তরাধিকারের মাধ্যমে সম্পদের সুষম বণ্টন নিশ্চিত করা হয়। অন্যদিকে প্রচলিত অর্থনীতিতে বাজারব্যবস্থা, মজুরি, মুনাফা ও করনীতির মাধ্যমে সম্পদ বণ্টিত হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنكُمْ</div></div><p>অর্থ: যাতে সম্পদ তোমাদের মধ্যে শুধু বিত্তশালীদের মাঝেই আবর্তিত না থাকে। (সূরা আল-হাশর: ৭)</p><div class=\"h hs hs2\">৬। নৈতিকতা ও সামাজিক দায়িত্ব</div><p>ইসলামী অর্থনীতিতে সততা, আমানতদারি, ন্যায়বিচার ও পারস্পরিক সহযোগিতাকে বিশেষ গুরুত্ব দেওয়া হয়। ব্যবসায় প্রতারণা, ঘুষ, জুয়া ও অন্যায়ভাবে সম্পদ ভোগ নিষিদ্ধ। অন্যদিকে প্রচলিত অর্থনীতিতে অর্থনৈতিক দক্ষতা, উৎপাদনশীলতা ও মুনাফা অর্জনকে বেশি গুরুত্ব দেওয়া হয়।</p><div class=\"h hs hs2\">৭। জবাবদিহিতা ও পরকালীন চিন্তা</div><p>ইসলামী অর্থনীতিতে মানুষ তার উপার্জন ও ব্যয়ের প্রতিটি কাজের জন্য আল্লাহর কাছে জবাবদিহি করবে। তাই এখানে দুনিয়ার পাশাপাশি আখিরাতের কল্যাণও বিবেচনা করা হয়। অন্যদিকে প্রচলিত অর্থনীতিতে জবাবদিহিতা প্রধানত রাষ্ট্রীয় আইন ও সামাজিক নিয়মের মধ্যে সীমাবদ্ধ থাকে।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, ইসলামী অর্থনীতি ও প্রচলিত অর্থনীতির মধ্যে মৌলিক পার্থক্য রয়েছে। প্রচলিত অর্থনীতি মূলত বস্তুগত উন্নয়নকে গুরুত্ব দেয়, আর ইসলামী অর্থনীতি বস্তুগত উন্নয়নের পাশাপাশি নৈতিকতা, সামাজিক ন্যায়বিচার ও পরকালীন কল্যাণ নিশ্চিত করে। তাই মানবজীবনের সার্বিক কল্যাণে ইসলামী অর্থনীতির গুরুত্ব অপরিসীম।</p>"], ["সালাতের সামাজিক ও আধ্যাত্মিক গুরুত্ব আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>সালাত ইসলামের পাঁচটি স্তম্ভের অন্যতম এবং ইসলামের গুরুত্বপূর্ণ ইবাদত। এটি বান্দার সঙ্গে আল্লাহর সম্পর্ক সুদৃঢ় করার পাশাপাশি মানুষের ব্যক্তিগত, সামাজিক ও নৈতিক জীবনকে সুন্দর করে গড়ে তোলে। সালাতের মাধ্যমে ব্যক্তি আত্মিক প্রশান্তি লাভ করে এবং সমাজে ঐক্য, ভ্রাতৃত্ব ও শৃঙ্খলা প্রতিষ্ঠিত হয়। নিম্নে সালাতের সামাজিক ও আধ্যাত্মিক গুরুত্ব আলোচনা করা হলো।</p><div class=\"h hm\">সালাতের সামাজিক ও আধ্যাত্মিক গুরুত্ব</div><div class=\"h hs hs2\">১। আল্লাহর সঙ্গে বান্দার সম্পর্ক স্থাপন</div><p>সালাতের মাধ্যমে বান্দা সরাসরি মহান আল্লাহর সঙ্গে সম্পর্ক স্থাপন করে। সালাত আদায়ের মাধ্যমে মানুষ আল্লাহর কাছে নিজের প্রয়োজন, দুর্বলতা ও অসহায়ত্ব প্রকাশ করে। ফলে তার অন্তরে আল্লাহর প্রতি ভালোবাসা, ভয় ও আনুগত্য সৃষ্টি হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَقِمِ الصَّلَاةَ لِذِكْرِي</div></div><p>অর্থ: আমার স্মরণের জন্য সালাত কায়েম করো। (সূরা ত্বহা: ১৪)</p><div class=\"h hs hs2\">২। আত্মিক প্রশান্তি ও মানসিক পবিত্রতা অর্জন</div><p>সালাত মানুষের অন্তরকে প্রশান্ত করে এবং দুশ্চিন্তা, হতাশা ও অস্থিরতা দূর করতে সাহায্য করে। নিয়মিত সালাত আদায়ের মাধ্যমে মানুষের অন্তরে আল্লাহর ওপর ভরসা ও মানসিক স্থিরতা তৈরি হয়। ফলে সে জীবনের বিপদ-আপদে ধৈর্য ধারণ করতে পারে।</p><div class=\"h hs hs2\">৩। পাপ ও অশ্লীলতা থেকে বিরত রাখা</div><p>সালাত মানুষকে অন্যায়, অশ্লীলতা ও পাপাচার থেকে দূরে রাখে। নিয়মিত সালাত আদায়ের ফলে মানুষের মধ্যে আল্লাহভীতি ও আত্মনিয়ন্ত্রণের ক্ষমতা সৃষ্টি হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ</div></div><p>অর্থ: নিশ্চয়ই সালাত অশ্লীল ও মন্দ কাজ থেকে বিরত রাখে। (সূরা আল-আনকাবুত: ৪৫)</p><div class=\"h hs hs2\">৪। মুসলিম ভ্রাতৃত্ব ও ঐক্য প্রতিষ্ঠা</div><p>জামাআতে সালাত আদায়ের মাধ্যমে মুসলমানদের মধ্যে পারস্পরিক পরিচয়, ভালোবাসা ও ভ্রাতৃত্ব সৃষ্টি হয়। ধনী-গরিব, সাদা-কালো ও উঁচু-নিচু সবাই একই কাতারে দাঁড়িয়ে সালাত আদায় করে। এতে সামাজিক বৈষম্য দূর হয় এবং ঐক্য প্রতিষ্ঠিত হয়।</p><div class=\"h hs hs2\">৫। সাম্য ও ভ্রাতৃত্ববোধ সৃষ্টি</div><p>সালাতের জামাআতে সমাজের সব শ্রেণির মানুষ একই নিয়মে ইমামের অনুসরণ করে। এখানে কারও মর্যাদা সম্পদ বা বংশের কারণে নির্ধারিত হয় না। ফলে মানুষের মধ্যে সাম্য, বিনয় ও পারস্পরিক সম্মানবোধ তৈরি হয়।</p><div class=\"h hs hs2\">৬। সামাজিক শৃঙ্খলা ও সময়ানুবর্তিতা শিক্ষা</div><p>সালাত নির্দিষ্ট সময়ে আদায় করা ফরজ। তাই নিয়মিত সালাত মানুষকে সময়ের মূল্য বুঝতে এবং নিয়ম-শৃঙ্খলা মেনে চলতে শিক্ষা দেয়। জামাআতের সালাতও মানুষকে নেতৃত্ব মানা, নিয়ম অনুসরণ করা ও সম্মিলিতভাবে কাজ করার প্রশিক্ষণ দেয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا</div></div><p>অর্থ: নিশ্চয়ই সালাত মুমিনদের ওপর নির্ধারিত সময়ে ফরজ করা হয়েছে। (সূরা আন-নিসা: ১০৩)</p><div class=\"h hs hs2\">৭। নৈতিক চরিত্র ও মানবিক গুণাবলি গঠন</div><p>সালাত মানুষকে বিনয়ী, ধৈর্যশীল, দায়িত্বশীল ও পরোপকারী হতে শিক্ষা দেয়। নিয়মিত সালাত আদায়ের মাধ্যমে মানুষের মধ্যে তাকওয়া, সততা, সহনশীলতা ও আত্মশুদ্ধির গুণাবলি বিকশিত হয়। ফলে ব্যক্তি যেমন সুন্দর চরিত্রের অধিকারী হয়, তেমনি সমাজেও নৈতিক পরিবেশ সৃষ্টি হয়।</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, সালাত শুধু একটি ধর্মীয় আনুষ্ঠানিকতা নয়; বরং এটি মানুষের আত্মিক উন্নতি ও সামাজিক কল্যাণের অন্যতম মাধ্যম। সালাতের মাধ্যমে ব্যক্তি আল্লাহর নৈকট্য লাভ করে এবং সমাজে ঐক্য, সাম্য, শৃঙ্খলা ও নৈতিকতা প্রতিষ্ঠিত হয়। তাই ব্যক্তি ও সমাজের সার্বিক কল্যাণের জন্য নিয়মিত ও একাগ্রতার সঙ্গে সালাত আদায় করা অপরিহার্য।</p>"], ["যাকাত কী? দারিদ্র্য বিমোচনে যাকাতের প্রভাব ও গুরুত্ব আলোচনা কর।", "<div class=\"h hm\">ভূমিকা</div><p>যাকাত ইসলামের পাঁচটি স্তম্ভের অন্যতম এবং ইসলামী অর্থব্যবস্থার গুরুত্বপূর্ণ ভিত্তি। এটি ধনীদের সম্পদ থেকে নির্দিষ্ট অংশ দরিদ্র ও অসহায় মানুষের মধ্যে বণ্টনের মাধ্যমে অর্থনৈতিক ভারসাম্য প্রতিষ্ঠা করে। দারিদ্র্য দূরীকরণ, সম্পদের সুষম বণ্টন ও সামাজিক ন্যায়বিচার প্রতিষ্ঠায় যাকাতের ভূমিকা অত্যন্ত গুরুত্বপূর্ণ। নিম্নে দারিদ্র্য বিমোচনে যাকাতের প্রভাব ও গুরুত্ব আলোচনা করা হলো।</p><div class=\"h hm\">১ : تَعْرِيفُ الزَّكَاةِ (যাকাতের সংজ্ঞা)</div><div class=\"h hs hs2\">আভিধানিক অর্থ</div><p>زَكَاة শব্দটি আরবি। এটি زَكَا يَزْكُو زَكَاةً ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। النَّمَاءُ — বৃদ্ধি বা প্রবৃদ্ধি।</p><p>২। الطَّهَارَةُ — পবিত্রতা বা পরিশুদ্ধতা।</p><p>৩। الْبَرَكَةُ — বরকত বা কল্যাণ।</p><p>৪। الصَّلَاحُ — সংশোধন বা সৎকর্ম।</p><p>৫। الزِّيَادَةُ — আধিক্য বা বৃদ্ধি।</p><p>ইংরেজি অর্থ: Purification, Growth, Charity, Almsgiving.</p><div class=\"h hs hs2\">শরয়ী সংজ্ঞা</div><p>যাকাতের শরয়ী সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class=\"bh\"><b>১. ইমাম আল-কাসানী (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الزَّكَاةُ تَمْلِيكُ جُزْءٍ مِنَ الْمَالِ لِفَقِيرٍ مُسْلِمٍ غَيْرِ هَاشِمِيٍّ وَلَا مَوْلَاهُ مَعَ قَطْعِ الْمَنْفَعَةِ عَنِ الْمُمَلِّكِ مِنْ كُلِّ وَجْهٍ لِلَّهِ تَعَالَى</div></div><p>অর্থ: মহান আল্লাহর সন্তুষ্টির উদ্দেশ্যে সম্পদের একটি নির্দিষ্ট অংশ কোনো দরিদ্র মুসলমানকে এমনভাবে মালিক বানিয়ে দেওয়া, যাতে দাতার মালিকানা ও উপকারের সম্পর্ক সম্পূর্ণ বিচ্ছিন্ন হয়ে যায়, তাকে যাকাত বলে।</p><p class=\"bh\"><b>২. ইমাম ইবনে কুদামাহ (র.) বলেন—</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">الزَّكَاةُ هِيَ حَقٌّ وَاجِبٌ فِي مَالٍ مَخْصُوصٍ لِطَائِفَةٍ مَخْصُوصَةٍ فِي وَقْتٍ مَخْصُوصٍ</div></div><p>অর্থ: নির্দিষ্ট সময়ে নির্দিষ্ট শ্রেণির মানুষের জন্য নির্দিষ্ট সম্পদের মধ্যে যে বাধ্যতামূলক অধিকার রয়েছে, তাকে যাকাত বলে।</p><div class=\"h hs hs2\">সারকথা</div><p></p><p>পরিশেষে বলা যায়, যাকাতের আভিধানিক অর্থ পবিত্রতা, বৃদ্ধি ও বরকত। আর শরিয়তের পরিভাষায় মহান আল্লাহর সন্তুষ্টি অর্জনের উদ্দেশ্যে নির্দিষ্ট শর্তে নির্দিষ্ট সম্পদের নির্ধারিত অংশ শরিয়ত কর্তৃক নির্ধারিত হকদারদের মালিকানায় প্রদান করাকে যাকাত বলে। যাকাত ব্যক্তি ও সমাজের অর্থনৈতিক ভারসাম্য প্রতিষ্ঠা এবং সম্পদের পবিত্রতা অর্জনের অন্যতম মাধ্যম।</p><div class=\"h hm\">দারিদ্র্য বিমোচনে যাকাতের প্রভাব ও গুরুত্ব</div><div class=\"h hs hs2\">১। দরিদ্র মানুষের মৌলিক চাহিদা পূরণ</div><p>যাকাতের মাধ্যমে দরিদ্র ও অসহায় মানুষ খাদ্য, বস্ত্র, বাসস্থান ও চিকিৎসার মতো মৌলিক চাহিদা পূরণের সুযোগ পায়। ফলে তাদের জীবনযাত্রার মান উন্নত হয় এবং দারিদ্র্যের কষ্ট অনেকাংশে লাঘব হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ</div></div><p>অর্থ: নিশ্চয়ই সদকাসমূহ (যাকাত) ফকির ও মিসকিনদের জন্য। (সূরা আত-তাওবা: ৬০)</p><div class=\"h hs hs2\">২। সম্পদের সুষম বণ্টন নিশ্চিতকরণ</div><p>যাকাত ধনীদের সম্পদের একটি নির্দিষ্ট অংশ দরিদ্রদের মধ্যে বণ্টনের ব্যবস্থা করে। ফলে সম্পদ শুধু ধনীদের হাতে পুঞ্জীভূত থাকে না; বরং সমাজের বিভিন্ন শ্রেণির মানুষের মধ্যে ছড়িয়ে পড়ে। এতে অর্থনৈতিক বৈষম্য হ্রাস পায়।</p><div class=\"h hs hs2\">৩। বেকারত্ব দূরীকরণ ও কর্মসংস্থান সৃষ্টি</div><p>যাকাতের অর্থ দরিদ্র ও বেকার মানুষকে কর্মসংস্থানের উপযোগী করে গড়ে তুলতে ব্যবহার করা যায়। তাদের প্রয়োজনীয় উপকরণ, ব্যবসার পুঁজি ও উৎপাদনসামগ্রী প্রদান করলে তারা স্বাবলম্বী হতে পারে। ফলে বেকারত্ব ও দারিদ্র্য কমে আসে।</p><div class=\"h hs hs2\">৪। অর্থনৈতিক স্বাবলম্বিতা অর্জন</div><p>যাকাতের মাধ্যমে দরিদ্র মানুষকে শুধু সাময়িক সাহায্য নয়, বরং স্থায়ীভাবে স্বাবলম্বী করার সুযোগ সৃষ্টি হয়। কোনো দরিদ্র ব্যক্তিকে ব্যবসার পুঁজি বা জীবিকা নির্বাহের উপকরণ দেওয়া হলে সে নিজেই উপার্জন করতে সক্ষম হয়। এভাবে যাকাত গ্রহীতাকে যাকাতদাতায় পরিণত করার পথ তৈরি করে।</p><div class=\"h hs hs2\">৫। সামাজিক বৈষম্য ও শ্রেণিসংঘাত দূরীকরণ</div><p>ধনী ও দরিদ্রের মধ্যে অতিরিক্ত অর্থনৈতিক ব্যবধান সমাজে হিংসা, বিদ্বেষ ও সংঘাত সৃষ্টি করে। যাকাত ধনীদের সম্পদে দরিদ্রদের অধিকার প্রতিষ্ঠার মাধ্যমে এই বৈষম্য কমিয়ে আনে। ফলে সমাজে পারস্পরিক ভালোবাসা, সহযোগিতা ও সম্প্রীতি বৃদ্ধি পায়।</p><div class=\"h hs hs2\">৬। সম্পদের প্রবাহ ও অর্থনৈতিক উন্নয়ন</div><p>যাকাতের মাধ্যমে ধনীদের সঞ্চিত সম্পদের একটি অংশ দরিদ্র মানুষের হাতে পৌঁছে যায়। দরিদ্ররা সেই অর্থ খাদ্য, পোশাক, শিক্ষা ও প্রয়োজনীয় পণ্য ক্রয়ে ব্যয় করে। এতে বাজারে চাহিদা বৃদ্ধি পায়, উৎপাদন ও ব্যবসা-বাণিজ্য সম্প্রসারিত হয় এবং সামগ্রিক অর্থনৈতিক কর্মকাণ্ড গতিশীল হয়।</p><div class=\"h hs hs2\">৭। মানবিক মূল্যবোধ ও সামাজিক নিরাপত্তা প্রতিষ্ঠা</div><p>যাকাত মানুষের মধ্যে দয়া, সহানুভূতি, ভ্রাতৃত্ব ও দায়িত্ববোধ সৃষ্টি করে। সমাজের অসহায়, এতিম, ঋণগ্রস্ত ও বিপদগ্রস্ত মানুষ যাকাতের মাধ্যমে সহযোগিতা লাভ করে। ফলে সমাজে নিরাপত্তা ও মানবিক মর্যাদা প্রতিষ্ঠিত হয়।</p><p class=\"bh\"><b>আল্লাহ তাআলা বলেন:</b></p><div class=\"ay ay0\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ</div></div><p>অর্থ: তোমরা সালাত কায়েম করো এবং যাকাত প্রদান করো। (সূরা আল-বাকারা: ৪৩)</p><div class=\"h hm\">উপসংহার</div><p>পরিশেষে বলা যায়, যাকাত শুধু একটি ধর্মীয় ইবাদত নয়; বরং দারিদ্র্য বিমোচন ও অর্থনৈতিক বৈষম্য দূরীকরণের কার্যকর ব্যবস্থা। সঠিকভাবে যাকাত আদায় ও বণ্টন করা হলে দরিদ্র মানুষের জীবনমান উন্নত হবে এবং সমাজে অর্থনৈতিক সাম্য ও ন্যায়বিচার প্রতিষ্ঠিত হবে। তাই দারিদ্র্যমুক্ত ও সমৃদ্ধ সমাজ গঠনে যাকাতের গুরুত্ব অপরিসীম।</p>"], ["شرك، نفاق، فسق، كفر — এর সংজ্ঞা দাও।", "<div class='h hm'>উপস্থাপনা</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। ইসলামের মৌলিক আকিদা ও বিশ্বাসের সঙ্গে শিরক, নিফাক, ফিসক ও কুফরের বিষয়গুলো গভীরভাবে সম্পর্কিত। এগুলো মানুষের ঈমান, আমল ও নৈতিক চরিত্রের ওপর গুরুত্বপূর্ণ প্রভাব ফেলে। তাই ইসলামের সঠিক জ্ঞান অর্জন এবং ঈমানকে পরিশুদ্ধ রাখার জন্য শিরক, নিফাক, ফিসক ও কুফরের পরিচয় ও সংজ্ঞা জানা অত্যন্ত জরুরি।</p><div class='h hm'>শিরক (الشِّرْكُ)-এর সংজ্ঞা</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>شِرْك শব্দটি আরবি। এটি شَرَكَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْمُشَارَكَةُ — অংশীদারিত্ব করা।</p><p>২। الْإِشْرَاكُ — শরিক বা অংশীদার স্থাপন করা।</p><p>৩। الْخَلْطُ — মিশ্রিত করা।</p><p>৪। الْمُقَاسَمَةُ — অংশ বণ্টন করা।</p><p>৫। الْمُشَارَكَةُ فِي الْمِلْكِ — মালিকানায় অংশীদার হওয়া।</p><p>ইংরেজি অর্থ: Polytheism, Partnership, Association.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>শিরকের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class='bh'><b>১। ইমাম ইবনে তাইমিয়্যাহ (র.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الشِّرْكُ هُوَ أَنْ يَجْعَلَ لِلَّهِ نِدًّا، وَهُوَ أَنْ يَدْعُوَ غَيْرَهُ أَوْ يَخَافَهُ أَوْ يَرْجُوَهُ أَوْ يُحِبَّهُ كَمَا يُحِبُّ اللَّهَ.</div></div><p>অর্থ: আল্লাহর সমকক্ষ বা অংশীদার স্থাপন করাই শিরক। অর্থাৎ আল্লাহ ছাড়া অন্য কাউকে ডাকা, তাকে ভয় করা, তার কাছে আশা করা অথবা আল্লাহকে যেভাবে ভালোবাসা হয় সেভাবে তাকে ভালোবাসা।</p><p class='bh'><b>২। ইমাম আল-জুরজানি (র.)-এর সংজ্ঞার মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الشِّرْكُ هُوَ إِثْبَاتُ الشَّرِيكِ لِلَّهِ تَعَالَى فِي الرُّبُوبِيَّةِ أَوِ الْأُلُوهِيَّةِ أَوِ الْأَسْمَاءِ وَالصِّفَاتِ.</div></div><p>অর্থ: আল্লাহ তাআলার প্রভুত্ব, ইবাদত কিংবা নাম ও গুণাবলির ক্ষেত্রে অন্য কাউকে তাঁর অংশীদার সাব্যস্ত করাই শিরক।</p><div class='h hm'>নিফাক (النِّفَاقُ)-এর সংজ্ঞা</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>نِفَاق শব্দটি আরবি। এটি نَافَقَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। إِظْهَارُ خِلَافِ الْبَاطِنِ — অন্তরের বিপরীত বিষয় প্রকাশ করা।</p><p>২। الْخِدَاعُ — প্রতারণা করা।</p><p>৩। الْمُخَادَعَةُ — ধোঁকা দেওয়া।</p><p>৪। السِّتْرُ — গোপন করা।</p><p>৫। الْمَكْرُ — কূটকৌশল করা।</p><p>ইংরেজি অর্থ: Hypocrisy, Duplicity, Deception.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>নিফাকের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class='bh'><b>১। ইমাম ইবনে রজব হাম্বলি (র.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>النِّفَاقُ هُوَ إِظْهَارُ الْإِسْلَامِ وَإِبْطَانُ الْكُفْرِ وَالشَّرِّ.</div></div><p>অর্থ: বাহ্যিকভাবে ইসলাম প্রকাশ করা এবং অন্তরে কুফর ও মন্দ বিশ্বাস গোপন রাখাকে নিফাক বলে।</p><p class='bh'><b>২। ইমাম আল-জুরজানি (র.)-এর সংজ্ঞার মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>النِّفَاقُ هُوَ مُخَالَفَةُ الْبَاطِنِ لِلظَّاهِرِ، فَإِنْ كَانَ فِي الِاعْتِقَادِ فَهُوَ نِفَاقٌ اعْتِقَادِيٌّ، وَإِنْ كَانَ فِي الْأَعْمَالِ فَهُوَ نِفَاقٌ عَمَلِيٌّ.</div></div><p>অর্থ: বাহ্যিক প্রকাশ ও অভ্যন্তরীণ অবস্থার মধ্যে অমিল থাকাকে নিফাক বলে। যদি এই অমিল বিশ্বাসের ক্ষেত্রে হয়, তবে তাকে বিশ্বাসগত নিফাক এবং যদি কাজের ক্ষেত্রে হয়, তবে তাকে কর্মগত নিফাক বলে।</p><div class='h hm'>ফিসক (الْفِسْقُ)-এর সংজ্ঞা</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>فِسْق শব্দটি আরবি। এটি فَسَقَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। الْخُرُوجُ — বের হয়ে যাওয়া।</p><p>২। الْعُصْيَانُ — অবাধ্যতা করা।</p><p>৩। الْمَيْلُ عَنِ الْحَقِّ — সত্য থেকে বিচ্যুত হওয়া।</p><p>৪। الْمُجَاوَزَةُ — সীমা অতিক্রম করা।</p><p>৫। الْفُجُورُ — পাপাচারে লিপ্ত হওয়া।</p><p>ইংরেজি অর্থ: Disobedience, Transgression, Wickedness.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>ফিসকের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class='bh'><b>১। ইমাম আল-জুরজানি (র.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الْفِسْقُ هُوَ الْخُرُوجُ عَنْ طَاعَةِ اللَّهِ تَعَالَى بِارْتِكَابِ كَبِيرَةٍ أَوِ الْإِصْرَارِ عَلَى صَغِيرَةٍ.</div></div><p>অর্থ: কবিরা গুনাহে লিপ্ত হওয়া অথবা সগিরা গুনাহের ওপর অবিচল থাকার মাধ্যমে আল্লাহ তাআলার আনুগত্য থেকে বের হয়ে যাওয়াকে ফিসক বলে।</p><p class='bh'><b>২। ইমাম ইবনে তাইমিয়্যাহ (র.)-এর বক্তব্যের মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الْفِسْقُ هُوَ الْخُرُوجُ عَنْ طَاعَةِ اللَّهِ وَرَسُولِهِ.</div></div><p>অর্থ: আল্লাহ ও তাঁর রাসূলের আনুগত্য থেকে বের হয়ে যাওয়াকে ফিসক বলে।</p><div class='h hm'>কুফর (الْكُفْرُ)-এর সংজ্ঞা</div><div class='h hs hs2'>আভিধানিক অর্থ</div><p>كُفْر শব্দটি আরবি। এটি كَفَرَ ধাতু থেকে নির্গত। এর আভিধানিক অর্থ নিম্নরূপ—</p><p>১। السَّتْرُ — ঢেকে রাখা বা গোপন করা।</p><p>২। الْجُحُودُ — অস্বীকার করা।</p><p>৩। الْإِنْكَارُ — প্রত্যাখ্যান করা।</p><p>৪। التَّغْطِيَةُ — আবৃত করা।</p><p>৫। عَدَمُ الشُّكْرِ — অকৃতজ্ঞতা প্রকাশ করা।</p><p>ইংরেজি অর্থ: Disbelief, Denial, Infidelity, Rejection.</p><div class='h hs hs2'>পারিভাষিক সংজ্ঞা</div><p>কুফরের পারিভাষিক সংজ্ঞায় মনীষীগণের বক্তব্য নিম্নরূপ—</p><p class='bh'><b>১। ইমাম আল-জুরজানি (র.)-এর সংজ্ঞার মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الْكُفْرُ هُوَ عَدَمُ الْإِيمَانِ بِاللَّهِ تَعَالَى وَرَسُولِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَتَكْذِيبُ مَا جَاءَ بِهِ الرَّسُولُ.</div></div><p>অর্থ: আল্লাহ তাআলা ও তাঁর রাসূলের প্রতি ঈমান না আনা এবং রাসূল (সা.)-এর আনীত বিষয়সমূহকে অস্বীকার করাকে কুফর বলে।</p><p class='bh'><b>২। ইমাম ইবনে তাইমিয়্যাহ (র.)-এর বক্তব্যের মর্ম হলো—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>الْكُفْرُ هُوَ عَدَمُ الْإِيمَانِ بِاللَّهِ وَرُسُلِهِ، سَوَاءٌ كَانَ مَعَ التَّكْذِيبِ أَوْ بِغَيْرِ تَكْذِيبٍ.</div></div><p>অর্থ: আল্লাহ ও তাঁর রাসূলগণের প্রতি ঈমান না আনাকে কুফর বলে; তা অস্বীকারের মাধ্যমে হোক কিংবা অন্য কোনোভাবে হোক।</p><div class='h hm'>উপসংহার</div><p>পরিশেষে বলা যায়, শিরক, নিফাক, ফিসক ও কুফর ইসলামের দৃষ্টিতে অত্যন্ত গুরুত্বপূর্ণ ও সতর্কতামূলক চারটি বিষয়। শিরক তাওহীদের পরিপন্থী, নিফাক অন্তরের বিশ্বাস ও বাহ্যিক আচরণের অসংগতি, ফিসক আল্লাহর আনুগত্য থেকে বিচ্যুতি এবং কুফর ঈমানের পরিপন্থী। একজন প্রকৃত মুসলমানের কর্তব্য হলো এসব বিষয় সম্পর্কে সঠিক জ্ঞান অর্জন করা, শিরক ও কুফর থেকে ঈমানকে রক্ষা করা, নিফাক থেকে বেঁচে থাকা এবং যাবতীয় পাপাচার পরিহার করে আল্লাহর নির্দেশিত পথে জীবন পরিচালনা করা।</p>"], ["নবীগণ (আ.) নিষ্পাপ হওয়া সম্পর্কে মনীষীগণের বক্তব্য দলিলসহ উল্লেখ কর।", "<div class='h hm'>ভূমিকা</div><p>মানবজাতিকে সত্য ও সুন্দরের পথে পরিচালিত করার জন্য আল্লাহ তাআলা যুগে যুগে অসংখ্য নবী-রাসূল প্রেরণ করেছেন। তাঁরা ছিলেন আল্লাহর মনোনীত, সর্বোত্তম চরিত্রের অধিকারী এবং মানবজাতির জন্য আদর্শ। আল্লাহ তাআলা তাঁদের বিশেষ মর্যাদা ও বৈশিষ্ট্য দান করেছেন। তাঁদের অন্যতম বৈশিষ্ট্য হলো নিষ্পাপ হওয়া। ইসলামী পরিভাষায় নবী-রাসূলগণের পাপ ও অপরাধ থেকে আল্লাহর পক্ষ থেকে সুরক্ষিত থাকাকে ‘ইসমাতুল আম্বিয়া’ বলা হয়। নিম্নে তাঁদের নিষ্পাপ হওয়ার বিষয়টি দলিলসহ আলোচনা করা হলো।</p><div class='h hm'>নবী-রাসূলগণের নিষ্পাপ হওয়ার দলিল (عِصْمَةُ الْأَنْبِيَاءِ عَلَيْهِمُ السَّلَامُ)</div><p>নবী-রাসূলগণের নিষ্পাপ হওয়ার বিষয়ে ইসলামী মনীষীগণ একমত যে, তাঁরা আল্লাহর পক্ষ থেকে ওহি পৌঁছে দেওয়ার ক্ষেত্রে সম্পূর্ণ নিষ্পাপ ও সুরক্ষিত। তাঁরা কুফর, শিরক এবং ইচ্ছাকৃতভাবে কবিরা গুনাহে লিপ্ত হওয়া থেকে পবিত্র। তবে নবুওয়াতের পূর্বে ও পরে সগিরা গুনাহ এবং অনিচ্ছাকৃত ত্রুটির বিষয়ে আলেমদের মধ্যে কিছু মতপার্থক্য রয়েছে। নিম্নে বিষয়টি কয়েকটি দিক থেকে আলোচনা করা হলো—</p><div class='h hs hs2'>১। নবুওয়াতের পূর্বে নবী-রাসূলগণের নিষ্পাপ হওয়া</div><p>নবুওয়াত লাভের পূর্বেও নবী-রাসূলগণ শিরক, কুফর এবং চরিত্রবিরোধী জঘন্য কাজ থেকে পবিত্র ছিলেন। তবে তাঁদের থেকে অনিচ্ছাকৃত সগিরা গুনাহ প্রকাশ পাওয়া সম্ভব কি না, এ বিষয়ে আলেমদের মধ্যে মতভেদ রয়েছে।</p><div class='h hs hs2'>ক. আহলে সুন্নাত ওয়াল জামায়াতের অভিমত</div><p>আহলে সুন্নাত ওয়াল জামায়াতের অধিকাংশ আলেমের মতে, নবী-রাসূলগণ নবুওয়াতের পূর্বে শিরক ও কুফর থেকে সম্পূর্ণ পবিত্র ছিলেন। তবে অনিচ্ছাকৃতভাবে সামান্য সগিরা গুনাহ বা ত্রুটি প্রকাশ পাওয়ার বিষয়টি একেবারে অসম্ভব নয়। কিন্তু তাঁদের দ্বারা এমন কোনো জঘন্য কাজ সংঘটিত হয়নি, যা নবুওয়াতের মর্যাদার পরিপন্থী।</p><p class='bh'><b>দলিল :</b></p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّ اللَّهَ لَا يَغْفِرُ أَنْ يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَنْ يَشَاءُ.</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ তাঁর সঙ্গে শিরক করাকে ক্ষমা করেন না এবং এর নিম্নবর্তী অপরাধ যাকে ইচ্ছা ক্ষমা করেন। (সূরা আন-নিসা: ৪৮)</p><p>এ আয়াত দ্বারা শিরকের ভয়াবহতা প্রমাণিত হয়। নবী-রাসূলগণ আল্লাহর মনোনীত বান্দা হওয়ায় শিরক ও কুফর থেকে পবিত্র ছিলেন।</p><div class='h hs hs2'>খ. ইমাম কাজী ইয়াজ (র.)-এর অভিমত</div><p>ইমাম কাজী ইয়াজ (র.)-এর মতে, নবী-রাসূলগণ নবুওয়াতের পূর্বেও কুফর, শিরক, কবিরা ও সগিরা গুনাহ থেকে পবিত্র ছিলেন। কারণ, নবুওয়াতের মহান দায়িত্ব পালনের জন্য তাঁদের চরিত্র ও ব্যক্তিত্ব পবিত্র হওয়া অপরিহার্য।</p><div class='h hs hs2'>গ. ইবনে হাজার আসকালানি (র.)-এর অভিমত</div><p>ইবনে হাজার আসকালানি (র.)-এর আলোচনার মর্ম হলো, নবী-রাসূলগণের মর্যাদা ও সম্মানের পরিপন্থী কোনো পাপ তাঁদের দ্বারা সংঘটিত হওয়া উচিত নয়। বিশেষত নবুওয়াতের পূর্বেও তাঁদের পবিত্রতা ও সম্মান বজায় থাকা জরুরি।</p><div class='h hs hs2'>২। নবুওয়াত-পরবর্তী নবী-রাসূলগণের নিষ্পাপ হওয়া</div><p>নবুওয়াত লাভের পর নবী-রাসূলগণ আল্লাহ তাআলার বিশেষ হেফাজত ও সংরক্ষণ লাভ করেন। তাঁরা আল্লাহর বিধান প্রচার, ওহি পৌঁছে দেওয়া এবং দ্বীনের শিক্ষা প্রদানের ক্ষেত্রে সম্পূর্ণ নির্ভরযোগ্য ও নিষ্পাপ। তাঁদের দ্বারা ইচ্ছাকৃতভাবে কোনো কবিরা বা সগিরা গুনাহ সংঘটিত হয় না। তবে অনিচ্ছাকৃত ইজতিহাদি ত্রুটি বা সামান্য বিচ্যুতি প্রকাশ পেলে আল্লাহ তাআলা তা সংশোধন করে দেন।</p><div class='h hs hs2'>ক. আহলে সুন্নাত ওয়াল জামায়াতের অভিমত</div><p>আহলে সুন্নাত ওয়াল জামায়াতের মতে, নবী-রাসূলগণ নবুওয়াত-পরবর্তী জীবনে কুফর, শিরক ও ইচ্ছাকৃত কবিরা গুনাহ থেকে সম্পূর্ণ নিষ্পাপ। তাঁরা আল্লাহর পক্ষ থেকে ওহি প্রচারের ক্ষেত্রে কোনো ভুল করেন না। তবে কোনো ইজতিহাদি ত্রুটি বা অনিচ্ছাকৃত সামান্য বিচ্যুতি ঘটলে আল্লাহ তাআলা তাঁদের সংশোধন করে দেন। ফলে তাঁরা কোনো ভুলের ওপর প্রতিষ্ঠিত থাকেন না।</p><p class='bh'><b>দলিল :</b></p><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ وَإِنْ لَمْ تَفْعَلْ فَمَا بَلَّغْتَ رِسَالَتَهُ وَاللَّهُ يَعْصِمُكَ مِنَ النَّاسِ.</div></div><p>অর্থ: হে রাসূল! আপনার প্রতিপালকের পক্ষ থেকে আপনার প্রতি যা অবতীর্ণ হয়েছে, তা পৌঁছে দিন। যদি আপনি তা না করেন, তবে তাঁর রিসালাত পৌঁছে দিলেন না। আর আল্লাহ আপনাকে মানুষের অনিষ্ট থেকে রক্ষা করবেন। (সূরা আল-মায়িদাহ: ৬৭)</p><p>এ আয়াত দ্বারা প্রমাণিত হয় যে, আল্লাহ তাআলা তাঁর রাসূলকে মানুষের অনিষ্ট থেকে হেফাজত করেছেন এবং রিসালাতের দায়িত্ব পালনে তাঁকে বিশেষভাবে সাহায্য করেছেন।</p><div class='h hs hs2'>খ. কুরআন ও ওহি প্রচারের ক্ষেত্রে নিষ্পাপ হওয়ার দলিল</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَمَا يَنْطِقُ عَنِ الْهَوَىٰ ۝ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ.</div></div><p>অর্থ: তিনি মনগড়া কোনো কথা বলেন না। তা তো কেবল ওহি, যা তাঁর প্রতি প্রেরণ করা হয়। (সূরা আন-নাজম: ৩–৪)</p><p>এ আয়াত দ্বারা প্রমাণিত হয় যে, রাসূলুল্লাহ (সা.) দ্বীনের বিষয়ে নিজের পক্ষ থেকে মনগড়া কোনো কথা বলতেন না। বরং তিনি আল্লাহর পক্ষ থেকে প্রাপ্ত ওহি অনুযায়ী দ্বীন প্রচার করতেন।</p><div class='h hs hs2'>গ. নবী-রাসূলগণ আল্লাহর মনোনীত ও পথপ্রাপ্ত বান্দা</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَاجْتَبَيْنَاهُمْ وَهَدَيْنَاهُمْ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ.</div></div><p>অর্থ: আমি তাঁদের মনোনীত করেছিলাম এবং সরল পথে পরিচালিত করেছিলাম। (সূরা আল-আনআম: ৮৭)</p><p>এ আয়াত দ্বারা বোঝা যায়, নবী-রাসূলগণ আল্লাহর বিশেষভাবে মনোনীত ও হিদায়াতপ্রাপ্ত বান্দা। তাঁদের জীবন আল্লাহর নির্দেশনা ও হেফাজতের অধীন ছিল।</p><div class='h hs hs2'>৩। নবী-রাসূলগণের নিষ্পাপ হওয়ার পক্ষে হাদিসের দলিল</div><p class='bh'><b>রাসূলুল্লাহ (সা.) বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>إِنَّ اللَّهَ اصْطَفَىٰ كِنَانَةَ مِنْ وَلَدِ إِسْمَاعِيلَ، وَاصْطَفَىٰ قُرَيْشًا مِنْ كِنَانَةَ، وَاصْطَفَىٰ مِنْ قُرَيْشٍ بَنِي هَاشِمٍ، وَاصْطَفَانِي مِنْ بَنِي هَاشِمٍ.</div></div><p>অর্থ: নিশ্চয়ই আল্লাহ ইসমাইলের সন্তানদের মধ্য থেকে কিনানাকে মনোনীত করেছেন, কিনানার মধ্য থেকে কুরাইশকে, কুরাইশের মধ্য থেকে বনু হাশিমকে এবং বনু হাশিমের মধ্য থেকে আমাকে মনোনীত করেছেন। (সহিহ মুসলিম)</p><p>এ হাদিস দ্বারা প্রমাণিত হয় যে, আল্লাহ তাআলা নবী-রাসূলগণকে বিশেষভাবে মনোনীত করেন। রাসূলুল্লাহ (সা.)-এর বংশীয় মর্যাদা ও মনোনয়নও তাঁর বিশেষ সম্মানের পরিচায়ক।</p><div class='h hs hs2'>৪। নবী-রাসূলগণের দ্বারা অনিচ্ছাকৃত ত্রুটি প্রকাশ পেলে আল্লাহর সংশোধন</div><p>নবী-রাসূলগণের নিষ্পাপ হওয়ার অর্থ এই নয় যে, তাঁদের দ্বারা কোনো ইজতিহাদি ত্রুটি বা অনিচ্ছাকৃত বিচ্যুতি কখনো প্রকাশ পেতে পারে না। বরং এমন কিছু ঘটলে আল্লাহ তাআলা তাঁদের সংশোধন করে দেন। এর কয়েকটি উদাহরণ নিম্নে দেওয়া হলো—</p><div class='h hs hs2'>ক. হজরত আদম (আ.)-এর ঘটনা</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>وَعَصَىٰ آدَمُ رَبَّهُ فَغَوَىٰ.</div></div><p>অর্থ: আদম তাঁর প্রতিপালকের অবাধ্যতা করেছিলেন, ফলে তিনি বিচ্যুত হয়েছিলেন। (সূরা ত্ব-হা: ১২১)</p><p>এখানে হজরত আদম (আ.)-এর নিষিদ্ধ গাছের ফল খাওয়ার ঘটনা উল্লেখ করা হয়েছে। তিনি ভুলক্রমে আল্লাহর নিষেধ অমান্য করেছিলেন। পরবর্তীতে তিনি অনুতপ্ত হয়ে তওবা করেন এবং আল্লাহ তাআলা তাঁর তওবা কবুল করেন। এ ঘটনা নবীদের ইচ্ছাকৃতভাবে পাপে লিপ্ত হওয়ার প্রমাণ নয়।</p><div class='h hs hs2'>খ. হজরত মুসা (আ.)-এর ঘটনা</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>قَالَ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي فَغَفَرَ لَهُ.</div></div><p>অর্থ: তিনি বললেন, হে আমার প্রতিপালক! আমি নিজের প্রতি জুলুম করেছি। অতএব, আমাকে ক্ষমা করুন। তখন আল্লাহ তাঁকে ক্ষমা করলেন। (সূরা আল-কাসাস: ১৬)</p><p>এখানে হজরত মুসা (আ.)-এর দ্বারা সংঘটিত হত্যার ঘটনার কথা বলা হয়েছে। ঘটনাটি নবুওয়াত লাভের পূর্বে সংঘটিত হয়েছিল এবং তা ইচ্ছাকৃত হত্যাকাণ্ড ছিল না। তিনি সঙ্গে সঙ্গে আল্লাহর কাছে ক্ষমা প্রার্থনা করেন।</p><div class='h hs hs2'>গ. রাসূলুল্লাহ (সা.)-এর ঘটনা</div><p class='bh'><b>আল্লাহ তাআলা বলেন—</b></p><div class='ay ay0'><div class='ar' dir='rtl' lang='ar'>عَبَسَ وَتَوَلَّىٰ ۝ أَنْ جَاءَهُ الْأَعْمَىٰ.</div></div><p>অর্থ: তিনি ভ্রূকুঞ্চিত করলেন এবং মুখ ফিরিয়ে নিলেন, কারণ তাঁর কাছে একজন অন্ধ ব্যক্তি এসেছিলেন। (সূরা আবাসা: ১–২)</p><p>এখানে হজরত আবদুল্লাহ ইবনে উম্মে মাকতুম (রা.)-এর ঘটনা বর্ণিত হয়েছে। রাসূলুল্লাহ (সা.) কুরাইশের কয়েকজন নেতাকে ইসলামের দাওয়াত দিচ্ছিলেন। এমন সময় একজন অন্ধ সাহাবি তাঁর কাছে আসেন। এ ঘটনায় আল্লাহ তাআলা রাসূলুল্লাহ (সা.)-কে উত্তম পদ্ধতি শিক্ষা দেন এবং সংশোধন করেন। এটি প্রমাণ করে যে, নবীদের কোনো ইজতিহাদি ত্রুটি হলে আল্লাহ তাআলা তা সংশোধন করে দেন।</p><div class='h hm'>উপসংহার</div><p>পরিশেষে বলা যায়, নবী-রাসূলগণ আল্লাহ তাআলার মনোনীত ও পবিত্র বান্দা। তাঁরা কুফর, শিরক, ইচ্ছাকৃত কবিরা গুনাহ এবং আল্লাহর বিধান প্রচারের ক্ষেত্রে যাবতীয় ভুল-ত্রুটি থেকে সম্পূর্ণ সুরক্ষিত। তাঁদের দ্বারা অনিচ্ছাকৃত কোনো ইজতিহাদি ত্রুটি প্রকাশ পেলে আল্লাহ তাআলা তা সংশোধন করে দেন। সুতরাং নবী-রাসূলগণের নিষ্পাপ হওয়া তাঁদের নবুওয়াত ও রিসালাতের মর্যাদা এবং আল্লাহর বিশেষ অনুগ্রহের অন্যতম নিদর্শন।</p>"]]}]}, "dv": ["রচনামূলক প্রশ্ন", "সংক্ষিপ্ত প্রশ্ন"], "ex": "2026-11-11"}];;;const B=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
