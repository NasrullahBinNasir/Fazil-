:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.08);--fs:16px;--a1:#0f766e;--a2:#0e7490}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b30;--tx:#e8edf8;--mu:#94a3b8;--ln:#243049;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:150px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;touch-action:pan-x pan-y}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:12px 12px 18px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:6px;max-width:1000px;margin:0 auto}.top h1{flex:1;margin:0;font-size:21px;line-height:1.25}
.tb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 11px;backdrop-filter:blur(6px)}.tb:active{transform:scale(.94)}
header>p{max-width:1000px;margin:6px auto 0;color:rgba(255,255,255,.85)}
.hero{max-width:1000px;margin:14px auto 0;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;padding:12px 14px}
.ring{position:relative;flex:none;width:84px;height:84px}.ring svg{width:100%;height:100%}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}.st div{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 2px}.st b{display:block;font-size:20px;line-height:1.2}.st small{font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 10px 60px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:12px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile .ic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:700;font-size:20px;display:grid;place-items:center;margin:6px 0 8px}
.tile b{display:block;font-size:18px;line-height:1.25}.tile small{color:var(--mu);font-size:14px}.tile.off{opacity:.5}
.big{display:flex;gap:14px;align-items:center}.big .ic{margin:6px 0;flex:none}
.pb{height:7px;border-radius:7px;background:var(--ln);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .4s}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 10px 8px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;max-width:1000px;margin:0 auto 8px}
input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.zb{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:0 12px;font-weight:700}.chips{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:20px;padding:2px 12px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.strip{max-width:1000px;margin:8px auto 0;font-size:14px;color:var(--mu);display:flex;gap:10px;align-items:center}.strip .pb{flex:1;margin:0;--c:var(--a1)}
.sec{margin-bottom:22px}.sh{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px}
.sh span{margin-left:auto;background:rgba(255,255,255,.25);border-radius:14px;padding:0 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:10px 12px;margin-top:10px;box-shadow:var(--sh)}
.no{float:left;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin:1px 9px 2px 0}
.q{font-weight:700;font-size:calc(var(--fs) + 2px);line-height:1.55;cursor:pointer}.q::after{content:' ▾';color:var(--c)}.card.show .q::after{content:' ▴'}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;clear:both}.ib{border:1px solid var(--ln);background:none;color:var(--mu);border-radius:10px;padding:0 10px;font-size:14px}
.card.bm .bm,.card.kn .kn{background:var(--c);color:#fff;border-color:var(--c)}.card.kn{opacity:.8}
.a{font-size:var(--fs);margin-top:8px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--tx);border-radius:12px;padding:6px 12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(-4px)}}
.hid .a{display:none}.hid .card.show .a{display:block}.a b{color:var(--c)}
.alw .q::after{content:none!important}.alw .q{cursor:default}.hid .a{cursor:pointer}
.a .h{font-weight:700;color:var(--c);margin:12px 0 2px;padding-left:8px;border-left:4px solid var(--c)}.a p{margin:2px 0 6px;text-align:justify}
.ay{margin:8px 0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--c);text-align:center}.ay .ar{font:400 calc(var(--fs)*1.7)/2 'MuhammadiQ','Amiri','Scheherazade New','Noto Naskh Arabic',serif}.ay .rf{color:var(--mu);font-size:.9em}
.empty{text-align:center;color:var(--mu);padding:30px}
.zi{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172acc;color:#fff;border-radius:20px;padding:4px 16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}.zi.on{opacity:1}


.qt3{background:color-mix(in srgb,var(--c) 10%,var(--card));border:0;border-radius:28px;box-shadow:none;padding:12px 16px}.qt3 .no{border-radius:12px}
.qt6{background:#0b0f1a;color:#e8edf8;border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}.qt6 .no{box-shadow:0 0 10px var(--c)}
.at8 .a{background:color-mix(in srgb,var(--c) 8%,var(--card))}.at8 .a .h{background:var(--c);color:#fff;border:0;border-radius:0 16px 16px 0;margin-left:-12px;padding:2px 14px;display:inline-block}.at8 .ay{border:0;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.15);border-radius:6px}

:root{--bg:#f3f5f1;--card:#fff;--tx:#10231d;--mu:#667a72;--ln:#e3e9e4;--sh:0 1px 2px rgba(16,35,29,.05),0 8px 24px -8px rgba(16,35,29,.12);--r:22px}

body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -80px,color-mix(in srgb,var(--a1) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--a2) 9%,transparent),transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

<script>
const S=[{"n":"আস সীরাত আন নববিয়্যাহ","c":"#15803D","k":"সি","d":{}},{"n":"দাওয়াহ ১ম পত্র","c":"#7C3AED","k":"দা১","d":{},"dv":["বড় প্রশ্ন","ছোট প্রশ্ন"],"ex":"2026-11-02"},{"n":"দাওয়াহ ২য় পত্র","c":"#9333EA","k":"দা২","d":{},"dv":["বড় প্রশ্ন","ছোট প্রশ্ন"],"ex":"2026-11-10"},{"n":"দাওয়াহ ৩য় পত্র","c":"#A855F7","k":"দা৩","d":{},"dv":["বড় প্রশ্ন","ছোট প্রশ্ন"],"ex":"2026-11-05"},{"n":"ইসলামিক স্টাডিজ ১ম পত্র","c":"#BE123C","k":"ই১","d":{"কুরআনের অনুবাদ":[{"n":"সূরা আন-নূর","c":"#0E7490","q":[["<small class=\"yr\">সূরা আন-নূর, আয়াত ২৭–২৯</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَدْخُلُوا بُيُوتًا غَيْرَ بُيُوتِكُمْ حَتَّىٰ تَسْتَأْنِسُوا وَتُسَلِّمُوا عَلَىٰ أَهْلِهَا ذَٰلِكُمْ خَيْرٌ لَكُمْ لَعَلَّكُمْ تَذَكَّرُونَ فَإِنْ لَمْ تَجِدُوا فِيهَا أَحَدًا فَلَا تَدْخُلُوهَا حَتَّىٰ يُؤْذَنَ لَكُمْ وَإِنْ قِيلَ لَكُمُ ارْجِعُوا فَارْجِعُوا هُوَ أَزْكَىٰ لَكُمْ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَدْخُلُوا بُيُوتًا غَيْرَ مَسْكُونَةٍ فِيهَا مَتَاعٌ لَكُمْ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ২৪তম সূরা, মাদানি সূরা আন-নূরের ২৭–২৯ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম মানুষের ব্যক্তিগত গোপনীয়তা, সম্মান ও শালীনতাকে বিশেষ গুরুত্ব দিয়েছে। তাই অন্যের বাড়িতে প্রবেশের আগে অনুমতি নেওয়া, সালাম দেওয়া এবং অনুমতি না পেলে ফিরে আসার নির্দেশ দেওয়া হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ২৭</div><p><b>অনুবাদ:</b> হে মুমিনগণ! তোমরা নিজেদের বাড়ি ছাড়া অন্যের বাড়িতে প্রবেশ করো না, যতক্ষণ না অনুমতি নাও এবং বাড়ির লোকদের সালাম দাও। এটাই তোমাদের জন্য উত্তম, যাতে তোমরা উপদেশ গ্রহণ করো।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে অন্যের বাড়িতে প্রবেশের আগে অনুমতি নেওয়া ও সালাম দেওয়ার নির্দেশ দেওয়া হয়েছে। এর মাধ্যমে মানুষের ব্যক্তিগত গোপনীয়তা ও সম্মান রক্ষা হয় এবং পারস্পরিক সৌহার্দ্য বৃদ্ধি পায়।</p><div class=\"h\">আয়াত ২৮</div><p><b>অনুবাদ:</b> যদি তোমরা বাড়িতে কাউকে না পাও, তবে অনুমতি না পাওয়া পর্যন্ত সেখানে প্রবেশ করো না। আর যদি তোমাদের বলা হয়, ফিরে যাও, তবে ফিরে যাবে। এটাই তোমাদের জন্য অধিক পবিত্র। তোমরা যা করো, আল্লাহ তা জানেন।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে অনুমতি ছাড়া অন্যের বাড়িতে প্রবেশ করতে নিষেধ করা হয়েছে। বাড়ির মালিক প্রবেশের অনুমতি না দিলে বিরক্ত না হয়ে ফিরে আসতে হবে। এতে মানুষের অধিকার ও ব্যক্তিগত স্বাধীনতা রক্ষা হয়।</p><div class=\"h\">আয়াত ২৯</div><p><b>অনুবাদ:</b> যেসব বাড়িতে কেউ বসবাস করে না, অথচ সেখানে তোমাদের প্রয়োজনীয় সামগ্রী রয়েছে, সেসব বাড়িতে প্রবেশ করায় তোমাদের কোনো দোষ নেই। তোমরা যা প্রকাশ করো এবং যা গোপন রাখো, আল্লাহ তা জানেন।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে জনশূন্য বা বসবাসের জন্য নির্ধারিত নয়—এমন বাড়িতে প্রয়োজনীয় কাজে প্রবেশের অনুমতি দেওয়া হয়েছে। তবে এ অনুমতি অন্যের সম্পদ বা অধিকার নষ্ট করার সুযোগ দেয় না। মানুষের প্রকাশ্য ও গোপন সব কাজই আল্লাহ তাআলার জানা।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে অন্যের বাড়িতে প্রবেশের শিষ্টাচার, অনুমতি নেওয়া, সালাম দেওয়া এবং বাড়ির মালিকের সিদ্ধান্তকে সম্মান করার শিক্ষা দেওয়া হয়েছে। এসব বিধান মেনে চললে মানুষের ব্যক্তিগত গোপনীয়তা রক্ষা পায় এবং সমাজে সৌহার্দ্য ও শৃঙ্খলা প্রতিষ্ঠিত হয়।</p>"],["<small class=\"yr\">সূরা আন-নূর, আয়াত ৪–৬</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا وَأُولَٰئِكَ هُمُ الْفَاسِقُونَ إِلَّا الَّذِينَ تَابُوا مِنْ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ وَالَّذِينَ يَرْمُونَ أَزْوَاجَهُمْ وَلَمْ يَكُنْ لَهُمْ شُهَدَاءُ إِلَّا أَنْفُسُهُمْ فَشَهَادَةُ أَحَدِهِمْ أَرْبَعُ شَهَادَاتٍ بِاللَّهِ إِنَّهُ لَمِنَ الصَّادِقِينَ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ২৪তম সূরা, মাদানি সূরা আন-নূরের ৪–৬ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম মানুষের সম্মান ও মর্যাদা রক্ষার প্রতি বিশেষ গুরুত্ব দিয়েছে। ব্যভিচারের মিথ্যা অপবাদ সমাজে অশান্তি সৃষ্টি করে। তাই মহান আল্লাহ তাআলা অপবাদ আরোপকারীর শাস্তি, তওবা ও আত্মসংশোধনের গুরুত্ব এবং স্বামী-স্ত্রীর মধ্যে অপবাদের ক্ষেত্রে বিশেষ বিধান বর্ণনা করেছেন।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ৪</div><p><b>অনুবাদ:</b> যারা সতী-সাধ্বী নারীদের প্রতি ব্যভিচারের অপবাদ আরোপ করে, অতঃপর চারজন সাক্ষী উপস্থিত করতে পারে না, তাদের আশিটি বেত্রাঘাত করো। আর কখনো তাদের সাক্ষ্য গ্রহণ করো না। তারাই ফাসিক।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে ব্যভিচারের মিথ্যা অপবাদ আরোপকারীর শাস্তি ঘোষণা করা হয়েছে। চারজন সাক্ষী উপস্থিত করতে না পারলে তার জন্য আশিটি বেত্রাঘাতের শাস্তি নির্ধারিত। এ ছাড়া তার সাক্ষ্য গ্রহণ না করার বিধানও দেওয়া হয়েছে। এর উদ্দেশ্য হলো মানুষের সম্মান রক্ষা করা এবং সমাজকে অপবাদ থেকে মুক্ত রাখা।</p><div class=\"h\">আয়াত ৫</div><p><b>অনুবাদ:</b> তবে যারা এরপর তওবা করে এবং নিজেদের সংশোধন করে নেয়, নিশ্চয়ই আল্লাহ অত্যন্ত ক্ষমাশীল, পরম দয়ালু।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে তওবা ও আত্মসংশোধনের গুরুত্ব বর্ণনা করা হয়েছে। অপবাদ আরোপকারী আন্তরিকভাবে তওবা করে নিজের সংশোধন করলে আল্লাহর ক্ষমা লাভের আশা করতে পারে। ইমাম আবু হানিফা (রহ.)-এর মতে, তওবা ও আত্মসংশোধনের মাধ্যমে তার ফাসিক হওয়ার বিধান দূর হয়; তবে নির্ধারিত শাস্তি শুধু তওবার কারণে রহিত হয় না।</p><div class=\"h\">আয়াত ৬</div><p><b>অনুবাদ:</b> যারা নিজেদের স্ত্রীদের প্রতি অপবাদ আরোপ করে, অথচ নিজেরা ছাড়া তাদের কোনো সাক্ষী নেই, তাদের প্রত্যেকে আল্লাহর নামে চারবার শপথ করে সাক্ষ্য দেবে যে, নিশ্চয়ই সে সত্যবাদীদের অন্তর্ভুক্ত।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে স্বামী-স্ত্রীর মধ্যে ব্যভিচারের অভিযোগের বিশেষ বিধান বর্ণিত হয়েছে। স্বামী নিজের স্ত্রীর প্রতি ব্যভিচারের অভিযোগ করলে, কিন্তু অন্য কোনো সাক্ষী না থাকলে, শরিয়তে লিআনের বিধান রয়েছে। এ ক্ষেত্রে স্বামী আল্লাহর নামে চারবার শপথ করে নিজের বক্তব্যের সত্যতা ঘোষণা করে। পরবর্তী আয়াতে পঞ্চম শপথের বিষয়টিও বর্ণিত হয়েছে।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে মানুষের সম্মান রক্ষা, মিথ্যা অপবাদের শাস্তি, তওবা ও আত্মসংশোধনের গুরুত্ব এবং স্বামী-স্ত্রীর মধ্যে অপবাদের ক্ষেত্রে বিশেষ বিধান বর্ণিত হয়েছে। অতএব, মিথ্যা অপবাদ থেকে বিরত থাকা, মানুষের মর্যাদা রক্ষা করা এবং আল্লাহর বিধান মেনে চলা প্রত্যেক মুসলিমের কর্তব্য।</p>"],["<small class=\"yr\">সূরা আন-নূর, আয়াত ৮–১০</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">وَيَدْرَأُ عَنْهَا الْعَذَابَ أَنْ تَشْهَدَ أَرْبَعَ شَهَادَاتٍ بِاللَّهِ إِنَّهُ لَمِنَ الْكَاذِبِينَ وَالْخَامِسَةَ أَنَّ غَضَبَ اللَّهِ عَلَيْهَا إِنْ كَانَ مِنَ الصَّادِقِينَ وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ وَأَنَّ اللَّهَ تَوَّابٌ حَكِيمٌ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ২৪তম সূরা, মাদানি সূরা আন-নূরের ৮–১০ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম মানুষের সম্মান ও চরিত্র রক্ষার জন্য মিথ্যা অপবাদকে কঠোরভাবে নিষিদ্ধ করেছে। স্বামী-স্ত্রীর মধ্যে অপবাদের বিধান বর্ণনা করার পর মহান আল্লাহ তাআলা অপবাদ থেকে মুক্তির পদ্ধতি এবং অপবাদ প্রচারের ভয়াবহ পরিণতি তুলে ধরেছেন।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ৮</div><p><b>অনুবাদ:</b> আর স্ত্রী নিজের ওপর থেকে শাস্তি দূর করতে চারবার আল্লাহর নামে শপথ করে সাক্ষ্য দেবে যে, তার স্বামী অবশ্যই মিথ্যাবাদীদের অন্তর্ভুক্ত।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে লিআনের ক্ষেত্রে স্ত্রীর সাক্ষ্য দেওয়ার বিধান বর্ণিত হয়েছে। স্বামী চারবার শপথ করে অভিযোগ করলে স্ত্রীও চারবার আল্লাহর নামে শপথ করে স্বামীর অভিযোগ মিথ্যা বলে ঘোষণা করতে পারে। এর মাধ্যমে তার ওপর নির্ধারিত শাস্তি থেকে মুক্তির বিধান বর্ণনা করা হয়েছে।</p><div class=\"h\">আয়াত ৯</div><p><b>অনুবাদ:</b> আর পঞ্চমবার সে বলবে, যদি তার স্বামী সত্যবাদী হয়ে থাকে, তবে তার ওপর আল্লাহর অভিশাপ নেমে আসুক।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে স্ত্রীর পঞ্চম শপথের কথা বলা হয়েছে। স্ত্রী পঞ্চমবার শপথ করে নিজের বক্তব্যের সত্যতা ঘোষণা করে এবং স্বামী সত্যবাদী হলে নিজের ওপর আল্লাহর অভিশাপ কামনা করে। এ বিধান লিআনের প্রক্রিয়ার একটি গুরুত্বপূর্ণ অংশ।</p><div class=\"h\">আয়াত ১০</div><p><b>অনুবাদ:</b> তোমাদের প্রতি আল্লাহর অনুগ্রহ ও দয়া না থাকলে এবং আল্লাহ তওবা কবুলকারী ও প্রজ্ঞাময় না হলে তোমরা বিপদে পড়তে।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে মহান আল্লাহ তাআলার অনুগ্রহ, দয়া ও প্রজ্ঞার কথা তুলে ধরা হয়েছে। তিনি বান্দাদের জন্য বিধান নির্ধারণ করেছেন এবং তওবার মাধ্যমে ক্ষমা লাভের সুযোগ দিয়েছেন। তাই মানুষের উচিত আল্লাহর বিধান মেনে চলা এবং তাঁর কাছে ক্ষমা প্রার্থনা করা।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে লিআনের ক্ষেত্রে স্বামী-স্ত্রীর শপথের বিধান এবং আল্লাহর অনুগ্রহ ও ক্ষমার কথা বর্ণিত হয়েছে। এসব বিধান মানুষের সম্মান রক্ষা ও জটিল অভিযোগ নিষ্পত্তির ক্ষেত্রে গুরুত্বপূর্ণ। অতএব, মিথ্যা অপবাদ থেকে বিরত থাকা এবং আল্লাহর বিধানের প্রতি শ্রদ্ধাশীল থাকা প্রত্যেক মুসলিমের কর্তব্য।</p>"],["<small class=\"yr\">সূরা আন-নূর, আয়াত ১–৫</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">سُورَةٌ أَنْزَلْنَاهَا وَفَرَضْنَاهَا وَأَنْزَلْنَا فِيهَا آيَاتٍ بَيِّنَاتٍ لَعَلَّكُمْ تَذَكَّرُونَ الزَّانِيَةُ وَالزَّانِي فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ وَلَا تَأْخُذْكُمْ بِهِمَا رَأْفَةٌ فِي دِينِ اللَّهِ إِنْ كُنْتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَلْيَشْهَدْ عَذَابَهُمَا طَائِفَةٌ مِنَ الْمُؤْمِنِينَ الزَّانِي لَا يَنْكِحُ إِلَّا زَانِيَةً أَوْ مُشْرِكَةً وَالزَّانِيَةُ لَا يَنْكِحُهَا إِلَّا زَانٍ أَوْ مُشْرِكٌ وَحُرِّمَ ذَٰلِكَ عَلَى الْمُؤْمِنِينَ وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا وَأُولَٰئِكَ هُمُ الْفَاسِقُونَ إِلَّا الَّذِينَ تَابُوا مِنْ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ২৪তম সূরা, মাদানি সূরা আন-নূরের ১–৫ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। মানুষের চরিত্র, সম্মান ও সামাজিক শৃঙ্খলা রক্ষার জন্য মহান আল্লাহ তাআলা বিভিন্ন বিধান দিয়েছেন। আলোচ্য আয়াতগুলোতে ব্যভিচারের শাস্তি, ব্যভিচারসংক্রান্ত বিবাহের বিধান এবং সতী-সাধ্বী নারীর প্রতি মিথ্যা অপবাদ আরোপকারীর শাস্তি বর্ণনা করা হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ১</div><p><b>অনুবাদ:</b> এটি একটি সূরা, যা আমি নাজিল করেছি এবং এর বিধানগুলো অপরিহার্য করেছি। এতে সুস্পষ্ট আয়াতসমূহ নাজিল করেছি, যাতে তোমরা উপদেশ গ্রহণ করো।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে সূরা আন-নূরের গুরুত্ব তুলে ধরা হয়েছে। এ সূরায় মানুষের ব্যক্তিগত ও সামাজিক জীবন পরিচালনার জন্য বিভিন্ন সুস্পষ্ট বিধান বর্ণিত হয়েছে। এসব বিধান মেনে চলার মাধ্যমে মানুষ সঠিক পথে পরিচালিত হতে পারে।</p><div class=\"h\">আয়াত ২</div><p><b>অনুবাদ:</b> ব্যভিচারিণী নারী ও ব্যভিচারী পুরুষ—তাদের প্রত্যেককে একশত বেত্রাঘাত করো। আল্লাহর বিধান কার্যকর করার ক্ষেত্রে তাদের প্রতি দয়া যেন তোমাদের প্রভাবিত না করে, যদি তোমরা আল্লাহ ও পরকালের প্রতি বিশ্বাসী হও। আর মুমিনদের একটি দল যেন তাদের শাস্তি প্রত্যক্ষ করে।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে ব্যভিচারের শাস্তি বর্ণনা করা হয়েছে। অবিবাহিত ব্যভিচারী নারী ও পুরুষের জন্য শরিয়তে একশত বেত্রাঘাতের বিধান রয়েছে। তবে এ ধরনের শাস্তি ব্যক্তিগতভাবে কেউ কার্যকর করতে পারে না; এটি বৈধ কর্তৃপক্ষের বিচারিক বিষয়। এর উদ্দেশ্য হলো সমাজে অনৈতিকতা প্রতিরোধ করা এবং পবিত্রতা বজায় রাখা।</p><div class=\"h\">আয়াত ৩</div><p><b>অনুবাদ:</b> ব্যভিচারী পুরুষ ব্যভিচারিণী নারী অথবা মুশরিক নারী ছাড়া অন্য কাউকে বিয়ে করে না; আর ব্যভিচারিণী নারীকে ব্যভিচারী পুরুষ অথবা মুশরিক পুরুষ ছাড়া অন্য কেউ বিয়ে করে না। আর মুমিনদের জন্য তা নিষিদ্ধ করা হয়েছে।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে ব্যভিচারের নৈতিক পরিণতি এবং বিবাহের ক্ষেত্রে পবিত্রতা ও চরিত্রের গুরুত্ব তুলে ধরা হয়েছে। মুমিনদের উচিত সৎ চরিত্রের অধিকারী হওয়া এবং অনৈতিকতা থেকে দূরে থাকা। এ আয়াতের ব্যাখ্যায় আলেমদের বিস্তারিত আলোচনা রয়েছে।</p><div class=\"h\">আয়াত ৪</div><p><b>অনুবাদ:</b> যারা সতী-সাধ্বী নারীদের প্রতি অপবাদ আরোপ করে, অতঃপর চারজন সাক্ষী উপস্থিত করতে পারে না, তাদের আশিটি বেত্রাঘাত করো। আর কখনো তাদের সাক্ষ্য গ্রহণ করো না। তারাই ফাসিক।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে ব্যভিচারের মিথ্যা অপবাদ আরোপকারীর শাস্তি বর্ণনা করা হয়েছে। কেউ সতী-সাধ্বী নারীর প্রতি ব্যভিচারের অপবাদ দিয়ে চারজন সাক্ষী উপস্থিত করতে না পারলে তার জন্য আশিটি বেত্রাঘাতের বিধান রয়েছে। এ ছাড়া তার সাক্ষ্য গ্রহণ না করার কথাও বলা হয়েছে। এর মাধ্যমে মানুষের সম্মান ও মর্যাদা রক্ষা করা হয়েছে।</p><div class=\"h\">আয়াত ৫</div><p><b>অনুবাদ:</b> তবে যারা এরপর তওবা করে এবং নিজেদের সংশোধন করে নেয়, নিশ্চয়ই আল্লাহ অত্যন্ত ক্ষমাশীল, পরম দয়ালু।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে তওবা ও আত্মসংশোধনের গুরুত্ব বর্ণিত হয়েছে। অপবাদ আরোপকারী আন্তরিকভাবে তওবা করে এবং নিজের সংশোধন করলে আল্লাহর ক্ষমা লাভের আশা করতে পারে। তওবার মাধ্যমে তার ফাসিক হওয়ার বিধান দূর হওয়ার বিষয়ে আলেমদের আলোচনা রয়েছে।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে ব্যভিচার থেকে বিরত থাকা, সৎ চরিত্র বজায় রাখা, মানুষের সম্মান রক্ষা করা এবং মিথ্যা অপবাদ না দেওয়ার নির্দেশনা রয়েছে। অতএব, প্রত্যেক মুসলিমের উচিত আল্লাহর বিধান মেনে চলা, পবিত্র জীবনযাপন করা এবং সমাজে নৈতিকতা ও শৃঙ্খলা বজায় রাখা।</p>"]]},{"n":"সূরা মুহাম্মাদ","c":"#A16207","q":[["<small class=\"yr\">সূরা মুহাম্মাদ, আয়াত ২০–২৩</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">وَيَقُولُ الَّذِينَ آمَنُوا لَوْلَا نُزِّلَتْ سُورَةٌ فَإِذَا أُنْزِلَتْ سُورَةٌ مُحْكَمَةٌ وَذُكِرَ فِيهَا الْقِتَالُ رَأَيْتَ الَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ يَنْظُرُونَ إِلَيْكَ نَظَرَ الْمَغْشِيِّ عَلَيْهِ مِنَ الْمَوْتِ فَأَوْلَىٰ لَهُمْ طَاعَةٌ وَقَوْلٌ مَعْرُوفٌ فَإِذَا عَزَمَ الْأَمْرُ فَلَوْ صَدَقُوا اللَّهَ لَكَانَ خَيْرًا لَهُمْ فَهَلْ عَسَيْتُمْ إِنْ تَوَلَّيْتُمْ أَنْ تُفْسِدُوا فِي الْأَرْضِ وَتُقَطِّعُوا أَرْحَامَكُمْ أُولَٰئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ فَأَصَمَّهُمْ وَأَعْمَىٰ أَبْصَارَهُمْ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ৪৭তম সূরা, মাদানি সূরা মুহাম্মাদের ২০–২৩ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>আল্লাহ তাআলা মুমিনদের ঈমানের দৃঢ়তা, আনুগত্য এবং আল্লাহর পথে ত্যাগ স্বীকারের শিক্ষা দিয়েছেন। আলোচ্য আয়াতগুলোতে যুদ্ধের নির্দেশ আসার পর মুনাফিকদের ভীরুতা, আল্লাহর আনুগত্যের গুরুত্ব এবং আত্মীয়তার সম্পর্ক ছিন্ন করার পরিণতি বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ২০</div><p><b>অনুবাদ:</b> মুমিনরা বলে, কেন কোনো সূরা নাজিল করা হয় না? অতঃপর যখন সুস্পষ্ট বিধানসংবলিত কোনো সূরা নাজিল হয় এবং তাতে যুদ্ধের কথা উল্লেখ করা হয়, তখন তুমি দেখতে পাও, যাদের অন্তরে রোগ রয়েছে, তারা মৃত্যুভয়ে মূর্ছিত ব্যক্তির মতো তোমার দিকে তাকিয়ে থাকে। সুতরাং তাদের জন্য উত্তম হতো আনুগত্য করা এবং ভালো কথা বলা।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে মুনাফিকদের ভীরুতা ও দুর্বল ঈমানের পরিচয় তুলে ধরা হয়েছে। তারা সূরা নাজিল হওয়ার প্রত্যাশা করলেও যুদ্ধের নির্দেশ এলে ভয় পেয়ে যায়। অথচ মুমিনদের কর্তব্য হলো আল্লাহর নির্দেশ মেনে চলা এবং উত্তম কথা বলা।</p><div class=\"h\">আয়াত ২১</div><p><b>অনুবাদ:</b> অতঃপর যখন চূড়ান্ত সিদ্ধান্ত নেওয়া হয়, তখন তারা যদি আল্লাহর প্রতি সত্যনিষ্ঠ থাকত, তবে তা তাদের জন্যই উত্তম হতো।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে আল্লাহর প্রতি সত্যনিষ্ঠ থাকার গুরুত্ব বর্ণিত হয়েছে। বিপদের সময়ও ঈমান ও আনুগত্য বজায় রাখা প্রকৃত মুমিনের বৈশিষ্ট্য।</p><div class=\"h\">আয়াত ২২</div><p><b>অনুবাদ:</b> তোমরা যদি ক্ষমতা লাভ করো, তবে কি পৃথিবীতে বিপর্যয় সৃষ্টি করবে এবং আত্মীয়তার সম্পর্ক ছিন্ন করবে?</p><p><b>ব্যাখ্যা:</b> এ আয়াতে পৃথিবীতে অশান্তি সৃষ্টি করা এবং আত্মীয়তার সম্পর্ক ছিন্ন করার নিন্দা করা হয়েছে। ইসলাম আত্মীয়স্বজনের সঙ্গে সুসম্পর্ক বজায় রাখা এবং সমাজে শান্তি প্রতিষ্ঠার নির্দেশ দেয়।</p><div class=\"h\">আয়াত ২৩</div><p><b>অনুবাদ:</b> এরাই তারা, যাদের আল্লাহ অভিশাপ দিয়েছেন। ফলে তিনি তাদের বধির করেছেন এবং তাদের দৃষ্টিশক্তি অন্ধ করে দিয়েছেন।</p><p><b>ব্যাখ্যা:</b> যারা আল্লাহর নির্দেশ অমান্য করে, পৃথিবীতে বিপর্যয় সৃষ্টি করে এবং আত্মীয়তার সম্পর্ক ছিন্ন করে, তারা আল্লাহর অসন্তুষ্টির উপযুক্ত হয়। এ আয়াতে তাদের কঠোর পরিণতির কথা তুলে ধরা হয়েছে।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে আল্লাহর প্রতি সত্যনিষ্ঠ থাকা, তাঁর নির্দেশ পালন করা, বিপদের সময় ধৈর্য ধারণ করা এবং আত্মীয়তার সম্পর্ক বজায় রাখার শিক্ষা দেওয়া হয়েছে। প্রত্যেক মুসলিমের উচিত এসব শিক্ষা অনুসরণ করে সৎ ও শান্তিপূর্ণ জীবনযাপন করা।</p>"]]},{"n":"সূরা আল-হুজুরাত","c":"#15803D","q":[["<small class=\"yr\">সূরা আল-হুজুরাত, আয়াত ২–৩</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَرْفَعُوا أَصْوَاتَكُمْ فَوْقَ صَوْتِ النَّبِيِّ وَلَا تَجْهَرُوا لَهُ بِالْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ أَنْ تَحْبَطَ أَعْمَالُكُمْ وَأَنْتُمْ لَا تَشْعُرُونَ إِنَّ الَّذِينَ يَغُضُّونَ أَصْوَاتَهُمْ عِنْدَ رَسُولِ اللَّهِ أُولَٰئِكَ الَّذِينَ امْتَحَنَ اللَّهُ قُلُوبَهُمْ لِلتَّقْوَىٰ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ عَظِيمٌ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ৪৯তম সূরা, মাদানি সূরা আল-হুজুরাতের ২–৩ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম মহানবী হজরত মুহাম্মদ (সা.)-এর প্রতি সম্মান প্রদর্শন এবং শিষ্টাচার বজায় রাখার নির্দেশ দিয়েছে। আলোচ্য আয়াতগুলোতে তাঁর সামনে কণ্ঠস্বর নিচু রাখা এবং যথাযথ আদব বজায় রাখার গুরুত্ব বর্ণিত হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ২</div><p><b>অনুবাদ:</b> হে মুমিনগণ! তোমরা নবীর কণ্ঠস্বরের ওপর নিজেদের কণ্ঠস্বর উঁচু করো না এবং তাঁর সঙ্গে এমন উচ্চস্বরে কথা বলো না, যেমন তোমরা পরস্পরের সঙ্গে উচ্চস্বরে কথা বলো। এতে তোমাদের আমল বিনষ্ট হয়ে যেতে পারে, অথচ তোমরা তা বুঝতেও পারবে না।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে মহানবী (সা.)-এর প্রতি যথাযথ সম্মান প্রদর্শনের নির্দেশ দেওয়া হয়েছে। তাঁর সামনে উচ্চস্বরে কথা বলা ও অসম্মানজনক আচরণ করা থেকে বিরত থাকতে হবে। এ বিধান নবীজির মর্যাদা ও সম্মান রক্ষার জন্য অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">আয়াত ৩</div><p><b>অনুবাদ:</b> নিশ্চয়ই যারা আল্লাহর রাসুলের সামনে নিজেদের কণ্ঠস্বর নিচু রাখে, তারাই এমন লোক, যাদের অন্তরকে আল্লাহ তাকওয়ার জন্য পরীক্ষা করেছেন। তাদের জন্য রয়েছে ক্ষমা ও মহাপুরস্কার।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে নবীজির প্রতি সম্মান প্রদর্শনকারীদের প্রশংসা করা হয়েছে। তাঁদের বিনয় ও শিষ্টাচার তাকওয়ার পরিচায়ক। আল্লাহ তাআলা তাঁদের জন্য ক্ষমা ও মহাপুরস্কারের প্রতিশ্রুতি দিয়েছেন।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে মহানবী (সা.)-এর প্রতি সম্মান, বিনয় ও উত্তম আচরণের শিক্ষা দেওয়া হয়েছে। প্রত্যেক মুসলিমের উচিত রাসুলুল্লাহ (সা.)-এর মর্যাদা রক্ষা করা এবং তাঁর আদর্শ অনুসরণ করা।</p>"],["<small class=\"yr\">সূরা আল-হুজুরাত, আয়াত ৪–৬</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">إِنَّ الَّذِينَ يُنَادُونَكَ مِنْ وَرَاءِ الْحُجُرَاتِ أَكْثَرُهُمْ لَا يَعْقِلُونَ وَلَوْ أَنَّهُمْ صَبَرُوا حَتَّىٰ تَخْرُجَ إِلَيْهِمْ لَكَانَ خَيْرًا لَهُمْ وَاللَّهُ غَفُورٌ رَحِيمٌ يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ৪৯তম সূরা, মাদানি সূরা আল-হুজুরাতের ৪–৬ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম শিষ্টাচার, সত্যতা যাচাই এবং অন্যের প্রতি ন্যায়বিচার প্রতিষ্ঠার শিক্ষা দেয়। আলোচ্য আয়াতগুলোতে মহানবী (সা.)-এর প্রতি আদব বজায় রাখা এবং কোনো সংবাদ পাওয়ার পর তা যাচাই করার নির্দেশ দেওয়া হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ৪</div><p><b>অনুবাদ:</b> নিশ্চয়ই যারা কক্ষগুলোর বাইরে থেকে তোমাকে উচ্চস্বরে ডাকে, তাদের অধিকাংশই বুদ্ধি-বিবেচনা রাখে না।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে মহানবী (সা.)-এর প্রতি শিষ্টাচারহীন আচরণের নিন্দা করা হয়েছে। নবীজির মর্যাদা ও ব্যক্তিগত সময়ের প্রতি সম্মান দেখানো প্রত্যেক মুসলিমের কর্তব্য।</p><div class=\"h\">আয়াত ৫</div><p><b>অনুবাদ:</b> তারা যদি ধৈর্য ধরে অপেক্ষা করত, যতক্ষণ না তুমি তাদের কাছে বের হয়ে আসতে, তবে তা তাদের জন্য উত্তম হতো। আর আল্লাহ অত্যন্ত ক্ষমাশীল, পরম দয়ালু।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে ধৈর্য ও শিষ্টাচারের গুরুত্ব বোঝানো হয়েছে। কারও সঙ্গে সাক্ষাৎ করতে গেলে উপযুক্ত সময়ের জন্য অপেক্ষা করা এবং ভদ্র আচরণ করা উচিত।</p><div class=\"h\">আয়াত ৬</div><p><b>অনুবাদ:</b> হে মুমিনগণ! যদি কোনো ফাসিক ব্যক্তি তোমাদের কাছে কোনো সংবাদ নিয়ে আসে, তবে তা যাচাই করে নাও; যাতে অজ্ঞতাবশত তোমরা কোনো সম্প্রদায়ের ক্ষতি করে না বসো এবং পরে নিজেদের কৃতকর্মের জন্য অনুতপ্ত না হও।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে সংবাদ যাচাই করার নির্দেশ দেওয়া হয়েছে। কোনো খবর শুনেই তা সত্য বলে বিশ্বাস করা বা তার ভিত্তিতে কারও বিরুদ্ধে ব্যবস্থা নেওয়া উচিত নয়। সংবাদ যাচাই করলে ভুল বোঝাবুঝি, অন্যায় ও অনুশোচনা থেকে রক্ষা পাওয়া যায়।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে শিষ্টাচার, ধৈর্য এবং সংবাদ যাচাইয়ের শিক্ষা দেওয়া হয়েছে। প্রত্যেক মুসলিমের উচিত ভদ্র আচরণ করা, তাড়াহুড়ো করে সিদ্ধান্ত না নেওয়া এবং সত্যতা যাচাই করে কাজ করা।</p>"],["<small class=\"yr\">সূরা আল-হুজুরাত, আয়াত ১০–১২</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ يَا أَيُّهَا الَّذِينَ آمَنُوا لَا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ عَسَىٰ أَنْ يَكُونُوا خَيْرًا مِنْهُمْ وَلَا نِسَاءٌ مِنْ نِسَاءٍ عَسَىٰ أَنْ يَكُنَّ خَيْرًا مِنْهُنَّ وَلَا تَلْمِزُوا أَنْفُسَكُمْ وَلَا تَنَابَزُوا بِالْأَلْقَابِ بِئْسَ الِاسْمُ الْفُسُوقُ بَعْدَ الْإِيمَانِ وَمَنْ لَمْ يَتُبْ فَأُولَٰئِكَ هُمُ الظَّالِمُونَ يَا أَيُّهَا الَّذِينَ آمَنُوا اجْتَنِبُوا كَثِيرًا مِنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ وَلَا تَجَسَّسُوا وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌ رَحِيمٌ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ৪৯তম সূরা, মাদানি সূরা আল-হুজুরাতের ১০–১২ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>ইসলাম মুসলমানদের মধ্যে ভ্রাতৃত্ব, ঐক্য ও পারস্পরিক সম্মান প্রতিষ্ঠার শিক্ষা দেয়। আলোচ্য আয়াতগুলোতে মুসলমানদের পারস্পরিক সম্পর্ক উন্নত করা, উপহাস ও মন্দ নামে ডাকা থেকে বিরত থাকা এবং কুধারণা, গুপ্তচরবৃত্তি ও গিবত পরিহারের নির্দেশ দেওয়া হয়েছে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ১০</div><p><b>অনুবাদ:</b> মুমিনরা পরস্পর ভাই ভাই। অতএব, তোমরা তোমাদের দুই ভাইয়ের মধ্যে মীমাংসা করে দাও এবং আল্লাহকে ভয় করো, যাতে তোমরা রহমতপ্রাপ্ত হতে পারো।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে মুসলমানদের পারস্পরিক ভ্রাতৃত্বের কথা বলা হয়েছে। তাদের মধ্যে বিরোধ সৃষ্টি হলে তা মিটিয়ে দেওয়া এবং ঐক্য বজায় রাখা সবার দায়িত্ব।</p><div class=\"h\">আয়াত ১১</div><p><b>অনুবাদ:</b> হে মুমিনগণ! কোনো সম্প্রদায় যেন অন্য সম্প্রদায়কে উপহাস না করে; হতে পারে তারা উপহাসকারীদের চেয়ে উত্তম। নারীরাও যেন অন্য নারীদের উপহাস না করে; হতে পারে তারা তাদের চেয়ে উত্তম। তোমরা একে অপরের প্রতি দোষারোপ করো না এবং মন্দ নামে ডেকো না। ঈমানের পর মন্দ নামে পরিচিত হওয়া অত্যন্ত নিকৃষ্ট বিষয়। যারা তওবা করে না, তারাই জালিম।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে অন্যকে উপহাস করা, অপমান করা এবং খারাপ নামে ডাকার নিষেধাজ্ঞা দেওয়া হয়েছে। মানুষকে তার বাহ্যিক অবস্থা দেখে তুচ্ছ করা উচিত নয়। প্রত্যেকের সম্মান রক্ষা করা এবং সুন্দর আচরণ করা মুমিনের বৈশিষ্ট্য।</p><div class=\"h\">আয়াত ১২</div><p><b>অনুবাদ:</b> হে মুমিনগণ! তোমরা অধিক ধারণা থেকে বেঁচে থাকো। নিশ্চয়ই কোনো কোনো ধারণা পাপ। তোমরা একে অপরের গোপন বিষয় অনুসন্ধান করো না এবং একে অপরের গিবত করো না। তোমাদের কেউ কি তার মৃত ভাইয়ের গোশত খেতে পছন্দ করবে? নিশ্চয়ই তোমরা তা ঘৃণা করবে। আর আল্লাহকে ভয় করো। নিশ্চয়ই আল্লাহ তওবা কবুলকারী, পরম দয়ালু।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে কুধারণা, অন্যের গোপন বিষয় অনুসন্ধান এবং গিবত করতে নিষেধ করা হয়েছে।</p>"]]},{"n":"সূরা মুহাম্মাদ (আয়াত ১–৩)","c":"#A16207","q":[["<small class=\"yr\">সূরা মুহাম্মাদ, আয়াত ১–৩</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ أَضَلَّ أَعْمَالَهُمْ وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَآمَنُوا بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٍ وَهُوَ الْحَقُّ مِنْ رَبِّهِمْ كَفَّرَ عَنْهُمْ سَيِّئَاتِهِمْ وَأَصْلَحَ بَالَهُمْ ذَٰلِكَ بِأَنَّ الَّذِينَ كَفَرُوا اتَّبَعُوا الْبَاطِلَ وَأَنَّ الَّذِينَ آمَنُوا اتَّبَعُوا الْحَقَّ مِنْ رَبِّهِمْ كَذَٰلِكَ يَضْرِبُ اللَّهُ لِلنَّاسِ أَمْثَالَهُمْ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ৪৭তম সূরা, মাদানি সূরা মুহাম্মাদের ১–৩ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>আলোচ্য আয়াতগুলোতে কাফির ও মুমিনদের কর্মের পরিণতি বর্ণনা করা হয়েছে। যারা আল্লাহর প্রতি অবিশ্বাস করে এবং মানুষকে তাঁর পথ থেকে বাধা দেয়, তাদের কর্ম নিষ্ফল হয়। পক্ষান্তরে যারা ঈমান আনে, সৎকর্ম করে এবং রাসুলুল্লাহ (সা.)-এর প্রতি নাজিলকৃত কুরআনকে সত্য বলে বিশ্বাস করে, আল্লাহ তাদের পাপ ক্ষমা করেন এবং তাদের অবস্থা সংশোধন করে দেন।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ১</div><p><b>অনুবাদ:</b> যারা কুফরি করে এবং মানুষকে আল্লাহর পথ থেকে বাধা দেয়, আল্লাহ তাদের কর্মসমূহ নিষ্ফল করে দেন।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে কাফিরদের পরিণতি বর্ণিত হয়েছে। যারা আল্লাহকে অস্বীকার করে এবং অন্যদের তাঁর পথে চলতে বাধা দেয়, তাদের কাজের প্রকৃত সাফল্য ও প্রতিদান নষ্ট হয়ে যায়।</p><div class=\"h\">আয়াত ২</div><p><b>অনুবাদ:</b> আর যারা ঈমান আনে, সৎকর্ম করে এবং মুহাম্মদ (সা.)-এর ওপর নাজিলকৃত কুরআনের প্রতি বিশ্বাস স্থাপন করে—যা তাদের প্রতিপালকের পক্ষ থেকে প্রেরিত সত্য—আল্লাহ তাদের পাপসমূহ ক্ষমা করেন এবং তাদের অবস্থা সংশোধন করে দেন।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে মুমিনদের মর্যাদা ও প্রতিদানের কথা বলা হয়েছে। যারা আন্তরিকভাবে ঈমান আনে, সৎকর্ম করে এবং কুরআনের নির্দেশ অনুসরণ করে, আল্লাহ তাদের পাপ ক্ষমা করেন এবং তাদের জীবন ও পরিণতি কল্যাণময় করেন।</p><div class=\"h\">আয়াত ৩</div><p><b>অনুবাদ:</b> এটা এ কারণে যে, যারা কুফরি করে তারা মিথ্যার অনুসরণ করে, আর যারা ঈমান আনে তারা তাদের প্রতিপালকের পক্ষ থেকে প্রেরিত সত্যের অনুসরণ করে। এভাবেই আল্লাহ মানুষের জন্য তাদের অবস্থা ও দৃষ্টান্ত বর্ণনা করেন।</p><p><b>ব্যাখ্যা:</b> এ আয়াতে কাফির ও মুমিনদের পথের পার্থক্য তুলে ধরা হয়েছে। কাফিররা বাতিলের অনুসরণ করে, আর মুমিনরা আল্লাহর পক্ষ থেকে প্রেরিত সত্যের অনুসরণ করে। এভাবে আল্লাহ তাআলা মানুষকে সত্য ও মিথ্যার পার্থক্য বুঝিয়ে দেন।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে ঈমান, সৎকর্ম এবং কুরআনের অনুসরণের গুরুত্ব তুলে ধরা হয়েছে। যারা সত্যকে গ্রহণ করে আল্লাহর নির্দেশ অনুযায়ী জীবন পরিচালনা করে, তারা ক্ষমা ও কল্যাণ লাভ করে। পক্ষান্তরে, যারা সত্য প্রত্যাখ্যান করে এবং মানুষকে আল্লাহর পথ থেকে বাধা দেয়, তাদের কর্ম নিষ্ফল হয়।</p>"]]},{"n":"সূরা আল-কাসাস","c":"#9333EA","q":[["<small class=\"yr\">সূরা আল-কাসাস, আয়াত ৬২–৬৪</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ تَزْعُمُونَ قَالَ الَّذِينَ حَقَّ عَلَيْهِمُ الْقَوْلُ رَبَّنَا هَٰؤُلَاءِ الَّذِينَ أَغْوَيْنَا أَغْوَيْنَاهُمْ كَمَا غَوَيْنَا تَبَرَّأْنَا إِلَيْكَ مَا كَانُوا إِيَّانَا يَعْبُدُونَ وَقِيلَ ادْعُوا شُرَكَاءَكُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا لَهُمْ وَرَأَوُا الْعَذَابَ لَوْ أَنَّهُمْ كَانُوا يَهْتَدُونَ</span>","<div class=\"h\">সংকলন তথ্য</div><p>আলোচ্য আয়াতগুলো আল-কুরআনের ২৮তম সূরা, মাক্কি সূরা আল-কাসাসের ৬২–৬৪ নম্বর আয়াত থেকে সংগৃহীত।</p><div class=\"h\">প্রসঙ্গ</div><p>মহান আল্লাহ তাআলা কিয়ামতের দিনের অবস্থা সম্পর্কে মানুষকে সতর্ক করেছেন। যারা দুনিয়াতে আল্লাহর পরিবর্তে অন্যদের উপাস্য মনে করত, কিয়ামতের দিন তাদের অসহায়ত্ব প্রকাশ পাবে। তাদের মিথ্যা উপাস্যরা কোনো সাহায্য করতে পারবে না এবং তারা নিজেদের কৃতকর্মের পরিণতি প্রত্যক্ষ করবে।</p><div class=\"h\">ব্যাখ্যামূলক অনুবাদ</div><div class=\"h\">আয়াত ৬২</div><p><b>অনুবাদ:</b> আর যেদিন আল্লাহ তাদের ডেকে বলবেন, ‘তোমরা যাদের আমার শরিক বলে মনে করতে, তারা কোথায়?’</p><p><b>ব্যাখ্যা:</b> এ আয়াতে কিয়ামতের দিনের কথা বলা হয়েছে। যারা দুনিয়াতে আল্লাহর সঙ্গে অন্যদের শরিক করত, সেদিন আল্লাহ তাদের সেই উপাস্যদের সম্পর্কে জিজ্ঞাসা করবেন। এর মাধ্যমে তাদের মিথ্যা বিশ্বাসের অসারতা প্রকাশ পাবে।</p><div class=\"h\">আয়াত ৬৩</div><p><b>অনুবাদ:</b> যাদের বিরুদ্ধে শাস্তির সিদ্ধান্ত অবধারিত হয়েছে, তারা বলবে, ‘হে আমাদের প্রতিপালক! এরাই তারা, যাদের আমরা পথভ্রষ্ট করেছিলাম। আমরা নিজেরাও পথভ্রষ্ট হয়েছিলাম, আর তাদেরও পথভ্রষ্ট করেছিলাম। আমরা আপনার কাছে তাদের থেকে সম্পর্কমুক্ত ঘোষণা করছি। তারা তো আমাদের উপাসনা করত না।’</p><p><b>ব্যাখ্যা:</b> এ আয়াতে পথভ্রষ্টকারী নেতাদের অসহায়ত্ব তুলে ধরা হয়েছে। কিয়ামতের দিন তারা নিজেদের অনুসারীদের দায় থেকে মুক্ত হতে চাইবে। কিন্তু দুনিয়াতে মানুষকে ভুল পথে পরিচালিত করার অপরাধ থেকে তারা রক্ষা পাবে না।</p><div class=\"h\">আয়াত ৬৪</div><p><b>অনুবাদ:</b> আর বলা হবে, ‘তোমরা যাদের আল্লাহর শরিক মনে করতে, তাদের ডাকো।’ তখন তারা তাদের ডাকবে, কিন্তু তারা তাদের ডাকে সাড়া দেবে না। আর তারা শাস্তি দেখতে পাবে। হায়! যদি তারা সঠিক পথ অনুসরণ করত!</p><p><b>ব্যাখ্যা:</b> এ আয়াতে কিয়ামতের দিন মিথ্যা উপাস্যদের অসহায়ত্ব বর্ণনা করা হয়েছে। তারা তাদের উপাসকদের কোনো সাহায্য করতে পারবে না। তখন অবিশ্বাসীরা শাস্তি প্রত্যক্ষ করে অনুতপ্ত হবে, কিন্তু তাদের অনুশোচনা কোনো কাজে আসবে না।</p><div class=\"h\">সমাপনী আলোচনা</div><p>আলোচ্য আয়াতগুলোতে শিরক ও পথভ্রষ্টতার ভয়াবহ পরিণতি তুলে ধরা হয়েছে। কিয়ামতের দিন মিথ্যা উপাস্যরা কাউকে সাহায্য করতে পারবে না। তাই প্রত্যেক মানুষের উচিত একমাত্র আল্লাহর ইবাদত করা, সত্যের অনুসরণ করা এবং দুনিয়াতেই নিজের ভুল সংশোধন করা।</p>"]]}],"বড় প্রশ্ন":[{"n":"উলূমুল কুরআন ও তাফসির","c":"#BE123C","q":[["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">تَحَدَّثْ عَنِ الْوَاجِبَاتِ وَالْقَوَانِينِ الِاجْتِمَاعِيَّةِ الْمَذْكُورَةِ فِي سُورَةِ الْحُجُرَاتِ.</span>সূরা আল-হুজুরাতে উল্লেখিত সামাজিক দায়িত্ব ও সামাজিক বিধানগুলো আলোচনা করো।","<div class=\"h\">ভূমিকা:</div><p>সূরা আল-হুজুরাত পবিত্র কুরআনের ৪৯তম সূরা। এ সূরায় মুসলিম সমাজের শিষ্টাচার, পারস্পরিক সম্পর্ক, ভ্রাতৃত্ব, ন্যায়বিচার, সংবাদ যাচাই, বিবাদ মীমাংসা এবং মানবিক মর্যাদা রক্ষার গুরুত্বপূর্ণ নির্দেশনা দেওয়া হয়েছে। একটি আদর্শ সমাজ গঠনের জন্য এসব বিধান অত্যন্ত গুরুত্বপূর্ণ। এ সূরা মানুষকে ব্যক্তিগত চরিত্র গঠনের পাশাপাশি সামাজিক দায়িত্ব পালনের শিক্ষাও দেয়।</p><div class=\"h\">সূরা আল-হুজুরাতে বর্ণিত সামাজিক দায়িত্ব ও বিধানসমূহ:</div><p><b>১. আল্লাহ ও রাসুলের নির্দেশ অনুসরণ</b></p><p>সূরা আল-হুজুরাতের শুরুতেই আল্লাহ ও তাঁর রাসুলের নির্দেশের আগে অগ্রসর না হওয়ার শিক্ষা দেওয়া হয়েছে। অর্থাৎ, মুসলমানদের জীবনের সিদ্ধান্ত ও আচরণে কুরআন ও সুন্নাহর নির্দেশকে প্রাধান্য দিতে হবে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُقَدِّمُوا بَيْنَ يَدَيِ اللَّهِ وَرَسُولِهِ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ</div><div class=\"tr\">“হে মুমিনগণ! তোমরা আল্লাহ ও তাঁর রাসুলের সামনে অগ্রগামী হয়ো না এবং আল্লাহকে ভয় করো। নিশ্চয়ই আল্লাহ সর্বশ্রোতা, সর্বজ্ঞ।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১</div></div><p>এ আয়াতের শিক্ষা হলো, ব্যক্তিগত মতামত, সামাজিক রীতি কিংবা আবেগের কারণে আল্লাহ ও রাসুলের নির্দেশ অমান্য করা যাবে না।</p><p><b>২. রাসুলুল্লাহ (সা.)-এর প্রতি সম্মান প্রদর্শন</b></p><p>এ সূরায় রাসুলুল্লাহ (সা.)-এর প্রতি সম্মান প্রদর্শন, তাঁর সামনে কণ্ঠস্বর উঁচু না করা এবং তাঁর সঙ্গে শিষ্টাচারপূর্ণ আচরণের নির্দেশ দেওয়া হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَرْفَعُوا أَصْوَاتَكُمْ فَوْقَ صَوْتِ النَّبِيِّ وَلَا تَجْهَرُوا لَهُ بِالْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ أَنْ تَحْبَطَ أَعْمَالُكُمْ وَأَنْتُمْ لَا تَشْعُرُونَ</div><div class=\"tr\">“হে মুমিনগণ! তোমরা নবীর কণ্ঠস্বরের ওপর নিজেদের কণ্ঠস্বর উঁচু করো না এবং তাঁর সঙ্গে এমন উচ্চস্বরে কথা বলো না, যেমন তোমরা পরস্পরের সঙ্গে উচ্চস্বরে কথা বলো; এতে তোমাদের অজান্তেই তোমাদের আমল নিষ্ফল হয়ে যেতে পারে।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ২</div></div><p>এ বিধান থেকে শিক্ষা পাওয়া যায় যে, সম্মানিত ব্যক্তিদের সঙ্গে ভদ্রতা বজায় রাখতে হবে এবং কথাবার্তায় শালীনতা অবলম্বন করতে হবে।</p><p><b>৩. সংবাদ যাচাই করা</b></p><p>সূরা আল-হুজুরাতে কোনো সংবাদ গ্রহণ বা প্রচার করার আগে তা যাচাই করার নির্দেশ দেওয়া হয়েছে। বিশেষ করে অবিশ্বস্ত ব্যক্তির কাছ থেকে কোনো সংবাদ এলে যাচাই না করে তার ভিত্তিতে সিদ্ধান্ত নেওয়া যাবে না।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ</div><div class=\"tr\">“হে মুমিনগণ! কোনো পাপাচারী ব্যক্তি তোমাদের কাছে কোনো সংবাদ নিয়ে এলে তোমরা তা যাচাই করে নাও, যাতে অজ্ঞতাবশত তোমরা কোনো সম্প্রদায়ের ক্ষতি করে না বসো এবং পরে নিজেদের কৃতকর্মের জন্য অনুতপ্ত না হও।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ৬</div></div><p>এ বিধান বর্তমান সময়েও অত্যন্ত প্রাসঙ্গিক। সামাজিক যোগাযোগমাধ্যমে কোনো খবর, অভিযোগ বা গুজব ছড়ানোর আগে সত্যতা যাচাই করা প্রত্যেকের সামাজিক দায়িত্ব।</p><p><b>৪. মুসলমানদের মধ্যে বিরোধ মীমাংসা করা</b></p><p>মুসলমানদের দুটি দল পরস্পরের সঙ্গে সংঘর্ষে লিপ্ত হলে তাদের মধ্যে ন্যায়সংগতভাবে মীমাংসা করার নির্দেশ দেওয়া হয়েছে। কোনো পক্ষ অন্যায় করলে অন্যায়কারী পক্ষকে অন্যায় থেকে বিরত রাখতে হবে এবং ন্যায়বিচারের ভিত্তিতে সমাধান করতে হবে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنْ طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا</div><div class=\"tr\">“মুমিনদের দুটি দল যুদ্ধে লিপ্ত হলে তোমরা তাদের মধ্যে মীমাংসা করে দাও।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ৯-এর অংশ</div></div><p>এ আয়াতের শিক্ষা হলো, সমাজে বিবাদ সৃষ্টি হলে তা বাড়িয়ে না দিয়ে শান্তিপূর্ণ সমাধানের চেষ্টা করতে হবে। বিরোধ নিষ্পত্তির ক্ষেত্রে আত্মীয়তা, দলীয় পরিচয় কিংবা ব্যক্তিগত স্বার্থের পরিবর্তে ন্যায়বিচারকে প্রাধান্য দিতে হবে।</p><p><b>৫. মুসলমানদের মধ্যে ভ্রাতৃত্ব প্রতিষ্ঠা</b></p><p>আল্লাহ তাআলা মুসলমানদের পরস্পর ভাই হিসেবে ঘোষণা করেছেন এবং তাদের মধ্যে সম্পর্ক সংশোধন করার নির্দেশ দিয়েছেন।</p><p>তিনি বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ</div><div class=\"tr\">“মুমিনগণ তো পরস্পর ভাই। সুতরাং তোমরা তোমাদের দুই ভাইয়ের মধ্যে মীমাংসা করে দাও এবং আল্লাহকে ভয় করো, যাতে তোমরা অনুগ্রহপ্রাপ্ত হও।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১০</div></div><p>এ আয়াত মুসলিম সমাজে ঐক্য, ভালোবাসা, সহযোগিতা ও পারস্পরিক দায়িত্ববোধের ভিত্তি স্থাপন করে। তাই মুসলমানদের মধ্যে শত্রুতা ও বিভেদ সৃষ্টি না করে ভ্রাতৃত্ব বজায় রাখতে হবে।</p><p><b>৬. উপহাস, অপমান ও কটূক্তি পরিহার</b></p><p>সূরা আল-হুজুরাতে অন্যকে উপহাস করা, দোষারোপ করা এবং অপমানজনক নামে ডাকার নিষেধাজ্ঞা রয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا لَا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ عَسَىٰ أَنْ يَكُونُوا خَيْرًا مِنْهُمْ وَلَا نِسَاءٌ مِنْ نِسَاءٍ عَسَىٰ أَنْ يَكُنَّ خَيْرًا مِنْهُنَّ وَلَا تَلْمِزُوا أَنْفُسَكُمْ وَلَا تَنَابَزُوا بِالْأَلْقَابِ</div><div class=\"tr\">“হে মুমিনগণ! কোনো সম্প্রদায় যেন অন্য সম্প্রদায়কে উপহাস না করে; হতে পারে তারা উপহাসকারীদের চেয়ে উত্তম। আর নারীরাও যেন অন্য নারীদের উপহাস না করে; হতে পারে তারা তাদের চেয়ে উত্তম। তোমরা পরস্পরের প্রতি দোষারোপ করো না এবং একে অপরকে মন্দ উপনামে ডেকো না।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১১-এর অংশ</div></div><p>এ বিধান অনুযায়ী মানুষের শারীরিক গঠন, আর্থিক অবস্থা, সামাজিক অবস্থান, বংশ, ভাষা কিংবা ব্যক্তিগত দুর্বলতা নিয়ে উপহাস করা যাবে না। প্রত্যেক মানুষের মর্যাদা রক্ষা করা সামাজিক দায়িত্ব।</p><p><b>৭. কুধারণা, গুপ্তচরবৃত্তি ও গিবত পরিহার</b></p><p>এ সূরায় অন্যের প্রতি অমূলক সন্দেহ, গোপন বিষয় অনুসন্ধান এবং পরনিন্দা করতে নিষেধ করা হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا اجْتَنِبُوا كَثِيرًا مِنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ وَلَا تَجَسَّسُوا وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا</div><div class=\"tr\">“হে মুমিনগণ! তোমরা অধিক ধারণা থেকে বেঁচে থাকো; নিশ্চয়ই কোনো কোনো ধারণা পাপ। আর তোমরা গোপন বিষয় অনুসন্ধান করো না এবং একে অপরের গিবত করো না।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১২-এর অংশ</div></div><p>এ বিধান মানুষের ব্যক্তিগত সম্মান, গোপনীয়তা ও সামাজিক সম্পর্ক রক্ষা করে। অন্যের ব্যাপারে প্রমাণ ছাড়া নেতিবাচক ধারণা পোষণ করা, ব্যক্তিগত বিষয় খুঁজে বেড়ানো এবং অনুপস্থিতিতে তার দোষ আলোচনা করা থেকে বিরত থাকতে হবে।</p><p><b>৮. জাতিগত ও বংশগত অহংকার পরিহার</b></p><p>আল্লাহ তাআলা মানুষকে বিভিন্ন জাতি ও গোত্রে বিভক্ত করেছেন, যাতে তারা পরস্পরকে চিনতে পারে; অহংকার বা শ্রেষ্ঠত্ব দাবি করার জন্য নয়।</p><p>তিনি বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُمْ مِنْ ذَكَرٍ وَأُنْثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ</div><div class=\"tr\">“হে মানুষ! নিশ্চয়ই আমি তোমাদের একজন পুরুষ ও একজন নারী থেকে সৃষ্টি করেছি এবং তোমাদের বিভিন্ন জাতি ও গোত্রে বিভক্ত করেছি, যাতে তোমরা পরস্পরকে চিনতে পারো। নিশ্চয়ই আল্লাহর কাছে তোমাদের মধ্যে সেই ব্যক্তিই অধিক সম্মানিত, যে তোমাদের মধ্যে অধিক তাকওয়াসম্পন্ন। নিশ্চয়ই আল্লাহ সর্বজ্ঞ, সবকিছুর খবর রাখেন।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১৩</div></div><p>এ আয়াতের মাধ্যমে বর্ণ, ভাষা, জাতি, গোত্র ও বংশের ভিত্তিতে অহংকার করার অবসান ঘটানো হয়েছে। আল্লাহর কাছে মর্যাদার প্রকৃত মাপকাঠি হলো তাকওয়া ও নৈতিকতা।</p><p><b>৯. প্রকৃত ঈমান ও আনুগত্যের গুরুত্ব</b></p><p>সূরা আল-হুজুরাতের শেষাংশে প্রকৃত ঈমানের পরিচয় এবং ঈমানের দাবির সঙ্গে কাজের সম্পর্ক তুলে ধরা হয়েছে। শুধু মুখে ঈমানের দাবি করাই যথেষ্ট নয়; অন্তরে বিশ্বাস ও বাস্তব জীবনে আনুগত্যের মাধ্যমে ঈমানের সত্যতা প্রকাশ পায়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ فِي سَبِيلِ اللَّهِ أُولَٰئِكَ هُمُ الصَّادِقُونَ</div><div class=\"tr\">“প্রকৃত মুমিন তো তারাই, যারা আল্লাহ ও তাঁর রাসুলের প্রতি ঈমান এনেছে, তারপর সন্দেহ পোষণ করেনি এবং নিজেদের ধন-সম্পদ ও জীবন দিয়ে আল্লাহর পথে সংগ্রাম করেছে। তারাই সত্যবাদী।”</div><div class=\"rf\">—সূরা আল-হুজুরাত: ১৫</div></div><p>এ আয়াত শিক্ষা দেয় যে, একজন মুসলমানের জীবনে ঈমান, আন্তরিকতা, আত্মত্যাগ এবং ন্যায়ের পক্ষে কাজ করার মানসিকতা থাকা উচিত।</p><p><b>১০. মানুষের মর্যাদা ও পারস্পরিক অধিকার রক্ষা</b></p><p>সূরা আল-হুজুরাতের সামাজিক বিধানগুলো একত্রে বিশ্লেষণ করলে বোঝা যায়, মানুষের সম্মান রক্ষা করা, অন্যায় থেকে বিরত থাকা, বিবাদ মীমাংসা করা, সত্য সংবাদ প্রচার করা এবং সমাজে ভ্রাতৃত্ব বজায় রাখা প্রত্যেক মুসলমানের গুরুত্বপূর্ণ দায়িত্ব। এসব বিধান পরিবার, শিক্ষাপ্রতিষ্ঠান, কর্মক্ষেত্র ও বৃহত্তর সমাজে শান্তিপূর্ণ সহাবস্থান নিশ্চিত করতে সহায়তা করে।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, সূরা আল-হুজুরাত মুসলিম সমাজের নৈতিকতা ও সামাজিক শৃঙ্খলা প্রতিষ্ঠার একটি গুরুত্বপূর্ণ দিকনির্দেশনা। এ সূরায় আল্লাহ ও রাসুলের নির্দেশ অনুসরণ, সংবাদ যাচাই, বিবাদ মীমাংসা, ভ্রাতৃত্ব প্রতিষ্ঠা, উপহাস ও গিবত পরিহার, ব্যক্তিগত গোপনীয়তা রক্ষা এবং জাতিগত অহংকার বর্জনের শিক্ষা দেওয়া হয়েছে। এসব বিধান যথাযথভাবে অনুসরণ করলে সমাজে ন্যায়বিচার, পারস্পরিক সম্মান, ঐক্য ও শান্তি প্রতিষ্ঠিত হতে পারে। তাই একটি আদর্শ মুসলিম সমাজ গঠনের জন্য সূরা আল-হুজুরাতের শিক্ষাগুলো ব্যক্তিগত ও সামাজিক জীবনে বাস্তবায়ন করা অপরিহার্য।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">تَحَدَّثْ عَنْ خَصَائِصِ الْمُفَسِّرِ وَشُرُوطِهِ.</span>মুফাসসিরের বৈশিষ্ট্য ও শর্তাবলি আলোচনা করো।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআন মহান আল্লাহ তাআলার পক্ষ থেকে মানবজাতির হিদায়াতের জন্য অবতীর্ণ সর্বশেষ আসমানি কিতাব। কুরআনের আয়াতসমূহের সঠিক অর্থ, মর্ম ও বিধান বুঝতে হলে নির্ভরযোগ্য তাফসিরের প্রয়োজন। যিনি প্রয়োজনীয় জ্ঞান ও যোগ্যতার ভিত্তিতে কুরআনের আয়াতসমূহের ব্যাখ্যা করেন, তাঁকে মুফাসসির বলা হয়। কুরআনের তাফসির একটি গুরুত্বপূর্ণ ও দায়িত্বপূর্ণ কাজ। তাই একজন মুফাসসিরের নির্দিষ্ট জ্ঞান, নৈতিক গুণাবলি ও যোগ্যতা থাকা অপরিহার্য।</p><div class=\"h\">মুফাসসিরের বৈশিষ্ট্য ও শর্তাবলি:</div><p><b>১. বিশুদ্ধ আকিদা, ঈমান ও তাকওয়া থাকা</b></p><p>একজন মুফাসসিরকে বিশুদ্ধ আকিদা ও দৃঢ় ঈমানের অধিকারী হতে হবে। তাঁকে আল্লাহ তাআলার প্রতি ভয়, আনুগত্য ও জবাবদিহির অনুভূতি নিয়ে কুরআনের ব্যাখ্যা করতে হবে। ব্যক্তিগত স্বার্থ, দলীয় পক্ষপাত কিংবা পূর্বনির্ধারিত মতবাদ প্রতিষ্ঠার জন্য কুরআনের অর্থ বিকৃত করা যাবে না।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَاتَّقُوا اللَّهَ وَيُعَلِّمُكُمُ اللَّهُ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ</div><div class=\"tr\">“তোমরা আল্লাহকে ভয় করো, আল্লাহ তোমাদের শিক্ষা দেবেন। আর আল্লাহ সব বিষয়ে সর্বজ্ঞ।”</div><div class=\"rf\">—সূরা আল-বাকারা: ২৮২-এর অংশ</div></div><p>এ আয়াত থেকে আল্লাহভীতি ও জ্ঞানের গুরুত্ব বোঝা যায়। একজন মুফাসসিরের মধ্যে তাকওয়া ও সততা থাকা জরুরি, যাতে তিনি নির্ভরযোগ্যভাবে কুরআনের শিক্ষা তুলে ধরতে পারেন।</p><p><b>২. আরবি ভাষা ও ভাষাগত শাস্ত্রে গভীর জ্ঞান থাকা</b></p><p>আল-কুরআন আরবি ভাষায় অবতীর্ণ হয়েছে। তাই একজন মুফাসসিরকে আরবি ভাষা, নাহু, সরফ, বালাগাত ও আরবি সাহিত্যে পর্যাপ্ত জ্ঞান অর্জন করতে হবে। কারণ একটি শব্দের অর্থ, বাক্যের গঠন কিংবা ভাষাগত বৈশিষ্ট্য না বুঝলে আয়াতের প্রকৃত বক্তব্য ভুলভাবে ব্যাখ্যা হওয়ার আশঙ্কা থাকে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَعَلَّكُمْ تَعْقِلُونَ</div><div class=\"tr\">“নিশ্চয়ই আমি একে আরবি কুরআনরূপে নাজিল করেছি, যাতে তোমরা বুঝতে পারো।”</div><div class=\"rf\">—সূরা ইউসুফ: ২</div></div><p>এই আয়াত প্রমাণ করে যে, কুরআনের ভাষা বোঝা তার বক্তব্য উপলব্ধির জন্য গুরুত্বপূর্ণ। তাই আরবি ভাষায় দক্ষতা একজন মুফাসসিরের অপরিহার্য যোগ্যতাগুলোর অন্যতম।</p><p><b>৩. কুরআন ও উলুমুল কুরআন সম্পর্কে জ্ঞান থাকা</b></p><p>একজন মুফাসসিরকে কুরআনের বিভিন্ন শাস্ত্রে জ্ঞানী হতে হবে। যেমন—মাক্কি ও মাদানি সূরা, আসবাবুন নুযুল, নাসিখ ও মানসুখ, মুহকাম ও মুতাশাবিহ, কিরাআত এবং আয়াতসমূহের পারস্পরিক সম্পর্ক। এসব বিষয়ে জ্ঞান থাকলে তিনি আয়াতের অবতরণকাল, উদ্দেশ্য ও বিধান সঠিকভাবে বুঝতে পারেন।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كِتَابٌ أَنْزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِيَدَّبَّرُوا آيَاتِهِ وَلِيَتَذَكَّرَ أُولُو الْأَلْبَابِ</div><div class=\"tr\">“এটি একটি বরকতময় কিতাব, যা আমি আপনার প্রতি নাজিল করেছি, যাতে তারা এর আয়াতসমূহ নিয়ে চিন্তা-ভাবনা করে এবং বুদ্ধিমানরা উপদেশ গ্রহণ করে।”</div><div class=\"rf\">—সূরা সাদ: ২৯</div></div><p>এ আয়াত কুরআনের আয়াত নিয়ে গভীর চিন্তা-ভাবনা করার গুরুত্ব তুলে ধরে। সঠিক তাফসিরের জন্য শুধু আয়াত পাঠ করাই যথেষ্ট নয়; বরং এর বিষয়বস্তু ও প্রাসঙ্গিক জ্ঞানও অর্জন করতে হয়।</p><p><b>৪. হাদিস ও সুন্নাহ সম্পর্কে পর্যাপ্ত জ্ঞান থাকা</b></p><p>রাসুলুল্লাহ (সা.) কুরআনের প্রথম ব্যাখ্যাকারী। তাঁর কথা, কাজ ও অনুমোদনের মাধ্যমে কুরআনের বহু আয়াতের ব্যাখ্যা স্পষ্ট হয়েছে। তাই একজন মুফাসসিরকে নির্ভরযোগ্য হাদিস, হাদিসের গ্রহণযোগ্যতা এবং কুরআনের ব্যাখ্যায় সুন্নাহর ভূমিকা সম্পর্কে জ্ঞান রাখতে হবে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَأَنْزَلْنَا إِلَيْكَ الذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ</div><div class=\"tr\">“আর আমি আপনার প্রতি উপদেশবাণী নাজিল করেছি, যাতে মানুষের প্রতি যা নাজিল করা হয়েছে, আপনি তাদের কাছে তা স্পষ্টভাবে বর্ণনা করেন।”</div><div class=\"rf\">—সূরা আন-নাহল: ৪৪</div></div><p>রাসুলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">بَلِّغُوا عَنِّي وَلَوْ آيَةً</div><div class=\"tr\">“আমার পক্ষ থেকে পৌঁছে দাও, যদিও তা একটি আয়াত হয়।”</div><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ৩৪৬১</div></div><p>এ আয়াত ও হাদিস থেকে কুরআনের শিক্ষা মানুষের কাছে পৌঁছে দেওয়ার গুরুত্ব বোঝা যায়। তবে তাফসির করার সময় হাদিসের বিশুদ্ধতা ও বক্তব্যের প্রাসঙ্গিকতা যাচাই করা আবশ্যক।</p><p><b>৫. ফিকহ, উসুলুল ফিকহ ও ইসলামী বিধান সম্পর্কে জ্ঞান থাকা</b></p><p>কুরআনে সালাত, সাওম, যাকাত, হজ, বিবাহ, তালাক, উত্তরাধিকার, লেনদেন এবং সামাজিক জীবন সম্পর্কে বিভিন্ন বিধান রয়েছে। এসব আয়াতের সঠিক ব্যাখ্যার জন্য ফিকহ ও উসুলুল ফিকহ সম্পর্কে জ্ঞান থাকা প্রয়োজন। এর মাধ্যমে একজন মুফাসসির বিধানের শর্ত, প্রয়োগের ক্ষেত্র এবং সাধারণ ও বিশেষ নির্দেশের পার্থক্য বুঝতে পারেন।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">فَاسْأَلُوا أَهْلَ الذِّكْرِ إِنْ كُنْتُمْ لَا تَعْلَمُونَ</div><div class=\"tr\">“যদি তোমরা না জানো, তবে জ্ঞানীদের জিজ্ঞাসা করো।”</div><div class=\"rf\">—সূরা আন-নাহল: ৪৩</div></div><p>এই আয়াত থেকে বোঝা যায়, কোনো বিষয়ে জ্ঞান না থাকলে বিশেষজ্ঞদের কাছ থেকে জ্ঞান গ্রহণ করতে হয়। তাফসিরের ক্ষেত্রেও সংশ্লিষ্ট শরয়ি জ্ঞান ও যোগ্যতা অর্জন করা অপরিহার্য।</p><p><b>৬. সাহাবি ও তাবেয়িদের ব্যাখ্যা সম্পর্কে জ্ঞান থাকা</b></p><p>সাহাবায়ে কিরাম সরাসরি রাসুলুল্লাহ (সা.)-এর কাছ থেকে কুরআনের শিক্ষা গ্রহণ করেছেন। তাঁদের মধ্যে হযরত আবদুল্লাহ ইবনে আব্বাস (রা.), হযরত আবদুল্লাহ ইবনে মাসউদ (রা.) এবং হযরত উবাই ইবনে কাব (রা.) তাফসিরের ক্ষেত্রে বিশেষভাবে পরিচিত। তাবেয়িদের ব্যাখ্যাও কুরআনের অর্থ উপলব্ধিতে গুরুত্বপূর্ণ ভূমিকা রাখে। তাই একজন মুফাসসিরকে তাঁদের নির্ভরযোগ্য ব্যাখ্যা ও প্রাসঙ্গিক মতামত সম্পর্কে জানতে হবে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ وَالَّذِينَ اتَّبَعُوهُمْ بِإِحْسَانٍ رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ</div><div class=\"tr\">“মুহাজির ও আনসারদের মধ্যে অগ্রগামী প্রথম ব্যক্তিগণ এবং যারা নিষ্ঠার সঙ্গে তাঁদের অনুসরণ করেছে, আল্লাহ তাঁদের প্রতি সন্তুষ্ট হয়েছেন এবং তাঁরাও তাঁর প্রতি সন্তুষ্ট হয়েছে।”</div><div class=\"rf\">—সূরা আত-তাওবা: ১০০-এর অংশ</div></div><p>এ আয়াত সাহাবি ও তাঁদের অনুসারীদের মর্যাদা তুলে ধরে। তাঁদের নির্ভরযোগ্য ব্যাখ্যা অধ্যয়ন করলে কুরআনের বক্তব্য ও প্রেক্ষাপট বুঝতে সুবিধা হয়।</p><p><b>৭. সততা, নিরপেক্ষতা ও গবেষণার মানসিকতা থাকা</b></p><p>একজন মুফাসসিরকে সত্যবাদী, আমানতদার, ধৈর্যশীল ও গবেষণামনস্ক হতে হবে। কোনো আয়াতের ব্যাখ্যা দেওয়ার আগে সংশ্লিষ্ট দলিল, ভাষাগত দিক, হাদিস এবং পূর্ববর্তী আলেমদের মতামত যাচাই করা জরুরি। মতভেদ থাকলে তা যথাযথভাবে উপস্থাপন করতে হবে। নিজের জ্ঞানের সীমাবদ্ধতা স্বীকার করা এবং প্রমাণ ছাড়া কোনো বক্তব্যকে আল্লাহর উদ্দেশ্য বলে চালিয়ে না দেওয়াও একজন মুফাসসিরের গুরুত্বপূর্ণ বৈশিষ্ট্য।</p><p>রাসুলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ</div><div class=\"tr\">“যে ব্যক্তি ইচ্ছাকৃতভাবে আমার নামে মিথ্যা বলবে, সে যেন জাহান্নামে তার স্থান নির্ধারণ করে নেয়।”</div><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ১০৯; সহিহ মুসলিম, হাদিস: ৩</div></div><p>যদিও এই হাদিসটি সরাসরি তাফসিরের শর্ত নিয়ে নয়, তবু দ্বীনি বক্তব্য ও রাসুলুল্লাহ (সা.)-এর নামে কথা বলার ক্ষেত্রে সত্যতা ও সতর্কতার গুরুত্ব স্পষ্ট করে।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, একজন মুফাসসিরের জন্য বিশুদ্ধ আকিদা, তাকওয়া, আরবি ভাষায় দক্ষতা, কুরআন ও হাদিসের জ্ঞান, উলুমুল কুরআন, ফিকহ এবং সাহাবি-তাবেয়িদের ব্যাখ্যা সম্পর্কে জ্ঞান থাকা অপরিহার্য। পাশাপাশি সততা, নিরপেক্ষতা ও গবেষণার মানসিকতা থাকতে হবে। এসব যোগ্যতার সমন্বয়েই একজন মুফাসসির কুরআনের অর্থ ও শিক্ষা নির্ভরযোগ্যভাবে মানুষের সামনে তুলে ধরতে পারেন।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">لِمَاذَا نَزَلَ الْقُرْآنُ نُجُومًا مُفَرَّقًا وَلَمْ يَنْزِلْ جُمْلَةً وَاحِدَةً كَالْكُتُبِ السَّمَاوِيَّةِ الْأُخْرَى؟</span>অন্যান্য আসমানি কিতাবের মতো কুরআন একসঙ্গে অবতীর্ণ না হয়ে ধাপে ধাপে অবতীর্ণ হয়েছে কেন?","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআন মহান আল্লাহ তাআলার সর্বশেষ আসমানি কিতাব, যা মানবজাতির হিদায়াতের জন্য হযরত মুহাম্মদ (সা.)-এর ওপর নাজিল হয়েছে। অন্যান্য আসমানি কিতাবের অবতরণের পদ্ধতির সঙ্গে কুরআনের অবতরণের পদ্ধতির পার্থক্য রয়েছে। আল-কুরআন একবারে নাজিল না হয়ে প্রায় তেইশ বছর ধরে বিভিন্ন সময়ে অল্প অল্প করে অবতীর্ণ হয়েছে। এর পেছনে বহু গুরুত্বপূর্ণ উদ্দেশ্য ও প্রজ্ঞা রয়েছে। নিম্নে কুরআন পর্যায়ক্রমে অবতীর্ণ হওয়ার কারণগুলো আলোচনা করা হলো।</p><div class=\"h\">মূল আলোচনা:</div><p><b>১. রাসুলুল্লাহ (সা.)-এর অন্তর দৃঢ় করা</b></p><p>কুরআন পর্যায়ক্রমে অবতীর্ণ হওয়ার অন্যতম প্রধান কারণ হলো রাসুলুল্লাহ (সা.)-এর অন্তরকে দৃঢ় করা। নবুওয়াতের দায়িত্ব পালন করতে গিয়ে তিনি কাফিরদের বিরোধিতা, নির্যাতন, উপহাস ও বিভিন্ন বাধার সম্মুখীন হয়েছেন। এসব পরিস্থিতিতে ওহি নাজিলের মাধ্যমে আল্লাহ তাআলা তাঁকে সান্ত্বনা, সাহস ও মানসিক শক্তি প্রদান করেছেন।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كَذَٰلِكَ لِنُثَبِّتَ بِهِ فُؤَادَكَ وَرَتَّلْنَاهُ تَرْتِيلًا</div><div class=\"tr\">“এভাবে (অল্প অল্প করে নাজিল করেছি), যাতে এর মাধ্যমে তোমার অন্তরকে দৃঢ় করতে পারি। আর আমি একে সুবিন্যস্তভাবে পাঠ করেছি।”</div><div class=\"rf\">—সূরা আল-ফুরকান: ৩২</div></div><p><b>২. কুরআন মুখস্থ ও সংরক্ষণ সহজ করা</b></p><p>কুরআন পর্যায়ক্রমে অবতীর্ণ হওয়ার ফলে রাসুলুল্লাহ (সা.) ও সাহাবায়ে কিরামের জন্য তা মুখস্থ করা, বোঝা এবং সংরক্ষণ করা সহজ হয়েছে। অল্প অল্প করে আয়াত নাজিল হওয়ায় সাহাবিরা সেগুলো মুখস্থ করার পাশাপাশি বাস্তব জীবনে প্রয়োগ করার সুযোগ পেয়েছেন। এভাবে কুরআন নির্ভুলভাবে সংরক্ষিত হয়েছে এবং পরবর্তী প্রজন্মের কাছে পৌঁছেছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِنْ مُدَّكِرٍ</div><div class=\"tr\">“আর অবশ্যই আমি কুরআনকে উপদেশ গ্রহণের জন্য সহজ করে দিয়েছি। অতএব, উপদেশ গ্রহণকারী কেউ আছে কি?”</div><div class=\"rf\">—সূরা আল-কামার: ১৭</div></div><p><b>৩. ধীরে ধীরে ইসলামের বিধান বাস্তবায়ন করা</b></p><p>মানুষের দীর্ঘদিনের অভ্যাস ও সামাজিক রীতিনীতি একসঙ্গে পরিবর্তন করা কঠিন। তাই আল্লাহ তাআলা পর্যায়ক্রমে বিধান নাজিল করেছেন, যাতে মানুষ ধীরে ধীরে ইসলামের শিক্ষা গ্রহণ ও পালন করতে পারে।</p><p>এর উল্লেখযোগ্য উদাহরণ হলো মদ নিষিদ্ধ হওয়া। প্রথমে মদের ক্ষতি সম্পর্কে জানানো হয়, পরে নেশাগ্রস্ত অবস্থায় সালাত আদায় করতে নিষেধ করা হয় এবং শেষপর্যায়ে মদ থেকে সম্পূর্ণ বিরত থাকার নির্দেশ দেওয়া হয়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنْصَابُ وَالْأَزْلَامُ رِجْسٌ مِنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ</div><div class=\"tr\">“হে মুমিনগণ! নিশ্চয়ই মদ, জুয়া, পূজার বেদি ও ভাগ্য নির্ধারক তীর অপবিত্র, শয়তানের কাজ। সুতরাং তোমরা এগুলো থেকে বিরত থাকো, যাতে তোমরা সফলকাম হতে পারো।”</div><div class=\"rf\">—সূরা আল-মায়িদা: ৯০</div></div><p><b>৪. বিভিন্ন ঘটনা ও সমস্যার সমাধান প্রদান</b></p><p>রাসুলুল্লাহ (সা.)-এর নবুওয়াতের সময় মুসলিম সমাজে বিভিন্ন ঘটনা ও সমস্যা দেখা দিয়েছিল। এসব ঘটনার প্রেক্ষাপটে ওহি নাজিল হয়ে সঠিক দিকনির্দেশনা প্রদান করেছে। ফলে মুসলমানরা বাস্তব পরিস্থিতিতে আল্লাহর বিধান জানতে ও সে অনুযায়ী সিদ্ধান্ত নিতে পেরেছেন।</p><p>উদাহরণস্বরূপ, হযরত আয়েশা (রা.)-এর বিরুদ্ধে অপবাদের ঘটনার পর সূরা আন-নূরের আয়াত নাজিল হয়। এতে অপবাদ, সাক্ষ্য-প্রমাণ এবং সামাজিক নৈতিকতা সম্পর্কে গুরুত্বপূর্ণ বিধান দেওয়া হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ الَّذِينَ جَاءُوا بِالْإِفْكِ عُصْبَةٌ مِنْكُمْ</div><div class=\"tr\">“নিশ্চয়ই যারা অপবাদ রটনা করেছে, তারা তোমাদেরই একটি দল।”</div><div class=\"rf\">—সূরা আন-নূর: ১১-এর অংশ</div></div><p><b>৫. কাফিরদের আপত্তির জবাব প্রদান</b></p><p>মক্কার কাফিররা আপত্তি করেছিল যে, কুরআন একবারে অবতীর্ণ হলো না কেন। আল্লাহ তাআলা তাদের এই আপত্তির জবাবে কুরআন পর্যায়ক্রমে নাজিল করার প্রজ্ঞা ব্যাখ্যা করেছেন।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقَالَ الَّذِينَ كَفَرُوا لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً كَذَٰلِكَ لِنُثَبِّتَ بِهِ فُؤَادَكَ وَرَتَّلْنَاهُ تَرْتِيلًا</div><div class=\"tr\">“আর কাফিররা বলে, তার ওপর সমগ্র কুরআন একবারে নাজিল করা হলো না কেন? এভাবে (নাজিল করেছি), যাতে এর মাধ্যমে তোমার অন্তরকে দৃঢ় করতে পারি। আর আমি একে সুবিন্যস্তভাবে পাঠ করেছি।”</div><div class=\"rf\">—সূরা আল-ফুরকান: ৩২</div></div><p><b>৬. সাহাবায়ে কিরামকে শিক্ষা ও প্রশিক্ষণ প্রদান</b></p><p>কুরআন পর্যায়ক্রমে অবতীর্ণ হওয়ার ফলে সাহাবায়ে কিরাম প্রতিটি আয়াতের শিক্ষা গ্রহণ, তা বোঝা এবং সে অনুযায়ী আমল করার সুযোগ পেয়েছেন। তাঁরা শুধু কুরআন তিলাওয়াত করতেন না; বরং এর বিধান নিজেদের জীবনে বাস্তবায়ন করতেন। এভাবে তাঁদের ঈমান, চরিত্র, ইবাদত ও নৈতিকতার উন্নতি ঘটেছে।</p><p><b>৭. মুসলিম সমাজকে ধাপে ধাপে গড়ে তোলা</b></p><p>ইসলাম একটি পূর্ণাঙ্গ জীবনব্যবস্থা। প্রথমে তাওহিদ, রিসালাত ও আখিরাতের বিশ্বাস প্রতিষ্ঠিত হয়েছে। এরপর ইবাদত, পারিবারিক জীবন, সামাজিক সম্পর্ক, অর্থনীতি এবং অন্যান্য বিষয়ে বিস্তারিত বিধান নাজিল হয়েছে। ফলে মুসলমানরা পর্যায়ক্রমে ইসলামের পূর্ণাঙ্গ জীবনব্যবস্থা গ্রহণ করার সুযোগ পেয়েছেন।</p><p><b>৮. কুরআনকে সুবিন্যস্তভাবে শিক্ষা ও তিলাওয়াতের সুযোগ সৃষ্টি করা</b></p><p>কুরআন পর্যায়ক্রমে অবতীর্ণ হওয়ার ফলে রাসুলুল্লাহ (সা.) মানুষের কাছে ধীরে ধীরে আয়াত তিলাওয়াত করতে পেরেছেন। মানুষ আয়াতগুলো বুঝতে, মুখস্থ করতে এবং তার নির্দেশনা অনুসরণ করতে পেরেছে। এর ফলে কুরআনের শিক্ষা ব্যক্তি ও সমাজজীবনে কার্যকরভাবে প্রতিষ্ঠিত হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَىٰ مُكْثٍ وَنَزَّلْنَاهُ تَنْزِيلًا</div><div class=\"tr\">“আর কুরআনকে আমি পৃথক পৃথকভাবে নাজিল করেছি, যাতে তুমি তা মানুষের কাছে ধীরে ধীরে পাঠ করো। আর আমি তা পর্যায়ক্রমে অবতীর্ণ করেছি।”</div><div class=\"rf\">—সূরা আল-ইসরা: ১০৬</div></div><p><b>৯. পূর্ববর্তী আসমানি কিতাবের অবতরণপদ্ধতি থেকে স্বাতন্ত্র্য প্রকাশ</b></p><p>পূর্ববর্তী আসমানি কিতাবগুলোর অবতরণের পদ্ধতি কুরআনের মতো ছিল না। বিশেষত তাওরাতের ফলক প্রদানের কথা কুরআনে উল্লেখ রয়েছে। তবে সব পূর্ববর্তী আসমানি কিতাব একবারেই অবতীর্ণ হয়েছিল—এমন সাধারণ সিদ্ধান্ত দেওয়া যথাযথ নয়। কুরআনের পর্যায়ক্রমিক অবতরণ ছিল আল্লাহ তাআলার নির্ধারিত বিশেষ ব্যবস্থা, যা নবুওয়াতের দীর্ঘ সময়জুড়ে বিভিন্ন পরিস্থিতিতে প্রয়োজনীয় দিকনির্দেশনা দিয়েছে।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, আল-কুরআন পর্যায়ক্রমে অবতীর্ণ হওয়া মহান আল্লাহ তাআলার অসীম প্রজ্ঞার পরিচায়ক। এর মাধ্যমে রাসুলুল্লাহ (সা.)-এর অন্তর দৃঢ় হয়েছে, কুরআন মুখস্থ ও সংরক্ষণ সহজ হয়েছে, ইসলামের বিধান বাস্তবায়ন সহজ হয়েছে এবং বিভিন্ন ঘটনা ও সমস্যার সমাধান পাওয়া গেছে। পাশাপাশি সাহাবায়ে কিরামের শিক্ষা, প্রশিক্ষণ ও মুসলিম সমাজ গঠনেও এর গুরুত্বপূর্ণ ভূমিকা রয়েছে। সুতরাং কুরআনের পর্যায়ক্রমিক অবতরণ মানবজাতির হিদায়াত ও পূর্ণাঙ্গ জীবনব্যবস্থা প্রতিষ্ঠার জন্য আল্লাহ তাআলার এক মহান প্রজ্ঞাপূর্ণ ব্যবস্থা।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">مَا الْمُرَادُ بِأَسْبَابِ النُّزُولِ، وَمَا أَهَمِّيَّتُهَا، وَمَا الْفَائِدَةُ فِي مَعْرِفَتِهَا؟</span>শানে নুযুল বলতে কী বোঝায়? এর গুরুত্ব কী এবং তা জানার উপকারিতা কী?","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআন মানবজাতির হিদায়াতের জন্য মহান আল্লাহর পক্ষ থেকে অবতীর্ণ সর্বশেষ আসমানি কিতাব। কুরআনের বহু আয়াত বিভিন্ন ঘটনা, প্রশ্ন, সমস্যা ও পরিস্থিতির প্রেক্ষাপটে নাযিল হয়েছে। যেসব ঘটনা বা পরিস্থিতিকে কেন্দ্র করে কোনো আয়াত বা কয়েকটি আয়াত অবতীর্ণ হয়েছে, সেগুলোকে আসবাবে নুযূল বলা হয়। কুরআনের আয়াতের সঠিক অর্থ অনুধাবন, বিধান বোঝা এবং নাযিলের প্রেক্ষাপট জানার জন্য আসবাবে নুযূলের জ্ঞান অত্যন্ত গুরুত্বপূর্ণ।</p><div class=\"h\">আসবাবে নুযূলের পরিচয়:</div><div class=\"h\">আসবাবে নুযূলের আভিধানিক অর্থ:</div><p>أسباب النزول শব্দটি দুটি আরবি শব্দের সমন্বয়ে গঠিত।</p><p><b>১. أسباب (আসবাব):</b> এটি سبب (সাবাব) শব্দের বহুবচন। এর অর্থ হলো উপায়, কারণ, উপলক্ষ বা মাধ্যম।</p><p><b>২. النزول (আন-নুযূল):</b> এর অর্থ হলো অবতরণ, নেমে আসা বা অবতীর্ণ হওয়া।</p><p>সুতরাং, أسباب النزول-এর আভিধানিক অর্থ হলো অবতরণের কারণসমূহ বা নাযিল হওয়ার উপলক্ষসমূহ।</p><div class=\"h\">আসবাবে নুযূলের পারিভাষিক সংজ্ঞা:</div><p>কুরআনের কোনো আয়াত বা কয়েকটি আয়াত নাযিল হওয়ার সময় যে বিশেষ ঘটনা ঘটেছিল, কোনো প্রশ্ন উত্থাপিত হয়েছিল অথবা যে পরিস্থিতির পরিপ্রেক্ষিতে আয়াত নাযিল হয়েছিল, তাকে আসবাবে নুযূল বলা হয়।</p><p>ইমাম সুয়ূতী (রহ.)-সহ উলূমুল কুরআনের আলেমগণ আসবাবে নুযূলের আলোচনায় আয়াত অবতরণের সঙ্গে সংশ্লিষ্ট ঘটনা ও প্রশ্নের বিবরণকে গুরুত্ব দিয়েছেন।</p><p>উদাহরণস্বরূপ, একবার এক সাহাবি রাসুলুল্লাহ (সা.)-এর কাছে সফরে নামাজ সংক্ষিপ্ত করার বিধান সম্পর্কে জানতে চান। এ ধরনের প্রশ্ন ও ঘটনার প্রেক্ষাপটে কুরআনের কোনো বিধান নাযিল হলে সংশ্লিষ্ট ঘটনা আসবাবে নুযূলের আলোচনার অন্তর্ভুক্ত হয়।</p><div class=\"h\">আসবাবে নুযূলের গুরুত্ব:</div><p>আসবাবে নুযূলের জ্ঞান কুরআন বোঝার একটি গুরুত্বপূর্ণ মাধ্যম। এর গুরুত্ব নিম্নে আলোচনা করা হলো।</p><p><b>১. কুরআনের আয়াতের সঠিক অর্থ অনুধাবন</b></p><p>আসবাবে নুযূল জানলে কোনো আয়াতের প্রকৃত বক্তব্য ও উদ্দেশ্য বুঝতে সুবিধা হয়। কোনো আয়াতের অর্থ বাহ্যিকভাবে অস্পষ্ট মনে হলে তার নাযিলের প্রেক্ষাপট জানার মাধ্যমে অর্থ পরিষ্কার হতে পারে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَلَا تَحْسَبَنَّ الَّذِينَ يَفْرَحُونَ بِمَا أَتَوْا وَيُحِبُّونَ أَنْ يُحْمَدُوا بِمَا لَمْ يَفْعَلُوا فَلَا تَحْسَبَنَّهُمْ بِمَفَازَةٍ مِنَ الْعَذَابِ</div><div class=\"tr\">“যারা নিজেদের কৃতকর্মে আনন্দিত হয় এবং নিজেরা যা করেনি, সে জন্য প্রশংসিত হতে ভালোবাসে, তুমি তাদের শাস্তি থেকে মুক্ত মনে করো না।”</div><div class=\"rf\">—সূরা আলে ইমরান: ১৮৮</div></div><p>এ আয়াতের নাযিলের প্রেক্ষাপট সম্পর্কে বর্ণনাগুলো জানলে এর উদ্দেশ্য ও যাদের সম্পর্কে আয়াতটি আলোচিত হয়েছে, তাদের অবস্থা বুঝতে সুবিধা হয়।</p><p><b>২. কুরআনের বিধান বোঝার ক্ষেত্রে সহায়তা</b></p><p>অনেক সময় কোনো আয়াতের পেছনে বিশেষ ঘটনা বা প্রশ্ন থাকে। সেই প্রেক্ষাপট জানা থাকলে আয়াতের বিধান, প্রয়োগের ক্ষেত্র এবং উদ্দেশ্য অনুধাবন করা সহজ হয়। বিশেষ করে ফিকহি বিধানসংক্রান্ত আয়াতের ব্যাখ্যায় আসবাবে নুযূল গুরুত্বপূর্ণ ভূমিকা পালন করে।</p><p><b>৩. আয়াতের অস্পষ্টতা দূর করা</b></p><p>কোনো আয়াতের শব্দ বা বক্তব্যের অর্থ একাধিকভাবে বোঝার সম্ভাবনা থাকলে তার নাযিলের কারণ অর্থ নির্ধারণে সহায়তা করতে পারে। এর ফলে ভুল ব্যাখ্যা ও বিভ্রান্তি থেকে রক্ষা পাওয়া যায়।</p><p><b>৪. কুরআনের ঐতিহাসিক প্রেক্ষাপট জানা</b></p><p>আসবাবে নুযূলের মাধ্যমে রাসুলুল্লাহ (সা.)-এর যুগের বিভিন্ন ঘটনা, সাহাবিদের প্রশ্ন, মুসলিম সমাজের সমস্যা এবং ইসলামের প্রাথমিক যুগের পরিস্থিতি সম্পর্কে জানা যায়। ফলে কুরআনের বক্তব্যের সঙ্গে তৎকালীন সমাজের সম্পর্ক স্পষ্ট হয়।</p><p><b>৫. কুরআনের হিদায়াত ও শিক্ষা উপলব্ধি</b></p><p>আয়াত নাযিলের পেছনের ঘটনা জানলে আল্লাহ তাআলা কেন কোনো নির্দেশ দিয়েছেন, কেন কোনো ভুলের সংশোধন করেছেন অথবা কেন কোনো প্রশ্নের উত্তর দিয়েছেন—তা অনুধাবন করা সহজ হয়। এতে কুরআনের শিক্ষা বাস্তব জীবনে প্রয়োগ করা যায়।</p><p><b>৬. তাফসির ও ইজতিহাদের ক্ষেত্রে সহায়তা</b></p><p>মুফাসসিরগণ কুরআনের আয়াত ব্যাখ্যা করার সময় নির্ভরযোগ্য আসবাবে নুযূলের বর্ণনা বিবেচনা করেন। কোনো বিধানের প্রেক্ষাপট জানা থাকলে তার অর্থ ও প্রয়োগ সম্পর্কে সঠিক সিদ্ধান্তে পৌঁছানো সহজ হয়। তবে শুধু নাযিলের বিশেষ ঘটনা জানলেই বিধানের পরিধি সীমাবদ্ধ হয়ে যায় না; এ ক্ষেত্রে আরবি ভাষা, অন্যান্য আয়াত, হাদিস ও উসূলুত তাফসিরের নীতিও বিবেচনা করতে হয়।</p><p><b>৭. রাসুলুল্লাহ (সা.) ও সাহাবিদের জীবন সম্পর্কে জ্ঞান লাভ</b></p><p>আসবাবে নুযূলের বর্ণনা থেকে রাসুলুল্লাহ (সা.)-এর দাওয়াতি জীবন, সাহাবিদের জিজ্ঞাসা, তাঁদের সমস্যা এবং আল্লাহর পক্ষ থেকে প্রাপ্ত দিকনির্দেশনা সম্পর্কে জানা যায়। এটি ইসলামের ইতিহাস ও সীরাত অধ্যয়নেও গুরুত্বপূর্ণ।</p><div class=\"h\">আসবাবে নুযূল জানার উপকারিতা:</div><p>আসবাবে নুযূলের গুরুত্বের পাশাপাশি এর কয়েকটি বিশেষ উপকারিতা রয়েছে।</p><p><b>১. আয়াতের উদ্দেশ্য নির্ধারণে সহায়তা</b></p><p>আয়াত কোন পরিস্থিতিতে নাযিল হয়েছে তা জানলে এর মূল উদ্দেশ্য উপলব্ধি করা যায়। ফলে আয়াতের বক্তব্যকে ভুলভাবে ব্যাখ্যা করার আশঙ্কা কমে।</p><p><b>২. সাধারণ ও বিশেষ বক্তব্যের সম্পর্ক বোঝা</b></p><p>কোনো আয়াত বিশেষ ঘটনা উপলক্ষে নাযিল হলেও তার শব্দাবলি সাধারণ অর্থ বহন করতে পারে। উসূলুল ফিকহের একটি প্রসিদ্ধ নীতি হলো—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">العبرة بعموم اللفظ لا بخصوص السبب</div><div class=\"tr\">“বিবেচ্য হলো শব্দের সাধারণ ব্যাপকতা, শুধু নাযিলের বিশেষ কারণ নয়।”</div></div><p>অর্থাৎ, কোনো আয়াত বিশেষ ঘটনার প্রেক্ষাপটে নাযিল হলেও তার বক্তব্য সাধারণ হলে বিধান সাধারণ ক্ষেত্রেও প্রযোজ্য হতে পারে। তবে আয়াতের শব্দ, অন্যান্য দলিল এবং শরিয়তের নীতিমালা বিবেচনা করে বিষয়টি নির্ধারণ করতে হয়।</p><p><b>৩. ভুল ব্যাখ্যা থেকে রক্ষা পাওয়া</b></p><p>নাযিলের প্রেক্ষাপট না জানলে কোনো আয়াতকে ভুল সময়ে বা ভুল পরিস্থিতিতে প্রয়োগ করার আশঙ্কা থাকে। আসবাবে নুযূলের জ্ঞান এ ধরনের ভুল কমাতে সাহায্য করে।</p><p><b>৪. কুরআনের বিধানের প্রজ্ঞা উপলব্ধি</b></p><p>কোনো বিধান কোন পরিস্থিতিতে নাযিল হয়েছে তা জানলে সেই বিধানের প্রয়োজনীয়তা ও কল্যাণ বোঝা যায়। এতে আল্লাহর বিধানের প্রতি বিশ্বাস ও আনুগত্য বৃদ্ধি পায়।</p><p><b>৫. কুরআন অধ্যয়নে আগ্রহ বৃদ্ধি</b></p><p>আসবাবে নুযূলের বিবরণ কুরআনের আয়াতের সঙ্গে সংশ্লিষ্ট বাস্তব ঘটনা তুলে ধরে। ফলে কুরআন অধ্যয়ন আরও অর্থবহ হয় এবং শিক্ষার্থীরা আয়াতের শিক্ষা সহজে উপলব্ধি করতে পারে।</p><p><b>৬. তাফসিরের নির্ভরযোগ্যতা যাচাই</b></p><p>আসবাবে নুযূলের বর্ণনা যাচাই করার মাধ্যমে কোন ব্যাখ্যাটি নির্ভরযোগ্য বর্ণনার ওপর প্রতিষ্ঠিত এবং কোনটি দুর্বল বা ভিত্তিহীন—তা বোঝার সুযোগ তৈরি হয়। কারণ, আসবাবে নুযূলের ক্ষেত্রে শুধু প্রচলিত কাহিনি গ্রহণ করা যায় না; বরং নির্ভরযোগ্য সূত্র ও বর্ণনার বিশুদ্ধতা যাচাই করা জরুরি।</p><p><b>৭. কুরআনের সঙ্গে বাস্তব জীবনের সম্পর্ক স্থাপন</b></p><p>আসবাবে নুযূলের জ্ঞান মানুষকে বুঝতে সাহায্য করে যে কুরআন শুধু তিলাওয়াতের গ্রন্থ নয়; বরং মানুষের ব্যক্তিগত, সামাজিক ও নৈতিক জীবনের দিকনির্দেশনাও প্রদান করে। এর ফলে কুরআনের শিক্ষা বাস্তব জীবনে অনুসরণের আগ্রহ বৃদ্ধি পায়।</p><div class=\"h\">আসবাবে নুযূল জানার উৎস ও সতর্কতা:</div><p>আসবাবে নুযূল জানার প্রধান উৎস হলো রাসুলুল্লাহ (সা.)-এর হাদিস এবং সাহাবিদের নির্ভরযোগ্য বর্ণনা। কারণ, সাহাবিগণ কুরআন নাযিলের সময়কার ঘটনা প্রত্যক্ষ করেছেন এবং অনেক ক্ষেত্রে তাঁরা সরাসরি নাযিলের প্রেক্ষাপট বর্ণনা করেছেন।</p><p>এ বিষয়ে কয়েকটি সতর্কতা জরুরি—</p><p>প্রথমত, আসবাবে নুযূলের বর্ণনা গ্রহণের ক্ষেত্রে হাদিসের সনদ ও বিশুদ্ধতা যাচাই করতে হবে।</p><p>দ্বিতীয়ত, কোনো আয়াতের সঙ্গে সম্পর্কিত ঘটনা পাওয়া গেলেই সেটিকে নিশ্চিতভাবে নাযিলের কারণ বলা যাবে না; বর্ণনায় তার স্পষ্ট প্রমাণ থাকতে হবে।</p><p>তৃতীয়ত, একটি আয়াতের একাধিক নাযিল-প্রেক্ষাপটের বর্ণনা পাওয়া গেলে সেগুলোর মধ্যে সমন্বয়, বর্ণনার মান এবং সময়ের সম্পর্ক বিবেচনা করতে হবে।</p><p>চতুর্থত, আসবাবে নুযূলের জ্ঞান কুরআনের ব্যাখ্যার একটি গুরুত্বপূর্ণ মাধ্যম হলেও এটিই একমাত্র মাধ্যম নয়। কুরআনের অন্যান্য আয়াত, রাসুলুল্লাহ (সা.)-এর সুন্নাহ, আরবি ভাষা এবং নির্ভরযোগ্য তাফসিরের আলোকে আয়াতের অর্থ নির্ধারণ করতে হয়।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, আসবাবে নুযূল হলো কুরআনের আয়াত অবতরণের সঙ্গে সংশ্লিষ্ট ঘটনা, প্রশ্ন ও পরিস্থিতির জ্ঞান। কুরআনের সঠিক অর্থ অনুধাবন, বিধানের উদ্দেশ্য উপলব্ধি, ঐতিহাসিক প্রেক্ষাপট জানা এবং নির্ভরযোগ্য তাফসির রচনার ক্ষেত্রে এর গুরুত্ব অপরিসীম। তবে আসবাবে নুযূলের বর্ণনা অবশ্যই নির্ভরযোগ্য সূত্র থেকে গ্রহণ করতে হবে এবং কুরআনের অন্যান্য ব্যাখ্যামূলক দলিলের সঙ্গে সমন্বয় করে বুঝতে হবে। তাই কুরআনের গভীর জ্ঞান অর্জন করতে হলে আসবাবে নুযূল অধ্যয়ন করা অত্যন্ত জরুরি।</p>"],["<small class=\"yr\">সাল: ২০২২, ২০১৯, ২০১৭</small><span class=\"aq\" dir=\"rtl\" lang=\"ar\">مَا مَعْنَى الْقُرْآنِ لُغَةً وَاصْطِلَاحًا؟ اذْكُرْ وُجُوهَ إِعْجَازِهِ مُفَصَّلًا.</span>কুরআনের আভিধানিক ও পারিভাষিক অর্থ কী? এর অলৌকিকতার দিকগুলো বিস্তারিত আলোচনা করো।","<div class=\"h\">ভূমিকা:</div><p>আল-কুরআন মহান আল্লাহ তাআলার সর্বশেষ আসমানি কিতাব, যা মানবজাতির হিদায়াতের জন্য হযরত মুহাম্মদ (সা.)-এর ওপর অবতীর্ণ হয়েছে। এটি ইসলামের মূল সংবিধান এবং মুসলমানদের জীবন পরিচালনার প্রধান উৎস। আল-কুরআন ভাষা, সাহিত্য, জ্ঞান, বিধান ও নৈতিকতার ক্ষেত্রে অনন্য বৈশিষ্ট্যের অধিকারী। এর অলৌকিক বৈশিষ্ট্যকে আরবি পরিভাষায় إِعْجَازُ الْقُرْآنِ (ই‘জাযুল কুরআন) বলা হয়। নিম্নে আল-কুরআনের আভিধানিক ও পারিভাষিক অর্থ এবং এর ই‘জাযের দিকগুলো বিস্তারিত আলোচনা করা হলো।</p><div class=\"h\">আল-কুরআনের আভিধানিক অর্থ:</div><p>الْقُرْآن শব্দটি আরবি قَرَأَ ধাতু থেকে উদ্ভূত। এর আভিধানিক অর্থ কয়েকটি—</p><p><b>১. পাঠ করা:</b> কোনো কিছু পড়া বা পাঠ করা।</p><p><b>২. তিলাওয়াত করা:</b> বিশেষভাবে কুরআন বা কোনো পাঠযোগ্য বিষয় আবৃত্তি করা।</p><p><b>৩. একত্রিত করা:</b> বিভিন্ন বিষয় বা অংশকে একত্র করা।</p><p>অধিকাংশ ভাষাবিদের মতে, আল-কুরআন শব্দের মূল অর্থ পাঠ করা বা তিলাওয়াত করা।</p><div class=\"h\">আল-কুরআনের পারিভাষিক অর্থ:</div><p>পারিভাষিক অর্থে, আল-কুরআন হলো মহান আল্লাহর কালাম, যা ফেরেশতা জিবরাইল (আ.)-এর মাধ্যমে শেষ নবী হযরত মুহাম্মদ (সা.)-এর ওপর আরবি ভাষায় অবতীর্ণ হয়েছে; যা মুসহাফে লিপিবদ্ধ, ধারাবাহিক বর্ণনার মাধ্যমে সংরক্ষিত, তিলাওয়াত করা ইবাদত এবং সূরা আল-ফাতিহা দিয়ে শুরু ও সূরা আন-নাস দিয়ে শেষ হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div><div class=\"tr\">“নিশ্চয়ই আমিই এ উপদেশবাণী নাজিল করেছি এবং আমিই এর সংরক্ষক।”</div><div class=\"rf\">—সূরা আল-হিজর: ৯</div></div><p>এ আয়াত থেকে বোঝা যায়, আল-কুরআন আল্লাহর পক্ষ থেকে অবতীর্ণ এবং আল্লাহ তাআলা নিজেই এর সংরক্ষণের দায়িত্ব গ্রহণ করেছেন।</p><div class=\"h\">আল-কুরআনের ই‘জাযের অর্থ:</div><p>إِعْجَاز শব্দটি عَجَزَ ধাতু থেকে উদ্ভূত। এর অর্থ কাউকে অক্ষম করে দেওয়া। পরিভাষায়, আল-কুরআনের এমন অনন্য বৈশিষ্ট্যকে ই‘জায বলা হয়, যার সমতুল্য কোনো গ্রন্থ বা বক্তব্য উপস্থাপন করতে মানুষ অক্ষম। আল-কুরআন যে মহান আল্লাহর বাণী এবং রাসুলুল্লাহ (সা.)-এর সত্য নবুওয়াতের প্রমাণ, তার অন্যতম নিদর্শন হলো এর ই‘জায।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">قُلْ لَئِنِ اجْتَمَعَتِ الْإِنْسُ وَالْجِنُّ عَلَىٰ أَنْ يَأْتُوا بِمِثْلِ هَٰذَا الْقُرْآنِ لَا يَأْتُونَ بِمِثْلِهِ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍ ظَهِيرًا</div><div class=\"tr\">“বলুন, যদি মানুষ ও জিন সবাই এ কুরআনের অনুরূপ কিছু নিয়ে আসার জন্য একত্রিত হয়, তবুও তারা এর অনুরূপ কিছু আনতে পারবে না, যদিও তারা একে অপরের সাহায্যকারী হয়।”</div><div class=\"rf\">—সূরা আল-ইসরা: ৮৮</div></div><div class=\"h\">আল-কুরআনের ই‘জাযের দিকসমূহ:</div><p><b>১. ভাষাগত সৌন্দর্য ও সাহিত্যিক অলৌকিকতা</b></p><p>আল-কুরআনের অন্যতম প্রধান ই‘জায হলো এর ভাষাগত সৌন্দর্য, বাগ্মিতা, শব্দচয়ন এবং বাক্যবিন্যাসের অনন্যতা। আরবরা প্রাচীনকাল থেকেই কবিতা, বক্তৃতা ও সাহিত্যচর্চায় বিশেষ পারদর্শী ছিল। কিন্তু কুরআনের ভাষাশৈলী তাদের প্রচলিত কবিতা ও গদ্যের কোনো শ্রেণিতে সীমাবদ্ধ নয়। এর শব্দ, বাক্য, ধ্বনি ও অর্থের গভীরতা এক অনন্য বৈশিষ্ট্য বহন করে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">وَإِنْ كُنْتُمْ فِي رَيْبٍ مِمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا بِسُورَةٍ مِنْ مِثْلِهِ</div><div class=\"tr\">“আমি আমার বান্দার প্রতি যা নাজিল করেছি, সে সম্পর্কে যদি তোমাদের সন্দেহ থাকে, তবে এর অনুরূপ একটি সূরা নিয়ে এসো।”</div><div class=\"rf\">—সূরা আল-বাকারা: ২৩-এর অংশ</div></div><p>এই আয়াত কুরআনের অনন্য ভাষাশৈলী ও সাহিত্যিক বৈশিষ্ট্যের প্রতি চ্যালেঞ্জ প্রদান করে।</p><p><b>২. কুরআনের বিষয়বস্তুর গভীরতা ও সামঞ্জস্য</b></p><p>আল-কুরআন প্রায় তেইশ বছর ধরে বিভিন্ন পরিস্থিতিতে অবতীর্ণ হয়েছে। তবুও এর মূল বিশ্বাস, নৈতিক শিক্ষা, বিধান ও সামগ্রিক বক্তব্যের মধ্যে সুস্পষ্ট সামঞ্জস্য রয়েছে। বিভিন্ন সময়ে নাজিল হওয়া সত্ত্বেও এর মূল বক্তব্যে কোনো প্রকৃত বিরোধ নেই।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ وَلَوْ كَانَ مِنْ عِنْدِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا</div><div class=\"tr\">“তারা কি কুরআন নিয়ে চিন্তা-ভাবনা করে না? যদি এটি আল্লাহ ছাড়া অন্য কারও পক্ষ থেকে হতো, তবে তারা এতে অনেক অসংগতি পেত।”</div><div class=\"rf\">—সূরা আন-নিসা: ৮২</div></div><p>এ আয়াত কুরআনের বক্তব্যের সামঞ্জস্য ও এর উৎস সম্পর্কে চিন্তা-ভাবনা করার আহ্বান জানায়।</p><p><b>৩. অতীতের ঘটনা ও পূর্ববর্তী জাতির সংবাদ</b></p><p>আল-কুরআনে পূর্ববর্তী নবী-রাসুল ও জাতিসমূহের বহু ঘটনা বর্ণিত হয়েছে। হযরত নূহ (আ.), হযরত ইবরাহিম (আ.), হযরত মূসা (আ.) ও হযরত ইউসুফ (আ.)-এর ঘটনাবলি থেকে ঈমান, ধৈর্য, নৈতিকতা ও আল্লাহর আনুগত্যের শিক্ষা দেওয়া হয়েছে। এসব ঘটনা কেবল ইতিহাস বর্ণনার জন্য নয়; বরং মানুষের হিদায়াত ও শিক্ষা গ্রহণের জন্য উপস্থাপিত হয়েছে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">تِلْكَ مِنْ أَنْبَاءِ الْغَيْبِ نُوحِيهَا إِلَيْكَ</div><div class=\"tr\">“এগুলো অদৃশ্য জগতের সংবাদ, যা আমি আপনার কাছে ওহির মাধ্যমে প্রকাশ করছি।”</div><div class=\"rf\">—সূরা আলে ইমরান: ৪৪-এর অংশ</div></div><p>এ আয়াত কুরআনে বর্ণিত অতীতের ঘটনাবলির ওহিভিত্তিক উৎসের প্রতি দৃষ্টি আকর্ষণ করে।</p><p><b>৪. ভবিষ্যৎ-সম্পর্কিত সংবাদ</b></p><p>আল-কুরআনে এমন কিছু ভবিষ্যৎ-সম্পর্কিত সংবাদ রয়েছে, যেগুলো পরবর্তী সময়ে বাস্তবায়িত হয়েছে। এর উল্লেখযোগ্য উদাহরণ হলো রোমানদের পরাজয়ের পর কয়েক বছরের মধ্যে তাদের বিজয়ের সংবাদ।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">غُلِبَتِ الرُّومُ ۝ فِي أَدْنَى الْأَرْضِ ۝ وَهُمْ مِنْ بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ ۝ فِي بِضْعِ سِنِينَ</div><div class=\"tr\">“রোমানরা পরাজিত হয়েছে নিকটবর্তী অঞ্চলে। কিন্তু তারা তাদের পরাজয়ের পর অচিরেই বিজয়ী হবে—কয়েক বছরের মধ্যে।”</div><div class=\"rf\">—সূরা আর-রূম: ২–৪</div></div><p>এ আয়াতে রোমানদের ভবিষ্যৎ বিজয়ের সংবাদ দেওয়া হয়েছে। ইসলামী তাফসিরে এটিকে কুরআনের ভবিষ্যৎ-সংবাদসংক্রান্ত ই‘জাযের একটি উল্লেখযোগ্য উদাহরণ হিসেবে আলোচনা করা হয়।</p><p><b>৫. শরিয়তের বিধান ও মানবজীবনের পূর্ণাঙ্গ দিকনির্দেশনা</b></p><p>আল-কুরআনে আকিদা, ইবাদত, নৈতিকতা, পরিবার, উত্তরাধিকার, ব্যবসা-বাণিজ্য, বিচারব্যবস্থা ও সামাজিক সম্পর্কের মতো মানবজীবনের গুরুত্বপূর্ণ বিষয় সম্পর্কে নির্দেশনা রয়েছে। এসব বিধান মানুষের ব্যক্তিগত ও সামাজিক জীবনকে ন্যায়, ভারসাম্য ও নৈতিকতার ভিত্তিতে পরিচালিত করতে সাহায্য করে।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ</div><div class=\"tr\">“নিশ্চয়ই এই কুরআন এমন পথের নির্দেশনা দেয়, যা সর্বাধিক সঠিক।”</div><div class=\"rf\">—সূরা আল-ইসরা: ৯-এর অংশ</div></div><p>কুরআনের বিধান ও শিক্ষার ব্যাপকতা এবং মানুষের জন্য হিদায়াত প্রদানের ক্ষমতা এর গুরুত্বপূর্ণ বৈশিষ্ট্য।</p><p><b>৬. মানুষের হৃদয় ও আচরণের ওপর প্রভাব</b></p><p>আল-কুরআনের তিলাওয়াত ও শিক্ষা মানুষের অন্তরে গভীর প্রভাব সৃষ্টি করে। এর উপদেশ মানুষকে আল্লাহর প্রতি অনুগত হতে, অন্যায় থেকে বিরত থাকতে এবং নৈতিক জীবন গড়তে উদ্বুদ্ধ করে। কুরআন শুধু জ্ঞান প্রদান করে না; বরং আত্মশুদ্ধি, নৈতিক উন্নতি ও চরিত্র গঠনের দিকনির্দেশনাও দেয়।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">اللَّهُ نَزَّلَ أَحْسَنَ الْحَدِيثِ كِتَابًا مُتَشَابِهًا مَثَانِيَ تَقْشَعِرُّ مِنْهُ جُلُودُ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ</div><div class=\"tr\">“আল্লাহ সর্বোত্তম বাণী নাজিল করেছেন—এমন একটি কিতাব, যার বিষয়বস্তু সামঞ্জস্যপূর্ণ ও বারবার পঠিত হয়। যারা তাদের রবকে ভয় করে, এর কারণে তাদের শরীরের লোম শিউরে ওঠে।”</div><div class=\"rf\">—সূরা আয-যুমার: ২৩-এর অংশ</div></div><p>এ আয়াত কুরআনের আধ্যাত্মিক প্রভাব ও মানুষের হৃদয়ে এর গভীর প্রতিক্রিয়ার কথা তুলে ধরে।</p><p><b>৭. কুরআনের সংরক্ষণ ও অবিকৃত থাকা</b></p><p>আল-কুরআনের আরেকটি গুরুত্বপূর্ণ বৈশিষ্ট্য হলো এর সংরক্ষণ। রাসুলুল্লাহ (সা.)-এর যুগ থেকে মুসলমানরা কুরআন মুখস্থ, লিখিতভাবে সংরক্ষণ এবং ধারাবাহিকভাবে পাঠ করে আসছেন। মুসলিম উম্মাহর মধ্যে কুরআনের পাঠ ও সংরক্ষণের অবিচ্ছিন্ন ধারাবাহিকতা এর বিশেষ বৈশিষ্ট্য।</p><p>আল্লাহ তাআলা বলেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ</div><div class=\"tr\">“নিশ্চয়ই আমিই এ উপদেশবাণী নাজিল করেছি এবং আমিই এর সংরক্ষক।”</div><div class=\"rf\">—সূরা আল-হিজর: ৯</div></div><p>এই আয়াত কুরআনের সংরক্ষণ সম্পর্কে আল্লাহ তাআলার প্রতিশ্রুতি প্রকাশ করে।</p><div class=\"h\">হাদিসের আলোকে কুরআনের বিশেষ মর্যাদা:</div><p>রাসুলুল্লাহ (সা.) বলেছেন—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">مَا مِنَ الْأَنْبِيَاءِ نَبِيٌّ إِلَّا أُعْطِيَ مِنَ الْآيَاتِ مَا مِثْلُهُ آمَنَ عَلَيْهِ الْبَشَرُ، وَإِنَّمَا كَانَ الَّذِي أُوتِيتُهُ وَحْيًا أَوْحَاهُ اللَّهُ إِلَيَّ</div><div class=\"tr\">“প্রত্যেক নবীকে এমন নিদর্শন দেওয়া হয়েছে, যার কারণে মানুষ তাঁর প্রতি ঈমান এনেছে। আর আমাকে যা দেওয়া হয়েছে, তা হলো ওহি, যা আল্লাহ আমার প্রতি নাজিল করেছেন।”</div><div class=\"rf\">—সহিহ আল-বুখারি, হাদিস: ৪৯৮১; সহিহ মুসলিম, হাদিস: ১৫২</div></div><p>এই হাদিসে কুরআনের বিশেষ মর্যাদা এবং রাসুলুল্লাহ (সা.)-এর নবুওয়াতের প্রধান মু‘জিযা হিসেবে ওহির গুরুত্ব প্রকাশ পেয়েছে।</p><div class=\"h\">উপসংহার:</div><p>পরিশেষে বলা যায়, আল-কুরআনের আভিধানিক অর্থ পাঠ বা তিলাওয়াত এবং পারিভাষিক অর্থে এটি মহান আল্লাহর অবতীর্ণ কালাম, যা হযরত মুহাম্মদ (সা.)-এর ওপর নাজিল হয়েছে। এর ই‘জাযের প্রধান দিকগুলো হলো ভাষাগত সৌন্দর্য, বিষয়বস্তুর সামঞ্জস্য, অতীত ও ভবিষ্যৎ-সম্পর্কিত সংবাদ, পূর্ণাঙ্গ জীবনবিধান, হৃদয়ের ওপর প্রভাব এবং অবিকৃত সংরক্ষণ। এসব বৈশিষ্ট্য কুরআনের অনন্য মর্যাদা ও ঐশী উৎসের প্রমাণ হিসেবে বিবেচিত। তাই মুসলমানদের কর্তব্য হলো কুরআন পাঠ করা, এর অর্থ বোঝা, শিক্ষা অনুসরণ করা এবং জীবনের প্রতিটি ক্ষেত্রে এর হিদায়াত গ্রহণ করা।</p>"],["<span class=\"aq\" dir=\"rtl\" lang=\"ar\">تَكَلَّمْ عَنْ تَسْمِيَةِ سُورَةِ فُصِّلَتْ وَمَوْضُوعِهَا بِالتَّفْصِيلِ.</span>সূরা ফুসসিলাতের নামকরণ ও বিষয়বস্তু বিস্তারিত আলোচনা করো।","<div class=\"h\">ভূমিকা:</div><p>সূরা ফুসসিলাত পবিত্র কুরআনের ৪১তম সূরা। এটি মক্কায় অবতীর্ণ একটি গুরুত্বপূর্ণ সূরা। এ সূরায় আল-কুরআনের সত্যতা, আল্লাহর একত্ববাদ, নবুওয়াত, আখিরাত, পূর্ববর্তী অবাধ্য জাতিগুলোর পরিণতি এবং ঈমানদারদের উত্তম চরিত্র সম্পর্কে আলোচনা করা হয়েছে। এ সূরার মাধ্যমে মানুষকে কুরআনের বাণী গ্রহণ, আল্লাহর নিদর্শন নিয়ে চিন্তা এবং সত্যের পথে অবিচল থাকার আহ্বান জানানো হয়েছে।</p><div class=\"h\">সূরা ফুসসিলাতের পরিচয়:</div><p>সূরা ফুসসিলাতের আরবি নাম হলো سورة فصلت। এটি পবিত্র কুরআনের ৪১তম সূরা এবং এতে মোট ৫৪টি আয়াত রয়েছে। অধিকাংশ তাফসিরবিদের মতে, এটি মক্কায় অবতীর্ণ সূরা। এর প্রধান আলোচ্য বিষয় হলো আল্লাহর একত্ববাদ, কুরআনের সত্যতা, পুনরুত্থান এবং সত্য অস্বীকারকারীদের পরিণতি।</p><div class=\"h\">সূরা ফুসসিলাতের নামকরণ:</div><p><b>১. ‘ফুসসিলাত’ নামের আভিধানিক অর্থ</b></p><p>فُصِّلَتْ শব্দটি فَصَّلَ ধাতু থেকে এসেছে। এর অর্থ হলো বিস্তারিতভাবে বর্ণনা করা, সুস্পষ্টভাবে ব্যাখ্যা করা কিংবা পৃথক পৃথকভাবে বিবৃত করা।</p><p>অতএব, ‘ফুসসিলাত’ শব্দের অর্থ হলো—বিস্তারিতভাবে ব্যাখ্যা করা হয়েছে বা সুস্পষ্টভাবে বর্ণনা করা হয়েছে।</p><p><b>২. নামকরণের কারণ</b></p><p>এ সূরার তৃতীয় আয়াতে কুরআনের পরিচয় দিতে গিয়ে বলা হয়েছে—</p><div class=\"ay\"><div class=\"ar\" dir=\"rtl\" lang=\"ar\">كِتَابٌ فُصِّلَتْ آيَاتُهُ قُرْآنًا عَرَبِيًّا لِقَوْمٍ يَعْلَمُونَ</div><div class=\"tr\">“এটি এমন এক কিতাব, যার আয়াতগুলো বিস্তারিতভাবে বর্ণনা করা হয়েছে—আরবি কুরআন হিসেবে, সেই সম্প্রদায়ের জন্য যারা জানে।”</div><div class=\"rf\">—সূরা ফুসসিলাত: ৩</div></div><p>এ আয়াতে فُصِّلَتْ آيَاتُهُ অর্থাৎ ‘যার আয়াতগুলো বিস্তারিতভাবে বর্ণনা করা হয়েছে’—এ বাক্যাংশ থেকে সূরাটির নাম ‘ফুসসিলাত’ রাখা হয়েছে। কুরআনের বিষয়বস্তু, নির্দেশনা ও নিদর্শনগুলো সুস্পষ্টভাবে বর্ণিত হওয়ার বিষয়টি এ নামের মাধ্যমে প্রকাশ পেয়েছে।</p><p><b>৩. সূরাটির অন্য নাম</b></p><p>সূরা ফুসসিলাতকে حم السجدة (হা-মীম আস-সাজদাহ) নামেও অভিহিত করা হয়। কারণ, সূরাটি ‘হা-মীম’ দ্বারা শুরু হয়েছে এবং এতে একটি সিজদার আয়াত রয়েছে। এ নামটি সূরাটিকে একইভাবে ‘হা-মীম’ দিয়ে শুরু হওয়া অন্যান্য সূরা থেকে পৃথক করে চেনাতে সহায়তা করে।</p><div class=\"h\">সূরা ফুসসিলাতের বিষয়বস্তু:</div><p><b>১. আল-কুরআনের সত্যতা ও বৈশিষ্ট্য</b></p><p>সূরার শুরুতেই আল-কুরআনের মর্যাদা ও বৈশিষ্ট্য তুলে ধরা হয়েছে। কুরআন মহান আল্লাহর পক্ষ থেকে অবতীর্ণ কিতাব। এতে মানুষের হিদায়াতের জন্য বিভিন্ন
